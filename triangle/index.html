<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三角定規パズル</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef2;--grid:#c9d4dc;--ink:#1d2b36;--sub:#5a6b78;--card:#f8fafb;--line:#a9b8c4;--ok:#2f8f6b;--a30:#e9a23b;--a45:#3fa59c;--a60:#5f86dc;--a90:#d4607a;--acc:#1d2b36;--onacc:#f8fafb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16212a;--grid:#23323d;--ink:#e6eef3;--sub:#93a5b2;--card:#1d2b36;--line:#3a4d5b;--ok:#4cc79a;--acc:#e6eef3;--onacc:#16212a}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:44px 18px 40px}
h1{font-size:34px;font-weight:900;margin:0;letter-spacing:.04em}
h2{font-size:20px;margin:0 0 4px}
p{margin:0 0 10px;color:var(--sub);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--a60);outline-offset:2px}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:6px;padding:12px 22px;font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.counter{font-size:64px;font-weight:900;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.stagebtn{width:44px;height:44px;border-radius:6px;border:2px solid var(--line);background:var(--card);font-weight:700}
.stagebtn.done{border-color:var(--ok);color:var(--ok)}
.chip{min-width:64px;height:48px;border-radius:6px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:17px}
.chip.on{color:#fff;border-color:transparent}
.msg{min-height:26px;font-weight:700;margin:8px 0}
.msg.ok{color:var(--ok)}
svg{display:block;width:100%;height:auto;max-height:270px}
.pn{width:62px;border:2px solid var(--line);background:var(--card);border-radius:6px;padding:2px;position:relative}
.pn.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.pn svg{max-height:56px}
.lock{position:absolute;right:2px;top:0;font-size:12px}
.pn.good{border-color:var(--ok)}
.pn.bad{border-style:dashed}
.card.win{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}
.tabs{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.center{text-align:center}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;transition:transform .08s,box-shadow .15s,background .15s,border-color .15s}
button:active{transform:translateY(2px) scale(.96)}
.btn{box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn:active{box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.ghost{box-shadow:none}
.chip.on{animation:pop .2s}
@keyframes pop{50%{transform:scale(1.14)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
main>*{animation:rise .28s ease both}
.card.win{animation:glow .5s}
.snap{animation:snap .3s}
@keyframes snap{40%{transform:scale(1.035)}}
.counter.bump{animation:pop .2s}
.counter.full{color:var(--ok);text-shadow:0 0 18px var(--ok)}
@keyframes glow{40%{box-shadow:0 0 0 8px var(--ok)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{--bg:#eef1f4;--grid:#e3e8ec;--card:#fff;--line:#d6dde3;--sub:#64727e;--ink:#17222b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171d;--grid:#16212a;--card:#17222b;--line:#2a3a46;--sub:#8a9ba8;--ink:#e8eff3}}
body{background-image:radial-gradient(ellipse at 50% -10%,var(--card),transparent 62%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;font-feature-settings:"palt";line-height:1.7}
main{padding-top:56px}
h1{font-size:30px;font-weight:700;letter-spacing:.14em}
h2{font-size:17px;font-weight:700;letter-spacing:.04em}
.tabs strong{font-size:13px;font-weight:500;color:var(--sub);letter-spacing:.1em}
.card{border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 1px 2px rgba(20,35,50,.06),0 18px 36px -18px rgba(20,35,50,.28)}
.card.win{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok),0 18px 36px -16px rgba(47,143,107,.55)}
.btn{border-radius:12px;padding:13px 24px;font-weight:700;letter-spacing:.06em;box-shadow:none}
.btn:active{box-shadow:none}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.stagebtn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);font-weight:500;font-variant-numeric:tabular-nums}
.stagebtn.done{background:var(--ok);color:#fff;border-color:transparent}
.chip{height:52px;border-radius:14px;border:1px solid var(--line);font-weight:500;letter-spacing:.02em}
.chip.on{border:0;box-shadow:0 8px 16px -8px rgba(0,0,0,.45)}
.chip svg{width:22px;height:22px;display:inline-block;vertical-align:middle;margin-right:4px}
.counter{font-weight:300;font-size:68px;letter-spacing:-.01em}
.msg{font-weight:500}
.pn{width:60px;border-radius:14px;border:1px solid var(--line);padding:4px}
.pn.sel{border-color:transparent;box-shadow:0 0 0 2px var(--acc)}
.lock{color:var(--sub);right:5px;top:4px}
.lock svg{width:12px;height:12px;display:block}
button svg.ic{width:18px;height:18px;display:block}
#snd{border-radius:12px}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px;font-weight:500}
#board{max-height:none;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
:root:not([data-theme="light"]),:root{--bg:#0b1016;--card:#121a22;--line:#26323d;--ink:#fff;--sub:rgba(255,255,255,.68);--ok:#5fd6a8;--acc:#3b6cf0;--onacc:#fff;--a30:#f0b04a;--a45:#45b8ae;--a60:#6f95ee;--a90:#e46a86}
body{background-image:none;background-color:var(--bg);color:#fff}
.card{background:var(--card);box-shadow:none}
.card.win{box-shadow:0 0 0 2px var(--ok)}
.btn.ghost,.stagebtn{background:transparent;color:#fff}
.stagebtn.done{background:var(--ok);color:#0b1016}
#snd{background:transparent}
h1{font-weight:500;letter-spacing:.18em}
.counter{font-weight:200}
</style>
</head>
<body>
<main id="app"></main>
<script>
var COL={30:'var(--a30)',45:'var(--a45)',60:'var(--a60)',90:'var(--a90)'};
var app=document.getElementById('app');
var raf=0;
var progress={m1:[],m2:[],m3:[]};
try{var sv=JSON.parse(localStorage.getItem('sankaku2')||'null');if(sv)progress=sv}catch(e){}

function wedge(cx,cy,r,a0,a1,fill,op,extra){
  var s=a0-90,e=a1-90,rad=Math.PI/180;
  var x0=cx+r*Math.cos(s*rad),y0=cy+r*Math.sin(s*rad),x1=cx+r*Math.cos(e*rad),y1=cy+r*Math.sin(e*rad);
  var lg=Math.abs(a1-a0)>180?1:0,sw=a1>=a0?1:0;
  return '<path d="M'+cx+' '+cy+'L'+x0.toFixed(1)+' '+y0.toFixed(1)+'A'+r+' '+r+' 0 '+lg+' '+sw+' '+x1.toFixed(1)+' '+y1.toFixed(1)+'Z" fill="'+fill+'" fill-opacity="'+op+'" stroke="var(--card)" stroke-width="1.5" stroke-linejoin="round" '+(extra||'')+'/>';
}
function ray(cx,cy,r,a,dash,col,w){
  var rad=Math.PI/180,t=a-90;
  return '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r*Math.cos(t*rad)).toFixed(1)+'" y2="'+(cy+r*Math.sin(t*rad)).toFixed(1)+'" stroke="'+(col||'var(--ink)')+'" stroke-width="'+(w||1.5)+'" '+(dash?'stroke-dasharray="5 4"':'')+'/>';
}
function rim(cx,cy,R){
  var s='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="1.5"/>';
  for(var a=0;a<360;a+=30){var rad=(a-90)*Math.PI/180;
    s+='<line x1="'+(cx+R*Math.cos(rad))+'" y1="'+(cy+R*Math.sin(rad))+'" x2="'+(cx+(R+8)*Math.cos(rad))+'" y2="'+(cy+(R+8)*Math.sin(rad))+'" stroke="var(--sub)" stroke-width="1"/>';}
  return s;
}
function stop(){cancelAnimationFrame(raf);raf=0}

/* ---------- タイトル ---------- */
function title(){
  stop();
  app.innerHTML='<div class="center" style="padding-top:20px"><h1>三角定規パズル</h1><p>三角定規の角を、辺でつないで確かめる</p></div>'+
  '<svg id="tsv" viewBox="0 0 260 260" role="img" aria-label="三角定規の角が順に足されて390度になるアニメーション"></svg>'+
  '<div class="counter" id="cnt">0°</div><p class="center" id="note" style="min-height:22px"></p>'+
  '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="go">はじめる</button></div>';
  var gb=document.getElementById('go');gb.onclick=progress.tut?menu:tutorial;if(progress.m1.concat(progress.m2,progress.m3).some(Boolean))gb.textContent='つづきから';
  var seq=[90,60,45,30,90,45,30],T=800,P=220,total=seq.length*(T+P)+3200,t0=performance.now();
  var starts=[],s=0;seq.forEach(function(a){starts.push(s);s+=a});
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now){
    var el=reduce?total-1000:(now-t0)%total,svg=document.getElementById('tsv');
    if(!svg){return}
    var out=rim(130,130,108),sum=0,note='';
    seq.forEach(function(a,i){
      var p=Math.max(0,Math.min(1,(el-i*(T+P))/T));
      if(p<=0)return;
      var R=108-18*Math.floor(starts[i]/360);
      out+=wedge(130,130,R,starts[i],starts[i]+a*p,COL[a],0.8);
      sum+=a*p;
      if(p>0&&p<1)note='+'+a+'°';
    });
    var n=Math.round(sum);
    if(n>=360&&n<390)note='一周（360°）をこえていく…';
    if(n>=390)note='45°・30°・60°・90°で、390°。';
    if(n>=390){var q=(el%1200)/1200;out+='<circle cx="130" cy="130" r="'+(110+q*16)+'" fill="none" stroke="var(--ok)" stroke-width="2" stroke-opacity="'+(1-q).toFixed(2)+'"/>'}
    out+=ray(130,130,118,0,true,'var(--sub)',1);
    svg.innerHTML=out;
    document.getElementById('cnt').textContent=n+'°';document.getElementById('cnt').classList.toggle('full',n>=390);
    document.getElementById('note').textContent=note;
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
}

/* ---------- 三角定規（実物の規格） ---------- */
var R3=Math.sqrt(3),U=58,D2R=Math.PI/180;
var TY={A:{v:[[0,0],[1,0],[0,1]],ang:[90,45,45],col:'var(--a45)'},B:{v:[[0,0],[R3,0],[0,1]],ang:[90,30,60],col:'var(--a30)'}};
function nrm(a){return ((a%360)+360)%360}
function eq(a,b){return Math.abs(((a-b)%360+540)%360-180)<1.5}
function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1])}
function u(a){return [Math.cos(a*D2R),Math.sin(a*D2R)]}
function verts(p){var T=TY[p.type],c=Math.cos(p.rot*D2R),s=Math.sin(p.rot*D2R),f=p.flip?-1:1;return T.v.map(function(q){var kk=p.k||1,x=q[0]*U*kk*f,y=q[1]*U*kk;return [p.x+x*c-y*s,p.y+x*s+y*c]})}
function dir(a,b){return nrm(Math.atan2(b[1]-a[1],b[0]-a[0])/D2R)}
function sector(p,i){var vs=verts(p),a=vs[i],d1=dir(a,vs[(i+1)%3]),d2=dir(a,vs[(i+2)%3]),g=TY[p.type].ang[i];return {s:Math.abs(nrm(d2-d1)-g)<1.5?d1:d2,a:g,p:p,pt:a}}
function place(type,vi,V,start,flip,k){var p={type:type,x:0,y:0,rot:0,flip:!!flip,k:k||1},sc=sector(p,vi);p.rot=nrm(start-sc.s);var v=verts(p)[vi];p.x=V[0]-v[0];p.y=V[1]-v[1];return p}
function chain(L){var n=L.length;function go(cur,used,cnt){if(cnt===n)return true;for(var k=0;k<n;k++){if(used[k])continue;if(eq(L[k].s,cur.s+cur.a)){used[k]=1;if(go(L[k],used,cnt+1))return true;used[k]=0}}return false}
  for(var i=0;i<n;i++){var us=[];us[i]=1;if(go(L[i],us,1))return true}return false}
function clusters(P){var all=[],used=[],out=[];P.forEach(function(p){verts(p).forEach(function(q,i){all.push({q:q,i:i,p:p})})});
  all.forEach(function(a,k){if(used[k])return;used[k]=1;var g=[a];all.forEach(function(b,m){if(!used[m]&&b.p!==a.p&&dist(a.q,b.q)<7){used[m]=1;g.push(b)}});if(g.length>1)out.push({c:a.q,L:g.map(function(x){return sector(x.p,x.i)})})});return out}
function nearV(P,V){var o=[];P.forEach(function(p){verts(p).forEach(function(q,i){if(dist(q,V)<7)o.push(sector(p,i))})});return o}
function solvedAt(P,V,st){var L=nearV(P,V);
  if(st.k==='sum'){if(L.length<2||!L.some(function(x){return x.p.fixed}))return false;var t=0;L.forEach(function(x){t+=x.a});return t===st.t&&chain(L)}
  if(st.k==='diff'){if(L.length!==2)return false;return eq(L[0].s,L[1].s)&&Math.abs(L[0].a-L[1].a)===st.t}return false}
function clText(L){var tot=0;L.forEach(function(x){tot+=x.a});
  if(L.length===2&&eq(L[0].s,L[1].s)){var a=L[0].a,b=L[1].a;return a===b?'ぴったり重なり':'差 '+Math.abs(a-b)+'°（'+Math.max(a,b)+'°−'+Math.min(a,b)+'°）'}
  var m=tot===90?' 直角':tot===180?' 一直線':tot===360?' 一周':'';return chain(L)?'合計 '+tot+'°'+m:'合計 '+tot+'°（辺がずれ）'}
function arcP(c,r,s,a){var p0=u(s),p1=u(s+a);return 'M'+(c[0]+r*p0[0]).toFixed(1)+' '+(c[1]+r*p0[1]).toFixed(1)+'A'+r+' '+r+' 0 '+(a>180?1:0)+' 1 '+(c[0]+r*p1[0]).toFixed(1)+' '+(c[1]+r*p1[1]).toFixed(1)}
function drawPiece(p,sel,only){var T=TY[p.type],vs=verts(p),g=[(vs[0][0]+vs[1][0]+vs[2][0])/3,(vs[0][1]+vs[1][1]+vs[2][1])/3];
  var f=function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)};
  var o='<polygon points="'+vs.map(f).join(' ')+'" fill="'+T.col+'" fill-opacity=".5" stroke="var(--ink)" stroke-width="'+(sel?2.8:1.4)+'" stroke-linejoin="round"/>';
  o+='<polygon points="'+vs.map(function(q){return f([g[0]+(q[0]-g[0])*0.38,g[1]+(q[1]-g[1])*0.38])}).join(' ')+'" fill="var(--card)" fill-opacity=".75" stroke="var(--ink)" stroke-opacity=".35"/>';
  for(var i=0;i<3;i++){if(only!==undefined&&i!==only)continue;var sc=sector(p,i),c=vs[i];
    if(sc.a===90){var a=u(sc.s),b=u(sc.s+90);o+='<path d="M'+(c[0]+12*a[0]).toFixed(1)+' '+(c[1]+12*a[1]).toFixed(1)+'l'+(12*b[0]).toFixed(1)+' '+(12*b[1]).toFixed(1)+'l'+(-12*a[0]).toFixed(1)+' '+(-12*a[1]).toFixed(1)+'" fill="none" stroke="var(--ink)" stroke-width="1.2"/>'}
    else o+='<path d="'+arcP(c,14,sc.s,sc.a)+'" fill="none" stroke="var(--ink)" stroke-width="1.2"/>';
    var m=u(sc.s+sc.a/2);o+='<text x="'+(c[0]+27*m[0]).toFixed(1)+'" y="'+(c[1]+27*m[1]).toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="var(--ink)" stroke="var(--card)" stroke-width="3" style="paint-order:stroke">'+sc.a+'°</text>'}
  return o}
function scene(P,o){o=o||{};var s='';
  if(o.tray)s+='<line x1="12" y1="334" x2="348" y2="334" stroke="var(--line)" stroke-dasharray="4 4"/><text x="14" y="348" font-size="10" fill="var(--sub)">三角定規</text>';
  if(o.V)s+='<circle cx="'+o.V[0]+'" cy="'+o.V[1]+'" r="'+(o.ok?10:7)+'" fill="none" stroke="'+(o.ok?'var(--ok)':'var(--sub)')+'" stroke-width="2.2"/>';
  P.forEach(function(p){s+=drawPiece(p,p.id===o.sel)});
  for(var i=0;i<P.length;i++)for(var j=i+1;j<P.length;j++){var A=verts(P[i]),B=verts(P[j]);
    for(var a=0;a<3;a++)for(var b=0;b<3;b++){var a0=A[a],a1=A[(a+1)%3],b0=B[b],b1=B[(b+1)%3];
      if((dist(a0,b0)<5&&dist(a1,b1)<5)||(dist(a0,b1)<5&&dist(a1,b0)<5))s+='<line x1="'+a0[0].toFixed(1)+'" y1="'+a0[1].toFixed(1)+'" x2="'+a1[0].toFixed(1)+'" y2="'+a1[1].toFixed(1)+'" stroke="var(--ok)" stroke-width="4" stroke-linecap="round"/>'}}
  clusters(P).forEach(function(c){var t=clText(c.L),w=t.length*11+18,vx=0,vy=0;c.L.forEach(function(z){var m=u(z.s+z.a/2);vx+=m[0];vy+=m[1]});var vl=Math.hypot(vx,vy);if(vl<0.3){vx=0;vy=-1;vl=1}var x=Math.min(Math.max(c.c[0]-vx/vl*44,w/2+4),356-w/2),y=Math.min(Math.max(c.c[1]-vy/vl*34-11,6),496);
    s+='<rect x="'+(x-w/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w+'" height="22" rx="11" fill="var(--card)" stroke="var(--line)"/><text x="'+x.toFixed(1)+'" y="'+(y+11).toFixed(1)+'" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="var(--ink)">'+t+'</text>'});
  return s}

/* ---------- タイトル（三角定規をぺたぺた並べて一周） ---------- */
function title(){stop();
  var C=[150,150],SEQ=[['A',0],['A',1],['A',2],['B',0],['B',2],['B',1]],pcs=[],tot=360;
  (function(){var best=null;
    for(var mi=0;mi<65&&!best;mi++){var mask=mi===0?34:mi-1,st=-90,k=1,res=[],first=0,prevEnd=0;
      for(var i=0;i<6;i++){var ty=SEQ[i][0],vi=SEQ[i][1],a=TY[ty].ang[vi],fl=!!((mask>>i)&1),p=place(ty,vi,C,st,fl,1),vs=verts(p),l1=dist(vs[vi],vs[(vi+1)%3]),l2=dist(vs[vi],vs[(vi+2)%3]),d1=dir(vs[vi],vs[(vi+1)%3]),sl,el;
        if(eq(d1,st)){sl=l1;el=l2}else{sl=l2;el=l1}
        if(i===0){k=1;first=sl}else{k=prevEnd/sl}
        res.push({t:ty,vi:vi,fl:fl,k:k,a:a,st:st});prevEnd=el*k;st+=a}
      if(Math.abs(prevEnd-first)<1e-6*first)best=res}
    best=best||SEQ.map(function(q,i){return {t:q[0],vi:q[1],fl:false,k:1,a:TY[q[0]].ang[q[1]],st:-90+[0,60,105,150,240,300][i]}});
    var mx=0;best.forEach(function(r){var p=place(r.t,r.vi,C,r.st,r.fl,r.k);verts(p).forEach(function(q){mx=Math.max(mx,dist(q,C))})});
    best.forEach(function(r){var p=place(r.t,r.vi,C,r.st,r.fl,r.k*118/mx);pcs.push({p:p,a:r.a,vi:r.vi,mid:r.st+r.a/2})})})();
  app.innerHTML='<div class="center" style="padding-top:12px"><h1>三角定規パズル</h1><p>三角定規の角を、辺でつないで確かめる</p></div>'+
   '<svg id="tsv" viewBox="0 0 300 300" role="img" aria-label="三角定規を順に並べて、一周（360度）にするアニメーション"></svg>'+
   '<div id="expr" class="center" style="font-size:20px;font-weight:500;min-height:32px"></div><p class="center" id="note" style="min-height:22px"></p>'+
