      const NC_FACE = { happy: 'smile', big: 'smile', idea: 'smile', music: 'smile', sad: 'cry', surprise: 'surprise', think: 'troubled', confused: 'troubled', sweat: 'troubled', angry: 'angry', shy: 'shy', sleepy: 'sleepy' };

      function ncEl() {
        return dom.characterSvg.querySelector('.nc');
      }

      function setFace(face) {
        const el = ncEl();
        if (el) el.dataset.face = face || 'normal';
      }

      // まばたき と おしゃべり（くちパク）
      function startNcLoops() {
        const blink = () => {
          const el = ncEl();
          if (el && state.phase !== 'setup' && !state.napping) {
            el.dataset.blink = '1';
            setTimeout(() => { el.dataset.blink = '0'; }, 140);
          }
          setTimeout(blink, 2200 + Math.random() * 3200);
        };
        setTimeout(blink, 1800);
        let open = false;
        setInterval(() => {
          const el = ncEl();
          if (!el) return;
          open = state.isSpeaking && el.dataset.face === 'normal' ? !open : false;
          el.dataset.talk = open ? '1' : '0';
        }, 190);
      }

      // ===== きもちエフェクト =====
      const FX_SVG = {
        heart: (c) => `<svg viewBox="0 0 24 24"><path fill="${c}" d="M12 21s-7.5-4.6-9.6-9.4C1 8.3 3 5 6.2 5c2 0 3.5 1.1 4.3 2.5h3C14.3 6.1 15.800 5 17.800 5 21 5 23 8.300 21.600 11.600 19.500 16.400 12 21 12 21z"/></svg>`,
        spark: (c) => `<svg viewBox="0 0 24 24"><path fill="${c}" d="M12 1.500c.9 5.200 2.300 8 5.500 9 .4.100.4.800 0 .9-3.200 1-4.600 3.800-5.500 9-.9-5.200-2.300-8-5.500-9-.4-.1-.4-.8 0-.9 3.200-1 4.600-3.800 5.500-9z"/></svg>`,
        drop: (c) => `<svg viewBox="0 0 24 24"><path fill="${c}" d="M12 2C9 7 5.500 10.800 5.500 14.800a6.500 6.500 0 0013 0C18.500 10.800 15 7 12 2z"/><ellipse cx="9.600" cy="15" rx="1.500" ry="2.300" fill="#fff" opacity=".6"/></svg>`,
        note: (c) => `<svg viewBox="0 0 24 24"><path fill="${c}" d="M9 3v12.2A3.500 3.500 0 1011 18V8l8-2v7.200A3.500 3.500 0 1021 16V2z"/></svg>`,
        bulb: () => `<svg viewBox="0 0 24 24"><path fill="#ffd54a" d="M12 2a7 7 0 00-4 12.700V17h8v-2.300A7 7 0 0012 2z"/><rect x="8.500" y="18" width="7" height="2.500" rx="1" fill="#b9b2cc"/><rect x="9.500" y="21" width="5" height="2" rx="1" fill="#b9b2cc"/></svg>`,
        anger: () => `<svg viewBox="0 0 24 24" fill="none" stroke="#ff5d7a" stroke-width="3" stroke-linecap="round"><path d="M4 9c3 0 5-2 5-5M20 9c-3 0-5-2-5-5M4 15c3 0 5 2 5 5M20 15c-3 0-5 2-5 5"/></svg>`,
        spiral: () => `<svg viewBox="0 0 24 24" fill="none" stroke="#8e72e0" stroke-width="2.500" stroke-linecap="round"><path d="M12 12c1-1 2.500 0 2 1.500s-3 2.500-4.500 1S9 9 12 8s6 1.500 6 5-3 7-7 7-8-3-8-8"/></svg>`,
        cloud: () => `<svg viewBox="0 0 48 30"><path fill="#b9b2cc" d="M12 26a8 8 0 01-1.500-15.900A10 10 0 0130 7.500a8.500 8.500 0 0110 .5 8.500 8.500 0 01-2 18z"/><path stroke="#8f86a8" stroke-width="2.500" stroke-linecap="round" d="M14 28v-1M24 29v-2M34 28v-1"/></svg>`,
      };
      const FX_PINK = '#ff8fb3', FX_LEMON = '#ffd54a', FX_BLUE = '#7cc8ff', FX_MINT = '#4fd1a5';

      function fxAdd(html, opt) {
        const el = document.createElement('div');
        el.className = 'fx ' + (opt.cls || '');
        const st = el.style;
        st.setProperty('--x', (opt.x || 0) + 'px');
        st.setProperty('--y', (opt.y || 0) + 'px');
        st.setProperty('--dx', (opt.dx || 0) + 'px');
        st.setProperty('--dy', (opt.dy === undefined ? -40 : opt.dy) + 'px');
        st.setProperty('--r', (opt.r || 0) + 'deg');
        st.setProperty('--d', (opt.d || 0) + 's');
        st.setProperty('--t', (opt.t || 1.6) + 's');
        st.setProperty('--s', (opt.s || 22) + 'px');
        el.innerHTML = html;
        dom.emoteFx.appendChild(el);
      }

      function showEmotion(kind) {
        const body = dom.characterEmote;
        body.className = '';
        dom.emoteFx.innerHTML = '';
        void body.offsetWidth; // アニメを やりなおす
        const rnd = (a, b) => a + Math.random() * (b - a);
        const topY = -22;
        let dur = 2.4;
        if (kind === 'happy' || kind === 'big') {
          body.classList.add('emo-hop');
          const n = kind === 'big' ? 9 : 5;
          for (let i = 0; i < n; i++) {
            const side = i % 2 ? 1 : -1;
            const isHeart = i % 3 !== 0;
            fxAdd((isHeart ? FX_SVG.heart : FX_SVG.spark)(isHeart ? FX_PINK : FX_LEMON), {
              x: side * rnd(26, 62), y: rnd(10, 70), dx: side * rnd(4, 18), dy: -rnd(30, 60),
              r: side * rnd(10, 30), d: i * 0.1, t: rnd(1.3, 1.9), s: rnd(22, 36),
            });
          }
          dur = 2.4;
        } else if (kind === 'sad') {
          body.classList.add('emo-droop');
          fxAdd(FX_SVG.cloud(), { cls: 'pop', x: 0, y: topY - 6, s: 62, t: 3 });
          [-34, -12, 14, 36].forEach((x, i) => {
            fxAdd(FX_SVG.drop(FX_BLUE), { cls: 'fall', x, y: 26 + (i % 2) * 8, dy: rnd(36, 52), d: 0.3 + i * 0.35, t: 1.2, s: 18 });
          });
          dur = 3.2;
        } else if (kind === 'surprise') {
          body.classList.add('emo-jump');
          fxAdd('<div class="mk a">！</div>', { cls: 'pop', x: 0, y: topY - 8, t: 1.6 });
          [-1, 1].forEach((side) => {
            fxAdd(FX_SVG.spark(FX_LEMON), { x: side * 48, y: 24, dx: side * 12, dy: -14, r: side * 20, t: 0.9, s: 24 });
          });
        } else if (kind === 'think') {
          body.classList.add('emo-sway');
          fxAdd('<div class="mk q">？</div>', { cls: 'pop', x: 8, y: topY - 8, t: 2.6 });
          dur = 3;
        } else if (kind === 'sleepy') {
          body.classList.add('emo-sleep');
          ['Z', 'z', 'z'].forEach((ch, i) => {
            fxAdd(`<div class="mk q" style="min-width:0;width:auto;height:auto;background:none;box-shadow:none;font-size:${22 - i * 4}px;margin:-10px 0 0 -6px">${ch}</div>`, {
              x: 30 + i * 12, y: 0 - i * 8, dx: 14, dy: -28, d: i * 0.5, t: 2, s: 20,
            });
          });
          dur = 3.6;
        } else if (kind === 'music') {
          body.classList.add('emo-groove');
          [-1, 1, -1, 1].forEach((side, i) => {
            fxAdd(FX_SVG.note(i % 2 ? FX_MINT : FX_PINK), { x: side * rnd(30, 56), y: rnd(0, 40), dx: side * 10, dy: -rnd(40, 60), r: side * 25, d: i * 0.28, t: 1.7, s: 24 });
          });
          dur = 2.4;
        } else if (kind === 'idea') {
          body.classList.add('emo-hop');
          fxAdd(FX_SVG.bulb(), { cls: 'pop', x: 0, y: topY - 10, s: 38, t: 1.8 });
          [-1, 1].forEach((side) => {
            fxAdd(FX_SVG.spark(FX_LEMON), { x: side * 26, y: topY - 4, dx: side * 22, dy: -12, r: side * 30, d: 0.15, t: 1, s: 20 });
          });
        } else if (kind === 'angry') {
          body.classList.add('emo-shake');
          fxAdd(FX_SVG.anger(), { cls: 'pop', x: 30, y: topY - 6, s: 36, t: 1.6 });
          fxAdd(FX_SVG.anger(), { cls: 'pop', x: -34, y: topY + 8, s: 24, t: 1.4, d: 0.2 });
          dur = 1.8;
        } else if (kind === 'shy') {
          body.classList.add('emo-shy');
          [-1, 1, 0].forEach((side, i) => {
            fxAdd(FX_SVG.heart(FX_PINK), { x: side * 40 + (side === 0 ? 4 : 0), y: side === 0 ? topY : 26, dx: side * 8, dy: -22, d: i * 0.2, t: 1.8, s: 18 });
          });
          fxAdd(FX_SVG.drop(FX_BLUE), { cls: 'fall', x: 44, y: -6, dy: 22, d: 0.4, t: 1.4, s: 14 });
          dur = 2.8;
        } else if (kind === 'sweat') {
          body.classList.add('emo-shy');
          fxAdd(FX_SVG.drop(FX_BLUE), { cls: 'fall', x: 42, y: -2, dy: 30, d: 0.1, t: 1.5, s: 18 });
          fxAdd(FX_SVG.drop(FX_BLUE), { cls: 'fall', x: 56, y: 10, dy: 26, d: 0.5, t: 1.4, s: 12 });
          dur = 2.2;
        } else if (kind === 'confused') {
          body.classList.add('emo-sway');
          fxAdd(FX_SVG.spiral(), { cls: 'pop', x: 0, y: topY - 6, s: 34, t: 2.6 });
          fxAdd('<div class="mk q">？</div>', { cls: 'pop', x: 40, y: topY + 10, t: 2.4, d: 0.3 });
          dur = 3;
        } else {
          return;
        }
        setFace(NC_FACE[kind]);
        clearTimeout(state.emoteTimer);
        state.emoteTimer = setTimeout(() => {
          body.className = '';
          dom.emoteFx.innerHTML = '';
          setFace(state.napping ? 'sleepy' : 'normal');
        }, dur * 1000 + 600);
      }

      // おはなしの しゅるいから、きもちを きめる
      function emotionFor(dialogue) {
        const c = dialogue.category || '';
        if (c === 'ネタぎれ') return 'sad';
        if (c === 'レベルアップ') return 'big';
        if (/ほめる|おぼえたこと|うんへのへんじ/.test(c)) return 'happy';
        if (/きづき/.test(c)) return 'idea';
        if (/おねだり/.test(c)) return 'shy';
        if (/いたずら/.test(c)) return 'sweat';
        if (/あそび/.test(c)) return 'music';
        if (/つっこみ/.test(c)) return 'angry';
        if (/むずかしい/.test(c)) return 'confused';
        if (/はんのう/.test(c)) return 'surprise';
        if (dialogue.question || /いいえへのへんじ|かんがえる|ぎもん|しつもん/.test(c)) return 'think';
        return null;
      }

      // しばらく なにも なければ、ふきだしを うすくして 背景の あかりを みせる
      function undimBubble() {
        clearTimeout(state.dimTimer);
        dom.speechBox.classList.remove('dim');
      }

      function armDim() {
        clearTimeout(state.dimTimer);
        if (state.phase !== 'talk' || state.hold || state.pending) return;
        state.dimTimer = setTimeout(() => {
          if (state.phase === 'talk' && !state.isSpeaking && !state.hold && !state.pending && !userIsBusy()) {
            dom.speechBox.classList.add('dim');
          }
        }, 7000);
      }

      function speakDialogue(dialogue) {
        undimBubble();
        clearChunkTimers();
        stopAutoTimers();
        releaseHold();
        const emo = emotionFor(dialogue);
        if (emo) showEmotion(emo);

        state.isSpeaking = true;
        state.currentSentences = dialogue.sentences;

        dom.speechCategoryTag.textContent = dialogue.category;
        dom.speechText.innerHTML = '';
        dom.statusText.textContent = 'おはなしちゅう…';
        dom.speechHintText.textContent = 'おすと ぜんぶ みえるよ';

        const indicator = document.createElement('span');
        indicator.className = 'speaking-indicator';
        indicator.setAttribute('aria-hidden', 'true');

        let cumulativeDelay = 60;

        dialogue.sentences.forEach((chunks, sIdx) => {
          const p = document.createElement('p');
          dom.speechText.appendChild(p);

          chunks.forEach((chunkText) => {
            const timerId = setTimeout(() => {
              const span = document.createElement('span');
              span.className = 'speech-chunk';
              span.textContent = chunkText;
              p.appendChild(span);
              p.appendChild(indicator);
            }, cumulativeDelay);
            state.chunkTimers.push(timerId);

            let pause = 230 + Math.min(chunkText.length * 32, 220);
            if (/[、]/.test(chunkText)) pause += 180;
            if (/[。！？]/.test(chunkText)) pause += 340;
            if (/……/.test(chunkText)) pause += 320;
            cumulativeDelay += pause;
          });
        });

        const endTimerId = setTimeout(() => {
          state.isSpeaking = false;
          if (indicator.parentNode) {
            indicator.parentNode.removeChild(indicator);
          }
          dom.statusText.textContent = state.autoPlayEnabled ? 'かんがえちゅう…' : 'おやすみちゅう';
          dom.speechHintText.textContent = 'おすと つぎへ すすむよ';
          scheduleNextAutoSpeech();
        }, cumulativeDelay + 120);

        state.chunkTimers.push(endTimerId);
      }

      function triggerNextSpeech(options = {}) {
        if (state.phase !== 'talk') return;
        let next = buildNextDialogue(options);
        if (!next && (options.preferredTypes || options.forceWord)) {
          next = buildNextDialogue({ forceWord: options.forceWord || null });
        }
        if (!next && options.forceWord) {
          next = buildNextDialogue({});
        }

        if (!next) {
          // はなせる ネタが もう ない
          state.exhausted = true;
          state.pending = null;
          const pair = pickRandomItem(NETAGIRE_LINES);
          speakDialogue({
            id: `netagire_${Date.now()}`,
            category: 'ネタぎれ',
            sentences: pair.map((l) => splitLineIntoChunks(l)),
          });
          return;
        }

        state.exhausted = false;
        state.pending = next.ask || next.assoc ? { kind: next.ask ? 'ask' : 'assoc', at: Date.now(), text: next.text } : null;
        speakDialogue(next);
        if (next.question) {
          startHold(next.yesNo);
        }
        if (next.ask) {
          showFeedback('しつもんの こたえは、したの ことばに ひらがな5もじまでで いれて おしえてね。', false);
        }
      }

      function stopAutoTimers() {
        if (state.autoTimerId) {
          clearTimeout(state.autoTimerId);
          state.autoTimerId = null;
        }
        if (state.progressIntervalId) {
          clearInterval(state.progressIntervalId);
          state.progressIntervalId = null;
        }
      }

      function scheduleNextAutoSpeech() {
        stopAutoTimers();
        armDim();

        if (state.phase !== 'talk' || !state.autoPlayEnabled || state.isSpeaking) {
          return;
        }
        if (state.hold) {
          // しつもんの へんじを まっている あいだは、つぎの話題へ すすまない
          dom.statusText.textContent = 'へんじを まってるよ';
          dom.speechHintText.textContent = 'ゆっくりで いいよ。「うん」「いいえ」や ことばで こたえてね';
          return;
        }
        if (state.exhausted) {
          // はなす ネタが ないあいだは、自分からは はなさない（ことばを おしえると また はなす）
          dom.statusText.textContent = 'ことばを まってるよ';
          return;
        }

        const duration = 5500 + Math.floor(Math.random() * 4000);
        state.nextSpeechDurationMs = duration;
        state.elapsedMs = 0;

        state.autoTimerId = setTimeout(() => {
          if (userIsBusy()) {
            scheduleNextAutoSpeech(); // もうすこし まつ
            return;
          }
          triggerNextSpeech();
        }, duration);
      }

      function toggleAutoPlay() {
        state.autoPlayEnabled = !state.autoPlayEnabled;
        if (state.autoPlayEnabled) {
          dom.btnToggleAuto.textContent = 'ひとりごと: ON';
          dom.btnToggleAuto.classList.remove('off');
          dom.statusDot.className = 'dot';
          if (!state.isSpeaking) {
            dom.statusText.textContent = 'かんがえちゅう…';
            scheduleNextAutoSpeech();
          }
        } else {
          dom.btnToggleAuto.textContent = 'ひとりごと: OFF';
          dom.btnToggleAuto.classList.add('off');
          dom.statusDot.className = 'dot off';
          if (!state.isSpeaking) {
            dom.statusText.textContent = 'おやすみちゅう';
          }
          stopAutoTimers();
          }
      }

      function normalizeHiraganaInput(raw) {
        return raw.trim().replace(/[\s\u3000]/g, '');
      }

      function isValidHiraganaWord(str) {
        return /^[ぁ-ゖー]{1,5}$/.test(str);
      }

      function showFeedback(message, isError = false) {
        dom.feedbackMessage.textContent = message;
        dom.feedbackMessage.className = isError ? 'err' : 'ok';
      }

      function updateCharCounter() {
        const val = normalizeHiraganaInput(dom.inputWord.value);
        dom.charCounter.textContent = `${val.length}/5`;
        dom.charCounter.className = val.length > 5 ? 'over' : '';
      }

      function teachWord(rawWord, genreId) {
        const cleanWord = normalizeHiraganaInput(rawWord);

        if (!cleanWord) {
          showFeedback('おしえる ことばを ひらがなで いれてね。', true);
          dom.inputWord.focus();
          return false;
        }

        if (cleanWord.length > 5) {
          showFeedback('5もじ までの ひらがなで おしえてね。', true);
          dom.inputWord.focus();
          return false;
        }

        if (!isValidHiraganaWord(cleanWord)) {
          showFeedback('ひらがな だけで おしえてね（かんじ や カタカナは まだ むずかしいの）。', true);
          dom.inputWord.focus();
          return false;
        }

        if (!isGenreUnlocked(genreId)) {
          const def = GENRE_DEFS.find((g) => g.id === genreId);
          showFeedback(`その グループは まだ ひらいてないよ（Lv.${def ? def.level : '?'} で ひらくよ）。`, true);
          return false;
        }

        const existing = state.words.find((w) => w.text === cleanWord);
        if (existing) {
          existing.genreId = genreId;
          existing.updatedAt = Date.now();
          saveWords();
          updateWordCountUI();
          consumePendingAnswer(cleanWord);
          if (!maybeSpeakLevelUp()) {
            triggerNextSpeech({
              preferredTypes: ['おぼえたこと'],
              forceWord: cleanWord,
            });
          }
          return true;
        }

        const newEntry = {
          id: `word_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          text: cleanWord,
          genreId,
          createdAt: Date.now(),
          usageCount: 0,
          lastUsedAt: null,
        };

        state.words.unshift(newEntry);
        saveWords();
        updateWordCountUI();

        // 経験値：はじめて教えた言葉だけ（けして また教えても出ない）
        if (!state.everTaught.has(cleanWord)) {
          state.everTaught.add(cleanWord);
          grantExp('teach');
        }
        consumePendingAnswer(cleanWord);
        saveProgress();

        if (!maybeSpeakLevelUp()) {
          triggerNextSpeech({
            preferredTypes: ['おぼえたこと', 'きづき'],
            forceWord: cleanWord,
          });
        }

        return true;
      }

      function renderGenreSelect() {
        const prev = dom.selectGenre.value;
        dom.selectGenre.innerHTML = '';
        const unlocked = unlockedGenreIds();
        state.genres.forEach((genre) => {
          const opt = document.createElement('option');
          opt.value = genre.id;
          if (unlocked.has(genre.id)) {
            opt.textContent = genre.label;
          } else {
            opt.textContent = `${genre.label}（Lv.${genre.level}で ひらく）`;
            opt.disabled = true;
          }
          dom.selectGenre.appendChild(opt);
        });
        if (prev && unlocked.has(prev)) {
          dom.selectGenre.value = prev;
        }
      }

      function updateWordCountUI() {
        const countText = `${state.words.length}こ`;
        dom.wordCountBadge.textContent = countText;
        dom.modalWordCount.textContent = countText;
      }

      function openWordbook() {
        renderWordbookFilterBar();
        renderWordbookList();
        dom.wordbookModal.classList.remove('hidden');
        dom.wordbookModal.classList.add('flex');
      }

      function closeWordbook() {
        dom.wordbookModal.classList.add('hidden');
        dom.wordbookModal.classList.remove('flex');
      }

      function renderWordbookFilterBar() {
        dom.genreFilterBar.innerHTML = '';

        const allBtn = createFilterChip('all', `ぜんぶ (${state.words.length})`);
        dom.genreFilterBar.appendChild(allBtn);

        const unlocked = unlockedGenreIds();
        state.genres.filter((g) => unlocked.has(g.id)).forEach((genre) => {
          const count = state.words.filter((w) => w.genreId === genre.id).length;
          const chip = createFilterChip(genre.id, `${genre.label} (${count})`);
          dom.genreFilterBar.appendChild(chip);
        });
      }

      function createFilterChip(genreId, label) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'fchip' + (state.selectedFilterGenre === genreId ? ' on' : '');
        btn.textContent = label;
        btn.addEventListener('click', () => {
          state.selectedFilterGenre = genreId;
          renderWordbookFilterBar();
          renderWordbookList();
        });
        return btn;
      }

      function renderWordbookList() {
        const filteredWords =
          state.selectedFilterGenre === 'all'
            ? state.words
            : state.words.filter((w) => w.genreId === state.selectedFilterGenre);

        dom.wordbookListContainer.innerHTML = '';

        if (filteredWords.length === 0) {
          const emptyDiv = document.createElement('div');
          emptyDiv.className = 'empty';
          emptyDiv.innerHTML = '<b>まだ ことばが ないよ</b>まえの がめんから ひらがなの ことばを おしえてあげてね。';
          dom.wordbookListContainer.appendChild(emptyDiv);
          return;
        }

        const grid = document.createElement('div');
        grid.className = 'wgrid';

        filteredWords.forEach((wordObj) => {
          const card = document.createElement('div');
          card.className = 'wcard';

          const infoDiv = document.createElement('div');
          infoDiv.className = 'info';

          const wordSpan = document.createElement('span');
          wordSpan.className = 'w';
          wordSpan.textContent = wordObj.text;

          // ジャンルは あとから かえられる（ひらいている ジャンルから えらぶ）
          const genreBadge = document.createElement('select');
          genreBadge.className = 'gsel';
          genreBadge.setAttribute('aria-label', `「${wordObj.text}」の グループ`);
          const unlockedNow = unlockedGenreIds();
          state.genres.filter((g) => unlockedNow.has(g.id)).forEach((g) => {
            const o = document.createElement('option');
            o.value = g.id;
            o.textContent = g.label;
            genreBadge.appendChild(o);
          });
          genreBadge.value = wordObj.genreId;
          genreBadge.addEventListener('change', () => {
            wordObj.genreId = genreBadge.value;
            wordObj.updatedAt = Date.now();
            saveWords();
            renderWordbookFilterBar();
            renderWordbookList();
          });

          infoDiv.appendChild(wordSpan);
          infoDiv.appendChild(genreBadge);

          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'acts';

          const talkBtn = document.createElement('button');
          talkBtn.type = 'button';
          talkBtn.title = `「${wordObj.text}」の おはなしを きく`;
          talkBtn.className = 'act';
          talkBtn.textContent = 'おはなし';
          talkBtn.addEventListener('click', () => {
            closeWordbook();
            triggerNextSpeech({
              preferredTypes: ['きづき', 'しつもん', 'おぼえたこと'],
              forceWord: wordObj.text,
            });
          });

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.title = 'わすれる（けす）';
          delBtn.className = 'act del';
          delBtn.textContent = 'けす';

          let confirmPending = false;
          let confirmTimer = null;

          delBtn.addEventListener('click', () => {
            if (!confirmPending) {
              confirmPending = true;
              delBtn.textContent = 'ほんとうに？';
              delBtn.className = 'act del confirm';
              confirmTimer = setTimeout(() => {
                confirmPending = false;
                delBtn.textContent = 'けす';
                delBtn.className = 'act del';
              }, 2500);
            } else {
              clearTimeout(confirmTimer);
              deleteWord(wordObj.id);
            }
          });

          actionsDiv.appendChild(talkBtn);
          actionsDiv.appendChild(delBtn);

          card.appendChild(infoDiv);
          card.appendChild(actionsDiv);
          grid.appendChild(card);
        });

        dom.wordbookListContainer.appendChild(grid);
      }

      function deleteWord(wordId) {
        const target = state.words.find((w) => w.id === wordId);
        state.words = state.words.filter((w) => w.id !== wordId);
        saveWords();
        updateWordCountUI();
        renderWordbookFilterBar();
        renderWordbookList();

        if (target) {
        }
      }

      // ユーザーが「つぎ」へ すすめた とき
      function userNext() {
        onUserContinue();
        if (!maybeSpeakLevelUp()) {
          triggerNextSpeech();
        }
      }

      function bindEvents() {
        dom.inputWord.addEventListener('input', () => {
          state.lastTypedAt = Date.now();
          updateCharCounter();
        });
        dom.inputWord.addEventListener('focus', () => {
          state.lastTypedAt = Date.now();
        });

        dom.qrYes.addEventListener('click', (e) => { e.stopPropagation(); onQuickReply('yes'); });
        dom.qrNo.addEventListener('click', (e) => { e.stopPropagation(); onQuickReply('no'); });
        dom.qrWait.addEventListener('click', (e) => { e.stopPropagation(); onQuickReply('wait'); });

        dom.characterStage.addEventListener('click', (e) => {
          if (state.phase !== 'talk') return;
          if (e.target.closest('#speech-box, .toggle, .controls, .status')) return;
          undimBubble();
          armDim();
        });

        dom.characterStage.addEventListener('keydown', (e) => {
          if (e.target !== dom.characterStage || state.phase !== 'talk') return;
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            undimBubble();
            armDim();
          }
        });

        dom.teachForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const success = teachWord(dom.inputWord.value, dom.selectGenre.value);
          if (success) {
            dom.inputWord.value = '';
            updateCharCounter();
          }
        });

        dom.btnEditName.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!dom.nameEditBox.classList.contains('hidden')) {
            dom.nameEditBox.classList.add('hidden');
            return;
          }
          dom.characterNameInput.value = state.characterName;
          dom.nameEditBox.classList.remove('hidden');
          dom.characterNameInput.focus();
          dom.characterNameInput.select();
        });

        dom.btnSaveName.addEventListener('click', () => {
          const newName = dom.characterNameInput.value.trim();
          if (newName) {
            state.characterName = newName;
            localStorage.setItem(STORAGE_KEYS.CHAR_NAME, newName);
            updateCharacterNameUI();
          }
          dom.nameEditBox.classList.add('hidden');
        });

        dom.characterNameInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            dom.btnSaveName.click();
          }
        });

        dom.btnSampleWord.addEventListener('click', () => {
          const open = SAMPLE_WORDS.filter((sw) => isGenreUnlocked(sw.genreId));
          const unregistered = open.filter(
            (sw) => !state.words.some((w) => w.text === sw.text)
          );
          const pick =
            unregistered.length > 0
              ? pickRandomItem(unregistered)
              : pickRandomItem(open);

          dom.inputWord.value = pick.text;
          dom.selectGenre.value = pick.genreId;
          updateCharCounter();

          const success = teachWord(pick.text, pick.genreId);
          if (success) {
            dom.inputWord.value = '';
            updateCharCounter();
          }
        });

        dom.speechBox.addEventListener('click', (e) => {
          if (e.target.closest('#btn-next-speech') || e.target.closest('#quick-replies') || e.target.closest('#name-edit-box') || e.target.closest('#btn-edit-name')) return;
          if (state.isSpeaking) {
            finishSpeakingImmediately();
          } else {
            userNext();
          }
        });

        dom.speechBox.addEventListener('keydown', (e) => {
          if (e.target.closest('#quick-replies') || e.target.closest('#name-edit-box') || e.target.closest('#btn-edit-name') || e.target.closest('#btn-next-speech')) return;
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            if (state.isSpeaking) {
              finishSpeakingImmediately();
            } else {
              userNext();
            }
          }
        });

        dom.btnNextSpeech.addEventListener('click', (e) => {
          e.stopPropagation();
          userNext();
        });

        dom.levelup.addEventListener('click', () => dom.levelup.classList.add('hidden'));

        dom.btnToggleAuto.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleAutoPlay();
        });

        dom.btnOpenWordbook.addEventListener('click', openWordbook);
        dom.btnCloseWordbook.addEventListener('click', closeWordbook);
        dom.btnCloseWordbookBottom.addEventListener('click', closeWordbook);

        dom.wordbookModal.addEventListener('click', (e) => {
          if (e.target === dom.wordbookModal) {
            closeWordbook();
          }
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && !dom.wordbookModal.classList.contains('hidden')) {
            closeWordbook();
          }
        });
      }

      function initApp() {
        syncViewport();
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', syncViewport);
          window.visualViewport.addEventListener('scroll', syncViewport);
        }
        window.addEventListener('resize', syncViewport);
        if (window.ResizeObserver) new ResizeObserver(layoutScene).observe(dom.characterStage);
        window.addEventListener('resize', layoutScene);
        layoutScene();
        loadData();
        renderCharacterImage();
        renderGenreSelect();
        updateWordCountUI();
        updateCharCounter();
        updateLevelUI();
        updateTopicCount();
        bindEvents();
        dom.characterSvg.innerHTML = NC_SVG;
        startNcLoops();
        bindStartEvents();
        loadPhase();
        startPhaseFlow();

        if (state.phase === 'talk') triggerNextSpeech({ preferredTypes: ['あいさつ'] });
        scheduleArtChecks();
        if (state.phase === 'talk' && Math.random() < 0.3) setTimeout(showArt, 14000);
      }

      window.addEventListener('DOMContentLoaded', initApp);
    })();
  
</script>
</body>
</html>
