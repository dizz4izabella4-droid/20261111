name: Build YAWARAKA
on:
  push:
    paths:
      - 'yawaraka/_src/**'
      - '.github/workflows/build-yawaraka.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools
        run: npm install --no-save --no-package-lock three@0.160.1 esbuild puppeteer-core
      - name: Build
        run: cd yawaraka/_src && YAW_NODE_MODULES="$GITHUB_WORKSPACE/node_modules" python3 build.py
      - name: Browser smoke test (real Chromium, WebGL + controls)
        timeout-minutes: 4
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/yawaraka-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          import { existsSync } from 'node:fs';

          const chrome = [process.env.CHROME_PATH, '/usr/bin/google-chrome',
            '/usr/bin/chromium', '/opt/google/chrome/chrome'].find(p => p && existsSync(p));
          if (!chrome) throw new Error('No Chromium browser installed on runner');
          const browser = await puppeteer.launch({
            executablePath: chrome,
            headless: true,
            args: ['--no-sandbox','--disable-dev-shm-usage','--enable-webgl',
              '--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader']
          });
          try {
            const page = await browser.newPage();
            page.setDefaultTimeout(30000);
            await page.setViewport({ width: 1180, height: 780 });
            const jsErrors = [];
            page.on('pageerror', e => jsErrors.push(e.message));
            await page.goto('http://127.0.0.1:8123/yawaraka/', { waitUntil: 'load', timeout: 30000 });
            await page.waitForFunction(() => {
              const c = document.getElementById('c');
              return c && c.width > 0 && c.height > 0 && typeof document.getElementById('bakeBtn').onclick === 'function';
            }, { timeout: 30000 });
            const start = await page.evaluate(() => ({
              mode:document.getElementById('toolModes').dataset.m,
              modeText:document.getElementById('modeSculpt').textContent,
              selectedModes:[...document.querySelectorAll('#toolModes button[aria-pressed="true"]')].map(x=>x.id),
              outline:document.getElementById('line').classList.contains('on'),
              canvasWidth:document.getElementById('c').width,
              shapeOpen:document.getElementById('pShape').classList.contains('open'),
              bakeParent:document.getElementById('bakeBtn').closest('.panel')?.id,
              relaxParent:document.getElementById('relaxBtn').closest('.panel')?.id,
              bakeVisible:document.getElementById('bakeBtn').getClientRects().length>0,
              relaxVisible:document.getElementById('relaxBtn').getClientRects().length>0,
              tabs:{
                shape:getComputedStyle(document.getElementById('tShape')).flexGrow,
                decoration:getComputedStyle(document.getElementById('plantBtn')).flexGrow,
                color:getComputedStyle(document.getElementById('colorBtn')).flexGrow,
                details:getComputedStyle(document.getElementById('tMore')).flexGrow
              }
            }));
            if(start.mode !== 'sculpt' || start.modeText !== 'のばす' ||
               start.selectedModes.join() !== 'modeSculpt' || start.outline || start.canvasWidth < 100 ||
               !start.shapeOpen || start.bakeParent!=='pShape' || start.relaxParent!=='pShape' ||
               !start.bakeVisible || !start.relaxVisible ||
               start.tabs.shape!=='2' || start.tabs.color!=='2' || start.tabs.details!=='1')
              throw new Error('Bad startup UI or shape panel layout: '+JSON.stringify(start));
            await page.click('#hp');
            await page.click('#relaxBtn');
            await page.waitForFunction(() =>
              document.getElementById('toast').textContent.includes('もとの かたちに もどりました'),
              { timeout: 20000 });
            await page.click('#tMore');
            await page.click('#yawaraka-lang');
            await page.waitForFunction(() => document.getElementById('tMore').textContent === '詳細設定');
            await page.click('#yawaraka-lang');
            await page.waitForFunction(() => document.getElementById('tMore').textContent === 'くわしく');
            await page.click('#sendWW');
            await page.waitForFunction(() => {
              try { return JSON.parse(localStorage.getItem('brain-friends-gallery-v1')||'[]').length > 0; }
              catch (e) { return false; }
            }, { timeout: 15000 });
            await page.click('#tShape');
            if (!await page.$eval('#bakeBtn',el=>el.getClientRects().length>0 &&
              el.closest('#pShape')!==null))
              throw new Error('BAKE not visible when shape tab is active');
            // Reproduce a slow frame: pointerdown + pointermove + BAKE all in
            // one JS task (without a render frame). Search the visible body.
            const bakeInfo = await page.evaluate(() => {
              const canvas = document.getElementById('c'), rect = canvas.getBoundingClientRect();
              const saveCapture = canvas.setPointerCapture;
              const results = [];
              let captured = false;
              canvas.setPointerCapture = () => { captured = true; };
              const event = (type, x, y) => new PointerEvent(type, {
                bubbles: true, pointerId:3, pointerType:'touch',
                buttons: type === 'pointerup' ? 0 : 1, clientX:x, clientY:y
              });
              try {
                for (const yy of [.43,.5,.36,.57,.29,.64]) for (const xx of [.5,.45,.55,.4,.6]) {
                  const x=rect.left+rect.width*xx, y=rect.top+rect.height*yy;
                  captured=false;
                  canvas.dispatchEvent(event('pointerdown',x,y));
                  canvas.dispatchEvent(event('pointermove',x+150,y-80));
                  document.getElementById('bakeBtn').click();
                  const refining=document.getElementById('bakeBtn').dataset.refining;
                  results.push({xx,yy,captured,refining:refining||''});
                  window.dispatchEvent(event('pointerup',x,y));
                  if (refining === 'true') return {passed:true,results};
                }
                return {passed:false,results};
              } finally {canvas.setPointerCapture=saveCapture;}
            });
            if (!bakeInfo.passed)
              throw new Error('BAKE did not start the frame-lag refinement: '+JSON.stringify(bakeInfo));
            await page.waitForFunction(() => !document.getElementById('bakeBtn').dataset.refining, {timeout:15000});
            await page.click('#tMore'); // Undo remains in the advanced panel.
            await page.click('#undo');
            console.log('PASS: same-task drag and BAKE starts subtle post-cure refinement, completes, and undo works');
            // User-requested interaction regression: controls removed, separate copies,
            // selection pointer, lighting, patterns, photo crop/paste and multi-touch bake.
            const retired = await page.evaluate(() =>
              ['delBtn','rowBtn','stackBtn','poke'].filter(id=>document.getElementById(id)));
            if (retired.length) throw new Error('Retired controls still in DOM: '+retired);
            if (await page.$eval('#mochi',el=>el.textContent) !== 'おもち')
              throw new Error('Mochi control was not renamed');
            // Close the taller details panel so camera gestures hit the canvas.
            await page.click('#tMore');
            // Three independent buttons, not an opaque cycling toggle.
            await page.click('#modeCamera');
            await page.waitForFunction(() =>
              document.getElementById('toolModes').dataset.m==='camera' &&
              document.getElementById('modeCamera').getAttribute('aria-pressed')==='true');
            const cameraAngle0 = await page.$eval('#c',el=>Number(el.dataset.cameraAngle));
            await page.mouse.move(445, 198);
            await page.mouse.down();
            await page.mouse.move(620, 250, {steps:7});
            await page.mouse.up();
            await page.waitForFunction(a =>
              Math.abs(Number(document.getElementById('c').dataset.cameraAngle) - a) > 0.03,
              {timeout:10000}, cameraAngle0);
            await page.click('#modeSculpt');
            await page.click('#modeSculpt');
            if (await page.$eval('#toolModes',el=>el.dataset.m) !== 'sculpt')
              throw new Error('Sculpt repeated click unexpectedly cycles the tool');
            await page.click('#copyBtn');
            await page.waitForFunction(() =>
              document.getElementById('cnt').textContent.startsWith('2 /') &&
              !document.getElementById('selectedArrow').hidden &&
              document.getElementById('toolModes').dataset.m==='place' &&
              document.getElementById('modePlace').getAttribute('aria-pressed')==='true',
              {timeout:15000});
            const copyInfo=await page.$eval('#selectedArrow', el=>({
              text:el.textContent,pos:el.dataset.worldPosition
            }));
            if (!copyInfo.pos || copyInfo.pos==='0.00,0.00')
              throw new Error('Copy not spawned elsewhere: '+JSON.stringify(copyInfo));
            // Combined placement tool supports directly dragging the character.
            const moved = await page.evaluate(() => {
              const canvas=document.getElementById('c'),ar=document.getElementById('selectedArrow');
              const rect=ar.getBoundingClientRect(),save=canvas.setPointerCapture;
              let captured=false;
              canvas.setPointerCapture = ()=>{captured=true;};
              const pointer=(type,x,y)=>new PointerEvent(type,{bubbles:true,pointerId:41,
                pointerType:'touch',buttons:type==='pointerup'?0:1,clientX:x,clientY:y});
              const before=ar.dataset.worldPosition;
              try {
                for(const dy of [70,90,110,130,50])for(const dx of [0,-35,35,-65,65]){
                  const x=rect.left+rect.width/2+dx,y=rect.top+rect.height/2+dy;
                  captured=false;
                  canvas.dispatchEvent(pointer('pointerdown',x,y));
                  if (!captured)continue;
                  canvas.dispatchEvent(pointer('pointermove',x+85,y+15));
                  window.dispatchEvent(pointer('pointerup',x+85,y+15));
                  return {ok:true,before,dx,dy};
                }
                return {ok:false,before};
              } finally {canvas.setPointerCapture=save;}
            });
            if (!moved.ok)throw new Error('Merged placement tool cannot grab the body: '+JSON.stringify(moved));
            await page.waitForFunction(before =>
              document.getElementById('selectedArrow').dataset.worldPosition!==before,
              {timeout:10000},moved.before);
            await page.click('#tMore');
            await page.click('#lightMoveBtn');
            await page.waitForFunction(() => !document.getElementById('lightHandle').hidden &&
              document.getElementById('lightMoveBtn').getAttribute('aria-pressed')==='true');
            const lightBefore=await page.$eval('#lightHandle',el=>({x:Number(el.dataset.x),y:Number(el.dataset.y)}));
            const lightRect=await page.$eval('#lightHandle',el=>{
              const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};
            });
            const lightHit=await page.evaluate(({x,y})=>({
              point:document.elementFromPoint(x,y)?.id,
              markerRect:document.getElementById('lightHandle').getBoundingClientRect().toJSON(),
              enabled:document.getElementById('lightMoveBtn').getAttribute('aria-pressed')
            }),lightRect);
            // The handle can be clamped close to the screen edge after a
            // camera orbit. Dispatch a complete pointer gesture to its real
            // DOM handlers rather than sending the cursor off the canvas.
            const dragNow=await page.evaluate(({x,y})=>{
              const el=document.getElementById('lightHandle');
              const evt=(type,px,py)=>new PointerEvent(type,{
                bubbles:true,pointerId:6,pointerType:'touch',
                isPrimary:true,buttons:type==='pointerup'?0:1,clientX:px,clientY:py
              });
              el.dispatchEvent(evt('pointerdown',x,y));
              el.dispatchEvent(evt('pointermove',x-100,y+68));
              el.dispatchEvent(evt('pointerup',x-100,y+68));
              return {x:Number(el.dataset.x),y:Number(el.dataset.y),
                left:el.style.left,top:el.style.top,hidden:el.hidden};
            },lightRect);
            if (Math.abs(dragNow.x-lightBefore.x)<=.05 ||
                Math.abs(dragNow.y-lightBefore.y)<=.05)
              throw new Error('Direct light drag did not change both light axes: '+
                JSON.stringify({lightBefore,lightRect,lightHit,dragNow}));
            const lightAfter=await page.$eval('#lightHandle',el=>({x:Number(el.dataset.x),y:Number(el.dataset.y)}));
            const lightSlider=await page.$eval('#lightX',el=>Number(el.value));
            if (Math.abs(lightAfter.x-lightSlider)>.15)
              throw new Error('Light drag not synchronized with slider: '+JSON.stringify({lightAfter,lightSlider}));
            await page.click('#lightMoveBtn');
            await page.waitForFunction(() => document.getElementById('lightHandle').hidden);
            await page.$eval('#lightX', el=>{el.value='-4';el.dispatchEvent(new Event('input',{bubbles:true}));});
            await page.$eval('#lightY', el=>{el.value='10';el.dispatchEvent(new Event('input',{bubbles:true}));});
            await page.$eval('#lightZ', el=>{el.value='-2';el.dispatchEvent(new Event('input',{bubbles:true}));});
            await page.click('#colorBtn');
            await page.click('#patternDots');
            if (!await page.$eval('#patternDots',el=>el.classList.contains('on')))
              throw new Error('Pattern selection did not apply');
            await page.evaluate(async()=>{
              const input=document.getElementById('photoTextureInput');
              const c=document.createElement('canvas');c.width=c.height=20;
              const ctx=c.getContext('2d');ctx.fillStyle='#db465b';ctx.fillRect(0,0,20,20);
              const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));
              const list=new DataTransfer();
              list.items.add(new File([blob],'local-photo.png',{type:'image/png'}));
              input.files=list.files;input.dispatchEvent(new Event('change',{bubbles:true}));
            });
            await page.waitForFunction(() => !document.getElementById('cropDialog').hidden);
            await page.$eval('#cropZoom',el=>{el.value='1.5';el.dispatchEvent(new Event('input',{bubbles:true}));});
            await page.click('#cropApply');
            await page.waitForFunction(() => document.getElementById('cropDialog').hidden);
            const pasted=await page.evaluate(() => {
              const cv=document.getElementById('c'),rect=cv.getBoundingClientRect();
              const arrow=document.getElementById('selectedArrow').getBoundingClientRect();
              for(const yoff of [65,90,110,135,45,155])
                for(const xoff of [0,-45,45,-85,85]) {
                  cv.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,
                    pointerId:74,pointerType:'touch',buttons:1,
                    clientX:arrow.left+arrow.width/2+xoff,
                    clientY:arrow.top+arrow.height/2+yoff}));
                  if(document.getElementById('toast').textContent==='しゃしんを はりました')
                    return {ok:true,xoff,yoff};
                }
              return {ok:false,arrow:[arrow.left,arrow.top],canvas:[rect.width,rect.height],
                toast:document.getElementById('toast').textContent};
            });
            if (!pasted.ok) throw new Error('Photo cutout not placed: '+JSON.stringify(pasted));
            await page.click('#tShape');
            if (!await page.$eval('#relaxBtn',el=>el.getClientRects().length>0))
              throw new Error('Restore not visible in shape tab');
            // The explicit sculpt button returns directly, with no cycling.
            await page.click('#modeSculpt');
            await page.waitForFunction(() =>
              document.getElementById('toolModes').dataset.m==='sculpt');
            const multiStart=await page.evaluate(() => {
              const cv=document.getElementById('c'),a=document.getElementById('selectedArrow').getBoundingClientRect();
              const save=cv.setPointerCapture,captured=[];
              cv.setPointerCapture=id=>captured.push(id);
              const ptr=(type,id,x,y)=>new PointerEvent(type,{bubbles:true,pointerType:'touch',
                pointerId:id,buttons:1,clientX:x,clientY:y});
              try{
                for (const dy of [85,100,65,120,45]) for(const dx of [0,-35,35,-65,65]){
                  const x=a.left+a.width/2+dx,y=a.top+a.height/2+dy;
                  captured.length=0;
                  cv.dispatchEvent(ptr('pointerdown',101,x,y));
                  if(!captured.includes(101))continue;
                  cv.dispatchEvent(ptr('pointerdown',102,x+5,y+5));
                  if(captured.includes(102))return {ok:true,x,y,captured:[...captured]};
                  window.dispatchEvent(ptr('pointerup',101,x,y));
                }
                return {ok:false,captured};
              }finally{cv.setPointerCapture=save;}
            });
            if (!multiStart.ok)throw new Error('Independent multi-touch was not captured: '+JSON.stringify(multiStart));
            await page.waitForFunction(() =>
              document.getElementById('c').dataset.dragPoints==='2' &&
              document.getElementById('c').dataset.strained==='true',
              {timeout:15000});
            const multiBake=await page.evaluate(({x,y})=>{
              const cv=document.getElementById('c');
              cv.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,
                pointerId:101,pointerType:'touch',buttons:1,clientX:x+85,clientY:y-65}));
              cv.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,
                pointerId:102,pointerType:'touch',buttons:1,clientX:x-70,clientY:y-45}));
              document.getElementById('bakeBtn').click();
              return {toast:document.getElementById('toast').textContent,
                refining:document.getElementById('bakeBtn').dataset.refining};
            },multiStart);
            if (!multiBake.toast.includes('かためました'))
              throw new Error('BAKE while holding two fingers failed: '+JSON.stringify(multiBake));
            await page.waitForFunction(() =>
              document.getElementById('c').dataset.dragPoints==='0' &&
              document.getElementById('c').dataset.strained==='false',
              {timeout:15000});
            console.log('PASS: persistent modes and actual camera rotation, unified character placement, direct light drag, independent light depth, textures, photo crop, two-touch BAKE');
            // Small touch viewport: all three direct modes remain separately tappable.
            await page.setViewport({width:390,height:844,isMobile:true,deviceScaleFactor:1,hasTouch:true});
            await page.waitForFunction(() =>
              document.getElementById('c').width>100 &&
              [...document.querySelectorAll('#toolModes button')].every(btn=>{
                const r=btn.getBoundingClientRect();
                return r.width>=65 && r.height>=40 && r.left>=0 && r.right<=window.innerWidth;
              }),{timeout:15000});
            await page.click('#modeCamera');
            await page.click('#modeSculpt');
            if (await page.$eval('#toolModes',el=>el.dataset.m) !== 'sculpt')
              throw new Error('Touch-sized mode buttons did not return to default sculpt');
            // iOS Safari smart zoom fix: mobile-style double-taps must not zoom the UI.
            // Chromium touch emulation validates the CSS gesture contract; physical
            // iOS Safari is a separate device test and is not claimed here.
            const touchPolicy = await page.evaluate(() => ({
              html:getComputedStyle(document.documentElement).touchAction,
              body:getComputedStyle(document.body).touchAction,
              button:getComputedStyle(document.getElementById('modeSculpt')).touchAction,
              copy:getComputedStyle(document.getElementById('copyBtn')).touchAction,
              canvas:getComputedStyle(document.getElementById('c')).touchAction,
              crop:getComputedStyle(document.getElementById('cropCanvas')).touchAction
            }));
            if (touchPolicy.html !== 'manipulation' ||
                touchPolicy.body !== 'manipulation' ||
                touchPolicy.button !== 'manipulation' ||
                touchPolicy.copy !== 'manipulation' ||
                touchPolicy.canvas !== 'none' ||
                touchPolicy.crop !== 'none')
              throw new Error('Incorrect double-tap touch policy: '+JSON.stringify(touchPolicy));
            const uiRect=await page.$eval('#modeSculpt',el=>{
              const r=el.getBoundingClientRect();
              return {x:r.left+r.width/2,y:r.top+r.height/2};
            });
            const scaleBefore=await page.evaluate(()=>window.visualViewport?.scale||1);
            await page.touchscreen.tap(uiRect.x,uiRect.y);
            await page.touchscreen.tap(uiRect.x,uiRect.y);
            await new Promise(resolve=>setTimeout(resolve,450));
            const doubleTapInfo=await page.evaluate(()=>({
              zoom:window.visualViewport?.scale||1,
              mode:document.getElementById('toolModes').dataset.m
            }));
            if (doubleTapInfo.zoom > scaleBefore * 1.03 || doubleTapInfo.mode !== 'sculpt')
              throw new Error('UI double-tap caused zoom or left default mode: '+JSON.stringify({scaleBefore,doubleTapInfo}));
            console.log('PASS: double-tap suppressed on mobile UI; pinch zoom not globally disabled');
            const mobilePanel = await page.evaluate(() => {
              const ids=['tShape','plantBtn','colorBtn','tMore','bakeBtn','relaxBtn'];
              const result={};
              for(const id of ids){
                const el=document.getElementById(id),r=el.getBoundingClientRect();
                result[id]={x:r.left,width:r.width,right:r.right,visible:!!el.getClientRects().length};
              }
              return result;
            });
            for(const [id,pos] of Object.entries(mobilePanel)){
              if(!pos.visible || pos.x<0 || pos.right>390.5 || pos.width<42)
                throw new Error('Panel control out of mobile viewport: '+JSON.stringify({id,pos,mobilePanel}));
            }
            const tabRatio=mobilePanel.tShape.width/mobilePanel.tMore.width;
            const colorRatio=mobilePanel.colorBtn.width/mobilePanel.tMore.width;
            if(Math.abs(tabRatio-2)>.22 || Math.abs(colorRatio-2)>.22)
              throw new Error('Shape/color/details width ratio is not 2:2:1: '+JSON.stringify(mobilePanel));
            console.log('PASS: shape panel has BAKE and RELAX, initial panel visible, 2:2:1 tabs and small-screen layout');
            console.log('PASS: touch viewport 390x844 persistent mode buttons');
            if (jsErrors.length) throw new Error('Page errors: '+jsErrors.join(' / '));
            console.log('PASS: startup, WebGL canvas, default hiragana, outline off, relax, language toggle, gallery');
          } finally { await browser.close(); }
          JS
      - name: Commit built HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yawaraka/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build YAWARAKA public HTML"
            git push
          fi
