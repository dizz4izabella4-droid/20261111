<!--IZ-LINK-BRIDGE:START--><script id="izlink-bridge">
/* izlink bridge v1 — 連携アプリの共通データ層とイベント
 *
 * 各アプリ（保管庫・レッドライン・iz2611）と外枠（link/）に埋め込む小さな部品。
 * 埋め込みは tools/apply_link_bridge.py で行う（作品は1ファイル完結のため）。
 *
 * 保存先（同一ドメインの localStorage）
 *   izlink.v1.meta      : { caseId, settings:{ brand, stringsForFloppy } }
 *   izlink.v1.<caseId>  : { marks:[], floppies:{}, terminal:{}, board:{items:[],pins:[],strings:[]}, truth:null }
 *
 * API（window.IzLink）
 *   IzLink.linked                 外枠の中で動いているか（単体起動なら false）
 *   IzLink.brand()                端末名（既定 'iz2611'）
 *   IzLink.setting(key)           設定値
 *   IzLink.caseId()               現在の事件ID
 *   IzLink.meta() / setMeta(fn)   メタの読み出し・更新
 *   IzLink.get(caseId?)           事件データ（無ければ空の形で返す）
 *   IzLink.update(fn, caseId?)    事件データを fn(data) で書き換えて保存し、'data.changed' を流す
 *   IzLink.on(type, cb)           イベント受信（自分・他の画面・外枠のどこから来たものも）。戻り値で解除
 *   IzLink.emit(type, payload)    イベント送信（自分にも届く。外枠経由で他の画面へも届く）
 *   IzLink.onVisibility(cb)       表示・非表示の通知（外枠が送る）
 *
 * 主なイベント
 *   case.selected {caseId}  mark.added {docId,...}  string.added {stringId}
 *   floppy.found {caseId}   floppy.inserted {caseId}  article.pinned {articleId}
 *   evidence.found {...}    truth.revealed {...}      data.changed {caseId}
 */
(function (global) {
  'use strict';
  if (global.IzLink) return;

  var PREFIX = 'izlink.v1.';
  var META_KEY = PREFIX + 'meta';
  var DEFAULT_SETTINGS = { brand: 'iz2611', stringsForFloppy: 3 };
  var listeners = {};
  var visListeners = [];
  var isTop = global.parent === global;
  // 外枠（link/）は、部品より先に window.IZLINK_HOST = 1 を置く。
  // 祖先に外枠がいるときだけ「連携中」とみなす（単体の端末の中のディスクなどは連携しない）
  var hostWin = null;
  (function () {
    var w = global;
    for (var i = 0; i < 6; i++) {
      try { if (w.IZLINK_HOST) { hostWin = w; return; } } catch (e) { return; }
      if (w.parent === w) return;
      w = w.parent;
    }
  })();

  function read(key, fallback) {
    try {
      var s = global.localStorage.getItem(key);
      return s ? JSON.parse(s) : fallback;
    } catch (e) { return fallback; }
  }
  function write(key, value) {
    try { global.localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }

  function emptyCase() {
    return { marks: [], floppies: {}, terminal: {}, board: { items: [], pins: [], strings: [] }, truth: null };
  }
  function normalizeCase(d) {
    var e = emptyCase();
    if (!d || typeof d !== 'object') return e;
    for (var k in e) if (!(k in d)) d[k] = e[k];
    if (!d.board || typeof d.board !== 'object') d.board = e.board;
    ['items', 'pins', 'strings'].forEach(function (k) { if (!Array.isArray(d.board[k])) d.board[k] = []; });
    return d;
  }

  function meta() {
    var m = read(META_KEY, null) || {};
    m.settings = m.settings || {};
    for (var k in DEFAULT_SETTINGS) if (!(k in m.settings)) m.settings[k] = DEFAULT_SETTINGS[k];
    if (!('caseId' in m)) m.caseId = null;
    return m;
  }
  function setMeta(fn) {
    var m = meta();
    var r = fn(m);
    write(META_KEY, r || m);
    return r || m;
  }

  function caseId() { return meta().caseId; }
  function get(id) {
    id = id || caseId();
    if (!id) return emptyCase();
    return normalizeCase(read(PREFIX + id, null));
  }
  function update(fn, id) {
    id = id || caseId();
    if (!id) return null;
    var d = get(id);
    var r = fn(d);
    d = normalizeCase(r || d);
    write(PREFIX + id, d);
    emit('data.changed', { caseId: id });
    return d;
  }

  function deliver(type, payload, origin) {
    var ev = { type: type, payload: payload || {}, origin: origin };
    (listeners[type] || []).slice().forEach(function (cb) { try { cb(ev.payload, ev); } catch (e) { console.error(e); } });
    (listeners['*'] || []).slice().forEach(function (cb) { try { cb(ev.payload, ev); } catch (e) { console.error(e); } });
  }
  function on(type, cb) {
    (listeners[type] = listeners[type] || []).push(cb);

["A-01", "1994-04-13", "湾岸第三区 車両火災報告", "事故受付係", "午前0時25分ごろ、湾岸第三区の側道において貨物車一台の焼損を確認した。現場到着時、運転者は車内にいなかった。\n火元および乗員の行動については別途調査を要する。\n\n現場は旧橋東詰から約七百メートルの市道脇で、車体は進行方向と逆向きに停止していた。道路の中央に荷崩れを示す散乱物はなく、貨物室の扉は火熱で変形し、内部の積載物は数量を確定できない。消火を担当した隊員によれば、到着時には火勢が弱まりつつあった。発見時刻を発火時刻と扱わないよう注意が付された。\n車体後部の登録標識は湾岸地区登録「港45あ17-42」と読み取れたが、車内には運転免許証、乗務日報、身分証等を確認できなかった。登録標識による照会を優先し、車体そのものの識別は現場検証班へ回された。\n現場の脇に残された靴跡については、消火隊員や通行人の往来と区別が付かず、事故に関係するものとして採用していない。"],
["A-01", "1994-04-16", "港湾作業員の所在不明届", "地域連絡室", "港湾関連会社に勤務する男性について、勤務先から所在不明の届け出があった。最終出勤日について、提出書類と口頭説明の間に相違がある。\n\n届出の対象者は港湾荷役会社「日新荷役」の契約作業員、藤田賢治（三十七歳）。会社提出の出勤表には四月十三日の早朝欄に青鉛筆の印があり、一方、現場責任者は十二日午後六時過ぎに帰宅したと説明している。翌朝の印について、本人の出勤を示すか事務上の処理かは確認できない。\n藤田の住居には作業着と手帳が残され、給与の仮払いや退職の申し出は記録されていない。家族は「二、三日連絡が取れないことは以前にもあった」と話しており、届出時点では事件性を判断できない。車両火災との関係を示す記録は添付されていない。"],
["A-01", "1994-04-15", "車両火災事故 追加報告", "事故受付係", "焼損車両の登録番号を確認した。申告された運転者名と当日の運行予定表の記載は一致しない。原因は確認中である。\n\n登録標識「港45あ17-42」の名義人は青波運送で、同社はこれを社内の「17号車」と呼んでいる。事故第一報に記された運転者は岡田慎であるが、提出された当日運行予定表では北野修が配置されていた。第一報の氏名は現場発見者からの伝聞で、出典となる伝票は残っていない。\n照会に使用した識別資料は焼損を免れた後部登録標識の拓本と、警備員が書き留めた数字の控えである。車台に直接刻まれた番号については、この追加報告では照合していない。\n照会担当者の回付欄には、整備担当からの追加回答を待つ旨が書かれているが、決裁印は押されていない。"],
["A-01", "1994-03-22", "中央通り 物損事故届", "道路管理課", "午前6時台に店舗前の石柱が破損したとの届け出を受理。負傷者なし。修繕費用は管理者側で精査する。\n\n破損した石柱は中央通りの菓子店前に設置されていた案内用のもの。閉店後に音を聞いた住民はいるが、接触した車の種類は見ていない。店主は前夜まで石柱が立っていたと述べた。\n周囲から採取した塗膜片は黒色と白色が混在し、同じ車両に由来するとは限らない。道路管理課は衝突車両を特定できないまま、新しい石柱を発注した。支出決裁は四月一日付で完了。添付の修繕見積書は石材の調達費と施工費に分かれ、施工日だけが未定とされる。"],
["A-01", "1994-05-21", "埠頭倉庫 扉損壊届", "倉庫管理課", "第二区の管理倉庫で夜間の扉損壊を確認。保管物品の数量に変化はなかった。外部からの侵入の有無は不明。\n\n損壊があったのは第二区の穀物保管倉庫で、四月の車両火災現場とは別管理区域にある。扉下部のレールに擦過痕があり、鍵穴と側面の留め具には新しい傷が認められなかった。\n五月二十二日、管理人から「閉鎖後に外からこじ開けられた」との補足があったが、その根拠は扉の開閉が重くなっていたことである。入出庫台帳と封印札の番号は一致し、保管中の袋詰め穀物の欠損もない。設備の老朽化による可能性を排除していない。"],
["A-01", "1993-11-28", "北駅前 自転車盗難届", "地域連絡室", "施錠した自転車一台が駅前駐輪場から消失したと申告。所定の記録票へ登録した。\n\n車両は銀色の実用自転車で、前籠と荷台を備える。盗難届の提出者は北駅を通勤に利用する会社員で、同日の夕刻に施錠を確認したという。自転車の製造番号は購入時の保証書から転記した。\n駅前では週末に放置自転車の整理が行われており、撤去記録の確認を先に行った。しかし該当番号は撤去台帳にも交番への拾得届にも見当たらず、事件は未解決のまま記録を閉じている。申告者から盗難保険への届出があり、受理番号を備考欄に転記した。"],
// A-02
["A-02", "1994-04-13", "車両火災 現場見取図", "現場調査班", "図面原本は資料袋に保管。道路は北側の旧橋へ続き、西側に排水施設がある。\n現場の周囲には車輪の跡が複数確認されたが、同一車両によるものか判別できない。\n\n見取図の北は用紙上端、旧橋へ向かう道路を上り方向とする。焼損車は東側の排水路に寄って停止し、後部はわずかに西へ振れていた。側道から港湾施設へ入る門は図面の範囲外にあり、この見取図だけで入構経路を判断することはできない。\n車の前後には複数の車輪痕があるが、消火車両の進入で一部が重なった。横転の跡や側道の柵との新しい接触痕は見つかっていない。\n検証班の補助メモには『後部左側の登録標識は回収済み。車台刻印は右後方で後刻確認』とある。刻印位置は原図の車体右側に小さな丸印で示された。"],
["A-02", "1994-04-13", "現場写真 収録一覧", "現場調査班", "写真A：焼損車両の前面。写真B：側道の路面。写真C：旧橋側から見た道路。写真D：排水施設の外壁。\n原版の一部は別箱に保管する。\n\n写真Aは火災の当日午前一時過ぎ、写真BからDは消火後に撮影された。写真Cの橋脚と写真Dの排水設備は道路脇の位置関係を確かめるためのもので、そこに不審者が写ったという報告はない。\n追補の写真Eは、四月十四日に保管場所へ移した焼損車体の右後方、主フレーム上面の近接写真。煤を払った箇所に打刻が残り、拡大印画の読み取り欄には「K4-618」と転記されている。読み取り欄の横に、撮影者と確認者の異なる二つの署名がある。\n写真Eの原版は写真A〜Dと別の封筒に納められ、『車台番号調査用』の朱書きがある。封筒には撮影日と印画番号を手書きした茶色い荷札が結ばれている。"],
["A-02", "1994-04-14", "検証記録 降雨の影響", "現場調査班", "火災前夜から断続的に雨が降っていた。路面の痕跡は雨水と消火作業の影響を受けている。採取位置ごとの比較には注意を要する。\n\n雨量記録によれば十二日二十三時台から十三日零時台にかけて小雨と強雨が交互に発生した。したがって、車輪痕の新旧や深さを発生順に並べることはできない。現場検証班は、轍の写真を通行経路の確定資料には採用しなかった。\n一方、焼け残った金属部品の刻印については、屋外での初見記録と保管場所での再確認記録を分けている。後者は四月十四日付の写真Eと照合し、右後方主フレームに「K4-618」と読める文字列がある、と記載した。\n足跡に残る靴底模様が複数あることは確認できるが、作業員のものとする証拠はない。"],
["A-02", "1994-05-21", "倉庫扉 現場記録", "現場調査班", "扉の外側に傷があるが、形成時期の判定は難しい。窓の固定金具に破損はない。管理人から提出された鍵束を撮影した。\n\n調査時の扉は下端が床面に擦れており、開閉するたびに同じ場所の塗膜が削れた。管理人の立ち会いで閉鎖操作を三度繰り返すと、二度目に途中で引っ掛かった。外から工具を差し込むのに十分な隙間があったかは、固定枠の変形が進んでいるため確定できない。\n鍵束は管理用二本と非常用一本で、提出時の封印札は五月二十二日付。鍵の形状に不自然な加工はない。倉庫の管理記録と保守点検票を照らし合わせるよう申し送りがある。"],
["A-02", "1994-02-02", "排水路 定期巡視写真票", "保全係", "排水路の護岸と橋脚を定点撮影。老朽化した柵の補修予定箇所を記録した。\n\n撮影は冬季の排水路点検に合わせた定例業務で、三か所の護岸と一つの橋脚を撮っている。東側護岸では金網の一部が外れ、下流へ向かう歩道には通行注意の立札が設けられていた。\n写真の整理番号は「排-02-1」から「排-02-7」。定点写真には撮影位置を示す赤い矢印が付され、次回点検も同じ画角で記録することになっている。"],
// B-01
["B-01", "1994-04-14", "運送会社 担当者の説明", "聴取担当", "「車両は十二日の夜に出発した。運転者は決められた経路を通るはずだった。途中で予定を変えたとの連絡は受けていない」と説明した。\n\n説明者は青波運送配車係の岸本。十二日夕方の配車表には17号車と運転手北野修の組み合わせがあり、貨物は梱包資材とされる。出庫印を押したのは岸本本人ではなく、夜勤担当者だった。\n岸本は『17号は後部の番号が17-42で、社内ではそれだけで通じる。運転者まで番号で管理しているわけではない』とも説明した。後日、本人は「事故車だと聞かされただけで、現物を見て確認したことはない」と補足している。\n配車表について不自然な訂正はなかったが、帰庫の有無は夜勤からの引継ぎがなく分からないという。"],
["B-01", "1994-04-14", "埠頭警備員の供述", "聴取担当", "「午前零時前後、門の外に貨物車らしい影を見た。ただし雨が強く、車体の色も番号も確認できなかった」と述べた。\n\n警備員は三十代の男性で、当夜は西側の詰所に一人で勤務していた。時刻については壁時計を見た記憶ではなく、零時の巡回ベルが鳴ったあとだったという順序から推定している。\n『門の外の影は車両一台分の大きさでしたが、ヘッドライトと雨で輪郭しか見えませんでした。青波運送の車だと断言したことはありません。翌朝、そういう事故があったと聞いただけです』\n供述にある「貨物車らしい」は運転席の高さから受けた印象であり、ナンバーや荷台の形を識別できたという意味ではない。"],
["B-01", "1994-04-17", "事務職員の参考説明", "聴取担当", "「失踪した作業員は十二日の夕方に職場を出た。翌日も出勤予定だったが、姿を見ていない」と説明した。勤務時刻は記憶による。\n\n説明者は日新荷役の事務職員、松尾。藤田賢治が十二日に使ったタイムカードを午後六時台に回収した記憶はあるが、その後に本人を直接見送ったかどうかは曖昧だとした。\n『十三日朝の青い印は、未処理の出勤予定を残しておくために私が付けた可能性があります。朝の出勤を確認した印とは限りません』と述べている。勤務表は月末にまとめて書き直される場合があり、原本以外の写しを本人の行動記録と断定しないよう注記された。"],
["B-01", "1994-04-17", "近隣住民の目撃記録", "聴取担当", "「深夜に大きな音を聞いた。時計は見ていない。港の方向だったと思う」との話を受けた。日時の特定はできていない。\n\n住民は港から二キロほど離れた住宅街に住み、寝室で金属が落ちるような音を聞いたという。翌朝、家人との会話で「昨夜のこと」と話したため、聞き取り側は十三日未明の可能性があると記録した。\nただし同じ夜には港湾道路の補修工事があり、大きな音は工事車両や家屋の雨樋から生じた可能性も残る。本人は車の走行音、爆発音、火災による光を見聞きしたとは述べていない。"],
["B-01", "1994-05-22", "倉庫管理人の説明", "聴取担当", "「扉は前日まで正常だった。夜間に巡回したときは施錠されていた」と説明した。巡回の正確な時刻は記録されていない。\n\n第二区倉庫の管理人は夜間二度の巡回を習慣としていたが、五月二十一日は雨のため二度目の巡回を短縮したと認めている。最初の申告にあった「扉は完全に閉まっていた」は、遠くから鍵の表示板を見ただけだった。\n管理人は前年から扉の開閉が重いことを修理担当に伝えていたとも述べた。鍵束が失われたことはなく、倉庫の内容物の数も減っていないという。"],
["B-01", "1993-11-30", "拾得物に関する申告", "聴取担当", "「鞄を駅の待合室で見た気がする」との申告を受けた。時間や人物の特徴に関する説明は曖昧であった。\n\n申告者は北駅近くの食堂従業員。十一月二十八日午後に茶色い鞄を見たと思うが、鞄を持つ人物は覚えていない。『革の色が似ていたのでそう思っただけかもしれない』という発言を調書に残した。\nその日の構内では観光客の忘れ物も多く、待合室の椅子に別の鞄が置かれていたことが駅員から報告されている。写真による本人確認は行われていない。"],
// B-02
["B-02", "1994-04-18", "運送会社への照会", "資料担当", "車両番号、出庫時刻、乗務員配置、途中の停車予定について回答を求めた。運行原簿の提出を依頼した。\n\n照会事項には『登録標識による車両特定が済んだとしても、該当車体を確認できる資料を別途提出すること』との付箋が貼られている。車両台帳、点検票、運行原簿の三種類を求めたが、初回回答では運行原簿の写しのみが返送された。\n担当者は再照会の要否を上司に上申し、欄外に『車体番号は整備側記録参照』と朱書きした。再照会文書の発送を示す受付印は見当たらない。"],
["B-02", "1994-04-20", "運送会社からの回答", "資料担当", "提出された運行原簿には、十二日23時40分出庫とある。翌日0時以降の記録欄には訂正があり、訂正者の署名はない。\n\n回答者は青波運送事務課。運行原簿に記載された17号車の出庫時刻は十二日二十三時四十分。出庫欄には「港45あ17-42」とあり、翌日欄の「帰庫」の文字には二重線が引かれている。上から「未確認」と書かれているが、訂正時刻と訂正者が記入されていない。\n原簿は車両が実際にどこを走ったかを記録するものではなく、出庫指示と帰着報告の受け渡しを示す事務資料だ、と回答書に記載されている。車両台帳の車台番号欄は写しから省かれ、整備担当の原票を参照するよう付記されていた。\n配車係からの口頭確認では『17号車に予定を出したこと』までは間違いないが、『焼損車と同じ車体だったこと』は確認していない。"],
["B-02", "1994-04-20", "港湾ゲート管理照会", "資料担当", "十二日夜から十三日朝までのゲート利用記録の提出を依頼。回答に先立ち、一部の記録簿が翌朝に書き直されている旨の連絡を受けた。\n\n依頼先の港湾管理課によれば、受付簿は夜勤交代時に合計欄を書き直す慣行があった。照会時に存在したのは清書簿で、濡れて読めなくなったとされる原票は別保管になっていた。\n再記入された時刻欄の「0:08」は、警備員の口頭報告に基づくか、後から記録を参照したかが不明。門の番号についても旧案内図の記号が使われている可能性があるため、出入りの位置と車両の種類を別々に確かめることを求めた。"],
["B-02", "1994-04-21", "港湾ゲート 回答票", "資料担当", "通常の通行票に押印がない車両が一台記録されている。ただし受付係によれば、雨天時には押印漏れが生じることがあった。\n\n未押印の通行票は「臨時通行」の欄に挟まれ、車両番号の末尾が「42」に見える。ただし紙の端が水濡れで欠けており、筆跡の「1」と「7」を判別できない。受付係は同日の別の通行票にも押印漏れがあると説明している。\nこの回答票だけでは、通行した車両の所有者、進行方向、運転者は確定できない。登録番号の一部が一致したとしても、事故車と同一であるとの照合は行われていない。\n入構口の位置については、旧称『第三門』が現行の『西一門』を指すと付記されている。"],
["B-02", "1994-05-01", "市道通行制限の照会", "道路管理課", "旧橋東側の工事について、実施日と通行規制の詳細を照会した。規制時間の告示と現場日誌の記載に差がある。\n\n工事告示の写しには『二十二時から翌二時まで通行に注意』とあり、地元新聞の小さな案内欄には『夜間通行規制』と短く掲載された。全車両通行止めとする決裁や道路標識設置票は見つかっていない。\n現場日誌には二十二時から片側交互通行、二十三時五十分に資材車両の通過を確認、と書かれている。照会先の担当者は、規制区間が限定的だったことから、橋を通ったか否かを告示の見出しだけで判定してはならないと回答した。"],
// C-01
["C-01", "1994-04-12", "湾岸道路 工事日誌", "道路管理課", "旧橋東側の補修工事を実施。午後10時より片側交互通行とした。夜間の全面封鎖は実施していない。\n\n規制位置は橋の東側接続道路の約百二十メートルで、西側の歩道と車両一車線は利用可能であった。二十二時から二十三時五十分までは誘導員を配置し、その後も警告灯と仮設標識を残した。工事車両の撤収予定は十三日午前一時。\n現場責任者は『全面封鎖という報告はしていない。雨によって作業を一時止めた時間はあったが、一般車の通行を禁じたものではない』と余白に追記している。\nしたがって、規制の存在だけを理由に旧橋経由の移動を不可能とすることはできない。"],
["C-01", "1994-04-13", "港湾ゲート 利用集計", "港湾管理課", "深夜帯の車両通行件数は通常より少なかった。合計数には手書きの加筆があり、原票との照合が必要である。\n\n集計表は夜勤が手書きで作成したもので、零時から一時までの件数は当初十一台、その後十二台に改められている。訂正箇所に個人印はないが、欄外には『同一票の二重記入を調整』と鉛筆書きがある。\n通行の方向、車種、通行票の押印状況を区別しない合計数のため、特定の貨物車が実際に通行したことの根拠には使えない。門の旧称と新称が清書時に混在していることが確認された。"],
["C-01", "1994-04-11", "貨物車 定期点検票", "整備担当", "灯火、制動装置、エンジンの始動を確認した。特記すべき故障は認められなかった。点検担当者の署名あり。\n\n対象は青波運送の社内17号車、登録標識「港45あ17-42」。点検票の車台番号欄は「K4-681」。右後方主フレームにある製造時の打刻を、整備士の浜田と立会人の二名で照合し、転記欄に割印を付している。\n四月十一日の作業は灯火の電球交換と制動調整にとどまり、主フレームを交換した記録はない。翌十二日の配車前確認票にも同じ車両番号と前日点検の受付印がある。\n車体後部の銀色の補強板に小さな腐食があり、整備士は次回点検時の再確認を指示している。"],
["C-01", "1994-04-12", "臨時車両出入許可簿", "施設管理課", "夜間の臨時許可は二件。許可書の控えのうち一件は番号が読み取れない状態で残されている。\n\n一件は施設内の配電盤点検に使う小型作業車、もう一件は業者からの申請書が添付されていない一時通行車両である。後者の許可時刻欄は「0時台」とだけ書かれ、車種の略号が不明瞭。\n臨時許可簿は常設契約車両を網羅しないため、この二件のどちらかが焼損車両であるとは言えない。受付番号の付け方は年度途中で変更されており、他の台帳の番号と単純に一致させないよう注意書きがある。"],
["C-01", "1994-06-03", "第二区倉庫 シャッター点検", "施設管理課", "シャッターの開閉動作を確認。下部ガイドに摩耗があり、交換を申請した。\n\n点検は五月の扉損壊届を受けて前倒しで実施した。下部ガイドの摩耗は左右で差が大きく、閉鎖時に戸車が浮き上がるため鍵を掛けても扉の端が外側へわずかに開くことがある。\n交換を申請した部材は六月中旬に入荷予定で、点検時に応急の位置調整だけを行った。倉庫内の保管品の紛失は報告されていない。二か月前の定期整備で摩耗の兆候があったことも点検簿に残っている。"],
// C-02
["C-02", "1994-04-13", "夜間当直 日誌", "管理事務室", "23時00分巡回開始。零時過ぎに雨脚が強まったため西側通路を通らず事務所へ戻ったと記録。巡回経路の変更理由について追記あり。\n\n巡回担当者は西詰所から管理棟までの定例経路を歩く予定だったが、十三日零時十五分ごろから雨が強まったため西側通路を省略した、と翌朝の引継ぎ欄に書き加えた。帰着時刻の印は零時三十分。\nただし雨脚が強まった時刻は本人の記憶によるもので、観測所の雨量記録と完全には一致しない。巡回中に港の外で火災を見たとの記載はなく、不在だった通路で何が起きたかも証明できない。"],
["C-02", "1994-04-15", "無線設備 故障受付", "設備係", "携帯無線一台について、送信が途切れるとの報告があった。故障時刻は不明で、受信記録も残されていない。\n\n故障品は携帯型無線機二号機。送信ボタンを押した際に雑音が入ることがあり、担当者は四月十五日に交換用機器を借り受けた。記録にある『夜間に交信不能』は、故障届を記入した職員が事情をまとめた表現で、四月十二日夜に故障していたと確認されたものではない。\n受信側の保存記録がないため、いかなる通報も無かったと証明することもできない。機械の故障と事件への関係は判断されていない。"],
["C-02", "1994-04-09", "消火設備 年度点検", "消防設備係", "消火栓と消火器の点検を完了。未交換の古い消火器が一基あるため、期限を定めて処置する。\n\n消火栓は三月末の通水試験を通過し、消火器の使用期限表示も確認された。未交換品は事務棟二階の倉庫入口にあった予備器で、火災現場からは距離がある。\n未交換器は使用禁止の札をつけて別置した。担当係は後継品の型式と予定納入日を控え、月末の備品台帳への反映を求めている。"],
["C-02", "1994-03-28", "庁舎 備品搬入記録", "庶務課", "事務机二台、椅子六脚、書庫用棚一台を搬入した。現品検収済み。\n\n搬入品は旧庁舎から庁舎別館へ移設したもので、備品票には寸法と数量のみが記されている。書庫用棚の塗装に剥離があったため、納入業者へ補修を依頼した。\n検収担当者は三月二十九日付の請求明細と照合して数量相違なしと報告。倉庫や港湾施設へ転用した形跡はない。受入票には『右側の棚板に一か所傷』と記載され、補修が終わるまで検収写真を添付する扱いとした。"],
["C-02", "1994-04-19", "休暇申請票", "庶務課", "港湾管理課の職員一名より年次休暇の申請。記載の日付は本人署名とともに確認された。\n\n申請者は港湾管理課の統計担当職員で、希望日は五月二日から四日まで。提出日が四月十九日であり、火災発生日の勤務を欠いたという内容ではない。\n同職員は休暇前に毎月の通行台数統計を引き継ぐ予定であったが、対象の集計は四月末分である。申請者は電話で休暇開始日の確認を受け、原本に本人が訂正印を押した。"],
// D-01
["D-01", "1993-11-28", "革製鞄 拾得届", "遺失物係", "北駅待合室で茶色の革製鞄が拾得された。内容物は鍵束、筆記具、白紙の封筒。氏名を特定できるものはなかった。\n\n拾得場所は北駅構内の三番待合室、時刻は十八時二十分。鞄は肩掛け用の金具が片側だけ外れており、鍵束には小さな銀色の家型飾りが付いていた。茶色の封筒は未記入で、切手も貼られていない。\n翌日までに名乗り出た所有者はなく、駅の案内板へ拾得届の掲示を行った。警察の預かり票には十一月二十八日の受付印がある。待合室で拾得した駅員の連絡先と、移送した保管所の受領番号が裏面に記されている。"],
["D-01", "1994-04-19", "番号札 拾得届", "遺失物係", "市営倉庫付近の歩道で真鍮製の番号札を拾得。片面の刻印は摩耗している。所有者は判明していない。\n\n番号札は縦三・五センチほどの薄い真鍮板で、片面に『12』とも『17』とも読める二文字が浅く刻まれている。錆はなく、穴には短い麻紐の切れ端が残る。\n近接する市営倉庫では同じ形状の札を工具棚の管理に使っていたが、欠品の申告はなく、所持者を特定できない。拾得者は通勤途中の高校生で、現場に車両や人の姿は見なかったという。\n登録番号の一部に見えるという付箋が付いているが、資料担当の判断は記されていない。"],
["D-01", "1994-02-14", "腕時計 遺失届", "遺失物係", "駅南口付近で腕時計を紛失したとの届出。所有者の申告では黒色の革ベルト。拾得物との照合結果は未記載。\n\n届け出の時計は丸型の銀色ケースで、裏蓋に個人の記念日を刻んだもの。遺失者は駅南口の商店主で、朝の開店準備中に気付いたと話している。紛失した正確な日時は不明。\n二月二十日付の拾得物照会が一件あったが、照合対象は形状の異なる腕時計であり、本人のものとは認められなかった。届出人は引き続き連絡を希望している。"],
["D-01", "1994-05-30", "封筒一通 拾得物受付", "遺失物係", "封印された封筒の拾得物受付を実施。内容物は未開封で保管。提出者名は別紙に記載。\n\n五月二十九日の夕方、郵便受けの上に封筒が一通置かれていたとして窓口へ届けられた。白封筒の端に水濡れの跡があり、宛先も差出人も書かれていない。預かり期間中は未開封扱いとされた。\n提出者は市民会館の清掃員。市民会館の催事資料と取り違えられた可能性があり、遺失物係は管理者へ照会している。担当者は封筒の外側のみを確認し、別紙に保管棚の番号を記入した。"],
["D-01", "1993-12-07", "折畳傘 引継記録", "遺失物係", "黒色の折畳傘を定期保管期限に基づいて引き継いだ。付属品なし。\n\n傘の持ち手は木製で、金属の留め具に小さな亀裂があった。持ち主の申告がないため、保管期限の到来に合わせて通常の手続きを行った。\n引継先は市の不用品整理係で、運送用トラックに積み込まれた日時は十二月七日午後三時。運送便の名称が略号で書かれており、受け渡し票の裏には雨でにじんだ係員の押印が残る。"],
// D-02
["D-02", "1991-10-18", "旧橋補修計画書（控）", "道路管理課", "橋梁の腐食箇所について、三年間の段階補修を計画。北側歩道に安全対策を要すると記載されている。\n\n補修の優先順位は欄干、歩道側の舗装、橋脚基部の順とされる。車両重量の制限は橋全体の耐荷重評価によって決められ、工事中の一時的な交通整理とは別の扱いである。\n平成五年度の付属計画には『大型車を恒久的に通行禁止とする必要なし』との判断がある。ただし実施した補修の範囲と年月日はこの控えからは確認できない。四月十二日の夜間規制状況は当日の工事日誌によるものとする。"],
["D-02", "1992-08-01", "港湾案内図 改訂通知", "管理事務室", "倉庫の番号変更に伴い案内図を改訂。旧番号と新番号の対照表は別紙に記載。\n\n旧案内図では港湾西側入口を『第三門』、東側倉庫を『第三区倉庫』と表記していた。改訂後、第三門は『西一門』、第三区倉庫は『第二区四号倉庫』に名称を変更した。区画そのものが移動したわけではない。\n古い文書に記載された第三門と新しい文書の西一門を、別々の出入口として数えることがないよう、管理事務室で対照表を配布した。旧図面の配布を受けた係には、差し替えの確認印を押すことが求められた。"],
["D-02", "1993-04-17", "湾岸第三区 区画変更記録", "施設管理課", "敷地境界の変更により、既存の門扉名称を変更した。利用方法は従来どおりとされた。\n\n変更対象は市有地と民有地の境界線で、門扉の名称と境界標を整理した。現場の出入経路を増設または閉鎖したものではない。旧図面を参照する際は、図面の右上に記載された改訂日を確認するよう求めている。\n名称の変更は土地管理上の措置であり、門を使用する車両の所有権、乗務員、通行時刻に関する記録ではない。記録上の『第三門』と『西一門』の混在を不審な二重通行と扱わないための注記がある。"],
["D-02", "1990-12-12", "夜間電話運用規程", "管理事務室", "緊急通報を受けた場合の記録順序と、担当者不在時の引継ぎ方法を定めた。\n\n夜間の電話通報は、発信者・受信者・受理時刻の三項目を先に記録し、内容の細部は巡回担当の報告後に補記することとされた。通報後に清書する場合は清書日を別欄に記入し、最初の受付時刻を変更しないよう定める。\n電話を受けていない部署の台帳には翌朝の報告時刻が転記されることもあり、異なる台帳にある二つの時刻は同一の出来事を指すとは限らない。後の訂正が必ずしも隠蔽を意味するわけではない。"],
["D-02", "1989-06-09", "旧書庫 移管一覧", "庶務課", "旧庁舎から移された文書の一覧。年代不明の簿冊は仮番号を付け、区分ごとに収納した。\n\n移管時に目録がない簿冊は一冊ずつ点検し、表紙の題名を仮称として一覧に登録した。内容が似ていても、移管番号だけで同じ事件に属すると判断しないことが原則とされた。\n封筒・写真・フィルムの類は紙簿冊と別棚で保管するため、同じ表題でも物理的な収納場所が異なる場合がある。移管対象の終年は昭和六十四年以前の文書に限る。新しい簿冊が後から混入した場合は別の受付番号を付して処理する。"],
];

const MURDER_CASES=[{"folder":"M-01","name":"入江館主人殺害事件","date":"1990-09-13","books":[{"title":"入江館主人殺害事件／初動・現場記録","issuer":"南汐署・刑事課","date":"1990-09-13","pages":["第1頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\n事件受理。館主の中条俊子が一階事務室で死亡しているのを帳場係が発見した。事務室は渡り廊下と搬入口側の二方向から接近可能。扉は施錠されていなかった。負傷と室内の状況から殺人として捜査を開始した。第一発見者が触れた扉の位置は発見前の状態と同一とは限らない。\n\n【付記・資料の読み方】\n館内の平面図は二種類あり、旧図には搬入口から事務室へ至る短い廊下が省かれている。案内用の図と実測図の用途は違う。見た目の経路の少なさが、そのまま通行可能な経路の少なさにはならない。\n\n〔記録区分：初動・現場記録／1冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\n午後八時四十分、従業員の尾形が館主と翌朝の仕入れについて会話した。午後九時十八分、帳場の日誌に『西館201より着信』との記入。九時三十一分に裏玄関の施錠を確認したという夜番の話がある。各時刻は同じ時計から採られたものではなく、記録の精度も異なる。\n\n【付記・資料の読み方】\n厨房の時計を合わせた日付は翌週の点検簿に残る。しかし点検の際の差を事件当夜へそのまま当てはめてよい保証はなく、十五分単位の証言を一分単位に変換することはできない。\n\n〔記録区分：初動・現場記録／1冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\n机には宿泊名簿、封を切った仕入れの封筒、未整理の伝票が残されていた。釣銭準備金に大きな不足は見られなかった。倒れた椅子と鉛筆が床にあったが、館内の共用品であるため持ち主は不明。机の時計は九時十二分を示していたが、その針が動作していたかは確かめられていない。\n\n【付記・資料の読み方】\n仕入れ伝票の封筒には日付があったが、封を切った日時の記録はない。前日の夜から机上に置かれていた可能性もある。物が置かれている場所と、その物が最後に動いた時間を混同しない。\n\n〔記録区分：初動・現場記録／1冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\n事務室の扉は二つの通路につながる。西館201号室は当夜空室扱いだった。一方、改装工事後の部屋番号と内線番号の対応表は提出されていない。廊下の鍵が閉まっていても搬入口側から通行する余地があり、『空室から電話』という言い方自体がまだ確認前の推測である。\n\n【付記・資料の読み方】\n宿泊名簿の部屋割りと、設備台帳の電話番号は同じ管理体系ではない。部屋名は改装によって付け替えられるが、内線番号札は別業者が更新する。その時間差が事件の資料へ現れている。\n\n〔記録区分：初動・現場記録／1冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\n初動段階の照会先は帳場係、宿泊者、内線機の保守会社とした。事件後の口伝えを含む証言が増えているため、直接見たものと他人から聞いたものを明記して分ける。館主と口論したという人物が複数いるが、口論をした事実と殺害した事実を連続させることはできない。\n\n【付記・資料の読み方】\n担当者間の引継ぎ時には空室発信を奇怪とする声が多かったが、配線確認が済むまで結論を保留した。見出しに使われた不可解な事実ほど、何を直接観察したのかに立ち返って確かめる。\n\n〔記録区分：初動・現場記録／1冊目。記載の評価は当時の時点に限る。〕"]},{"title":"入江館主人殺害事件／関係者聴取録","issuer":"南汐署・聴取担当","date":"1990-09-13","pages":["第1頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\n帳場係の野々宮葉子は、交換盤に『201』と点灯したので日誌へ書いたという。発信した人を見ていない。声は年配の男性に聞こえたと最初は言ったが、二度目の聴取では『かすれていて性別は判断できない』と述べた。番号を見たことと、客室の中を見たことは区別されている。\n\n【付記・資料の読み方】\n野々宮は着信番号を一度見ただけで、番号札の下に貼られた小さな工事中の紙には気づかなかったと話した。本人が嘘をついていなくても、表示そのものが現実とずれていることはありうる。\n\n〔記録区分：関係者聴取録／2冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\n205号室の宿泊者・島崎正史は、夜に自室の電話が一度鳴ったが、受話器を取ると無言だったと話す。自分から帳場へ掛けた覚えはない。時刻は腕時計ではなく廊下の時計を見た記憶による。部屋には宿泊者以外の出入りが絶対になかったと断言したわけではない。\n\n【付記・資料の読み方】\n島崎は受話器を取ったときの無言を強く記憶するが、電話を掛けた相手を見てはいない。印象に残る出来事の鮮明さと、人物を識別する確かさは一致するとは限らない。\n\n〔記録区分：関係者聴取録／2冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\n夜番の尾形定夫は館主との仕入れをめぐる口論を認め、最初に伏せたのは『変な疑いを招きたくなかった』からだと話す。九時三十一分に裏玄関を施錠したというが、その後も内側からは開けられる仕組みだった。帳場の電話については翌朝野々宮から聞いて初めて知った。\n\n【付記・資料の読み方】\n尾形は予備の配膳通路を使って夜間に厨房を往復していた。日常的に使っていた道であり、口論の話と合わせて特別な動機を推理する前に、この移動が通常業務であったことを確認する。\n\n〔記録区分：関係者聴取録／2冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\n料理長の児玉実は帳場から呼び出し音が聞こえたと話すが、厨房から交換盤は見えない。『201から』という部分は翌朝の噂で知った。事件後に配られた新聞には空室の着信が大きく扱われており、読んだ後の証言が当夜の記憶に影響した可能性について、担当者が注記を残した。\n\n【付記・資料の読み方】\n児玉の証言した音は帳場のベルと厨房の注文ベルのどちらにも似ている。複数人が同じ音を聞いたとしても、何の音と理解したかには差が残る。翌朝の聞き取りではその区別が曖昧だった。\n\n〔記録区分：関係者聴取録／2冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\nこれらの証言で、電話があったこと自体には一定の裏付けがある。しかし、発信場所・発信者・通話内容はそれぞれ別の疑問である。帳場係のメモを二人目が引用しても独立した裏付けとはならない。内線機の配線票を照会し、番号から人物まで一足飛びに推理しないこと。\n\n【付記・資料の読み方】\n聴取担当者は当初『空室発信』の欄へ赤線を引いたが、調査後に取消線を付けた。本人の発言を撤回させたのではなく、発言の意味を確定したかのように書いた捜査側の注記を訂正した。\n\n〔記録区分：関係者聴取録／2冊目。記載の評価は当時の時点に限る。〕"]},{"title":"入江館主人殺害事件／設備照会・再検証","issuer":"南汐署・資料照会係","date":"1990-09-13","pages":["第1頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\n保守会社の作業票には『西館201・205 電話機交換、番号札後日更新』と記されていた。交換機の端子表では、ある期間『201』表示が205号室に対応している。十三日の作業完了欄が未署名であり、当夜の状態については引き続き照会を要する。\n\n【付記・資料の読み方】\n保守会社の作業者は二本の配線を交換した理由を、改装後の電話位置に合わせるためと説明した。機械的な番号の接続と室名が常に一致するわけではないことが工事記録から読み取れる。\n\n〔記録区分：設備照会・再検証／3冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\n宿泊台帳では201は販売停止、205は島崎の一名宿泊となっている。宿泊台帳は契約上の利用者を示すだけで、特定の時刻に電話機を操作した人物を示さない。改装後、呼出音と表示位置が一致しないとの苦情があったことも、業務日誌の余白に記されている。\n\n【付記・資料の読み方】\n予約台帳は営業上の部屋の利用を管理するもので、電話機の所在を保証しない。同じ頁の二〇一と、交換盤上の二〇一を一対一に対応させるには、別の設備資料が必要となる。\n\n〔記録区分：設備照会・再検証／3冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\n帳場係による『21:18』は手書きの時刻であり、交換機が自動記録したものではない。保守会社の試験表は十分単位、厨房の壁時計は定期点検で三分進み、帳場は二分遅れとされた。事件時点へ機械的に差を遡及させれば、かえって存在しない正確さを作ることになる。\n\n【付記・資料の読み方】\n点検時に判明した時計の差は測定という意味では確かな記録だが、測定日が事件当日とは異なる。別の日の正確な数字が、別の日の時刻を正確に補正するとは限らない。\n\n〔記録区分：設備照会・再検証／3冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\n『空室から電話が来た』という不可解さは、番号の対応が正しい場合にのみ成り立つ。交換盤の数字と現実の部屋を照合すると、その前提が崩れる可能性がある。一方、205号室の宿泊者が掛けたとも直ちには言えず、誰かが一時的にその電話を利用した可能性も残る。\n\n【付記・資料の読み方】\nこの仮説の中心は番号のずれであり、島崎の犯行や無実を直接説明するものではない。誤っていたのは『201号室から』という読み方かもしれず、夜間の人物の動きそのものではない。\n\n〔記録区分：設備照会・再検証／3冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【入江館主人殺害事件】\n対象日付：1990年09月13日\n対象：中条俊子　場所：海沿いの旅館・入江館\n\nこの綴りは事件解決を記録したものではない。保守履歴と宿泊台帳を重ねることで、着信表示の読み違いを発見するための資料である。誰が発信したかは未確定。人物に関する証言と設備に関する記録は、同じ結論を証明するものとして混ぜずに保存する。\n\n【付記・資料の読み方】\n照会結果は内線の表示と発信場所の関係を再評価したにとどまる。発信者を確定するには通話内容や直接目撃など別種の証拠が必要で、番号だけをいくら精査してもそこへは届かない。\n\n〔記録区分：設備照会・再検証／3冊目。記載の評価は当時の時点に限る。〕"]}]},{"folder":"M-02","name":"霧野公会堂事件","date":"1991-06-21","books":[{"title":"霧野公会堂事件／現場受理簿","issuer":"霧野署・捜査第一係","date":"1991-06-21","pages":["第1頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\n町民合唱祭のリハーサルがあった夜、催事責任者の磯部雅文が舞台裏倉庫で死亡しているのを音響担当者が発見した。出入口は舞台袖と搬入口側の二か所で、外から錠を掛けた密室ではない。出演者と職員が頻繁に通ったため、現場付近の足跡だけで人物を限定できなかった。\n\n【付記・資料の読み方】\n公会堂は翌日の一般公開に備えて舞台の通し稽古をしていた。翌日の予定が二十一日の進行表に書かれていた理由はこの準備にある。日付のある表は実施結果を記したものとは限らない。\n\n〔記録区分：現場受理簿／1冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\n午後七時四十分に出演者の打合せ終了、八時五分に音声試験、八時十五分に『紹介』の進行印、八時三十一分に客席係が磯部の声を聞いたと記される。八時五十五分に遺体発見。声を聞いた者が本人の姿を見たわけではなく、再生装置から流れた可能性は残る。\n\n【付記・資料の読み方】\n進行表の欄外には『機器確認済み』とある。確認済みなのは音響設備の動作であり、紹介文を本人が発声したという意味ではない。印を押した職員も声を聞いたとは申告していない。\n\n〔記録区分：現場受理簿／1冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\n倉庫には折り畳み椅子、予備の幕、返却待ちの照明部品があった。磯部の手帳には『八時半　声の確認』という文字がある。この『声』が肉声による挨拶か、録音の確認を指すのかは本文だけで決まらない。扉取っ手の傷は前月からの修理予定として報告があった。\n\n【付記・資料の読み方】\n返却票の筆跡が磯部に似ていても、その場で書いた時間は分からない。以前に記入した票を手渡した可能性が残る。紙に残る筆跡と人の最新の所在を同一視しないための注意が付された。\n\n〔記録区分：現場受理簿／1冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\n舞台袖と客席の間には音響反射板があり、スピーカーからの声を人の発声と錯覚することがある。搬入口の予備鍵は催事責任者にも貸す運用であり、貸出簿に署名のない人物が通行不可能だったとは言えない。音の方向から発言者の立ち位置を断定しない。\n\n【付記・資料の読み方】\n搬入口と舞台袖を行き来する職員には、準備のための作業服が共通していた。衣服の形だけを用いて移動経路を復元すれば、別人を同一人物として接続するおそれがある。\n\n〔記録区分：現場受理簿／1冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\n第一発見者の腕時計による八時五十五分と、通報台帳の九時三分は異なる行為を示す。進行表は本番予定を書いた箇所と実際の試験を書いた箇所が混在する。今後は、音声の内容と再生操作を別の資料で確認する方針とし、声の証言だけで死亡時刻を限定しない。\n\n【付記・資料の読み方】\n夜の確認作業は再生係、舞台係、客席係で分担されていた。証言と操作履歴が多く残るほど情報の出所を分類しなければ、同じ一回の放送が何度も起きたように見えてしまう。\n\n〔記録区分：現場受理簿／1冊目。記載の評価は当時の時点に限る。〕"]},{"title":"霧野公会堂事件／出演者・職員聴取録","issuer":"霧野署・聴取係","date":"1991-06-21","pages":["第1頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\n客席係の稲葉順子は八時半頃『明日の舞台もよろしくお願いします』という磯部の声を聞いた。視線は客席の椅子に向けており、本人の姿は見ていない。時刻は廊下の時計で確認したつもりだが、どの時計か思い出せない。放送が肉声だったと感じた理由は説明できなかった。\n\n【付記・資料の読み方】\n稲葉は『いつもと同じ声だった』と強調した。録音の方が本人の普段の声に近く感じられる場合もあり、声質が一致していたことは肉声だったことの証明にはならない。\n\n〔記録区分：出演者・職員聴取録／2冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\n音響担当の榊和馬は八時五分に紹介の録音を試したことを認めた。客席用系統への切り替えに手間取り、何回か繰り返したかもしれないという。進行表の押印は『準備完了』の意味で実際の挨拶を指すものではないと説明した。録音テープを止めた回数については記憶がない。\n\n【付記・資料の読み方】\n榊は機器の切替作業に集中していたため、その間に誰が舞台袖を通ったか見ていない。自身が機器を操作したことと、現場の全員の位置を知っていることは別である。\n\n〔記録区分：出演者・職員聴取録／2冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\n合唱指導者の佐倉美緒は七時半過ぎに磯部と翌日の入場経路について話した。八時半以後は控室で譜面を整理していた。後日『声が聞こえた』と述べた部分は他の出演者から聞いた話で、自分の耳では聞いていないと訂正した。誤解の原因は町内紙の記事の見出しだったという。\n\n【付記・資料の読み方】\n佐倉が発言したという『磯部は舞台にいた』は、再聴取で『舞台から声がしたらしい』へ訂正された。文字にすると似ているが、一方は目撃、もう一方は伝聞である。\n\n〔記録区分：出演者・職員聴取録／2冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\n清掃担当の平井茂は八時四十分頃に舞台裏の通路を通り、黒い革靴を見たと述べた。ただし出演者の多くが似た靴を履いており、個人の特定には使えない。音声について『何も聞いていない』と言うが、当時は大きな音の清掃機械を動かしていた。\n\n【付記・資料の読み方】\n平井は作業音で舞台の声を聞かなかった。しかし聞こえなかったという情報も、当時の周囲の騒音と本人の位置が分からなければ、声が存在しなかった証明には使えない。\n\n〔記録区分：出演者・職員聴取録／2冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\n稲葉と佐倉の証言が互いに裏付け合うように見えても、佐倉の情報源は稲葉らの話である。榊の機器操作記録と稲葉の聴覚を照合するまでは『生きた磯部の声』という表現を捜査上の事実として記さない。証言の不確実さを即座に故意の嘘と扱うことも避ける。\n\n【付記・資料の読み方】\n複数人の調書に同じ文句が現れるのは、全員が同じ録音を耳にしたためかもしれない。人数の多さだけで証明力が増すのではなく、独立した別の感覚で確認したかを確かめる必要がある。\n\n〔記録区分：出演者・職員聴取録／2冊目。記載の評価は当時の時点に限る。〕"]},{"title":"霧野公会堂事件／録音・設備照会","issuer":"霧野署・資料係","date":"1991-06-21","pages":["第1頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\nカセットには『翌日紹介・二十一日確認』と書かれている。磯部の声による挨拶が録音されているが、収録した日付は明記されていない。ラベルの二十一日は録音日とも試聴日とも解釈できる。録音が存在することと、事件当夜に本人が新たに発声したことは別である。\n\n【付記・資料の読み方】\nテープのラベルは担当者が自分の用途のために付けたもので、後日事件を検証する人のための時刻表示ではない。文字の意味を確かめるには当時の記入ルールが必要となる。\n\n〔記録区分：録音・設備照会／3冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\n音響卓の運用票は八時五分『紹介試験』、八時二十五分『客席系統』、八時四十二分『終了』。操作時刻はまとめて後から書く習慣だった。テープを動かしたまま音の出口を舞台用から客席用へ切り替えられるため、八時三十一分に別の場所で声が聞こえる説明がつく。\n\n【付記・資料の読み方】\n客席用系統への切替は音源を変えずに音の出口だけを変える操作である。一度録音した声が別の場所から届く仕組みを知らなければ、客席側の証言を新たな発声と誤読する。\n\n〔記録区分：録音・設備照会／3冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\n翌日の本番進行表に『20:30 磯部挨拶』とあるが、これは予定された本番の欄。余白に『昨夜も挨拶』と書き足されたのは、事件の翌日に音声の話を聞いた担当者であった。予定・実施・伝聞を一枚の表で扱うと、後日の追記を当夜の実況と誤認してしまう。\n\n【付記・資料の読み方】\n予定表は先に作られ、実施表は後から記入される。どの欄がいつ記入されたのかを区別しないと、未来の予定を過去の目撃のように扱ってしまう。鉛筆の追記は筆者を特定するまで保留した。\n\n〔記録区分：録音・設備照会／3冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\n公会堂の同じ席で試験放送を行うと、舞台方向から人が話しているように聞こえる場合があった。ただし当夜の扉の開閉や観客の位置を完全に再現したものではない。検証で否定できたのは『声が舞台から聞こえたなら人が舞台にいた』という短絡だけである。\n\n【付記・資料の読み方】\n現地試験は再現可能な音の経路を示すだけであり、事件当日の全員の位置を再現したわけではない。再現実験が成功しても、実際にそうした人物を断定するには別の根拠が要る。\n\n〔記録区分：録音・設備照会／3冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【霧野公会堂事件】\n対象日付：1991年06月21日\n対象：磯部雅文　場所：霧野公会堂・舞台裏倉庫\n\n八時三十一分の声が録音である可能性は高いが、それだけで磯部が何時に死亡したかは決まらない。人の目撃と、装置からの音を混同して生存時刻を確定することはできない。事件の原因や人物の関与は未確定のため、本綴は調査途中の機材照会として残す。\n\n【付記・資料の読み方】\n最終の暫定判断は『声が聞こえた事実は否定しないが、生存時刻とはできない』である。何が否定されたかを明記しないと、録音の発見だけで事件が解決したかのような錯覚を招く。\n\n〔記録区分：録音・設備照会／3冊目。記載の評価は当時の時点に限る。〕"]}]},{"folder":"M-03","name":"南町書店事件","date":"1992-10-09","books":[{"title":"南町書店事件／現場・売上台帳","issuer":"南町署・刑事課","date":"1992-10-09","pages":["第1頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\n閉店後の南町書店で経営者の高垣祥子が死亡していた。アルバイトが忘れ物を取りに戻った午後十時十八分に発見した。帳場室の机と売上封筒に乱れがあったため殺人事件として取り扱う。閉店札は午後九時だが、経営者が九時以降に残業することは珍しくない。\n\n【付記・資料の読み方】\n帳場室は売場から一段奥にあり、通行者が店外から室内を見ることは難しい。閉店札と外灯の点灯は通行者が確認できるが、室内にいた人物の同定は別の問題として扱う。\n\n〔記録区分：現場・売上台帳／1冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\n帳場机には二十一時五十八分と印字された『画集一冊・二千八百円』のレシートが残っていた。印字された数字は機械に設定されている時計に由来し、取引を見た人物の記憶ではない。レジ時計の補正履歴は当時回収されず、印字時刻を正確な実時間として公表できない。\n\n【付記・資料の読み方】\n同じ機械に印字された金額と時刻でも、前者は売上取引の結果、後者は時計の設定によって決まる。片方が正しいからもう片方も正しいという関係はない。\n\n〔記録区分：現場・売上台帳／1冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\n九日の売上台帳に画集の取引が一件記入されている。同額の委託画集は複数あり、どの一冊を指すか管理番号を欠く。封筒の開封が事件と関係するかどうかも不明。金銭の不足がないからといって、金銭や帳簿を巡る対立がなかったと証明できるわけではない。\n\n【付記・資料の読み方】\n委託品の画集は持主ごとに異なる管理票が付く。レジで同じ品名と金額を選べる仕組みだったため、売上明細から商品一冊を一意にたどるには追加の台帳が必要となる。\n\n〔記録区分：現場・売上台帳／1冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\n近隣の店主は午後九時頃、外灯が点いた書店を見た。裏通りの住民は九時過ぎに人影を見たが、書店へ出入りしたのか分からない。発見前に高垣を直接確認した確実な証言は午後八時四十分頃までで、照明とレシートは人物の目撃とは種類の違う資料である。\n\n【付記・資料の読み方】\n発見前に裏通りを通った人物についての証言には服装の記録がない。『人影を見た』と『事件の関係者を見た』の間には大きな隔たりがあり、資料にない属性を補わないよう記されている。\n\n〔記録区分：現場・売上台帳／1冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\n『九時五十八分まで本人が販売した』という仮説には、レジの時計が正しく、かつ本人がレジにいたという二つの前提が必要になる。各前提を別々の資料で確かめること。商品台帳と機器の保守履歴は、異なる保管箱に収めて相互に照合する。\n\n【付記・資料の読み方】\n初動時の夕刊はレシートの数字を大きく報じたが、発行が早いほど訂正前の情報が残りやすい。新聞の見出しは検索の糸口にはなるが、会計機器の一次記録を上回るものではない。\n\n〔記録区分：現場・売上台帳／1冊目。記載の評価は当時の時点に限る。〕"]},{"title":"南町書店事件／購入者・従業員聴取","issuer":"南町署・聴取係","date":"1992-10-09","pages":["第1頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\nアルバイトの寺田真緒は午後八時四十分に退勤した際、高垣が翌日の納品を数えているのを見た。午後十時過ぎに戻って遺体を発見した。レシートの存在は捜査員から初めて教えられたという。前日に来た画集の客を、事件当日の客として思い出しかけたことを自ら訂正した。\n\n【付記・資料の読み方】\n寺田は八時四十分の面会について、納品箱の数と高垣の服装を具体的に覚えている。一方、十時以降の出来事は遺体発見まで記憶がない。前者の具体性を根拠に後者を補ってはならない。\n\n〔記録区分：購入者・従業員聴取／2冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\n古書仲介業の西崎明は午後八時五分に高垣と画集の値段を話したが、購入せず帰ったと述べる。九時五十八分のレシートについては新聞で読んだだけで、その時刻に店内へいたとは言っていない。委託金の精算を巡る不一致はあったが、事件との関連は確定していない。\n\n【付記・資料の読み方】\n西崎は委託精算の不一致を認めたが、金額の話をしたのは午後八時頃だという。新聞で読んだレシートの時刻を、自分の来店時間と混同しなかった点は調書にそのまま記されている。\n\n〔記録区分：購入者・従業員聴取／2冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\n近隣店主の浦部文子は九時の外灯点灯を証言した。自店を閉じていたため書店内の人物は見ていない。『遅くまで客がいたようだ』という話は後で町内で聞いたものであり、観察とは区別する。外灯が自動タイマーか手動かについては知らなかった。\n\n【付記・資料の読み方】\n浦部の見た外灯の位置は店舗入口であり、帳場室の窓には明かりが映らない。明るい建物を見たという印象から、中にいる経営者の行動を推定するには別の資料が必要になる。\n\n〔記録区分：購入者・従業員聴取／2冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\n元従業員の松代礼子は、前月のレジ修理後に時刻が進んでいると聞いた記憶があるが、進み幅は分からない。話の出所は従業員同士の雑談であり、独立資料が必要。納品書の裏に保守会社の名称が控えてあったと述べた。書店へ出入りした日も事件の一週間前だった。\n\n【付記・資料の読み方】\n松代の修理に関する証言は曖昧だったが、会社名を控えた納品書の存在を知らせた。このように当初不確かな証言でも、独立した照会先を示す点では資料として価値がある。\n\n〔記録区分：購入者・従業員聴取／2冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\n関係者の説明の中で、九時五十八分に本人を見たと明言する者はいない。客がいたという噂は同じレシートから伝播した可能性がある。聞き取りでは、直接観察した時刻、新聞で知った時刻、機械が示した時刻を切り分ける。故意の虚偽はまだ認定できない。\n\n【付記・資料の読み方】\n五つの証言が集まっても、印字時刻を実時間として採用する根拠は増えていない。レジの設定を直接調べない限り、全員が同じ数字を引用しているだけかもしれない。\n\n〔記録区分：購入者・従業員聴取／2冊目。記載の評価は当時の時点に限る。〕"]},{"title":"南町書店事件／会計機器・伝票照会","issuer":"南町署・資料係","date":"1992-10-09","pages":["第1頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\nレジ保守会社の十月一日作業票に、時計部品の確認のため内蔵時刻を四十七分進めた記録がある。試験終了後の時刻修正欄は未署名だった。十月十日の点検でも約四十七分進んでいたと報告され、九日夜の印字時間の信頼性に疑問が生じた。\n\n【付記・資料の読み方】\n時計部品の点検では、試験時刻を進めた理由が記載されていた。補正欄の署名がないため、その場で戻されたと断言できない。十日の点検値は九日の状況を考える重要な補助資料となる。\n\n〔記録区分：会計機器・伝票照会／3冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\n取引が二十一時五十八分と印字されたとき、機械が四十七分進んでいたと仮定すると実時間は二十一時十一分になる。ただしその差が九日夜に正確に同じだったと示す連続資料はない。二十一時十一分を新たな確定時刻として断定することもできない。\n\n【付記・資料の読み方】\n印字された21:58から47分を引く計算自体はできるが、それは時計のずれが一日中一定だったと仮定した結果である。計算できることと、その時刻が実際の発生時刻であることは異なる。\n\n〔記録区分：会計機器・伝票照会／3冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\n画集の売上は日計表と釣銭帳に反映されており、取引自体が存在した可能性はある。しかし、誰が商品を渡し、誰が金を受け取り、どの管理番号の画集だったかをレシートは示さない。機械の数字だけから高垣の生存を証明することはできない。\n\n【付記・資料の読み方】\n二千八百円が売上に計上されたことは、同額の商品に関する会計処理が存在したことを示す。だが販売をした人物と時刻を別々に裏付ける資料はまだ欠けている。\n\n〔記録区分：会計機器・伝票照会／3冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\n近隣店主が見た外灯は午後九時半まで自動点灯する設定で、店内に人がいなくても点いた。帳場の照明は手動であり、発見時に点いていたことだけが確認されている。二つの照明を一つの『営業の継続』として扱うと、誤った時間関係を作る。\n\n【付記・資料の読み方】\n照明のタイマーを調べると、店内に人がいなくても外灯だけが点く時間があった。外灯が点いていたという観察は正しくても、営業中だったという結論は成り立たない。\n\n〔記録区分：会計機器・伝票照会／3冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【南町書店事件】\n対象日付：1992年10月09日\n対象：高垣祥子　場所：南町書店・帳場室\n\n地方紙は一度『十時直前まで買い物客』と報じ、後に印字時刻の真偽が未確認だと訂正した。訂正前の記述を引用した記事が複数あっても情報源は同じレシートである。疑えるのは時刻の解釈であり、誰が殺害したかはこの照会だけでは分からない。\n\n【付記・資料の読み方】\n誤報を訂正する新聞記事は存在するが、誤報に含まれた全事柄が虚偽だったわけではない。真に問題だったのは、機械が示した時間を人物の生存時刻に飛躍させた論理である。\n\n〔記録区分：会計機器・伝票照会／3冊目。記載の評価は当時の時点に限る。〕"]}]},{"folder":"M-04","name":"青篠写真館事件","date":"1993-05-16","books":[{"title":"青篠写真館事件／発見・収蔵記録","issuer":"青篠署・刑事課","date":"1993-05-16","pages":["第1頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\n五月十六日夜、写真館助手の峰岸紀子が暗室脇の資料室で死亡しているのを館主が発見した。館内には町内行事のネガ、現像済みの写真、納品前の封筒が多数残っていた。整理中の束が崩れていたが、事件時に荒らされたものか、業務中の混乱か判別できない。\n\n【付記・資料の読み方】\n写真館の納品待ちの封筒には翌日以降の日付が混ざっていた。入荷・現像・焼き増し・受渡しの工程を通るため、一つの封筒が複数の日付を持ちうることが業務書類に残されている。\n\n〔記録区分：発見・収蔵記録／1冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\n現像済み封筒の一つには『五月十六日　二一・四五　青い傘』と記されていた。事件後、この数字が最後の撮影時刻として言い伝えられた。しかし写真館では撮影日と処理完了日を別々に管理しており、封筒の数字が何を指すか確かめる必要がある。\n\n【付記・資料の読み方】\n『青い傘』という文字は被写体の特徴であって、撮影日を直接示すものではない。数字の横にあったため時刻まで撮影記録だと思われたが、そう読む規則は見つかっていない。\n\n〔記録区分：発見・収蔵記録／1冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\n館主は午後九時頃に帰宅したと説明し、午後八時十分には証明写真を受け取った客が助手を見ている。午後九時以降に本人を直接見た確かな人物はいない。写真の仕上がり時刻は、本人の姿を見た記録の代わりにはならない。\n\n【付記・資料の読み方】\n助手が使用していた薬品やフィルムは複数人が共同で管理していた。棚の配列を見ても最後に触れた人物は分からず、品物の位置の違いを事件当夜の争いへ直接結びつけることはできない。\n\n〔記録区分：発見・収蔵記録／1冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\n棚のフィルム袋には『十五日 行事A班』と書かれたものがあり、『青い傘』の写真が含まれる可能性がある。一方、別の封筒には『十六日納品』と記された控えがある。同じ写真についても撮影・現像・受渡しが日をまたぐため、日付欄を一律に読むことはできない。\n\n【付記・資料の読み方】\n前日撮影のフィルムを翌日現像することは、写真館では日常の作業だった。現像済みの物が当日作られたとしても、写真に写る場面が当日だったという意味にはならない。\n\n〔記録区分：発見・収蔵記録／1冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\n初動班は写真の内容に目を奪われて人物の目撃を後回しにしたという反省を書き残している。フィルムの整理番号と受付番号は別体系で、番号の不一致だけを偽造や持ち出しの証拠にしない。外注業者と依頼客の証言を別に採録する。\n\n【付記・資料の読み方】\n現場で撮影した写真と、現場に残っていた商品写真は異なる資料である。『写真』という共通名で混ぜると、いつ誰が何を記録したかを曖昧にしてしまう。\n\n〔記録区分：発見・収蔵記録／1冊目。記載の評価は当時の時点に限る。〕"]},{"title":"青篠写真館事件／館主・依頼者聴取","issuer":"青篠署・聴取係","date":"1993-05-16","pages":["第1頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\n館主の神部忠は午後九時に帰宅し、助手が夜間作業を続ける予定だったと話す。『青い傘』の写真を見たのは事件後で、どの日に撮られたものか知らないという。給与の調整を巡る対立はあったが、その日の口論は否定する。顔色など印象に関する記述は伝聞と分けた。\n\n【付記・資料の読み方】\n神部の帰宅申告は自宅で過ごしたことを家族も記憶しているが、時刻の詳細には差がある。帰宅したという証言と、夜間に再び写真館へ戻らなかったことの証明は同じではない。\n\n〔記録区分：館主・依頼者聴取／2冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\n外注業者の諸橋慎は午後七時半に現像薬品を届けた。助手から、前日の行事で撮影したネガを急いで処理するよう頼まれたという。後日見つかった二一・四五の封筒を見て『まだ作業していたはず』と推測したが、自分がその時刻に館内にいたわけではない。\n\n【付記・資料の読み方】\n諸橋は前日のネガを急ぐよう言われたというが、どの袋かをすべて覚えてはいない。作業内容の記憶を信頼しても、封筒一枚の最終作業者まで特定できるわけではない。\n\n〔記録区分：館主・依頼者聴取／2冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\n証明写真を受け取った東原真美は、午後八時十分頃に助手が窓口へ出てきたと述べる。受領時刻は本人の腕時計で確認しており、直接の生存目撃として扱える範囲がある。ただし裏の資料室を見ていないため、それ以降の行動を知る資料にはならない。\n\n【付記・資料の読み方】\n東原の八時十分の受領は、依頼控えと大きく矛盾しない。直接目撃の時刻として使えるが、その後の二時間について助手を見ていたわけではない。\n\n〔記録区分：館主・依頼者聴取／2冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\n依頼客の芦田耕一は『青い傘』の元写真は五月十五日の町内行事で撮影したと説明した。十六日に完成を電話で知らせる連絡があったが、電話の相手が助手だったと断言できない。新聞の『当夜撮影の一枚』という表現は依頼客自身の言葉ではない。\n\n【付記・資料の読み方】\n芦田は写真の被写体である青い傘を自分が持っていたと説明している。撮影されたのが十五日の町内行事だったという点は、行事の主催者名簿とも照らし合わせられる。\n\n〔記録区分：館主・依頼者聴取／2冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\n同じ写真について、館主、業者、依頼客が語る『十六日』の意味は異なる。客は納品日を、業者は処理日を、記事は撮影日を指していた可能性がある。資料の衝突が直ちに誰かの嘘を意味するとは限らない。日付の対象を確認する必要がある。\n\n【付記・資料の読み方】\n同じ写真を別の日付で説明する複数人がいても、説明対象の日付が異なれば矛盾とは限らない。捜査側は撮影日・現像日・納品日という三項目に分けて聴取票を作り直した。\n\n〔記録区分：館主・依頼者聴取／2冊目。記載の評価は当時の時点に限る。〕"]},{"title":"青篠写真館事件／ネガ・納品照会","issuer":"青篠署・技術資料係","date":"1993-05-16","pages":["第1頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\n写真館の帳簿では、封筒表面の赤印は処理完了日を意味し、撮影日欄は別紙の注文票にある。『五月十六日 二一・四五』には『仕上げ後確認』の文字が添えられていた。写真の撮影と仕上げ確認は同時である必要がないため、数字だけで被写体の目撃時刻を定められない。\n\n【付記・資料の読み方】\n受付の手書き規程には封筒の赤印を『処理完了』とする記述がある。ただし記入の漏れもあるため、規程が存在することから全件が同じ運用だったと断言しない。\n\n〔記録区分：ネガ・納品照会／3冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\n『青い傘』と記されたフィルム袋の控えは五月十五日の町内行事A班に属する。ただし、店では焼き増しを新しい整理番号で登録するため、フィルム袋と封筒の番号が一致しない例が多い。数字の違いだけから不正な入替えを推定するのは早い。\n\n【付記・資料の読み方】\nネガ袋の管理番号は撮影単位、焼き増し封筒の番号は注文単位である。番号の末尾が異なるのは、この二種類の管理の目的が異なるためかもしれない。\n\n〔記録区分：ネガ・納品照会／3冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\n受付予定表には二十一時以降も複数件の処理予定が記されていた。しかし担当者が予定どおり働いた証拠にはならない。処理済みの朱丸も、繁忙日には『優先』の意味で用いたことがあり、記号の意味が一定していない。完了印だと決めつけることは避ける。\n\n【付記・資料の読み方】\n朱色の丸印は担当者によって意味が違った。新しい係員は完了印として用い、繁忙期の主任は優先印として用いた。記号の意味を一律に定義する前に書いた人物を確かめる。\n\n〔記録区分：ネガ・納品照会／3冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\n事件後の地方紙は『午後九時四十五分の撮影が最後』と報じたが、根拠は封筒に書かれた数字だけだった。六月の小さな訂正で、撮影時間ではなく作業記録の可能性を記した。その記事を複数の町内広報が再掲していても、独立した情報源は増えていない。\n\n【付記・資料の読み方】\n新聞の『最後の撮影』という言葉は誰の直接証言でもなかった。紙面に載った時点で事実らしく見えるが、出所をたどると封筒の数字という一つの記録に戻る。\n\n〔記録区分：ネガ・納品照会／3冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【青篠写真館事件】\n対象日付：1993年05月16日\n対象：峰岸紀子　場所：青篠写真館・資料室\n\nこの記録の組み合わせから言えるのは、封筒の二一・四五が助手の生存を証明しないということだけである。写真の撮影日について十五日の可能性はあるが、処理担当者の確定には至っていない。犯人と犯行の時刻は未解明として保留する。\n\n【付記・資料の読み方】\n正しく推定できるのは撮影と処理が別の時間に行われうるという構造であり、誰がどの時刻に作業したかは別途調査が必要。意味の違う日付を一列に並べただけでは、行動の時系列にはならない。\n\n〔記録区分：ネガ・納品照会／3冊目。記載の評価は当時の時点に限る。〕"]}]},{"folder":"M-05","name":"青葉台団地事件","date":"1994-12-02","books":[{"title":"青葉台団地事件／現場・通行記録","issuer":"東野署・刑事課","date":"1994-12-02","pages":["第1頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\n十二月二日夜、団地管理員の笠井正二が共同洗濯室で死亡しているのを巡回清掃員が発見した。管理棟と西棟の間には連絡通路があり、建物の改築前後で出入口の数が変わっている。給水工事のため当夜は作業員の通行が普段より多かった。\n\n【付記・資料の読み方】\n管理棟は入居者の出入りが少ない時間帯でも、点検業者と清掃員が通行する。通常日の閑散とした状況だけをもとに、事件当夜の通行者を限定することはできない。\n\n〔記録区分：現場・通行記録／1冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\nエレベーターの操作ログには午後九時五十分から十時十分まで十階停止の記録がない。これを『十階にいた人物は存在しない』との根拠にしたメモがある。しかしログが記録するのは装置の停止階であり、別の経路を通った人間の存在までは記録しない。\n\n【付記・資料の読み方】\n昇降機のログにない停止は記録の対象外だった可能性があるが、当夜の停止ログの欠落がすべて故障によると示す資料もない。記録のある対象とない対象を区別する。\n\n〔記録区分：現場・通行記録／1冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\n共同洗濯室には点検用の箱と清掃道具が置かれ、管理用の鍵が一本定位置になかった。靴跡の大部分は給水工事の作業範囲と重なり、個人を特定できなかった。壁時計は発見時に十一時六分を示したが、電池交換の記録がなく、犯行時刻とは認定していない。\n\n【付記・資料の読み方】\n管理室の時計は巡回担当者の腕時計と一致していなかった。発見時の針の位置を正確な実時間として採用すると、複数の行動が分単位で不可能になったように見えてしまう。\n\n〔記録区分：現場・通行記録／1冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\n建物の新しい図面には十階の非常階段から管理棟側の通路に出られる経路が描かれている。古い図面にはその接続がない。非常階段の扉は原則施錠だが、当夜は搬入のため開放されたという申告があり、施錠規程と実際の運用を区別する必要がある。\n\n【付記・資料の読み方】\n改築前の図面はファイルの先頭に挟まれていたため、関係者の一人が最初にそれを見て『非常階段は通れない』と誤認した。新図面は同じ束の後半に収められていた。\n\n〔記録区分：現場・通行記録／1冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\n現場で確定した通行者の氏名は限られる。昇降機の停止記録から導ける否定は『その時間帯にエレベーターが十階で停止したという記録はない』までである。人物が十階にいたか、洗濯室へ入れたかは、図面と工事記録を併せて確認する。\n\n【付記・資料の読み方】\n設備記録が何を測定したか確かめてから人物の行動へ結び付ける。停止の記録がないことは、停止を示す証拠がないという意味にとどまる。\n\n〔記録区分：現場・通行記録／1冊目。記載の評価は当時の時点に限る。〕"]},{"title":"青葉台団地事件／居住者・作業員聴取","issuer":"東野署・聴取係","date":"1994-12-02","pages":["第1頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\n巡回清掃員の村井千恵は午後十一時過ぎに洗濯室を訪れ、笠井を発見した。工事期間中は非常階段側の扉が開いていたと話す。九時頃には作業員に似た人物を見たが、顔を見たわけではない。発見した時刻と人物を見た時刻は別々に記録された。\n\n【付記・資料の読み方】\n村井が工事の人影を見た場所は管理棟の外側であり、十階の廊下ではない。土屋の証言と混同して同一人物が連続して移動したように書かない。\n\n〔記録区分：居住者・作業員聴取／2冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\n十階居住者の土屋晴江は午後十時頃、廊下で管理員に似た人影を見たと述べた。顔を正面から見ず、帽子と上着で判断した。エレベーターの音は聞かなかったが、テレビをつけていたため階段の足音は分からない。人がいたという観察と笠井だったという推測を分ける。\n\n【付記・資料の読み方】\n土屋は上着の色を覚えているが、帽子の形については自信がない。管理員に似ていたという感覚と、管理員本人だったという結論の間には距離がある。\n\n〔記録区分：居住者・作業員聴取／2冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\n給水点検員の小杉拓也は九時四十五分から十時十分まで西棟上階で作業したと説明する。作業票の階数は終了後にまとめて記入した。階段を使う場合もあったが、当夜の移動経路は思い出せない。作業票が示す場所と時間は、おおまかな作業範囲に限られる。\n\n【付記・資料の読み方】\n小杉の作業票は終業後のまとめ書きで、九階と十階の欄は必ずしも作業順を示さない。業務のための書類と事件の行動追跡のための書類は精度が異なる。\n\n〔記録区分：居住者・作業員聴取／2冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\n副主任の池田啓は八時に非常階段の扉を開放するよう指示した。終了後の施錠を誰に頼んだか覚えていない。鍵簿には笠井の署名があるが一日前の欄に記されており、記録の遅れが疑われる。管理業務の分担を巡り口論したことは認めている。\n\n【付記・資料の読み方】\n池田が『施錠を任せた』と言う相手は特定できていない。誰かに頼んだという意図と、実際に鍵が掛けられたという結果は別の事実として扱う。\n\n〔記録区分：居住者・作業員聴取／2冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\n土屋の人影、村井の作業員、小杉の作業票は同じ建物についての情報だが、同じ人物の行動を記したとは限らない。目撃の内容と後日の推測を区別すること。エレベーターの停止記録だけを根拠に誰かの証言全体を虚偽とみなすことは避ける。\n\n【付記・資料の読み方】\n目撃者のうち、人物の顔を直接確認したと断言する者はいない。廊下に人がいた可能性を記録しつつ、その人物の名前まで空欄に残すのは資料の欠落ではなく証拠の限界である。\n\n〔記録区分：居住者・作業員聴取／2冊目。記載の評価は当時の時点に限る。〕"]},{"title":"青葉台団地事件／設備・鍵管理照会","issuer":"東野署・管理資料係","date":"1994-12-02","pages":["第1頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\n保守会社は、昇降機ログが呼出し・停止階・異常停止を記すだけで、階段の通行者や乗客の氏名は記録しないと回答した。十階停止がない時刻があることは事実だが、別経路から十階に到達した可能性は否定できない。\n\n【付記・資料の読み方】\n昇降機の仕様書は床の階数を記録する装置であり、通行者を追跡する装置ではない。その記録から得られる否定の範囲を広げすぎないことが、照会文書の最後に明記された。\n\n〔記録区分：設備・鍵管理照会／3冊目。記載の評価は当時の時点に限る。〕","第2頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\n十一月末の設備点検書には非常階段の閉鎖不良があり、十二月二日の給水工事のため午後八時から十一時まで扉の開放を許可する作業命令が残っていた。通常の『夜間施錠』規程を、当夜の実運用としてそのまま適用してはならない。\n\n【付記・資料の読み方】\n扉の開放許可は十二月二日限りの臨時措置だった。通常日の施錠規程を正しいものとして採用しても、それを事件当日の事実と混同すれば移動可能性を誤る。\n\n〔記録区分：設備・鍵管理照会／3冊目。記載の評価は当時の時点に限る。〕","第3頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\n鍵貸出簿は返却の際にまとめて記入されることがあり、日付の欄にずれが生じる。笠井の署名が前日の欄にあることは不自然だが、それだけで偽造とは言えない。鍵の棚卸しが合っていたとしても、事件当夜の一時的な持出しを排除することはできない。\n\n【付記・資料の読み方】\n鍵簿の日付のずれは以前からの運用によっても生じうる。日付の違いを説明できたとしても、鍵を使用した人が事件と無関係だったとまでは導けない。\n\n〔記録区分：設備・鍵管理照会／3冊目。記載の評価は当時の時点に限る。〕","第4頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\n平成二年の改築で西棟の非常階段と管理棟側通路の接続が変更された。保管されていた旧図面では通れない箇所が、新図面では通行できる。図面の版を混ぜて理解すると、存在しない密室や不可能な移動が生まれるため、改訂日を優先して照合する。\n\n【付記・資料の読み方】\n図面の改訂日は施設名より重要である。同じ名称の『十階通路』であっても、その年にそこが通れたかは別に確認しなければならない。\n\n〔記録区分：設備・鍵管理照会／3冊目。記載の評価は当時の時点に限る。〕","第5頁 / 全5頁\n\n【青葉台団地事件】\n対象日付：1994年12月02日\n対象：笠井正二　場所：青葉台団地・共同洗濯室\n\n昇降機記録、非常階段開放命令、新図面、鍵簿の運用を合わせれば、階段を使う移動が可能だったことは示せる。しかし実際に誰が移動したのか、この移動が殺人に関係したのかは証明できない。施設記録から導ける結論の範囲を越えないこと。\n\n【付記・資料の読み方】\n四種類の資料を合わせれば、階段経由の移動が物理的には可能だったと分かる。しかし可能だったことは実際に行われたことの証明ではない。その差を残したまま事件資料として収蔵する。\n\n〔記録区分：設備・鍵管理照会／3冊目。記載の評価は当時の時点に限る。〕"]}]},{"folder":"M-06","name":"桜橋水門管理室殺人事件","date":"1995-02-17","solved":true,"books":[{"title":"桜橋水門管理室殺人事件／初動捜査・現場確認簿","issuer":"桜橋署・刑事第一係","date":"1995-02-18","pages":["第1頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：初動捜査・現場確認簿\n作成部署：桜橋署・刑事第一係\n\n平成七年二月十七日午後九時十二分、桜橋水門管理棟の記録室で県施設監査員、本庄信行の遺体が発見された。第一発見者は夜間警備員の塚原弘。発見の直前、管理棟の外廊下に照明が点いていたという。記録室の扉は閉まっていたが施錠されておらず、室内には椅子の転倒と書類の散乱が認められた。外部からの侵入を示す破損はない。負傷の状況から他者による加害が疑われ、死亡時刻を発見時刻と同一視せず捜査を開始した。現場では書類の保存状態を優先し、落下した紙片の位置を採寸して封入した。\n\n〔第1冊・1頁／資料閲覧用写し。記載事項は架空である。〕","第2頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：初動捜査・現場確認簿\n作成部署：桜橋署・刑事第一係\n\n本庄は午後七時五十二分に管理棟へ到着し、八時十分に監査用の帳簿を受け取った。八時三十三分には守衛室へ内線し、翌朝の照会に使う施設写真を取り出してほしいと依頼している。この通話は塚原が直接応対し、内容を守衛日誌に記したものである。八時三十八分頃、保守会社の瀬戸直人に似た人物が図面筒を持って搬入口側へ歩くのを塚原が見た。照明が暗いため顔の識別には自信がない。八時四十六分以後の明確な本人目撃はなく、九時十二分の発見までに空白がある。\n\n〔第1冊・2頁／資料閲覧用写し。記載事項は架空である。〕","第3頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：初動捜査・現場確認簿\n作成部署：桜橋署・刑事第一係\n\n記録室の机には『第二排水弁交換　四基』と書かれた請求書の写しと、現況点検の写真台帳があった。写真台帳の該当欄には、交換した弁は二基に見えると鉛筆で注が付されていた。一方、監査員が当日に持ち込んだとされる照合表の原本は、発見時には見当たらなかった。机の下には青い複写紙の断片が落ちており、切れた端の形を撮影した。元の紙が誰の所有物かは、この時点では特定しない。費用計上の誤りは殺害の動機になり得ても、それ自体が誰の犯行を証明するものではない。\n\n〔第1冊・3頁／資料閲覧用写し。記載事項は架空である。〕","第4頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：初動捜査・現場確認簿\n作成部署：桜橋署・刑事第一係\n\n管理棟には正面受付と設備搬入口の二つの出入口がある。搬入口の奥の通路から記録室の前へ出ることができる。保守作業用の鍵には番号が刻まれ、当日はB-4が貸し出されていた。設備扉は鍵を持たないと外から開けられないが、記録室そのものは共用の鍵で開閉できる。現場で鍵B-4は見つかっていない。夜間は通路の巡回が約三十分おきであり、巡回していない時間に人が出入りできないとまではいえない。正面と搬入口のどちらを使ったかは別の記録を参照する必要がある。\n\n〔第1冊・4頁／資料閲覧用写し。記載事項は架空である。〕","第5頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：初動捜査・現場確認簿\n作成部署：桜橋署・刑事第一係\n\n初動で関係者の聴取順を定める際、本庄が不正を指摘していた保守会社と、写真台帳を作った役所担当者を分けて扱うこととした。監査書類の二基と四基の相違について、写し間の改訂や計上単位の違いも考えられるため、会社の原票へ照会する。近隣で聞かれた騒音は水門の定期動作と混在し、室内の争いを直接聞いた者は確認されていない。警備員の曖昧な目撃と書類の差異を、単独で犯人認定の根拠にしない旨が捜査メモに残る。\n\n〔第1冊・5頁／資料閲覧用写し。記載事項は架空である。〕"]},{"title":"桜橋水門管理室殺人事件／鍵の管理と関係者供述","issuer":"桜橋署・聴取室","date":"1995-02-23","pages":["第1頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：鍵の管理と関係者供述\n作成部署：桜橋署・聴取室\n\n塚原弘は、十七日午後八時十二分に瀬戸直人へ設備用鍵B-4を渡し、受領簿へ署名してもらったと述べる。瀬戸は交換作業の報告書を取りに来たと説明した。瀬戸本人は八時十八分に鍵を返して退館したと主張するが、塚原はその返却を見ていない。塚原が九時七分に鍵を受け取った際には返却票へ時刻を書いた。受領簿の『八時十八分』は後から瀬戸が申告した時刻を余白へ転記したもので、目撃に基づく返却記録とは区別されている。\n\n〔第2冊・1頁／資料閲覧用写し。記載事項は架空である。〕","第2頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：鍵の管理と関係者供述\n作成部署：桜橋署・聴取室\n\n瀬戸は八時二十分には会社車庫に戻り、その後九時まで出荷予定の整理をしていたと説明した。車庫の日報には『20:45　在庫点検』という記載があり、一見すると本庄との接触を否定するように見える。しかし日報は作業後にまとめて清書する形式であり、押印欄にも時刻がない。保守会社の事務員は瀬戸が夜遅く事務所へ戻ったことは覚えているものの、八時台に本人を見たとは述べていない。作業の予定を示す記録と、本人の現実の所在を同じものとして扱うことはできない。\n\n〔第2冊・2頁／資料閲覧用写し。記載事項は架空である。〕","第3頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：鍵の管理と関係者供述\n作成部署：桜橋署・聴取室\n\n県施設課の吉村恵は、午後八時二十五分頃まで本庄と会話し、翌朝の会議用に請求書を並べていたという。八時三十二分の路線バスに間に合うよう北門から出たことを覚えているが、運転手による本人確認はない。吉村は瀬戸が請求額の再計算に難色を示していたと話す。ただし、監査資料の内容をめぐる対立は複数の業者にも及んでおり、吉村が誰かを犯人と特定できるだけの観察をしたわけではない。本人の手帳には『二基確認、四基請求』と書かれている。\n\n〔第2冊・3頁／資料閲覧用写し。記載事項は架空である。〕","第4頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：鍵の管理と関係者供述\n作成部署：桜橋署・聴取室\n\n塚原は八時三十八分頃の搬入口の人物を瀬戸だと思った理由として、丸めた青い図面筒と作業服の肩章を挙げる。ただし同社の従業員は同じ肩章を使う。約二十分後に守衛室を離れた際、管理棟西側の扉が半開きだったことに気付いたというが、誰が開けたかは見ていない。現場の足跡は巡回警備員と設備作業員のものが混在していた。『見た』事柄と『そうだと思った』事柄を別欄に分け、他の記録との照合まで人物の同定を保留した。\n\n〔第2冊・4頁／資料閲覧用写し。記載事項は架空である。〕","第5頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：鍵の管理と関係者供述\n作成部署：桜橋署・聴取室\n\n瀬戸は、九時七分に鍵を返したのは車庫へ戻る途中でポケットに残っていたのに気付いたからだと説明した。これを認めても、鍵を持っていた間ずっと管理棟内にいたことにはならない。ただし八時十八分返却という先の供述とは両立しない。日報の八時四十五分は事務上の処理時刻で、直接目撃は伴わない。捜査側はこの二つを根拠に、瀬戸の『八時十八分退館』という説明が独立証拠に支えられていないことを確認し、監査表の所在を優先して調べる方針とした。\n\n〔第2冊・5頁／資料閲覧用写し。記載事項は架空である。〕"]},{"title":"桜橋水門管理室殺人事件／工事原票・紙片照合記録","issuer":"県警捜査資料係","date":"1995-03-04","pages":["第1頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：工事原票・紙片照合記録\n作成部署：県警捜査資料係\n\n県施設課が保管する工事完了写真の原簿には、第二排水弁について交換完了を示す写真が二基分だけ綴られていた。請負会社の請求書には四基とあるが、取り外した旧部品の引取票も二基分である。残る二基が別の月に交換された可能性は検討したものの、対応する入庫票と作業者の立会署名は見つからなかった。写真の枚数だけでは施工件数は確定しないが、引取票との重なりによって、四基交換済みという会社の説明には裏付けが欠けていることが分かる。\n\n〔第3冊・1頁／資料閲覧用写し。記載事項は架空である。〕","第2頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：工事原票・紙片照合記録\n作成部署：県警捜査資料係\n\n机の下の青い複写紙片は、保守会社が監査への回答に使っていた三枚複写の訂正票と材質が一致した。ただし同じ材質の紙は役所内にもあったため、材質だけで所有者を特定しなかった。瀬戸の事務机から提出された未使用の訂正票綴りには一枚分が欠けており、その切断端と現場紙片を実体で重ねた結果、紙の繊維の凹凸と二つの小さな破れ目が連続した。照合の手順は写真と寸法図に記録し、紙片を後から切って合わせたものではないことを封印番号で確認した。\n\n〔第3冊・2頁／資料閲覧用写し。記載事項は架空である。〕","第3頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：工事原票・紙片照合記録\n作成部署：県警捜査資料係\n\n紙片が元の訂正票綴りから分かれたことは示せても、瀬戸本人が当夜引き裂いたかどうかまでは直接分からない。訂正票は事務所の机に置かれ、同僚が使用する場合もあった。そこで監査員が当夜持っていた照合表を探し、書類の所在から複写票の持ち出し経緯を確認することとした。会社の一般的な印刷用紙と、断端が一致する個別の紙は証明力が異なるため、報告書では二つの照合結果を混同しないよう分けて記した。\n\n〔第3冊・3頁／資料閲覧用写し。記載事項は架空である。〕","第4頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：工事原票・紙片照合記録\n作成部署：県警捜査資料係\n\n二月二十二日の立会確認で、保守会社の予備資料箱に未提出の監査照合表が挟まっていた。箱は会社の共同倉庫に置かれ、出入りできる従業員が複数いる。そのため発見場所だけで瀬戸の所有物とは断定できない。ただし封筒の宛名は本庄宛で、記入済みの鉛筆修正と紙端の折り目が現場写真の控えと一致した。瀬戸は最初、この表を見たことがないと述べていたが、予備資料箱の管理は本人の担当業務とされていた。\n\n〔第3冊・4頁／資料閲覧用写し。記載事項は架空である。〕","第5頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：工事原票・紙片照合記録\n作成部署：県警捜査資料係\n\n照合資料を総合すると、欠けた訂正票が本庄の記録室にあり、原本の監査照合表が保守会社側へ戻っていたことになる。両者の移動経路を記録した直接の映像はなく、他者による持ち出しの可能性はこの段階では完全には除外できない。一方、瀬戸が帳簿の再提出を求められていたこと、当夜設備鍵を保持していたこと、本人の退館時刻が日報と一致しないことは互いに別の資料から確認できる。これらを犯人認定と同一視せず、続く供述と整合性を確かめる。\n\n〔第3冊・5頁／資料閲覧用写し。記載事項は架空である。〕"]},{"title":"桜橋水門管理室殺人事件／供述照合・送致結論","issuer":"桜橋署・事件整理係","date":"1995-03-19","pages":["第1頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：供述照合・送致結論\n作成部署：桜橋署・事件整理係\n\n三月十一日、瀬戸直人は先の退館供述を撤回し、午後八時三十八分頃に管理棟へ戻ったと認めた。瀬戸は監査照合表を持ち帰るよう本庄に求め、拒否された後に口論となり、結果として本庄を死亡させたと供述した。動機の説明には、請求書に四基と記しながら実際の交換が二基であったこと、監査で代金の返還を求められることを恐れた事情が含まれる。供述の存在だけをもって全項目を真実とせず、独立資料で確認できる部分を整理した。\n\n〔第4冊・1頁／資料閲覧用写し。記載事項は架空である。〕","第2頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：供述照合・送致結論\n作成部署：桜橋署・事件整理係\n\n瀬戸は供述の中で、監査照合表の一部が青い複写票に挟まれていたこと、紙を引っ張った際に片端が裂けたこと、図面筒と別に書類を持ち出したことを説明した。裂けた紙の位置と欠けた訂正票の形は現場で撮影済みの記録と一致した。この位置の詳細は、それまで公表されていなかった。予備資料箱への移動経緯も具体的に説明され、箱を最初に確認した際の封筒と照合した。知られていない内容との一致を、単なる一般的な自白とは区別して評価した。\n\n〔第4冊・2頁／資料閲覧用写し。記載事項は架空である。〕","第3頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：供述照合・送致結論\n作成部署：桜橋署・事件整理係\n\n瀬戸の説明する八時三十八分から九時七分の行動は、鍵の所持と返却時刻、警備員の目撃、照合表の消失と矛盾しない。県施設課の写真原簿と引取票は請求額の問題を裏付ける。ただし犯行の瞬間を見た者はいないため、警備員の曖昧な人物同定だけで結論を構成したわけではない。訂正票の断端、隠された照合表、秘匿していた現場状況の具体的供述が、互いに異なる角度から瀬戸の関与を支持している。\n\n〔第4冊・3頁／資料閲覧用写し。記載事項は架空である。〕","第4頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：供述照合・送致結論\n作成部署：桜橋署・事件整理係\n\n最初に嫌疑を受けた吉村恵については、帳簿の差異を指摘した人物であることと殺害の行為者であることは別だと整理した。吉村がバスに乗ったという供述だけで完全な不在証明をしたわけではないが、現場紙片と鍵の移動について彼女に結びつく独立資料は得られなかった。塚原は管理棟へ近づく人影を見ていたが、内線に応答した時刻まで本庄が生存していたという観察の方が重要だった。捜査では、疑わしい印象の人物よりも、説明の成り立つ証拠を重視した。\n\n〔第4冊・4頁／資料閲覧用写し。記載事項は架空である。〕","第5頁 / 全5頁\n\n事件番号：M-06\n件名：桜橋水門管理室殺人事件\n対象事件日：1995年02月17日\n記録区分：供述照合・送致結論\n作成部署：桜橋署・事件整理係\n\n桜橋署は瀬戸直人を本庄信行殺害の被疑者として送致した。その後の裁判記録の整理欄では、本人の供述と現場記録、紙片照合、監査表の回収状況が整合することを理由に有罪の認定が記されている。工事の過大請求については別途会計上の調査対象として扱われ、殺人の証明と混同されていない。本件は犯人が判明した事件として収蔵される。ただし目撃だけで犯人が確定したわけではなく、複数の独立資料を重ねることで最初の解釈が改められた。\n\n〔第4冊・5頁／資料閲覧用写し。記載事項は架空である。〕"]}]},{"folder":"M-07","name":"西紺町印刷所殺人事件","date":"1996-07-24","solved":true,"books":[{"title":"西紺町印刷所殺人事件／初動・事件当夜記録","issuer":"西紺署・刑事課","date":"1996-07-25","pages":["第1頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：初動・事件当夜記録\n作成部署：西紺署・刑事課\n\n平成八年七月二十四日午後九時三十二分、岸田印刷所の校正室で工場長の榎本千代が倒れているのを夜勤責任者の原島が発見した。室内には検品待ちの印刷見本と経理伝票が散らばり、負傷の状況から殺人の疑いが認められた。校正室の扉は施錠されず、東側の製版室からも近づける構造だった。印刷機の稼働音が大きいため、現場付近の作業員は不審な物音を聞いていない。発見時刻は連絡票に残るが、被害者が最後に活動した時刻とは区別する。\n\n〔第1冊・1頁／資料閲覧用写し。記載事項は架空である。〕","第2頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：初動・事件当夜記録\n作成部署：西紺署・刑事課\n\n工場の日誌によると、榎本は午後八時二十六分に発送前の見本を確認した。八時四十七分、夜勤の製版担当・津村亮が一度退勤した。九時四分には津村名義のカードに『再入構』の打刻が残り、九時二十二分に工場長の姿が見えないとの報告がある。夜勤責任者はカードの数字を見て『津村が戻ったのだろう』と推測したが、打刻機の場所にいた人を直接見ていなかった。人が押した記録と、誰の名義の紙が押されたかは別の事柄である。\n\n〔第1冊・2頁／資料閲覧用写し。記載事項は架空である。〕","第3頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：初動・事件当夜記録\n作成部署：西紺署・刑事課\n\n榎本の机には未整理の仕入れ原票があり、同じ月の用紙発注を示す伝票が二系統存在していた。一方は経理部の控え、もう一方は受入係の検収印を持つ票で、金額と数量が一致しない。経理主任の高科恭子は『単価改訂が反映されていない』と説明した。差異だけで架空支出と断言できないため、実際の納品記録と翌朝の確認会の議題を照会することにした。机上の黒い紙袋が一つ見当たらないとの申告もあったが、袋の内容は未確認である。\n\n〔第1冊・3頁／資料閲覧用写し。記載事項は架空である。〕","第4頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：初動・事件当夜記録\n作成部署：西紺署・刑事課\n\nタイムカード打刻機は作業場の外、休憩室と廊下の間に据え付けられていた。カードを持っていれば本人以外でも押すことができ、打刻自体には個人識別機能がない。帰宅した作業員のカードを翌日修正することもあり、カードが機械の横にまとめて置かれる時間帯があった。製版担当の津村は、遅番でありながら薬局へ立ち寄る予定があると同僚に伝えていた。カードだけをもって、九時四分の現場到着を証明しないことが記されている。\n\n〔第1冊・4頁／資料閲覧用写し。記載事項は架空である。〕","第5頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：初動・事件当夜記録\n作成部署：西紺署・刑事課\n\n初動捜査では『退勤後に戻った津村』と『帳簿の差異を知る高科』の双方を聴取対象とした。夜勤責任者は九時十分頃に東口を通る人影を見たものの、白い作業服の背中のみで個人を特定していない。高科は午後八時十五分に事務所を出て帰宅したと主張したが、その後の所在を直接証明する資料を提出していない。物的資料は未だ断片的であり、先に犯人を決めてカードと金銭記録を都合よく読むことを避ける。\n\n〔第1冊・5頁／資料閲覧用写し。記載事項は架空である。〕"]},{"title":"西紺町印刷所殺人事件／従業員聴取・アリバイ確認","issuer":"西紺署・聴取係","date":"1996-07-29","pages":["第1頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：従業員聴取・アリバイ確認\n作成部署：西紺署・聴取係\n\n津村亮は午後八時四十七分に退勤して近隣の薬局へ向かい、帰宅後は会社に戻っていないと述べた。九時四分の再入構打刻を知って驚き、カードは退勤時に打刻機の横へ置いたと話した。本人が時間を確認するために使った腕時計は数分進んでいた可能性があり、単独では行動の分単位の証明にならない。ただし薬局の窓口係は、津村に処方ではない家庭用品を渡した記憶があり、その夜の販売簿に対応する金額が残っていた。\n\n〔第2冊・1頁／資料閲覧用写し。記載事項は架空である。〕","第2頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：従業員聴取・アリバイ確認\n作成部署：西紺署・聴取係\n\n薬局の販売簿には午後九時三分頃の取引が記載されており、津村が商品を受け取ったという窓口係の証言と一致した。販売簿は後から時間をまとめて記した可能性があるので、これだけで九時四分に工場へ戻ることが不可能とは断定しない。薬局から工場までの移動経路は約三キロで、徒歩なら短時間では戻れないが、車両等の利用を完全に排除できない。従って九時四分の打刻を否定する主根拠は、カードが本人を識別しない仕組みと、別の確認資料に置く。\n\n〔第2冊・2頁／資料閲覧用写し。記載事項は架空である。〕","第3頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：従業員聴取・アリバイ確認\n作成部署：西紺署・聴取係\n\n経理主任の高科恭子は午後八時十五分に帰宅し、午後九時前から自宅で電話連絡の準備をしていたと述べた。自宅の固定電話の通話票には九時十六分頃、勤務先へ短時間の発信が記されている。ただし電話を誰が操作したかは通話票に表示されない。高科の家族は当夜不在で、本人が帰宅していたかどうか独立して確認する人物はいない。通話票を入手しただけで、通話時刻まで自宅にいたとの説明を完全に裏付けたことにはならない。\n\n〔第2冊・3頁／資料閲覧用写し。記載事項は架空である。〕","第4頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：従業員聴取・アリバイ確認\n作成部署：西紺署・聴取係\n\n夜勤責任者の原島は、九時四分のカード打刻音を聞いたが、打刻機の前に誰が立っていたか見なかったという。九時二十二分には榎本を探し始めた。原島は『高科は帳簿に細かく、遅くまで残ることもあった』と述べたが、事件の夜に本人が残ったと見たわけではない。白い作業服の人影については従業員共通の服装だったため、津村にも高科にも限定できないと再聴取で修正した。\n\n〔第2冊・4頁／資料閲覧用写し。記載事項は架空である。〕","第5頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：従業員聴取・アリバイ確認\n作成部署：西紺署・聴取係\n\n従業員からは、榎本が翌朝の会議で仕入れ支出の差額について説明するつもりだという話が出た。これを直接聞いた者は受入係の柴田で、『帳簿と納品を合わせたい』という表現だったと述べる。高科がその会議を避けたいと考えていた可能性は動機の一部にすぎず、行為の証明にはならない。津村のカードと高科の帰宅申告は、記録の目的が異なることを踏まえて、受入票と打刻機の運用記録に照らして検証する。\n\n〔第2冊・5頁／資料閲覧用写し。記載事項は架空である。〕"]},{"title":"西紺町印刷所殺人事件／打刻・会計記録の照合","issuer":"西紺署・資料照会係","date":"1996-08-07","pages":["第1頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：打刻・会計記録の照合\n作成部署：西紺署・資料照会係\n\n打刻機メーカーの照会回答では、機械が判別するのはカードの所定欄のみで、氏名や本人の存在を認証する機構はないと確認された。津村名義の九時四分の打刻は機械の記録として存在するが、本人の再入構を示さない。夜間の退勤カード置場は施錠されず、経理部も勤務時間の修正作業のためにカードを扱えた。事件当夜に誰が打刻したかは、この照会だけでは分からない。\n\n〔第3冊・1頁／資料閲覧用写し。記載事項は架空である。〕","第2頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：打刻・会計記録の照合\n作成部署：西紺署・資料照会係\n\n受入係の検収票では、七月に請求された上質紙百二十箱のうち、実際に検収印があるのは八十箱分だった。残る四十箱について倉庫の受入欄は空白で、製造部の印刷予定にも使途が見当たらない。経理部の支払一覧は百二十箱で計算されており、差額は翌朝の確認会に付される予定だった。この不一致が単なる記入漏れか、実物のない請求かを確かめるため、納入業者の控えと出庫票を照会した。\n\n〔第3冊・2頁／資料閲覧用写し。記載事項は架空である。〕","第3頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：打刻・会計記録の照合\n作成部署：西紺署・資料照会係\n\n納入業者の伝票控えでは、その月の納品は八十箱のみで、残る四十箱を発注した記録はなかった。高科が説明した単価改訂だけでは箱数の差は解消しない。経理部の百二十箱分の支払票にある訂正印は、経理主任が管理する印と一致するが、部内の代理使用例もあるため印だけで不正の実行者を特定しない。榎本がまとめていたとされる検算表のコピーは、現場から一枚だけ欠けていた。\n\n〔第3冊・3頁／資料閲覧用写し。記載事項は架空である。〕","第4頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：打刻・会計記録の照合\n作成部署：西紺署・資料照会係\n\n夜勤の勤怠修正簿には『津村・再打刻の確認』という付箋があった。付箋の筆跡は高科の業務メモに似るが、筆跡の印象による人物特定は避けた。勤怠修正簿は経理部の書類箱で保管され、処理の担当欄は高科の印字名になっていた。経理課の職員は同日夕刻、夜勤職員のカードをまとめて確認するため高科がカードの束を持っていったと証言している。カードを手にした可能性は高まったが、九時四分の打刻行為を実際に見た者はいない。\n\n〔第3冊・4頁／資料閲覧用写し。記載事項は架空である。〕","第5頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：打刻・会計記録の照合\n作成部署：西紺署・資料照会係\n\n八月三日の書類保全手続で、高科の管理する経理書類箱から榎本の検算表の原本とみられる紙が発見された。用紙の作成年月日、手書きの検算記号、榎本の事務机に残った控えの番号が連続している。箱は経理部の共同書庫の中にあったが、高科個人の業務用品も入っており、他人の出し入れを全く排除できない。発見自体は強い疑問を生むが、紙の保管場所だけで殺人への関与を結論づけるのは早計とした。\n\n〔第3冊・5頁／資料閲覧用写し。記載事項は架空である。〕"]},{"title":"西紺町印刷所殺人事件／犯人特定・認定理由","issuer":"西紺署・事件整理係","date":"1996-08-21","pages":["第1頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：犯人特定・認定理由\n作成部署：西紺署・事件整理係\n\n八月十三日の再聴取で高科恭子は、夜勤者の帰宅後に津村名義のカードを打刻機へ差し込み、九時四分の再入構記録を作ったことを認めた。高科は榎本に架空請求を見抜かれたと感じ、翌朝の確認会を避けようと校正室で話し合った末に榎本を死亡させたと供述した。自らが退館したという先の説明も撤回した。供述が出たというだけで事件の全てを認定せず、カードの管理記録、紙の所在、現場の未公表情報と照合した。\n\n〔第4冊・1頁／資料閲覧用写し。記載事項は架空である。〕","第2頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：犯人特定・認定理由\n作成部署：西紺署・事件整理係\n\n高科は、榎本が校正室で資料を示した際、検算表を黒い紙袋へ入れていたと説明した。その後袋から紙を取り出し、自分の経理書類箱へしまったという。黒い紙袋が現場に残っていなかったことは初動の写真に記録されているが、袋の裏側に付いた小さな銀色の閉じ具については当時公表されていなかった。高科はこの閉じ具の形と袋の保管場所を自ら説明し、後日、指示した倉庫の用品棚から該当袋が回収された。\n\n〔第4冊・2頁／資料閲覧用写し。記載事項は架空である。〕","第3頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：犯人特定・認定理由\n作成部署：西紺署・事件整理係\n\nタイムカードの打刻時刻は事実でも、本人の在場を証明しないことが機器仕様と職場慣行から明らかになった。津村の薬局の記録には誤差があるため、それだけを完全な不在証明として利用していない。高科による代理打刻の説明は、同人がカード束を夕刻に扱っていたという同僚の証言と矛盾しない。榎本の検算表が経理書類箱にあった理由も本人の供述で説明され、受入票と納入業者の記録は架空の四十箱を裏付けている。\n\n〔第4冊・3頁／資料閲覧用写し。記載事項は架空である。〕","第4頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：犯人特定・認定理由\n作成部署：西紺署・事件整理係\n\n原島が見た白い作業服の人影を、後から高科だったと断定してはならない。証言の解釈が犯人の供述に引き寄せられることを避けるため、人物同定の欄は『不明』のまま保持した。また経理部の訂正印も共用され得るため、殺害の行為を直接証明する資料とは扱わない。今回の認定において決定的だったのは、非公表だった袋の特徴と回収先、本人による打刻行為の説明、独立した帳簿上の不正資料の一致である。\n\n〔第4冊・4頁／資料閲覧用写し。記載事項は架空である。〕","第5頁 / 全5頁\n\n事件番号：M-07\n件名：西紺町印刷所殺人事件\n対象事件日：1996年07月24日\n記録区分：犯人特定・認定理由\n作成部署：西紺署・事件整理係\n\n西紺署は高科恭子を榎本千代殺害の被疑者として送致した。後の裁判記録の整理欄には、当人の供述が実際に回収された紙袋の特徴と場所、検算表の所在、勤怠カードの管理実態に裏付けられたとして有罪の認定が記されている。架空請求に関する会計上の責任は殺人とは別に扱われた。本事件は犯人が判明した事件として収蔵される。見かけの『戻ってきた津村』という情報を鵜呑みにしなかったことが、犯人特定への重要な転換点だった。\n\n〔第4冊・5頁／資料閲覧用写し。記載事項は架空である。〕"]}]},{"folder":"M-08","name":"鷺浜補給所殺人事件","date":"1997-09-24","solved":false,"status":"未解決・主要証拠品未回収","books":[{"title":"鷺浜補給所殺人事件／初動・暴風夜の現場記録","date":"1997-09-26","issuer":"鷺浜署・刑事第一係","pages":["第1頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年09月26日\n記録区分：鷺浜補給所殺人事件／初動・暴風夜の現場記録\n\n一　発見と通報\n平成九年九月二十四日午後九時四十八分、鷺浜の旧防波堤にある灯台補給所で、県の設備検査員・伊奈秀樹（四十四歳）が死亡しているのを当直員の三沢治が発見した。場所は補給所の東側資材室。三沢は停電後の排水確認のため開いた扉の内側に伊奈が倒れていたと述べる。医師による検査で頭部への外力をうかがわせる所見があり、単なる転倒事故では説明しにくい点から殺人事件として扱うこととなった。\n\n同夜は台風の接近に伴う大雨と高波があり、午後九時過ぎには防波堤側の通路へ海水が流れ込んでいた。発見時、資材室の床にも泥水が入っていた。現場に物がないことをすべて持ち去りと解釈すること、流失をすべて事故として片付けることの双方を避けるよう初動記録に注記した。\n\n〔第1冊・1頁／閲覧用の写し。人物・場所・出来事は創作。〕","第2頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年09月26日\n記録区分：鷺浜補給所殺人事件／初動・暴風夜の現場記録\n\n二　来訪者と構内の配置\n伊奈は午後七時五十五分、青い防水布の書類袋を肩に掛けて正門から入所した。袋には黄色の縫い糸で短い横線があり、当直員の三沢と受付簿係が特徴を別々に記憶している。伊奈は前月の燃料移送に関する照会のため来訪した。翌日、市の管理課へ提出する点検資料を持っていた可能性はあるが、持参した全書類の目録は残っていない。\n\n補給所には正門、海側の荷揚げ口、資材室に通じる外階段がある。通常、荷揚げ口は夜間閉鎖されるが、荒天時には係留索を確認するため開けることがある。建物内の廊下には監視カメラがなく、正門受付簿も人名を手書きする運用だった。門を通った記録がない人物が絶対に構内へ入れなかったという条件ではない。\n\n〔第1冊・2頁／閲覧用の写し。人物・場所・出来事は創作。〕","第3頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年09月26日\n記録区分：鷺浜補給所殺人事件／初動・暴風夜の現場記録\n\n三　確認できる最後の行動\n午後八時十二分、伊奈は管理課の職員へ補給所から電話し、「旧移送伝票の数量欄を見たい」と依頼した。管理課側は声を伊奈と確認し、電話内容を翌朝に記録した。この通話は当夜の生存を示す資料として採用するが、受け手が書き取った文言は逐語ではない。\n\n午後八時三十七分頃、資材室側から金属の響く音を聞いたという証言が一件ある。しかし高波で防波堤の扉が揺れ、係留具が打ち合う音も頻繁にしていた。午後八時四十三分には停電を示す当直日誌の印があり、非常照明が短時間点灯した。停電後の人物の位置は誰も連続して見ていない。最後の電話、金属音、停電を一列に並べても、加害行為が起きた時刻はまだ決まらない。\n\n〔第1冊・3頁／閲覧用の写し。人物・場所・出来事は創作。〕","第4頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年09月26日\n記録区分：鷺浜補給所殺人事件／初動・暴風夜の現場記録\n\n四　現場の変化と保存条件\n発見時の資材室では、棚から外れた伝票箱が床に落ち、資材を留める鉄製の環が一つ曲がっていた。倉庫では日常的に荷揚げ用の鉄棒と環を使っており、そのどれが事故前から曲がっていたかの記録はない。棚の隅にあった紙片は海水を吸い、文字を判読できなかった。\n\n警察到着後も高波が続いたため、現場の全区画を一度に封鎖できなかった。救助と排水作業を優先して動かした物には作業順に印を付けたが、印を付ける前に水が達した場所もあった。資材室から外へ流れ出た軽い物の全量は不明で、書類袋が発見されなかった理由をこの時点で一つに決められない。\n\n〔第1冊・4頁／閲覧用の写し。人物・場所・出来事は創作。〕","第5頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年09月26日\n記録区分：鷺浜補給所殺人事件／初動・暴風夜の現場記録\n\n五　初動の証拠目録\n現場から封入した物は、曲がった係留環（仮番号K-01）、濡れた伝票箱の金具（K-02）、床から採った泥の試料（K-03）など。いずれも加害に用いた物だと確定していない。伊奈が持参した青い書類袋は発見されず、似た色の布片も現場で回収できなかった。船舶用の測深棒が一本見当たらないとの申告があったが、直近の備品棚卸しが三か月前で、事件当日に存在したかさえ確認できない。\n\n午後十一時過ぎ、海側の捜索を危険として打ち切った。再開可能な潮位を記録し、晴天後の発見を見込んで漂着地の担当を定める。『ない物』を犯人が持ち去った証拠としない一方、重要物が失われている可能性は継続して追う。\n\n〔第1冊・5頁／閲覧用の写し。人物・場所・出来事は創作。〕"]},{"title":"鷺浜補給所殺人事件／当直員・関係者聴取","date":"1997-10-03","issuer":"鷺浜署・聴取係","pages":["第1頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年10月03日\n記録区分：鷺浜補給所殺人事件／当直員・関係者聴取\n\n一　当直員・三沢治\n三沢は伊奈を午後七時五十五分に迎え、八時過ぎに資材室へ案内した。伊奈が持っていた青い袋の黄色い線は、いつも携える袋だと思ったので覚えているという。三沢は八時二十分頃に事務室へ戻り、九時の高波で排水口が詰まっていたため点検を続けた。九時四十八分の発見まで伊奈を再び見ていない。\n\n三沢の作業日誌には八時三十七分に『金具音』と書かれているが、三沢自身はこの音を聞いていない。別の職員が口頭で報告したものを代筆したと説明した。誰から聞いたかについて最初は中垣修を挙げ、後に記憶が不確かだと訂正した。代筆の一行を独立した二人の目撃として数えることはできない。\n\n〔第2冊・1頁／閲覧用の写し。人物・場所・出来事は創作。〕","第2頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年10月03日\n記録区分：鷺浜補給所殺人事件／当直員・関係者聴取\n\n二　保守作業員・中垣修\n中垣は事件の二日前、燃料移送の数量が帳簿と合わないと伊奈から質問された。二十四日の夜は午後八時半まで荷揚げ口付近で安全索を点検し、その後車で帰ったと話す。構内に自家用車があったことは同僚が確認したが、退出の正確な時刻は本人の記憶に頼っている。\n\n中垣は黒い作業着を着ており、事件後に『暗い服の人物を見た』という証言から名前が挙がった。しかし補給所では夜間の防水着が共通支給品だった。中垣は伊奈と口論していないと主張する一方、伝票の数字が合わなかったことは認めた。帳簿の不一致は疑う理由にはなるが、資材室で伊奈を傷つけたことの証明にはならない。\n\n〔第2冊・2頁／閲覧用の写し。人物・場所・出来事は創作。〕","第3頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年10月03日\n記録区分：鷺浜補給所殺人事件／当直員・関係者聴取\n\n三　港湾事務員・有馬澄江\n有馬は港側の小事務所で、伊奈が求めていた旧伝票の写しを用意していた。午後八時十五分頃に伊奈の声らしい電話を聞いたが、会話は隣室越しで、通話相手を直接見ていない。午後八時四十分、補給所へ渡ろうとしたが強風で引き返したという。港の巡回記録に『通行中止』の印があり、この説明とは矛盾しない。\n\n有馬は伊奈が『青い袋の中を見せないで』と言ったと最初に述べたが、再聴取では前週の書類整理時の言葉と混同した可能性を認めた。誰が袋の中身を知っていたか、袋を狙う理由があったかは、この供述だけで断定できない。\n\n〔第2冊・3頁／閲覧用の写し。人物・場所・出来事は創作。〕","第4頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年10月03日\n記録区分：鷺浜補給所殺人事件／当直員・関係者聴取\n\n四　夜の海側で見られた人影\n釣船の係留を見回っていた森下隆は、午後八時五十分頃、補給所の海側通路で「肩に何か掛けた人物」を見たと話した。風雨が激しく、距離は三十メートルほどだった。袋の色や人物の性別は見えず、肩の荷物が図面筒か救命具かも分からない。森下は目撃直後に別の船の係留索を締めており、当時の時刻は船内時計から後で推定した。\n\n森下が話した『青い袋の男』という表現は、新聞社の取材で初めて現れた。森下の原調書には袋の色も性別もない。記事を再掲した複数の町内資料を追加証言とみなさないこと。\n\n〔第2冊・4頁／閲覧用の写し。人物・場所・出来事は創作。〕","第5頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年10月03日\n記録区分：鷺浜補給所殺人事件／当直員・関係者聴取\n\n五　供述の重なりと穴\n現場に確実にいた人物として伊奈と三沢が挙がり、中垣の滞在も一部裏付けられている。ただし門の記録は全経路を覆っておらず、三沢も八時二十分以降、伊奈を見ていない。有馬は港側で動いており、来訪を断念したという記録がある。誰も資材室の争いそのものを見ていない。\n\n証言を合わせると、八時十二分の通話以後、伊奈の所在に空白が生じる。八時三十七分の金属音は音源が特定できず、八時五十分の人影も誰か分からない。この空白に特定人物を置くには、本人固有の物的資料か、より確かな独立の目撃が必要だが、いずれも得られていない。\n\n〔第2冊・5頁／閲覧用の写し。人物・場所・出来事は創作。〕"]},{"title":"鷺浜補給所殺人事件／海水流入・物証捜索簿","date":"1997-11-11","issuer":"県警・遺留品確認係","pages":["第1頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年11月11日\n記録区分：鷺浜補給所殺人事件／海水流入・物証捜索簿\n\n一　袋の所在調査\n伊奈の青い防水布袋について、正門へ入る際に肩に掛けていたことは受付簿係と三沢が別々に証言した。しかし発見後、本人の身辺からは見つからない。資材室東壁には床上二十八センチほどまで海水が達した跡があり、軽い物が通路へ流れ出る可能性はある。一方、袋の大きさや中の書類の量によってはその場に留まることも考えられる。\n\n十月二日までに防波堤、港内の網場、海浜の漂着地点を捜索したが、黄色い線のある袋は回収されなかった。見つからない理由が流失なのか、持ち出しなのか、そもそも別の場所に置かれたのかを決める資料はない。\n\n〔第3冊・1頁／閲覧用の写し。人物・場所・出来事は創作。〕","第2頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年11月11日\n記録区分：鷺浜補給所殺人事件／海水流入・物証捜索簿\n\n二　測深棒の棚卸し\n補給所の資材管理帳には測深棒が六本と記されていた。九月二十五日の仮点検では五本しか数えられなかったため、一本が凶器に使われて持ち去られたとの推測が広まった。しかし最後に六本を現物確認したのは六月の棚卸しで、夏季の船舶貸出簿に未返却の記載もある。測深棒の先端形状は職員によって異なり、種類の統一もされていなかった。\n\n遺体の損傷が棒状の硬い物による可能性は検討されたが、測深棒と一致すると断定できる個別の痕跡はない。なくなった一本が二十四日にそこにあったと確認できなければ、事件現場から消えた凶器と認定できない。\n\n〔第3冊・2頁／閲覧用の写し。人物・場所・出来事は創作。〕","第3頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年11月11日\n記録区分：鷺浜補給所殺人事件／海水流入・物証捜索簿\n\n三　回収試料の限界\n泥の試料K-03には港湾の砂、錆、塗料片が混在した。補給所の海水流入前の床も日常的に泥を持ち込む場所であり、粒子の種類から特定の靴や人物へ結びつけられなかった。濡れた伝票箱K-02の紙には数字の一部だけが残り、燃料移送の日時を復元できない。乾燥保存の処置を行ったが、消えた文字を推測で補わないよう作業記録に明記した。\n\nK-01の曲がった環は資材室にもともと設置された部品である。表面の新旧の傷を比較する保存資料がなく、事件時に曲がったかどうかも定まらない。複数の物を回収できたことと、犯人を識別できる物証が得られたことは同義ではない。\n\n〔第3冊・3頁／閲覧用の写し。人物・場所・出来事は創作。〕","第4頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年11月11日\n記録区分：鷺浜補給所殺人事件／海水流入・物証捜索簿\n\n四　初動捜索の制約\n荒天当夜、資材室へ入ったのは当直員、救助班、巡回警察官の順だった。通路には海水が出入りしており、靴跡や小さな繊維は回収前に変形した可能性が高い。誰かが現場を故意に掃除したという証拠はない。浸水の記録写真に写った床の細い線を足跡だとする意見もあったが、翌日の乾燥写真と対応する位置が確認できなかった。\n\n写真原板は残っているものの、被写体が海水と影で判別できない箇所については画像から失われた細部を補うことができない。記録不能の部分を、特定人物に有利または不利な形で解釈しない。\n\n〔第3冊・4頁／閲覧用の写し。人物・場所・出来事は創作。〕","第5頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1997年11月11日\n記録区分：鷺浜補給所殺人事件／海水流入・物証捜索簿\n\n五　保管目録の改訂\n十一月十一日付で証拠品の一覧を整理した。実体を保管しているK-01、K-02、K-03については、封印と回収位置を追跡できる。青い書類袋と測深棒には実物も封印番号もなく、『捜索対象』として別の欄へ移した。書類袋の中身とされる燃料移送の写しは、当該年度の一般帳簿に似た数字があるだけで同一書面ではない。\n\n回収した物証は現場の状況を示すが、特定人物がどこで何をしたかを確定するには届かない。欠けた資料を既存の帳簿で代用すると、持参された書類の内容を捜査側が作り上げることになるため、未回収と明記した。\n\n〔第3冊・5頁／閲覧用の写し。人物・場所・出来事は創作。〕"]},{"title":"鷺浜補給所殺人事件／再検討・未解決保存記録","date":"1998-04-17","issuer":"鷺浜署・事件整理係","pages":["第1頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1998年04月17日\n記録区分：鷺浜補給所殺人事件／再検討・未解決保存記録\n\n一　帳簿をめぐる仮説\n補給所の燃料移送量には、県の決裁書と現場の受入控えの間に一度だけ差がある。伊奈がこの差を調べていたことは電話記録から分かる。差額に関与した人物が監査を妨げたという見方はあるが、決裁書の記載方法が変わった月でもあり、不正支出があったとは確定していない。差異を知り得たのは中垣だけでなく、有馬と上位の管理職も含まれる。\n\n書類袋を誰かが奪ったという仮説には、事件後に袋がないという事実以外の裏付けがない。流失や事前の別室保管を排除できないまま、差額から人物と殺害行為まで一本の線で結ぶことはできない。\n\n〔第4冊・1頁／閲覧用の写し。人物・場所・出来事は創作。〕","第2頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1998年04月17日\n記録区分：鷺浜補給所殺人事件／再検討・未解決保存記録\n\n二　荒天による失われた比較材料\nもし浸水前の床から鮮明な足跡が採れていれば、少なくとも履物の種類や踏み込みの位置を比較できた可能性がある。青い書類袋が現存すれば、内容と最後に触れた人物を調べる余地があった。いずれも事件後に現物がなく、代替できる独立の物的資料もない。ここでの欠落は犯人による巧妙な隠滅と同じ意味ではない。\n\n台風が現場の状況を変えたことは複数の気象・排水記録から確かめられる。ただし『荒天だったから何も分からない』とすることも適切ではない。八時十二分の電話、門の受付、浸水範囲は残る事実である。\n\n〔第4冊・2頁／閲覧用の写し。人物・場所・出来事は創作。〕","第3頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1998年04月17日\n記録区分：鷺浜補給所殺人事件／再検討・未解決保存記録\n\n三　複数の可能性を残した整理\n中垣には帳簿の数字を問いただされた事情と当夜の立入りがあるが、伊奈との接触を示す資料はない。三沢には資材室に案内した事実と発見までの行動の不確かな部分があるが、その不確かさは勤務と荒天で説明できる余地がある。有馬には文書を扱う立場があったが、港から渡らなかったという同時代記録がある。海側から未記録の人物が出入りした可能性も完全には消せない。\n\nこれらは同じ強さの疑いではなく、証拠が分断されているために比較の結論を出せないという意味である。誰かが『最も怪しい』という印象を抱くことと、責任を立証することは別に記す。\n\n〔第4冊・3頁／閲覧用の写し。人物・場所・出来事は創作。〕","第4頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1998年04月17日\n記録区分：鷺浜補給所殺人事件／再検討・未解決保存記録\n\n四　資料の記述差と報道\n事件直後の新聞は『消えた青い袋』を強調し、翌月には『凶器の鉄棒も行方不明』と報じた。後者は棚卸しの差を根拠にした推測であり、警察が凶器として特定したものではなかった。記事の見出しが複数残っているからといって、二つの独立した物的証拠がなくなったと確定したことにはならない。\n\n内部資料では、袋を『現場から消失』ではなく『入所時確認・発見時未確認』と記載する。測深棒も『事件前保管を確認できず』とした。この違いは些細な言葉遣いではなく、資料から推定できる範囲を示している。\n\n〔第4冊・4頁／閲覧用の写し。人物・場所・出来事は創作。〕","第5頁 / 全5頁\n\n事件番号：M-08\n件名：鷺浜補給所殺人事件\n作成日：1998年04月17日\n記録区分：鷺浜補給所殺人事件／再検討・未解決保存記録\n\n五　未解決としての保存\n平成十年四月の整理会議では、伊奈秀樹が何者かに殺害された疑いは強いものの、人物を特定する証拠が足りないとして送致対象を定めなかった。書類袋の所在、資材室での加害の具体的な経緯、八時二十分以後の人物の行動には未確定部分が残る。保存されたK-01からK-03も犯人固有の痕跡を示さなかった。\n\n事件の説明として一見整った仮説は複数作れるが、決め手になる物証が存在しない。『不足している』のは情報量だけではなく、その仮説を他の仮説から区別する証拠である。再捜索可能な漂着物の照会先を残し、本綴は未解決事件として保存する。\n\n〔第4冊・5頁／閲覧用の写し。人物・場所・出来事は創作。〕"]}]},{"folder":"M-09","name":"城ヶ丘植物標本館殺人事件","date":"1998-06-17","solved":false,"status":"未解決・原資料欠落と試料混同","books":[{"title":"城ヶ丘植物標本館殺人事件／現場・収蔵台帳","date":"1998-06-19","issuer":"城ヶ丘署・刑事課","pages":["第1頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年06月19日\n記録区分：城ヶ丘植物標本館殺人事件／現場・収蔵台帳\n\n一　収蔵室の発見\n平成十年六月十七日午後九時二十一分、市立城ヶ丘植物標本館の収蔵室で、標本管理責任者・杉崎澪子（四十六歳）が死亡しているのを警備員が発見した。負傷の状況と室内の争いを示す痕跡から、他者による加害が疑われた。警備員は室内の扉を開けて照明を点け、その場から通報した。発見後に移動した棚や椅子には記号を付けたが、緊急措置の前後を一枚の写真から判断できない。\n\n標本館は午後六時に一般公開を終えるが、研究作業のため職員と登録された外部研究者が夜間に出入りする。扉の外に足跡が少ないことは侵入者がいなかった証拠にならない。廊下は清掃直後であった。\n\n〔第1冊・1頁／閲覧用の写し。人物・場所・出来事は創作。〕","第2頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年06月19日\n記録区分：城ヶ丘植物標本館殺人事件／現場・収蔵台帳\n\n二　調べられていた標本\n杉崎の机には植物標本の移管整理を示す「C-17」の付箋と、採集年月を訂正するよう求めるメモが残されていた。C-17は希少な植物の標本一点を指す個別番号で、公開展示物ではない。管理台帳の写しには採集地が『北沢谷』とあり、外部提供者が提出した別の控えには『南岬丘』と書かれている。採集地の差が単なる転記ミスなのか、提供元が異なるのかは未確認だった。\n\n収納棚のC-17用の薄い保管箱は残っていたが、正式な採集票の原本と標本本体は見つからなかった。標本が研究室へ一時貸出中だった可能性もあり、発見時の空箱をそのまま盗難の証拠にはしない。\n\n〔第1冊・2頁／閲覧用の写し。人物・場所・出来事は創作。〕","第3頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年06月19日\n記録区分：城ヶ丘植物標本館殺人事件／現場・収蔵台帳\n\n三　当夜の行動表\n午後六時四十五分、杉崎は副管理責任者の塩見和江と収蔵目録の訂正を相談した。七時二十分に臨時職員の沢渡律が除湿機の点検で奥の廊下を通ったことは本人が述べ、作業票にも室番号が残る。午後八時過ぎ、外部提供者の庄野善則が『資料を返してもらう予定だった』と後に申告した。しかし庄野が館内へ入ったことを直接確認した証人はいない。\n\n午後八時二十四分に収蔵室から紙が裂けるような音が聞こえたという証言があるが、隣室では旧包装紙の裁断作業をしていた。夜間の出入口は正門と職員通用口の二か所で、通用口の鍵は複数人が借用できる。\n\n〔第1冊・3頁／閲覧用の写し。人物・場所・出来事は創作。〕","第4頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年06月19日\n記録区分：城ヶ丘植物標本館殺人事件／現場・収蔵台帳\n\n四　現場に残った品\n机の脚元に細い緑色の綴じ紐の切れ端があり、収蔵棚の通路にも類似の細片が見られた。標本館では緑紐を使って台紙を束ねる作業が日常的に行われている。職員の作業着からも同系統の繊維が落ちるため、色だけで本人の所持品と判定しない。机上のスケッチ帳には杉崎の文字とみられる『C-17は戻す前に確認』という一行があった。\n\n収蔵室の金属製ブックエンドに新しい変形があるとの見方が出たが、以前の物品写真がなく、いつ変形したか確かめられなかった。凶器と断定できる物は現場で特定されていない。\n\n〔第1冊・4頁／閲覧用の写し。人物・場所・出来事は創作。〕","第5頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年06月19日\n記録区分：城ヶ丘植物標本館殺人事件／現場・収蔵台帳\n\n五　初動時の未回収品\n優先して探す対象を、C-17の正式な採集票、標本本体、当日の貸出申請書原本、切れ端と連続する紐の残部と定めた。標本本体の保存位置が曖昧なのは、館の移管作業に伴い一時保管箱が増えていたためである。一時保管の棚には鍵の管理者が複数おり、誰でも取り出せたと断定はできないが、台帳の署名だけで使用者を一人に絞ることも難しい。\n\n事件性を示す現場痕跡はある一方、特定の人物へ結びつく物は少ない。C-17を巡る争いが動機であったという見方は有力な検討対象だが、空箱だけでは内容物の盗難、まして殺害者の身元を示さない。\n\n〔第1冊・5頁／閲覧用の写し。人物・場所・出来事は創作。〕"]},{"title":"城ヶ丘植物標本館殺人事件／職員・提供者聴取","date":"1998-06-29","issuer":"城ヶ丘署・聴取担当","pages":["第1頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年06月29日\n記録区分：城ヶ丘植物標本館殺人事件／職員・提供者聴取\n\n一　副管理責任者・塩見和江\n塩見は午後六時四十五分から七時過ぎまで杉崎と面談した。C-17の登録先が二つの帳簿で食い違い、外部提供者から訂正を急ぐよう催促されていると聞いたという。午後七時十分には会議室で月次報告を書き始め、八時頃に退出したと述べる。会議室の記録には本人の名前があるが、いつ席を立ったかを示す資料はない。\n\n杉崎との間に予算配分の対立があったことも認めた。ただし塩見は、予算の問題と標本の採集地を同一の争いとしては扱わないよう求めた。本人の言葉が事実である可能性は残るが、二つの問題のどちらも人物を殺害者に結びつける直接資料ではない。\n\n〔第2冊・1頁／閲覧用の写し。人物・場所・出来事は創作。〕","第2頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年06月29日\n記録区分：城ヶ丘植物標本館殺人事件／職員・提供者聴取\n\n二　外部提供者・庄野善則\n庄野は、以前に標本館へ寄託したC-17を返却してほしいと求めていた。採集地を『南岬丘』と書いたのは自分で、昔の覚え書きを参照したため日時には自信がないという。事件当日は午後八時頃に施設へ行ったが、入口が閉まっていたため戻ったと述べる。近くの道路を通ったという証言はあるものの、入館したかどうかを確かめた人物はいない。\n\n庄野が標本を持ち帰れば採集地の矛盾は調べられなくなる、という推測も出た。しかし返却請求自体は寄託契約に定められており、殺害の意図を示す行為ではない。庄野の携行品を調べてもC-17の標本は見つからなかった。\n\n〔第2冊・2頁／閲覧用の写し。人物・場所・出来事は創作。〕","第3頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年06月29日\n記録区分：城ヶ丘植物標本館殺人事件／職員・提供者聴取\n\n三　臨時収蔵員・沢渡律\n沢渡は午後七時二十分頃に除湿機の記録紙を交換した。仕事を終えて管理棟を出た後、八時半から知人と食事をしたと述べる。知人の証言は概ね一致するが、店の領収書には個人の氏名がなく、何時に食事を始めたかを分単位で証明しない。沢渡は緑色の紐を収蔵箱の整理に使っていたと説明した。\n\n事件後、沢渡の作業服から緑色の繊維が見つかった。しかし同じ仕様の服は複数の臨時職員が使い回しており、個人の所有物として区別されていなかった。繊維が存在することは珍しくなく、犯行との特別な関係は示されていない。\n\n〔第2冊・3頁／閲覧用の写し。人物・場所・出来事は創作。〕","第4頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年06月29日\n記録区分：城ヶ丘植物標本館殺人事件／職員・提供者聴取\n\n四　夜間警備員・木之下徹\n木之下は九時二十一分に杉崎を発見した。午後八時過ぎには通用口の方から人が出て行く音を聞いたが、誰の足音かは分からない。廊下の除湿機が動いた音を人の気配と勘違いしたこともあると説明した。午後八時二十四分頃の紙の破れる音は木之下が直接聞いたものだが、別室の裁断作業との関連は調べられていない。\n\n記録を確認すると、通用口の鍵は夜の施錠前に二度貸し出され、最後の返却欄には署名がなかった。木之下の記憶だけで二回とも別人だったとすることはできない。\n\n〔第2冊・4頁／閲覧用の写し。人物・場所・出来事は創作。〕","第5頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年06月29日\n記録区分：城ヶ丘植物標本館殺人事件／職員・提供者聴取\n\n五　証言の配置\n塩見は館内の管理責任を担い、庄野はC-17の返却を要求し、沢渡は収蔵室に出入りできた。それぞれの事情は事実として確認できる部分があるが、事件の核心となる時間帯の確実な人物目撃はない。木之下が聞いた音を各人の行動へ割り振ろうとしても、音源と場所を結ぶ資料が欠けている。\n\n杉崎の机のメモがC-17についてのものだったとしても、そのために殺害されたと結論づけることはできない。たとえば書類の訂正をめぐる別の経緯や、同日別件で訪れた人の関与も証拠上は排除できない。供述の不足を推測で埋めないため聴取票を追加保存した。\n\n〔第2冊・5頁／閲覧用の写し。人物・場所・出来事は創作。〕"]},{"title":"城ヶ丘植物標本館殺人事件／証拠品整理・欠損監査","date":"1998-08-04","issuer":"県警鑑識資料室","pages":["第1頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年08月04日\n記録区分：城ヶ丘植物標本館殺人事件／証拠品整理・欠損監査\n\n一　緑紐細片の収容経緯\n事件翌日の整理で、机の脚元から採った細片をH-01a、通路付近から採った細片をH-01bと記入していた。しかし当日の現場控えを確認したところ、二つの細片は正式封印前に一つの紙封筒へまとめられ、封筒には『緑紐片二点』とのみ記されていた。最初の採取位置を示す写真は残るが、どちらの細片がどちらの場所から来たかを実物と結び付ける識別印がなかった。\n\n形や繊維の構造を比較することはできても、机の近くの紐と通路の紐のどちらが誰の持ち物かという場所に依存する推定には使用できない。封入前の作業経緯を後から隠さず記載する。\n\n〔第3冊・1頁／閲覧用の写し。人物・場所・出来事は創作。〕","第2頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年08月04日\n記録区分：城ヶ丘植物標本館殺人事件／証拠品整理・欠損監査\n\n二　参照試料の不足\n標本館の保存紐は備品として一括購入され、職員個人ごとの購入記録はない。類似した緑色繊維を沢渡の作業服から採取したが、同じ服を別人が着ていた記録もある。紐と作業服の色が近いことは出入りの証拠とならない。現場細片には単独の繊維片が多く、切断面をつなげて一つの元の紐と証明できる部分は残されていない。\n\n採取位置が曖昧なまま参照試料を増やしても、現場での行動を復元する精度は上がらない。科学的な比較をすれば必ず犯人が特定できるという種類の物証ではない。\n\n〔第3冊・2頁／閲覧用の写し。人物・場所・出来事は創作。〕","第3頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年08月04日\n記録区分：城ヶ丘植物標本館殺人事件／証拠品整理・欠損監査\n\n三　C-17採集票の原本未発見\nC-17の所在管理には三種類の書類があった。館内台帳の写し、外部提供者の寄託控え、研究用の仮目録である。正式な採集票原本は、標本の採集年月日と場所を確定するための基礎資料だったが、事件後の棚卸しで見つからなかった。原本の最後の貸出記録は四月で、事件当日の所在を示さない。\n\n見つかった写しは年月の末尾が複写のかすれで読めず、地名も前の版と一致しない。原本に何が書いてあったかを写しに合わせて推定してしまうと、帳簿の食い違いを検証する前に答えを作ることになる。\n\n〔第3冊・3頁／閲覧用の写し。人物・場所・出来事は創作。〕","第4頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年08月04日\n記録区分：城ヶ丘植物標本館殺人事件／証拠品整理・欠損監査\n\n四　標本本体の未回収\nC-17の標本本体は、事件当夜の収蔵室の空箱にも、移管先の共同保管棚にもなかった。外部研究者へ貸し出された形跡を調べたが、返却票の欠落が多く、最後に現物を確認した日を特定できなかった。包装に使われた薄紙は複数の箱で同じものを使っており、空箱の中の繊維から標本固有の位置や移動を推定できない。\n\n標本の採集地をめぐる対立が事件の動機になったかどうかを調べるために必要な中心の物が失われている。ただし、標本がないことだけでは、事件当夜に誰かが運び出したと証明できない。\n\n〔第3冊・4頁／閲覧用の写し。人物・場所・出来事は創作。〕","第5頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1998年08月04日\n記録区分：城ヶ丘植物標本館殺人事件／証拠品整理・欠損監査\n\n五　証拠品目録の改訂\nH-01緑紐二点、H-02机のメモ、H-03棚鍵と受領票、H-04収蔵室の保管箱を現物ありとして整理した。C-17採集票原本と標本本体は未回収欄へ移した。H-01の採取位置は写真で確認できるが実物の対応が失われたため、個々の位置を前提とする比較を保留した。H-02の筆跡については杉崎本人の可能性が高いが、事件の相手や時刻は記されていない。\n\n保管ミスがあった箇所を改めて詳細に記すことは、資料を弱くする行為ではない。後から読む者が何を言えるかを正しく限定するためである。欠けた物と残った物は混ぜず、別々の欄に記す。\n\n〔第3冊・5頁／閲覧用の写し。人物・場所・出来事は創作。〕"]},{"title":"城ヶ丘植物標本館殺人事件／捜査再評価・未解決綴","date":"1999-01-28","issuer":"城ヶ丘署・事件整理係","pages":["第1頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1999年01月28日\n記録区分：城ヶ丘植物標本館殺人事件／捜査再評価・未解決綴\n\n一　採集地の争いが示すもの\n館内台帳にある『北沢谷』と寄託控えの『南岬丘』は、同一標本の由来について両立しない可能性がある。だが寄託控えは古い記憶をもとに記されており、移管の途中で番号が付け替えられた例もある。採集票原本と標本本体のいずれも現存しないため、どの記録が誤っていたかを確かめられない。誰かが採集地を隠したという仮説は考えられても、基礎の事実が確定しない。\n\n杉崎がC-17の確認を予定していたことは机上のメモから分かる。しかし確認の結果が誰に不利益を与えるかは、写しだけでは定まらなかった。\n\n〔第4冊・1頁／閲覧用の写し。人物・場所・出来事は創作。〕","第2頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1999年01月28日\n記録区分：城ヶ丘植物標本館殺人事件／捜査再評価・未解決綴\n\n二　三人の関係者について\n塩見には杉崎と意見の対立があり、夜間まで館内に残る機会があった。庄野には標本の返却を求める事情があり、当夜施設近辺を通ったという証言がある。沢渡には収蔵業務と現場周辺の出入りがあり、共用作業服の繊維と似た資料が残る。ただし、それぞれについて争い、通行、通常作業から殺害の行為へつながる独立の資料が見つからなかった。\n\n調査の結果、一人に疑いが集中するような報告書は作らないこととした。動機がありそうだという推測と、実際に手を下したという証明の間に、未回収品や目撃の欠落がある。\n\n〔第4冊・2頁／閲覧用の写し。人物・場所・出来事は創作。〕","第3頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1999年01月28日\n記録区分：城ヶ丘植物標本館殺人事件／捜査再評価・未解決綴\n\n三　紐の推理を差し戻す理由\n初期の内部メモでは、机の近くの緑紐と廊下の緑紐が違う人物の所持品なら、人物が机へ近づいた経路を復元できるかもしれないとされた。しかし二点を識別しないまま同じ封筒へ入れた事実が判明し、どちらの実物がどの場所から採られたかを確かめられなくなった。\n\nそのため『通路の紐は沢渡の作業服に近い』という一部の説明は撤回された。繊維の種類そのものの比較が可能であっても、採取場所に結びつく説明はできない。資料を撤回した理由は物証の不一致ではなく、実物の由来が追えないことだった。\n\n〔第4冊・3頁／閲覧用の写し。人物・場所・出来事は創作。〕","第4頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1999年01月28日\n記録区分：城ヶ丘植物標本館殺人事件／捜査再評価・未解決綴\n\n四　外部の報道と記録の伝播\n新聞は『消えた珍しい標本』『作業服の糸が犯人を示す』と並べて報じた。前者は標本が未回収であること、後者は色の似た繊維が採取されたことに基づくが、いずれも犯人の特定に直結しない。共通の作業着と共通の包装材が使われていた事情は小さく扱われた。\n\n事件の一年後に寄せられた匿名情報には、新聞記事と同じ言葉が繰り返されていた。独自の知識による通報か、報道を読んだ感想か判別できず、立証材料に採用しなかった。原本のない文書の内容を想像で補うことにも慎重であるべきだと整理された。\n\n〔第4冊・4頁／閲覧用の写し。人物・場所・出来事は創作。〕","第5頁 / 全5頁\n\n事件番号：M-09\n件名：城ヶ丘植物標本館殺人事件\n作成日：1999年01月28日\n記録区分：城ヶ丘植物標本館殺人事件／捜査再評価・未解決綴\n\n五　未解決としての収蔵判断\n平成十一年一月の再検討では、杉崎澪子の死を他者の加害による事件として扱う判断は維持された。一方、犯人を特定できる独立の証拠は不足し、起訴や確定的な責任判断につながる資料は揃わなかった。標本の採集地と持出し経緯、夜間の出入り、緑紐二点の実物と採取位置の対応が未解明である。\n\nこの事件では物がすべて消えたのではない。残っている証拠品に番号はあり、封入もされている。それでも『どこから採った何か』が分からない品は、人物を特定する場面では役に立たない。原資料が失われ、比較が崩れた状態をそのまま残して未解決綴とする。\n\n〔第4冊・5頁／閲覧用の写し。人物・場所・出来事は創作。〕"]}]}];
const KEY='shoko.room.prototype.v1';
let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){saved={}}
const initialShelf=SHELVES.find(s=>s.id===saved.shelf)||SHELVES[0];
const state={shelf:initialShelf.id,folder:initialShelf.folderIds.includes(saved.folder)?saved.folder:(initialShelf.folderIds[0]||''),active:saved.active||'',desk:new Set(Array.isArray(saved.desk)?saved.desk:[]),stars:new Set(Array.isArray(saved.stars)?saved.stars:[]),read:new Set(Array.isArray(saved.read)?saved.read:[]),notes:saved.notes&&typeof saved.notes==='object'?saved.notes:{},general:saved.general||'',view:'archive',screen:'shelf',sort:'number'};
const docs=RECORDS.map((v,i)=>({folder:v[0],date:v[1],title:v[2],issuer:v[3],body:v[4],id:v[0]+'-'+String(RECORDS.slice(0,i+1).filter(d=>d[0]===v[0]).length).padStart(3,'0'),type:/写真|見取図/.test(v[2])?'photo':'paper'})).concat(MURDER_CASES.flatMap(c=>c.books.map((b,i)=>({folder:c.folder,date:b.date,title:b.title,issuer:b.issuer,body:b.pages.join('\n\n'),pages:b.pages,id:c.folder+'-'+String(i+1).padStart(3,'0'),type:'paper'}))));
const byId=id=>docs.find(x=>x.id===id),el=id=>document.getElementById(id);
function store(){try{localStorage.setItem(KEY,JSON.stringify({shelf:state.shelf,folder:state.folder,active:state.active,desk:[...state.desk],stars:[...state.stars],read:[...state.read],notes:state.notes,general:state.general}))}catch(e){console.warn('保存できません',e)}}
function node(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function safeDoc(){return byId(state.active)}
function switchScreen(name){if(name==='desk'){state.view='desk';renderReader();}else if(name==='reader'&&state.view==='desk'){state.view='archive';renderReader();}state.screen=name;el('workspace').dataset.screen=name==='desk'?'reader':name;document.querySelectorAll('.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.target===name));el('showArchive').classList.toggle('active',state.view==='archive');el('showDesk').classList.toggle('active',state.view==='desk');}
function currentShelf(){return SHELVES.find(s=>s.id===state.shelf)||SHELVES[0]}
function selectShelf(shelfId){
 const shelf=SHELVES.find(s=>s.id===shelfId);if(!shelf)return;
 if(state.shelf!==shelf.id){state.shelf=shelf.id;state.folder=shelf.folderIds[0]||'';state.active='';state.view='archive';store();renderAll()}
 if(!shelf.folderIds.length){switchScreen('catalog')}
 else if(innerWidth<=850){switchScreen('shelf')}
}
function renderShelf(){
 const categories=el('shelfCategories'),boxes=el('folderDrawers'),shelf=currentShelf();
 categories.replaceChildren();boxes.replaceChildren();
 for(const entry of SHELVES){
  const count=docs.filter(d=>entry.folderIds.includes(d.folder)).length;
  const b=node('button','shelf-select'+(entry.id===state.shelf?' selected':''));b.type='button';
  b.setAttribute('aria-pressed',entry.id===state.shelf?'true':'false');b.setAttribute('aria-label',entry.name+'の棚 '+count+'件');
  const top=node('span','shelf-select-top');top.append(node('span','', 'SHELF '+entry.code),node('span','',entry.id===state.shelf?'●':'○'));
  const bottom=node('span','shelf-select-bottom');bottom.append(node('span','',entry.sub),node('span','',String(count).padStart(2,'0')+' FILES'));
  b.append(top,node('span','shelf-select-name',entry.name),bottom);
  b.addEventListener('click',()=>selectShelf(entry.id));categories.append(b);
 }
 el('folderShelfName').textContent=shelf.name+' / '+shelf.folderIds.length+' 箱';
 for(const id of shelf.folderIds){
  const f=FOLDERS.find(x=>x.id===id);if(!f)continue;
  const b=node('button','drawer'+(state.folder===f.id?' selected':''));b.type='button';
  b.setAttribute('aria-pressed',state.folder===f.id?'true':'false');
  b.append(node('span','drawer-code',f.id),node('span','drawer-name',f.name),node('span','drawer-num',String(docs.filter(x=>x.folder===f.id).length).padStart(2,'0')));

 el('shelfCount').textContent=String(SHELVES.length);el('totalCount').textContent=docs.length+' FILES';

function listForFolder(){const out=docs.filter(d=>d.folder===state.folder);if(state.sort==='date')out.sort((a,b)=>b.date.localeCompare(a.date));else if(state.sort==='star')out.sort((a,b)=>Number(state.stars.has(b.id))-Number(state.stars.has(a.id))||a.id.localeCompare(b.id));return out}
function renderCatalog(){
 const f=FOLDERS.find(x=>x.id===state.folder),shelf=currentShelf();
 el('catalogCode').textContent=f?f.id:'SHELF '+shelf.code;
 el('catalogTitle').textContent=f?f.name:shelf.name;

 const files=f?listForFolder():[],wrap=el('fileList');wrap.replaceChildren();
 if(!f){const empty=node('div','catalog-empty');empty.append(node('div','glyph','▤'),node('strong','','未収蔵'),node('p','', '「'+shelf.name+'」の棚に資料はまだありません。'));wrap.append(empty)}
 files.forEach(d=>{const b=node('button','catalog-item'+(state.active===d.id?' active':''));b.type='button';const icon=node('span','file-icon'+(d.type==='photo'?' photo':''));icon.setAttribute('aria-hidden','true');const content=node('span','item-content');const top=node('span','item-top');top.append(node('span','',d.id),node('span','',state.stars.has(d.id)?'＊':d.date));content.append(top,node('div','item-title',d.title),node('div','item-meta',(state.read.has(d.id)?'既読 · ':'')+d.issuer));b.append(icon,content);b.addEventListener('click',()=>{state.active=d.id;state.read.add(d.id);store();renderCatalog();renderReader();switchScreen('reader')});wrap.append(b)});
 el('catalogCount').textContent=files.length+' RECORDS';el('order').value=state.sort;
