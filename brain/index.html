<script>/* iPhoneの消音スイッチに従う */try{if(navigator.audioSession)navigator.audioSession.type="ambient"}catch(e){}</script>
<style>
:root{--ink:#2f3a44;--line:#a9afb5;--faint:#d3d7db}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);overflow:hidden}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,"Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
a{color:inherit}
:focus-visible{outline:2px solid #2f6fd6;outline-offset:3px}

/* ほかの画面への小さな道（窓を使わなくても移動できる） */
.top{position:fixed;z-index:40;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.top a{pointer-events:auto;text-decoration:none;color:#7b838b;font:400 11px/1 Georgia,"Times New Roman",serif;letter-spacing:.24em;padding:12px 8px;min-height:40px;display:inline-flex;align-items:center}
.top a:hover,.top a:focus-visible{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top .home{margin-right:auto;font:600 12px/1 inherit;font-family:inherit;letter-spacing:.1em}
#title{position:fixed;z-index:3;left:0;right:0;top:max(54px,calc(env(safe-area-inset-top,0px) + 50px));text-align:center;font:400 22px Georgia,serif;letter-spacing:9px;text-indent:9px;color:#7b838b;pointer-events:none}

/* 枝（作品の木） */
#stage{position:fixed;inset:0;z-index:1}
#tree{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);will-change:transform}
#tree svg{display:block;width:100%;height:100%;overflow:visible}
.ring{fill:none;stroke:#eceef0;stroke-width:1}
.ring.now{stroke:#d6dade;stroke-dasharray:2 6}
.ln{fill:none;stroke:var(--line);stroke-width:1.3;stroke-linecap:round}
.trunk{stroke-width:2}
.anim .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:grow 1.9s cubic-bezier(.3,.6,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes grow{to{stroke-dashoffset:0}}
.ghost .ln{stroke:var(--faint);stroke-width:.8}
.ghost .ln.dash{stroke-dasharray:2 5}
.anim .ghost .ln.dash{stroke-dasharray:2 5;stroke-dashoffset:0;animation:none}
.ghost{opacity:.85;animation:breathe var(--b,11s) ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:.25}}
.ghost circle{fill:#fff;stroke:var(--faint);stroke-width:.9}
.anim .fade{opacity:0;animation:fadein 1s forwards;animation-delay:var(--d,0s)}
@keyframes fadein{to{opacity:1}}
.node circle.d{fill:#888d92;transition:fill .3s,r .3s}
.node.hold circle.d{fill:#fff;stroke:#9aa0a6;stroke-width:1.4}
.node circle.hit{fill:transparent}
.node text{font:400 17px Georgia,"Times New Roman",serif;letter-spacing:.06em;fill:#9aa0a6;transition:fill .3s,opacity .3s}
.node text.dt{font:400 12px system-ui,sans-serif;letter-spacing:.08em;opacity:0}
.small .node text.nm,.node text.nm[data-hide]{opacity:0}
.node .pulse{fill:none;stroke:#c9a46a;stroke-width:1.2;opacity:0}
.node.new .pulse{animation:pulse 3.2s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes pulse{0%{opacity:.7;r:5}100%{opacity:0;r:22}}
.node{cursor:pointer;outline:none}
.node.on circle.d{fill:#2f3a44;r:6.5}
.node.hold.on circle.d{fill:#fff;stroke:#2f3a44}
.node.on text{fill:#2f3a44;opacity:1}
.node:focus-visible circle.hit{stroke:#2f6fd6;stroke-width:2}
.limb.on .ln{stroke:#5b6670}
.twig.on .ln{stroke:#3b4650;stroke-width:1.8}
.hub text{font:700 24px Georgia,"Times New Roman",serif;letter-spacing:4px;fill:#a3a9af;transition:fill .3s}
.hub:hover text,.hub:focus-visible text{fill:#2f3a44}
.hub{cursor:pointer}
.origin{fill:#6b737b}
#fog{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 72% 62% at 50% 50%,rgba(255,255,255,0) 55%,rgba(255,255,255,.55) 100%)}

.top a{white-space:nowrap}
@media(max-width:520px){.top .home{display:none}.top{justify-content:center;gap:2px}.top a:nth-of-type(n+3){padding-left:6px;padding-right:6px;letter-spacing:.08em}}
#concept{position:fixed;z-index:3;left:90px;right:60px;bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 14px));margin:0;text-align:center;font-size:12px;line-height:1.6;letter-spacing:.14em;color:#7b838b;pointer-events:none}
.top a:nth-of-type(2){font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--ink)}
.top a:nth-of-type(n+3){font-size:10px;letter-spacing:.14em}
#snd{position:fixed;z-index:40;right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));width:38px;height:38px;border-radius:50%;border:1px solid #c9ced3;background:rgba(255,255,255,.9);color:#6b737b;display:grid;place-items:center;padding:0;cursor:pointer}
#snd svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#snd .x{display:block}#snd .w{display:none}#snd.on .x{display:none}#snd.on .w{display:block}
#motion{position:fixed;z-index:40;left:max(10px,env(safe-area-inset-left,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));height:38px;padding:0 12px;border-radius:19px;border:1px solid #c9ced3;background:rgba(255,255,255,.9);color:#6b737b;font:400 10px/1 Georgia,serif;letter-spacing:.2em;cursor:pointer}
body.still .ghost,body.still .node.new .pulse{animation:none!important}
@media(prefers-reduced-motion:reduce){.ghost,.node.new .pulse{animation:none!important}}
</style>
</head>
<body>
<nav class="top" aria-label="サイト">

<main id="stage" aria-label="BRAIN：作品が枝として伸びる木。点を選ぶと作品が開きます。">
  <div id="tree"></div>

<p id="concept">ほしいものをすきなようにつくる</p>

<button id="snd" type="button" aria-pressed="false" aria-label="音を鳴らす"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><g class="w"><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.6a7.6 7.6 0 0 1 0 10.8"/></g><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>

<script src="../common/site.js"></script>
<script>
(function () {
  'use strict';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var still = reduce; try { if (localStorage.getItem('izSite.still') === '1') still = true; } catch (e) {}
  var A = IZ.ROOT + 'assets/';

  /* ---------- 木 ---------- */
  var treeEl = document.getElementById('tree'), svgNS = 'http://www.w3.org/2000/svg';
  var C = 700, deg = Math.PI / 180, R0 = 62, RN = 470;
  var works = [], portrait = matchMedia('(max-aspect-ratio: 4/5)');
  var seed = 7; function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  function pt(a, r) { return [C + Math.cos(a * deg) * r, C + Math.sin(a * deg) * r]; }
  function f1(n) { return n.toFixed(1); }
  function jpDate(d) { var p = d.split('-'); return +p[0] + '年' + (+p[1]) + '月' + (+p[2]) + '日'; }
  function P(p) { return f1(p[0]) + ' ' + f1(p[1]); }
  function ms(w) { // 作品の時刻（初回コミット、日本時間）。履歴が無ければ null
    if (!w.first || !w.history || !w.history.first) return null;
    return Date.parse(w.first + 'T' + w.history.first.time + ':00+09:00');
  }

  function build() {
    seed = 7;
    var P_ = portrait.matches;
    var ANG = P_ ? { game: 228, lab: 312, tool: 90 } : { game: 205, lab: 335, tool: 90 };
    var now = Date.now();
    var dated = works.filter(function (w) { return ms(w) != null; });
    var t0 = dated.length ? Math.min.apply(null, dated.map(ms)) : now - 864e5;
    var span = Math.max(36e5, now - t0);
    function tn(t) { return Math.max(0, Math.min(1, (t - t0) / span)); }
    function rad(t) { return R0 + (RN - R0) * tn(t); }            // 年輪の半径：時間だけで決める
    // 作品の半径：時間（6割）と、全作品の中での順番（4割）を混ぜる。同じ時期に作品が集中しても重ならない
    var order = dated.map(ms).sort(function (a, b) { return a - b; });
    function wrad(t) { var k = order.indexOf(t), rk = order.length > 1 ? k / (order.length - 1) : 1; return R0 + 70 + (RN - R0 - 70) * (.6 * tn(t) + .4 * rk); }

    var h = '<svg viewBox="40 40 1320 1320" xmlns="' + svgNS + '" role="presentation">';

    // 年輪：時間の区切り（期間に応じて 日／週／月／年）。いちばん外の点線が「いま」
    var day = 864e5, step, list = [];
    var spanDays = span / day;
    var jst = function (t) { return new Date(t + 9 * 36e5); };
    var d0 = jst(t0); var mid = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), d0.getUTCDate()) - 9 * 36e5;
    if (spanDays <= 14) { for (var t = mid + day; t < now; t += day) list.push(t); }
    else if (spanDays <= 7 * 14) { for (var t2 = mid + 7 * day; t2 < now; t2 += 7 * day) list.push(t2); }
    else {
      var y = d0.getUTCFullYear(), m = d0.getUTCMonth() + 1, byYear = spanDays > 30 * 14;
      for (;;) { if (byYear) { y++; m = 0; } else { m++; if (m > 11) { m = 0; y++; } } var tt = Date.UTC(y, m, 1) - 9 * 36e5; if (tt >= now) break; list.push(tt); }
    }
    list.forEach(function (t) { h += '<circle class="ring" cx="700" cy="700" r="' + f1(rad(t)) + '"/>'; });
    h += '<circle class="ring now" cx="700" cy="700" r="' + RN + '"/>';

    // 選べなかった未来：どこにも届かない細い枝。いまの外側まで伸びて、ゆっくり明滅する
    var taken = Object.keys(ANG).map(function (k) { return ANG[k]; });
    h += '<g class="ghosts">';
    var GN = 30;
    for (var k = 0; k < GN; k++) {
      var a = k * (360 / GN) + rnd() * 8 - 4;
      var near = taken.some(function (t) { return Math.abs(((a - t + 540) % 360) - 180) < 9; });
      var r1 = (near ? RN * .95 : RN * .7) + rnd() * RN * .55, bend = rnd() * 16 - 8, dd = (0.6 + rnd() * 1.6).toFixed(2);
      var s0 = pt(a, R0 * .6 + rnd() * 40), e1 = pt(a + bend, r1), mm = pt(a + bend * 1.6, (R0 + r1) / 2);
      var dash = rnd() < .45 ? ' dash' : '';
      h += '<g class="ghost" style="--b:' + (9 + rnd() * 8).toFixed(1) + 's;--bd:-' + (rnd() * 10).toFixed(1) + 's"><path class="ln' + dash + '" pathLength="1" style="--d:' + dd + 's" d="M' + P(s0) + ' Q' + P(mm) + ' ' + P(e1) + '"/>';
      if (rnd() < .55) {
        var sg = rnd() < .5 ? -1 : 1, f0 = pt(a + bend * 1.2, r1 * (.62 + rnd() * .14)), e2 = pt(a + bend + sg * (14 + rnd() * 16), r1 + 40 + rnd() * 110);
        h += '<path class="ln' + dash + '" pathLength="1" style="--d:' + (+dd + .7).toFixed(2) + 's" d="M' + P(f0) + ' L' + P(e2) + '"/>';
        if (rnd() < .6) h += '<circle class="fade" style="--d:' + (+dd + 1.3).toFixed(2) + 's" cx="' + f1(e2[0]) + '" cy="' + f1(e2[1]) + '" r="2.6"/>';
      }
      h += '</g>';
    }
    h += '</g>';

    // 3本の枝（ゲーム・実験・実用）と、そこから伸びる作品の小枝
    var cats = ['game', 'lab', 'tool'];
    cats.forEach(function (cat, ci) {
      var la = ANG[cat];
      var ws = works.filter(function (w) { return w.category === cat; });
      ws.sort(function (a, b) { var x = ms(a), y = ms(b); if (x == null && y == null) return a.order - b.order; if (x == null) return 1; if (y == null) return -1; return x - y; });
      var n = ws.length, spread = Math.min(46, 9 + n * 4.5);
      var bend = (ci === 1 ? -1 : 1) * 7;
      var trunkR = RN * .94;
      function T(r) { return pt(la + bend * Math.sin(Math.PI * r / trunkR / 1.15), r); }
      var trunkD = 'M' + P(pt(la, 14));
      for (var s = 1; s <= 24; s++) trunkD += ' L' + P(T(14 + (trunkR - 14) * s / 24));
      var d0s = (0.2 + ci * .25).toFixed(2);
      h += '<g class="limb" data-cat="' + cat + '"><path class="ln trunk" pathLength="1" style="--d:' + d0s + 's" d="' + trunkD + '"/></g>';
      ws.forEach(function (w, j) {
        var t = ms(w), r = t == null ? RN * 1.06 : wrad(t);
        var u = n > 1 ? (((j + 1) * 0.6180339887) % 1) * 2 - 1 : 0;
        var a2 = la + bend * Math.sin(Math.PI * r / trunkR / 1.15) + u * spread;
        var rf = Math.max(R0 * .8, Math.min(trunkR, r * .74));
        var fp = T(rf), np = pt(a2, r), cp = pt(la + bend + u * spread * .35, (rf + r) / 2);
        var dl = (+d0s + .5 + (n ? j / n : 0) * 1.2).toFixed(2);
        var hold = w.status === 'paused' || t == null;
        var lc = Math.cos(a2 * deg), anchor = P_ ? 'middle' : (lc > .3 ? 'start' : lc < -.3 ? 'end' : 'middle');
        var lp = pt(a2, r + 18), sn = Math.sin(a2 * deg), ly = lp[1] + (sn < -.5 ? -2 : sn > .5 ? 14 : 5);
        var label = (w.titleEn || w.title);
        var dateTxt = w.first ? IZ.dot(w.first) : '';
        h += '<g class="twig" data-id="' + w.id + '"><path class="ln" pathLength="1" style="--d:' + dl + 's" d="M' + P(fp) + ' Q' + P(cp) + ' ' + P(np) + '"/></g>' +
          '<a class="node fade' + (hold ? ' hold' : '') + (w.isNew ? ' new' : '') + '" data-id="' + w.id + '" data-cat="' + cat + '" href="' + IZ.esc(w.url) + '" style="--d:' + (+dl + .9).toFixed(2) + 's" aria-label="' + IZ.esc(w.title + (w.first ? '（' + jpDate(w.first) + '）' : '')) + '">' +
          '<circle class="pulse" cx="' + f1(np[0]) + '" cy="' + f1(np[1]) + '" r="5"/>' +
          '<circle class="hit" cx="' + f1(np[0]) + '" cy="' + f1(np[1]) + '" r="16"/>' +
          '<circle class="d" cx="' + f1(np[0]) + '" cy="' + f1(np[1]) + '" r="' + (w.status === 'stable' ? 5 : 4) + '"/>' +
          '<text class="nm" x="' + f1(lp[0]) + '" y="' + f1(ly) + '" text-anchor="' + anchor + '">' + IZ.esc(label) + '</text>' +
          (dateTxt ? '<text class="dt" x="' + f1(lp[0]) + '" y="' + f1(ly + 17) + '" text-anchor="' + anchor + '">' + dateTxt + '</text>' : '') +
          '</a>';
      });
      // 枝の名前（押すと、その種類にしぼった作品一覧へ）
      var hp = pt(la + bend * .3, trunkR + 120), hc = Math.cos(la * deg);
      var anc = P_ ? 'middle' : (hc > .3 ? 'start' : hc < -.3 ? 'end' : 'middle');
      if (cat === 'tool') hp = pt(la, RN + 150);
      h += '<a class="hub fade" href="' + IZ.esc(new URL('../?cat=' + cat, location.href).href) + '" style="--d:' + (+d0s + .8).toFixed(2) + 's" aria-label="' + IZ.CATS[cat].ja + 'の作品一覧"><text x="' + f1(hp[0]) + '" y="' + f1(hp[1]) + '" text-anchor="' + anc + '">' + IZ.CATS[cat].en + '</text></a>';
    });

    h += '<circle class="origin fade" style="--d:.1s" cx="700" cy="700" r="8"/></svg>';
    treeEl.className = (still ? '' : 'anim');
    treeEl.innerHTML = h;
    fit();
    declutter();
  }

  /* 作品名どうしが重なるときは少しずらし、それでも重なるものは隠す（点にふれると出る） */
  function declutter() {
    var placed = [];
    var labels = Array.prototype.slice.call(treeEl.querySelectorAll('.node text.nm'));
    labels.forEach(function (t) { t.removeAttribute('data-hide'); t.setAttribute('y', t.getAttribute('data-y0') || t.getAttribute('y')); t.setAttribute('data-y0', t.getAttribute('y')); });
    labels.forEach(function (t) {
      var y0 = +t.getAttribute('data-y0'), ok = false;
      var tries = [0, -15, 15, -28, 28];
      for (var i = 0; i < tries.length; i++) {
        t.setAttribute('y', y0 + tries[i]);
        var b = t.getBBox(), hit = placed.some(function (q) { return b.x < q.x + q.width + 6 && b.x + b.width + 6 > q.x && b.y < q.y + q.height && b.y + b.height > q.y; });
        if (!hit) { placed.push(b); ok = true; break; }
      }
      if (!ok) { t.setAttribute('y', y0); t.setAttribute('data-hide', '1'); }
      var dt = t.parentNode.querySelector('text.dt'); if (dt) dt.setAttribute('y', +t.getAttribute('y') + 17);
    });
  }

  /* 画面に合わせて木の大きさを決める（画面の真ん中に置く） */
  function fit() {
    var W = innerWidth, H = innerHeight, top = 70, bottom = 56, size;
    var avail = H - top - bottom;
    size = Math.min(avail, W * (portrait.matches ? 1.25 : 1));
    treeEl.style.top = (H / 2 + (top - bottom) / 2) + 'px';
    size = Math.max(260, size);
    treeEl.style.width = treeEl.style.height = size + 'px';
    var px = size / 1320; // 1単位あたりの画面ピクセル
    treeEl.classList.toggle('small', px * 17 < 8);
  }

  /* 点にふれる：その作品へ向かう枝が濃くなる。タッチは1回目で選んで、2回目で開く */
  var lastPointer = 'mouse', active = null;
  function setActive(id) {
    active = id;
    treeEl.querySelectorAll('.on').forEach(function (e) { e.classList.remove('on'); });
    if (!id) return;
    var n = treeEl.querySelector('.node[data-id="' + id + '"]'); if (!n) return;
    n.classList.add('on');
    var tw = treeEl.querySelector('.twig[data-id="' + id + '"]'); if (tw) tw.classList.add('on');
    var lb = treeEl.querySelector('.limb[data-cat="' + n.getAttribute('data-cat') + '"]'); if (lb) lb.classList.add('on');
    n.querySelectorAll('text').forEach(function (t) { t.style.opacity = 1; });
  }
  function clearTexts() { treeEl.querySelectorAll('.node text').forEach(function (t) { t.style.opacity = ''; }); }
  var downActive = null;
  treeEl.addEventListener('pointerdown', function (e) { lastPointer = e.pointerType || 'mouse'; downActive = active; }, true);
  treeEl.addEventListener('pointerover', function (e) { if (e.pointerType === 'touch') return; var n = e.target.closest('.node'); if (n) { clearTexts(); setActive(n.getAttribute('data-id')); } });
  treeEl.addEventListener('pointerout', function (e) { if (e.pointerType === 'touch') return; var n = e.target.closest('.node'); if (n && !n.contains(e.relatedTarget)) { clearTexts(); setActive(null); } });
  treeEl.addEventListener('focusin', function (e) { var n = e.target.closest('.node'); if (n) { clearTexts(); setActive(n.getAttribute('data-id')); } });
  treeEl.addEventListener('focusout', function () { clearTexts(); setActive(null); });
  treeEl.addEventListener('click', function (e) {
    var n = e.target.closest('.node'); if (!n) return;
    if (lastPointer === 'touch' && downActive !== n.getAttribute('data-id')) { e.preventDefault(); clearTexts(); setActive(n.getAttribute('data-id')); }
  });
  document.getElementById('stage').addEventListener('click', function (e) { if (!e.target.closest('.node,.hub')) { clearTexts(); setActive(null); } });

  /* ゆっくり視差（マウスのみ・動きを止める設定では無効） */
  var tx = 0, ty = 0, cx = 0, cy = 0, raf = 0;
  addEventListener('pointermove', function (e) {
    if (still || e.pointerType !== 'mouse') return;
    tx = (e.clientX / innerWidth - .5) * -14; ty = (e.clientY / innerHeight - .5) * -10;
    if (!raf) raf = requestAnimationFrame(step);
  });
  function step() {
    raf = 0; cx += (tx - cx) * .08; cy += (ty - cy) * .08;
    treeEl.style.transform = 'translate(calc(-50% + ' + cx.toFixed(2) + 'px),calc(-50% + ' + cy.toFixed(2) + 'px))';
    if (Math.abs(tx - cx) > .05 || Math.abs(ty - cy) > .05) raf = requestAnimationFrame(step);
  }

  /* 動きを止める */
  var mb = document.getElementById('motion');
  function applyStill() { document.body.classList.toggle('still', still); mb.setAttribute('aria-pressed', String(still)); mb.textContent = still ? 'MOVE' : 'STILL'; mb.title = still ? '動きをもどす' : '動きを止める'; if (still) { tx = ty = cx = cy = 0; treeEl.style.transform = ''; treeEl.classList.remove('anim'); } }
  mb.addEventListener('click', function () { still = !still; try { localStorage.setItem('izSite.still', still ? '1' : '0'); } catch (e) {} applyStill(); });
  applyStill();

  /* 音：最初は鳴らさない。右下のボタンで鳴らす（旧BRAINの曲を流用） */
  var snd = document.getElementById('snd'), au = null, fade = 0;
  function ramp(to, dur) { clearInterval(fade); var from = au.volume, t0 = performance.now(); fade = setInterval(function () { var k = Math.min(1, (performance.now() - t0) / dur); au.volume = Math.max(0, Math.min(1, from + (to - from) * k)); if (k >= 1) { clearInterval(fade); if (to === 0) au.pause(); } }, 60); }
  snd.addEventListener('click', function () {
    if (!au) { au = new Audio(A + 'bgm/tides-under-glass.mp3'); au.loop = true; au.volume = 0; }
    var on = !snd.classList.contains('on');
    snd.classList.toggle('on', on); snd.setAttribute('aria-pressed', String(on)); snd.setAttribute('aria-label', on ? '音を止める' : '音を鳴らす');
    if (on) au.play().then(function () { ramp(.5, 1500); }).catch(function () {}); else ramp(0, 500);
  });
  document.addEventListener('visibilitychange', function () { if (au && document.hidden) au.pause(); else if (au && snd.classList.contains('on')) au.play().catch(function () {}); });

  var rt = 0;
  addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(fit, 80); });
  portrait.addEventListener('change', function () { var keep = still; still = true; build(); still = keep; treeEl.className = ''; });

  IZ.load().then(function (d) { works = d.works; build(); })
    .catch(function () { works = []; build(); });
})();
</script>
</body>
