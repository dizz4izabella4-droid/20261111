<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>izのおもちゃ箱</title>
<style>
:root{--ink:#2f3a44;--sub:#8d9298;--line:#dde1e5}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink)}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
 padding:max(40px,env(safe-area-inset-top,0px)) 20px max(28px,env(safe-area-inset-bottom,0px));
 font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,"Noto Sans JP",system-ui,sans-serif;
 -webkit-tap-highlight-color:transparent}
header{text-align:center;margin:6vh 0 5vh}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.12em}
nav{width:100%;max-width:420px;border-top:1px solid var(--line)}
nav a,nav .soon{display:flex;align-items:center;gap:14px;padding:18px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
nav .en{flex:0 0 auto;width:112px;white-space:nowrap;font:400 10px/1 Georgia,"Times New Roman",serif;letter-spacing:.2em;color:var(--sub)}
nav .ja{flex:1;font-size:16px;font-weight:600;letter-spacing:.06em}
nav .go{color:#b3b8bd;font-size:15px}
nav a:hover .ja,nav a:focus-visible .ja{text-decoration:underline;text-underline-offset:4px}
nav .soon{color:#b3b8bd}nav .soon .ja{font-weight:400}
nav .soon small{font-size:11px;letter-spacing:.1em}
footer{margin-top:auto;padding-top:9vh;display:flex;flex-direction:column;align-items:center;gap:12px}
.concept{margin:0;font-size:13px;letter-spacing:.14em;color:var(--sub)}
.brain{display:flex;flex-direction:column;align-items:center;gap:4px;color:#7b838b;text-decoration:none}
.brain svg{width:34px;height:34px}
.brain span{font:400 10px/1 Georgia,"Times New Roman",serif;letter-spacing:.3em;text-indent:.3em}
.brain:hover,.brain:focus-visible{color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>izのおもちゃ箱</h1>
</header>

<nav aria-label="部屋">
  <a href="toybox/"><span class="en">TOY BOX</span><span class="ja">おもちゃ箱</span><span class="go">›</span></a>
  <a href="lab/"><span class="en">LABORATORY</span><span class="ja">実験室</span><span class="go">›</span></a>
  <a href="utility/"><span class="en">UTILITY ROOM</span><span class="ja">実用の部屋</span><span class="go">›</span></a>
  <div class="soon" aria-disabled="true"><span class="en">CINEMA</span><span class="ja">映画館 <small>準備中</small></span></div>
  <a href="https://iz3ico.github.io/app/" target="_blank" rel="noopener noreferrer"><span class="en">OTHER WORLD</span><span class="ja">あそびば</span><span class="go">↗</span></a>
</nav>

<footer>
  <p class="concept">自分がほしいものを好きなだけつくる</p>
  <a class="brain" href="brain/" aria-label="BRAIN（演出つきの入り口）へ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g id="bh"><path d="M12 5.2C11.2 3.9 9.4 3.4 8 4.2 6.5 4.6 5.8 6.2 6.3 7.5 4.7 8.2 4.2 10.2 5.2 11.6 4.6 13.1 5.2 15 6.7 15.7 6.7 17.4 8.2 18.6 9.7 18.4 10.7 19.2 11.7 19 12 18.4"/><path d="M12 5.2V18.4M8.2 9.2C9.2 9.2 10 9.8 10.4 10.6M7.6 14C8.8 13.8 9.8 13.2 10.2 12.4"/></g><use href="#bh" transform="translate(24 0) scale(-1 1)"/></svg>
    <span>BRAIN</span>
  </a>
</footer>
</body>
</html>
