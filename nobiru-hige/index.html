<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伸びるヒゲ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body {
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
    touch-action: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    max-width: 100%;
  }
  /* スマホ用ソフトキー（タッチ端末だけ表示） */
  #pad {
    display: none;
    width: 100%;
    max-width: 512px;
    padding: 0 14px;
    justify-content: space-between;
    align-items: center;
  }
  .pad-g { display: flex; gap: 14px; }
  .pb {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    border: 3px solid rgba(255,255,255,0.5);
    color: #fff;
    font-size: 26px;
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .pb.jump { width: 92px; height: 92px; border-color: #f88; background: rgba(220,60,60,0.3); }
  .pb.on { background: rgba(255,255,255,0.42); }
  .pb.jump.on { background: rgba(255,90,90,0.6); }
  @media (pointer: coarse) {
    #pad { display: flex; }
    canvas { max-height: calc(100vh - 175px); }
  }
  #top { display: flex; justify-content: flex-end; width: 100%; }
  #resetBtn {
    font: bold 15px 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif;
    color: #fff; background: #c8282a; border: 3px solid #fff; box-shadow: 3px 3px 0 #000;
    padding: 4px 14px; cursor: pointer; touch-action: manipulation;
  }
  #resetBtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  .pb.fire { display: none; border-color: #fb4; background: rgba(255,140,0,0.3); }
  .pb.fire.show { display: flex; }
  .pb.fire.on { background: rgba(255,170,40,0.65); }
  #endov {
    display: none; position: absolute; inset: 4px; z-index: 5;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; color: #fff;
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif;
    animation: fadein 2s steps(8) 1;
  }
  #endov .t { font: bold clamp(34px, 9vw, 58px) 'Courier New', monospace; color: #ff4040; text-shadow: 4px 4px 0 #000; letter-spacing: 3px; }
  #endov .s { font-size: clamp(13px, 3.4vw, 18px); text-shadow: 2px 2px 0 #000; }
  #endov button {
    font: bold clamp(16px, 4.5vw, 22px) 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif;
    color: #fff; background: #c8282a; border: 4px solid #fff; box-shadow: 4px 4px 0 #000; padding: 8px 28px; cursor: pointer;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  #stage { position: relative; display: flex; max-width: 100%; }
  #start {
    position: absolute; inset: 4px;
    background: rgba(10,12,40,0.8);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 12px; text-align: center; color: #fff;
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif;
  }
  #start .t { font: bold clamp(26px, 7vw, 44px) 'Courier New', monospace; color: #ffec27; text-shadow: 3px 3px 0 #a0301c; letter-spacing: 2px; }
  #start .s { font-size: clamp(13px, 3.4vw, 18px); }
  #start .h { font-size: clamp(11px, 2.8vw, 14px); color: #c2c3c7; line-height: 1.7; }
  #start button {
    font: bold clamp(18px, 5vw, 26px) 'Courier New', monospace;
    color: #fff; background: #2f8f3a; border: 4px solid #fff; box-shadow: 4px 4px 0 #000;
    padding: 10px 34px; cursor: pointer; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { background: #46b552; } }
  canvas {
    background-color: #5c94fc;
    image-rendering: pixelated;
    border: 4px solid #fff;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
    max-width: 100vw;
    max-height: calc(100vh - 56px);
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><button id="resetBtn" type="button">詰み（リセット）</button></div>
  <div id="stage">
    <canvas id="game" width="512" height="448"></canvas>
    <div id="start">
      <div class="t">NOBIRU HIGE</div>
      <div class="s">焼かないと菌は増える</div>
      <button id="startBtn" type="button">START</button>
      <div class="h">← → ：あるく　スペース：ジャンプ<br>スマホは画面下のボタン</div>
    </div>
    <div id="endov">
      <div class="t">BAD END</div>
      <div class="s">焼いても、土の中の菌は 消えなかった…</div>
      <button id="endBtn" type="button">もういちど</button>
    </div>
  </div>
  <div id="pad">
    <div class="pad-g">
      <div class="pb" id="pad-left">◀</div>
      <div class="pb" id="pad-right">▶</div>
    </div>
    <div class="pad-g">
      <div class="pb fire" id="pad-fire">火</div>
      <div class="pb jump" id="pad-jump">▲</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// --- Web Audio API (ファミコン風チップチューン音源) ---
let audioCtx = null;
let masterOut = null;   // マスター（コンプレッサー経由）
let activeVoices = 0;   // 鳴っている効果音の数（多すぎる時は鳴らさない）
const MAX_SFX_VOICES = 10;
let bgmPlaying = false;
let bgmInterval = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // 音が重なりまくっても割れないよう、コンプレッサーで潰す
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -20;
    comp.knee.value = 12;
    comp.ratio.value = 8;
    comp.attack.value = 0.002;
    comp.release.value = 0.12;
    masterOut = audioCtx.createGain();
    masterOut.gain.value = 0.9;
    masterOut.connect(comp);
    comp.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playTone(freq, type, duration, vol = 0.1, slideTo = null, isBgm = false) {
  if (!audioCtx) return;
  if (!isBgm) {
    if (activeVoices >= MAX_SFX_VOICES) return; // 同時発音数の上限
    activeVoices++;
  }
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slideTo) {
    osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
  }
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(masterOut);
  if (!isBgm) osc.onended = () => { activeVoices--; };
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

// 効果音
function sfxJump() {
  playTone(180, 'square', 0.25, 0.08, 520);
}
let lastPopTime = 0;
function sfxStomp() {
  // プチッ。踏みまくっても破綻しないよう、間引き＋数が多いほど小さく・短く
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const n = enemies.length;
  const gap = n > 150 ? 0.06 : n > 40 ? 0.045 : 0.03;
  if (now - lastPopTime < gap) return;
  lastPopTime = now;
  const vol = 0.12 / Math.sqrt(1 + n / 25);
  const f = 500 + Math.random() * 900;
  playTone(f, 'square', 0.035, vol, f * 2.2);
}
function sfxPowerup() {
  // 伸びる音
  const notes = [330, 392, 659, 523, 587, 784];
  notes.forEach((n, i) => {
    setTimeout(() => playTone(n, 'square', 0.07, 0.08), i * 45);
  });
}
function sfxThump() {
  // ドスン（着地で大量に潰れた時）
  playTone(120, 'square', 0.14, 0.14, 45);
  playTone(70, 'triangle', 0.18, 0.12, 35);
}
function sfxShrink() {
  // 縮む音
  const notes = [784, 587, 523, 392, 330, 220];
  notes.forEach((n, i) => {
    setTimeout(() => playTone(n, 'sawtooth', 0.07, 0.08), i * 45);
  });
}

// 陽気なBGMループ（オリジナル）
function startBGM() {
  // 周波数テーブル
  const N = {
    C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
    C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, _:0
  };
  const melody = [
    N.C5, N._, N.E5, N._, N.G5, N._, N.E5, N._,
    N.D5, N._, N.F5, N._, N.A5, N._, N.F5, N._,
    N.E5, N._, N.G5, N._, N.C5, N._, N._, N._,
    N.A4, N._, N.C5, N.D5, N.E5, N._, N.D5, N._,
    N.G4, N._, N.B4, N._, N.D5, N._, N.B4, N._,
    N.C5, N._, N.E5, N.D5, N.C5, N._, N._, N._
  ];
  const bass = [
    N.C4, N._, N.G4, N._, N.C4, N._, N.G4, N._,
    N.D4, N._, N.A4, N._, N.D4, N._, N.A4, N._,
    N.C4, N._, N.G4, N._, N.E4, N._, N._, N._,
    N.F4, N._, N.C5, N._, N.F4, N._, N.C5, N._,
    N.G4, N._, N.D4, N._, N.G4, N._, N.D4, N._,
    N.C4, N._, N.G4, N._, N.C4, N._, N._, N._
  ];
  let step = 0;
  bgmInterval = setInterval(() => {
    if (!bgmPlaying) return;
    const m = melody[step % melody.length];
    const b = bass[step % bass.length];
    if (m > 0) playTone(m, 'square', 0.11, 0.04, null, true);
    if (b > 0) playTone(b / 2, 'triangle', 0.13, 0.06, null, true);
    step++;
  }, 145);
}

// --- ゲーム定数・状態 ---
const GRAVITY = 0.55;
const GROUND_Y = 400;
const MAX_SCALE = 1e9;  // 大きくなる上限（事実上なし）
const MIN_SCALE = 0.2;  // 小さくなる下限

const keys = {};
let started = false;
function startGame() {
  if (started) return;
  started = true;
  document.getElementById('start').style.display = 'none';
  initAudio();
  if (!bgmPlaying) { bgmPlaying = true; startBGM(); } // 音楽はSTARTを押してから
  spawnDrop();
  spawnDrop();
}
// 詰みボタン：最初の状態に戻す（音楽はそのまま）
function resetGame() {
  if (!started) return;
  score = 0;
  items.length = 0; enemies.length = 0; spores.length = 0;
  splats.length = 0; rings.length = 0; particles.length = 0;
  player.scaleX = 1; player.scaleY = 1;
  player.x = 240; player.y = GROUND_Y - player.h;
  player.vx = 0; player.vy = 0; player.onGround = false;
  player.chain = 0; player.invuln = 0; player.lastSin = 0; player.walkFrame = 0;
  shake = 0; pendingLand = null; spawnTimer = 0;
  crushCount = 0; nextPowerAt = 40; lastPowerTick = -9999;
  for (const k in keys) keys[k] = false;
  resetEnding();
  spawnDrop(); spawnDrop();
}
document.getElementById('endBtn').addEventListener('pointerdown', e => { e.preventDefault(); resetGame(); });
document.getElementById('resetBtn').addEventListener('pointerdown', e => { e.preventDefault(); resetGame(); });
document.getElementById('startBtn').addEventListener('pointerdown', e => { e.preventDefault(); startGame(); });
window.addEventListener('keydown', e => {
  if (!started) {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGame(); }
    return;
  }
  keys[e.code] = true;
  initAudio();
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
});
canvas.addEventListener('mousedown', initAudio);

// ソフトキー（複数同時押し対応：左右とジャンプを別々に押せる）
function bindPad(id, code) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); if (!started) { startGame(); return; } initAudio(); keys[code] = true; el.classList.add('on'); };
  const off = e => { e.preventDefault(); keys[code] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, off));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindPad('pad-left', 'ArrowLeft');
bindPad('pad-right', 'ArrowRight');
bindPad('pad-jump', 'Space');
bindPad('pad-fire', 'KeyX');

// プレイヤー（ヒゲおじさん）
const player = {
  x: 240,
  y: GROUND_Y - 32,
  vx: 0,
  vy: 0,
  baseW: 24,
  baseH: 32,
  scaleX: 1.0,
  scaleY: 1.0, // 縦横同じ倍率で大きく／小さくなる（細長くしない）
  dir: 1,
  onGround: false,
  invuln: 0,
  chain: 0, // 着地せずに連続で踏んだ回数（増えるほど跳ねが小さくなる）
  lastSin: 0, // 歩きの足運び判定用
  fire: false, // 白い花で変身（火炎放射器）
  walkFrame: 0,
  get w() { return Math.max(2, this.baseW * this.scaleX); },
  get h() { return Math.max(2, this.baseH * this.scaleY); }
};

let score = 0;
let items = [];   // 成長キノコ
let enemies = []; // 敵キノコ（踏むと増殖）
let particles = [];
let spores = [];  // 飛んでいる胞子（着地するとキノコになる）
let spawnTimer = 0;
let tick = 0; // 経過フレーム（波の位相に使う）

// 敵キノコの定数
const ENEMY_BASE = 24;        // 最初の大きさ
const ENEMY_SHRINK = 0.96;    // 胞子から育つたびに、ほんの少しだけ小さくなる倍率
const ENEMY_MIN = 5;          // これ以上は小さくならない
const MAX_ENEMIES = 450;      // 増殖の上限（超えたら増えずに入れ替わる）
const SLOW_START = 60;        // これ以上の数で処理落ち風になる

// 体重：大きいほど重力が強く（最大2.5倍）、小さいほど普通のまま
function playerWeight() { return 1 + Math.min(1.5, Math.max(0, player.scaleY - 1) * 0.15); }

// 踏んだときの跳ね返り：大きい（重い）ほど浮かない。連続で踏むほど小さくなる。最低限の浮きは確保
function stompBounce(e, harmless) {
  const mass = player.scaleY * player.scaleY;
  const base = harmless ? 4.2 + 4.8 / (1 + mass * 0.25)
                        : 6.0 + 4.0 / (1 + mass * 0.25);
  const sizeF = 0.8 + 0.2 * Math.min(1, e.size / ENEMY_BASE); // 小さい敵ほど少しだけ弾まない
  const decay = Math.max(0.55, Math.pow(0.93, player.chain));
  player.chain++;
  return -Math.max(3.4, base * sizeF * decay);
}

// ---- 潰す演出・胞子 ----
let splats = [];  // 潰れたキノコの跡
let rings = [];   // 着地の衝撃波
let shake = 0;    // 画面の揺れ
let pendingLand = null; // 着地の衝撃で潰す位置（x）

// ある程度潰すと、潰れたキノコのひとつがパワーアップキノコに変わる（連発しないよう制限つき）
let crushCount = 0;
let nextPowerAt = 40;       // この数だけ潰したら
let lastPowerTick = -9999;  // 前回の変身フレーム
const POWER_COOLDOWN = 480; // 前回から最低これだけ（約8秒）あける
function maybePowerUp(e) {
  if (phase !== 'play') return;
  crushCount++;
  if (crushCount < nextPowerAt || tick - lastPowerTick < POWER_COOLDOWN || items.length >= 3) return;
  const cx = e.x + e.w / 2;
  items.push({
    x: Math.max(0, Math.min(canvas.width - 22, cx - 11)), y: e.y + e.h - 24,
    vx: (Math.random() < 0.5 ? -1 : 1) * 1.2, vy: -5, w: 22, h: 22, onGround: false
  });
  crushCount = 0;
  nextPowerAt = 30 + Math.floor(Math.random() * 30);
  lastPowerTick = tick;
  addParticles(cx, e.y + e.h / 2, '#ffec27', 10);
  playTone(880, 'square', 0.08, 0.08, 1320);
}

function splatEnemy(e) {
  maybePowerUp(e);
  if (splats.length < 120) {
    splats.push({ x: e.x + e.w / 2, y: e.y + e.h, w: e.size, cap: e.capColor, dark: e.darkColor, life: 28 });
  }
}

// 潰れたキノコの分の胞子を飛ばす（vxsの数だけ）
function emitSpores(e, ox, oy, vxs) {
  const cs = Math.max(ENEMY_MIN, e.size * ENEMY_SHRINK);
  const room = MAX_ENEMIES - enemies.length - spores.length;
  const n = Math.min(room, vxs.length);
  for (let k = 0; k < n; k++) {
    spores.push({
      x: ox, y: oy, vx: vxs[k], vy: -3.5 - Math.random() * 3,
      size: cs,
      hue: (e.hue + (Math.random() - 0.5) * 40 + 360) % 360,
      light: Math.max(28, Math.min(62, e.light + (Math.random() - 0.5) * 16)),
      safe: e.w < footSize() ? 0 : 45,
      age: 0
    });
  }
}

// 歩き：片足ずつ、足の下のキノコがぶちぶち潰れ、足の脇に胞子が飛ぶ
function footCrush(side) {
  if (phase === 'fire') return;
  const cx = player.x + player.w / 2 + side * 6 * player.scaleX;
  const fw = 9 * player.scaleX;
  const fs = footSize();
  let cnt = 0;
  for (let i = enemies.length - 1; i >= 0 && cnt < 8; i--) {
    const e = enemies[i];
    if (e.w >= fs) continue;
    if (e.x > cx + fw / 2 || e.x + e.w < cx - fw / 2) continue;
    if (e.y + e.h < GROUND_Y - 8 - 4 * player.scaleY) continue;
    enemies.splice(i, 1);
    cnt++;
    splatEnemy(e);
    emitSpores(e, cx, GROUND_Y - 6, [-(0.8 + Math.random() * 1.8), 0.8 + Math.random() * 1.8]);
  }
  if (cnt > 0) {
    sfxStomp();
    score += 10 * cnt;
    shake = Math.max(shake, 0.8);
  }
}

// ジャンプの着地：まわりのキノコが大量に潰れ、外側へ胞子が飛んで生まれる
function landingCrush(cx) {
  if (phase === 'fire') return;
  const fs = footSize();
  const R = 30 + fs * 0.9;
  let cnt = 0;
  for (let i = enemies.length - 1; i >= 0 && cnt < 90; i--) {
    const e = enemies[i];
    if (e.w >= fs) continue;
    const ex = e.x + e.w / 2;
    if (Math.abs(ex - cx) > R) continue;
    if (e.y + e.h < GROUND_Y - 40 - 10 * player.scaleY) continue;
    enemies.splice(i, 1);
    cnt++;
    splatEnemy(e);
    const away = ex >= cx ? 1 : -1;
    emitSpores(e, ex, e.y + e.h / 2, [away * (1.5 + Math.random() * 2.5), away * (0.6 + Math.random() * 1.4)]);
  }
  score += 10 * cnt;
  rings.push({ x: cx, r: 10, max: R, life: 18 });
  shake = Math.max(shake, Math.min(9, 3 + cnt * 0.15));
  sfxThump();
  if (particles.length < 160) addParticles(cx, GROUND_Y - 6, '#fff1a8', 8);
}

// 足の大きさ（両足を合わせた幅）。敵がこれより小さいと、触れてもダメージなし
function footSize() { return 20 * player.scaleX; }

function enemyColor(hue, light) {
  return {
    cap: `hsl(${hue}, 85%, ${light}%)`,
    dark: `hsl(${hue}, 70%, ${Math.max(10, light - 18)}%)`
  };
}

function makeEnemy(x, y, size, hue, light, vx, vy, safeTimer) {
  const c = enemyColor(hue, light);
  return {
    type: 'goomba', x, y, vx, vy,
    w: size, h: size, size, hue, light,
    capColor: c.cap, darkColor: c.dark,
    safeTimer: safeTimer || 0, frame: Math.random() * 4, burn: 0
  };
}

// 初期配置（パワーアップキノコ多め）
function spawnDrop() {
  const x = 40 + Math.random() * (canvas.width - 80);
  if (Math.random() < 0.3) {
    // 成長キノコ（出現は控えめ）
    if (phase === 'play' && items.length < 6) {
      items.push({
        x, y: -20, vx: (Math.random() < 0.5 ? -1 : 1) * 1.4, vy: 0,
        w: 22, h: 22, onGround: false
      });
    }
  } else if (enemies.length < 28) {
    // 敵キノコ
    enemies.push(makeEnemy(x, -20, ENEMY_BASE, 18, 41,
      (Math.random() < 0.5 ? -1 : 1) * 1.3, 0, 0));
  }
}

function addParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,

    const len = Math.floor(audioCtx.sampleRate * 1.5);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);

// 燃えているキノコ：慌てて走る→黒焦げ→灰になって消える。近くのキノコに燃え移る（全焼）
function burnTick(e, i) {
  e.burn++;

  if (b > 64) {
    enemies.splice(i, 1);

    const cx = e.x + e.w / 2;
    scorch.push({ x: cx, w: e.size * 1.2 });

    for (let k = 0; k < 2; k++) flames.push({ kind: 'a', x: cx, y: e.y + e.h * 0.4, vx: (Math.random() - 0.5) * 0.8, vy: -0.6 - Math.random() * 0.8, life: 0, max: 50 + Math.random() * 30, size: 2 });
    return true;
  }
  if (b < 40) {
    if (Math.abs(e.vx) < 1.6) e.vx = (e.vx >= 0 ? 1 : -1) * (1.6 + Math.random() * 0.8);
    if (e.y + e.h >= GROUND_Y - 0.5 && Math.random() < 0.07) e.vy = -3.2;
  } else {
    e.vx *= 0.8;

  if (b > 5 && b < 38 && (tick + i) % 3 === 0) {
    const r = e.w * 0.8 + 6;
    for (const o of enemies) {
      if (!o.burn && Math.abs(o.x - e.x) < r && Math.abs(o.y - e.y) < 22 && Math.random() < 0.7) o.burn = 1;

function updateFire() {
  if (transform) {
    transform.t++;
    const k = Math.min(1, transform.t / 70);
    const ease = k * k * (3 - 2 * k);
    const s = Math.exp(Math.log(transform.s0) * (1 - ease));
    player.scaleX = player.scaleY = s;
    player.y = GROUND_Y - player.h; player.vy = 0; player.vx = 0;
    if (transform.t % 2 === 0) {
      flames.push({ kind: 'tw', x: player.x + Math.random() * player.w, y: player.y + Math.random() * player.h, vx: 0, vy: -0.5, life: 0, max: 22, size: 3 });

      player.y = GROUND_Y - player.h;

    igniteInFlame(nz, firing);

}

// 炎・煙・火の粉・灰
function updateFlames() {
  for (let i = flames.length - 1; i >= 0; i--) {
    const p = flames[i];
    p.life++;
    if (p.life >= p.max) {
      if (p.kind === 'f' && p.size > 3 && flames.length < 900 && Math.random() < 0.18) {
        flames.push({ kind: 's', x: p.x, y: p.y, vx: p.vx * 0.3, vy: -0.5, life: 0, max: 40, size: p.size * 0.8 });
      }
      flames.splice(i, 1);
      continue;
    }
    if (p.kind === 'f') {
      p.vx *= 0.972;
      p.vy -= 0.05;
      p.vy += Math.sin(p.life * 0.5 + p.seed) * 0.07;
      p.x += p.vx; p.y += p.vy;
      p.size += 0.16;
      if (p.y > GROUND_Y - 2) { p.y = GROUND_Y - 2; p.vy *= -0.25; p.vx *= 0.85; }
    } else if (p.kind === 's') {
      p.vx *= 0.98; p.vy -= 0.01;
      p.x += p.vx + Math.sin(p.life * 0.15 + i) * 0.15; p.y += p.vy;
      p.size += 0.1;
    } else if (p.kind === 'e' || p.kind === 'a') {
      p.vy -= 0.02; p.vx += (Math.random() - 0.5) * 0.15;
      p.x += p.vx; p.y += p.vy;
    } else {
      p.y += p.vy;
    }
  }
}
function flameColor(t) {

}

    const t = p.life / p.max;
    ctx.globalAlpha = t > 0.75 ? (1 - t) / 0.25 : 1;
    ctx.fillStyle = flameColor(t);
    const sz = Math.max(2, px2(p.size));
    ctx.fillRect(px2(p.x) - sz / 2, px2(p.y) - sz / 2, sz, sz);
  }

    g.addColorStop(0, 'rgba(255,170,40,0.38)');
    g.addColorStop(1, 'rgba(255,90,0,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.round(nz.x) - 4 + (nz.dir > 0 ? 2 : -2), Math.round(nz.y) - 4, 8, 8);

function burstFirework(r) {
  const n = 46 + Math.floor(Math.random() * 30);
  const hue2 = (r.hue + 150) % 360;
  for (let k = 0; k < n; k++) {
    const a = Math.PI * 2 * k / n + Math.random() * 0.05;
    let sp = 1.5 + Math.random() * 3.2, grav = 0.03, max = 40 + Math.random() * 20, hue = r.hue;
    if (r.kind === 1) { sp = 3.4; }
    if (r.kind === 2) { sp = 1.2 + Math.random() * 2.2; grav = 0.07; max = 70; }
    if (r.kind === 3) { sp = k % 2 ? 2 : 4; hue = k % 2 ? r.hue : hue2; }
    sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max, hue, grav });
  }
  shake = Math.max(shake, 1.5);
  const now = performance.now();
  if (now - lastBoom > 150) {
    lastBoom = now;
    playTone(140, 'square', 0.16, 0.1, 45, true);
    for (let i = 0; i < 3; i++) setTimeout(() => playTone(2000 + Math.random() * 2000, 'square', 0.02, 0.03, null, true), 80 + i * 70);

}
function updateFireworks() {

    const r = fireworks[i];
    r.y += r.vy; r.vy *= 0.985;
    sparks.push({ x: r.x, y: r.y, vx: (Math.random() - 0.5) * 0.4, vy: 0.6, life: 0, max: 14, hue: 40, grav: 0.02 });
    if (r.y <= r.burst || r.vy > -1.2) { burstFirework(r); fireworks.splice(i, 1); }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.life++; p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= 0.985;
    if (p.life >= p.max) sparks.splice(i, 1);
  }

function drawFireworks() {

function updateClear() {
  const t = phaseT;
  dusk = Math.min(0.5, t / 200 * 0.5);
  if (t > 15 && t % 24 === 0) launchFirework();

  updateFireworks();
  if (t >= 40) {
    const k = Math.min(1, (t - 40) / 170);
    flagH = 1 - (1 - k) * (1 - k);
    if (flagH >= 1 && !flagDone) {
      flagDone = true;
      score += 5000;
      for (let i = 0; i < 14; i++) flames.push({ kind: 'tw', x: POLE_X - 12 + Math.random() * 24, y: POLE_TOP + Math.random() * 24, vx: 0, vy: -0.4, life: 0, max: 26, size: 3 });
      playTone(1319, 'square', 0.3, 0.08, null, true);
    }
  }
  if (t >= 60 && !playerGone) {

    player.x += 2.6;

    player.onGround = true;
    player.y = GROUND_Y - player.h;

}

// --- 更新処理 ---
function update() {
  tick++;
  phaseT++;
  flash *= 0.9;
  if (phase === 'clear' || phase === 'bad' || phase === 'end') { updateEnding(); return; }
  dusk += ((phase === 'fire' ? 0.3 : 0) - dusk) * 0.03;
  // スポーン処理（ぽつぽつ降ってくる）
  spawnTimer++;
  if (spawnTimer > 60) {
    spawnTimer = 0;
    if (phase === 'play' || phase === 'flower') spawnDrop();
  }

  // プレイヤー移動
  const speed = (phase === 'fire' && firing > 0) ? 2.4 : 3.8;
  if (keys['ArrowLeft'] || keys['KeyA']) {
    player.vx = -speed;
    player.dir = -1;
    player.walkFrame += 0.3;
  } else if (keys['ArrowRight'] || keys['KeyD']) {
    player.vx = speed;
    player.dir = 1;
    player.walkFrame += 0.3;
  } else {
    player.vx *= 0.75;
    player.walkFrame = 0;
  }

  if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || keys['KeyZ']) && player.onGround) {
    player.vy = -11.5;
    player.onGround = false;
    sfxJump();
  }

  player.vy += GRAVITY * playerWeight(); // 大きいほど重い
  player.x += player.vx;
  player.y += player.vy;

  // 画面端ループまたは壁反射
  // 画面より大きくなっても動けるよう、はみ出す側を許す
  const minX = Math.min(0, canvas.width - player.w);
  const maxX = Math.max(0, canvas.width - player.w);
  if (player.x < minX) player.x = minX;
  if (player.x > maxX) player.x = maxX;

  // 地面接地（空中ではonGroundをfalseに戻す＝空中ジャンプ不可）
  const wasOn = player.onGround;
  const fallVy = player.vy;
  player.onGround = false;
  if (player.y + player.h >= GROUND_Y) {
    player.y = GROUND_Y - player.h;
    player.vy = 0;
    player.onGround = true;
    player.chain = 0;
    if (!wasOn && fallVy > 2.5) pendingLand = player.x + player.w / 2; // 着地の衝撃
  }

  // 歩き：足が着くたびに片足ずつ潰す
  if (player.onGround && Math.abs(player.vx) > 1) {
    const sn = Math.sin(player.walkFrame);
    if (player.lastSin !== 0 && Math.sign(sn) !== Math.sign(player.lastSin)) footCrush(sn > 0 ? 1 : -1);
    player.lastSin = sn;
  } else {
    player.lastSin = 0;
  }

  if (player.invuln > 0) player.invuln--;

  // 成長キノコ更新
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.vy += GRAVITY * 0.6;
    it.x += it.vx;
    it.y += it.vy;

    if (it.x <= 0 || it.x + it.w >= canvas.width) it.vx *= -1;
    if (it.y + it.h >= GROUND_Y) {
      it.y = GROUND_Y - it.h;
      it.vy = 0;
    }

    if (rectHit(player, it)) {
      // 縦横そろって大きくなる（細長くならない）。足も大きくなるので敵が無害になっていく
      const oldH = player.h;
      const ns = Math.min(MAX_SCALE, player.scaleY * 1.3);
      player.scaleY = ns;
      player.scaleX = ns;
      player.y -= (player.h - oldH); // 地面にめり込まないよう上へ伸ばす
      score += 100;
      sfxPowerup();
      addParticles(it.x + it.w/2, it.y + it.h/2, '#ff3333', 10);
      items.splice(i, 1);
    }
  }

  // 敵更新
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.safeTimer > 0) e.safeTimer--;
    e.frame += 0.15;
    if (e.burn > 0 && burnTick(e, i)) continue;

    e.vy += GRAVITY * 0.8;
    // 波のように：群れ全体が寄せては返し、ぴょこぴょこと跳ねの波が横に伝わる
    const wave = Math.sin(tick * 0.025 + e.x * 0.02) * 0.9;
    const grounded = e.y + e.h >= GROUND_Y - 0.5;
    if (grounded && Math.sin(tick * 0.09 - e.x * 0.03) > 0.985) e.vy = -2.6 - Math.random() * 0.8;
    e.x += e.vx + wave;
    e.y += e.vy;

    // 壁で跳ね返る
    if (e.x <= 0) { e.x = 0; e.vx = Math.abs(e.vx); }
    if (e.x + e.w >= canvas.width) { e.x = canvas.width - e.w; e.vx = -Math.abs(e.vx); }

    // 地面
    if (e.y + e.h >= GROUND_Y) {
      e.y = GROUND_Y - e.h;
      e.vy = 0;
    }

    // プレイヤーとの接触判定
    if (phase !== 'fire' && rectHit(player, e)) {
      const prevBottom = (player.y - player.vy) + player.h;
      const isStomp = player.vy > 0 && prevBottom <= e.y + e.h * 0.65;
      const harmless = e.w < footSize(); // 足より小さい敵はダメージなし

      if (isStomp) {
        // 踏んだ！ 小さい敵は軽く踏める（バウンドも小さい）
        const impactVy = player.vy;
        player.vy = stompBounce(e, harmless);
        sfxStomp();
        score += 100;

        // 踏まれたキノコはぺしゃんこに潰れて消え、両脇に胞子が飛んで、着地したところで新しいキノコになる
        const cxE = e.x + e.w / 2;
        enemies.splice(i, 1);
        splatEnemy(e);
        const d = Math.random() < 0.5 ? 1 : -1;
        emitSpores(e, cxE, e.y + e.h / 2, [d * (0.8 + Math.random() * 1.6), -d * (0.8 + Math.random() * 1.6)]);
        // 勢いよく小さいキノコを踏んだら、まわりも一気に潰れる
        if (harmless && impactVy > 2.5) pendingLand = player.x + player.w / 2;
        if (particles.length < 160) addParticles(cxE, e.y + e.h / 2, e.capColor, enemies.length > 60 ? 2 : 6);
      } else if (!harmless && e.safeTimer <= 0 && player.invuln <= 0) {
        // 足より大きいキノコに横・下から当たると、無限に小さくなっていく！
        const oldH = player.h;
        const ns = Math.max(MIN_SCALE, player.scaleY * 0.7);
        player.scaleY = ns;
        player.scaleX = ns;
        player.y += (oldH - player.h);
        player.invuln = 55;
        player.vy = -5;
        sfxShrink();
        addParticles(player.x + player.w/2, player.y + player.h/2, '#ffffff', 12);
      }
    }
  }

  if (pendingLand !== null) { landingCrush(pendingLand); pendingLand = null; }
  if (phase === 'play' && player.h >= canvas.height) enterFlower();
  if (phase === 'flower') updateFlower();
  if (phase === 'fire') updateFire();
  updateFlames();

  // 潰れた跡・衝撃波・画面揺れ
  for (let i = splats.length - 1; i >= 0; i--) { if (--splats[i].life <= 0) splats.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += (r.max - r.r) * 0.3 + 2;
    if (--r.life <= 0) rings.splice(i, 1);
  }
  shake *= 0.85;

  // 胞子の更新：ふわっと飛んで、着地したらキノコに育つ
  for (let i = spores.length - 1; i >= 0; i--) {
    const sp = spores[i];
    sp.age++;
    sp.vy += 0.22;
    sp.x += sp.vx;
    sp.y += sp.vy;
    if (sp.x < 4 || sp.x > canvas.width - 4) { sp.vx *= -1; sp.x = Math.max(4, Math.min(canvas.width - 4, sp.x)); }
    if ((sp.vy > 0 && sp.y >= GROUND_Y - sp.size * 0.5) || sp.age > 150) {
      const sz = sp.size;
      enemies.push(makeEnemy(
        Math.max(0, Math.min(canvas.width - sz, sp.x - sz / 2)),
        GROUND_Y - sz, sz, sp.hue, sp.light,
        (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random() * 0.6), -2, sp.safe
      ));
      spores.splice(i, 1);
    }
  }

  // パーティクル更新
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.25;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// --- 描画処理 (ファミコン風ドット絵) ---
function drawPlayer() {
  if (phase === 'bad' || phase === 'end') return;
  if (player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0) return;

  ctx.save();
  ctx.translate(player.x + player.w / 2, player.y + player.h);
  ctx.scale(player.dir * player.scaleX, player.scaleY);

  // 基準サイズ: 24x32 (原点は足元中央)
  // どんなに伸びても縮んでも比率で描画
  const step = Math.sin(player.walkFrame) * 3;
  const armed = player.fire && phase === 'fire';
  if (armed) drawTank();

  // 靴
  ctx.fillStyle = '#6b2c00';
  ctx.fillRect(-10 + step, -5, 8, 5);
  ctx.fillRect(2 - step, -5, 8, 5);

  // オーバーオール（青）
  ctx.fillStyle = player.fire ? '#e0481a' : '#c88a1a';
  ctx.fillRect(-8, -16, 16, 11);

  // シャツ（赤）
  ctx.fillStyle = player.fire ? '#ffffff' : '#7a3fb0';
  ctx.fillRect(-10, -17, 20, 6);
  // 黄色いボタン
  ctx.fillStyle = '#f0e8d0';
  ctx.fillRect(-5, -13, 2, 2);
  ctx.fillRect(3, -13, 2, 2);

  // 顔（肌色）
  ctx.fillStyle = '#ffa044';
  ctx.fillRect(-7, -27, 14, 10);

  // 鼻
  ctx.fillRect(6, -24, 5, 4);

  // 目
  ctx.fillStyle = '#000';
  ctx.fillRect(3, -26, 2, 3);

  // 立派なヒゲ！
  ctx.fillStyle = '#381800';
  ctx.fillRect(1, -21, 9, 3);
  ctx.fillRect(3, -22, 4, 1);

  // 帽子（赤）
  ctx.fillStyle = player.fire ? '#ffffff' : '#7a3fb0';
  ctx.fillRect(-8, -32, 16, 5);
  ctx.fillRect(-6, -29, 17, 2); // ツバ
  if (armed) drawGun();

  ctx.restore();
}

function drawItems() {
  items.forEach(it => {
    // 傘（赤地に白水玉）
    ctx.fillStyle = '#f83800';
    ctx.fillRect(it.x + 2, it.y, it.w - 4, 12);
    ctx.fillRect(it.x, it.y + 4, it.w, 8);
    ctx.fillStyle = '#fff';
    ctx.fillRect(it.x + 4, it.y + 3, 4, 4);
    ctx.fillRect(it.x + 14, it.y + 3, 4, 4);
    ctx.fillRect(it.x + 9, it.y + 7, 4, 4);

    // 軸
    ctx.fillStyle = '#ffa044';
    ctx.fillRect(it.x + 5, it.y + 12, it.w - 10, 10);
    // 目
    ctx.fillStyle = '#000';
    ctx.fillRect(it.x + 7, it.y + 14, 2, 4);
    ctx.fillRect(it.x + 13, it.y + 14, 2, 4);
  });
}

function drawEnemies() {
  const fs = footSize();
  enemies.forEach(e => {
    // 分裂直後の無敵点滅
    if (e.safeTimer > 0 && Math.floor(e.safeTimer / 3) % 2 === 0) {
      ctx.globalAlpha = 0.55;
    }
    const walk = Math.floor(e.frame) % 2 === 0 ? -1 : 1;
    let cap = e.capColor, dark = e.darkColor, stem = '#fcbcb0';
    const bt = e.burn > 0 ? Math.min(1, e.burn / 40) : 0;
    if (e.burn > 0) {
      cap = `hsl(${e.hue}, ${Math.round(85 * (1 - bt))}%, ${Math.round(e.light * (1 - bt * 0.88))}%)`;
      dark = '#1a0a05';
      stem = bt > 0.5 ? '#2a1a12' : '#d88a60';
      if (e.burn > 42) ctx.globalAlpha = Math.max(0, 1 - (e.burn - 42) / 22);
    }
    ctx.save();
    ctx.translate(e.x, e.y);
    const sc = e.size / ENEMY_BASE;
    ctx.scale(sc, sc);
    // 傘（個体ごとに微妙に違う色）
    ctx.fillStyle = cap;
    ctx.fillRect(4, 0, 16, 6);
    ctx.fillRect(1, 5, 22, 9);
    if (e.w < fs) {
      // 足より小さい＝無害。ほんわか目
      ctx.fillStyle = '#fff';
      ctx.fillRect(5, 7, 4, 5);
      ctx.fillRect(15, 7, 4, 5);
      ctx.fillStyle = '#000';
      ctx.fillRect(6, 9, 3, 3);
      ctx.fillRect(15, 9, 3, 3);
    } else {
      // 怒り眉と目
      ctx.fillStyle = '#fff';
      ctx.fillRect(5, 7, 4, 5);
      ctx.fillRect(15, 7, 4, 5);
      ctx.fillStyle = '#000';
      ctx.fillRect(7, 8, 2, 4);
      ctx.fillRect(15, 8, 2, 4);
      ctx.fillRect(5, 6, 5, 2);
      ctx.fillRect(14, 6, 5, 2);
    }
    // 軸
    ctx.fillStyle = stem;
    ctx.fillRect(7, 14, 10, 6);
    // 足
    ctx.fillStyle = dark;
    ctx.fillRect(3 + walk, 19, 7, 5);
    ctx.fillRect(14 - walk, 19, 7, 5);
    if (e.burn > 0 && bt < 0.85) {
      ctx.fillStyle = Math.floor(e.burn / 2) % 2 ? 'rgba(255,200,40,0.5)' : 'rgba(255,90,0,0.4)';
      ctx.fillRect(1, 0, 22, 14);
    }
    ctx.restore();
    ctx.globalAlpha = 1.0;
  });
}

function drawSplats() {
  splats.forEach(sp => {
    const t = sp.life / 28;
    const w = sp.w * 1.5 * (1 + (1 - t) * 0.25);
    const h = Math.max(2, sp.w * 0.22 * t);
    ctx.globalAlpha = Math.min(1, t * 1.6);
    ctx.fillStyle = sp.dark;
    ctx.fillRect(sp.x - w / 2 - 1, sp.y - h - 1, w + 2, h + 1);
    ctx.fillStyle = sp.cap;
    ctx.fillRect(sp.x - w / 2, sp.y - h, w, h);
    ctx.globalAlpha = 1;
  });
}

function drawRings() {
  rings.forEach(r => {
    ctx.globalAlpha = Math.max(0, r.life / 18);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(r.x, GROUND_Y - 2, r.r, r.r * 0.18, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
}

function drawSpores() {
  spores.forEach(sp => {
    ctx.fillStyle = `hsl(${sp.hue}, 85%, ${sp.light + 12}%)`;
    ctx.fillRect(sp.x - 2, sp.y - 2, 4, 4);
    ctx.fillStyle = '#fff';
    ctx.fillRect(sp.x - 1, sp.y - 1, 2, 2);
  });
}

function drawUI() {
  if (phase === 'bad' || phase === 'end') return;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText(`NOBIRU HIGE`, 24, 28);
  ctx.fillText(String(score).padStart(6, '0'), 24, 46);

  const heightRatio = player.scaleY >= 1
    ? (player.scaleY >= 10000 ? `x${player.scaleY.toExponential(1)}` : `x${player.scaleY.toFixed(1)}`)
    : `1/${(1 / player.scaleY).toFixed(1)}`;
  ctx.fillText(`HEIGHT: ${heightRatio}`, 200, 28);
  ctx.fillText(`ENEMIES: ${enemies.length}`, 375, 28);
  if (slowFactor < 1 && Math.floor(performance.now() / 300) % 2 === 0) {
    ctx.fillStyle = '#ffec27';
    ctx.fillText('SLOWDOWN', 200, 46);
  }
  drawBanners();
}

// 数が多いと処理落ち風にスロー＆カクつく
let slowFactor = 1;
let slowAcc = 0;
function loop() {
  const n = enemies.length + spores.length;
  slowFactor = n <= SLOW_START ? 1 : Math.max(0.4, 1 - (n - SLOW_START) / 400 * 0.6);
  slowAcc += slowFactor;
  while (slowAcc >= 1) { if (started) update(); slowAcc -= 1; }
  // たまに描画をスキップ（ファミコンのチラつき・処理落ち風）
  if (slowFactor < 1 && Math.random() < (1 - slowFactor) * 0.45) {
    requestAnimationFrame(loop);
    return;
  }
  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  drawBad();
  drawSplats();
  drawItems();
  drawEnemies();
  drawSpores();
  drawRings();
  drawPlayer();
  drawFlower();
  drawFlames();
  drawFireworks();

  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  });

  ctx.restore();
  drawFlash();
  drawCurtain();
  drawUI();
  requestAnimationFrame(loop);
}

// STARTを押すまで待機（最初の数体はstartGameで配置）
loop();
</script>
