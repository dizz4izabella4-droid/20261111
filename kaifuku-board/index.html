<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回復待ちボード</title>
<style>
/* 配置：上に要約、次に絞り込み、下にスタッフのカード。AIは左の色帯、状態はピルと数字で示す。標準の日本語フォントのみ。 */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --panel2:#ebe8e1; --ink:#1f2328; --mute:#626a72; --line:#d9d5cc;
  --accent:#27567f; --on-accent:#ffffff;
  --ok:#2a8a56; --ok-bg:#e1f2e8; --wait:#a85f00; --wait-bg:#fbeacd;
  --c-claude:#b4572f; --c-gemini:#4a5fc1; --c-chatgpt:#7a4fa3; --c-codex:#5f6b73;
  --font:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --panel:#20242a; --panel2:#2a2f36; --ink:#e9e7e2; --mute:#9aa2aa; --line:#363c44;
    --accent:#8bb8e6; --on-accent:#10161c;
    --ok:#62c78f; --ok-bg:#1d3a2a; --wait:#eaa94a; --wait-bg:#40301a;
    --c-claude:#e08a62; --c-gemini:#8c9cf0; --c-chatgpt:#c09ae6; --c-codex:#9aa6ae;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#20242a; --panel2:#2a2f36; --ink:#e9e7e2; --mute:#9aa2aa; --line:#363c44;
  --accent:#8bb8e6; --on-accent:#10161c;
  --ok:#62c78f; --ok-bg:#1d3a2a; --wait:#eaa94a; --wait-bg:#40301a;
  --c-claude:#e08a62; --c-gemini:#8c9cf0; --c-chatgpt:#c09ae6; --c-codex:#9aa6ae;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:12px 12px 40px}
h1{font-size:1.15rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{display:none}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:.82rem}
.btn:hover{background:var(--panel2)}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.main:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:3px 8px;font-size:.78rem}
.summary{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin:8px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.tile h2{font-size:.72rem;margin:0 0 3px;color:var(--mute);font-weight:600;letter-spacing:.04em}
.tile .big{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.nm{background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:0 9px;font-size:.8rem;font-weight:600}
.none{color:var(--mute);font-size:.9rem}
.filters{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}
.fl{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 11px;font-size:.82rem}
.fl[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:8px;padding:7px 8px;display:grid;grid-template-columns:68px 1fr;gap:6px 8px}
.av{position:relative;width:68px;height:68px}
.av label{display:block;width:68px;height:68px;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--panel2);border:1px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.tired img{filter:saturate(.55) brightness(.95)}
.av .ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cc);font-size:1.5rem;font-weight:700;line-height:1}
.av .ph small{font-size:.58rem;font-weight:500;color:var(--mute);margin-top:4px}
.av .sweat{position:absolute;right:0;top:0;width:30px;height:30px;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.av .x{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:.7rem;line-height:1;padding:0}
.av input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.body{min-width:0;display:flex;flex-direction:column;gap:1px}
.name{font-weight:700;font-size:.98rem;line-height:1.25}
.kana{color:var(--mute);font-size:.72rem;margin-left:5px;font-weight:400}
.uji{white-space:nowrap;color:var(--mute);font-size:.72rem;margin-right:6px;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-weight:400}
.ai{display:inline-block;color:var(--cc);border:1px solid var(--cc);border-radius:4px;padding:0 5px;font-size:.7rem;font-weight:700;line-height:1.35;align-self:flex-start}
.role{color:var(--mute);font-size:.78rem;line-height:1.3}
.st{display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:0 8px;font-size:.74rem;font-weight:700;line-height:1.6}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ready{background:var(--ok-bg);color:var(--ok)}
.pill.wait{background:var(--wait-bg);color:var(--wait)}
.rest{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex-basis:100%}
.cd{font-size:.98rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--wait);line-height:1.2}
.at{color:var(--mute);font-size:.74rem}
.ctl{grid-column:1/-1;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.t,.note{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 5px;font-size:.8rem;min-width:0}
.lb{font-size:.72rem;color:var(--mute)}
.t{width:4.4em;font-variant-numeric:tabular-nums}
.note{width:6.3em}
.ctl .btn.sm{padding:3px 6px}
.panel{grid-column:1/-1;background:var(--panel2);border-radius:6px;padding:6px;display:flex;gap:4px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:20;width:min(92vw,420px)}
.toast div{background:var(--ink);color:var(--bg);border-radius:8px;padding:9px 14px;font-size:.9rem;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.foot{margin-top:22px;color:var(--mute);font-size:.8rem}
@media (max-width:560px){
  .summary{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ .card{transition:background .2s} }
</style>
</head>

var F='all', SORT='roster', ORDER=null, OPEN=null, pubTimer=null;
var app=document.getElementById('app'), toastBox=document.getElementById('toast');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function get(id){ if(!S.m[id]) S.m[id]={reset:null,note:'',img:''}; return S.m[id]; }

function load(){
  try{ var e=JSON.parse(document.getElementById('state').textContent||'null'); if(e&&e.m) S=e; }catch(_){}
  try{ var l=JSON.parse(localStorage.getItem(LSKEY)||'null'); if(l&&l.m&&(l.at||0)>(S.at||0)) S=l; }catch(_){}
}
function save(){
  S.at=Date.now();
  try{ localStorage.setItem(LSKEY,JSON.stringify(S)); }catch(_){}
  clearTimeout(pubTimer);
  pubTimer=setTimeout(pushShared,1500);
}
async function pushShared(){
  try{
    if(typeof claude==='undefined'||!claude.use) return;
    var a=await claude.use('artifact'); if(!a) return;
    var c=document.documentElement.cloneNode(true);
    c.removeAttribute('data-theme'); c.removeAttribute('style');
    c.querySelector('#app').innerHTML=''; c.querySelector('#toast').innerHTML='';
    c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
    await a.publish('<!DOCTYPE html>\n'+c.outerHTML);
  }catch(_){}
}

function fmtRemain(ms){
  /* 1分単位で切り上げる（0342と入れたら 3時間42分 のまま表示され、1秒後に41分へ飛ばない） */
  var s=Math.max(0,Math.ceil(ms/1000));
  if(s<=60) return s+'秒';
  var tm=Math.ceil(s/60), h=Math.floor(tm/60), m=tm%60;
  if(h>0) return h+'時間'+pad(m)+'分';
  return m+'分';
}
/* 時刻はすべて日本時間（端末の設定に関係なく） */
var JF=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'});
function jstParts(ts){
  var o={}; JF.formatToParts(new Date(ts)).forEach(function(p){ if(p.type!=='literal') o[p.type]=Number(p.value); });
  return {y:o.year,mo:o.month,d:o.day,h:o.hour%24,mi:o.minute};
}
function jstTs(y,mo,d,h,mi){ return Date.UTC(y,mo-1,d,h,mi)-9*3600000; }
function fmtClock(ts){
  var p=jstParts(ts), n=jstParts(Date.now()), t=pad(p.h)+':'+pad(p.mi);
  var diff=Math.round((Date.UTC(p.y,p.mo-1,p.d)-Date.UTC(n.y,n.mo-1,n.d))/86400000);
  if(diff===0) return t; if(diff===1) return '明日 '+t;
  return p.mo+'/'+p.d+' '+t;
}
function isWait(id,now){ var r=get(id).reset; return !!(r&&r>now); }

function statusOrder(){
  var now=Date.now();
  return STAFF.map(function(s,i){return {s:s,i:i};}).sort(function(x,y){
    var wx=isWait(x.s.id,now), wy=isWait(y.s.id,now);
    if(wx!==wy) return wx?1:-1;
    if(wx&&wy) return get(x.s.id).reset-get(y.s.id).reset;
    return x.i-y.i;
  }).map(function(o){return o.s.id;});
}
/* 並びは切り替えたときだけ決める。入力のたびに並べ替えると、カードが動いて別の人の枠に入力してしまうため */
function list(){
  var a=STAFF.filter(function(s){ return F==='all'||AIKEY[s.ai]===F; });
  if(SORT==='status'&&ORDER){
    a=a.slice().sort(function(x,y){ var i=ORDER.indexOf(x.id), j=ORDER.indexOf(y.id); return (i<0?99:i)-(j<0?99:j); });
  }
  return a;
}

function card(s,now){
  var m=get(s.id), w=isWait(s.id,now), key=AIKEY[s.ai], pic=m.img||((w&&TIRED[s.id])?TIRED[s.id]:DEF[s.id])||'', tiredPic=!m.img&&w&&!!TIRED[s.id];
  var av=pic?'<img src="'+esc(pic)+'" alt="'+esc(s.n)+'のイラスト">':'<div class="ph">'+esc(s.n.charAt(0).toUpperCase())+'<small>画像</small></div>';
  var sweat=w?'<svg class="sweat" viewBox="0 0 40 40" aria-hidden="true"><path d="M26 3C26 3 17 13 17 19a9 9 0 0 0 18 0C35 13 26 3 26 3z" fill="#8fd3f4" stroke="#2a7fb0" stroke-width="1.6"/><path d="M10 17C10 17 5 23 5 26.5a5 5 0 0 0 10 0C15 23 10 17 10 17z" fill="#8fd3f4" stroke="#2a7fb0" stroke-width="1.4"/></svg>':'';
  var rm=m.img?'<button class="x" data-act="rmimg" data-id="'+s.id+'" aria-label="'+esc(s.n)+'のイラストを元に戻す" title="取り込んだ画像を外す">×</button>':'';
  var st=w
    ? '<span class="pill wait">疲れてるようです</span><span class="rest"><span class="at">残り</span><span class="cd" data-cd="'+m.reset+'">'+fmtRemain(m.reset-now)+'</span><span class="at">'+fmtClock(m.reset)+'</span></span>'
    : '<span class="pill ready">使える</span>';
  var ctl='<label class="lb" for="w-'+s.id+'">回復</label><input class="t" type="text" inputmode="numeric" id="w-'+s.id+'" data-act="when" data-id="'+s.id+'" autocomplete="off" maxlength="12" title="回復する時刻を日本時間の数字4桁で入力（1937＝19:37）。Enterで「3h42m」（3時間42分）なども使えます" aria-label="'+esc(s.n)+'の回復する時刻（数字4桁、日本時間）">'+
    (w?'<button class="btn sm" data-act="rec" data-id="'+s.id+'">回復した</button>':'<button class="btn sm" data-act="open" data-id="'+s.id+'" aria-expanded="'+(OPEN===s.id)+'" title="よく使う時間">目安</button>')+
    '<input class="note" type="text" id="n-'+s.id+'" data-act="note" data-id="'+s.id+'" value="'+esc(m.note)+'" title="'+esc(m.note)+'" placeholder="依頼内容" aria-label="'+esc(s.n)+'の依頼中の内容">';
  var panel='';
  if(OPEN===s.id){
    panel='<div class="panel">'+PRESETS.map(function(p){return '<button class="btn sm" data-act="preset" data-id="'+s.id+'" data-min="'+p[0]+'">'+p[1]+'</button>';}).join('')+'<button class="btn sm" data-act="close">閉じる</button></div>';
  }
  return '<article class="card'+(w?' wait':'')+'" style="--cc:var(--c-'+key+')">'+
    '<div class="av'+(w&&!tiredPic?' tired':'')+'"><label title="クリックしてイラストを取り込む">'+av+'<input type="file" accept="image/*" data-act="file" data-id="'+s.id+'" aria-label="'+esc(s.n)+'のイラストを選ぶ"></label>'+sweat+rm+'</div>'+
    '<div class="body"><div><span class="name">'+esc(s.n)+'</span><span class="kana">'+esc(s.k)+'</span></div>'+
    '<span class="ai">'+esc(s.ai)+'</span><div class="role"><span class="uji">'+esc(s.u)+'</span>'+esc(s.role)+'</div><div class="st">'+st+'</div></div>'+
    '<div class="ctl">'+ctl+'</div>'+panel+
  '</article>';
}

/* 入力の読み取り：「3時間42分」「3h42m」「1日2時間」は残り時間、「午後3:42」「15:42」「9月1日 午後3:00」は回復時刻 */
function parseWhen(text,now){
  var t=String(text||'').normalize('NFKC').toLowerCase().replace(/[，,、]/g,' ').trim();
  if(!t) return null;
  var tomorrow=/明日|tomorrow/.test(t), dm=t.match(/(\d{1,2})月(\d{1,2})日/), pm=/午後|pm\b/.test(t), am=/午前|am\b/.test(t);
  var clk=t.match(/(\d{1,2})\s*:\s*(\d{2})/)||t.match(/(\d{1,2})\s*時(?!間)\s*(?:(\d{1,2})\s*分?)?/);
  if(pm||am||clk){
    if(!clk){ var h0=t.match(/(\d{1,2})/); if(!h0) return null; clk=[h0[0],h0[1],'0']; }
    var hh=Number(clk[1]), mm=Number(clk[2]||0);
    if(pm&&hh<12) hh+=12; if(am&&hh===12) hh=0;
    if(hh>23||mm>59) return null;
    var np=jstParts(now), y=np.y, mo=np.mo, dd=np.d, ts;
    if(dm){ mo=Number(dm[1]); dd=Number(dm[2]); ts=jstTs(y,mo,dd,hh,mm); if(ts<=now) ts=jstTs(y+1,mo,dd,hh,mm); }
    else { ts=jstTs(y,mo,dd,hh,mm); if(tomorrow) ts+=86400000; if(ts<=now) ts+=86400000; }
    return {ts:ts,kind:'clock'};
  }
  var ms=0, found=false, x;
  x=t.match(/(\d+(?:\.\d+)?)\s*(?:日|days?|d(?![a-z]))/); if(x){ ms+=Number(x[1])*86400000; found=true; }
  x=t.match(/(\d+(?:\.\d+)?)\s*(?:時間|hours?|hrs?|h(?![a-z]))/); if(x){ ms+=Number(x[1])*3600000; found=true; }
  x=t.match(/(\d+(?:\.\d+)?)\s*(?:分|minutes?|mins?|m(?![a-z]))/); if(x){ ms+=Number(x[1])*60000; found=true; }
  if(!found&&/^\d{4}$/.test(t)){
    var h4=Number(t.slice(0,2)), m4=Number(t.slice(2));
    if(h4>23||m4>59) return null;
    var np4=jstParts(now), ts4=jstTs(np4.y,np4.mo,np4.d,h4,m4);
    if(ts4<=now) ts4+=86400000;
    return {ts:ts4,kind:'clock'};
  }
  if(!found&&/^\d+$/.test(t)){ ms=Number(t)*60000; found=true; }
  if(!found||ms<=0) return null;
  return {ts:now+ms,kind:'duration'};
}

function summary(now){
  var ready=[], next=null;
  STAFF.forEach(function(s){
    if(isWait(s.id,now)){ var r=get(s.id).reset; if(!next||r<next.r) next={s:s,r:r}; }
    else ready.push(s);
  });
  var waitN=STAFF.length-ready.length;
  var rdy=ready.length?'<div class="chips">'+ready.map(function(s){return '<span class="nm">'+esc(s.n)+'</span>';}).join('')+'</div>':'<div class="none">いま頼める人はいません</div>';
  var nx=next?'<div class="big"><span class="at">残り </span><span data-next="'+next.r+'">'+fmtRemain(next.r-now)+'</span></div><div class="at">'+esc(next.s.n)+'（'+esc(next.s.ai)+'）／'+fmtClock(next.r)+' ごろ</div>':'<div class="none">回復待ちの人はいません</div>';
  return '<div class="summary"><section class="tile"><h2>いま頼める（'+ready.length+'人／回復待ち '+waitN+'人）</h2>'+rdy+'</section>'+
    '<section class="tile"><h2>次に回復する人</h2>'+nx+'</section></div>';
}

function render(){
  var now=Date.now();
  var filters=GROUPS.map(function(g){return '<button class="fl" data-act="filter" data-k="'+g[0]+'" aria-pressed="'+(F===g[0])+'">'+g[1]+'</button>';}).join('');
  app.innerHTML=
   '<div class="head"><div><h1>回復待ちボード</h1><p class="sub">フリーAIの上限と回復を、スタッフごとに管理します</p></div>'+
   '<div class="tools"><button class="btn" data-act="sort">並び：'+(SORT==='status'?'使える順':'名簿順')+'</button>'+
   '<label class="btn main" for="bulk">イラストをまとめて取り込む</label><input type="file" id="bulk" accept="image/*" multiple style="position:absolute;width:1px;height:1px;opacity:0" data-act="bulk"></div></div>'+
   summary(now)+
   '<div class="filters" role="group" aria-label="AIで絞り込む">'+filters+'</div>'+
   '<div class="grid">'+list().map(function(s){return card(s,now);}).join('')+'</div>'+
   '<p class="foot">回復する時刻を、日本時間の数字4桁で打てば反映されます（1937＝19:37。過ぎていれば明日）。Enterで「3h42m」（3時間42分後）なども使えます。イラストは、ファイル名に英語の名前（例：tessa.png）かカタカナの名前が入っていれば、まとめて取り込めます。入力した内容はこのページに保存されます。</p>';
}

function toast(t){
  var d=document.createElement('div'); d.textContent=t; toastBox.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },5000);
}

function setReset(id,ts){ get(id).reset=ts; OPEN=null; save(); render(); }

function thumb(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file), im=new Image();
    im.onload=function(){
      var n=256,c=document.createElement('canvas'); c.width=c.height=n;
      var x=c.getContext('2d'), s=Math.min(im.width,im.height), sy=im.height>im.width?0:(im.height-s)/2, sx=(im.width-s)/2;
      x.drawImage(im,sx,sy,s,s,0,0,n,n); URL.revokeObjectURL(u);
      var d=c.toDataURL('image/webp',0.85); if(d.indexOf('data:image/webp')!==0) d=c.toDataURL('image/png');
      res(d);
    };
    im.onerror=function(){ URL.revokeObjectURL(u); rej(new Error('load')); };
    im.src=u;
  });
}
function matchStaff(fname){
  var b=fname.replace(/\.[^.]+$/,'').toLowerCase();
  for(var i=0;i<STAFF.length;i++){ var s=STAFF[i]; if(b.indexOf(s.id)>=0||b.indexOf(s.k)>=0) return s; }
  return null;
}

app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var act=t.getAttribute('data-act'), id=t.getAttribute('data-id');
  if(act==='filter'){ F=t.getAttribute('data-k'); render(); }
  else if(act==='sort'){ if(SORT==='status'){ SORT='roster'; ORDER=null; } else { SORT='status'; ORDER=statusOrder(); } render(); }
  else if(act==='open'){ OPEN=(OPEN===id)?null:id; render(); }
  else if(act==='close'){ OPEN=null; render(); }
  else if(act==='preset'){ setReset(id,Date.now()+Number(t.getAttribute('data-min'))*60000); }
  else if(act==='setwhen'){
    var inp=document.getElementById('w-'+id), r=parseWhen(inp.value,Date.now());
    if(!r){ toast('読み取れませんでした。例：3時間42分、3h42m、午後3:42'); return; }
    setReset(id,r.ts);
  }
  else if(act==='rec'){ setReset(id,null); }
  else if(act==='rmimg'){ e.preventDefault(); get(id).img=''; save(); render(); }
});
app.addEventListener('change',function(e){
  var t=e.target, act=t.getAttribute('data-act'); if(!act) return;
  var id=t.getAttribute('data-id');
  if(act==='note'){ get(id).note=t.value.slice(0,80); save(); }
  else if(act==='file'){
    var f=t.files&&t.files[0]; if(!f) return;
    thumb(f).then(function(d){ get(id).img=d; save(); render(); }).catch(function(){ toast('画像を読み込めませんでした'); });
  }
  else if(act==='bulk'){
    var files=Array.prototype.slice.call(t.files||[]), bad=[], jobs=[];
    files.forEach(function(f){
      var s=matchStaff(f.name);
      if(!s){ bad.push(f.name); return; }
      jobs.push(thumb(f).then(function(d){ get(s.id).img=d; return s.n; }).catch(function(){ bad.push(f.name); }));
    });
    Promise.all(jobs).then(function(ok){
      ok=ok.filter(Boolean); if(ok.length){ save(); render(); }
      toast(ok.length+'人分のイラストを取り込みました'+(bad.length?'。名前が合わないファイル：'+bad.join('、'):''));
    });
  }
});
app.addEventListener('input',function(e){
  var t=e.target; if(t.getAttribute('data-act')!=='when') return;
  var v=t.value.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);});
  if(/^\d{4}$/.test(v)){ var r=parseWhen(v,Date.now()); if(r) setReset(t.getAttribute('data-id'),r.ts); }
});
app.addEventListener('keydown',function(e){
  var a=e.target.getAttribute&&e.target.getAttribute('data-act');
  if(e.key==='Enter'&&a==='note') e.target.blur();
  if(e.key==='Enter'&&a==='when'){ var r=parseWhen(e.target.value,Date.now()); if(!r){ toast('読み取れませんでした。例：0342、3h42m、午後3:42'); return; } setReset(e.target.getAttribute('data-id'),r.ts); }
});

setInterval(function(){
  var now=Date.now(), recovered=[];
  STAFF.forEach(function(s){ var m=get(s.id); if(m.reset&&m.reset<=now){ m.reset=null; recovered.push(s.n); } });
  if(recovered.length){
    save(); render();
    toast(recovered.join('、')+(recovered.length>1?' が':' が')+'回復しました');
    try{ document.title='● 回復しました｜回復待ちボード'; setTimeout(function(){ document.title='回復待ちボード'; },8000); }catch(_){}
    return;
  }
  var nodes=app.querySelectorAll('[data-cd]');
  for(var i=0;i<nodes.length;i++){ nodes[i].textContent=fmtRemain(Number(nodes[i].getAttribute('data-cd'))-now); }
  var nx=app.querySelector('[data-next]'); if(nx) nx.textContent=fmtRemain(Number(nx.getAttribute('data-next'))-now);
},1000);

load(); render();
})();
</script>
