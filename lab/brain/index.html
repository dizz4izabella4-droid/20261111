<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>BRAIN 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&display=swap">
<style>
:root { color-scheme:dark; --px:0px; --fg:0px; --warm:#ffc27c; }
*{ box-sizing:border-box }
html,body{ width:100%;height:100%;margin:0;overflow:hidden;background:#050c16; }
body{ font-family:system-ui,sans-serif; user-select:none;-webkit-user-select:none; }
#world{ position:fixed;inset:0;overflow:hidden; touch-action:none;cursor:grab;isolation:isolate;background:#050c16; }
#world.dragging{cursor:grabbing}
#sky{position:absolute;inset:-1px;z-index:0;background-image:url('assets/forest_strip.webp');background-repeat:repeat-x;background-size:auto 100%;background-position:var(--px) center;filter:saturate(.84) brightness(.83) contrast(1.07);will-change:background-position;}
#sky::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,5,15,.19),transparent 29%,rgba(0,7,13,.04) 53%,rgba(0,4,13,.24));}
#moon{position:absolute;z-index:1;left:68%;top:3%;width:clamp(70px,9vw,140px);aspect-ratio:1;background:url('assets/moon.webp') center/contain no-repeat;pointer-events:none;mix-blend-mode:screen;animation:moonpulse 9s ease-in-out infinite alternate;margin-left:calc(var(--mx,0px) * -1);}
@keyframes moonpulse{from{opacity:.9}to{opacity:1}}
#nightgrade{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 43%,rgba(26,66,91,0) 9%,rgba(2,5,13,.17) 64%,rgba(0,3,10,.67) 100%);}
#mist{position:absolute;z-index:2;inset:-18% -60%;pointer-events:none;opacity:.72;mix-blend-mode:screen;background:radial-gradient(ellipse 23% 13% at 20% 52%,rgba(97,136,193,.17),transparent 75%),radial-gradient(ellipse 26% 14% at 72% 59%,rgba(139,154,202,.15),transparent 75%),radial-gradient(ellipse 19% 8% at 49% 65%,rgba(142,174,203,.10),transparent 77%);animation:mistmove 29s ease-in-out infinite alternate;}
@keyframes mistmove{from{transform:translateX(-3%) scale(1)}to{transform:translateX(3%) scale(1.04)}}
#glassglow{position:absolute;z-index:3;inset:0;pointer-events:none;background:radial-gradient(ellipse 27% 48% at 50% 48%,rgba(255,143,57,.035),transparent 76%);mix-blend-mode:screen;}
#reel{position:absolute;z-index:5;inset:0;perspective:1200px;transform-style:preserve-3d;pointer-events:none;}
.window{position:absolute;top:49%;left:50%;width:clamp(225px,32vw,455px);aspect-ratio:1086/1448;transform-origin:center center;pointer-events:auto;cursor:pointer;outline:none;will-change:transform,opacity;transform-style:preserve-3d;}
.window:focus-visible .window-shell{outline:2px solid #eec69a;outline-offset:4px}
.window-shell{position:relative;width:100%;height:100%;transform-style:preserve-3d;perspective:950px;filter:drop-shadow(0 22px 19px rgba(0,0,0,.72)) drop-shadow(0 0 9px rgba(218,142,68,.20));animation:breathe 6s ease-in-out infinite alternate;}
@keyframes breathe{from{translate:0 -3px}to{translate:0 4px}}
.aura{position:absolute;inset:12% 17% 14%;border-radius:18%;background:radial-gradient(ellipse,rgba(240,149,51,.17),rgba(202,125,37,.04) 60%,transparent 76%);filter:blur(35px);transform:scale(1.16);transition:opacity .8s,transform 1.2s;pointer-events:none}
.window.selected .aura{background:radial-gradient(ellipse,rgba(251,183,91,.23),rgba(202,116,37,.045) 62%,transparent 78%)}
.portal{position:absolute;left:17%;width:67%;top:11%;height:78%;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#bf7841 0%,#5a3e46 30%,#10253c 64%,#080e21 100%);border-radius:1%;box-shadow:inset 0 0 18px 9px #030914,0 0 33px rgba(252,177,77,.16);opacity:.1;transition:opacity 1s,box-shadow 1s;pointer-events:none}
.portal::before{content:"";position:absolute;inset:-25%;background:radial-gradient(ellipse at 50% 40%,rgba(255,221,162,.60),rgba(245,159,64,.22) 27%,transparent 56%);filter:blur(24px);animation:portalflow 5s ease-in-out infinite alternate}
.portal::after{content:"";position:absolute;inset:0;background:none;mix-blend-mode:screen}
/* ガラス4面にだけ、現在のおもちゃ箱トップを映す */
.glass{position:absolute;left:21.7%;top:15.5%;width:57%;height:68%;z-index:5;pointer-events:none;overflow:hidden;transition:opacity .35s}
.wood{position:absolute;top:10.7%;height:78.04%;z-index:5;pointer-events:none;transition:opacity .35s}
.wood.left{left:16.76%;width:32.87%}.wood.right{left:49.63%;width:34.08%}
.wood img{width:100%;height:100%;display:block;object-fit:fill}
.window.open .wood,.window.open .glass{opacity:0}
:root{--ww:clamp(225px,32vw,455px)}
@media(max-width:650px){:root{--ww:clamp(208px,66vw,310px)}}
.plate{position:absolute;left:50%;top:101.5%;transform:translateX(-50%);z-index:8;pointer-events:none;
 min-width:46%;padding:.28em .9em .32em;border-radius:.18em;text-align:center;white-space:nowrap;
 font:700 calc(var(--ww)*.062)/1.2 'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;letter-spacing:.32em;text-indent:.32em;
 color:#2a160a;text-shadow:0 1px 0 rgba(255,214,160,.45),0 -1px 0 rgba(0,0,0,.35);
 background:repeating-linear-gradient(92deg,rgba(0,0,0,.07) 0 2px,transparent 2px 7px,rgba(255,200,130,.05) 7px 8px),linear-gradient(180deg,#a8723f,#82532a 55%,#6a4222);
 box-shadow:inset 0 1px 0 rgba(255,220,170,.5),inset 0 -2px 3px rgba(0,0,0,.45),inset 0 0 0 .1em rgba(60,30,10,.55),0 .35em .5em rgba(0,0,0,.45)}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:.32em;height:.32em;margin-top:-.16em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9c88a,#7a5527 70%);box-shadow:0 .05em .08em rgba(0,0,0,.6)}
.plate::before{left:.45em}.plate::after{right:.45em}
.window:not(.selected) .plate{opacity:.85}
.cine{position:absolute;inset:0;background:#000}
.white{position:absolute;inset:0;background:#fff}
.other{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,#fff6d8 0%,#cfeee6 38%,#a9b8ee 78%,#8f95d8 100%)}
.sticker{position:absolute;left:50%;top:41%;z-index:8;pointer-events:none;transform:translate(-50%,-50%) rotate(-5deg);padding:.3em .8em .34em;white-space:nowrap;
 font:700 calc(var(--ww)*.085)/1.1 'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;letter-spacing:.18em;text-indent:.18em;color:#c4161c;
 background:linear-gradient(160deg,#fbf6ea,#eee4cf);border:.09em solid #c4161c;outline:.04em solid #fbf6ea;outline-offset:-.2em;border-radius:.1em;
 box-shadow:0 .12em .3em rgba(0,0,0,.55),inset 0 0 .5em rgba(120,80,30,.25);transition:opacity .35s}
.window.open .sticker{opacity:0}
.gate{position:absolute;left:17%;top:11%;width:67%;height:78%;z-index:9;pointer-events:none;cursor:pointer}
.window.open .gate{pointer-events:auto}
.glass img{max-width:none}
.glass iframe,.glass img{position:absolute;left:0;top:0;width:600px;height:900px;border:0;transform-origin:0 0;background:#050c16;opacity:.88}
.glass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.10),transparent 38%,rgba(255,190,120,.07))}
.window.open .glass{opacity:0}
@keyframes portalflow{from{transform:translateY(11%) scale(.95)}to{transform:translateY(-12%) scale(1.13)}}
.panel{position:absolute;top:10.7%;height:78.04%;z-index:4;backface-visibility:hidden;transform-style:preserve-3d;transition:transform 1.27s cubic-bezier(.16,.78,.16,1),filter 1s;filter:drop-shadow(0 5px 3px rgba(0,0,0,.7));}
.panel img{height:100%;width:100%;display:block;object-fit:fill;pointer-events:none;}
.panel.left{left:16.76%;width:32.87%;transform-origin:0% 50%}
.panel.right{left:49.63%;width:34.08%;transform-origin:100% 50%}
.frame{position:absolute;inset:0;z-index:6;pointer-events:none;width:100%;height:100%;object-fit:fill;}
.reflection{position:absolute;left:10%;right:10%;bottom:-9%;height:18%;opacity:.23;filter:blur(17px);background:radial-gradient(ellipse,rgba(255,154,82,.33),transparent 70%);transform:scaleY(.6);pointer-events:none;mix-blend-mode:screen}
.window.open .panel.left{transform:rotateY(-105deg)}
.window.open .panel.right{transform:rotateY(105deg)}
.window.open .portal{opacity:1;box-shadow:inset 0 0 20px 4px rgba(15,7,22,.75),0 0 44px rgba(252,177,77,.42)}
.window.open .aura{opacity:1;transform:scale(1.5)}
.window:not(.selected){filter:brightness(.74) saturate(.78)}
#water{position:absolute;z-index:8;left:0;right:0;bottom:0;height:28%;pointer-events:none;background:radial-gradient(ellipse 34% 20% at 50% 80%,rgba(233,171,107,.07),transparent 90%),repeating-linear-gradient(178deg,transparent 0 12px,rgba(177,206,240,.018) 13px,transparent 17px 35px);mix-blend-mode:screen;animation:watermove 5.5s linear infinite alternate;mask-image:linear-gradient(transparent,black 43%)}
@keyframes watermove{from{transform:translateX(-.55%)}to{transform:translateX(.55%)}}
#particles{position:absolute;z-index:9;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;}
#vignette{position:absolute;z-index:10;inset:0;pointer-events:none;box-shadow:inset 0 0 180px 70px rgba(0,5,13,.28);}
@media(max-width:650px){.window{width:clamp(208px,66vw,310px)}#world{touch-action:none}#vignette{box-shadow:inset 0 0 100px 35px rgba(0,5,13,.34)}}
/* 背景を真っ白に */
html,body,#world{background:#fff!important}
#sky,#moon,#nightgrade,#mist,#glassglow,#water,#particles,#vignette{display:none!important}
@media(prefers-reduced-motion:reduce){#mist,#water,.window-shell,.portal::before{animation:none!important}.panel,.portal{transition-duration:.05s}}
</style>
</head>
<body>
<main id="world" aria-label="BRAINの夜の森。左右にドラッグして窓を選びます。">
  <div id="sky"></div><div id="moon"></div><div id="nightgrade"></div><div id="mist"></div><div id="glassglow"></div>
  <div id="reel"></div><div id="water"></div><canvas id="particles" aria-hidden="true"></canvas><div id="vignette"></div>
</main>
<script>
(()=>{'use strict';
const WORLD=document.getElementById('world');
const REEL=document.getElementById('reel');
const cnv=document.getElementById('particles');const ctx=cnv.getContext('2d');
const root='https://dizz4izabella4-droid.github.io/20261111/';
const data=[
  {name:'おもちゃ箱',url:root},
  {name:'実験室',url:root+'lab/'},
  {name:'映画館',url:null},
  {name:'実用室',url:null},
  {name:'べつのせかい',url:'https://iz3ico.github.io/app/'},
];
let pid=0,target=0,visual=0,travel=0,drag=false,moved=false,lastX=0,downX=0,dragStart=0,downTime=0,openIndex=-1;
let w=innerWidth,h=innerHeight,particles=[],last=performance.now();
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const win=[];
for(let i=0;i<data.length;i++){
  const el=document.createElement('div');el.className='window';el.tabIndex=0;el.dataset.index=i;
  el.setAttribute('role','button');el.setAttribute('aria-label',data[i].name+'の窓');el.setAttribute('aria-expanded','false');
  el.innerHTML='<div class="window-shell"><div class="aura"></div><div class="portal"></div><div class="panel left"><img draggable="false" src="assets/window_left.webp" alt=""></div><div class="panel right"><img draggable="false" src="assets/window_right.webp" alt=""></div><div class="glass"></div><div class="plate"></div><div class="wood left"><img draggable="false" src="assets/wood_left.webp" alt=""></div><div class="wood right"><img draggable="false" src="assets/wood_right.webp" alt=""></div><img class="frame" draggable="false" src="assets/window_frame.webp" alt=""><div class="reflection"></div></div>';
  REEL.append(el);win.push(el);
  el.addEventListener('click',e=>{e.stopPropagation();if(moved)return;activate(i)});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(i)}});
}
const TOP_URL='https://dizz4izabella4-droid.github.io/20261111/'; // 現在のおもちゃ箱トップ
const SHOT=['assets/top_shot.webp','assets/lab_shot.webp',null,null];
function fitGlass(){win.forEach(el=>{const g=el.querySelector('.glass'),f=g&&g.querySelector('img');if(!f)return;f.style.transform='scale('+Math.max(g.offsetWidth/600,g.offsetHeight/900).toFixed(4)+')'})}
function mountGlass(){win.forEach((el,i)=>{const g=el.querySelector('.glass');el.querySelector('.plate').textContent=data[i].name;
  if(SHOT[i]){const f=document.createElement('img');f.alt='';f.draggable=false;f.src=SHOT[i];g.append(f)}else if(i===2){const c=document.createElement('div');c.className='cine';g.append(c);const k=document.createElement('div');k.className='sticker';k.textContent='これから';el.querySelector('.window-shell').append(k)}else if(i===3){const c=document.createElement('div');c.className='white';g.append(c)}else if(i===4){const c=document.createElement('div');c.className='other';g.append(c)}
  if(data[i].url){const a=document.createElement('a');a.className='gate';a.href=data[i].url;a.target='_blank';a.rel='noopener';a.setAttribute('aria-label',data[i].name+'を開く');a.addEventListener('click',e=>e.stopPropagation());el.querySelector('.window-shell').append(a)}});fitGlass()}
function wrap(n,size){return ((n%size)+size)%size}
function centeredDelta(i,p){let d=wrap(i-p,data.length);if(d>data.length/2)d-=data.length;if(d===data.length/2&&i!==0&&p>i)d-=data.length;return d}
function gap(){return Math.min(w*.405,560)}
function closeAll(){openIndex=-1;win.forEach(el=>{el.classList.remove('open');el.setAttribute('aria-expanded','false')})}
function activate(i){const d=centeredDelta(i,visual);if(Math.abs(d)>.38){closeAll();target+=d;return}
  if(openIndex!==i){closeAll();openIndex=i;win[i].classList.add('open');win[i].setAttribute('aria-expanded','true');return}
  if(data[i].url)return;closeAll();
}
function onDown(e){if(e.button!==undefined&&e.button!==0)return;drag=true;moved=false;downX=lastX=e.clientX;dragStart=target;downTime=performance.now();pid=e.pointerId}
function onMove(e){if(!drag)return;const dx=e.clientX-downX;if(Math.abs(dx)>7&&!moved){moved=true;WORLD.classList.add('dragging');try{WORLD.setPointerCapture(pid)}catch{}}const dd=e.clientX-lastX;lastX=e.clientX;if(moved){target-=dd/gap();travel+=dd;visual=target;closeAll()}}
function onUp(e){if(!drag)return;drag=false;WORLD.classList.remove('dragging');try{WORLD.releasePointerCapture(e.pointerId)}catch{};if(moved){target=Math.round(target);setTimeout(()=>moved=false,0)}else moved=false}
WORLD.addEventListener('pointerdown',onDown);WORLD.addEventListener('pointermove',onMove);WORLD.addEventListener('pointerup',onUp);WORLD.addEventListener('pointercancel',onUp);
WORLD.addEventListener('click',e=>{if(!e.target.closest('.window')&&!moved)closeAll()});
addEventListener('keydown',e=>{if(e.key==='ArrowRight'){closeAll();target=Math.round(target)+1}else if(e.key==='ArrowLeft'){closeAll();target=Math.round(target)-1}else if(e.key==='Escape'){closeAll()}});
function resize(){w=innerWidth;h=innerHeight;const dpr=Math.min(devicePixelRatio||1,1.5);cnv.width=Math.round(w*dpr);cnv.height=Math.round(h*dpr);cnv.style.width=w+'px';cnv.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
particles=Array.from({length:reduceMotion?0:Math.max(28,Math.min(80,Math.round(w*h/23000)))},(_,i)=>({x:(i*.6180339%1)*w,y:(i*.37618%1)*h,r:.6+(i%5)*.19,v:.5+(i%7)*.11,phase:i*2.2,color:i%5===0?'255,181,107':'151,201,242'}));}
addEventListener('resize',()=>{resize();fitGlass()});resize();mountGlass();
function render(t){let dt=Math.min(.05,(t-last)/1000);last=t;if(!drag){visual+=(target-visual)*Math.min(1,dt*(reduceMotion?20:11))}
  const offset=gap();
  win.forEach((el,i)=>{const d=centeredDelta(i,visual);const a=Math.abs(d);
    const scale=Math.max(.51,1-.18*a);
    const x=d*offset;
    const y=Math.min(h*.04,22)*a;
    const tilt=Math.max(-21,Math.min(21,-d*10));
    el.style.left='calc(50% + '+x.toFixed(3)+'px)';
    el.style.transform='translate(-50%,calc(-50% + '+y.toFixed(2)+'px)) scale('+scale.toFixed(4)+') rotateY('+tilt.toFixed(3)+'deg)';
    el.style.opacity=a>2.2?'0':String(Math.max(0,1-a*.14));
    el.style.zIndex=String(Math.round(90-a*10));
    el.style.pointerEvents=a>1.6?'none':'auto';
    el.classList.toggle('selected',a<.4);
  });
  // A fixed camera: only the texture offsets move. repeat-x means there is never a blank edge.
  const tileW=1652*(h/724); const p=((travel*.38)%tileW+tileW)%tileW; WORLD.style.setProperty('--px',p.toFixed(2)+'px');
  ctx.clearRect(0,0,w,h);
  for(const q of particles){q.x+=dt*q.v*3;if(q.x>w+8)q.x=-8;q.y+=Math.sin(t*.00023+q.phase)*dt*.34;
    const alpha=(.08+.15*(.5+.5*Math.sin(t*.0017*q.v+q.phase)));
    ctx.beginPath();ctx.fillStyle=`rgba(${q.color},${alpha.toFixed(3)})`;
    ctx.shadowColor=`rgba(${q.color},.22)`;ctx.shadowBlur=8;ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;requestAnimationFrame(render);
}
requestAnimationFrame(render);
// Exposed only for automated quality checking. No visible debug UI.
window.__BRAIN_QA__={state:()=>({camera:'fixed',target,visual,travel,openIndex}),select:(i)=>{closeAll();target=i},close:closeAll};
})();
</script>


</body>
</html>
