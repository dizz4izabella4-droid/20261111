<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>プロシージャルモデリング 形状自動生成</title>
<!-- 制作: dizz が制作した作品です（Procedural Modeling 第1版） -->
<style>
:root{--bg:#f4f5f8;--panel:#fff;--ink:#1d2330;--sub:#667;--line:#d8dce6;--acc:#2f6bff;--accink:#fff;--view:#e9edf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--panel:#181d28;--ink:#e8ecf5;--sub:#9aa4b8;--line:#2a3142;--acc:#6b95ff;--accink:#0b1020;--view:#0c0f16}}
:root[data-theme="dark"]{--bg:#10131a;--panel:#181d28;--ink:#e8ecf5;--sub:#9aa4b8;--line:#2a3142;--acc:#6b95ff;--accink:#0b1020;--view:#0c0f16}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px}
#app{height:100%;display:grid;grid-template-columns:170px 1fr 260px;grid-template-rows:1fr auto}
aside{background:var(--panel);border:0 solid var(--line);padding:12px;overflow:auto}
#left{border-right-width:1px}#right{border-left-width:1px}
h1{font-size:15px;margin:0 0 10px}
h2{font-size:12px;color:var(--sub);margin:12px 0 6px;font-weight:600}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#tpl button{display:block;width:100%;text-align:left;margin-bottom:5px}
#view{position:relative;background:var(--view);min-height:240px;touch-action:none}
canvas{display:block;width:100%;height:100%}
.row{margin-bottom:10px}.row label{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
input[type=range]{width:100%;accent-color:var(--acc)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#stats{grid-column:1/-1;background:var(--panel);border-top:1px solid var(--line);padding:6px 12px;font-size:12px;color:var(--sub);display:flex;gap:16px;flex-wrap:wrap}
#warn{color:#d33;font-weight:600}
textarea{width:100%;height:110px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:11px monospace}
@media(max-width:760px){html,body{height:auto}#app{height:auto;min-height:100dvh;grid-template-columns:1fr;grid-template-rows:auto 48dvh auto auto}#left{order:1;border-right-width:0;border-bottom-width:1px;padding:8px 12px}#left h1,#left h2{display:none}#tpl{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}#tpl button{width:auto;white-space:nowrap;margin:0}#view{order:2;position:sticky;top:0;z-index:5;min-height:0}#stats{order:3;grid-column:1}#right{order:4;border-left-width:0;overflow:visible}button{min-height:40px}input[type=range]{height:32px}textarea{font-size:16px}.hint{display:none}}
</style>
</head>
<body>
<div id="app">
 <aside id="left"><h1>形状自動生成</h1><h2>テンプレート</h2><div id="tpl"></div></aside>
 <div id="view"><canvas id="cv"></canvas></div>
 <aside id="right">
  <h1 id="tname"></h1>
  <div id="ctl"></div>
  <div class="btns"><button id="dice">🎲 乱数化</button><button id="seedn">シード+1</button><button id="wire">ワイヤー</button><button id="reset">初期値</button><button id="undo">↶ 戻す</button><button id="redo">↷ 進む</button><button id="spin">自動回転</button></div>
  <h2>モディファイア（上から順に適用）</h2><div class="btns"><select id="msel" style="font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px"></select><button id="madd">追加</button></div><div id="mlist"></div>
  <h2>表示</h2><div class="btns"><button id="bflat" class="on">ローポリ</button><button id="bmono">素体(グレー)</button><button id="bshad">影</button><button id="bgrid" class="on">グリッド</button><button id="blit">光:昼</button></div>
  <div id="pbox" style="display:none"><h2>断面（点をドラッグ）</h2><div class="btns" id="ppre" style="margin:0 0 6px"></div><canvas id="pf" width="260" height="220" style="width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;touch-action:none"></canvas><div class="btns"><button id="padd">点を追加</button><button id="pdel">選択点を削除</button></div></div>
  <div id="lbox" style="display:none"><h2>L-system ルール（1行1規則）</h2><div class="btns" id="lpre" style="margin:0 0 6px"></div><textarea id="lrule" spellcheck="false">axiom=A
A=0.6:F![&+A][&-A]rA
A=F![&+A][^-A]rA</textarea><div class="row" style="font-size:11px;color:var(--sub);margin-top:6px">記号: F前進 + - 左右 &amp; ^ 上下 rねじり !縮小 [ ]枝 A葉 B花 L平葉 '色相 &lt;&gt;太さ。同じ記号を複数行で書くと確率的に選ばれます（例 A=0.7:F[+A]）。無印は残り確率を均等配分。</div></div>
  <h2>ギャラリー（保存して呼び出し）</h2><div class="btns"><button id="gsave">現在を保存</button></div><div class="btns" id="gal"></div>
  <h2>設定JSON（コピー／貼り付けて読込）</h2>
  <textarea id="json" spellcheck="false"></textarea>
  <div class="btns"><button id="jshow">現在値を表示</button><button id="jload">読み込む</button><button id="objx">OBJ書き出し</button><button id="bmerge">結合:OFF</button></div>
 </aside>
 <div id="stats"><span id="sp">パーツ 0</span><span id="st">三角形 0</span><span id="sm">0 ms</span><span id="sz"></span><span id="warn"></span><span class="hint">ドラッグ：回転／ホイール・ピンチ：拡大</span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* 制作: dizz — プロシージャルモデリング第1版
   構成: テンプレート(params+gen) → Part[] → InstancedMesh。全生成器が同じ Part 形式を出力する。 */
const COARSE=matchMedia("(pointer:coarse)").matches,MAXP=250000, PI=Math.PI;
// ---- 乱数（シード固定で再現可能）----
function rng(s){let a=(s*2654435761)>>>0||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// ---- Part ----
const D=new THREE.Object3D();
function P(out,g,pos,rot,sc,c){D.position.set(pos[0],pos[1],pos[2]);D.rotation.set(rot[0],rot[1],rot[2]);D.scale.set(sc[0],sc[1],sc[2]);D.updateMatrix();out.push({g,m:D.matrix.clone(),c})}
function Pq(out,g,pos,q,sc,c){D.position.copy(pos);D.quaternion.copy(q);D.scale.set(sc[0],sc[1],sc[2]);D.updateMatrix();out.push({g,m:D.matrix.clone(),c});D.quaternion.identity()}
const GR=new THREE.Color(.75,.75,.78);
const hsl=(h,s,l)=>new THREE.Color().setHSL(h,s,l);
const Z=[0,0,0],O=[1,1,1];
// ---- 配置オペレータ ----
const Op={
 array:(n,f)=>{for(let i=0;i<n;i++)f(i,n)},
 radial:(n,r,f)=>{for(let i=0;i<n;i++){const a=i/n*PI*2;f(i,a,Math.cos(a)*r,Math.sin(a)*r)}},
 scatter:(n,rad,R,f)=>{for(let i=0;i<n;i++){const a=R()*PI*2,d=Math.sqrt(R())*rad;f(i,Math.cos(a)*d,Math.sin(a)*d)}}
};
// ---- 追加技術: L-system(確率・パラメトリック) / 3Dタートル ----
let LO={b:1,l:1,t:.82,r:.12,th:.08,lh:.26,fh:.92};
function lsys(ax,rules,it,R){let s=ax;for(let i=0;i<it;i++){let n="";for(const ch of s){const r=rules[ch];if(!r){n+=ch;continue}const x=R();let acc=0,pk=r[r.length-1][1];for(const [p,str] of r){acc+=p;if(x<acc){pk=str;break}}n+=pk}s=n;if(s.length>800000)break}return s}
function turtle(s,ang,ratio,o,R){const X=new THREE.Vector3(1,0,0),Y=new THREE.Vector3(0,1,0),Zv=new THREE.Vector3(0,0,1),A=ang*PI/180,st=[];
 let pos=new THREE.Vector3(),q=new THREE.Quaternion(),l=1.6,rad=LO.r,dep=0,hu=0;const rot=(ax,a)=>q.multiply(new THREE.Quaternion().setFromAxisAngle(ax,a));
 for(const ch of s){if(o.length>MAXP)break;
  if(ch==="F"){const d=Y.clone().applyQuaternion(q);Pq(o,"cyl",pos.clone().addScaledVector(d,l/2),q,[rad*2,l,rad*2],hsl((LO.th+hu)%1,.4,.22+Math.min(dep,7)*.03));pos.addScaledVector(d,l)}
  else if(ch==="+")rot(Zv,A);else if(ch==="-")rot(Zv,-A);else if(ch==="&")rot(X,A);else if(ch==="^")rot(X,-A);else if(ch==="r")rot(Y,2.4);
  else if(ch==="!"){l*=ratio;rad*=LO.t}
  else if(ch==="["){st.push([pos.clone(),q.clone(),l,rad,dep,hu]);dep++}
  else if(ch==="]"){const t=st.pop();if(t){pos=t[0];q=t[1];l=t[2];rad=t[3];dep=t[4];hu=t[5]}}
  else if(ch==="A"){Pq(o,"sph",pos,q,[l*.9*LO.l,l*.9*LO.l,l*.9*LO.l],hsl(LO.lh+R()*.1,.55,.4))}
  else if(ch==="B"){Pq(o,"sph",pos,q,[l*1.2*LO.b,l*1.2*LO.b,l*1.2*LO.b],hsl(LO.fh+R()*.06,.8,.65))}
  else if(ch==="L"){Pq(o,"box",pos.clone().addScaledVector(Y.clone().applyQuaternion(q),l*.4),q,[l*.9*LO.l,l*.8*LO.l,.04],hsl(LO.lh+.04+R()*.08,.6,.4))}
  else if(ch==="'")hu+=.06;else if(ch==="<")rad*=1.3;else if(ch===">")rad*=.77}}
// ---- テンプレート ----
// params: key:[ラベル,最小,最大,初期,刻み]
const T=[
{n:"らせん階段",p:{steps:["段数",5,80,28,1],radius:["半径",.5,4,1.8,.1],rise:["段の高さ",.1,.6,.28,.01],twist:["ねじれ(度/段)",5,40,18,1]},
 g(v,R,o){Op.array(v.steps,i=>{const a=i*v.twist*PI/180;P(o,"box",[Math.cos(a)*v.radius*.6,i*v.rise,Math.sin(a)*v.radius*.6],[0,-a,0],[v.radius*1.2,.12,.5],hsl(.08+i/v.steps*.1,.5,.55))});P(o,"cyl",[0,v.steps*v.rise/2,0],Z,[.3,v.steps*v.rise+.2,.3],hsl(.6,.1,.4))}},
{n:"塔",p:{floors:["階数",3,60,18,1],width:["幅",1,6,3,.1],taper:["先細り",.85,1,.96,.005],twist:["ねじれ(度)",0,30,6,.5]},
 g(v,R,o){let w=v.width;for(let i=0;i<v.floors;i++){P(o,"box",[0,i*1.05+.5,0],[0,i*v.twist*PI/180,0],[w,1,w],hsl(.58,.25,.45+(i%2)*.08));w*=v.taper}P(o,"cone",[0,v.floors*1.05+.9,0],Z,[w,1.8,w],hsl(.0,.6,.5))}},
{n:"樹木",p:{depth:["再帰の深さ",2,9,6,1],angle:["枝の角度",10,60,28,1],ratio:["長さ比",.55,.85,.72,.01],fork:["分岐数",2,4,2,1]},
 g(v,R,o){const up=new THREE.Vector3(0,1,0);
  (function br(pos,q,len,rad,d){const dir=up.clone().applyQuaternion(q);const mid=pos.clone().addScaledVector(dir,len/2);
   Pq(o,"cyl",mid,q,[rad*2,len,rad*2],hsl(.08,.45,.25+(v.depth-d)*.02));const end=pos.clone().addScaledVector(dir,len);
   if(d<=0||o.length>MAXP){Pq(o,"sph",end,q,[len*1.2,len*1.2,len*1.2],hsl(.3+R()*.08,.55,.38));return}
   for(let k=0;k<v.fork;k++){const ph=k/v.fork*PI*2+R()*.8,ax=new THREE.Vector3(Math.cos(ph),0,Math.sin(ph)).applyQuaternion(q);
    const nq=q.clone().premultiply(new THREE.Quaternion().setFromAxisAngle(ax,v.angle*PI/180*(.7+R()*.6)));br(end,nq,len*v.ratio,rad*.7,d-1)}
  })(new THREE.Vector3(0,0,0),new THREE.Quaternion(),2.2,.18,v.depth)}},
{n:"柵",p:{count:["本数",3,60,16,1],gap:["間隔",.3,1.5,.6,.05],height:["高さ",.5,3,1.3,.05],jitter:["高さのばらつき",0,.6,.15,.01]},
 g(v,R,o){const W=(v.count-1)*v.gap;Op.array(v.count,i=>{const h=v.height*(1+(R()-.5)*v.jitter*2);P(o,"box",[i*v.gap-W/2,h/2,0],Z,[.2,h,.12],hsl(.09,.4,.4));P(o,"cone",[i*v.gap-W/2,h+.1,0],[0,PI/4,0],[.2,.25,.2],hsl(.09,.4,.35))});
  [.35,.75].forEach(f=>P(o,"box",[0,v.height*f,.1],Z,[W+.4,.1,.08],hsl(.08,.35,.3)))}},
{n:"貝殻",p:{turns:["巻き数",2,8,4,.1],growth:["成長率",.05,.3,.16,.005],rise:["高さ",0,.6,.25,.01],density:["密度",16,60,34,1]},
 g(v,R,o){const n=Math.floor(v.turns*v.density);for(let i=0;i<n;i++){const t=i/v.density,r=Math.exp(v.growth*t),a=t*PI*2;P(o,"sph",[Math.cos(a)*r,t*v.rise*r,Math.sin(a)*r],Z,[r*.8,r*.8,r*.8],hsl(.04+i/n*.08,.55,.6-i/n*.15))}}},
{n:"花瓶",p:{rings:["段数",10,80,40,1],base:["基本半径",.4,1.5,.8,.01],amp:["ふくらみ",0,.8,.45,.01],freq:["波の数",.5,4,1.2,.05]},
 g(v,R,o){const h=3/v.rings;for(let i=0;i<v.rings;i++){const y=i/v.rings,r=v.base+v.amp*Math.sin(y*PI*v.freq)*(1-y*.5);P(o,"cyl",[0,i*h+h/2,0],Z,[r*2,h*1.02,r*2],hsl(.55+y*.15,.5,.5))}}},
{n:"街灯の並び",p:{count:["本数",2,30,10,1],gap:["間隔",1,6,3,.1],curve:["蛇行幅",0,4,1.5,.1],h:["高さ",1.5,5,3,.1]},
 g(v,R,o){P(o,"box",[v.count*v.gap/2-v.gap/2,-.03,0],Z,[v.count*v.gap+1,.06,2.2+v.curve*1.2],hsl(.6,.05,.3));Op.array(v.count,i=>{const x=i*v.gap,z=Math.sin(i*.8)*v.curve;P(o,"cyl",[x,v.h/2,z],Z,[.12,v.h,.12],hsl(.6,.1,.25));P(o,"sph",[x,v.h+.1,z],Z,[.4,.4,.4],hsl(.13,.9,.7))})}},
{n:"岩の散布",p:{count:["個数",5,400,80,1],area:["範囲",2,15,6,.5],size:["大きさ",.2,2,.7,.05],flat:["平たさ",.3,1,.6,.05]},
 g(v,R,o){Op.scatter(v.count,v.area,R,(i,x,z)=>{const s=v.size*(.4+R()*1);P(o,"sph",[x,s*v.flat*.3,z],[R()*3,R()*3,R()*3],[s,s*v.flat,s*(.7+R()*.5)],hsl(.1,.05,.3+R()*.25))})}},
{n:"簡易建物",p:{floors:["階数",1,20,8,1],cols:["窓の列",2,12,6,1],spacing:["窓の間隔",.5,1.5,.9,.05],lit:["点灯率",0,1,.5,.05]},
 g(v,R,o){const w=v.cols*v.spacing+.6,H=v.floors*1.1;P(o,"box",[0,H/2,0],Z,[w,H,w],hsl(.08,.15,.45));
  for(let f=0;f<v.floors;f++)for(let c=0;c<v.cols;c++)for(let s=0;s<4;s++){const u=(c-(v.cols-1)/2)*v.spacing,on=R()<v.lit,col=on?hsl(.14,.9,.65):hsl(.6,.3,.25),k=w/2+.01;
   const pos=[[u,0,k],[u,0,-k],[k,0,u],[-k,0,u]][s];pos[1]=f*1.1+.6;P(o,"box",pos,Z,s<2?[.5,.55,.04]:[.04,.55,.5],col)}
  P(o,"box",[0,H+.15,0],Z,[w+.2,.3,w+.2],hsl(.0,.0,.3))}},
{n:"L-system(再帰成長)",p:{type:["型 1樹 2結晶 3傘",1,3,1,1],iter:["世代数",1,9,5,1],angle:["角度",10,70,30,1],ratio:["縮小率",.6,.95,.8,.01],irr:["不規則度(確率)",0,1,.3,.05]},
 g(v,R,o){const i=v.irr,rs={1:{A:[[1-i,"F![&+A][&-A]rA"],[i,"F![&+A][^-A]rA"]]},2:{A:[[1,"F![+A][-A][&A][^A]"]]},3:{A:[[1-i,"F![&+A]rr[&+A]rr[&+A]"],[i,"F![&+A]rr[&+A]"]]}}[v.type];
  LO={b:1,l:1,t:.82,r:.12,th:.08,lh:.26,fh:.92};turtle(lsys("A",rs,v.iter,R),v.angle,v.ratio,o,R)}},
{n:"分割都市(Split)",p:{depth:["分割回数",1,9,6,1],gap:["すき間",.05,.6,.2,.01],hv:["高さの振れ幅",0,2,1,.05],size:["区画の大きさ",6,20,12,1]},
 g(v,R,o){P(o,"box",[0,-.05,0],Z,[v.size+.4,.1,v.size+.4],hsl(.6,.05,.25));
  const rec=(x,z,w,d,dep)=>{if(dep>=v.depth||(w<1.2&&d<1.2)||R()<.06){const h=.5+R()*R()*v.hv*8;P(o,"box",[x,h/2,z],Z,[Math.max(.1,w-v.gap),h,Math.max(.1,d-v.gap)],hsl(.58,.2,Math.min(.7,.3+h/14)));return}
   const r=.3+R()*.4;if(w>=d){const a=w*r,b=w-a;rec(x-w/2+a/2,z,a,d,dep+1);rec(x+w/2-b/2,z,b,d,dep+1)}else{const a=d*r,b=d-a;rec(x,z-d/2+a/2,w,a,dep+1);rec(x,z+d/2-b/2,w,b,dep+1)}};
  rec(0,0,v.size,v.size,0)}},
{n:"結び目(Sweep)",p:{p:["p(巻き数)",1,7,3,1],q:["q(振動数)",1,9,2,1],thick:["太さ",.05,.5,.18,.01],seg:["分割数",40,400,160,10]},
 g(v,R,o){const n=v.seg,pts=[],Y=new THREE.Vector3(0,1,0);for(let i=0;i<=n;i++){const t=i/n*PI*2,r=2+Math.cos(v.q*t);pts.push(new THREE.Vector3(r*Math.cos(v.p*t),3-Math.sin(v.q*t)*1.2,r*Math.sin(v.p*t)))}
  for(let i=0;i<n;i++){const a=pts[i],b=pts[i+1],d=b.clone().sub(a),len=d.length(),c=hsl(i/n,.7,.55);Pq(o,"cyl",a.clone().add(b).multiplyScalar(.5),new THREE.Quaternion().setFromUnitVectors(Y,d.normalize()),[v.thick*2,len*1.05,v.thick*2],c);Pq(o,"sph",a,new THREE.Quaternion(),[v.thick*2,v.thick*2,v.thick*2],c)}}},
{n:'メンガーのスポンジ',p:{depth:['再帰深さ',1,3,2,1],size:['大きさ',2,8,4,.5]},
 g(v,R,o){const rec=(x,y,z,s,d)=>{if(!d){P(o,'box',[x,y,z],Z,[s*.98,s*.98,s*.98],hsl(.6+(x+z)*.03,.5,.35+y/v.size*.3));return}for(let a=-1;a<2;a++)for(let b=-1;b<2;b++)for(let c=-1;c<2;c++){if((a==0)+(b==0)+(c==0)>=2)continue;rec(x+a*s/3,y+b*s/3,z+c*s/3,s/3,d-1)}};rec(0,v.size/2,0,v.size,v.depth)}},
