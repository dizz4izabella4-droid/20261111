<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#0b1020}
canvas{position:absolute;left:0;top:0;display:block}
#hit{position:absolute;inset:0;z-index:1;touch-action:none}
.ui{position:absolute;z-index:2;pointer-events:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.btn{position:absolute;z-index:3;pointer-events:auto;touch-action:manipulation;font:700 13px ui-monospace,Menlo,Consolas,monospace;color:#fff;
  background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.55);border-radius:8px;letter-spacing:.06em;padding:0;cursor:pointer}
.btn:active{background:rgba(255,255,255,.25)}
.hide{display:none!important}
#unit{left:14px;top:12px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.14em;opacity:.85}
#gauge{top:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
#gauge i{display:block;width:34px;height:8px;border:1px solid rgba(255,255,255,.7);border-radius:2px;background:transparent}
#gauge i.on{background:#ff2a3a;border-color:#ff2a3a}
#radio{font:600 13px ui-monospace,Menlo,monospace;color:#6cff9a;background:rgba(0,0,0,.55);border:1px solid rgba(108,255,154,.45);border-radius:4px;padding:6px 10px;text-align:center;opacity:0;transition:opacity .2s}
#radio.on{opacity:1}
.port #radio{left:20px;right:20px;top:44px}
.land #radio{left:20%;right:20%;top:36px}
#siren{left:12px;bottom:12px;width:76px;height:56px;line-height:1.25}
#lights{right:12px;bottom:12px;width:76px;height:56px}
#ram{left:50%;bottom:14px;margin-left:-60px;width:120px;height:64px;background:#c01428;border-color:#fff;font-size:18px;animation:bl .5s infinite alternate}
#ram.armed{animation:none;background:#6a0a14}
@keyframes bl{from{opacity:1}to{opacity:.45}}
#cmdp{background:rgba(5,8,20,.82);border-top:1px solid rgba(108,255,154,.4);display:flex;flex-direction:column;justify-content:center;gap:10px;padding:14px 18px;box-sizing:border-box;pointer-events:auto}
.port #cmdp{left:0;right:0;bottom:0;height:33%}
.land #cmdp{right:0;top:0;bottom:0;width:40%;border-top:0;border-left:1px solid rgba(108,255,154,.4)}
#cmdtext{font:700 22px/1.25 ui-monospace,Menlo,monospace;color:#6cff9a;text-align:center}
#cmdhint{font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-align:center;opacity:.85}
#cmdbtn{display:flex;gap:12px;justify-content:center}
#cmdbtn .btn{position:static;width:110px;height:42px}
.ov{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none}
#title{background:rgba(5,8,20,.55)}
#title h1{margin:0;font:800 40px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-shadow:0 0 16px #ff2a3a,0 0 28px #2a6bff}
#title .btn,#end .btn{position:static;width:150px;height:52px;font-size:18px}
#micnote,#micerr{font:600 13px/1.55 'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif;text-align:center;max-width:300px;padding:0 8px;text-shadow:0 1px 4px #000}
#micnote{color:#ffe9b0}
#micerr{color:#ff9a9a;font-size:11.5px;line-height:1.5;text-align:left;max-height:34vh;overflow:auto;pointer-events:auto}
#micerr b{color:#ffe9b0}
#micdiag{display:none;margin:0;max-width:330px;white-space:pre-wrap;word-break:break-all;text-align:left;font:10.5px/1.45 ui-monospace,Menlo,monospace;color:#9fe8ff;background:rgba(0,0,0,.55);padding:6px 8px;border-radius:6px;pointer-events:auto;user-select:text}
#vmic{width:210px!important;height:44px!important;font-size:15px!important;display:none;align-items:center;justify-content:center;flex:none}
#title{gap:10px}
#jpsub{left:12px;right:12px;top:64px;text-align:center;font:700 15px/1.5 'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif;color:#fff;text-shadow:0 1px 3px #000,0 0 8px #000;opacity:0;transition:opacity .2s}
#jpsub.on{opacity:1}
.land #jpsub{right:42%;top:44px;font-size:14px}
#jpsub b{color:#8fb4ff}
#cmdja{font:600 13px/1.4 'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif;color:#cfe0ff;text-align:center}
#cmdhint{font-family:'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif!important;letter-spacing:0!important}
#alert{inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:auto;z-index:6;overflow:hidden;font-family:'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif}
#alert .lr,#alert .lb{position:absolute;top:0;bottom:0;width:60%;filter:blur(30px);opacity:0}
#alert .lr{left:-10%;background:radial-gradient(closest-side,#ff1a2a,transparent);animation:fr .5s infinite}
#alert .lb{right:-10%;background:radial-gradient(closest-side,#1a4aff,transparent);animation:fb .5s infinite}
@keyframes fr{0%,45%{opacity:.95}50%,100%{opacity:.08}}
@keyframes fb{0%,45%{opacity:.08}50%,100%{opacity:.95}}
#alert .t1{position:relative;font-size:13px;letter-spacing:.3em;color:#ffb0a8}
#alert .t2{position:relative;font-size:28px;font-weight:800;color:#fff;text-shadow:0 0 14px #ff2a3a}
#alert .t3{position:relative;font-size:14px;line-height:1.7;color:#e8eefc;max-width:300px;text-align:center;min-height:5em}
#alert .t4{position:relative;font-size:13px;color:#fff;opacity:.85;animation:bl .8s infinite alternate}
#vmicbtn{pointer-events:auto;touch-action:none;width:74px;height:74px;border-radius:50%;border:2px solid #fff;background:#c01428;display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 0 14px rgba(255,40,60,.7);-webkit-user-select:none;user-select:none}
#vmicbtn.down{background:#ff3a4a;transform:scale(1.12);box-shadow:0 0 28px rgba(255,80,90,1)}
.port #vmicbtn{left:50%;margin-left:-41px;bottom:14px;width:82px;height:82px}
#vmicbtn .lab{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 11px 'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif;color:#fff}
.land #vmicbtn{right:calc(20% - 37px);bottom:30px}
#end{background:linear-gradient(rgba(5,8,20,.65),rgba(5,8,20,0) 40%,rgba(5,8,20,0) 70%,rgba(5,8,20,.6));justify-content:space-between;padding:12% 0 18%}
.land #end{padding:6% 0 8%}
#end h2{margin:0;font:800 34px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:#6cff9a;text-shadow:0 0 14px #000}
#resume{background:rgba(0,0,0,.75);pointer-events:auto;font:700 20px ui-monospace,Menlo,monospace;letter-spacing:.1em;z-index:5}
#dbg{left:6px;top:64px;font:11px/1.35 ui-monospace,Menlo,monospace;color:#9f9;background:rgba(0,0,0,.6);padding:4px 6px;white-space:pre;z-index:6}
</style>

/* iz-game-base v1 — 全ゲーム共通の基本設計

 */
(function () {
  'use strict';
  if (window.__izGameBase) return;
  window.__izGameBase = 1;
  var D = document, W = window, DE = D.documentElement;
  var KEY = 'izGameBase.orient';
  var cfg = W.IZ_BASE || {};
  /* 表示文言。作品側で window.IZ_BASE={lang:'en'} を書くと英語になる（既定は日本語） */
  var T = cfg.lang === 'en'
    ? { set: 'Display settings', scr: 'SCREEN', fs: 'Go full screen', fsOff: 'Exit full screen', ori: 'ORIENTATION', auto: 'Auto', port: 'Portrait', land: 'Landscape', close: 'Close', nAuto: 'Follows your device orientation.', nFix: 'Locks the orientation in full screen. If it cannot be locked, please rotate your device.', rot: function (m) { return '\u21bb Please turn your device to ' + (m === 'land' ? 'landscape' : 'portrait'); } }

  /* ---------- 1. 拡大の無効化 ---------- */
  function fixViewport() {
    var m = D.querySelector('meta[name="viewport"]');
    if (!m) {
      m = D.createElement('meta');
      m.name = 'viewport';
      (D.head || DE).appendChild(m);

    if (e.touches && e.touches.length > 1 && e.scale && e.scale !== 1) e.preventDefault();

  var lastEnd = 0;
  var SKIP = 'input,textarea,select,button,a,label,summary,video,audio,[contenteditable],[role="button"],[data-iz-base-ui]';
  D.addEventListener('touchend', function (e) {
    var now = Date.now();
    var t = e.target;
    var skip = t && t.closest && t.closest(SKIP);
    if (!skip && now - lastEnd < 350 && e.cancelable) e.preventDefault();
    lastEnd = now;
  }, { passive: false });

  /* ---------- 2・3. 全画面と向き ---------- */
  var fsEl = DE;
  var fsReq = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen || fsEl.msRequestFullscreen;
  var fsOk = !!fsReq && (D.fullscreenEnabled !== false) && (D.webkitFullscreenEnabled !== false);

    return !!(navigator.standalone || (W.matchMedia && W.matchMedia('(display-mode: standalone)').matches));
  }

    try {
      var p = fsReq.call(fsEl, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(function () {});

    } catch (e) { return null; }

    var f = D.exitFullscreen || D.webkitExitFullscreen || D.msExitFullscreen;
    try { var p = f && f.call(D); if (p && p.catch) p.catch(function () {}); } catch (e) {}

  var uiOk = fsOk || orOk;
  function applyOrient(mode, wantFs) {
    // 戻り値は使わず、結果は banner() が画面の向きで判定する
    if (mode === 'auto') {
      try { if (W.screen && screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
      return;
    }

      if (!lockApi()) return;
      try { var p = screen.orientation.lock(tgt); if (p && p.catch) p.catch(function () {}); } catch (e) {}

  var ui, btn, panel, banner, bT;
  var pos = cfg.pos || 'tr';
  function build() {
    if (ui || !D.body || !uiOk) return;
    var css = D.createElement('style');
    css.textContent =
      '#izb{position:fixed;z-index:2147483646;font:12px/1.4 "Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}' +
      '#izb *{box-sizing:border-box}' +
      '#izb.tr{top:calc(6px + env(safe-area-inset-top,0px));right:calc(6px + env(safe-area-inset-right,0px))}' +
      '#izb.tl{top:calc(6px + env(safe-area-inset-top,0px));left:calc(6px + env(safe-area-inset-left,0px))}' +
      '#izb.br{bottom:calc(6px + env(safe-area-inset-bottom,0px));right:calc(6px + env(safe-area-inset-right,0px))}' +
      '#izb.bl{bottom:calc(6px + env(safe-area-inset-bottom,0px));left:calc(6px + env(safe-area-inset-left,0px))}' +
      '#izb button{font:inherit;color:inherit;border:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}' +
      '#izb .iz-b{width:30px;height:30px;border-radius:8px;background:rgba(20,20,24,.45);border:1px solid rgba(255,255,255,.25);font-size:16px;line-height:28px;text-align:center;padding:0;opacity:.45;transition:opacity .2s}' +
      '#izb .iz-b:active,#izb.open .iz-b{opacity:1}' +
      '#izb .iz-p{display:none;position:absolute;width:210px;padding:10px;border-radius:10px;background:rgba(18,18,22,.94);border:1px solid rgba(255,255,255,.22);box-shadow:0 4px 18px rgba(0,0,0,.5)}' +
      '#izb.open .iz-p{display:block}' +
      '#izb.tr .iz-p,#izb.tl .iz-p{top:36px}#izb.br .iz-p,#izb.bl .iz-p{bottom:36px}' +
      '#izb.tr .iz-p,#izb.br .iz-p{right:0}#izb.tl .iz-p,#izb.bl .iz-p{left:0}' +
      '#izb .iz-h{font-size:11px;color:#aab;margin:0 0 5px}' +
      '#izb .iz-r{display:flex;gap:4px;margin-bottom:9px}' +
      '#izb .iz-r button{flex:1;padding:8px 0;border-radius:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:13px}' +
      '#izb .iz-r button.on{background:#e8c13a;color:#111;border-color:#e8c13a;font-weight:700}' +
      '#izb .iz-r button[disabled]{opacity:.4}' +
      '#izb .iz-n{font-size:10.5px;color:#9a9aa8;margin:-3px 0 6px}' +
      '#izb .iz-x{display:block;width:100%;padding:6px 0;border-radius:7px;background:transparent;border:1px solid rgba(255,255,255,.18);font-size:12px;color:#ccd}' +
      '#izbn{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:2147483645;padding:7px 14px;border-radius:18px;background:rgba(18,18,22,.88);border:1px solid rgba(255,255,255,.25);color:#fff;font:13px/1.3 "Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;pointer-events:none;display:none;white-space:nowrap}';
    (D.head || DE).appendChild(css);

    ui = D.createElement('div');
    ui.id = 'izb';
    ui.className = pos;
    ui.setAttribute('data-iz-base-ui', '');
    ui.innerHTML =
      '<button type="button" class="iz-b" tabindex="-1" aria-label="' + T.set + '">⛶</button>' +
      '<div class="iz-p">' +
      (fsOk ? '<div class="iz-h">' + T.scr + '</div><div class="iz-r"><button type="button" tabindex="-1" data-fs="1">' + T.fs + '</button></div>' : '') +

    panel = ui.querySelector('.iz-p');

      ui.addEventListener(t, function (e) { e.stopPropagation(); });
    });
    ui.addEventListener('click', function (e) {
      var t = e.target.closest('button');
      if (!t) return;
      if (t === btn) { ui.classList.toggle('open'); refresh(); }
      else if (t.getAttribute('data-close')) ui.classList.remove('open');
      else if (t.getAttribute('data-fs')) { isFs() ? exitFs() : enterFs(); setTimeout(refresh, 250); }

    });

  }
  function setMode(m, fromUser) {
    mode = m;
    try { localStorage.setItem(KEY, m); } catch (e) {}

    setTimeout(banner_, 400);

    var fb = ui.querySelector('[data-fs]');
    if (fb) fb.textContent = isFs() ? T.fsOff : T.fs;
    var bs = ui.querySelectorAll('[data-o]');

  }

    if (!banner) return;
    var land = W.innerWidth > W.innerHeight;
    var bad = (mode === 'land' && !land) || (mode === 'port' && land);

      banner.style.display = 'block';
      clearTimeout(bT);

  W.IZBase = { fullscreen: function (on) { on === false ? exitFs() : enterFs(); }, orientation: setMode, get mode() { return mode; } };

<body>
<div id="stage" class="port">
  <canvas id="cv"></canvas>

<script>
/*@TESTABLE*/
/*@CONFIG*/
const CONFIG = Object.freeze({
  STEP: 1 / 120, DT_MAX: 0.1,
  HITS_TO_STOP: 3, SIDES: [1, -1, 1],            // 1=右 -1=左。ミスしたときは同じ側をもう一度出す
  INTRO: 4.0, INTRO_GAP: [40, 26],
  APPROACH: 5.5, APPROACH_AFTER_MISS: 2.7, GAP_WINDOW: 3,
  WINDOW: 1.4, WINDOW_RESCUE: 2.1, PREBUF: 0.15,
  LUNGE: 0.18, HITSTOP: [0.08, 0.08, 0.12], TILT: [3, 4, 6],
  RECOVER: 1.2, RECOVER_GAP: 24, MISS: 0.8, MISS_GAP: 20, FINISH: 0.6, SLOWMO: 0.4,
  WOBBLE: 0.4, SWIPE_LOCK: 0.6, LOCK: 0.4,
  RESCUE: { misses: 2, idle: 25, widen: 3, auto: 150 },
  PULLOVER: 4.0, EVENT: 6.0, ARREST: 3.0, CMD_PREVIEW_AUTO: 20, YOURTURN: 7.0, MORE_EXTRA: 2.0, MORE_MAX: 2, DEAD: 4.0, DEAD_SKIP: 2.0,
  SNAKE: { a1: 1.2, p1: 3.1, a2: 0.35, p2: 1.3 }, LAG: 0.6,
  RADIO: [],                                                         // 追跡中の無線は無し（無線はゲーム開始前の指令だけ）
  BRIEF: 'Dispatch to Unit 12. Suspect vehicle fleeing northbound. Pursue and stop him.',
  EVENT_RADIO: 'Dispatch, suspect vehicle stopped.',
  PARTNER: 'REYES',
  ALERT_RADIO: '至急、至急。管内で強盗事件発生。犯人は赤いセダンで北へ逃走中。付近の車両は追跡せよ。',
  JP: {
    INTRO: '強盗犯の車だ！ 横に並んだら、左右にスワイプして体当たりしろ！',
    WINDOW: '今だ！ スワイプ！',
    HIT1: 'いいぞ！ あと2回！', HIT2: 'あと1回！ 止めるぞ！', HIT3: 'やった、止まるぞ！',
    MISS: '惜しい！ 次の合図に合わせろ！',
    PULLOVER: '停車させた！',
    EVENT: 'ここからは英語で命令だ。まず俺がお手本を言う。',
    PREVIEW: '「お手本を聞く」を押せ。',
    SPEAK: 'よく聞け…',
    YOURTURN: 'マイクボタンを押しながら、英語で命令しろ！',
    REACT: 'その調子だ！',
    ARREST: '確保！ よくやった、相棒。'
  },
  CMDS_JA: ['警察だ！ 手を見せろ！', 'エンジンを切れ！', '車から降りろ！', '地面に伏せろ！'],
  CMDS: [
    { text: 'Police! Show me your hands!', pose: 'handsUpInCar', dur: 1.8, sfx: 'none', praise: { word: 'GOOD!', say: 'Good job!' } },
    { text: 'Turn off the engine!', pose: 'handsUpInCar', dur: 2.0, sfx: 'engineOff', praise: { word: 'GREAT!', say: 'Nice! Keep it up!' } },
    { text: 'Step out of the vehicle!', pose: 'standing', dur: 2.4, sfx: 'door', praise: { word: 'EXCELLENT!', say: 'Excellent! Textbook!' } },
    { text: 'Get on the ground!', pose: 'prone', dur: 2.4, sfx: 'cuffs', praise: { word: 'PERFECT!', say: "Perfect! That's how it's done!" } }
  ],
  ONE_MORE: 'One more, please!',
  SIRENS: ['OFF', 'WAIL', 'YELP', 'PHASER']
});
/*@END*/

/*@CORE*/
const CORE = (function () {
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const ss = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
  const lerp = (a, b, k) => a + (b - a) * k;
  function kf(t, pts) {                               // [[時刻,値],…] を smoothstep で補間
    if (t <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      if (t <= pts[i][0]) return lerp(pts[i - 1][1], pts[i][1], ss((t - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0])));
    }
    return pts[pts.length - 1][1];
  }
  const PHASE_OF = { TITLE: 'TITLE', INTRO: 'CHASE', APPROACH: 'CHASE', WINDOW: 'CHASE', LUNGE: 'CHASE', HIT: 'CHASE', RECOVER: 'CHASE', MISS: 'CHASE', FINISH: 'CHASE',
    PULLOVER: 'PULLOVER', EVENT: 'EVENT', PREVIEW: 'CMD', SPEAK: 'CMD', YOURTURN: 'CMD', REACT: 'CMD', ARREST: 'ARREST', END: 'END', DEAD: 'DEAD' };
  const MAX_DWELL = { INTRO: 6, APPROACH: 8, WINDOW: 3.5, LUNGE: 1, HIT: 1, RECOVER: 3, MISS: 2, FINISH: 2, PULLOVER: 6, EVENT: 10, SPEAK: 6, YOURTURN: 14, REACT: 6, ARREST: 5, DEAD: 8 };
  const FORCE_NEXT = { INTRO: 'APPROACH', APPROACH: 'WINDOW', WINDOW: 'MISS', LUNGE: 'HIT', HIT: 'RECOVER', RECOVER: 'APPROACH', MISS: 'APPROACH', FINISH: 'PULLOVER',
    PULLOVER: 'EVENT', EVENT: 'PREVIEW', SPEAK: 'YOURTURN', YOURTURN: 'REACT', REACT: 'PREVIEW', ARREST: 'END', DEAD: 'TITLE' };

  function create(C, opt) {
    opt = opt || {};
    const rnd = mulberry32(opt.seed || 1);
    const phi = rnd() * 6.2832;
    const S = { phase: 'TITLE', sub: 'TITLE', t: 0, ct: 0, gap: C.INTRO_GAP[0], sx: 0, px: 0, speed: 0, hits: 0, damage: 0, misses: 0, streakMiss: 0, sinceHit: 0,
      window: null, ram: false, ramArmed: false, cmd: { i: 0, step: '' }, pose: { from: 'inCar', to: 'inCar', k: 1 }, ytLimit: 5, siren: 'OFF', lights: true, timeScale: 1,
      elapsed: 0, side: 1, tilt: 0, fade: 0, wobble: 0, lock: 0, dur: 0, auto: false, crackSeed: Math.floor(rnd() * 1e9), pxKick: 0, hintShown: false };
    let ev = [], n = 0, simT = 0, acc = 0, wentAt = -1, lock = 0, swipeLock = 0, wobble = 0;
    let gapE = 0, sxE = 0, pxE = 0, tiltE = 0, beatSide = C.SIDES[0], afterMiss = false, buffered = false, radioIdx = 0, pxF = 0, speakAuto = false, stuckSent = false;
    let flags = {}, sirenIdx = 0, ytLimit = 5, ytMore = 0;
    let pend = { swipe: null, tap: false, button: null, voice: false, more: false };

    const emit = (type, o) => { ev.push(Object.assign({ type: type, at: n * C.STEP }, o || {})); };
    const snake = ct => C.SNAKE.a1 * Math.sin(6.2832 * ct / C.SNAKE.p1) + C.SNAKE.a2 * Math.sin(6.2832 * ct / C.SNAKE.p2 + phi);

    function reset() {
      Object.assign(S, { hits: 0, damage: 0, misses: 0, streakMiss: 0, sinceHit: 0, window: null, ram: false, ramArmed: false, elapsed: 0, ct: 0, gap: C.INTRO_GAP[0], sx: 0, px: 0,
        pose: { from: 'inCar', to: 'inCar', k: 1 }, cmd: { i: 0, step: '' }, tilt: 0, fade: 0, timeScale: 1, pxKick: 0, speed: 0, hintShown: false });
      pxF = 0; radioIdx = 0; beatSide = C.SIDES[0]; afterMiss = false; buffered = false;
    }
    function go(sub) {
      if (wentAt === n) return false;                   // 同じ瞬間の二重遷移は捨てる
      wentAt = n;
      const prev = S.phase;
      S.sub = sub; S.phase = PHASE_OF[sub]; S.t = 0; stuckSent = false; flags = {};
      gapE = S.gap; sxE = S.sx; pxE = S.px; tiltE = S.tilt;
      if (S.phase !== prev) { lock = C.LOCK; emit('phase', { from: prev, to: S.phase }); }
      emit('sub', { sub: sub });
      if (subs[sub].enter) subs[sub].enter();
      return true;
    }
    function lunge() { go('LUNGE'); }
    function swipeOutside(wob) { if (wob && swipeLock <= 0) { wobble = C.WOBBLE; swipeLock = C.WOBBLE + C.SWIPE_LOCK; emit('whiff'); } }

    const subs = {
      TITLE: { enter() { reset(); }, upd(h, i, locked) { if (i.button === 'start' && !locked) { reset(); go('INTRO'); } } },
      INTRO: {
        enter() { S.speed = 30; },
        upd(h, i) {
          S.gap = lerp(C.INTRO_GAP[0], C.INTRO_GAP[1], ss(S.t / C.INTRO));
          S.sx = snake(S.ct) * ss(S.t / 1.5);
          if (S.t >= C.INTRO) go('APPROACH');
        }
      },
      APPROACH: {
        enter() { S.dur = afterMiss ? C.APPROACH_AFTER_MISS : C.APPROACH; buffered = false; },
        upd(h, i) {
          const d = S.dur;
          S.gap = lerp(gapE, C.GAP_WINDOW, ss(S.t / d));
          const base = lerp(sxE, snake(S.ct), ss(S.t / 0.8));
          S.sx = lerp(base, beatSide * 1.0, ss((S.t - (d - 1)) / 1));
          S.tilt = tiltE * (1 - ss(S.t / 0.5));
          if (i.swipe) { if (d - S.t <= C.PREBUF) buffered = true; else swipeOutside(true); }
          if (S.t >= d) go('WINDOW');
        }
      },
      WINDOW: {
        enter() {
          const len = S.streakMiss >= C.RESCUE.widen ? C.WINDOW_RESCUE : C.WINDOW;
          S.window = { side: beatSide, t: 0, len: len }; S.gap = C.GAP_WINDOW;
          emit('window', { side: beatSide, len: len });
        },
        upd(h, i, locked) {
          S.window.t = S.t; S.gap = C.GAP_WINDOW; S.side = beatSide;
          S.sx = beatSide * 1.0 + 0.2 * Math.sin(6.2832 * 5 * S.t);
          const ramNow = i.button === 'ram' && S.ram && !locked;
          if (i.swipe || buffered || ramNow || S.ramArmed || S.elapsed >= C.RESCUE.auto) { lunge(); return; }
          if (S.t >= S.window.len) go('MISS');
        }
      },
      LUNGE: {
        enter() { S.window = null; },
        upd(h) {
          const p = ss(S.t / C.LUNGE);
          S.gap = lerp(C.GAP_WINDOW, 0, p); S.sx = lerp(sxE, beatSide * 1.2, p); S.pxKick = beatSide * 0.6 * p;
          if (S.t >= C.LUNGE) {
            S.hits++; S.damage = Math.min(3, S.hits); S.sinceHit = 0; S.streakMiss = 0; S.ram = false; S.ramArmed = false;
            emit('hit', { stage: S.hits, x: S.sx, side: beatSide });
            go('HIT');
          }
        }
      },
      HIT: {
        enter() { S.timeScale = 0; S.tilt = beatSide * C.TILT[Math.min(S.hits, 3) - 1]; S.dur = C.HITSTOP[Math.min(S.hits, 3) - 1]; },
        upd(h) { if (S.t >= S.dur) { S.timeScale = 1; go(S.hits >= C.HITS_TO_STOP ? 'FINISH' : 'RECOVER'); } }
      },
      FINISH: {
        enter() { S.timeScale = C.SLOWMO; },
        upd(h) { if (S.t >= C.FINISH) { S.timeScale = 1; go('PULLOVER'); } }
      },
      RECOVER: {
        upd(h, i) {
          const p = ss(S.t / C.RECOVER);
          S.gap = lerp(gapE, C.RECOVER_GAP, p); S.sx = lerp(sxE, 0, p); S.tilt = tiltE * (1 - p); S.pxKick = (beatSide * 0.6) * (1 - p);
          if (i.swipe) swipeOutside(true);
          if (S.t >= C.RECOVER) { beatSide = C.SIDES[S.hits % C.SIDES.length]; afterMiss = false; S.pxKick = 0; go('APPROACH'); }
        }
      },
      MISS: {
        enter() {
          S.misses++; S.streakMiss++; S.window = null; emit('miss', { streak: S.streakMiss });
          if (S.streakMiss >= C.RESCUE.misses && !S.ram) { S.ram = true; emit('ram', { on: true }); }
        },
        upd(h) {
          const p = ss(S.t / C.MISS);
          S.gap = lerp(gapE, C.MISS_GAP, p); S.sx = lerp(sxE, 0, p);
          if (S.t >= C.MISS) { afterMiss = true; go('APPROACH'); }
        }
      },
      PULLOVER: {
        enter() { S.speed = 30; S.fade = 0; },
        upd(h) {
          const t = S.t;
          S.sx = kf(t, [[0, sxE], [1.2, 3.5], [2.6, 4.6]]);
          S.px = kf(t, [[0, pxE], [1.2, pxE], [2.6, 3.0]]);
          S.gap = kf(t, [[0, gapE], [2.6, 13]]);
          S.speed = kf(t, [[0, 30], [1.2, 12], [2.6, 0]]);
          S.tilt = kf(t, [[0, tiltE], [1.8, 0], [2.6, 5]]);
          if (t >= 2.6 && !flags.stopped) { flags.stopped = true; emit('stopped'); }
          S.fade = ss((t - 3.5) / 0.5);
          if (t >= C.PULLOVER) go('EVENT');
        }
      },
      EVENT: {
        enter() { S.speed = 0; S.fade = 1; S.cmd = { i: 0, step: '' }; emit('radio', { text: C.EVENT_RADIO }); },
        upd(h, i, locked) {
          S.fade = 1 - ss(S.t / 0.5);
          if (S.t >= 1.5 && !flags.spot) { flags.spot = true; emit('spot'); }
          if (S.t >= 3.0 && !flags.door) { flags.door = true; emit('door'); }
          if (((i.tap || i.button === 'next') && !locked) || S.t >= C.EVENT) go('PREVIEW');
        }
      },
      PREVIEW: {
        enter() { S.cmd.step = 'preview'; emit('cmd', { i: S.cmd.i, step: 'preview', text: C.CMDS[S.cmd.i].text }); },
        upd(h, i, locked) {
          const tapped = (i.tap || i.button === 'next') && !locked;
          if (tapped || S.t >= C.CMD_PREVIEW_AUTO) { speakAuto = !tapped; go('SPEAK'); }
        }
      },
      SPEAK: {
        enter() { const t = C.CMDS[S.cmd.i].text; S.dur = t.length * 0.07 + 0.6; S.cmd.step = 'speak'; emit('cmd', { i: S.cmd.i, step: 'speak', text: t, auto: speakAuto, dur: S.dur }); },
        upd(h) { if (S.t >= S.dur) go('YOURTURN'); }
      },
      YOURTURN: {
        enter() { ytLimit = C.YOURTURN; ytMore = 0; S.ytLimit = ytLimit; S.cmd.step = 'yourturn'; emit('cmd', { i: S.cmd.i, step: 'yourturn' });  },
        upd(h, i, locked) {
          if (i.more && ytMore < C.MORE_MAX && !locked) { ytMore++; ytLimit += C.MORE_EXTRA; S.ytLimit = ytLimit; emit('more', { n: ytMore }); }
          if (i.voice && !locked) go('REACT'); else if (S.t >= ytLimit) go('DEAD');      // 声が入らないまま時間切れ＝撃たれる
        }
      },
      REACT: {
        enter() {
          const c = C.CMDS[S.cmd.i]; S.cmd.step = 'react';
          S.pose = { from: S.pose.to, to: c.pose, k: 0 }; S.dur = c.dur;
          emit('react', { i: S.cmd.i, pose: c.pose, sfx: c.sfx });
        },
        upd(h) {
          S.pose.k = ss(S.t / (S.dur * 0.8));
          if (S.t >= S.dur) { S.cmd.i++; go(S.cmd.i >= C.CMDS.length ? 'ARREST' : 'PREVIEW'); }
        }
      },
      ARREST: {
        enter() { emit('arrest'); },
        upd(h) {
          if (S.t >= 0.5 && !flags.cuffs) { flags.cuffs = true; emit('cuffs'); }
          if (S.t >= C.ARREST) go('END');
        }
      },
      DEAD: {
        enter() { S.speed = 0; S.timeScale = 1; S.window = null; emit('draw'); },
        upd(h, i, locked) {
          if (S.t >= 0.6 && !flags.shot) { flags.shot = true; emit('shot'); }
          if (S.t >= 1.1 && !flags.dead) { flags.dead = true; emit('dead'); }
          if (S.t >= C.DEAD || (i.tap && S.t >= C.DEAD_SKIP && !locked)) go('TITLE');
        }
      },
      END: {
        enter() { emit('end'); },
        upd(h, i, locked) { if ((i.button === 'replay' || i.tap) && !locked) { reset(); go('INTRO'); } }
      }
    };

    function tick(h, inp) {
      n++; S.t += h; lock = Math.max(0, lock - h); swipeLock = Math.max(0, swipeLock - h); wobble = Math.max(0, wobble - h);
      S.wobble = wobble > 0 ? wobble / C.WOBBLE : 0; S.lock = lock;
      const locked = lock > 0, b = inp.button;
      if (b === 'siren') { sirenIdx = (sirenIdx + 1) % C.SIRENS.length; S.siren = C.SIRENS[sirenIdx]; emit('siren', { mode: S.siren }); }
      if (b === 'lights') { S.lights = !S.lights; emit('lights', { on: S.lights }); }
      if (b === 'ram' && S.ram && S.phase === 'CHASE' && !locked && S.sub !== 'WINDOW') { S.ramArmed = true; emit('ramArm'); }
      if (S.phase === 'CHASE') {
        S.ct += h; S.elapsed += h;
        if (S.sub !== 'INTRO') S.sinceHit += h;
        if (radioIdx < C.RADIO.length && S.ct >= C.RADIO[radioIdx].t) { emit('radio', { text: C.RADIO[radioIdx].text }); radioIdx++; }
        if (S.sinceHit >= C.RESCUE.idle && !S.ram) { S.ram = true; emit('ram', { on: true }); }
        pxF += (S.sx - pxF) * (1 - Math.exp(-h / C.LAG));
        S.px = pxF + S.pxKick;
      }
      const sub = subs[S.sub];
      if (sub.upd) sub.upd(h, inp, locked);
      if (MAX_DWELL[S.sub] && S.t > MAX_DWELL[S.sub]) {      // 見張り：想定より長く居座ったら先へ進める
        if (!stuckSent) { stuckSent = true; emit('stuck', { sub: S.sub }); }
        if (FORCE_NEXT[S.sub]) go(FORCE_NEXT[S.sub]);
      }
    }

    function step(dt, input) {
      if (input) {
        if (input.swipe) pend.swipe = input.swipe;
        if (input.tap) pend.tap = true;
        if (input.button) pend.button = input.button;
        if (input.voice) pend.voice = true;
        if (input.more) pend.more = true;
      }
      acc += Math.min(Math.max(dt, 0), C.DT_MAX);
      ev = [];
      while (acc >= C.STEP - 1e-9) {
        acc -= C.STEP;
        const inp = pend; pend = { swipe: null, tap: false, button: null, voice: false, more: false };
        tick(C.STEP, inp);
      }
      const r = ev; ev = []; return r;
    }

    function bot(s, o) {
      o = o || {};
      const i = { swipe: null, tap: false, button: null, voice: false };
      if (s.sub === 'TITLE') i.button = 'start';
      else if (s.sub === 'WINDOW' && s.window && s.window.t >= (o.delay || 0.3) && !o.noSwipe) i.swipe = { dir: s.window.side };
      else if (s.sub === 'PREVIEW') i.tap = true;
      else if (s.sub === 'YOURTURN') i.voice = !o.noVoice;
      else if (s.sub === 'EVENT' && o.skip) i.tap = true;
      else if (s.sub === 'END' && o.replay) i.button = 'replay';
      return i;
    }
    function warp(label) {
      const m = /^(PREVIEW|REACT|YOURTURN)(\d)$/.exec(label), mh = /^HIT(\d)$/.exec(label);
      const pred = {
        WINDOW: () => S.sub === 'WINDOW' && S.window && S.window.t >= 0.2,
        MISS: () => S.sub === 'MISS'
      }[label] || (mh ? () => S.sub === 'HIT' && S.hits === +mh[1]
        : m ? () => S.sub === m[1] && S.cmd.i === +m[2] : () => S.sub === label);
      const o = { noSwipe: label === 'MISS', noVoice: label === 'DEAD' || /^YOURTURN/.test(label) };
      for (let k = 0; k < 60 * 900; k++) {
        if (pred()) { ev = []; return true; }
        step(1 / 60, bot(S, o));
      }
      return false;
    }
    return { step: step, state: S, warp: warp, bot: bot, config: C, get simTime() { return n * C.STEP; } };
  }
  return { create: create };
})();
/*@END*/
/*@END_TESTABLE*/
</script>

<script>
(function () {
  'use strict';
  const Q = new URLSearchParams(location.search);
  const DEBUG = Q.get('debug') === '1', AUTO = Q.get('auto') === '1', SHOT = Q.get('shot');
  const core = CORE.create(CONFIG, { seed: +Q.get('seed') || 1 });
  const S = core.state;
  const $ = id => document.getElementById(id);
  const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');

  /* ================= VIEW ================= */
  const VIEWS = {
    port: { W: 360, H: 640, hor: 230, F: 1018 },
    land: { W: 640, H: 360, hor: 110, F: 720 }
  };
