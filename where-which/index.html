<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e3f6ee">
<title>WHERE WHICH</title>
<script>/* iPhoneのマナーモードに従わせる */try{ if(navigator.audioSession) navigator.audioSession.type="ambient"; }catch(e){}</script>
<style>
/* WHERE WHICH: パステルのお部屋。外部の読み込みはなし。文字は標準の日本語ゴシック体だけ */
:root{
  --sky1:#e3f6ee; --sky2:#efe6ff; --sky3:#ffe6f0;
  --ink:#4a3d63; --ink2:#8a7ca3; --line:#e4dcf0; --white:#fffdff;
  --mint:#5fcfae; --mintD:#35a888; --mintS:#dff6ee;
  --pink:#ff8fb8; --pinkD:#e8668f; --pinkS:#ffe3ee;
  --lav:#b39cf2; --lavD:#8e72e0; --lavS:#efe8ff;
  --lemon:#ffd66b; --lemonD:#f0b93a;
  --ja:"Yu Gothic UI","游ゴシック","YuGothic","Hiragino Sans","ヒラギノ角ゴシック","Hiragino Kaku Gothic ProN",Meiryo,"Noto Sans JP","Noto Sans CJK JP",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{overflow-x:hidden}
body{font-family:var(--ja);color:var(--ink);line-height:1.6;
  background:linear-gradient(160deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%) fixed;
  padding:max(8px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  -webkit-tap-highlight-color:transparent}
button,input,select{font-family:var(--ja);color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:8px;height:calc(var(--vvh,100dvh) - 16px);min-height:540px;transform:translateY(var(--vvt,0px))}
.app>*{flex:none}
.app>.stagewrap{flex:0 1 auto;height:min(96vw,500px);min-height:200px;display:flex}
.stagewrap>.room{flex:1 1 auto}

/* ===== ヘッダー ===== */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
.logo{display:flex;flex-direction:column;line-height:1.1}
.logo h1{margin:0;white-space:nowrap;font-size:clamp(18px,5vw,24px);font-weight:900;letter-spacing:.06em;color:var(--ink)}
.logo h1 b{color:var(--mintD);font-weight:900}
.logo small{font-size:10px;font-weight:700;color:var(--ink2);letter-spacing:.14em;margin-top:2px}
.chip-btn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:6px 12px 7px;background:var(--lav);color:#fff;
  font-weight:800;font-size:12px;box-shadow:0 3px 0 var(--lavD);transition:transform .08s,box-shadow .08s}
.chip-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lavD)}
.chip-btn svg{width:18px;height:18px}
.chip-btn .num{background:#fff;color:var(--lavD);border-radius:999px;padding:1px 9px;font-size:12px}

/* ===== おへや ===== */
.room{position:relative;width:100%;min-height:0;display:flex;flex-direction:column;border-radius:26px;overflow:hidden;cursor:pointer;
  border:3px solid #fff;box-shadow:0 5px 0 var(--line),0 12px 22px rgba(107,74,122,.12);
  background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.55) 0 3px,transparent 4px) 0 0/34px 34px,
    linear-gradient(180deg,#d8f3ea 0%,#e9f8f2 100%);
  transition:transform .15s,box-shadow .15s}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:34%;
  background:repeating-linear-gradient(90deg,rgba(150,100,50,.10) 0 2px,transparent 2px 64px),linear-gradient(180deg,#f3d9a8,#e9c78c);
  border-top:4px solid #fff7e6}
.room .rug{position:absolute;left:50%;bottom:6%;width:62%;height:17%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at center,#ffd0e2 0 38%,#ffb5d0 39% 62%,#ff9fc0 63%);box-shadow:0 2px 0 rgba(200,90,130,.25)}
.room .window{position:absolute;top:50px;right:26px;width:84px;height:70px;border-radius:14px;background:#cfeeff;border:5px solid #fff;
  box-shadow:0 3px 0 var(--line);overflow:hidden}
.room .window::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:#fff;transform:translateX(-50%)}
.room .window::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;background:#fff;transform:translateY(-50%)}
.room .window i{position:absolute;left:8px;top:10px;width:26px;height:10px;border-radius:999px;background:#fff;opacity:.95;z-index:1}
.room .frame{position:absolute;top:56px;left:30px;width:56px;height:46px;border-radius:8px;background:var(--pinkS);border:4px solid #fff;box-shadow:0 3px 0 var(--line);
  display:grid;place-items:center;font-weight:900;color:var(--pinkD);font-size:18px}
.room .shelf{position:absolute;top:128px;left:22px;width:84px;height:8px;border-radius:4px;background:#e9c78c;box-shadow:0 3px 0 rgba(150,100,50,.2)}
.room .shelf::before{content:"";position:absolute;bottom:8px;left:10px;width:18px;height:22px;border-radius:5px;background:var(--lemon)}
.room .shelf::after{content:"";position:absolute;bottom:8px;left:36px;width:14px;height:30px;border-radius:5px;background:var(--lav)}
.deco{pointer-events:none;user-select:none}

#character-mover{position:absolute;bottom:8px;left:50%;pointer-events:none;user-select:none;will-change:transform;transform:translateX(-50%)}
#character-mover .shadow{width:64px;height:12px;margin:-12px auto 0;border-radius:50%;background:rgba(90,60,40,.22);filter:blur(1px)}
#character-sprite-inner{display:flex;flex-direction:column;align-items:center}

.status{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.92);font-size:11px;font-weight:800;color:var(--ink2);z-index:2}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.status .dot.off{background:#bdb4cc}
.toggle{position:static;border:0;border-radius:999px;padding:5px 12px 6px;background:var(--mint);color:#fff;font-size:11px;font-weight:800;box-shadow:0 3px 0 var(--mintD);z-index:2}
.toggle:active{transform:translateY(2px);box-shadow:0 1px 0 var(--mintD)}
.toggle.off{background:#bdb4cc;box-shadow:0 3px 0 #9d94ae}
.room .controls{position:absolute;bottom:10px;right:12px;display:flex;gap:6px;z-index:2}
.mini{border:0;border-radius:999px;padding:5px 12px 6px;background:rgba(255,255,255,.95);color:var(--ink);font-size:11px;font-weight:800;box-shadow:0 2px 0 var(--line)}
.mini:hover{background:var(--lavS)}
.mini.danger:hover{background:var(--pinkS);color:var(--pinkD)}

@keyframes gentleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.presence-float{animation:gentleFloat 4.5s ease-in-out infinite}
@keyframes walkBob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(-2deg)}75%{transform:translateY(-6px) rotate(2deg)}}
.walk-bobbing{animation:walkBob .55s ease-in-out infinite}

/* ===== きもちエフェクト（かおは いじらず、まわりに マークを だす） ===== */
#character-sprite-inner{position:relative}
#character-emote{display:flex;transform-origin:50% 100%}
#emote-fx{position:absolute;left:50%;top:0;width:0;height:0;pointer-events:none;z-index:3}
.fx{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity;animation:fxRise var(--t,1.6s) ease-out var(--d,0s) forwards}
.fx svg{display:block;width:var(--s,22px);height:var(--s,22px);margin:calc(var(--s,22px) / -2) 0 0 calc(var(--s,22px) / -2)}
.fx.pop{animation-name:fxPop}
.fx.fall{animation-name:fxFall}
.fx .mk{display:grid;place-items:center;min-width:44px;height:44px;margin:-22px 0 0 -22px;padding:0 6px;border-radius:50%;background:#fff;box-shadow:0 3px 0 var(--line);font-weight:900;font-size:26px;line-height:1;color:var(--ink)}
.fx .mk.a{color:var(--pinkD)}
.fx .mk.q{color:var(--lavD)}
@keyframes fxRise{0%{opacity:0;transform:translate(var(--x,0),var(--y,0)) scale(.3) rotate(0)}18%{opacity:1}100%{opacity:0;transform:translate(calc(var(--x,0) + var(--dx,0px)),calc(var(--y,0) + var(--dy,-40px))) scale(1) rotate(var(--r,0deg))}}
@keyframes fxFall{0%{opacity:0;transform:translate(var(--x,0),var(--y,0)) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x,0),calc(var(--y,0) + var(--dy,50px))) scale(1)}}
@keyframes fxPop{0%{opacity:0;transform:translate(var(--x,0),var(--y,0)) scale(.2)}16%{opacity:1;transform:translate(var(--x,0),var(--y,0)) scale(1.3)}30%{transform:translate(var(--x,0),var(--y,0)) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(var(--x,0),calc(var(--y,0) - 6px)) scale(1)}}
@keyframes emoHop{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.08,.9)}30%{transform:translateY(-16px) scale(.96,1.06)}48%{transform:translateY(0) scale(1.06,.93)}64%{transform:translateY(-10px)}80%{transform:translateY(0) scale(1.03,.97)}}
@keyframes emoDroop{0%{transform:none;filter:none}25%,80%{transform:translateY(7px) rotate(-4deg) scale(1,.93);filter:saturate(.55) brightness(.93)}100%{transform:none;filter:none}}
@keyframes emoJump{0%,100%{transform:translateY(0)}14%{transform:translateY(-22px) scale(.94,1.08)}30%{transform:translateY(0) scale(1.08,.9)}42%{transform:translateX(-4px)}54%{transform:translateX(4px)}66%{transform:translateX(-2px)}80%{transform:none}}
@keyframes emoSway{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes emoSleep{0%,100%{transform:none}50%{transform:translateY(4px) scale(1.02,.96)}}
.emo-hop{animation:emoHop 1.3s ease-in-out}
.emo-droop{animation:emoDroop 3s ease-in-out}
.emo-jump{animation:emoJump 1s ease-out}
.emo-sway{animation:emoSway 1.8s ease-in-out 2}
.emo-groove{animation:emoSway .6s ease-in-out 4}
.emo-shake{animation:emoShake .5s linear 3}
.emo-shy{animation:emoShy 2.4s ease-in-out}
@keyframes emoShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) scale(1.04)}75%{transform:translateX(4px) scale(1.04)}}
@keyframes emoShy{0%,100%{transform:none}25%,75%{transform:rotate(9deg) translateY(3px) scale(.95)}}
.emo-sleep{animation:emoSleep 2.4s ease-in-out 2}

/* ===== 交流レベル ===== */
.level{background:var(--white);border-radius:16px;padding:5px 12px;box-shadow:0 2px 0 var(--line)}
.level-row{display:flex;align-items:center;gap:10px}
.level .lv{flex:none;background:var(--lemon);color:#7a5a00;font-weight:900;font-size:13px;padding:2px 11px 3px;border-radius:999px;box-shadow:0 2px 0 var(--lemonD)}
.lvbar{flex:1;height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.lvbar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--lav));transition:width .5s ease}
.lvnext{flex:none;font-size:11px;font-weight:800;color:var(--ink2)}
.lvhint{display:none;margin-top:2px;font-size:10px;color:var(--ink2);text-align:center}
@media(min-height:780px){body:not(.kb) .lvhint{display:block}}
.levelup{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;max-width:92vw;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 24px 13px;border-radius:24px;background:var(--lemon);color:#5c4300;
  box-shadow:0 5px 0 var(--lemonD),0 14px 30px rgba(74,61,99,.25);cursor:pointer;text-align:center;animation:lvpop .5s cubic-bezier(.22,1.4,.36,1)}
.levelup b{font-size:18px;font-weight:900;letter-spacing:.08em}
.levelup span{font-size:12px;font-weight:800}
@keyframes lvpop{0%{opacity:0;transform:translate(-50%,-20px) scale(.85)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
.gsel{border:0;border-radius:999px;padding:2px 6px;background:var(--mintS);color:var(--mintD);font-size:10px;font-weight:800;max-width:118px;outline:none}

/* ===== なまえ ===== */
.namebar{align-self:center;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--white);border-radius:999px;padding:6px 8px 6px 16px;box-shadow:0 3px 0 var(--line);font-size:13px}
.namebar .lbl{color:var(--ink2);font-weight:700}
.namebar #speech-speaker-name{font-weight:900;color:var(--mintD);font-size:15px}
.name-edit{display:flex;align-items:center;gap:6px}
.name-edit input{flex:1;min-width:0;border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;background:#fff;outline:none}
.name-edit input:focus{border-color:var(--mint)}
.btn-s{white-space:nowrap;border:0;border-radius:999px;padding:6px 14px 7px;background:var(--lavS);color:var(--lavD);font-weight:800;font-size:12px}
.btn-s:hover{background:var(--lav);color:#fff}
.btn-s.main{background:var(--mint);color:#fff;box-shadow:0 3px 0 var(--mintD)}

/* ===== セリフ ===== */
.speech{position:relative;z-index:4;margin:auto 10px calc(var(--chsize,96px) + 24px);background:rgba(255,253,255,.93);border:3px solid #fff;border-radius:22px;padding:9px 12px 8px;
  display:flex;flex-direction:column;cursor:pointer;box-shadow:0 4px 0 var(--line),0 8px 18px rgba(107,74,122,.12);transition:transform .1s}
.speech{transition:opacity 1.2s ease,transform .1s}
.speech.dim{opacity:.14}
.speech::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;background:rgba(255,253,255,.97);transform:translateX(-50%) rotate(45deg);border-radius:0 0 4px 0;box-shadow:3px 3px 0 var(--line)}
.speech:active{transform:scale(.995)}
.speech-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.speaker{display:flex;align-items:center;gap:8px}
#speech-speaker-label{font-weight:900;font-size:12px}
.name-tag{border:0;display:inline-flex;align-items:center;gap:5px;background:var(--mint);color:#fff;padding:2px 10px 3px;border-radius:999px}
.name-tag i{font-style:normal;font-size:11px;opacity:.85}
.name-edit{margin:4px 2px 0;display:flex;align-items:center;gap:6px}
.metarow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px}
.quick{justify-content:center;margin:0 0 8px}
#input-word::placeholder{font-size:12px}
#speech-category-tag{background:var(--lavS);color:var(--lavD);font-weight:800;font-size:10px;padding:2px 9px;border-radius:999px}
.next{border:0;border-radius:999px;padding:4px 11px 5px;background:var(--pink);color:#fff;font-weight:800;font-size:12px;box-shadow:0 3px 0 var(--pinkD);display:inline-flex;align-items:center;gap:3px}
.next:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pinkD)}
.next svg{width:13px;height:13px}
.speech-body{display:flex;align-items:center;padding:2px 2px}
#speech-text{width:100%;font-size:clamp(16px,4.7vw,20px);font-weight:700;line-height:1.65;letter-spacing:.04em;color:var(--ink)}
#speech-text{word-break:keep-all;overflow-wrap:anywhere}
#speech-text p{margin:0}
#speech-text p+p{margin-top:6px}
.speech-foot{display:flex;align-items:center;gap:8px;margin-top:4px}
#speech-hint-text{font-size:10px;color:var(--ink2);user-select:none}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.qr{border:0;border-radius:14px;padding:7px 18px 9px;font-size:15px;font-weight:900;letter-spacing:.06em;color:#fff;transition:transform .08s,box-shadow .08s}
.qr.yes{background:var(--mint);box-shadow:0 4px 0 var(--mintD)}
.qr.no{background:var(--pink);box-shadow:0 4px 0 var(--pinkD)}
.qr.wait{background:var(--lavS);color:var(--lavD);box-shadow:0 4px 0 var(--line);font-size:13px}
.qr.wait.on{background:var(--lav);color:#fff;box-shadow:0 4px 0 var(--lavD)}
.qr:active{transform:translateY(3px);box-shadow:none}
@keyframes wordPopIn{0%{opacity:0;transform:translateY(5px) scale(.97)}100%{opacity:1;transform:none}}
.speech-chunk{display:inline-block;animation:wordPopIn .28s cubic-bezier(.22,1,.36,1) forwards}
@keyframes speakingPulse{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
.speaking-indicator{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);margin-left:6px;vertical-align:middle;animation:speakingPulse .8s ease-in-out infinite}

/* ===== おしえる ===== */
.teach{background:var(--white);border:3px solid #fff;border-radius:22px;padding:8px 10px 7px;box-shadow:0 4px 0 var(--line),0 8px 18px rgba(107,74,122,.1)}
.teach-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.teach h2{margin:0;font-size:13px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:8px}
.teach h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 3px var(--pinkS)}
.teach .limit{font-size:10px;font-weight:700;color:var(--ink2)}
.teach form{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) auto;gap:6px}
.field{position:relative}
.field input{width:100%;height:44px;border:3px solid var(--line);border-radius:14px;padding:0 40px 0 12px;font-size:17px;font-weight:700;background:#fff;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--mint)}
.field input::placeholder{color:#b9aecb;font-weight:500}
#char-counter{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;color:var(--ink2);user-select:none}
#char-counter.over{color:var(--pinkD)}
.row2{display:contents}
.row2 select{min-width:0;height:44px;border:3px solid var(--line);border-radius:14px;padding:0 6px;font-size:13px;font-weight:800;background:#fff;outline:none}
.row2 select:focus{border-color:var(--mint)}
.go{border:0;height:44px;padding:0 16px 3px;border-radius:14px;background:var(--mint);color:#fff;font-size:15px;font-weight:900;letter-spacing:.06em;box-shadow:0 4px 0 var(--mintD);transition:transform .08s,box-shadow .08s;flex:none}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--mintD)}
.feedback{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;font-size:11px;line-height:1.35}
#feedback-message{margin:0;color:var(--ink2);font-weight:700}
#feedback-message.ok{color:var(--mintD)}
#feedback-message.err{color:var(--pinkD)}
.sample{border:0;background:none;color:var(--lavD);font-weight:800;font-size:12px;padding:2px 0;flex:none}
.sample:hover{text-decoration:underline}
footer{display:none;text-align:center;font-size:10px;color:var(--ink2)}
@media(min-height:820px){body:not(.kb) footer{display:block}}
body.kb{--chsize:62px}
body.kb header,body.kb .level,body.kb .teach-head{display:none}
body.kb .room{min-height:0;height:100%}
body.kb .app{justify-content:flex-start}
body.kb .app{min-height:0}

/* ===== はじめの子（植物スライム）SVG ===== */
#character-svg{width:var(--chsize,96px);height:var(--chsize,96px);filter:drop-shadow(0 4px 4px rgba(0,0,0,.18))}
.nc{display:block;width:100%;height:100%;overflow:visible}
.nc .face{display:none}
.nc[data-face="normal"] .f-normal,.nc[data-face="smile"] .f-smile,.nc[data-face="surprise"] .f-surprise,.nc[data-face="troubled"] .f-troubled,
.nc[data-face="angry"] .f-angry,.nc[data-face="cry"] .f-cry,.nc[data-face="shy"] .f-shy,.nc[data-face="sleepy"] .f-sleepy{display:inline}
.nc .m-open{display:none}
.nc[data-talk="1"] .m-closed{display:none}
.nc[data-talk="1"] .m-open{display:inline}
.nc .eye{transform-box:fill-box;transform-origin:center;transition:transform .06s}
.nc[data-blink="1"] .eye{transform:scaleY(.1)}
.nc .bodygroup{transform-origin:60px 108px;animation:ncBreathe 3.4s ease-in-out infinite}
.nc .leaves{transform-origin:60px 34px;animation:ncSway 4.2s ease-in-out infinite}
@keyframes ncBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.972)}}
@keyframes ncSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}

/* ===== 森のすみか（背景は固定。水面・葉っぱ・ランタン・窓の灯りだけ うごく） ===== */
.room{background:#cfe3b8}
.room .deco{position:absolute;inset:0;overflow:hidden;border-radius:inherit}
.scene{position:absolute;left:0;bottom:0;width:100%;aspect-ratio:830/464;z-index:0}
.sv{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 3.2s ease,visibility 0s 3.2s}
.sv.on{z-index:2;opacity:1;visibility:visible;transition:opacity 3.2s ease,visibility 0s}

.fx-rain{position:absolute;inset:0;opacity:0;transition:opacity 3s;pointer-events:none;overflow:hidden;
  background-image:linear-gradient(100deg,transparent 46%,rgba(235,245,255,.55) 50%,transparent 54%),linear-gradient(100deg,transparent 47%,rgba(235,245,255,.35) 50%,transparent 53%);
  background-size:38px 90px,23px 70px;animation:rainFall .55s linear infinite}
@keyframes rainFall{from{background-position:0 0,0 0}to{background-position:-9px 90px,-6px 70px}}
.scene.is-rain .fx-rain{opacity:.55}
.fx-fly{position:absolute;inset:0;opacity:0;transition:opacity 3s;pointer-events:none}
.scene.is-night .fx-fly{opacity:1}
.fx-fly i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff6a8;box-shadow:0 0 8px 3px rgba(255,240,140,.75);animation:flyA 7s ease-in-out infinite}
.fx-fly i:nth-child(1){left:24%;top:62%}.fx-fly i:nth-child(2){left:34%;top:50%;animation-delay:-2s;animation-duration:9s}
.fx-fly i:nth-child(3){left:48%;top:70%;animation-delay:-4s}.fx-fly i:nth-child(4){left:62%;top:58%;animation-delay:-1s;animation-duration:8s}
.fx-fly i:nth-child(5){left:14%;top:44%;animation-delay:-5s;animation-duration:10s}.fx-fly i:nth-child(6){left:72%;top:76%;animation-delay:-3s}
.fx-fly i:nth-child(7){left:42%;top:40%;animation-delay:-6s;animation-duration:11s}
@keyframes flyA{0%,100%{transform:translate(0,0);opacity:.15}25%{transform:translate(14px,-10px);opacity:1}50%{transform:translate(4px,-22px);opacity:.3}75%{transform:translate(-12px,-8px);opacity:.95}}
.sc-base{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
.sp{position:absolute;height:auto;pointer-events:none;user-select:none;will-change:transform}
.sp-water{filter:url(#ripple)}
.glint{position:absolute;aspect-ratio:760/142;pointer-events:none;mix-blend-mode:screen;opacity:.65;
  background-image:radial-gradient(ellipse 10px 1.6px at 30% 40%,rgba(255,255,255,.95),transparent),radial-gradient(ellipse 7px 1.2px at 72% 72%,rgba(255,255,255,.85),transparent),radial-gradient(ellipse 5px 1px at 50% 18%,rgba(255,255,255,.8),transparent);
  background-size:74px 24px,57px 19px,91px 29px;animation:glintMove 16s linear infinite}
@keyframes glintMove{from{background-position:0 0,0 0,0 0}to{background-position:74px 4px,-57px -3px,91px 0}}
.lf-tl{transform-origin:0 0;animation:leafA 6.1s ease-in-out infinite}
.lf-tc{transform-origin:50% 0;animation:leafB 7.3s ease-in-out -2s infinite}
.lf-tr{transform-origin:100% 0;animation:leafA 8.3s ease-in-out -4s infinite}
.lf-br{transform-origin:100% 100%;animation:leafB 6.7s ease-in-out -1s infinite}
.lf-bl{transform-origin:0 100%;animation:leafA 7.7s ease-in-out -3s infinite}
@keyframes leafA{0%,100%{transform:rotate(0) translate(0,0)}30%{transform:rotate(.9deg) translate(1px,.5px)}58%{transform:rotate(-.55deg) translate(-.6px,0)}80%{transform:rotate(.35deg) translate(.4px,.3px)}}
@keyframes leafB{0%,100%{transform:rotate(0) translate(0,0)}25%{transform:rotate(-.8deg) translate(-.8px,.4px)}55%{transform:rotate(.7deg) translate(.8px,-.3px)}78%{transform:rotate(-.3deg) translate(0,.3px)}}
.sp-lantern{transform-origin:32% 10%;animation:lanternSwing 5.6s ease-in-out infinite,lanternFlick 3.1s ease-in-out infinite}
@keyframes lanternSwing{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
@keyframes lanternFlick{0%,100%{filter:brightness(1)}18%{filter:brightness(1.14)}33%{filter:brightness(.97)}52%{filter:brightness(1.2)}71%{filter:brightness(1.04)}86%{filter:brightness(1.12)}}
.sp-window{animation:winGlow 4.4s ease-in-out infinite}
@keyframes winGlow{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.16) saturate(1.1)}}
.halo{position:absolute;pointer-events:none;mix-blend-mode:screen;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,128,.62) 0,rgba(255,200,110,.22) 38%,transparent 68%)}
.halo-window{left:83%;top:19.8%;width:16.4%;aspect-ratio:1;animation:haloPulse 4.4s ease-in-out infinite}
.halo-lantern{left:56.4%;top:14.2%;width:12.6%;aspect-ratio:1;animation:haloFlick 3.1s ease-in-out infinite}
@keyframes haloPulse{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:.8;transform:scale(1.06)}}
@keyframes haloFlick{0%,100%{opacity:.55}18%{opacity:.95}33%{opacity:.45}52%{opacity:1}71%{opacity:.6}86%{opacity:.85}}

#artov{position:fixed;inset:0;z-index:75;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;cursor:pointer;
  background:radial-gradient(ellipse at 50% 45%,#faf3e3 0%,#f0e5cd 75%,#e8dabb 100%);opacity:0;pointer-events:none;transition:opacity .9s ease}

@keyframes artDot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.art-hint{font-size:11px;color:#a58f6c;letter-spacing:.1em}

      function loadData() {
        state.genres = GENRE_DEFS.slice();

        try {
          const savedWords = localStorage.getItem(STORAGE_KEYS.WORDS);
          state.words = savedWords ? JSON.parse(savedWords) : [];
        } catch (err) {
          state.words = [];
        }

        try {
          // むかしの しゃしん キャラは つかわない（はじめの子に そろえる）
          state.hadImage = !!localStorage.getItem(STORAGE_KEYS.IMAGE);
          localStorage.removeItem(STORAGE_KEYS.IMAGE);
        } catch (err) {
          state.hadImage = false;
        }
        state.characterImage = 'default';

        try {
          const savedName = localStorage.getItem(STORAGE_KEYS.CHAR_NAME);
          state.characterName = savedName ? savedName.trim() : 'んちょ';
        } catch (err) {
          state.characterName = 'んちょ';
        }

        state.words.forEach((w) => {
          w.usageCount = Number(w.usageCount) || 0;
          if (!w.lastUsedAt) w.lastUsedAt = null;
        });
        loadProgress();

        updateCharacterNameUI();
      }

      function levelForExp(exp) {
        let lv = 1;
        LEVEL_TABLE.forEach((need, i) => {
          if (exp >= need) lv = i + 1;
        });
        return lv;
      }

      function loadProgress() {
        let p = {};
        try {
          const raw = localStorage.getItem(STORAGE_KEYS.PROGRESS);
          p = raw ? JSON.parse(raw) : {};
        } catch (err) {
          p = {};
        }
        state.exp = Number(p.exp) || 0;
        state.level = Math.max(Number(p.level) || 1, levelForExp(state.exp));
        state.usedTopics = new Set(Array.isArray(p.usedTopics) ? p.usedTopics : []);
        state.everTaught = new Set(Array.isArray(p.everTaught) ? p.everTaught : []);
        state.pairHistory = Array.isArray(p.pairHistory) ? p.pairHistory : [];
        state.answers = Array.isArray(p.answers) ? p.answers : [];
        state.log = Array.isArray(p.log) ? p.log : [];
        state.words.forEach((w) => state.everTaught.add(w.text));
      }

      function saveProgress() {
        try {
          localStorage.setItem(
            STORAGE_KEYS.PROGRESS,
            JSON.stringify({
              level: state.level,
              exp: state.exp,
              usedTopics: Array.from(state.usedTopics),
              everTaught: Array.from(state.everTaught),
              pairHistory: state.pairHistory,
              answers: state.answers,
              log: state.log,
            })
          );
        } catch (err) {
          /* 保存できなくても、あそびは つづける */
        }
      }

      // ===== ジャンルの解放 =====
      function unlockedGenreIds() {
        const ids = new Set(GENRE_DEFS.filter((g) => g.level <= state.level).map((g) => g.id));
        state.words.forEach((w) => ids.add(w.genreId)); // すでに ことばが はいっている ジャンルは そのまま つかえる
        return ids;
      }

      function isGenreUnlocked(genreId) {
        return unlockedGenreIds().has(genreId);
      }

      // ===== 交流レベルと経験値 =====
      function updateLevelUI() {
        dom.levelLabel.textContent = `Lv.${state.level}`;
        if (state.level >= LEVEL_TABLE.length) {
          dom.levelBar.style.width = '100%';
          dom.levelNext.textContent = 'さいだいレベル';
          dom.levelHint.textContent = 'ぜんぶの ジャンルが ひらいたよ！';
          return;
        }
        const prev = LEVEL_TABLE[state.level - 1];
        const need = LEVEL_TABLE[state.level];
        const pct = Math.max(0, Math.min(100, ((state.exp - prev) / (need - prev)) * 100));
        dom.levelBar.style.width = `${pct}%`;
        dom.levelNext.textContent = `つぎまで あと ${need - state.exp}`;
        const nextGenres = GENRE_DEFS.filter((g) => g.level === state.level + 1).map((g) => g.label);
        dom.levelHint.textContent = `Lv.${state.level + 1} で 「${nextGenres.join('」「')}」が ひらくよ`;
      }

      function grantExp(kind) {
        const now = Date.now();
        if (now - (state.lastGrant[kind] || 0) < EXP_COOLDOWN_MS) return 0;
        state.lastGrant[kind] = now;

        const before = state.level;
        state.exp += EXP_REWARD[kind];
        state.log.push({ k: kind, at: now });
        if (state.log.length > 60) state.log.shift();

        state.level = Math.max(state.level, levelForExp(state.exp));
        saveProgress();
        updateLevelUI();
        if (state.level > before) {
          onLevelUp(before, state.level);
        }
        return EXP_REWARD[kind];
      }

      function onLevelUp(from, to) {
        const added = GENRE_DEFS.filter((g) => g.level > from && g.level <= to).map((g) => g.label);
        state.levelUpQueue = { from, to, added };
        renderGenreSelect();
        if (dom.wordbookModal.classList.contains('flex')) {
          renderWordbookFilterBar();
          renderWordbookList();
        }
        if (Math.random() < 0.6) setTimeout(showArt, 12000);
        dom.levelupNum.textContent = `Lv.${to}`;
        dom.levelupGenres.textContent = added.length > 0 ? `あたらしい グループ：${added.join('・')}` : '';
        dom.levelup.classList.remove('hidden');
        clearTimeout(state.levelupTimer);
        state.levelupTimer = setTimeout(() => dom.levelup.classList.add('hidden'), 5500);
      }

      // レベルアップの おはなしを した ときは true
      function maybeSpeakLevelUp() {
        const q = state.levelUpQueue;
        if (!q) return false;
        state.levelUpQueue = null;
        const second = q.added.length > 0
          ? `「${q.added.join('」「')}」の\u3000ことばも\u3000おしえて\u3000ほしいな。`
          : 'まだまだ\u3000いっしょに\u3000かんがえよう！';
        state.pending = null;
        speakDialogue({
          id: `levelup_${Date.now()}`,
          category: 'レベルアップ',
          sentences: [splitLineIntoChunks(pickRandomItem(LEVELUP_LINES)), splitLineIntoChunks(second)],
        });
        return true;
      }

      // イリスの質問・連想に、ことばで こたえた とき
      function consumePendingAnswer(word) {
        const pend = state.pending;
        if (!pend || (!pend.forever && Date.now() - pend.at > PENDING_WINDOW_MS)) {
          state.pending = null;
          return;
        }
        state.pending = null;
        if (pend.kind === 'ask') {
          grantExp('answer');
          state.answers.push({ q: pend.text, a: word, at: Date.now() });
          if (state.answers.length > 100) state.answers.shift();
        } else {
          grantExp('assoc');
        }
      }

      // イリスの問いかけを きいて、つぎの おはなしへ すすんだ とき
      function onUserContinue() {
        const pend = state.pending;
        if (!pend || state.isSpeaking) return;
        if (!pend.forever && Date.now() - pend.at > PENDING_WINDOW_MS) {
          state.pending = null;
          return;
        }
        state.pending = null;
        grantExp('continue');
      }

      // ===== げんが：なにかの ひょうしに でてくる、ローディングがめん風の いちまい =====
      const ART_LIST = ['main', 'rain', 'sprout', 'swim', 'forest', 'eraser', 'growth', 'king'];
      const ART_SEEN_KEY = 'iris_art_seen_v1';
      const ART_SHOW_MS = 7000;

      function pickArt() {
        let seen = [];
        try { seen = JSON.parse(localStorage.getItem(ART_SEEN_KEY) || '[]'); } catch (err) { seen = []; }
        let rest = ART_LIST.filter((a) => !seen.includes(a));
        if (rest.length === 0) { rest = ART_LIST.slice(); seen = []; }
        const a = rest[Math.floor(Math.random() * rest.length)];
        seen.push(a);
        try { localStorage.setItem(ART_SEEN_KEY, JSON.stringify(seen)); } catch (err) { /* ok */ }
        return a;
      }

      function artCanShow() {
        return state.phase === 'talk' && !state.artOn && !state.isSpeaking && !state.hold && !state.pending && !state.levelUpQueue
          && !userIsBusy() && dom.levelup.classList.contains('hidden');
      }

      function showArt() {
        if (!artCanShow()) return;
        state.artOn = true;
        const im = new Image();
        im.onload = () => {
          if (state.phase !== 'talk') { state.artOn = false; return; }
          stopAutoTimers();
          dom.artImg.src = im.src;
          dom.artov.classList.add('on');
          clearTimeout(state.artTimer);
          state.artTimer = setTimeout(closeArt, ART_SHOW_MS);
        };
        im.onerror = () => { state.artOn = false; };
        im.src = 'art/' + pickArt() + '.jpg';
      }

      function closeArt() {
        clearTimeout(state.artTimer);
        if (!dom.artov.classList.contains('on')) { state.artOn = false; return; }
        dom.artov.classList.remove('on');
        setTimeout(() => {
          state.artOn = false;
          if (state.phase === 'talk' && !state.isSpeaking) scheduleNextAutoSpeech();
        }, 1000);
      }

      function scheduleArtChecks() {
        // ときどき（2〜5分に いちど）、しずかな ときだけ
        setTimeout(() => {
          showArt();
          scheduleArtChecks();
        }, (120 + Math.random() * 180) * 1000);
      }

      // 背景は ぜんたいを うめる大きさで かため、見える はば（右がわの窓まで）を そろえる
      function layoutScene() {
        const stage = dom.characterStage;
        const w = stage.clientWidth, h = stage.clientHeight;
        if (!w || !h) return;
        const k = Math.max(w / 830, h / 464);
        const sw = 830 * k, sh = 464 * k;
        const f = w / sw;
        const L = Math.min(Math.max(0.93 - f, 0), Math.max(0, 1 - f));
        const sc = stage.querySelector('.scene');
        sc.style.width = sw + 'px';
        sc.style.height = sh + 'px';
        sc.style.left = (-L * sw) + 'px';
        sc.style.top = (h - sh) + 'px';
        sc.style.bottom = 'auto';
      }

      // ===== じかんに あわせて へんか（ひる・ゆうがた・よる・あめ） =====
      let sceneNow = '';
      function sceneByClock(d) {
        const m = d.getHours() * 60 + d.getMinutes();
        if (m >= 5 * 60 + 30 && m < 16 * 60) return 'day';
        if (m >= 16 * 60 && m < 18 * 60 + 30) return 'dusk';
        return 'night';
      }
      function setScene(name, instant) {
        if (name === sceneNow) return;
        const sc = document.querySelector('#room-decorations .scene');
        if (!sc) return;
        const prev = sceneNow;
        sceneNow = name;
        sc.querySelectorAll('.sv').forEach((el) => {
          const v = el.dataset.v;
          el.classList.remove('under');
          if (v === name) {
            if (instant) { el.style.transition = 'none'; requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = ''; })); }
            el.classList.add('on');
          }
          else if (v === prev && !instant) { el.classList.remove('on'); el.classList.add('under'); setTimeout(() => el.classList.remove('under'), 3400); }
          else el.classList.remove('on');
        });
        sc.classList.toggle('is-rain', name === 'rain');
        sc.classList.toggle('is-night', name === 'night');
      }
      function updateScene(instant) {
        let forced = '';
        try { forced = new URLSearchParams(location.search).get('scene') || ''; } catch (err) { forced = ''; }
        setScene(['day', 'dusk', 'night', 'rain'].includes(forced) ? forced : sceneByClock(new Date()), instant);
      }
      updateScene(true);
      setInterval(() => updateScene(false), 60000);

      // ===== はじまりの流れ：キャラづくり → なまえ → ナレーション → ねんね → 三日後 → かいわ =====
      const SLEEP_MS = 12000;
      const wait = (ms) => new Promise((res) => setTimeout(res, ms));

      function savePhase() {
        try {
          localStorage.setItem(STORAGE_KEYS.PHASE, JSON.stringify({ p: state.phase, t: state.sleepStart }));
        } catch (err) { /* ほぞんできなくても すすむ */ }
      }

      function loadPhase() {
        let saved = null;
        try {
          saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.PHASE) || 'null');
        } catch (err) { saved = null; }
        if (saved && ['setup', 'intro', 'sleep', 'talk'].includes(saved.p)) {
          state.phase = saved.p;
          state.sleepStart = Number(saved.t) || 0;
        } else {
          // いままで あそんでいた ひとは、そのまま かいわから
          state.phase = state.words.length > 0 || state.hadImage ? 'talk' : 'setup';
        }
      }

      function applyPhaseClass() {
        ['setup', 'intro', 'sleep', 'talk'].forEach((p) => document.body.classList.toggle('ph-' + p, state.phase === p));
      }

      function setPhase(ph) {
        state.phase = ph;
        applyPhaseClass();
        savePhase();
      }

      function showSetupStep() {
        dom.setup.classList.remove('hidden');
        dom.setupPreview.innerHTML = NC_SVG;
        dom.setupErr.textContent = '';
      }

      function decideName() {
        const name = dom.setupName.value.trim();
        if (!name) {
          dom.setupErr.textContent = 'なまえを いれてね。';
          return;
        }
        state.characterName = name;
        try { localStorage.setItem(STORAGE_KEYS.CHAR_NAME, name); } catch (err) { /* ok */ }
        updateCharacterNameUI();
        dom.setup.classList.add('hidden');
        dom.setupName.blur();
        setPhase('intro');
        runIntro();
      }

      function narrationLines() {
        const n = state.characterName;
        const sc = sceneNow || sceneByClock(new Date());
        const lightLine = sc === 'rain'
          ? 'まどの\u3000そとでは、\nあめが\u3000しとしと\u3000ふっています。'
          : sc === 'night'
          ? 'まどには、あたたかな\u3000あかりが、\nぽつんと\u3000ともっています。'
          : sc === 'dusk'
            ? 'ゆうやけの\u3000いろが、\nまどべを\u3000そめています。'
            : 'まどから\u3000やわらかな\u3000ひかりが、\nそっと\u3000さしこんでいます。';
        return [
          'ここは、ちいさな\u3000おへや。',
          lightLine,
          'そこに、ひとつの\u3000いのちが\u3000うまれました。',
          `なまえは、${n}。`,
          'まだ\u3000なにも\u3000しらない。\nことばも、まだ\u3000ありません。',
          `それでも\u3000${n}は、\nふわり\u3000ふわりと\u3000ただよい、`,
          'すこし\u3000ねむり、\nまた\u3000ふわり。',
          'そうして\u3000ときは、\nしずかに\u3000すぎてゆくのです……。',
        ];
      }

      async function runIntro() {
        const my = ++state.introRun;
        dom.intro.classList.add('on');
        await wait(1000);
        for (const line of narrationLines()) {
          if (state.introRun !== my) return;
          dom.introText.innerHTML = '';
          line.split('\n').forEach((part, i) => {
            if (i) dom.introText.appendChild(document.createElement('br'));
            dom.introText.appendChild(document.createTextNode(part));
          });
          dom.introText.classList.add('show');
          await new Promise((res) => {
            const t = setTimeout(res, 2400 + line.length * 120);
            state.introAdvance = () => { clearTimeout(t); res(); };
          });
          state.introAdvance = null;
          if (state.introRun !== my) return;
          dom.introText.classList.remove('show');
          await wait(1000);
        }
        if (state.introRun === my) finishIntro();
      }

      function finishIntro() {
        state.introRun++;
        state.introAdvance = null;
        dom.introText.classList.remove('show');
        dom.intro.classList.remove('on');
        state.sleepStart = Date.now();
        setPhase('sleep');
        beginSleepPhase(SLEEP_MS);
      }

      function spawnZzz() {
        ['Z', 'z', 'z'].forEach((ch, i) => {
          fxAdd(`<div class="mk q" style="min-width:0;width:auto;height:auto;background:none;box-shadow:none;font-size:${24 - i * 4}px;margin:-10px 0 0 -6px">${ch}</div>`, {
            x: 30 + i * 12, y: 0 - i * 8, dx: 14, dy: -28, d: i * 0.5, t: 2, s: 20,
          });
        });
      }

      function startNap() {
        if (state.napping) return;
        state.napping = true;
        state.walk.waitTimer = 5 + Math.random() * 3;
        dom.characterEmote.classList.add('napping');
        setFace('sleepy');
        spawnZzz();
        clearInterval(state.zzzTimer);
        state.zzzTimer = setInterval(spawnZzz, 2200);
      }

      function wakeUp() {
        state.napping = false;
        clearInterval(state.zzzTimer);
        state.zzzTimer = null;
        dom.characterEmote.classList.remove('napping');
        setFace('normal');
        dom.emoteFx.innerHTML = '';
      }

      function beginSleepPhase(remainMs) {
        clearTimeout(state.sleepTimer);
        state.sleepTimer = setTimeout(startBlackout, Math.max(1500, remainMs));
      }

      async function startBlackout() {
        clearTimeout(state.sleepTimer);
        state.sleepTimer = null;
        if (state.phase !== 'sleep') return;
        wakeUp();
        dom.blackout.classList.add('on');
        await wait(2000);
        dom.blackoutText.classList.add('show');
        await wait(3800);
        setPhase('talk');
        state.exhausted = false;
        dom.blackoutText.classList.remove('show');
        await wait(1200);
        dom.blackout.classList.remove('on');
        await wait(1500);
        triggerNextSpeech({ preferredTypes: ['あいさつ'] });
        setTimeout(showArt, 16000);
      }

      function skipPhase() {
        if (state.phase === 'intro') {
          finishIntro();
        } else if (state.phase === 'sleep') {
          startBlackout();
        }
      }

      function bindStartEvents() {
        dom.setupDecide.addEventListener('click', decideName);
        dom.setupName.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); decideName(); }
        });
        dom.intro.addEventListener('click', () => { if (state.introAdvance) state.introAdvance(); });
        dom.skipBtn.addEventListener('click', skipPhase);
        dom.artov.addEventListener('click', closeArt);
      }

      function startPhaseFlow() {
        applyPhaseClass();
        if (state.phase === 'setup') {
          showSetupStep();
        } else if (state.phase === 'intro') {
          runIntro();
        } else if (state.phase === 'sleep') {
          const elapsed = Date.now() - (state.sleepStart || Date.now());
          beginSleepPhase(SLEEP_MS - elapsed);
        }
      }

      // キーボードが出ても 1画面に おさまるように、見えている高さに あわせる
      function syncViewport() {
        const vv = window.visualViewport;
        const h = vv ? vv.height : window.innerHeight;
        document.documentElement.style.setProperty('--vvh', Math.round(h) + 'px');
        document.documentElement.style.setProperty('--vvt', vv ? Math.round(vv.offsetTop) + 'px' : '0px');
        document.body.classList.toggle('kb', h < 600);
      }

      function updateCharacterNameUI() {
        const name = state.characterName;
        dom.speechSpeakerLabel.textContent = name;
        document.title = 'WHERE WHICH';
        dom.teachTitleText.textContent = `${name}に ことばを おしえる`;
        dom.wordbookTitle.textContent = `${name}の ことばちょう`;
        dom.wordbookFooterHint.textContent = `おぼえた ことばは ${name}の おはなしにも でてくるよ。`;
      }

      function saveWords() {
        try {
          localStorage.setItem(STORAGE_KEYS.WORDS, JSON.stringify(state.words));
        } catch (err) {
          showFeedback('ほぞんする ばしょが いっぱいで ほぞん できませんでした。', true);
        }
      }

      function renderCharacterImage() {
        dom.characterMover.classList.remove('hidden');
        startCharacterWalkLoop();
      }

      function pickNextWalkTarget() {
        const stageWidth = dom.characterStage.clientWidth || 360;
        const maxOffsetX = Math.max(40, stageWidth / 2 - 68);
        state.walk.targetX = (Math.random() * 2 - 1) * maxOffsetX;
        state.walk.targetY = Math.random() * 22 - 10;
        state.walk.isMoving = true;
        if (state.phase === 'talk') {
          dom.characterSpriteInner.classList.remove('presence-float');
          dom.characterSpriteInner.classList.add('walk-bobbing');
        }
      }

      function updateWalkLoop(timestamp) {
        if (!state.characterImage) return;

        if (!state.walk.lastTime) {
          state.walk.lastTime = timestamp;
        }
        const dt = Math.min((timestamp - state.walk.lastTime) / 1000, 0.1);
        state.walk.lastTime = timestamp;

        if (state.walk.isMoving) {
          const dx = state.walk.targetX - state.walk.x;
          const dy = state.walk.targetY - state.walk.y;
          const dist = Math.hypot(dx, dy);
          const speed = 52;

          if (dist < 2) {
            state.walk.x = state.walk.targetX;
            state.walk.y = state.walk.targetY;
            state.walk.isMoving = false;
            state.walk.waitTimer = 1.4 + Math.random() * 2.4;
            dom.characterSpriteInner.classList.remove('walk-bobbing');
            dom.characterSpriteInner.classList.add('presence-float');
            if (state.phase === 'sleep' && Math.random() < 0.6) startNap();
          } else {
            state.walk.x += (dx / dist) * speed * dt;
            state.walk.y += (dy / dist) * speed * dt;
            if (Math.abs(dx) > 1.5) {
              state.walk.facingLeft = dx < 0;
            }
          }
        } else {
          state.walk.waitTimer -= dt;
          if (state.walk.waitTimer <= 0) {
            if (state.napping) wakeUp();
            pickNextWalkTarget();
          }
        }

        dom.characterMover.style.transform = `translate3d(calc(-50% + ${state.walk.x.toFixed(1)}px), ${state.walk.y.toFixed(1)}px, 0)`;
        dom.characterSvg.style.transform = state.walk.facingLeft ? 'scaleX(-1)' : 'scaleX(1)';

        state.walk.rafId = requestAnimationFrame(updateWalkLoop);
      }

      function startCharacterWalkLoop() {
        stopCharacterWalkLoop();
        state.walk.x = 0;
        state.walk.y = 0;
        state.walk.waitTimer = 0.7;
        state.walk.isMoving = false;
        state.walk.lastTime = 0;
        state.walk.rafId = requestAnimationFrame(updateWalkLoop);
      }

      function stopCharacterWalkLoop() {
        if (state.walk.rafId) {
          cancelAnimationFrame(state.walk.rafId);
          state.walk.rafId = null;
        }
      }

      function getGenreLabel(genreId) {
        const found = state.genres.find((g) => g.id === genreId);
        return found ? found.label : 'そのほか';
      }

      function splitLineIntoChunks(line) {
        const primaryParts = line
          .split(/(?<=[、。！？\s])/)
          .filter(Boolean);

        const chunks = [];
        primaryParts.forEach((part) => {
          if (part.length <= 8) {
            chunks.push(part);
            return;
          }
          const subParts = part
            .split(/(?<=……|って|を|に|が|は|の|も|と|で|から|まで|けど|より)/)
            .filter(Boolean);

          let buffer = '';
          subParts.forEach((sp) => {
            if ((buffer + sp).length <= 7) {
              buffer += sp;
            } else {
              if (buffer) chunks.push(buffer);
              buffer = sp;
            }
          });
          if (buffer) chunks.push(buffer);
        });

        return chunks.length > 0 ? chunks : [line];
      }

      function pickRandomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function hashStr(str) {
        let h = 5381;
        for (let i = 0; i < str.length; i++) {
          h = ((h << 5) + h + str.charCodeAt(i)) | 0;
        }
        return (h >>> 0).toString(36);
      }

      // ネタの目印。セリフのひな型 + 入った言葉。同じ目印は二度と使わない
      function topicKey(raw, words) {
        return hashStr(raw) + (words && words.length > 0 ? `|${words.join(',')}` : '');
      }

      function genresAffine(a, b) {
        return GENRE_AFFINITY.some((p) => (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a));
      }

      // 教えた言葉から、重ならないように n 個えらぶ（言葉の文字を返す）
      // 少なく使った言葉・さいきん使ってない言葉を優先。Lv.2からは ちがうジャンル・相性のよいジャンルを多めに
      function pickAssocWords(n) {
        const pool = state.words.slice();
        const recent = state.recentAssocWords;
        const weight = (w) => {
          let x = 1 / (1 + (w.usageCount || 0));
          if (recent.includes(w.text)) x *= 0.15;
          return x;
        };
        const pickWeighted = (arr) => {
          const ws = arr.map(weight);
          let r = Math.random() * ws.reduce((x, y) => x + y, 0);
          for (let i = 0; i < arr.length; i++) {
            r -= ws[i];
            if (r <= 0) return arr[i];
          }
          return arr[arr.length - 1];
        };

        let first;
        if (Math.random() < 0.3) {
          first = pool.reduce((a, b) => ((b.createdAt || 0) > (a.createdAt || 0) ? b : a)); // とうろくしたばかりの言葉
        } else {
          first = pickWeighted(pool);
        }
        const picked = [first];
        while (picked.length < n) {
          const remain = pool.filter((w) => !picked.includes(w));
          const aff = remain.filter((w) => genresAffine(first.genreId, w.genreId));
          const diff = remain.filter((w) => w.genreId !== first.genreId);
          const same = remain.filter((w) => w.genreId === first.genreId);
          let from = remain;
          if (state.level >= 2) {
            if (aff.length > 0 && Math.random() < 0.55) from = aff;
            else if (diff.length > 0 && Math.random() < 0.7) from = diff;
          } else if (same.length > 0 && Math.random() < 0.6) {
            from = same;
          }
          picked.push(pickWeighted(from));
        }
        return picked.map((w) => w.text);
      }

      // この候補に、まだ使っていない言葉の組み合わせがあるか。あれば {words, key, pairKey}
      function resolveCandidate(c, forceWord) {
        if (c.assoc) {
          for (let t = 0; t < 15; t++) {
            const words = pickAssocWords(c.needsThree ? 3 : 2);
            // 言葉が文に入らないセリフ（「このふたつ…」）は、言葉がちがっても二度は使わない
            // 文に入る言葉だけで ネタを数える（入らない言葉が ちがっても、同じ文は二度と使わない）
            const shown = ['{word_a}', '{word_b}', '{word_c}'].map((ph, i) => (c.rawLine.includes(ph) ? words[i] : null)).filter(Boolean);
            const key = topicKey(c.rawLine, shown);
            const pairKey = words.slice().sort().join('+');
            if (state.usedTopics.has(key)) continue;
            if (t < 10 && state.pairHistory.includes(pairKey)) continue; // 同じ組み合わせを すぐに くりかえさない
            return { words, key, pairKey };
          }
          // ランダムで見つからなかったら、言葉が少ないときは ぜんぶの組み合わせを しらべる
          const all = state.words.map((w) => w.text);
          if (all.length <= 30) {
            const n = c.needsThree ? 3 : 2;
            const combos = [];
            all.forEach((x) => all.forEach((y) => {
              if (y === x) return;
              if (n === 2) combos.push([x, y]);
              else all.forEach((z) => { if (z !== x && z !== y) combos.push([x, y, z]); });
            }));
            combos.sort(() => Math.random() - 0.5);
            for (const words of combos) {
              const shown = ['{word_a}', '{word_b}', '{word_c}'].map((ph, i) => (c.rawLine.includes(ph) ? words[i] : null)).filter(Boolean);
              const key = topicKey(c.rawLine, shown);
              if (!state.usedTopics.has(key)) return { words, key, pairKey: words.slice().sort().join('+') };
            }
          }
          return null;
        }
        if (c.needsWord) {
          const list = forceWord
            ? [forceWord]
            : state.words.map((w) => w.text).sort(() => Math.random() - 0.5);
          for (const w of list) {
            const key = topicKey(c.rawLine, [w]);
            if (!state.usedTopics.has(key)) return { words: [w], key };
          }
          return null;
        }
        const key = topicKey(c.rawLine, null);
        return state.usedTopics.has(key) ? null : { words: [], key };
      }

      // つぎの おはなしを つくる。はなせる ネタが ひとつも ないときは null
      function buildNextDialogue(options = {}) {
        const { preferredTypes = null, forceWord = null } = options;
        const hasWords = state.words.length > 0 || Boolean(forceWord);

        const candidates = [];
        DIALOGUE_DATA.dialogues.forEach((group, groupIdx) => {
          if (preferredTypes && !preferredTypes.includes(group.type)) {
            return;
          }
          // 「うん」「いいえ」への へんじは、ボタンを おしたときだけ
          if (group.replyOnly && !preferredTypes) {
            return;
          }
          // レベルが たりないグループは まだ出ない
          if (state.level < (GROUP_LEVEL[group.type] || 1)) {
            return;
          }
          // 連想系は、教えた言葉が2つ以上あるときだけ
          if (group.assoc && state.words.length < 2) {
            return;
          }

          group.lines.forEach((rawLine, lineIdx) => {
            const needsWord = rawLine.includes('{word}');
            if (needsWord && !hasWords) {
              return;
            }
            // 3つの言葉を使う連想（{word_c}、「みっつ」）は、Lv.4から。言葉が3つ以上あるときだけ
            const needsThree = group.assoc === true && (rawLine.includes('{word_c}') || rawLine.includes('みっつ'));
            if (needsThree && (state.words.length < 3 || state.level < THREE_WORDS_LEVEL)) {
              return;
            }

            candidates.push({
              baseId: `${groupIdx}_${lineIdx}`,
              type: group.type,
              rawLine,
              needsWord,
              ask: group.ask === true,
              assoc: group.assoc === true,
              needsThree,
            });
          });
        });

        let filtered = candidates.filter((c) => !state.recentSpeechIds.includes(c.baseId));
        if (filtered.length === 0) {
          filtered = candidates;
        }

        if (!preferredTypes && state.recentCategories.length > 0) {
          const diffCat = filtered.filter((c) => !state.recentCategories.includes(c.type));
          if (diffCat.length > 0) {
            filtered = diffCat;
          }
        }

        // 連想系は約20%、ユーザーへの質問は残りのうち約35%で混ぜる
        if (!preferredTypes) {
          const assocs = filtered.filter((c) => c.assoc);
          const rest = filtered.filter((c) => !c.assoc);
          if (assocs.length > 0 && rest.length > 0) {
            filtered = Math.random() < 0.2 ? assocs : rest;
          }
          if (!filtered.some((c) => c.assoc)) {
            const asks = filtered.filter((c) => c.ask);
            const others = filtered.filter((c) => !c.ask);
            if (asks.length > 0 && others.length > 0) {
              filtered = Math.random() < 0.35 ? asks : others;
            }
          }
        }

        // 候補を順に ためして、まだ使ってない ネタを見つける（二度と同じネタは使わない）
        const preferWord = hasWords && (Boolean(forceWord) || Math.random() < 0.45);
        const tried = new Set();
        let pool = filtered;
        let chosen = null;
        let resolved = null;
        for (let guard = 0; guard < 2000; guard++) {
          const avail = pool.filter((c) => !tried.has(c));
          if (avail.length === 0) {
            if (pool !== candidates) {
              pool = candidates;
              continue;
            }
            break;
          }
          const wordAvail = avail.filter((c) => c.needsWord);
          const c = preferWord && wordAvail.length > 0 ? pickRandomItem(wordAvail) : pickRandomItem(avail);
          tried.add(c);
          const r = resolveCandidate(c, forceWord);
          if (r) {
            chosen = c;
            resolved = r;
            break;
          }
        }
        if (!chosen) {
          return null;
        }

        state.usedTopics.add(resolved.key);
        state.recentSpeechIds.push(chosen.baseId);
        if (state.recentSpeechIds.length > 14) {
          state.recentSpeechIds.shift();
        }
        state.recentCategories.push(chosen.type);
        if (state.recentCategories.length > 2) {
          state.recentCategories.shift();
        }

        // つかった言葉の記録
        const now = Date.now();
        resolved.words.forEach((t) => {
          const w = state.words.find((x) => x.text === t);
          if (w) {
            w.usageCount = (w.usageCount || 0) + 1;
            w.lastUsedAt = now;
          }
        });
        if (chosen.assoc) {
          state.pairHistory.push(resolved.pairKey);
          if (state.pairHistory.length > 10) state.pairHistory.shift();
          state.recentAssocWords = resolved.words.slice();
        }

        let finalLine = chosen.rawLine;
        const sentences = [];
        if (chosen.assoc) {
          const [wa, wb, wc] = resolved.words;
          // 言葉が入らないセリフは、先にどの言葉の話かを見せる
          if (!chosen.rawLine.includes('{word_a}')) {
            sentences.push(splitLineIntoChunks(resolved.words.join('、') + '。'));
          }
          finalLine = finalLine
            .replace(/\{word_a\}/g, wa)
            .replace(/\{word_b\}/g, wb)
            .replace(/\{word_c\}/g, wc || '');
        } else if (chosen.needsWord) {
          finalLine = finalLine.replace(/\{word\}/g, resolved.words[0]);
        }
        sentences.push(splitLineIntoChunks(finalLine));

        // へんじを まつ しつもん（質問・連想で、？で おわるもの）。「うん」「いいえ」で こたえられるものは ボタンも出す
        const isQuestion = (chosen.ask || chosen.assoc) && /[？?]\s*$/.test(finalLine);
        const isYesNo = isQuestion && !/(なあに|なに|どんな|どこ|いつ|だれ|どう|どちら|どっち|どれ|いくつ|どの|なぜ)/.test(finalLine);

        if (!forceWord && !isQuestion && Math.random() < 0.25) {
          const followUpTypes = ['ひとりごと', 'かんがえる', 'しつもん', 'きぶん'];
          const followGroup = DIALOGUE_DATA.dialogues.find(
            (g) => g.type === pickRandomItem(followUpTypes)
          );
          if (followGroup) {
            const safeFollowLines = followGroup.lines.filter(
              (l) => !l.includes('{word}') && l !== chosen.rawLine && !state.usedTopics.has(topicKey(l, null))
            );
            if (safeFollowLines.length > 0) {
              const fl = pickRandomItem(safeFollowLines);
              state.usedTopics.add(topicKey(fl, null));
              sentences.push(splitLineIntoChunks(fl));
            }
          }
        }

        saveWords();
        saveProgress();
        updateTopicCount();

        return {
          id: `${chosen.baseId}_${Date.now()}`,
          category: chosen.type,
          ask: chosen.ask,
          assoc: chosen.assoc,
          text: finalLine,
          question: isQuestion,
          yesNo: isYesNo,
          sentences,
        };
      }

      function updateTopicCount() {
        dom.topicCount.textContent = `はなした ネタ：${state.usedTopics.size}こ`;
      }

      function clearChunkTimers() {
        state.chunkTimers.forEach((id) => clearTimeout(id));
        state.chunkTimers = [];
      }

      function finishSpeakingImmediately() {
        if (!state.isSpeaking) return;
        clearChunkTimers();
        state.isSpeaking = false;

        dom.speechText.innerHTML = '';
        state.currentSentences.forEach((chunks, sIdx) => {
          const p = document.createElement('p');
          chunks.forEach((chunkText) => {
            const span = document.createElement('span');
            span.textContent = chunkText;
            p.appendChild(span);
          });
          dom.speechText.appendChild(p);
        });

        dom.statusText.textContent = state.autoPlayEnabled ? 'かんがえちゅう…' : 'おやすみちゅう';
        dom.speechHintText.textContent = 'おすと つぎへ すすむよ';
        scheduleNextAutoSpeech();
      }

      // ===== へんじを まつ（すぐ つぎの話題へ いかない） =====
      function releaseHold() {
        clearTimeout(state.holdTimer);
        state.holdTimer = null;
        state.hold = false;
        dom.quick.classList.add('hidden');
        dom.qrWait.classList.remove('on');
        dom.qrWait.textContent = 'ちょっと まって';
      }

      function startHold(yesNo) {
        state.hold = true;
        dom.qrYes.classList.toggle('hidden', !yesNo);
        dom.qrNo.classList.toggle('hidden', !yesNo);
        dom.quick.classList.remove('hidden');
        clearTimeout(state.holdTimer);
        state.holdTimer = setTimeout(() => {
          // ずっと へんじが なければ、またひとりごとに もどる
          state.hold = false;
          dom.quick.classList.add('hidden');
          if (!state.isSpeaking) {
            dom.statusText.textContent = 'かんがえちゅう…';
            dom.speechHintText.textContent = 'おすと つぎへ すすむよ';
            scheduleNextAutoSpeech();
          }
        }, HOLD_MS);
      }

      function onQuickReply(kind) {
        if (kind === 'wait') {
          // 「ちょっと まって」：へんじが くるまで、いつまでも まつ
          clearTimeout(state.holdTimer);
          state.holdTimer = null;
          state.hold = true;
          if (state.pending) state.pending.forever = true;
          dom.qrWait.classList.add('on');
          dom.qrWait.textContent = 'まってるよ';
          dom.statusText.textContent = 'へんじを まってるよ';
          dom.speechHintText.textContent = 'ゆっくりで いいよ。こたえられるように なったら おしえてね';
          return;
        }
        const reply = kind === 'yes' ? 'うん' : 'いいえ';
        consumePendingAnswer(reply);
        if (!maybeSpeakLevelUp()) {
          triggerNextSpeech({ preferredTypes: [kind === 'yes' ? 'うんへのへんじ' : 'いいえへのへんじ'] });
        }
      }

      // ことばを うちこんでいる ときは、つぎの おはなしへ すすまない
      function userIsBusy() {
        const typingRecently = Date.now() - (state.lastTypedAt || 0) < TYPING_GRACE_MS;
        if (dom.inputWord.value.trim() !== '') return true;
        if (document.activeElement === dom.inputWord && typingRecently) return true;
        return dom.wordbookModal.classList.contains('flex');
      }
