const key=(a,b)=>[a,b].sort().join('|');

// pin ids: photos 'p:X', points 'm:N', route nodes 'n:X'
function pid(st,x,first){
  if(st.type==='match') return (first?'p:':'m:')+x;

/* ---------- audio ---------- */
let ac=null, bgm=null, sndOn=true;
try{ sndOn = localStorage.getItem('redline_snd')!=='0'; }catch(e){}
function initAudio(){
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){}
  if(!bgm && BGM.length>100){ bgm=new Audio(BGM); bgm.loop=true; bgm.volume=.45; }
  if(bgm && sndOn) bgm.play().catch(()=>{});
}
function blip(f,d,type,g){ if(!ac||!sndOn) return; try{
  const o=ac.createOscillator(), v=ac.createGain(); o.type=type||'triangle'; o.frequency.value=f;
  v.gain.setValueAtTime(g||.12,ac.currentTime); v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
  o.connect(v).connect(ac.destination); o.start(); o.stop(ac.currentTime+d);}catch(e){} }
function snap(){ if(!ac||!sndOn) return; try{
  const n=ac.sampleRate*.06, b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain(); f.type='bandpass'; f.frequency.value=1800; g.gain.value=.5;
  s.buffer=b; s.connect(f).connect(g).connect(ac.destination); s.start(); }catch(e){} }
function chord(){ [392,494,587,784].forEach((f,i)=>setTimeout(()=>blip(f,.9,'sine',.09),i*90)); }

function el(t,a,p){const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e;}
function dims(){ const r=sv.getBoundingClientRect(); const portrait=r.height>r.width*1.05;
  return portrait?{W:600,H:Math.max(760,Math.round(600*r.height/r.width)),portrait}:{W:1000,H:Math.max(520,Math.round(1000*r.height/r.width)),portrait}; }

   '<filter id="fz2" x="-5%" y="-30%" width="110%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation=".35"/></filter>'+

   '<radialGradient id="pgOff" cx="35%" cy="30%"><stop offset="0" stop-color="#f3f3f3"/><stop offset=".5" stop-color="#bdbdbd"/><stop offset="1" stop-color="#6e6e6e"/></radialGradient>';
  const gDeco=el('g',{},sv), gItems=el('g',{},sv), gStr=el('g',{},sv), gPins=el('g',{},sv), gTmp=el('g',{},sv);
  const pins={}; const top=portrait?60:56;
  const iconAt=(g,name,x,y,s,color)=>{const u=el('g',{transform:`translate(${x},${y}) scale(${s/24})`,style:'color:'+(color||'#2b2b2b')},g); u.innerHTML=ICON[name];};

  function photo(p,x,y,w,h,tilt){
    const g=el('g',{transform:`rotate(${tilt} ${x+w/2} ${y+h/2})`,filter:'url(#sh)','data-zoom':p.img||'','data-zts':p.ts||'',style:p.img?'cursor:zoom-in':''},gItems);
    const pad=7, ext=p.ts?24:16;
    el('rect',{x:x-pad,y:y-pad,width:w+pad*2,height:h+pad+ext,fill:'#f4f1ea',rx:1.5},g);
    if(p.img&&IMG[p.img]){ el('image',{href:IMG[p.img],x,y,width:w,height:h,preserveAspectRatio:'xMidYMid slice'},g); }
    else{ el('rect',{x,y,width:w,height:h,fill:'#3b3a37'},g);
      const n=p.feat.length, s=Math.min(h*.62,w/(n+.6)); p.feat.forEach((f,i)=>iconAt(g,f,x+w/2+(i-(n-1)/2)*s*1.15-s/2,y+h/2-s/2,s,'#e9e4d8'));
      el('text',{x:x+w-6,y:y+h-6,'text-anchor':'end','font-size':9,fill:'#9a958a','letter-spacing':'.1em'},g).textContent='SKETCH';
    }
    if(p.ts){ const t=el('text',{x:x+w/2,y:y+h+16,'text-anchor':'middle','font-size':Math.max(14,w*.085),'font-weight':700,fill:'#1d1d1d',
        'font-family':'ui-monospace,Menlo,Consolas,"Courier New",monospace','letter-spacing':'.06em'},g); t.textContent=p.ts; }
    el('text',{x:x-pad+5,y:y+h+ext-4,'font-size':10,fill:'#8a8378','font-weight':700},g).textContent=p.id;
    return {x:x+w/2,y:y-pad+2};
  }
  function mapPaper(x,y,w,h){
    const g=el('g',{filter:'url(#sh)'},gDeco);
    el('rect',{x,y,width:w,height:h,fill:'#ede3cc',stroke:'#cdbf9f'},g);
    for(let i=1;i<6;i++){ el('line',{x1:x+w*i/6,y1:y,x2:x+w*i/6,y2:y+h,stroke:'#d8cba9','stroke-width':.8},g); el('line',{x1:x,y1:y+h*i/6,x2:x+w,y2:y+h*i/6,stroke:'#d8cba9','stroke-width':.8},g); }
    el('path',{d:`M${x+w*.05} ${y+h*.4} C ${x+w*.3} ${y+h*.3}, ${x+w*.45} ${y+h*.65}, ${x+w*.95} ${y+h*.55}`,fill:'none',stroke:'#c9d6dd','stroke-width':10,opacity:.7},g);
    return g;
  }
  function pinAt(id,x,y,label){
    const g=el('g',{class:'pin','data-pin':id},gPins);
    el('ellipse',{cx:x+3,cy:y+5,rx:7,ry:4,fill:'rgba(0,0,0,.22)'},g);
    el('circle',{cx:x,cy:y,r:10,class:'ring'},g);
    el('circle',{cx:x,cy:y,r:8.5,fill:'url(#pgOff)',class:'head'},g);
    if(label){ el('text',{x,y:y-14,'text-anchor':'middle','font-size':15,'font-weight':800,fill:'#2b2b2b'},g).textContent=label; }
    el('circle',{cx:x,cy:y,r:24,fill:'transparent','data-pin':id},g);
    pins[id]={x,y,g};
  }

  if(st.type==='match'){
    const n=st.photos.length;
    let pa,ma;
    if(portrait){ pa={x:24,y:top,w:W-48,h:(H-top)*.42}; ma={x:30,y:top+(H-top)*.47,w:W-60,h:(H-top)*.5}; }
    else{ pa={x:30,y:top,w:W*.46,h:H-top-24}; ma={x:W*.52,y:top,w:W*.45,h:H-top-24}; }
    const cols=portrait?(n<=3?n:3):(n<=3?1:2), rows=Math.ceil(n/cols);
    const cw=pa.w/cols, ch=pa.h/rows;
    let pw=Math.min(cw-30,(ch-34)*1.75), ph=pw/1.75;
    st.photos.forEach((p,i)=>{ const c=i%cols,r=Math.floor(i/cols);
      const rowN=Math.min(cols,n-r*cols), off=(cols-rowN)*cw/2;
      const x=pa.x+off+c*cw+(cw-pw)/2, y=pa.y+r*ch+(ch-ph)/2+4;
      const tilt=((i*37)%7-3)*.9; const pp=photo(p,x,y,pw,ph,tilt); pinAt('p:'+p.id,pp.x,pp.y); });
    const mg=mapPaper(ma.x,ma.y,ma.w,ma.h);
    st.points.forEach(q=>{ const x=ma.x+ma.w*(.08+.84*q.nx), y=ma.y+ma.h*(.1+.8*q.ny);
      el('circle',{cx:x,cy:y,r:15,fill:'#fff8e6',stroke:'#7a6a4a','stroke-width':1.5},mg);
      const s=26, n2=q.feat.length; const bx=x+20, by=y-s/2, bw=n2*(s+4)+6;
      const fx=(bx+bw>ma.x+ma.w-6)?x-20-bw:bx;
      el('rect',{x:fx,y:by-3,width:bw,height:s+6,rx:4,fill:'rgba(255,255,255,.75)',stroke:'#b9a983'},mg);
      q.feat.forEach((f,i)=>iconAt(mg,f,fx+5+i*(s+4),by,s));
      pinAt('m:'+q.id,x,y,q.id); });
  }
  else if(st.type==='chain'){
    const pw=portrait?W*.36:W*.2, ph=pw/1.6;
    st.photos.forEach((p,i)=>{
      let nx=p.nx, ny=p.ny; if(portrait){ const P=[[.04,.0],[.62,.17],[.3,.4],[.03,.64],[.64,.82]][i]; nx=P[0]; ny=P[1]; }
      const x=20+(W-40-pw)*nx, y=top+(H-top-ph-50)*ny; const tilt=((i*53)%9-4)*.8;
      const pp=photo(p,x,y,pw,ph,tilt); pinAt('p:'+p.id,pp.x,pp.y); });
  }
  else{
    const ma=portrait?{x:24,y:top+10,w:W-48,h:H-top-40}:{x:40,y:top+6,w:W-80,h:H-top-30};
    const mg=mapPaper(ma.x,ma.y,ma.w,ma.h);
    const P={}; st.nodes.forEach(nd=>{ let nx=nd.nx, ny=nd.ny; if(portrait){ [nx,ny]=[ny, nd.nx]; }
      P[nd.id]={x:ma.x+ma.w*(.07+.86*nx), y:ma.y+ma.h*(.07+.86*ny)}; });
    st.roads.forEach(r=>{ const [a,b]=r.split('-'); el('line',{x1:P[a].x,y1:P[a].y,x2:P[b].x,y2:P[b].y,stroke:'#9b9282','stroke-width':16,'stroke-linecap':'round'},mg);
      el('line',{x1:P[a].x,y1:P[a].y,x2:P[b].x,y2:P[b].y,stroke:'#f3ecdc','stroke-width':11,'stroke-linecap':'round'},mg); });

      if(s) el('text',{x:P[nd.id].x,y:P[nd.id].y+5,'text-anchor':'middle','font-size':14,'font-weight':800,fill:'#fff'},mg).textContent=nd.id;
      pinAt('n:'+nd.id,P[nd.id].x,P[nd.id].y,s?null:nd.id); });
  }

/* ---------- strings ---------- */
function curve(a,b){ const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, d=Math.hypot(b.x-a.x,b.y-a.y); return `M${a.x} ${a.y} Q ${mx} ${my+Math.min(46,10+d*.1)} ${b.x} ${b.y}`; }
function yarn(g,d,flash){
  const k=Math.max(1,layout.W/Math.max(1,sv.clientWidth))*1.3, w=n=>+(n*k).toFixed(2), da=(x,y)=>w(x)+' '+w(y);
  el('path',{d,fill:'none',stroke:'rgba(0,0,0,.2)','stroke-width':w(5),'stroke-linecap':'round',transform:`translate(${w(2.5)},${w(4)})`,filter:'url(#fz)'},g);
  el('path',{d,fill:'none',stroke:flash?'#ff6a5c':'#d4574c','stroke-width':w(7.2),'stroke-linecap':'round',opacity:.42,filter:'url(#fz2)'},g);
  el('path',{d,fill:'none',stroke:flash?'#e8392c':'#a81e17','stroke-width':w(4.6),'stroke-linecap':'round',filter:'url(#fz)'},g);
  el('path',{d,fill:'none',stroke:'#5e0d09','stroke-width':w(4.4),'stroke-dasharray':da(1.3,3.1),opacity:.55,filter:'url(#fz)'},g);
  el('path',{d,fill:'none',stroke:'#f08a7e','stroke-width':w(3.6),'stroke-dasharray':da(1.6,2.8),'stroke-dashoffset':w(2.2),opacity:.7,filter:'url(#fz)'},g);
  el('path',{d,fill:'none',stroke:'#ffd2ca','stroke-width':w(1),'stroke-dasharray':da(1,5.4),'stroke-dashoffset':w(1),'stroke-linecap':'round',opacity:.55,transform:`translate(0,${-w(1.2)})`},g);
}
function drawLinks(flash){
  const {pins,gStr}=layout; gStr.innerHTML='';
  links.forEach(k=>{ const [a,b]=k.split('|'); if(!pins[a]||!pins[b]) return; const d=curve(pins[a],pins[b]);
    yarn(gStr,d,flash);
    el('path',{d,fill:'none',stroke:'transparent','stroke-width':22,'data-link':k,style:'cursor:pointer'},gStr);
  });
  const deg=degrees();
  for(const id in pins){ const h=pins[id].g.querySelector('.head'); h.setAttribute('fill',deg[id]?'url(#pg)':'url(#pgOff)');
    h.setAttribute('r',sel===id?11:8.5); h.setAttribute('stroke',sel===id?'#ffcc33':'none'); h.setAttribute('stroke-width',3); }
  tutorial();
}
function tutorial(){
  const hn=document.getElementById('hint');
  for(const id in layout.pins){ const r=layout.pins[id].g.querySelector('.ring'); if(r) r.classList.remove('on'); }
  if(si!==0||solved){ return; }
  const d=degrees(), has=links.length>0; let on=[], b, t;
  if(sel&&sel[0]==='p'){ b='② 同じ場所の地図のピンをタップ'; t='その写真に写っている場所を、下の地図から選ぶ。（もう一度タップで選択を取り消し）'; on=Object.keys(layout.pins).filter(i=>i[0]==='m'&&!d[i]); }
  else if(sel){ b='② 同じ場所の写真のピンをタップ'; t='この場所が写っている写真を選ぶ。'; on=Object.keys(layout.pins).filter(i=>i[0]==='p'&&!d[i]); }
  else if(!has){ b='操作の練習：糸をつなぐ'; t='① 光っている写真のピンをタップ → ② 同じ場所の地図のピンをタップ。ドラッグでつないでもOK。写真は触ると拡大できる。'; on=Object.keys(layout.pins).filter(i=>i[0]==='p'); }
  else { b='その調子。ぜんぶの写真をつなごう'; t='間違えた糸は、糸をタップすると外せる。つなぎ直すときは、もう一度ピンから。'; on=Object.keys(layout.pins).filter(i=>i[0]==='p'&&!d[i]); }
  on.forEach(i=>layout.pins[i].g.querySelector('.ring').classList.add('on'));
  hn.className='tut'; hn.innerHTML='<b>'+b+'</b>'+t;
}
function degrees(){ const d={}; links.forEach(k=>k.split('|').forEach(x=>d[x]=(d[x]||0)+1)); return d; }
function maxDeg(st,id){ if(st.type==='match') return 1; if(st.type==='chain') return 2; return (id==='n:S'||id==='n:T')?1:2; }
function allowed(st,a,b){
  if(a===b) return false;
  if(st.type==='match') return a[0]!==b[0];
  if(st.type==='route') return st.roads.some(r=>{const [x,y]=r.split('-'); return key('n:'+x,'n:'+y)===key(a,b);});
  return true;
}
function reject(){ blip(140,.18,'square',.06); const b=document.getElementById('board'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
function connect(a,b){
  const st=STAGES[si]; if(solved) return;
  if(!allowed(st,a,b)){ reject(); return; }
  const k=key(a,b);
  if(links.includes(k)){ links=links.filter(x=>x!==k); blip(300,.12); drawLinks(); return; }
  const d=degrees();
  if(st.type==='match'){ // 1:1 — replace an existing link
    links=links.filter(x=>{const [p,q]=x.split('|'); return p!==a&&q!==a&&p!==b&&q!==b;});
  } else if((d[a]||0)>=maxDeg(st,a)||(d[b]||0)>=maxDeg(st,b)){ reject(); return; }
  links.push(k); snap(); drawLinks(); check();
}
function check(){
  const st=STAGES[si]; const ans=normAns(st); const cur=[...links].sort();
  if(ans.length===cur.length && ans.every((x,i)=>x===cur[i])){
    solved=true; if(!save.done.includes(si)) save.done.push(si); save.cur=Math.min(si+1,STAGES.length-1); persist();
    let n=0; const iv=setInterval(()=>{drawLinks(n%2===0); if(++n>5){clearInterval(iv); drawLinks();}},120);
    chord(); setTimeout(()=>{ const last=si===STAGES.length-1;
      document.getElementById('stamp').textContent=last&&save.done.length===STAGES.length?'ALL CASES CLOSED':'CASE CLOSED';
      document.getElementById('bNext').textContent='NEXT ▶';
      document.getElementById('clear').classList.add('on'); },700);
  } else {
    // all pins used but wrong → brief dim pulse
    const st2=STAGES[si], d=degrees(); const full=Object.keys(layout.pins).every(id=>(d[id]||0)>=1);
    if(full && cur.length>=ans.length){ blip(180,.25,'sine',.05); }
  }
}

/* ---------- input ---------- */
function svgPt(e){ const p=sv.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(sv.getScreenCTM().inverse()); }
function pinFrom(e){ const t=document.elementFromPoint(e.clientX,e.clientY); const g=t&&t.closest&&t.closest('[data-pin]'); return g?g.getAttribute('data-pin'):null; }
let down=null;
let zd=null;
function openZoom(g){ const k=g.getAttribute('data-zoom'); if(!k||!IMG[k]) return; document.getElementById('zimg').src=IMG[k]; document.getElementById('zcap').textContent=g.getAttribute('data-zts')||''; document.getElementById('zoom').classList.add('on'); blip(520,.05,'sine',.04); }
function closeZoom(){ document.getElementById('zoom').classList.remove('on'); }
document.getElementById('zoom').addEventListener('click',closeZoom);
window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeZoom(); });
sv.addEventListener('pointerdown',e=>{
  zd=null; { let zg=e.target.closest&&e.target.closest('[data-zoom]'); if(!zg&&solved){ const hit=document.elementsFromPoint(e.clientX,e.clientY).find(n=>n.closest&&n.closest('[data-zoom]')); if(hit) zg=hit.closest('[data-zoom]'); } if(zg&&zg.getAttribute('data-zoom')&&!pinFrom(e)&&(solved||!(e.target.getAttribute&&e.target.getAttribute('data-link')))) zd={g:zg,x:e.clientX,y:e.clientY}; }
  if(solved) return;
  const lk=e.target.getAttribute&&e.target.getAttribute('data-link');
  const id=pinFrom(e);
  if(!id && lk){ links=links.filter(x=>x!==lk); blip(300,.12); sel=null; drawLinks(); return; }
  if(!id){ sel=null; drawLinks(); return; }
  down={id,x:e.clientX,y:e.clientY,drag:false}; sv.setPointerCapture(e.pointerId);
});
sv.addEventListener('pointermove',e=>{
  if(!down) return;
  if(!down.drag && Math.hypot(e.clientX-down.x,e.clientY-down.y)>10) down.drag=true;
  if(down.drag){ const a=layout.pins[down.id], p=svgPt(e); layout.gTmp.innerHTML='';
    el('path',{d:curve(a,p),fill:'none',stroke:'#b3261e','stroke-width':4,'stroke-linecap':'round','stroke-dasharray':'1.4 5',opacity:.85},layout.gTmp); }
});
sv.addEventListener('pointerup',e=>{
  if(zd&&!down){ const z=zd; zd=null; if(Math.hypot(e.clientX-z.x,e.clientY-z.y)<10) openZoom(z.g); return; }
  if(!down) return; const st=down; down=null; layout.gTmp.innerHTML='';
  const tgt=pinFrom(e);
  if(st.drag){ if(tgt && tgt!==st.id) connect(st.id,tgt); sel=null; drawLinks(); return; }
  if(sel===null){ sel=st.id; blip(660,.06,'sine',.05); drawLinks(); }
  else if(sel===st.id){ sel=null; drawLinks(); }
  else { const a=sel; sel=null; connect(a,st.id); drawLinks(); }
});
sv.addEventListener('pointercancel',()=>{down=null; layout&&(layout.gTmp.innerHTML='');});

/* ---------- ui ---------- */
function renderDots(){ const d=document.getElementById('dots'); d.innerHTML='';
  STAGES.forEach((s,i)=>{ const b=document.createElement('i'); b.className=(save.done.includes(i)?'done ':'')+(i===si?'cur':''); b.title='CASE '+(i+1);
    b.onclick=()=>go(i); d.appendChild(b); }); }
function go(i){ si=i; links=[]; sel=null; solved=false; save.cur=i; persist(); document.getElementById('clear').classList.remove('on'); build(); }
document.getElementById('bNext').onclick=()=>{ if(si===STAGES.length-1) ending(); else go(si+1); };
/* ---------- ending: 続きは、これから → 写真 → さすがにこのクオリティは無理 → タイトル ---------- */
let endT=[], endStep=0;
function ending(){
  const E=document.getElementById('ending'), I=document.getElementById('endImg'), A=document.getElementById('endA'), B=document.getElementById('endB');
  document.getElementById('clear').classList.remove('on');
  if(END_IMG.length>100) I.src=END_IMG;
  [I,A,B].forEach(x=>x.classList.remove('on')); A.classList.remove('up'); E.classList.add('on'); endStep=0;
  const at=(ms,fn)=>endT.push(setTimeout(fn,ms));
  endT.forEach(clearTimeout); endT=[];
  at(400,()=>{A.classList.add('on'); endStep=1;});
  at(3000,()=>{A.classList.add('up'); I.classList.add('on'); endStep=2;});
  at(7500,()=>{B.classList.add('on'); endStep=3;});
  at(11500,endToTitle);
}
function endToTitle(){
  endT.forEach(clearTimeout); endT=[];
  document.getElementById('ending').classList.remove('on');
  go(0); document.getElementById('title').style.display='flex';
}
document.getElementById('ending').addEventListener('click',()=>{
  // タップで早送り（各段階を1つ進める）
  const I=document.getElementById('endImg'), A=document.getElementById('endA'), B=document.getElementById('endB');
  endT.forEach(clearTimeout); endT=[];
  if(endStep<=1){ A.classList.add('on','up'); I.classList.add('on'); endStep=2; endT.push(setTimeout(()=>{B.classList.add('on'); endStep=3; endT.push(setTimeout(endToTitle,4000));},4500)); }
  else if(endStep===2){ B.classList.add('on'); endStep=3; endT.push(setTimeout(endToTitle,4000)); }
  else endToTitle();
});
document.getElementById('bReset').onclick=()=>{ if(solved) return; links=[]; sel=null; blip(240,.15); drawLinks(); };
const bS=document.getElementById('bSnd');
function sndLabel(){ bS.textContent=sndOn?'♪ ON':'♪ OFF'; }
bS.onclick=()=>{ sndOn=!sndOn; try{localStorage.setItem('redline_snd',sndOn?'1':'0')}catch(e){} sndLabel(); if(bgm){ sndOn?bgm.play().catch(()=>{}):bgm.pause(); } };
sndLabel();
if(IMG.board){const w=document.getElementById('wb');w.style.backgroundImage=`linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,.18)),url(${IMG.board})`;}
if(IMG.desk) document.getElementById('desk').style.backgroundImage=`url(${IMG.desk})`;
(function(){ if(TITLE_IMG.length>100){ const el=document.getElementById('title'); el.style.backgroundImage='linear-gradient(rgba(8,6,4,.38),rgba(8,6,4,.58)),url('+TITLE_IMG+')'; el.classList.add('hasbg'); } })();
document.getElementById('title').addEventListener('click',function(){ initAudio(); this.style.display='none'; });
let rt; window.addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(build,120);});
si=save.cur||0; build();
</script>
