<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ブロッコリー test ver.</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body {
            margin: 0; padding: 0; background: #111; color: #fff;
            font-family: 'Courier New', monospace; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }
        #game-container {
            position: relative; width: 100vw; max-width: 480px; height: 100vh; max-height: 720px;
            background: #202028; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            background: linear-gradient(to bottom, #5c94fc 0%, #5c94fc 70%, #00a800 70%, #00a800 100%);
            display: block; width: 100%; flex-grow: 1; image-rendering: pixelated;
        }
        #ui-bar {
            position: absolute; top: 10px; left: 10px; right: 10px; display: flex;
            justify-content: space-between; font-size: 14px; font-weight: bold; text-shadow: 2px 2px #000;
            pointer-events: none; z-index: 10;
        }
        #controls {
            height: 180px; background: #181820; display: grid;
            grid-template-columns: 1fr 1fr; padding: 15px; gap: 10px; border-top: 3px solid #333;
        }
        .control-group { display: flex; gap: 10px; align-items: center; justify-content: center; }
        .btn {
            background: #333; color: white; border: 3px solid #555; border-radius: 12px;
            font-size: 18px; font-weight: bold; width: 65px; height: 65px;
            display: flex; align-items: center; justify-content: center; user-select: none;
            box-shadow: 0 4px #111; active { transform: translateY(4px); box-shadow: 0 0 #111; }
        }
        .btn:active, .btn.pressed { background: #555; transform: translateY(2px); box-shadow: 0 2px #111; }
        #sound-btn {
            position: absolute; top: 10px; right: 10px; z-index: 20; background: #222;
            color: #fff; border: 2px solid #666; padding: 5px 10px; font-size: 12px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <button id="sound-btn">SOUND: OFF</button>
        <div id="ui-bar">
            <span id="score-text">SCORE: 0</span>
            <span id="size-text">SIZE: 12x24</span>
        </div>
        <canvas id="gameCanvas" width="256" height="384"></canvas>
        <div id="controls">
            <div class="control-group">
                <div class="btn" id="btn-left">◀</div>
                <div class="btn" id="btn-right">▶</div>
            </div>
            <div class="control-group" style="justify-content: flex-end;">
                <div class="btn" id="btn-jump" style="background: #a00; border-color: #f44;">▲</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('score-text');
        const sizeText = document.getElementById('size-text');
        const soundBtn = document.getElementById('sound-btn');

        let score = 0;
        let soundEnabled = false;

        // Web Audio API Sound System (Retro 8-bit)
        class RetroAudio {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTone(freq, type, duration, vol=0.1) {
                if (!soundEnabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playPeko() {
                if (!soundEnabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch(e){}
            }
            playPowerup() {
                if (!soundEnabled || !this.ctx) return;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'square', 0.08, 0.1), i * 70);
                });
            }
            playDamage() {
                if (!soundEnabled || !this.ctx) return;
                this.playTone(120, 'sawtooth', 0.2, 0.15);
            }
        }
        const audio = new RetroAudio();

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            audio.init();
            soundBtn.innerText = soundEnabled ? 'SOUND: ON' : 'SOUND: OFF';
        });

        // Input Management
        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; audio.init(); });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function setupBtn(id, code) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; audio.init(); el.classList.add('pressed'); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; el.classList.remove('pressed'); });
            el.addEventListener('mousedown', () => { keys[code] = true; audio.init(); el.classList.add('pressed'); });
            el.addEventListener('mouseup', () => { keys[code] = false; el.classList.remove('pressed'); });
        }
        setupBtn('btn-left', 'ArrowLeft');
        setupBtn('btn-right', 'ArrowRight');
        setupBtn('btn-jump', 'Space');

        // Game Entities
        class Player {
            constructor() {
                this.x = 120;
                this.y = 200;
                this.w = 16;
                this.h = 28;
                this.vx = 0;
                this.vy = 0;
                this.speed = 2.2;
                this.jumpPower = -7.5;
                this.grounded = false;
                this.dir = 1;
            }
            update() {
                const left = keys['ArrowLeft'] || keys['KeyA'] || keys['left'];
                const right = keys['ArrowRight'] || keys['KeyD'] || keys['right'];
                const jump = keys['Space'] || keys['KeyW'] || keys['up'];

                if (left) { this.vx = -this.speed; this.dir = -1; }
                else if (right) { this.vx = this.speed; this.dir = 1; }
                else { this.vx = 0; }

                this.vy += 0.4; // Gravity
                if (jump && this.grounded) {
                    this.vy = this.jumpPower;
                    this.grounded = false;
                    audio.playTone(400, 'square', 0.08, 0.08);
                }

                this.x += this.vx;
                this.y += this.vy;

                // Boundaries
                if (this.x < 8) this.x = 8;
                if (this.x + this.w > canvas.width - 8) this.x = canvas.width - 8 - this.w;

                // Ground & Platform Collision
                this.grounded = false;
                const groundY = canvas.height - 64;
                if (this.y + this.h >= groundY) {
                    this.y = groundY - this.h;
                    this.vy = 0;
                    this.grounded = true;
                }

                // Platforms
                platforms.forEach(p => {
                    if (this.x + this.w > p.x && this.x < p.x + p.w &&
                        this.y + this.h >= p.y && this.y + this.h - this.vy <= p.y + 4 && this.vy >= 0) {
                        this.y = p.y - this.h;
                        this.vy = 0;
                        this.grounded = true;
                    }
                });
            }
            draw() {
                ctx.save();
                ctx.translate(this.x + this.w/2, this.y + this.h/2);
                ctx.scale(this.dir, 1);

                // Photorealistic Dandy Gentleman Rendering
                ctx.fillStyle = '#f5c6a0'; // Face skin
                ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);

                // Suit jacket
                ctx.fillStyle = '#223355';
                ctx.fillRect(-this.w/2, 2, this.w, this.h/2);

                // Dandy Beard & Mustache
                ctx.fillStyle = '#332211';
                ctx.fillRect(-this.w/2 - 1, 0, this.w + 2, this.h/3);

                // Top hat
                ctx.fillStyle = '#111';
                ctx.fillRect(-this.w*0.8, -this.h/2 - 8, this.w*1.6, 3);
                ctx.fillRect(-this.w/2, -this.h/2 - 16, this.w, 10);
                ctx.fillStyle = '#900'; // Hat ribbon
                ctx.fillRect(-this.w/2, -this.h/2 - 9, this.w, 2);

                ctx.restore();
            }
            grow() {
                this.h += 15; // Doubles/grows endlessly in height, width remains fixed
                audio.playPowerup();
            }
            shrink() {
                this.h = Math.max(1, Math.floor(this.h * 0.7));
                this.w = Math.max(1, Math.floor(this.w * 0.9));
                audio.playDamage();
            }
        }

        class BroccoliPowerup {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.w = 14;
                this.h = 14;
                this.vx = 1.2;
                this.vy = 0;
                this.grounded = false;
            }
            update() {
                this.vy += 0.3;
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 8 || this.x + this.w > canvas.width - 8) this.vx *= -1;

                const groundY = canvas.height - 64;
                if (this.y + this.h >= groundY) {
                    this.y = groundY - this.h;
                    this.vy = 0;
                    this.grounded = true;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                // Realistic Broccoli rendering
                ctx.fillStyle = '#8B4513'; // Stem
                ctx.fillRect(5, 10, 4, 4);
                ctx.fillStyle = '#2e8b57'; // Floret heads
                ctx.beginPath();
                ctx.arc(4, 6, 5, 0, Math.PI*2);
                ctx.arc(10, 6, 5, 0, Math.PI*2);
                ctx.arc(7, 3, 6, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'cauliflower' or 'snail'
                this.w = 16;
                this.h = 16;
                this.vx = (Math.random() > 0.5 ? 1 : -1) * 0.8;
                this.vy = 0;
                this.colorIndex = 0;
                this.colors = ['#cc2222', '#22aa22', '#2222cc', '#aa22aa', '#ccaa22', '#22aaaa'];
            }
            update() {
                this.vy += 0.3;
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 8 || this.x + this.w > canvas.width - 8) this.vx *= -1;

                const groundY = canvas.height - 64;
                if (this.y + this.h >= groundY) {
                    this.y = groundY - this.h;
                    this.vy = 0;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.type === 'cauliflower') {
                    // Realistic Cauliflower
                    ctx.fillStyle = '#fff5ee';
                    ctx.beginPath();
                    ctx.arc(8, 8, 7, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = this.colors[this.colorIndex % this.colors.length];
                    ctx.fillRect(4, 12, 8, 4);
                } else {
                    // Realistic Snail
                    ctx.fillStyle = '#d2b48c'; // Body
                    ctx.fillRect(2, 10, 12, 6);
                    ctx.fillStyle = '#a0522d'; // Shell
                    ctx.beginPath();
                    ctx.arc(10, 8, 6, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.restore();
            }
            stomp() {
                this.colorIndex++;
                audio.playPeko();
            }
        }

        // Environment
        const platforms = [
            { x: 40, y: 240, w: 70, h: 10 },
            { x: 146, y: 180, w: 70, h: 10 }
        ];

        let player = new Player();
        let enemies = [new Enemy(80, 200, 'cauliflower'), new Enemy(180, 150, 'snail')];
        let powerups = [];

        // Randomly drop enemies from the sky
        setInterval(() => {
            if (enemies.length < 8) {
                const rx = 20 + Math.random() * (canvas.width - 40);
                const type = Math.random() > 0.5 ? 'cauliflower' : 'snail';
                enemies.push(new Enemy(rx, 20, type));
            }
        }, 7000);

        // Spawn powerup broccoli occasionally
        setInterval(() => {
            powerups.push(new BroccoliPowerup(canvas.width / 2, 20));
        }, 12000);

        function update() {
            player.update();

            enemies.forEach(e => e.update());
            powerups.forEach(p => p.update());

            // Powerup collision
            powerups.forEach((p, idx) => {
                if (player.x < p.x + p.w && player.x + player.w > p.x &&
                    player.y < p.y + p.h && player.y + player.h > p.y) {
                    player.grow();
                    score += 500;
                    powerups.splice(idx, 1);
                }
            });

            // Enemy collision & Stomping
            enemies.forEach((e, index) => {
                if (player.x < e.x + e.w && player.x + player.w > e.x &&
                    player.y < e.y + e.h && player.y + player.h > e.y) {
                    // Check stomp from above
                    if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 8) {
                        e.stomp();
                        player.vy = -5;
                        score += 100;
                        // Split enemy
                        enemies.push(new Enemy(e.x + (Math.random() > 0.5 ? 15 : -15), e.y, e.type));
                    } else {
                        // Damage / Shrink
                        player.shrink();
                        // Push back enemy to prevent continuous instant hit
                        e.vx *= -1;
                    }
                }
            });

            scoreText.innerText = `SCORE: ${score}`;
            sizeText.innerText = `SIZE: ${player.w}x${player.h}`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background & Ground
            const groundY = canvas.height - 64;
            ctx.fillStyle = '#00a800';
            ctx.fillRect(0, groundY, canvas.width, 64);
            ctx.fillStyle = '#c84c0c';
            ctx.fillRect(0, groundY, canvas.width, 8);

            // Platforms
            platforms.forEach(p => {
                ctx.fillStyle = '#c84c0c';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = '#fcbcb0';
                ctx.fillRect(p.x, p.y, p.w, 3);
            });

            player.draw();
            enemies.forEach(e => e.draw());
            powerups.forEach(p => p.draw());
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
