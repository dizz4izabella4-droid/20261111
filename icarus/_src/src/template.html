<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1422">
<script>try{navigator.audioSession.type='ambient'}catch(e){}</script>
<script>/* ?bg=1: おもちゃ箱トップの背景用（UIなし・羽なし・無音・等倍・親の合図で再生開始） */
window.__BG=/[?&]bg=1(&|$)/.test(location.search);
if(window.__BG){document.documentElement.className='bg';
Object.defineProperty(window,'devicePixelRatio',{get:function(){return 1}});
(function(){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var P=function(){var c=new (Function.prototype.bind.apply(AC,[null].concat([].slice.call(arguments))))();try{c.suspend()}catch(e){}c.resume=function(){return Promise.resolve()};return c};P.prototype=AC.prototype;window.AudioContext=P;window.webkitAudioContext=P})();}
</script>
<title>イカロス</title>
<style>
:root{color-scheme:dark;--ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","游ゴシック","Meiryo","Noto Sans JP",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1422;color:#fff;font-family:var(--ja);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.ov{position:fixed;left:0;right:0;pointer-events:none;text-align:center;opacity:0;transition:opacity 1.6s ease}
.ov.on{opacity:1}
#title{top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;gap:14px}
#title h1{margin:0;font-weight:300;font-size:clamp(34px,9vw,84px);letter-spacing:.34em;padding-left:.34em;color:#fff;text-shadow:0 0 28px rgba(255,190,110,.65),0 2px 26px rgba(10,20,40,.55)}
#title p{margin:0;font-weight:300;font-size:clamp(12px,3.2vw,18px);letter-spacing:.42em;padding-left:.42em;color:rgba(255,246,230,.92);text-shadow:0 1px 14px rgba(10,20,40,.7)}
#title .btns{margin-top:clamp(26px,7vh,64px);display:flex;flex-direction:column;gap:14px;align-items:center}
#title.on .btn{pointer-events:auto}
.btn{font:inherit;font-size:clamp(13px,3.4vw,17px);letter-spacing:.34em;padding:.9em 2.2em .9em 2.5em;min-width:min(78vw,300px);color:#fff;background:rgba(10,20,34,.28);border:1px solid rgba(255,255,255,.55);border-radius:40px;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);text-shadow:0 1px 8px rgba(5,12,24,.6);transition:background .25s,border-color .25s}
.btn:hover{background:rgba(255,190,110,.35);border-color:#fff}
.btn small{display:block;margin-top:.35em;font-size:.62em;letter-spacing:.22em;opacity:.8}
#hint{left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));font-size:clamp(11px,2.8vw,14px);letter-spacing:.2em;color:rgba(255,255,255,.9);text-shadow:0 1px 10px rgba(5,12,24,.85);transition:opacity 1.6s}
#hint span{display:inline-block;margin:0 1.2em}
#snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:40px;height:40px;border:0;border-radius:50%;background:rgba(10,20,34,.22);color:#fff;opacity:.55;display:grid;place-items:center;padding:0;cursor:pointer}
#snd:hover,.tb:hover{opacity:.9}
.tb{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));height:40px;min-width:40px;border:0;border-radius:20px;background:rgba(10,20,34,.22);color:#fff;opacity:.55;padding:0 12px;font:inherit;font-size:12px;letter-spacing:.16em;cursor:pointer;display:grid;place-items:center}
#fs{right:calc(64px + env(safe-area-inset-right,0px))}#ori{right:calc(142px + env(safe-area-inset-right,0px))}
#snd svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#snd .x{display:none}
#snd.off .w{display:none}#snd.off .x{display:block}
#mode{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));height:36px;border:0;border-radius:18px;padding:0 16px;background:rgba(10,20,34,.26);color:#fff;opacity:0;pointer-events:none;font:inherit;font-size:12px;letter-spacing:.22em;cursor:pointer;transition:opacity 1.2s}
#mode.on{opacity:.62;pointer-events:auto}
#mode:hover{opacity:1}
#prog{position:fixed;left:0;bottom:0;height:2px;width:0;background:rgba(255,236,200,.55);opacity:0;pointer-events:none;transition:opacity 1.2s}
#prog.on{opacity:.5}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;background:#0b1422;font-size:15px;line-height:1.9;letter-spacing:.1em;z-index:9}
html.bg,html.bg body{background:transparent!important}html.bg #title,html.bg #hint,html.bg #mode,html.bg #prog,html.bg #snd,html.bg #ori,html.bg #fs,html.bg #err,html.bg .ov,html.bg .tb,html.bg button{display:none!important}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="title" class="ov"><h1>イカロス</h1><p>約5分の、空の旅</p>
<div class="btns"><button class="btn" id="bAuto" type="button">オートで観る<small>映像として、飛んでいく</small></button><button class="btn" id="bMan" type="button">マニュアルで飛ぶ<small>自由に飛ぶ</small></button></div></div>
<div id="hint" class="ov"></div>
<button id="mode" type="button" aria-label="操作モード切り替え">マニュアルで飛ぶ</button>
<div id="prog"></div>
<button id="snd" type="button" aria-label="音のオン・オフ"><svg viewBox="0 0 24 24"><g class="w"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.6a7.6 7.6 0 0 1 0 10.8"/></g><g class="x"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg></button>
<button id="ori" class="tb" type="button" aria-label="画面の向き">向き</button><button id="fs" class="tb" type="button" aria-label="全画面">全画面</button>
<div id="err">この端末では 3D 描画（WebGL2）が使えないため、表示できません。<br>最新の Safari / Chrome でお試しください。</div>
<script>/*@@THREE@@*/</script>
<script>
/*@@GAME@@*/
</script>
</body>
</html>
