/**

/* 00_core.js — 追跡 core (C1)
 * 設計書 v1.1 §3 準拠。担当: M1 core
 * 提供: G.define / G.bus / G.E / G.KS / G.rng / G.state / G.assets / G.start()
 * 未登録のモジュールは、このファイル内のスタブで補う（部屋の箱・WASD・クリック発砲つき）。
 * 追加した状態: state.introEndAt（intro の字幕が終わる state.time。killer は「これ + 3 秒」で THREATEN へ）
 */
(function (global) {
  'use strict';

  const G = (global.G = {});
  G.version = 'c1-1';
  G.assets = {}; // 01_assets.js が Object.assign で埋める
  G.stats = { calls: 0, tris: 0 }; // C1c/K3: 毎フレーム上書きする描画数（作り直さない）
  let lastCalls = 0;
  let lastTris = 0;
  // C1c/K2: 画像アセット（tex_ / decal_）だけを数える。bgm など音源は数に入れない
  function countImageAssets() {
    let n = 0;
    const keys = Object.keys(G.assets);
    for (let i = 0; i < keys.length; i++) {
      if (keys[i].indexOf('tex_') === 0 || keys[i].indexOf('decal_') === 0) n++;
    }
    return n;
  }
  G._countImageAssets = countImageAssets; // テスト専用

  G.cfg = {
    debug: false,
    seed: 1337,
    pixelRatioMax: 1.5,
    skipIntro: false,
    winDelay: 1.4, // killer が DEATH に入ってから win 画面までの秒数
    loseDelay: 0.8, // プレイヤーが斧で死亡してから lose 画面までの秒数
    loadBudgetMs: 2000,
    expectedAssets: 13,
    room: { xMin: -4, xMax: 4, zMin: -7, zMax: 5, height: 3 },
    eyeStart: [0, 1.65, 4],
    killerStart: [0, 0, -5.6],
    introLines: [
      { at: 0.3, ms: 2800, text: '……暗い。何かが、いる。' },
      { at: 3.4, ms: 2400, text: '動くな。銃を構えろ。' },
    ],
  };

  // ---- 定数 ---------------------------------------------------------------
  G.E = Object.freeze({
    GAME_START: 'game:start',
    GAME_RESET: 'game:reset',
    PLAYER_FIRE: 'player:fire',
    HIT: 'hit',
    PLAYER_STEP: 'player:step',
    PLAYER_DAMAGED: 'player:damaged',
    KILLER_STATE: 'killer:state',
    KILLER_STEP: 'killer:step',
    KILLER_VOCAL: 'killer:vocal',
    KILLER_SWING: 'killer:swing',
    LIGHT_FLICKER: 'light:flicker',
    SUBTITLE: 'subtitle',
  });
  G.KS = Object.freeze({
    IDLE: 'IDLE',
    THREATEN: 'THREATEN',
    RETREAT: 'RETREAT',
    CORNERED: 'CORNERED',
    CHARGE: 'CHARGE',
    ATTACK: 'ATTACK',
    HIT: 'HIT',
    DEATH: 'DEATH',
  });
  const E = G.E;
  const KS = G.KS;

  // ---- 状態（書き込めるのは担当モジュールだけ。core は phase / time / introEndAt）----
  G.state = { phase: 'loading', playerDead: false, killerWounds: 0, time: 0, introEndAt: 0 };
  const state = G.state;
  const runStats = { shots: 0, hits: 0, headshots: 0, time: 0 };

  // ---- 乱数 mulberry32（Math.random は使わない）--------------------------------
  function mulberry32(seed) {
    let a = seed >>> 0;
    const f = function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.reset = function () {
      a = G.cfg.seed >>> 0;
    };
    return f;
  }
  G.rng = mulberry32(G.cfg.seed);

  // ---- イベントバス ---------------------------------------------------------
  const validEvents = new Set(Object.values(E));
  const handlers = new Map();
  const evLog = []; // debug 中だけ記録
  const EV_LOG_MAX = 200;
  const errors = [];

  function checkName(name, where) {
    if (validEvents.has(name)) return true;
    const msg = '[bus] 未定義のイベント名 "' + name + '" (' + where + ') — G.E の定数を使うこと';
    console.error(msg);
    errors.push(msg);
    if (G.cfg.debug) throw new Error(msg);
    return false;
  }
  function snapshot(payload) {
    if (payload === undefined) return '';
    try {
      return JSON.stringify(payload, function (k, v) {
        const o = this[k];
        if (o && o.isVector3) return [r2(o.x), r2(o.y), r2(o.z)];
        if (o && o.isObject3D) return '[Obj3D ' + (o.name || o.type) + ']';
        if (typeof v === 'number') return r2(v);
        return v;
      });
    } catch (e) {
      return '[unserializable]';
    }
  }
  function r2(n) {
    return Math.round(n * 100) / 100;
  }
  G.bus = {
    log: evLog,
    on(name, fn) {
      checkName(name, 'on');
      let l = handlers.get(name);
      if (!l) handlers.set(name, (l = []));
      l.push(fn);
      return function () {
        G.bus.off(name, fn);
      };
    },
    off(name, fn) {
      const l = handlers.get(name);
      if (!l) return;
      const i = l.indexOf(fn);
      if (i >= 0) l.splice(i, 1);
    },
    emit(name, payload) {
      if (!checkName(name, 'emit')) return;
      if (G.cfg.debug) {
        evLog.push({ t: state.time, name: name, text: snapshot(payload) });
        if (evLog.length > EV_LOG_MAX) evLog.shift();
      }
      const l = handlers.get(name);
      if (!l) return;
      const copy = l.slice();
      for (let i = 0; i < copy.length; i++) {
        try {
          copy[i](payload, name);
        } catch (e) {
          reportError('handler(' + name + ')', e);
        }
      }
    },
  };
  G.bus.on(E.PLAYER_FIRE, function () { runStats.shots++; });
  G.bus.on(E.HIT, function (e) {
    if (e.owner === 'killer' && e.target !== 'wall' &&
        (e.zone === 'head' || e.zone === 'torso' || e.zone === 'limb')) {
      runStats.hits++;
      if (e.zone === 'head') runStats.headshots++;
    }
  });

  function reportError(where, e) {
    const msg = where + ': ' + (e && e.message ? e.message : e);
    console.error(msg, e);
    errors.push(msg);
    if (errors.length > 20) errors.shift();
  }

  // ---- モジュール登録 -------------------------------------------------------
  const defs = new Map();
  const mods = {};
  const order = [];
  const ctx = {};
  const CORE_MODULES = ['texgen', 'world', 'player', 'killer', 'audio', 'fx'];

  G.define = function (name, deps, factory) {
    if (typeof deps === 'function') {
      factory = deps;
      deps = [];
    }
    if (defs.has(name)) console.warn('[core] モジュール "' + name + '" が二重に登録された');
    defs.set(name, { deps: deps || [], factory: factory });
  };
  G.mod = function (name) {
    return mods[name];
  };

  function instantiate(name, stack) {
    if (mods[name]) return mods[name];
    if (stack.indexOf(name) >= 0) throw new Error('循環依存: ' + stack.concat(name).join(' > '));
    let def = defs.get(name);
    let isStub = false;
    if (!def) {
      if (!stubs[name]) throw new Error('未登録のモジュール: ' + name);
      def = { deps: [], factory: stubs[name] };
      isStub = true;
    }
    for (let i = 0; i < def.deps.length; i++) instantiate(def.deps[i], stack.concat(name));
    const api = def.factory(ctx) || {};
    api._name = name;
    api._stub = isStub;
    mods[name] = api;
    order.push(name);
    return api;
  }

  // ---- DOM / UI -------------------------------------------------------------
  const ui = {};
  let subHideAt = 0;

    const style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);

    function el(tag, id, cls, text, parent) {
      const e = document.createElement(tag);
      if (id) e.id = id;
      if (cls) e.className = cls;
      if (text) e.textContent = text;
      (parent || document.body).appendChild(e);
      return e;
    }
    ui.title = el('div', 'ts-title', 'ts-layer ts-dim');
    el('h1', null, 'ts-h1', '追跡', ui.title);
    el('div', null, 'ts-p', '3D FPS', ui.title);
    el('div', null, 'ts-p', 'WASD 移動 ／ マウス 視点（右ドラッグでも可）／ クリック 発砲 ／ R リセット', ui.title);
    el('div', null, 'ts-go', 'クリックで開始', ui.title);
    ui.loading = el('div', 'ts-loading', 'ts-layer ts-dim', '読込中…');
    ui.hud = el('div', 'ts-hud');
    el('div', 'ts-cross', null, null, ui.hud);
    ui.sub = el('div', 'ts-sub');
    ui.end = el('div', 'ts-end', 'ts-layer ts-dim');
    ui.endH = el('h1', null, 'ts-h1', '', ui.end);
    el('div', null, 'ts-p', 'R キーでもう一度', ui.end);
    ui.endStats = el('div', 'ts-end-stats', 'ts-p', '', ui.end);
    ui.debug = el('pre', 'ts-debug');
  }

  function setPhase(p) {
    state.phase = p;
    if (p === 'win' || p === 'lose') {
      runStats.time = state.time;
      ui.endStats.textContent = '時間 ' + runStats.time.toFixed(1) + '秒 ／ 発砲 ' + runStats.shots +
        ' ／ 命中 ' + runStats.hits + ' ／ ヘッドショット ' + runStats.headshots;
    }
    ui.title.style.display = p === 'title' ? 'flex' : 'none';
    ui.loading.style.display = p === 'loading' ? 'flex' : 'none';
    ui.hud.style.display = p === 'intro' || p === 'play' ? 'block' : 'none';
    ui.end.style.display = p === 'win' || p === 'lose' ? 'flex' : 'none';
    if (p === 'win') ui.endH.textContent = '生き延びた';
    if (p === 'lose') ui.endH.textContent = '死';
  }

  function showSubtitle(text, ms) {
    ui.sub.textContent = text;
    ui.sub.style.opacity = '1';
    subHideAt = performance.now() + (ms || 2500);
  }

  // ---- 進行（intro → play → win/lose）-----------------------------------------
  let introQueue = [];
  let pendingEnd = null;

  function beginIntro() {
    state.playerDead = false; // Core owns the death flag, including a new run.
    runStats.shots = runStats.hits = runStats.headshots = runStats.time = 0;
    state.time = 0;
    pendingEnd = null;
    introQueue = [];
    let end = 0;
    const lines = G.cfg.skipIntro ? [] : G.cfg.introLines;
    for (let i = 0; i < lines.length; i++) {
      introQueue.push(lines[i]);
      end = Math.max(end, lines[i].at + lines[i].ms / 1000);
    }
    state.introEndAt = end;
    setPhase(end > 0 ? 'intro' : 'play');
  }

  function startGame() {
    if (state.phase !== 'title') return;
    // クリックの同期呼び出しの中で行う（AudioContext と PointerLock のユーザー操作条件）
    callSafe('audio', 'unlock');
    G.rng.reset();
    G.bus.emit(E.GAME_START);
    beginIntro();
  }

  function resetGame() {
    G.rng.reset();
    G.bus.emit(E.GAME_RESET);
    for (let i = 0; i < order.length; i++) {
      const m = mods[order[i]];
      try {
        if (m.reset) m.reset();
      } catch (e) {
        reportError(order[i] + '.reset', e);
      }
    }
    ui.sub.style.opacity = '0';
    beginIntro();
  }

  function finish(phase) {
    setPhase(phase);
    if (phase === 'lose') callSafe('fx', 'kick', 'death');
    if (document.exitPointerLock) document.exitPointerLock();
  }

  function flow() {
    const ph = state.phase;
    if (ph === 'intro') {
      while (introQueue.length && state.time >= introQueue[0].at) {
        const l = introQueue.shift();
        G.bus.emit(E.SUBTITLE, { text: l.text, ms: l.ms });
      }
      if (state.time >= state.introEndAt) setPhase('play');
    } else if (ph === 'play') {
      if (!pendingEnd && state.playerDead) pendingEnd = { phase: 'lose', at: state.time + G.cfg.loseDelay };
      if (pendingEnd && state.time >= pendingEnd.at) finish(pendingEnd.phase);
    }
  }

  function callSafe(name, fn, a, b) {
    const m = mods[name];
    if (!m || !m[fn]) return;
    try {
      return m[fn](a, b);
    } catch (e) {
      reportError(name + '.' + fn, e);
    }
  }
  function callUpdate(name, dt, t) {
    const m = mods[name];
    if (!m || !m.update || m._failed) return;
    try {
      m.update(dt, t);
    } catch (e) {
      m._failed = true; // 毎フレームのエラー連発を避ける。debug パネルに残る
      reportError(name + '.update（以後停止）', e);
    }
  }

  // ---- メインループ（§3.6）---------------------------------------------------
  let clock = null;
  let extraNames = []; // C1c/K1: boot 後に一度だけ作る（ループ内で配列を作らない）
  const FIXED_UPDATE = ['texgen', 'world', 'player', 'killer', 'audio', 'fx', 'killer_model'];
  let fpsEMA = 60;
  let dbgAcc = 0;

  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    const ph = state.phase;
    const live = ph === 'intro' || ph === 'play';
    const running = live || ph === 'win' || ph === 'lose';
    if (running) state.time += dt;
    const t = state.time;

    if (live) callUpdate('player', dt, t);
    if (running) callUpdate('killer', dt, t); // killer は state.phase を見て止まる／終える
    callUpdate('world', dt, t);
    callUpdate('audio', dt, t);
    callUpdate('fx', dt, t);
    // C1c/K1: 固定リスト以外のモジュール（bgm など）は全フェーズで update する
    for (let i = 0; i < extraNames.length; i++) callUpdate(extraNames[i], dt, t);
    flow();

    const fx = mods.fx;
    G.renderer.info.reset(); // C1c/K3: autoReset=false なので、描画の直前に自分で 0 に戻す
    try {
      fx.render();
    } catch (e) {
      if (!fx._renderFailed) {
        fx._renderFailed = true;
        reportError('fx.render（renderer.render に退避）', e);
      }
      G.renderer.info.reset();
      G.renderer.render(G.scene, G.camera);
    }
    lastCalls = Number(G.renderer.info.render.calls) || 0;
    lastTris = Number(G.renderer.info.render.triangles) || 0;
    G.stats.calls = lastCalls;
    G.stats.tris = lastTris;

    if (subHideAt && performance.now() > subHideAt) {
      subHideAt = 0;
      ui.sub.style.opacity = '0';
    }
    if (live) {
    }
    fpsEMA += (1 / Math.max(dt, 1e-3) - fpsEMA) * 0.05;
    dbgAcc += dt;
    if (G.cfg.debug && dbgAcc > 0.25) {
      dbgAcc = 0;
      updateDebug();
    }
  }

  function updateDebug() {
    const lines = [];
    lines.push(
      'fps ' + fpsEMA.toFixed(0) + '  phase ' + state.phase + '  t ' + state.time.toFixed(1) +
        '  dead ' + (state.playerDead ? 1 : 0) + '  wounds ' + state.killerWounds
    );
    lines.push(
      'mods ' + order.map(function (n) { return n + (mods[n]._stub ? '(stub)' : ''); }).join(' ') +
        '  assets ' + countImageAssets() + '/' + G.cfg.expectedAssets +
        '  calls ' + lastCalls + ' tris ' + lastTris
    );
    for (let i = 0; i < errors.length; i++) lines.push('ERR ' + errors[i]);
    lines.push('---- events (F2 で表示切替)');
    const tail = evLog.slice(-14);
    for (let i = 0; i < tail.length; i++) {
      lines.push(tail[i].t.toFixed(2) + ' ' + tail[i].name + ' ' + tail[i].text.slice(0, 90));
    }
    ui.debug.textContent = lines.join('\n');
  }

  function setDebug(on) {
    G.cfg.debug = on;
    ui.debug.style.display = on ? 'block' : 'none';
    if (on) updateDebug();
  }

  // ---- 起動 -----------------------------------------------------------------
  G.start = function () {
    if (G._started) return;
    G._started = true;
    const THREE = (G.THREE = global.THREE);
    const q = new URLSearchParams(global.location.search);
    if (q.get('debug')) G.cfg.debug = true;
    if (q.get('skipintro')) G.cfg.skipIntro = true;

    buildUI();
    setDebug(G.cfg.debug);
    setPhase('loading');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    } catch (e) {
      ui.loading.textContent = 'WebGL を初期化できません';
      throw e;
    }
    renderer.setPixelRatio(Math.min(global.devicePixelRatio || 1, G.cfg.pixelRatioMax));
    renderer.setSize(global.innerWidth, global.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding; // r128: colorSpace は使わない
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;
    renderer.info.autoReset = false; // C1c/K3: composer の全パス分を数える
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.insertBefore(renderer.domElement, document.body.firstChild);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050506);
    scene.fog = new THREE.FogExp2(0x050506, 0.06);
    const camera = new THREE.PerspectiveCamera(75, global.innerWidth / global.innerHeight, 0.05, 60);
    camera.rotation.order = 'YXZ';
    camera.position.fromArray(G.cfg.eyeStart);

    G.renderer = renderer;
    G.scene = scene;
    G.camera = camera;
    Object.assign(ctx, { THREE: THREE, scene: scene, camera: camera, renderer: renderer, bus: G.bus, state: state, cfg: G.cfg, mod: G.mod });
    clock = new THREE.Clock();

    global.addEventListener('resize', onResize);
    global.addEventListener('keydown', onKey);
    ui.title.addEventListener('click', startGame);
    G.bus.on(E.SUBTITLE, function (e) {
      showSubtitle(e.text, e.ms);
    });
    // 設計変更: HP は無い。斧が当たった（PLAYER_DAMAGED）瞬間にプレイヤーは死亡する。
    G.bus.on(E.PLAYER_DAMAGED, function () {
      if (state.phase === 'play') state.playerDead = true;
    });
    G.bus.on(E.KILLER_STATE, function (e) {
      if (e.to === KS.DEATH && state.phase === 'play' && !pendingEnd) {
        pendingEnd = { phase: 'win', at: state.time + G.cfg.winDelay };
      }
    });

    boot().catch(function (e) {
      reportError('boot', e);
      ui.loading.style.display = 'flex';
      ui.loading.textContent = '起動に失敗: ' + (e && e.message ? e.message : e);
    });
  };

  function onResize() {
    const w = global.innerWidth;
    const h = global.innerHeight;
    G.renderer.setSize(w, h);
    G.camera.aspect = w / h;
    G.camera.updateProjectionMatrix();
    callSafe('fx', 'resize', w, h);
  }

  function onKey(e) {
    if (e.code === 'F2') {
      e.preventDefault();
      setDebug(!G.cfg.debug);
    } else if (e.code === 'KeyR' && !e.repeat) {
      const p = state.phase;
      if (p === 'intro' || p === 'play' || p === 'win' || p === 'lose') resetGame();
    } else if ((e.code === 'Enter' || e.code === 'Space') && state.phase === 'title') {
      e.preventDefault();
      startGame();
    }
  }

  async function boot() {
    // 「読込中」を一度描画させてから重い処理に入る
    await new Promise(function (r) {
      requestAnimationFrame(function () {
        r();
      });
    });
    const t0 = performance.now();
    const names = CORE_MODULES.slice();
    defs.forEach(function (_, n) {
      if (names.indexOf(n) < 0) names.push(n);
    });
    Object.keys(stubs).forEach(function (n) {
      if (names.indexOf(n) < 0) names.push(n); // CORE_MODULES 外のスタブ（killer_model）
    });
    for (let i = 0; i < names.length; i++) instantiate(names[i], []);
    for (let i = 0; i < order.length; i++) {
      const m = mods[order[i]];
      try {
        if (m.init) await m.init();
      } catch (e) {
        reportError(order[i] + '.init', e);
      }
    }
    extraNames = order.filter(function (n) {
      return FIXED_UPDATE.indexOf(n) < 0;
    });
    onResize();
    const ms = performance.now() - t0;
    if (ms > G.cfg.loadBudgetMs) console.warn('[core] 起動処理 ' + ms.toFixed(0) + 'ms（予算 ' + G.cfg.loadBudgetMs + 'ms）');
    G.loadMs = ms;
    setPhase('title');
    clock.getDelta();
    requestAnimationFrame(frame);
  }

  // ==========================================================================
  // スタブ（担当モジュールが無いときの代用。api は §3.4 のとおり）
  // ==========================================================================
  const stubs = {};

  stubs.texgen = function () {
    return {
      get: function () {
        return { map: null, normalMap: null, roughnessMap: null };
      },
      decal: function () {
        return null;
      },
    };
  };

  stubs.world = function (c) {
    const THREE = c.THREE;
    const R = G.cfg.room;
    const w = R.xMax - R.xMin, d = R.zMax - R.zMin, h = R.height;
    const cx = (R.xMax + R.xMin) / 2, cz = (R.zMax + R.zMin) / 2;
    const group = new THREE.Group();
    c.scene.add(group);
    const hittables = [];
    const colliders = [];

    function plane(wd, ht, color, surface, x, y, z, rx, ry) {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(wd, ht),
        new THREE.MeshStandardMaterial({ color: color, roughness: 0.9 })
      );
      m.position.set(x, y, z);
      m.rotation.set(rx, ry, 0);
      m.receiveShadow = true;
      m.userData.surface = surface;
      group.add(m);
      hittables.push(m);
    }
    plane(w, d, 0x3a3228, 'wood', cx, 0, cz, -Math.PI / 2, 0); // 床
    plane(w, d, 0x2a2a2a, 'plaster', cx, h, cz, Math.PI / 2, 0); // 天井
    plane(w, h, 0x4a4540, 'plaster', cx, h / 2, R.zMin, 0, 0); // 奥
    plane(w, h, 0x4a4540, 'plaster', cx, h / 2, R.zMax, 0, Math.PI); // 手前
    plane(d, h, 0x4a4540, 'plaster', R.xMin, h / 2, cz, 0, Math.PI / 2); // 左
    plane(d, h, 0x4a4540, 'plaster', R.xMax, h / 2, cz, 0, -Math.PI / 2); // 右
    const T = 0.3;
    const B = function (a, b, c2, d2, e2, f) {
      return new THREE.Box3(new THREE.Vector3(a, b, c2), new THREE.Vector3(d2, e2, f));
    };
    colliders.push(
      B(R.xMin - T, 0, R.zMin - T, R.xMin, h, R.zMax + T),
      B(R.xMax, 0, R.zMin - T, R.xMax + T, h, R.zMax + T),
      B(R.xMin - T, 0, R.zMin - T, R.xMax + T, h, R.zMin),
      B(R.xMin - T, 0, R.zMax, R.xMax + T, h, R.zMax + T)
    );

    c.scene.add(new THREE.HemisphereLight(0x1a1d24, 0x0a0806, 0.12));
    const bulb = new THREE.PointLight(0xffad5c, 1.6, 8, 2);
    bulb.position.set(0, 2.6, -1);
    bulb.castShadow = true;
    bulb.shadow.mapSize.set(512, 512);
    bulb.shadow.bias = -0.0005;
    bulb.shadow.normalBias = 0.02;
    group.add(bulb);

    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.5, 0.5),
      new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 0.8 })
    );
    cube.position.set(0, 1, -2);
    cube.castShadow = true;
    cube.receiveShadow = true;
    cube.userData.surface = 'wood';
    group.add(cube);
    hittables.push(cube);

    const decals = [];
    const decalGeo = new THREE.CircleGeometry(1, 16);
    const decalMats = {
      bullet: new THREE.MeshBasicMaterial({ color: 0x111111, polygonOffset: true, polygonOffsetFactor: -2 }),
      bloodSplat: new THREE.MeshBasicMaterial({ color: 0x5a0d0d, polygonOffset: true, polygonOffsetFactor: -2 }),
      bloodPool: new THREE.MeshBasicMaterial({ color: 0x3a0808, polygonOffset: true, polygonOffsetFactor: -2 }),
      mask: new THREE.MeshBasicMaterial({ color: 0x222222, polygonOffset: true, polygonOffsetFactor: -2 }),
    };
    const tmp = new THREE.Vector3();
    function addDecal(point, normal, kind, size) {
      const m = new THREE.Mesh(decalGeo, decalMats[kind] || decalMats.bullet);
      const s = size || 0.08;
      m.scale.setScalar(s);
      m.position.copy(point).addScaledVector(normal, 0.004);
      tmp.copy(point).add(normal);
      m.lookAt(tmp);
      c.scene.add(m);
      decals.push(m);
      if (decals.length > 60) c.scene.remove(decals.shift());
    }
    c.bus.on(E.HIT, function (e) {
      if (e.owner === 'env') addDecal(e.point, e.normal, 'bullet', 0.04);
    });

    let acc = 0;
    return {
      colliders: colliders,
      hittables: hittables,
      getLightLevel: function () {
        return 0.6;
      },
      addDecal: addDecal,
      surfaceAt: function () {
        return 'wood';
      },
      update: function (dt) {
        acc += dt;
        cube.rotation.y += dt;
        cube.position.y = 1 + Math.sin(acc * 2) * 0.1;
      },
      reset: function () {
        while (decals.length) c.scene.remove(decals.pop());
      },
    };
  };

  stubs.player = function (c) {
    const THREE = c.THREE;
    const eye = new THREE.Vector3().fromArray(G.cfg.eyeStart);
    const keys = {};
    let yaw = 0, pitch = 0, lastFire = -1, look = false;
    const R = G.cfg.room;
    const ray = new THREE.Raycaster();
    ray.far = 30;
    const v1 = new THREE.Vector3(), v2 = new THREE.Vector3(), v3 = new THREE.Vector3();

    global.addEventListener('keydown', function (e) { keys[e.code] = true; });
    global.addEventListener('keyup', function (e) { keys[e.code] = false; });
    global.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    global.addEventListener('mouseup', function () { look = false; });
    global.addEventListener('mousemove', function (e) {
      if (look || document.pointerLockElement) {
        yaw -= e.movementX * 0.002;
        pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY * 0.002));
      }
    });
    global.addEventListener('mousedown', function (e) {
      if (e.target !== G.renderer.domElement) return;
      if (e.button === 2) look = true;
      else if (e.button === 0) fire();
    });

    function aimDir(out) {
      return c.camera.getWorldDirection(out);
    }
    function fire() {
      if (state.phase !== 'play') return;
      const now = performance.now() / 1000;
      if (now - lastFire < 0.25) return;
      lastFire = now;
      const dir = aimDir(new THREE.Vector3());
      const origin = eye.clone();
      const muzzle = api.muzzleWorld(new THREE.Vector3());
      c.bus.emit(E.PLAYER_FIRE, { origin: origin, dir: dir, muzzle: muzzle });
      const targets = (mods.world.hittables || []).concat(mods.killer.hittables || []);
      ray.set(origin, dir);
      const hit = ray.intersectObjects(targets, false)[0];
      if (!hit) return;
      const n = hit.face ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld) : dir.clone().negate();
      const kz = hit.object.userData.zone;
      c.bus.emit(E.HIT, {
        point: hit.point.clone(),
        normal: n,
        owner: kz ? 'killer' : 'env',
        surface: hit.object.userData.surface || (kz ? 'cloth' : 'plaster'),
        zone: kz,
        dir: dir,
      });
    }

    const api = {
      eye: eye,
      getAimDir: aimDir,
      isAimingAt: function (pos, rad) {
        aimDir(v1);
        v2.copy(pos).sub(eye);
        const along = v2.dot(v1);
        if (along <= 0) return false;
        return v3.copy(v1).multiplyScalar(along).sub(v2).length() < rad;
      },
      muzzleWorld: function (out) {
        aimDir(v1);
        v2.set(1, 0, 0).applyQuaternion(c.camera.quaternion);
        out.copy(eye).addScaledVector(v1, 0.4).addScaledVector(v2, 0.12);
        out.y -= 0.1;
        return out;
      },
      update: function (dt) {
        if (keys.ArrowLeft) yaw += 1.5 * dt;
        if (keys.ArrowRight) yaw -= 1.5 * dt;
        const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
        const s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
        if (f || s) {
          const sp = 2.6 * dt;
          eye.x += (-Math.sin(yaw) * f + Math.cos(yaw) * s) * sp;
          eye.z += (-Math.cos(yaw) * f - Math.sin(yaw) * s) * sp;
          eye.x = Math.max(R.xMin + 0.4, Math.min(R.xMax - 0.4, eye.x));
          eye.z = Math.max(R.zMin + 0.4, Math.min(R.zMax - 0.4, eye.z));
        }
        c.camera.position.copy(eye);
        c.camera.rotation.set(pitch, yaw, 0);
      },
      reset: function () {
        eye.fromArray(G.cfg.eyeStart);
        yaw = 0;
        pitch = 0;
        state.playerDead = false;
      },
    };
    return api;
  };

  stubs.killer = function (c) {
    const root = new c.THREE.Group();
    root.position.fromArray(G.cfg.killerStart);
    c.scene.add(root);
    return {
      root: root,
      state: KS.IDLE,
      hittables: [],
      headPos: function (out) {
        return out.set(root.position.x, 1.7, root.position.z);
      },
      reset: function () {
        state.killerWounds = 0;
      },
    };
  };

  // ソフィア追加 (C1b / T2): killer_model のスタブ
  stubs.killer_model = function (c) {
    const root = new c.THREE.Group();

    bladeGeo.setAttribute('color',new THREE.Float32BufferAttribute(bladeColors,3));
    bladeGeo.translate(0, 0, -0.016); // 厚みを中央へ
    bladeGeo.rotateY(-PI / 2); // 前方 sx → +Z, 厚み → X
    bladeGeo.computeBoundingBox();
    var bladeCenter = bladeGeo.boundingBox.getCenter(new THREE.Vector3());
    bladeGeo.translate(-bladeCenter.x, -bladeCenter.y, -bladeCenter.z);
    var blade = part(axe, bladeGeo, matMetal, 'axeBlade', 'axe', 'metal');
    blade.position.copy(bladeCenter); // メッシュの原点 = 刃の中心
    blade.userData.part = 'axeBlade';

    // 柄尻から 0.12 m の所を握る。rotation.x = PI で、腕が下がっていれば刃は下、上げれば刃は上。
    var AXE_HOME_POS_Y = 0.12;
    axe.position.set(0, AXE_HOME_POS_Y, 0);
    axe.rotation.set(PI, 0, 0);

    var coatBlood = [];
    [[-0.13,0.03,0.185,0.16],[0.13,-0.18,0.155,0.16],[0.15,-0.33,0.135,0.16]].forEach(function(p){
      var g = new THREE.PlaneGeometry(p[3],p[3]);g.translate(p[0],p[1],p[2]);coatBlood.push(g);
    });
    var stains = part(chest,merge(coatBlood),matBlood,'coatBlood',null);stains.visible=!!matBlood.map;stains.castShadow=false;
    var cuff = part(elbowR,new THREE.PlaneGeometry(0.1,0.1),matBlood,'cuffBlood',null);
    cuff.position.set(0,-0.24,0.047);cuff.visible=!!matBlood.map;cuff.castShadow=false;

    // ======================================================================
    // 9. ポーズ（関節角を Float32Array に持つ）
    // ======================================================================
    var J = {
      hips: 0, spine: 1, chest: 2, neck: 3, head: 4,
      shoulderL: 5, elbowL: 6, shoulderR: 7, elbowR: 8,
      hipL: 9, kneeL: 10, hipR: 11, kneeR: 12
    };
    var jointObjs = [hips, spine, chest, neck, head, shoulderL, elbowL, shoulderR, elbowR, hipL, kneeL, hipR, kneeR];
    var NJ = jointObjs.length;
    var HIPS_Y = NJ * 3; // 39 番目: hips の高さ
    var SIZE = NJ * 3 + 1;

    var applied = new Float32Array(SIZE);
    var from = new Float32Array(SIZE);
    var target = new Float32Array(SIZE);

    var POSE_NAMES = {
      idle: 1, threaten: 1, retreat: 1, cornered: 1, charge: 1,
      attack_wind: 1, attack_swing: 1, hit: 1, death: 1
    };
    var warned = {};
    var prevName = 'idle';

    function S(j, x, y, z) {
      var k = j * 3;
      target[k] = x;
      target[k + 1] = y;
      target[k + 2] = z;
    }
    function lerp(a, b, u) {
      return a + (b - a) * u;
    }
    function smooth(e) {
      return e * e * (3 - 2 * e);
    }
    function clamp01(u) {
      return u < 0 ? 0 : u > 1 ? 1 : u;
    }

    // 目標角を target に書く（純粋な関数。new なし）
    function computeTarget(name, t) {
      var i, u, e, s, p, k, k2;
      for (i = 0; i < SIZE; i++) target[i] = 0;
      target[HIPS_Y] = 0.95;
      switch (name) {
        case 'idle':
          S(J.spine, 0.05, 0, 0);
          S(J.head, 0.1, 0.25 * Math.sin((2 * PI * t) / 4), 0);
          S(J.shoulderR, -0.05, 0, -0.12);
          S(J.elbowR, -0.35, 0, 0);
          S(J.shoulderL, -0.1, 0, 0.12);
          S(J.elbowL, -0.2, 0, 0);
          break;
        case 'threaten':
          target[HIPS_Y] = 0.93;
          S(J.spine, 0.12, 0, 0);
          S(J.chest, 0, 0.2 * Math.sin((2 * PI * t) / 2.4), 0);
          S(J.head, 0.05, 0, 0);
          S(J.shoulderR, -2.7, 0, -0.25);
          S(J.elbowR, -0.6, 0, 0);
          S(J.shoulderL, -1.1, 0, 0.25);
          S(J.elbowL, -0.5, 0, 0);
          S(J.hipL, -0.15, 0, 0);
          S(J.hipR, 0.1, 0, 0);
          S(J.kneeL, 0.15, 0, 0);
          S(J.kneeR, 0.15, 0, 0);
          break;
        case 'retreat':
          p = (2 * PI * t) / 1.0;
          target[HIPS_Y] = 0.94;
          S(J.spine, 0.1, 0, 0);
          S(J.head, 0.05, 0, 0);
          S(J.shoulderR, -2.7, 0, -0.25);
          S(J.elbowR, -0.6, 0, 0);
          S(J.shoulderL, -1.0, 0, 0.25);
          S(J.elbowL, -0.5, 0, 0);
          S(J.hipL, 0.35 * Math.sin(p), 0, 0);
          S(J.hipR, -0.35 * Math.sin(p), 0, 0);
          S(J.kneeL, 0.4 * Math.max(0, Math.cos(p)), 0, 0);
          S(J.kneeR, 0.4 * Math.max(0, -Math.cos(p)), 0, 0);
          break;
        case 'cornered':
          target[HIPS_Y] = 0.9;
          S(J.spine, 0.25, 0, 0);
          S(J.head, 0.3, 0, 0);
          S(J.shoulderR, -2.2 + 0.03 * Math.sin(40 * t), 0, -0.2);
          S(J.elbowR, -0.8, 0, 0);
          S(J.shoulderL, -0.9, 0, 0.3);
          S(J.elbowL, -0.6, 0, 0);
          S(J.hipL, -0.2, 0, 0);
          S(J.hipR, -0.2, 0, 0);
          S(J.kneeL, 0.4, 0, 0);
          S(J.kneeR, 0.4, 0, 0);
          break;
        case 'charge':
          p = (2 * PI * t) / 0.55;
          target[HIPS_Y] = 0.93 + 0.04 * Math.abs(Math.sin(p));
          S(J.spine, 0.35, 0, 0);
          S(J.head, 0, 0, 0);
          S(J.shoulderR, -2.9, 0, -0.2);
          S(J.elbowR, -0.8, 0, 0);
          S(J.shoulderL, 0.6 * Math.sin(p), 0, 0);
          S(J.elbowL, -0.9, 0, 0);
          S(J.hipL, -0.9 * Math.sin(p), 0, 0);
          S(J.hipR, 0.9 * Math.sin(p), 0, 0);
          S(J.kneeL, 0.9 * Math.max(0, Math.sin(p + 1.57)), 0, 0);
          S(J.kneeR, 0.9 * Math.max(0, -Math.sin(p + 1.57)), 0, 0);
          break;
        case 'attack_wind':
          u = clamp01(t / 0.6);
          target[HIPS_Y] = 0.93;
          S(J.spine, lerp(0.1, -0.15, u), 0, 0);
          S(J.chest, 0, lerp(0, 0.3, u), 0);
          S(J.head, 0, 0, 0);
          S(J.shoulderR, lerp(-2.7, -3.1, u), 0, -0.2);
          S(J.elbowR, lerp(-0.6, -1.2, u), 0, 0);
          S(J.shoulderL, -1.0, 0, 0.3);
          S(J.elbowL, -0.6, 0, 0);
          S(J.hipL, -0.3, 0, 0);
          S(J.hipR, 0.2, 0, 0);
          S(J.kneeL, 0.2, 0, 0);
          S(J.kneeR, 0.2, 0, 0);
          break;
        case 'attack_swing':
          e = smooth(clamp01(t / 0.25));
          target[HIPS_Y] = lerp(0.93, 0.85, e);
          S(J.spine, lerp(-0.15, 0.55, e), 0, 0);
          S(J.chest, 0, lerp(0.3, -0.3, e), 0);
          S(J.head, lerp(0, 0.2, e), 0, 0);
          S(J.shoulderR, lerp(-3.1, -0.9, e), 0, lerp(-0.2, 0, e));
          S(J.elbowR, lerp(-1.2, -0.2, e), 0, 0);
          S(J.shoulderL, -0.5, 0, 0.3);
          S(J.elbowL, -0.4, 0, 0);
          S(J.hipL, -0.5, 0, 0);
          S(J.hipR, 0.3, 0, 0);
          S(J.kneeL, 0.4, 0, 0);
          S(J.kneeR, 0.4, 0, 0);
          break;
        case 'hit':
          s = Math.sin(PI * clamp01(t / 0.5));
          target[HIPS_Y] = 0.92;
          S(J.spine, lerp(0, -0.3, s), 0, 0);
          S(J.head, lerp(0, -0.4, s), 0, 0);
          S(J.shoulderR, -2.2, 0, 0);
          S(J.elbowR, -0.7, 0, 0);
          S(J.shoulderL, -0.4, 0, 0.3);
          S(J.elbowL, -0.4, 0, 0);
          S(J.hipL, -0.1, 0, 0);
          S(J.hipR, -0.1, 0, 0);
          S(J.kneeL, 0.2, 0, 0);
          S(J.kneeR, 0.2, 0, 0);
          break;
        case 'death':
          k = clamp01(t / 1.2);
          k2 = k * k;
          S(J.hips, -1.5 * k2, 0, 0); // 後ろへ倒れる（頭が -Z へ）
          target[HIPS_Y] = 0.95 - 0.73 * k2;
          S(J.head, -0.2 * k2, 0, 0);
          S(J.shoulderL, 0, 0, 0.9 * k2);
          S(J.shoulderR, 0, 0, -0.9 * k2);
          // 膝だけ曲げると、すねが床へ傾いて靴が床にめり込むため、太ももを同じ角度だけ前へ上げる（膝を立てた形）
          S(J.hipL, -0.3 * k2, 0, 0);
          S(J.hipR, -0.3 * k2, 0, 0);
          S(J.kneeL, 0.3 * k2, 0, 0);
          S(J.kneeR, 0.3 * k2, 0, 0);
          break;
      }
    }

    // 関節へ書く。呼吸（胸と肩の上下）はここで足す。applied には足さない。
    function writeJoints() {
      var i, o, k;
      for (i = 0; i < NJ; i++) {
        o = jointObjs[i];
        k = i * 3;
        o.rotation.x = applied[k];
        o.rotation.y = applied[k + 1];
        o.rotation.z = applied[k + 2];
      }
      hips.position.y = applied[HIPS_Y];
      var br = Math.sin((2 * PI * G.state.time) / 3.2);
      chest.rotation.x += 0.02 * br;
      shoulderL.rotation.x += 0.01 * br;
      shoulderR.rotation.x += 0.01 * br;
    }

    // ----------------------------------------------------------------------
    // 死亡: 斧を手から外して床へ置く
    // ----------------------------------------------------------------------
    var axeDetached = false;
    var aStartPos = new THREE.Vector3();
    var aEndPos = new THREE.Vector3(-0.55, 0.04, 0.35);
    var aStartQ = new THREE.Quaternion();
    var aEndQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(-1.5708, 0, 0.3));

    function reattachAxe() {
      handR.add(axe); // add は前の親から外す
      axe.position.set(0, AXE_HOME_POS_Y, 0);
      axe.rotation.set(PI, 0, 0);
      axe.scale.set(1, 1, 1);
      axeDetached = false;
    }

    function dropAxe(t) {
      if (!axeDetached) {
        // 手の最新の位置を世界に反映してから、世界の位置を保ったまま root の子にする
        root.attach(axe);
        aStartPos.copy(axe.position);
        aStartQ.copy(axe.quaternion);
        axeDetached = true;
      }
      var k = smooth(clamp01((t - 0.3) / 0.8));
      axe.position.copy(aStartPos).lerp(aEndPos, k);
      axe.quaternion.copy(aStartQ).slerp(aEndQ, k);
    }

    // ----------------------------------------------------------------------
    // 公開関数
    // ----------------------------------------------------------------------
    function pose(name, t, blend) {
      if (!POSE_NAMES[name]) {
        if (!warned[name]) {
          warned[name] = true;
          console.warn('[killer_model] 未知のポーズ名 "' + name + '" → idle として扱う');
        }
        name = 'idle';
      }
      if (name !== prevName) {
        from.set(applied); // いま見えているポーズを控える
        prevName = name;
      }
      computeTarget(name, t);
      var b = blend < 0 ? 0 : blend > 1 ? 1 : blend;
      for (var i = 0; i < SIZE; i++) applied[i] = from[i] + (target[i] - from[i]) * b;
      writeJoints();
      if (name === 'death') {
        if (t >= 0.3) dropAxe(t);
      } else if (axeDetached) {
        reattachAxe();
      }
    }

    function headPos(out) {
      head.updateWorldMatrix(true, false);
      return out.setFromMatrixPosition(head.matrixWorld);
    }

    function reset() {
      if (axeDetached) reattachAxe();
      prevName = 'idle';
      computeTarget('idle', 0);
      applied.set(target);
      from.set(target);
      writeJoints();
    }

    reset(); // 最初から idle の姿勢にしておく

    return {
      root: root,
      hittables: hittables,
      pose: pose,
      headPos: headPos,
      reset: reset
    };
  });
})(typeof window !== 'undefined' ? window : globalThis);

/* ==== 09_bgm.js ==== */
/**
 * @file    src/09_bgm.js
 * @card    C9
 * @author  エリザベス (Claude Sonnet 5.5, claude.ai chat)
 * @date    2026-11-23
 * @revision 1
 */
(function (global) {
  'use strict';
  var G = global.G;

  G.define('bgm', [], function (ctx) {
    var E = G.E;
    var KS = G.KS;

    // アセットが無ければ何もしない（要素もイベントも console 出力も無し）
    if (!G.assets || !G.assets.bgm) {
      return {
        update: function () {},
        reset: function () {},
        stats: function () {
          return { active: false };
        },
      };
    }

    var UP = 0.5; // 上げる速さ（/秒）
    var DOWN = 0.67; // 下げる速さ（/秒）
    var DUCK_MUL = 0.6;
    var DUCK_SEC = 0.8;

    var el = new Audio(G.assets.bgm);
    el.loop = true;
    el.preload = 'auto';
    el.volume = 0;

    var vol = 0;
    var target = 0;
    var lastState = KS.IDLE;
    var duck = 0; // 残り秒数
    var statsObj = { active: true, volume: 0, target: 0, paused: true, ducking: false }; // stats() 用に使い回す

    function noop() {}
    function play() {
      var p = el.play();
      if (p && p.catch) p.catch(noop);
    }

    function stateTarget() {
      switch (lastState) {
        case KS.DEATH:
          return 0;
        case KS.CORNERED:
          return 0.4;
        case KS.CHARGE:
        case KS.ATTACK:
          return 0.5;
        case KS.IDLE:
          return 0.3;
        default:
          return 0.35; // THREATEN / RETREAT / HIT は 0.35（HIT は直前の値を維持する下の分岐で処理）
      }
    }

    var lastBase = 0.35; // HIT のときに維持する値

    function calcTarget() {
      var ph = G.state.phase;
      if (ph !== 'play') return 0; // title / loading / intro / win / lose
      if (lastState === KS.DEATH) return 0;
      var base;
      if (lastState === KS.HIT) base = lastBase;
      else {
        base = stateTarget();
        lastBase = base;
      }
      return duck > 0 ? base * DUCK_MUL : base;
    }

    function update(dt, t) {
      if (duck > 0) duck -= dt;
      target = calcTarget();

      var ph = G.state.phase;
      var ending = ph === 'win' || ph === 'lose' || lastState === KS.DEATH;

      if (ph === 'play' && el.paused && target > 0) play();

      if (vol < target) {
        vol += UP * dt;
        if (vol > target) vol = target;
      } else if (vol > target) {
        vol -= DOWN * dt;
        if (vol < target) vol = target;
      }
      if (vol < 0) vol = 0;
      else if (vol > 1) vol = 1;
      el.volume = vol;

      if (vol <= 0 && target === 0 && ending && !el.paused) el.pause();
    }

    function reset() {
      el.pause();
      el.currentTime = 0;
      vol = 0;
      el.volume = 0;
      target = 0;
      lastState = KS.IDLE;
      lastBase = 0.35;
      duck = 0;
    }

    G.bus.on(E.KILLER_STATE, function (e) {
      if (e && e.to) lastState = e.to;
    });
    G.bus.on(E.PLAYER_FIRE, function () {
      duck = DUCK_SEC;
    });
    G.bus.on(E.GAME_START, function () {
      play(); // クリック中に呼ばれるので再生が許可される
    });
    G.bus.on(E.GAME_RESET, reset);

    // update は core (00_core.js frame(), S6 K1) が毎フレーム呼ぶ。自前ループは持たない。

    return {
      update: update,
      reset: reset,
      stats: function () {
        statsObj.volume = vol;
        statsObj.target = calcTarget(); // イベント直後でも最新の目標を返す
        statsObj.paused = el.paused;
        statsObj.ducking = duck > 0;
        return statsObj;
      },
    };
  });
})(window);

;

G.start();
</script>
