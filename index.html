<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffe3ef">
<title>izのおもちゃ箱</title>
<script>/* iPhoneのマナーモード（消音スイッチ）に従わせる。曲（audio要素）も効果音も、消音のときは鳴らさない */try{ if(navigator.audioSession) navigator.audioSession.type="ambient"; }catch(e){}</script>
<!-- LINEなどのリンク表示: 題名だけを見せる（説明文・画像は出さない） -->
<meta name="description" content="　">
<meta property="og:type" content="website">
<meta property="og:site_name" content="izのおもちゃ箱">
<meta property="og:title" content="izのおもちゃ箱">
<meta property="og:description" content="　">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="izのおもちゃ箱">

<style>
/* ゲーム選択画面: パステルのお菓子箱。ふわふわ浮かぶ星とハート、キャンディのようなカード。作品は下の APPS の先頭に1件足すと増える（新しいものが上） */
:root{
  --sky1:#ffe3ef; --sky2:#efe4ff; --sky3:#dff6f0;
  --ink:#6b4a7a; --ink2:#9a7fa8; --white:#fffafc;
  --pink:#ff8fb8; --pinkD:#e8668f; --mint:#6fd6b8; --mintD:#3fb393; --lav:#b39cf2; --lavD:#8e72e0;
  --lemon:#ffd66b; --lemonD:#f0b93a;
  --ja: "Yu Gothic UI","游ゴシック","YuGothic","Hiragino Sans","ヒラギノ角ゴシック","Hiragino Kaku Gothic ProN",Meiryo,"Noto Sans JP",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--ja);color:var(--ink);background:linear-gradient(160deg,var(--sky1) 0%,var(--sky2) 52%,var(--sky3) 100%) fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(18px,env(safe-area-inset-top,0px)) calc(max(28px,env(safe-area-inset-bottom,0px)) + 40px);
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
/* ゲームを選ぶ枠: 背景に邪神と流血の宗教画。カードは上から並べ、カードの中は透けさせて、文字のまわりだけ濃くする */
.stage{position:relative;display:flex;flex-direction:column;gap:16px;padding:16px 14px 18px;border-radius:30px;overflow:hidden;
  background:#1a0806 url(launcher-bg.jpg) center top/cover no-repeat;border:4px solid #d9b25a;
  box-shadow:0 0 0 4px #fffafc,0 10px 0 #e6d3ea,0 20px 40px rgba(107,74,122,.25)}
.stage .sub{align-self:center}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
body.abyss #sky{z-index:9}
.wrap{position:relative;z-index:1;max-width:540px;padding-top:92px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* 見出し: リボンの帯 */
header{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px;text-align:center}
.ribbon{position:relative;display:inline-block;padding:12px 34px 14px;background:var(--pink);color:#fff;border-radius:999px;
  font-weight:800;font-size:clamp(26px,7vw,38px);letter-spacing:.12em;box-shadow:0 6px 0 var(--pinkD),0 12px 24px rgba(232,102,143,.28);
  text-shadow:0 2px 0 rgba(200,70,120,.35)}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:50%;width:22px;height:22px;background:var(--white);border-radius:50%;transform:translateY(-50%);
  box-shadow:inset 0 0 0 5px var(--lemon)}
.ribbon::before{left:-12px}.ribbon::after{right:-12px}
.ribbon .t{display:inline-block;animation:bob 3.2s ease-in-out infinite}
.sub{font-size:14px;font-weight:700;color:#fff;letter-spacing:.1em;padding:6px 18px;border-radius:999px;background:rgba(40,10,20,.62);text-align:center}
.sub b{color:var(--pink)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* 画面の名前: 左上に小さく */
.boxname{position:fixed;z-index:4;margin:0;top:max(12px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));
  padding:7px 12px;border-radius:0;background:var(--white);color:var(--ink);font:800 12px var(--ja);letter-spacing:.08em;
  box-shadow:0 3px 0 #e6d3ea,0 6px 14px rgba(107,74,122,.12)}

/* コンセプト: 名前の下に常に表示する */
.concept{position:fixed;z-index:4;margin:0;top:calc(max(12px,env(safe-area-inset-top,0px)) + 36px);left:max(12px,env(safe-area-inset-left,0px));
  max-width:min(calc(100vw - 24px),300px);padding:5px 10px 6px;border-radius:0;background:rgba(255,250,252,.82);color:var(--ink);
  font:700 11px/1.6 var(--ja);letter-spacing:.06em;box-shadow:0 2px 0 #e6d3ea;pointer-events:none}
.concept span{display:block}
.concept .wait{color:var(--ink2);font-weight:600}

/* 音楽ボタン */
.music{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:8px;padding:8px 14px 8px 12px;border:0;border-radius:999px;background:var(--white);color:var(--ink);
  font:800 13px var(--ja);letter-spacing:.06em;cursor:pointer;box-shadow:0 4px 0 #e6d3ea,0 8px 18px rgba(107,74,122,.15)}
.music:active{transform:translateY(2px);box-shadow:0 2px 0 #e6d3ea}
.music:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;height:4px;border-radius:2px;background:var(--pink)}
.music.on .eq i{animation:eq .8s ease-in-out infinite}
.music.on .eq i:nth-child(2){animation-delay:-.3s;background:var(--mint)}
.music.on .eq i:nth-child(3){animation-delay:-.55s;background:var(--lav)}
.music:not(.on) .eq i{background:#d9c8de}
/* オン・オフのスイッチ */
.sw{position:relative;width:30px;height:18px;border-radius:999px;background:#e6d3ea;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(107,74,122,.3);transition:transform .2s}
.music.on .sw{background:var(--pink)}
.music.on .sw::after{transform:translateX(12px)}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

/* カード: 1行のコンパクトな札。アイコン・名前とひとこと・向いている端末・矢印。背景の絵が透けて見える */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.app{--c:var(--pink);--cD:var(--pinkD);--cL:#ffe9f1;
  position:relative;display:flex;align-items:center;gap:12px;padding:9px 12px 9px 9px;
  background:rgba(255,250,252,.14);border-radius:20px;color:inherit;text-decoration:none;border:2px solid rgba(255,255,255,.7);
  box-shadow:0 4px 0 rgba(255,255,255,.35),0 10px 22px rgba(20,4,8,.25);transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s,border-color .18s,background .18s;
  opacity:0;transform:translateY(14px) scale(.97)}
.app.mint{--c:var(--mint);--cD:var(--mintD);--cL:#dcf6ee}
.app.lav{--c:var(--lav);--cD:var(--lavD);--cL:#ece5ff}
.app.lemon{--c:var(--lemon);--cD:var(--lemonD);--cL:#fff3cf}
.app.show{opacity:1;transform:none;transition:opacity .35s,transform .45s cubic-bezier(.3,1.6,.5,1),box-shadow .18s,border-color .18s,background .18s}
.app.sel,.app:hover,.app:focus-visible{border-color:var(--c);background:rgba(255,250,252,.3);transform:translateY(-2px);outline:none}
.app:active{transform:translateY(2px)}
.icon{flex:none;width:48px;height:48px;border-radius:15px;background:var(--c);display:grid;place-items:center;box-shadow:inset 0 -4px 0 var(--cD)}
.icon svg{width:32px;height:32px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:6px 11px;border-radius:13px;background:rgba(255,250,252,.93)}
.en{font-size:10px;font-weight:700;color:#5a3a68;letter-spacing:.08em;line-height:1.3}
.ds{font-size:15px;font-weight:700;color:#3e2448;letter-spacing:.04em}
/* 開発凍結の項目: 全体を灰色にして取り消し線 */
li.frozen{filter:grayscale(1);opacity:.55}
li.frozen .rec{display:none}
li.frozen .en,li.frozen .ds,li.frozen .dt{text-decoration:line-through;text-decoration-thickness:2px}
.nt{display:block;margin-top:3px;font-size:11.5px;font-weight:700;line-height:1.5;color:#5b4466;letter-spacing:.02em}
.dt{width:fit-content;margin:4px auto 0 10px;padding:0;background:none;font-size:7px;font-weight:400;line-height:1.4;color:rgba(255,255,255,.62);text-shadow:0 0 3px rgba(0,0,0,.75),0 0 1px rgba(0,0,0,.6);letter-spacing:.03em}
.tag{flex:none;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--cL);color:var(--cD);letter-spacing:.06em}
.rec{position:absolute;top:-9px;right:48px;padding:2px 10px;border-radius:999px;background:var(--lemon);color:#7a5a10;font-size:10px;font-weight:800;
  letter-spacing:.06em;box-shadow:0 2px 0 var(--lemonD);transform:rotate(2deg)}
.go{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);display:grid;place-items:center;box-shadow:0 3px 0 var(--cD)}
.go svg{width:13px;height:13px}

footer{text-align:center;font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.08em;display:flex;flex-direction:column;gap:4px}
footer .keys{opacity:.8}
/* 癒しの扉: 外部サイトへのリンク。作品が増えても、ページの一番下・左側に小さく置く（画面に固定せず、カードに重ならない）（by iz と同じく目立たせない） */
.ext{position:relative;z-index:4;display:grid;place-items:center;width:40px;height:40px;margin:6px 0 max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));color:var(--ink2);opacity:.7;text-decoration:none;transition:opacity .3s,color .6s}
.ext svg{width:22px;height:22px;filter:drop-shadow(0 0 2px rgba(255,250,252,.8))}
.ext:hover,.ext:focus-visible{opacity:1;outline:none}
.ext:focus-visible svg{outline:2px solid var(--lav);outline-offset:2px;border-radius:4px}
body.abyss .ext{color:#c9a35a;opacity:.55}
/* 作者の小さな署名（右下） */
.byiz{position:fixed;z-index:4;right:max(12px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));
  font:italic 600 12px/1 "Times New Roman","Liberation Serif",serif;letter-spacing:.08em;color:var(--ink2);opacity:.75;pointer-events:none;transition:opacity .6s,color .6s}
body.abyss .byiz{color:#c9a35a;opacity:.55}
@media (max-width:480px){
  .app{gap:10px}
  .ds{font-size:14px}
  footer .keys{display:none}
  .music{padding:7px 12px 7px 10px;font-size:12px}
  .wrap{padding-top:96px}
}

/* ===== 主題歌モード「ABYSS CODE」: かわいい画面が崩れ落ち、ダークファンタジーのカラオケ画面になる ===== */
#abyss{position:fixed;inset:0;z-index:8;display:none;overflow:hidden;color:#f4e6d0;background:#050104}
body.abyss #abyss{display:block}
body.abyss,html.lock,html.lock body{overflow:hidden}
html.lock .wrap{contain:paint}
.abg{position:absolute;inset:-4%;background:#050104 url(launcher-bg.jpg) center 30%/cover no-repeat;filter:brightness(.42) saturate(1.25) contrast(1.1);
  animation:abgz 40s linear infinite alternate}
@keyframes abgz{from{transform:scale(1)}to{transform:scale(1.12)}}
.abg2{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(150,0,20,.0) 0%,rgba(90,0,12,.35) 55%,rgba(5,0,3,.92) 100%),
  linear-gradient(180deg,rgba(5,0,3,.6) 0%,rgba(5,0,3,0) 30%,rgba(5,0,3,0) 70%,rgba(5,0,3,.75) 100%)}
#flash{position:absolute;inset:0;background:#ff1a2a;opacity:0;pointer-events:none;mix-blend-mode:screen}
#flash.go{animation:aflash .9s ease-out}
@keyframes aflash{0%{opacity:.85}100%{opacity:0}}
/* 題名: はじめは画面の中央に大きく、そのあと上部へ小さく移る */
#atitle{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;pointer-events:none;
  padding:calc(50vh - 130px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));opacity:0;
  transition:opacity 1.2s,padding-top 1.3s cubic-bezier(.6,0,.2,1),gap 1.3s}
#atitle.on{opacity:1}
#atitle h1{margin:0;font:700 clamp(46px,15vw,120px)/.95 "Times New Roman","Liberation Serif",serif;letter-spacing:.06em;color:#f7e3b0;
  text-shadow:0 0 18px rgba(255,40,40,.75),0 0 46px rgba(200,0,20,.6),3px 3px 0 #3a0008;transition:font-size 1.3s cubic-bezier(.6,0,.2,1)}
#atitle h1 span{display:block}
#atitle.on:not(.top) h1{animation:tin 2.6s cubic-bezier(.2,.8,.2,1) both,tglow 3s 2.6s ease-in-out infinite}
#atitle p{margin:0;font:700 clamp(17px,5vw,30px) var(--ja);letter-spacing:.32em;color:#e8b8a0;text-shadow:0 0 12px rgba(255,40,40,.6);transition:font-size 1s cubic-bezier(.6,0,.2,1)}
#atitle.on:not(.top) p{animation:tin 2.2s 1.4s cubic-bezier(.2,.8,.2,1) both}
#atitle.top{padding-top:calc(62px + env(safe-area-inset-top,0px));gap:4px}
#atitle.top h1{font-size:clamp(28px,8.5vw,46px)}
#atitle.top h1 span{display:inline;margin:0 .14em}
#atitle.top p{font-size:clamp(12px,3.4vw,16px);letter-spacing:.24em}
@keyframes tglow{50%{text-shadow:0 0 28px rgba(255,60,40,.95),0 0 70px rgba(220,0,30,.75),3px 3px 0 #3a0008}}
@keyframes tin{0%{opacity:0;transform:scale(1.35);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
/* 歌詞の枠: 古い巻物。上下の軸が開いて紙が広がる。紙と軸は計算で作った質感の画像（tools/make_scroll_textures.py）。中は自由にスクロールできる */
#scroll{position:absolute;z-index:3;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 44px));
  top:calc(150px + env(safe-area-inset-top,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:opacity .9s;
  filter:drop-shadow(0 16px 20px rgba(0,0,0,.75)) drop-shadow(0 2px 3px rgba(0,0,0,.6))}
#scroll.on{opacity:1;pointer-events:auto}
#lyr{position:absolute;left:0;right:0;top:12px;bottom:12px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:url(launcher-scroll.jpg) center/cover no-repeat #cdb27c;
  box-shadow:inset 0 0 26px rgba(70,34,8,.5),inset 0 0 2px rgba(30,12,2,.8);
  clip-path:inset(50% 0 50% 0);transition:clip-path 1.8s cubic-bezier(.6,0,.2,1);
  scrollbar-width:thin;scrollbar-color:rgba(110,60,20,.7) transparent}
#scroll.open #lyr{clip-path:inset(0 0 0 0)}
#lyr:focus-visible{outline:2px solid #ffd27a;outline-offset:-4px}
/* 紙が軸に巻き込まれて曲がる影（紙が開いてから現れる） */
#scroll::before,#scroll::after{content:"";position:absolute;left:0;right:0;z-index:1;height:54px;pointer-events:none;opacity:0;transition:opacity 1s}
#scroll::before{top:12px;background:linear-gradient(180deg,rgba(34,14,3,.7) 0%,rgba(60,30,8,.34) 34%,rgba(60,30,8,.1) 70%,transparent 100%)}
#scroll::after{bottom:12px;background:linear-gradient(0deg,rgba(34,14,3,.7) 0%,rgba(60,30,8,.34) 34%,rgba(60,30,8,.1) 70%,transparent 100%)}
#scroll.open::before,#scroll.open::after{opacity:1;transition-delay:1.3s}
/* 軸（木の棒と金の飾り）。閉じているときは真ん中で重なり、開くと上下へ分かれる */
.rod{position:absolute;z-index:2;left:-10px;right:-10px;height:24px;border-radius:12px;pointer-events:none;
  background:url(launcher-rod.jpg) center/100% 100% #4a2410;box-shadow:0 6px 12px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,220,170,.22);
  transition:transform 1.8s cubic-bezier(.6,0,.2,1)}
.rod::before,.rod::after{content:"";position:absolute;top:-5px;width:22px;height:34px;border-radius:7px;
  background:radial-gradient(ellipse 60% 38% at 38% 22%,rgba(255,250,210,.9),rgba(255,250,210,0) 70%),
    linear-gradient(90deg,#8f6420 0%,#f1d683 28%,#fff1b0 40%,#d4a640 58%,#7a5418 85%,#46300a 100%);
  box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 -3px 5px rgba(50,28,4,.55)}
.rod::before{left:-4px}.rod::after{right:-4px}
.rod.top{top:0}.rod.bot{bottom:0}
#scroll:not(.open) .rod.top{transform:translateY(var(--half,200px))}
#scroll:not(.open) .rod.bot{transform:translateY(calc(var(--half,200px) * -1))}
#lyr .in{padding:30px 26px 44px;display:flex;flex-direction:column;gap:28px}
#lyr section{display:flex;flex-direction:column;gap:4px;text-align:center;opacity:0;transform:translateY(10px);filter:blur(3px);
  transition:opacity 1s,transform 1s,filter 1s;transition-delay:calc(1.1s + var(--i,0) * .28s)}
#scroll.open #lyr section{opacity:1;transform:none;filter:none}
#lyr h2{margin:0 0 6px;font:700 13px "Times New Roman","Liberation Serif",serif;letter-spacing:.28em;color:#6e1006;text-shadow:0 1px 0 rgba(255,240,205,.28)}
#lyr h2::before,#lyr h2::after{content:"❦";font-size:12px;margin:0 .7em;color:#7a3e12;letter-spacing:0}
#lyr p{margin:0;font:800 clamp(16px,4.6vw,21px)/1.8 var(--ja);letter-spacing:.06em;color:#2a0a04;
  text-shadow:0 1px 0 rgba(255,240,205,.3)}
#lyr p.shout{font-size:clamp(20px,6vw,28px);color:#8c0c08;letter-spacing:.1em;text-shadow:0 1px 0 rgba(255,236,196,.35)}
#lyr .end{font:700 12px "Times New Roman","Liberation Serif",serif;letter-spacing:.3em;color:#6a3a14;text-align:center;opacity:.8}
#ahint{position:absolute;z-index:3;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font:700 11px var(--ja);letter-spacing:.08em;
  color:rgba(240,214,160,.7);opacity:0;transition:opacity .8s;pointer-events:none}
#ahint.on{opacity:1}
/* 下の細い再生位置の線 */
#aprogw{position:absolute;z-index:3;left:0;right:0;bottom:0;height:3px;background:rgba(200,150,90,.15);pointer-events:none}
#aprogw i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a0010,#ff4a2a,#ffd27a)}
/* ひび割れ */
#crack{position:fixed;inset:0;z-index:9;width:100%;height:100%;pointer-events:none;opacity:0}
#crack.go{animation:crk 1.2s ease-out forwards}
@keyframes crk{0%{opacity:0}8%{opacity:1}70%{opacity:.85}100%{opacity:0}}
/* 崩壊のときの揺れ */
.quake{animation:quake .5s steps(8)}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-8px,4px) rotate(-.6deg)}40%{transform:translate(7px,-5px) rotate(.5deg)}60%{transform:translate(-5px,-3px)}80%{transform:translate(6px,5px) rotate(.4deg)}}
/* 主題歌モード中のスイッチ */
.music{z-index:12}
body.abyss .music{background:rgba(24,4,8,.85);color:#f0d6a0;box-shadow:0 0 0 1px rgba(220,160,90,.45),0 0 18px rgba(255,40,30,.35)}
body.abyss .music .sw{background:#5a1018}
body.abyss .music.on .sw{background:#c41a2a}
@media (prefers-reduced-motion:reduce){.abg,#atitle.on:not(.top) h1,#atitle.on:not(.top) p,.quake{animation:none}#atitle,#atitle h1,#atitle p,#lyr,.rod,#scroll,#lyr section{transition:none}}
@media (prefers-reduced-motion:reduce){.ribbon .t,.music.on .eq i{animation:none}.app,.app.show{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<h1 class="boxname" id="boxname">izのおもちゃ箱</h1>
<p class="concept" id="concept"><span>自分が欲しかったものを、ひたすら作りまくる。</span><span class="wait">ちょっとした待ち時間にどうぞ</span></p>
<button type="button" class="music" id="music" role="switch" aria-checked="false"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="mLabel">主題歌を流す</span><span class="sw" aria-hidden="true"></span></button>
<div class="wrap">
  <section class="stage" aria-label="ゲームをえらぶ">
    <div class="sub">あそぶゲームを<b>えらんでね</b></div>
    <ul class="list" id="list"></ul>

let abyss=false, panelT=0, tickOn=false;

// 崩壊: 揺れ・ひび割れ・赤い閃光のあと、パーツが重力で落ちていく
const FALL=()=>[document.querySelector('.sub'),...items,document.querySelector('.stage'),document.querySelector('footer')];
let fallRaf=0;
function collapse(done){
  const wrap=document.querySelector('.wrap'); document.documentElement.classList.add('lock'); scrollTo(0,0);
  if(reduce){ wrap.style.opacity='0'; done(); return; }
  wrap.classList.remove('quake'); void wrap.offsetWidth; wrap.classList.add('quake');
  drawCrack(); $('crack').classList.remove('go'); void $('crack').offsetWidth; $('crack').classList.add('go');
  if(audio()){ rumble(); }
  const els=FALL(), st=els.map((el,k)=>({el,x:0,y:0,r:0,vx:(Math.random()-.5)*260,vy:-120-Math.random()*220,vr:(Math.random()-.5)*220,delay:.35+k*.06+Math.random()*.12}));
  let t0=performance.now(), last=t0;
  cancelAnimationFrame(fallRaf);
  const step=now=>{ const dt=Math.min(.05,(now-last)/1000); last=now; const el=(now-t0)/1000; let alive=false;
    st.forEach(o=>{ if(el<o.delay){ alive=true; return; } o.vy+=1500*dt; o.x+=o.vx*dt; o.y+=o.vy*dt; o.r+=o.vr*dt;
      o.el.style.transition='none'; o.el.style.transform=`translate(${o.x}px,${o.y}px) rotate(${o.r}deg)`;
      if(o.y<innerHeight*1.4) alive=true; });
    if(alive&&el<3) fallRaf=requestAnimationFrame(step); else { wrap.style.visibility='hidden'; done(); } };
  fallRaf=requestAnimationFrame(step);
}
function restoreUI(){
  cancelAnimationFrame(fallRaf);
  const wrap=document.querySelector('.wrap'); wrap.style.visibility=''; wrap.style.opacity=''; wrap.classList.remove('quake');
  FALL().forEach((el,k)=>{ el.style.transition='none'; el.style.transform='translateY(-120vh) rotate('+((Math.random()-.5)*40)+'deg)';
    void el.offsetWidth; setTimeout(()=>{ el.style.transition='transform .8s cubic-bezier(.3,1.35,.5,1)'; el.style.transform=''; },60+k*70);
    setTimeout(()=>{ el.style.transition=''; },1200+k*70); });
  setTimeout(()=>{ if(!abyss) document.documentElement.classList.remove('lock'); },1600);
}
// ひび割れの線（画面の一点から放射状に走る）
function drawCrack(){
  const c=$('crack'), d=Math.min(2,devicePixelRatio||1); c.width=innerWidth*d; c.height=innerHeight*d; const g=c.getContext('2d'); g.scale(d,d);
  const ox=innerWidth*(.35+Math.random()*.3), oy=innerHeight*(.35+Math.random()*.25);
  g.lineCap='round';
  for(let i=0;i<14;i++){ let a=i/14*Math.PI*2+Math.random()*.3, x=ox, y=oy, len=Math.max(innerWidth,innerHeight)*(.4+Math.random()*.5);
    g.beginPath(); g.moveTo(x,y);
    for(let s=0;s<len;s+=20+Math.random()*40){ a+=(Math.random()-.5)*.6; x+=Math.cos(a)*30; y+=Math.sin(a)*30; g.lineTo(x,y);
      if(Math.random()<.18){ g.moveTo(x,y); } }
    g.strokeStyle='rgba(255,255,255,.9)'; g.lineWidth=2.2; g.shadowColor='rgba(255,30,40,.9)'; g.shadowBlur=10; g.stroke(); }
}
// 低い地鳴り（効果音）
function rumble(){ const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(70,t); o.frequency.exponentialRampToValueAtTime(28,t+1.4);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.05); g.gain.exponentialRampToValueAtTime(.0001,t+1.5);
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=300; o.connect(f); f.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+1.6);
  [0,.12,.3].forEach(d=>tone(1800+Math.random()*900,d,.12,.04,'square')); }

// 演出の流れ（ミリ秒）: 崩壊 → 暗転と題名（ゆっくり現れて脈打つ）→ 題名が上へ → 巻物が開き、歌詞が上から順に浮かび上がる
const T_DARK=1100, T_TITLE_UP=8200, T_SCROLL=9500;
let exiting=false, timers=[];
function later(fn,ms){ timers.push(setTimeout(fn,reduce?Math.min(ms,800):ms)); }
function setHalf(){ const h=$('scroll').clientHeight; $('scroll').style.setProperty('--half',(h/2-12)+'px'); }
function enterAbyss(){
  if(abyss||exiting) return; abyss=true; show(true);
  timers.forEach(clearTimeout); timers=[];
  bgm.volume=.8; try{ bgm.currentTime=0; }catch(e){}
  const p=bgm.play(); if(p&&p.catch) p.catch(()=>{ exitAbyss(); });
  collapse(()=>{});
  later(()=>{ document.body.classList.add('abyss'); embers(true);
    const f=$('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    $('atitle').classList.remove('top'); $('atitle').classList.add('on'); },T_DARK);
  later(()=>{ $('atitle').classList.add('top'); },T_TITLE_UP);
  later(()=>{ setHalf(); $('lyr').scrollTop=0; $('scroll').classList.add('on'); },T_SCROLL);
  later(()=>{ $('scroll').classList.add('open'); },T_SCROLL+500);
  later(()=>{ $('ahint').classList.add('on'); },T_SCROLL+2600);
  later(()=>{ $('ahint').classList.remove('on'); },T_SCROLL+7600);
  if(!tickOn){ tickOn=true; requestAnimationFrame(tick); }
}
// 終わり方: 曲を小さくしながら、巻物が閉じて消え、題名も消える → かわいい画面が戻る
function exitAbyss(){
  if(!abyss) return; abyss=false; exiting=true; show(false);
  timers.forEach(clearTimeout); timers=[];
  const v0=bgm.volume, t0=performance.now();
  const fade=()=>{ const k=Math.min(1,(performance.now()-t0)/1100); bgm.volume=v0*(1-k); if(k<1) requestAnimationFrame(fade); else { bgm.pause(); try{ bgm.currentTime=0; }catch(e){} bgm.volume=.8; } };
  requestAnimationFrame(fade);
  $('ahint').classList.remove('on'); $('scroll').classList.remove('open');
  setTimeout(()=>{ $('scroll').classList.remove('on'); $('atitle').classList.remove('on'); },reduce?0:700);
  setTimeout(()=>{ $('atitle').classList.remove('top'); document.body.classList.remove('abyss'); embers(false); restoreUI(); exiting=false; },reduce?0:1500);
}

function tick(){ if(!abyss){ tickOn=false; return; } const d=bgm.duration||180.85; $('aprog').style.width=((bgm.currentTime||0)/d*100)+'%'; requestAnimationFrame(tick); }
// 枠の外をタップすると終わる（題名を見せている間は反応しない）
$('abyss').addEventListener('click',e=>{ if(!abyss||!$('scroll').classList.contains('open')) return; if(e.target.closest('#lyr')) return; exitAbyss(); });
document.addEventListener('keydown',e=>{ if(abyss&&e.key==='Escape') exitAbyss(); });

// ===== 効果音: ぽわん（選ぶ）、きらりん（決定） =====
let ac=null;
function audio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); return ac; }
function tone(f,t,d,v,type){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,ac.currentTime+t);
  g.gain.setValueAtTime(0,ac.currentTime+t); g.gain.linearRampToValueAtTime(v,ac.currentTime+t+.01); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);
  o.connect(g); g.connect(ac.destination); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+d+.02); }
let lastPop=0;
function pop(f){ if(!ac||ac.state!=='running') return; const n=performance.now(); if(n-lastPop<60) return; lastPop=n; tone(f,0,.18,.08,'sine'); tone(f*2,0,.12,.03,'triangle'); }
function launch(i){
  sel=i; mark();
  if(audio()){ [784,988,1319,1568].forEach((f,k)=>tone(f,k*.06,.3,.08,'triangle')); }
  bgm.pause(); burst(items[i]);
  setTimeout(()=>{ location.href=APPS[i].path; },reduce?0:420);
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); sel=(sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length; mark(); items[sel].focus(); audio(); pop(560+sel*80); }
  else if(e.key==='Enter'&&(document.activeElement===document.body||items.includes(document.activeElement))){ e.preventDefault(); launch(items.includes(document.activeElement)?items.indexOf(document.activeElement):sel); }
});

// ===== 背景: ふわふわ浮かぶ星・ハート・まる。決定するとカードから飛び散る =====
const cv=$('sky'), cx=cv.getContext('2d');
const COLS=['#ff8fb8','#6fd6b8','#b39cf2','#ffd66b','#ffffff'];
let W=0,H=0,DPR=1, parts=[], sparks=[];
let ember=false;
const EMB=['#ff3a1a','#ff7a2a','#ffc46a','#b01010','#ff5a3a'];
function embers(on){ ember=on; parts.forEach(p=>{ if(on){ p.c=EMB[Math.random()*EMB.length|0]; p.k=2; p.vy=-(30+Math.random()*70); p.r=2+Math.random()*4; p.a=.5+Math.random()*.5; } else Object.assign(p,mk()); }); }
function size(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
function mk(y){ return {x:Math.random()*W,y:y==null?Math.random()*H:y,r:5+Math.random()*9,k:Math.random()*3|0,c:COLS[Math.random()*COLS.length|0],
  vy:reduce?0:-(6+Math.random()*12),sw:Math.random()*6.28,sp:reduce?0:.6+Math.random()*.8,rot:Math.random()*6.28,vr:reduce?0:(Math.random()-.5)*.6,a:.35+Math.random()*.35}; }
function shape(k,r){
  cx.beginPath();
  if(k===0){ for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, q=i%2?r*.45:r; cx.lineTo(Math.cos(a)*q,Math.sin(a)*q); } cx.closePath(); }
  else if(k===1){ cx.moveTo(0,r*.9); cx.bezierCurveTo(-r*1.3,-r*.1,-r*.6,-r*1.1,0,-r*.35); cx.bezierCurveTo(r*.6,-r*1.1,r*1.3,-r*.1,0,r*.9); }
  else cx.arc(0,0,r*.6,0,6.283);
  cx.fill();
}
function burst(el){
  if(reduce) return; const b=el.getBoundingClientRect();
  for(let i=0;i<26;i++){ const a=Math.random()*6.283, s=120+Math.random()*260;
    sparks.push({x:b.left+b.width*(.2+Math.random()*.6),y:b.top+b.height/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,r:4+Math.random()*7,k:Math.random()*3|0,c:COLS[Math.random()*4|0],t:0,rot:0}); }
}
let last=0;
function frame(t){
  const dt=Math.min(.05,(t-(last||t))/1000); last=t;
  cx.clearRect(0,0,W,H);
  parts.forEach(p=>{
    p.y+=p.vy*dt; p.sw+=dt*p.sp; p.rot+=p.vr*dt; if(p.y<-20){ Object.assign(p,mk(H+20)); if(ember){ p.c=EMB[Math.random()*EMB.length|0]; p.k=2; p.vy=-(30+Math.random()*70); p.r=2+Math.random()*4; } }
    cx.save(); cx.translate(p.x+Math.sin(p.sw)*14,p.y); cx.rotate(p.rot); cx.globalAlpha=ember?p.a*(.6+Math.random()*.4):p.a; cx.fillStyle=p.c; if(ember){ cx.shadowColor=p.c; cx.shadowBlur=8; } shape(p.k,p.r); cx.restore();
  });
  sparks=sparks.filter(s=>(s.t+=dt)<.9);
  sparks.forEach(s=>{ s.vy+=520*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.rot+=dt*6;
    cx.save(); cx.translate(s.x,s.y); cx.rotate(s.rot); cx.globalAlpha=1-s.t/.9; cx.fillStyle=s.c; shape(s.k,s.r); cx.restore(); });
  requestAnimationFrame(frame);
}
size(); addEventListener('resize',size);
parts=Array.from({length:reduce?14:Math.min(34,Math.round(W*H/22000))},()=>mk());
if(reduce){ frame(0); } else requestAnimationFrame(frame);
// ほかのページから戻ってきたとき（ブラウザの戻る）に、飛び散りを消して状態を戻す
addEventListener('pageshow',e=>{ if(e.persisted){ sparks=[]; if(abyss) exitAbyss(); } });
</script>
</body>
