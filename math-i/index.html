<script>
// 制作: dizz が制作しました
const S=s=>`<svg viewBox="0 0 320 200" role="img">${s}</svg>`;
const T=(x,y,t)=>`<text x="${x}" y="${y}">${t}</text>`;
const area=(c1,c2,r1,r2,c)=>{const w=[130,80],h=[90,60];let s='',y=24;
 s+=T(50+65,16,c1)+T(50+130+40,16,c2);
 [0,1].forEach(i=>{let x=50;s+=T(32,y+h[i]/2+5,i?r2:r1);[0,1].forEach(j=>{s+=`<rect class="r" x="${x}" y="${y}" width="${w[j]}" height="${h[i]}"/>`+T(x+w[j]/2,y+h[i]/2+5,c[i*2+j]);x+=w[j]});y+=h[i]});return S(s)};
const nl=(x,o,d)=>{let s='<line x1="10" y1="100" x2="310" y2="100" stroke="currentColor"/>';
 for(let i=-5;i<=5;i++)s+=`<line x1="${160+i*28}" y1="95" x2="${160+i*28}" y2="105" stroke="currentColor"/>`+T(160+i*28,125,i);
 const p=160+x*28;return S(s+`<line x1="${p}" y1="100" x2="${d>0?310:10}" y2="100" stroke="var(--ac)" stroke-width="5"/><circle cx="${p}" cy="100" r="6" fill="${o?'var(--bg)':'var(--ac)'}" stroke="var(--ac)" stroke-width="2"/>`)};
const gr=(a,h,k,ex='')=>{let s='<line x1="0" y1="110" x2="320" y2="110" stroke="currentColor"/><line x1="100" y1="0" x2="100" y2="200" stroke="currentColor"/>'+T(110,124,'O')+T(308,104,'x')+T(112,12,'y'),d='';
 for(let x=-3;x<=7;x+=.25)d+=(d?'L':'M')+(100+x*30)+','+(110-(a*(x-h)**2+k)*30);
 return S(s+`<path d="${d}" fill="none" stroke="var(--ac)" stroke-width="3"/>`+ex)};
const venn=S(`<circle cx="125" cy="100" r="62" fill="var(--ac)" fill-opacity=".3" stroke="var(--ac)"/><circle cx="195" cy="100" r="62" fill="var(--ac)" fill-opacity=".3" stroke="var(--ac)"/>`+T(90,104,'A')+T(230,104,'B')+T(160,98,'A∩B')+T(160,185,'A∪B ＝ 全体の色つき部分'));
const sub=S(`<circle cx="160" cy="100" r="88" fill="none" stroke="var(--ac)" stroke-width="2"/><circle cx="135" cy="100" r="48" class="r"/>`+T(135,105,'P')+T(228,105,'Q')+T(160,196,'Pの中はすべてQの中 ＝ P⇒Q'));
const tri=S(`<polygon points="40,170 260,170 260,50" fill="var(--hl)" stroke="var(--ac)" stroke-width="2"/><rect x="246" y="156" width="14" height="14" fill="none" stroke="currentColor"/>`+T(95,163,'θ')+T(150,190,'隣辺')+T(290,115,'対辺')+T(135,100,'斜辺'));
const box=S(`<line x1="30" y1="80" x2="294" y2="80" stroke="currentColor"/><rect class="r" x="74" y="55" width="132" height="50"/><line x1="140" y1="55" x2="140" y2="105" stroke="var(--ac)" stroke-width="3"/>`+[[30,'最小'],[74,'Q1'],[140,'中央値'],[206,'Q3'],[294,'最大']].map(a=>T(a[0],130,a[1])).join('')+T(140,170,'箱の中に真ん中の50%のデータ'));
const L=[
{n:'展開と因数分解',g:['アル＝フワーリズミー','9世紀・代数学の父','📜'],s:[
['公式は「面積」で見える','おお、よく来たな。まず(a+b)²を<b>正方形の面積</b>として見てみよう。一辺がa+bの正方形を切り分けると、a²・ab・ab・b²の4つの部分になる。<p>全部足すと <b>a²＋2ab＋b²</b>。つまり公式は暗記ではなく、<b>面積の足し算</b>だったのだ。</p>',area('a','b','a','b',['a²','ab','ab','b²'])],
['展開＝切って足す','(x＋3)(x＋2) を同じ要領で。たて x と 2、よこ x と 3 の長方形を4つに分ける。<p>x²＋3x＋2x＋6 ＝ <b>x²＋5x＋6</b>。「全部の組み合わせを1つずつかける」これが分配法則だ。かけ忘れがないよう、4つの部屋を数えよう。</p>',area('x','3','x','2',['x²','3x','2x','6'])],
['因数分解＝逆再生','x²＋5x＋6 を因数分解するとは、この面積を<b>1つの長方形に並べ直す</b>こと。<p>見つけ方：<b>かけて6、たして5</b>になる2数を探す。→ 2と3。だから <b>(x＋2)(x＋3)</b>。</p><p>検算は展開して元に戻れば完璧だ。</p>',area('x','3','x','2',['x²','3x','2x','6'])]]},
{n:'平方根',g:['ピタゴラス','紀元前6世紀・三平方の定理','📐'],s:[
['√ってなに？','2乗するとaになる数をaの<b>平方根</b>という。面積2の正方形の一辺を考えよう。1×1の正方形の対角線は三平方の定理で 1²＋1²＝2 だから、長さは<b>√2</b>。<p>aの平方根は＋と－の2つ（±√a）。ただし記号√aは<b>正のほう</b>だけを指す。</p>',S(`<rect class="r" x="90" y="30" width="120" height="120"/><line x1="90" y1="150" x2="210" y2="30" stroke="var(--ac)" stroke-width="3"/>`+T(150,175,'1')+T(78,95,'1')+T(168,80,'√2'))],
['計算ルール','<b>√a×√b＝√(ab)</b>。これで根号の中を整理できる。<p>√12 ＝ √(4×3) ＝ <b>2√3</b>。コツは「<b>2乗の形（4, 9, 16…）</b>を中から外に出す」こと。</p><p>注意：√2＋√3 は √5 にならない。たし算は<b>同じ√どうし</b>だけ（2√3＋√3＝3√3）。</p>'],
['有理化','1/√2 のように分母に√があるときは、<b>分母分子に同じ数をかけて</b>分母を整数にする。<p>1/√2 ＝ (1×√2)/(√2×√2) ＝ <b>√2/2</b>。</p><p>同じ数を分母分子にかけるのは、1をかけるのと同じだから値は変わらない。</p>']]},
{n:'1次不等式',g:['アイザック・ニュートン','17世紀・万有引力','🍎'],s:[
['数直線で見る','x＞2 は「2より大きい」すべての数。数直線に描くと、2は含まないので<b>白丸○</b>、右へ線を伸ばす。<p>x≧2 なら2を含むので<b>黒丸●</b>。</p>',nl(2,true,1)],
['符号が逆になる瞬間','解き方は方程式と同じ。ただし<b>負の数でかける・わるときだけ、不等号の向きが逆</b>になる。<p>例：−2x＜6 → 両辺を−2でわって <b>x＞−3</b>。</p><p>理由：1＜2 の両辺に−1をかけると −1＞−2 になる。数直線で左右が反転するからだ。</p>',nl(-3,true,1)],
['連立と共通部分','2つの条件をどちらも満たす範囲＝<b>共通部分</b>。数直線を2本重ねて、線が重なる所を読む。<p>例：x＞−1 かつ x≦3 なら <b>−1＜x≦3</b>。</p>']]},
{n:'集合と命題',g:['ジョン・ベン','19世紀・ベン図の考案者','⭕'],s:[
['集合とベン図','ものの集まりが<b>集合</b>。重なりを図にしたのがベン図だ。<p><b>A∩B</b>（共通部分）＝ どちらにも入る。<b>A∪B</b>（和集合）＝ どちらかに入る。</p><p>「∩はand、∪はor」と覚えよう。</p>',venn],
['補集合','全体Uの中で<b>Aに入らないもの</b>が補集合 Ā。<p>ド・モルガンの法則：<b>A∩Bの補集合 ＝ Āの∪B̄</b>、<b>A∪Bの補集合 ＝ Ā∩B̄</b>。「全体を否定すると ∩と∪が入れかわる」。ベン図を塗って確かめるのが一番確実。</p>'],
['命題と包含関係','「pならばq」が<b>真</b>とは、pを満たすものがすべてqも満たすこと。ベン図ではPがQの<b>中に入る</b>。<p>このとき pはqであるための<b>十分条件</b>、qはpであるための<b>必要条件</b>。</p><p>反例が1つあれば偽。</p>',sub]]},
{n:'2次関数',g:['ルネ・デカルト','17世紀・座標の発明者','🧭'],s:[
['放物線 y＝ax²','式を座標に描くのがデカルトの発明だ。y＝x² は原点が頂点の<b>放物線</b>。<p>a＞0 なら下に凸（∪）、a＜0 なら上に凸（∩）。|a|が大きいほど細くとがる。</p>',gr(1,0,0)],
['平方完成＝頂点を見つける','y＝x²−4x＋3 を <b>y＝a(x−p)²＋q</b> の形に直す。<p>x²−4x ＝ (x−2)²−4 だから y＝(x−2)²−4＋3 ＝ <b>(x−2)²−1</b>。</p><p>頂点は <b>(p, q)＝(2, −1)</b>、軸は x＝2。y＝x²を<b>右に2、下に1</b>動かしたもの。</p>',gr(1,2,-1,`<line x1="160" y1="0" x2="160" y2="200" stroke="var(--ac)" stroke-dasharray="4"/><circle cx="160" cy="140" r="5" fill="var(--ac)"/>`+T(200,150,'頂点(2,−1)'))],
['x軸との共有点','y＝0 とした2次方程式の解がx軸との交点。<b>判別式 D＝b²−4ac</b>で数がわかる。<p>D＞0 → 2点、D＝0 → 接する（1点）、D＜0 → 共有点なし。</p><p>例：x²−4x＋3＝0 は (x−1)(x−3)＝0 で x＝1, 3。図の2点だ。</p>',gr(1,2,-1,`<circle cx="130" cy="110" r="5" fill="var(--ac)"/><circle cx="190" cy="110" r="5" fill="var(--ac)"/>`+T(130,100,'1')+T(190,100,'3'))]]},
{n:'三角比',g:['ヒッパルコス','紀元前2世紀・三角法の父','🌟'],s:[
['sin・cos・tan','直角三角形で、角θに注目して辺に名前をつける。<p><b>sinθ＝対辺/斜辺</b>、<b>cosθ＝隣辺/斜辺</b>、<b>tanθ＝対辺/隣辺</b>。</p><p>相似な三角形なら大きさが違っても比は同じ。だから「角度だけ」で決まる。</p>',tri],
['覚えるべき値','θ＝30°, 45°, 60° は三角定規の形から作れる。<p><b>30°：</b>sin＝1/2、cos＝√3/2、tan＝1/√3<br><b>45°：</b>sin＝cos＝1/√2、tan＝1<br><b>60°：</b>sin＝√3/2、cos＝1/2、tan＝√3</p><p>辺の比 1：2：√3（30°・60°）、1：1：√2（45°）を書いて読み取ろう。</p>'],
['正弦・余弦定理','直角でない三角形にも使える2つの道具。<p><b>正弦定理</b> a/sinA＝b/sinB＝2R（Rは外接円の半径）。「角と対辺のペア」がわかるとき。</p><p><b>余弦定理</b> a²＝b²＋c²−2bc·cosA。「2辺とそのはさむ角」または「3辺」がわかるとき。</p><p>A＝90°なら cosA＝0 で三平方の定理に戻る。</p>']]},
{n:'データの分析',g:['F・ナイチンゲール','19世紀・統計図の先駆者','🕯️'],s:[
['代表値','<b>平均値</b>＝合計÷個数。<b>中央値</b>＝大きさ順で真ん中（偶数個なら中央2つの平均）。<b>最頻値</b>＝最も多い値。<p>極端に大きい値（外れ値）があると平均は引っぱられるが、中央値はほとんど動かない。</p>'],
['四分位数と箱ひげ図','データを順に並べ4等分する。<b>Q1</b>（第1四分位）、<b>Q2＝中央値</b>、<b>Q3</b>。<p>四分位範囲 ＝ Q3−Q1。箱の幅が<b>ちらばりの目安</b>になる。</p>',box],
['分散と標準偏差','各値と平均との差（偏差）を2乗して平均したものが<b>分散</b>。その正の平方根が<b>標準偏差</b>。<p>分散 ＝ (xの2乗の平均) − (xの平均)²。</p><p>値が小さいほど平均のまわりに集まっている。</p>']]}

const EV=[['農夫の困りごと','案内役のフワーリズミーのもとへ、農夫が駆け込んできた。<p>「畑の面積は <b>x²＋5x＋6</b> ㎡だと聞きました。でも<b>縦と横の長さ</b>がわからず、柵が買えません…！」</p>',['🌾','😰','📏','❓']],['庭のロープ事件','弟子のひとりが泣きついてきた。ピタゴラスは眉をひそめる。<p>「1辺3mの正方形の庭に、<b>対角線のロープ</b>を張りたい。でも長さが、整数でも分数でも表せないんです！」</p>',['🏡','🧵','😵','❓']],['お小遣い大作戦','ニュートンのもとへ、少年が相談に来た。<p>「貯金は1200円。毎週300円ずつ貯めます。<b>3000円を超えたら</b>ゲームを買いたい。何週目からですか？」</p>',['🎮','💰','📆','❓']],['クラスのアンケート事件','ジョン・ベンが首をかしげている。<p>クラス40人で調査：犬好き<b>25人</b>、猫好き<b>18人</b>、<b>両方好き10人</b>。先生「<b>どちらも好きでない人</b>は何人？」…合計が40を超えてしまう！</p>',['🐶','🐱','📋','❓']],['ハーフパイプの深さ事件','スケボー少年がデカルトに質問した。<p>「U字の断面が <b>y＝x²−4x＋3</b> の形の練習場。<b>いちばん低い所</b>は、どこで何mの深さ？」</p>',['🛹','🌀','📉','❓']],['木の高さ事件','ヒッパルコスの元に、旅人が来た。<p>「木から<b>10m</b>離れて見上げたら、角度が<b>30°</b>でした。<b>登らずに</b>高さを知るには？」</p>',['🌳','👀','📐','❓']],['病院の待ち時間事件','ナイチンゲールは病院の記録を見て悩んでいる。<p>待ち時間は、ほとんどが<b>3〜8分</b>。ところが<b>1人だき40分</b>。「<b>平均</b>で報告すると、実態が伝わらない気がするのです」</p>',['🏥','⏰','📊','❓']],['門限の範囲事件','ガウスが見ているのは、地図つきの門限メモ。<p>「家（0km）から<b>3km以内</b>なら、東でも西でも遊びに行っていい」。<b>東西どこまで</b>行ける？</p>',['🏠','🚶','⭕','❓']],['水路の浸水事件','オイラーが地面の断面図を広げた。<p>水路の底が <b>y＝x²−4x＋3</b> の形。水面が <b>y＝0</b>。<b>水に浸かっている幅</b>はどこからどこまで？</p>',['💧','🚧','🌊','❓']],['三角形の土地事件','ヘロンのもとに、税務官が土地の図面を持ってきた。<p>三角形の土地：<b>2辺が110mと130m</b>、その間の角が<b>60°</b>。<b>面積</b>がわからないと、税金が決まらない！</p>',['📜','🔺','💴','❓']]];
const AP=[['畑の縦と横を見つけよう','x²＋5x＋6 を因数分解：<b>かけて6・たして5</b> → 2と3。<p>よって <b>(x＋2)(x＋3)</b>。縦 x＋2、横 x＋3 だ！</p><p>x＝3m なら 5m×6m＝30㎡。式の値 9＋15＋6＝30 とも一致。図の x を動かして確かめよう。</p>','01'],['ロープの長さを出そう','三平方の定理：対角線²＝3²＋3²＝18 → 対角線＝<b>√18＝3√2</b>。<p>√2≈1.414 だから 3√2≈<b>4.24m</b>。ロープは余裕をみて4.3m用意すればよい。</p><p>図の「1辺」を3にして、対角線を確かめよう。</p>','10'],['何週目から買える？','週数を x とすると <b>1200＋300x＞3000</b>。<p>1200を移して 300x＞1800、300でわって <b>x＞6</b>（正の数でわるので向きはそのまま）。</p><p>つまり<b>7週目から</b>。図の a を6にして、6 は白丸（含まない）を確かめよう。</p>','20'],['ベン図で数えよう','25＋18 だと「両方」の10人を<b>2回</b>数えてしまう。だから <b>25＋18−10＝33人</b>（犬か猫）。<p>40−33＝<b>7人</b>が、どちらにも入らない人。</p><p>図の領域を4（どちらにも入らない）にすると、この7人の場所が塗られるよ。</p>','30'],['一番低い所を探せ','平方完成：y＝(x−2)²−1。<p>頂点は <b>(2, −1)</b>。<b>x＝2 の所が最低点</b>で、基準より1m低い。</p><p>図の p＝2、q＝−1 のとき、頂点が実際にその位置に来るのを確かめよう。</p>','41'],['登らずに測れる','高さ＝10×tan30°。<p>tan30°＝<b>1/√3</b>だから、高さ＝10/√3≈<b>5.8m</b>（目の高さは除く）。</p><p>図を30°にして、対辺÷隣辺 が 1/√3 になるのを確かめよう。</p>','51'],['どちらで伝える？','データ 3,4,5,6,7,8,40 の平均は73÷7≈<b>10.4分</b>、中央値は<b>6分</b>。<p>大半の人の実態に近いのは<b>中央値</b>。外れ値に引っぱられないのが強み。</p><p>図の外れ値を40にして、平均だけが右へ動くのを確かめよう。</p>','60'],['行ける範囲を求めよう','「3km以内」は距離なので <b>|x|≦3</b>。<p>あいだなので <b>−3≦x≦3</b>。西3km〜東3kmまで。</p><p>図は a＝3、向き0。（図の白丸は等号なし。今回は端も含むので黒丸と考えよう）</p>','71'],['浸かる範囲を読もう','浸かる＝グラフが水面より<b>下</b>＝ <b>y＜0</b>。x²−4x＋3＜0 → (x−1)(x−3)＜0 → <b>1＜x＜3</b>。<p>幅は3−1＝<b>2m</b>。</p><p>図の向きを0にして、下の部分が塗られるのを確かめよう。</p>','81'],['面積を出そう','S＝½ab sinC＝½×110×130×sin60°。<p>sin60°＝√3/2≈0.866 なので、S≈<b>6192㎡</b>。</p><p>図の角Cを60°にして、面積の表示と一致するのを確かめよう。</p>','90']];

const ZB={
'公式は「面積」で見える':`🌱 <b>文字ってなに？</b>　a や x は「まだ決まっていない数」を入れておく<b>箱</b>。「りんご x 個」の x は、3でも10でもよい。<p>🏞️ <b>たとえ話</b>：1辺 a の正方形の畑の横に、1辺 b の畑をくっつけて、1辺 <b>a＋b</b> の大きな正方形の畑を作る。</p><p>📐 面積は<b>たて×よこ</b>。大きな畑を切り分けると、<b>a²・ab・ab・b²</b> の4枚。全部足すと <b>(a＋b)²＝a²＋2ab＋b²</b>。</p><p>⚠️ よくある間違い：a²＋b² と書いてしまう。細長い2枚（<b>2ab</b>）を忘れないで！</p>`,
'展開＝切って足す':`🌱 <b>展開</b>とは、かっこを外して<b>ばらばらの足し算の形</b>にすること。<p>🍬 <b>たとえ話</b>：(x＋3) 人の子に、1人 (x＋2) 個ずつお菓子を配ると全部で何個？ → (x＋3)×(x＋2) 個。</p><p>📐 図の4つの部屋の面積を足す：<b>x·x ＋ x·2 ＋ 3·x ＋ 3·2</b>。「全部の組み合わせを1回ずつ」かけるのがコツ。</p><p>🧩 そのあと<b>同類項</b>（同じ文字・同じ乗数の仲間）をまとめる：2x＋3x＝<b>5x</b>。結果は <b>x²＋5x＋6</b>。x と x² は仲間ではないので足せない。</p>`,
'因数分解＝逆再生':`🌱 <b>因数分解</b>＝展開の<b>逆</b>。ばらばらの式を、かけ算の形に<b>まとめ直す</b>。たとえば 12 を 3×4 とまとめるのと同じ。<p>🔍 <b>探し方</b>：x²＋5x＋6 なら、「<b>かけて6になる2数</b>のうち、<b>たして5</b>になるもの」。<br>6の組：1×6、2×3 → 2＋3＝5 ✔ だから <b>(x＋2)(x＋3)</b>。</p><p>✅ <b>検算</b>：展開して元の式に戻れば OK。図は同じ面積を1つの長方形に並べ直したものだ。</p>`,
'√ってなに？':`🌱 <b>2乗</b>＝同じ数を2回かける（3の2乗は 3×3＝9）。<b>平方根</b>はその<b>逆</b>：「2乗して9になる数は？」の答えが 9 の平方根。<p>🟩 <b>たとえ話</b>：面積9㎡の正方形の畑の1辺は？ → 3m。面積2㎡なら？ ピッタリの数がない → そこで記号 <b>√2</b>（ルート2）を作った！ だいたい 1.414。</p><p>📌 <b>√a</b> は「2乗するとaになる、0以上の数」。a の平方根は＋と−の2つ（±√a）ある。対角線の図で 1辺×√2 を確かめよう。</p>`,
'数直線で見る':`🌱 <b>不等号</b>：＞は「大きい」、＜は「小さい」（口が開いたほうが大きい）。<p>🌡️ <b>たとえ話</b>：「気温が 25℃ より高い」→ x＞25。25℃ちょうどは<b>含まない</b>。「25℃以上」なら x≧25（含む）。</p><p>📏 <b>数直線</b>：線の上で右へ行くほど大きい。含まない端は<b>白丸○</b>、含む端は<b>黒丸●</b>。あてはまる範囲を太い線で描く。</p>`,
'集合とベン図':`🌱 <b>集合</b>＝条件ではっきり決まる「ものの集まり」。例：クラスで犬好きな人の集まり A。<p>🔵 <b>ベン図</b>：集まりを<b>丸</b>で描く。犬好きAと猫好きBの2つの丸が重なった所が「両方好きな人」。</p><p>🔤 <b>∩（かつ）</b>＝重なりだけ。<b>∪（または）</b>＝どちらかに入る全部。∪はコップの形で「どちらも入れる」、∩は帽子の形で「共通部分をかぶせる」。図で塗り分けてみよう。</p>`,
'放物線 y＝ax²':`🌱 <b>関数</b>＝x を決めると y が1つ決まるルール。y＝x² は「xの2乗が y」。<p>📋 x＝−2,−1,0,1,2 → y＝4,1,0,1,4。表にして点を打つと、なめらかなU字＝<b>放物線</b>になる。</p><p>⚽ ボールを投げた軌跡も放物線！ <b>a＞0</b> なら下に凸（U）、<b>a＜0</b> なら上に凸（∩）。|a| が大きいほど細くとがる。スライダーで確かめよう。</p>`,
'sin・cos・tan':`🌱 三角比＝<b>坂道の急さ</b>を数にしたもの。<p>⛰️ <b>たとえ話</b>：坂を 100m 進むと何m上がる？ → これが sin（上がる高さ÷進んだ道のり）。角度が決まれば坂の急さは同じなので、大きさが違っても比は同じ。</p><p>🏷️ <b>名前の付け方</b>：角θの<b>向かい側</b>＝対辺、<b>となり</b>＝隣辺、<b>斜め</b>（直角の向かい）＝斜辺。<br><b>sin＝対÷斜、cos＝隣÷斜、tan＝対÷隣</b>。筆記体の s・c・t を書くと、分母→分子の順になぞりやすい。</p>`,
'代表値':`🌱 データが何十個もあると読めない。そこで<b>1つの数で代表させる</b>のが代表値。<p>📊 <b>例</b>：5人のテスト 60,70,70,80,100 → <b>平均</b>＝380÷5＝76点、<b>中央値</b>＝並べて真ん中の70点、<b>最頻値</b>＝いちばん多い 70点。</p><p>🛍️ 「平均」は大金持ちが1人いると上がってしまう（外れ値に弱い）。そんなときは中央値。スライダーで確かめよう。</p>`,
'絶対値は「距離」':`🌱 <b>絶対値</b>＝符号をとった大きさ（距離）。<p>🚶 <b>たとえ話</b>：家から東に3km行っても、西に3km行っても、<b>歩いた距離はどちらも 3km</b>。だから |3|＝3、|−3|＝3。</p><p>📌 ルール：0以上ならそのまま。負なら <b>−をつけて正</b>にする（x＜0 のとき |x|＝−x）。スライダーで距離の線を見よう。</p>`,
'グラフで符号を見る':`🌱 2次不等式＝「2次の式が<b>正か負か</b>」を問う問題。<p>🏞️ <b>たとえ話</b>：地面の高さ0より上か下か。グラフがx軸より<b>上</b>なら ＞0、<b>下</b>なら ＜0。</p><p>🔍 境目は x軸と交わる点（y＝0）。y＝x²−4x＋3＝(x−1)(x−3) なら境目は <b>x＝1, 3</b>。まず境目を求め、U字を描いて上下を読む。点を動かして符号の変わる所を見よう。</p>`,
'½ab sinC':`🌱 三角形の面積＝<b>底辺×高さ÷2</b>（長方形を半分にする）。<p>🧱 でも高さがわからないことが多い。そこで三角比！斜めの辺 b と角Cがわかれば、<b>高さ＝b×sinC</b>。</p><p>➕ 代入すると <b>S＝½ab sinC</b>。「2辺と、その間の角」から面積が出る道具だ。角Cを動かして、高さと面積を見よう。</p>`

'たすきがけ（2x²の因数分解）':`🌱 x² の前に数が付く（2x²）と、「かけて・たして」だけでは探しにくい。<p>🔍 (2x＋p)(x＋q) と置いて、展開してみよう。真ん中は <b>2q＋p</b>、最後は <b>p×q</b> になる。</p><p>🎯 今回の目標は 2x²＋7x＋3。だから <b>p×q＝3</b>、<b>2q＋p＝7</b> の組を探す。</p><p>✖️ 図の×印は「2×q」と「p×1」をななめにかけて足す印。これが たすき だ。</p><p>🕹️ p と q を動かして、2つの値がぴったり 3 と 7 になる所を見つけよう。</p>`,
'計算ルール':`🌱 √ の中に<b>平方数</b>（4, 9, 16, 25…＝何かの2乗）が隠れていたら、外に出せる。<p>🧮 √12 を例に。12＝<b>4×3</b>。4は2の2乗だ。</p><p>📦 √(4×3)＝√4×√3＝<b>2√3</b>。2乗の数は、外へ出ると ふつうの数になる。</p><p>⚠️ たし算は別。√2＋√3 は √5 にならない。同じ√どうしなら 2√3＋√3＝3√3 と足せる（りんゔ2個＋りんゔ1個と同じ）。</p><p>🕹️ 数を選んで、変形の前と後で値が同じことを確かめよう。</p>`,
'有理化':`🌱 1/√2 のように、<b>分母に√がある</b>と、数の大きさが つかみにくい。<p>✨ そこで分母から√を追い出す。これが<b>有理化</b>。</p><p>🔑 ワザは「<b>1をかける</b>」こと。√2/√2 は 1 だから、かけても値は変わらない。</p><p>🧮 1/√2 × √2/√2 ＝ √2/(√2×√2) ＝ <b>√2/2</b>。分母が ふつうの数になった！</p><p>🕹️ n を動かして、上下の棒の長さ（＝値）が変わらないことを見よう。</p>`,
'符号が逆になる瞬間':`🌱 不等式は、ほとんど方程式と同じように解ける。<p>🔄 移項すると符号が変わる（x＋2＞5 → x＞5−2）。両辺に同じ正の数をかけたりわったりしてもよい。</p><p>⚠️ ただし<b>マイナスの数</b>でかける・わるときだけ、向きが<b>逆</b>になる。</p><p>🧪 実験：1＜2 は正しい。両辺に −1 をかけると −1 と −2。−1 のほうが右にあるので −1＞−2 だ。向きが逆になった！</p><p>🧮 −2x＜6 は −2 でわって <b>x＞−3</b>。</p>`,
'連立と共通部分':`🌱 条件が2つある不等式を<b>連立</b>という。<p>🤝 「AかつB」は、<b>両方</b>当てはまること。</p><p>📏 数直線を2本描いて、それぞれの範囲を太くする。<b>太い線が重なった所</b>が答え。</p><p>🧮 例：x＞−1 かつ x≦3 なら、重なりは <b>−1＜x≦3</b>。</p>`,
'補集合':`🌱 全体の集まりを U とする。A に<b>入らないもの</b>全部が、A の<b>補集合</b>（Ā）。<p>🏫 例：クラス全員が U、犬好きが A なら、Ā は「犬好きでない人」。</p><p>🔁 面白い法則：「A または B ではない」と「A でないかつ B でない」は同じ。∪ と ∩ が入れかわる（ド・モルガンの法則）。</p><p>🖍️ 迷ったら、ベン図を塗って確かめよう。</p>`,
'命題と包含関係':`🌱 <b>命題</b>＝正しいか間違いかがはっきり言える文。例：「4の倍数ならば偶数」。<p>✅ 「ならば」の文が<b>真</b>とは、前の条件を満たすものが<b>全部</b>後ろも満たすこと。</p><p>🔵 ベン図では、P の丸が Q の丸の<b>中にすっぽり入る</b>形。</p><p>❌ 1つでも外れる例（反例）があれば<b>偽</b>。「偶数ならば 4の倍数」は、6が反例。</p><p>🏷️ P⇒Q のとき、P は Q であるための<b>十分条件</b>。Q は P であるための<b>必要条件</b>。</p>`,
'平方完成＝頂点を見つける':`🌱 放物線の<b>いちばん低い（高い）点</b>＝頂点を見つけたい。<p>🔧 そのために y＝(x−p)²＋q の形に直す。これが<b>平方完成</b>。</p><p>🧮 x²−4x なら、半分の −2 を使って (x−2)²−4。（(x−2)²＝x²−4x＋4 なので、足しすぎた 4 を引く）</p><p>📍 y＝x²−4x＋3 ＝(x−2)²−4＋3＝<b>(x−2)²−1</b>。</p><p>🎯 頂点は <b>(2, −1)</b>。y＝x² を<b>右に2、下に1</b>動かしたものだ。</p>`,
'x軸との共有点':`🌱 グラフがx軸と交わる所は、<b>y＝0</b> の所。<p>🧮 だから x²−4x＋3＝0 を解く。因数分解して (x−1)(x−3)＝0。</p><p>💡 「かけて0」なら、どちらかが0。だから <b>x＝1 または 3</b>。これが交点の位置。</p><p>🔮 解がいくつあるかは<b>判別式 D＝b²−4ac</b> でわかる。<b>D＞0 → 2点、D＝0 → 1点（接する）、D＜0 → なし</b>。</p><p>🕹️ c を動かして、グラフとx軸の関係が変わるのを見よう。</p>`,
'覚えるべき値':`🌱 暗記する前に、<b>三角定規</b>を思い出そう。<p>📐 30°・60°の定規は、辺の比が <b>1：√3：2</b>。45°の定規は <b>1：1：√2</b>。</p><p>🔍 あとは sin＝対÷斜、cos＝隣÷斜、tan＝対÷隣 に当てはめるだけ。</p><p>🧮 30°なら 対辺1・隣辺√3・斜辺2 → sin30°＝1/2、cos30°＝√3/2、tan30°＝1/√3。</p><p>🕹️ 角度を切り替えて、辺の比から値を読み取ってみよう。</p>`,
'正弦・余弦定理':`🌱 三角比は直角三角形で習った。でも、直角のない三角形でも使いたい！<p>🛠️ そのための2つの道具がある。</p><p>🔹 <b>正弦定理</b>：a/sinA＝b/sinB＝2R。「角とその向かいの辺」のペアがわかるときに使う。</p><p>🔹 <b>余弦定理</b>：a²＝b²＋c²−2bc·cosA。「2辺とはさむ角」か「3辺」がわかるときに使う。</p><p>🔎 A＝90°なら cosA＝0 で、三平方の定理 a²＝b²＋c² にもどる。</p>`,
'四分位数と箱ひげ図':`🌱 データを小さい順に並べて、<b>4等分</b>するイメージ。<p>✂️ 真ん中で切る → <b>中央値</b>。</p><p>✂️ 前半の真ん中が <b>Q1</b>、後半の真ん中が <b>Q3</b>。</p><p>📦 Q1 から Q3 までが<b>箱</b>。真ん中の約半分のデータが入っている。</p><p>📏 ひげは最小値と最大値まで。箱の幅（Q3−Q1）が小さいほど、データがそろっている。</p><p>🕹️ 最大値を動かして、箱が変わらないことを確かめよう。</p>`,
'分散と標準偏差':`🌱 「どれだけちらばっているか」を数にしたい。<p>📏 まず各データと平均の差＝<b>偏差</b>を出す（平均5でデータ7なら＋2）。</p><p>⚠️ そのまま平均すると、＋と−が打ち消して 0 になってしまう。</p><p>✨ そこで<b>2乗</b>してから平均する。これが<b>分散</b>。</p><p>🔙 2乗で単位が変わったので、√をとって戻す。これが<b>標準偏差</b>。</p><p>🕹️ ちらばりを動かして、2つの値が大きくなるのを見よう。</p>`,
'|x|＜a と |x|＞a':`🌱 |x| は 0 からの<b>距離</b>だった。<p>🔴 |x|＜3 は「距離が3<b>より近い</b>」。0 を中心に、左右3まで。だから <b>−3＜x＜3</b>（あいだ）。</p><p>🔵 |x|＞3 は「距離が3<b>より遠い</b>」。だから <b>x＜−3、3＜x</b>（両はしの外側）。</p><p>🕹️ a と向きを動かして、赤い範囲がどう変わるか見よう。</p>`,
'解の読み方':`🌱 まず x²−4x＋3＝0 の解を求める。<b>x＝1, 3</b>。これがグラフとx軸の交点。<p>⬇️ x²−4x＋3＜0 は、グラフが x軸より<b>下</b>。U字だから、2つの解の<b>あいだ</b>：<b>1＜x＜3</b>。</p><p>⬆️ x²−4x＋3＞0 は、グラフが x軸より<b>上</b>。解の<b>外側</b>：<b>x＜1、3＜x</b>。</p><p>🖍️ コツ：計算の前に、まずグラフを描く。</p>`,
'ヘロンの公式':`🌱 3辺の長さだけわかっていて、角度がわからないときの面積の道具。<p>1️⃣ まず s＝(a＋b＋c)÷2 を出す（周りの長さの半分）。</p><p>2️⃣ 面積は <b>S＝√{s(s−a)(s−b)(s−c)}</b>。</p><p>🧮 例：3,4,5 → s＝6 → √(6×3×2×1)＝√36＝<b>6</b>。½×3×4＝6 と一致する！</p><p>🕹️ 辺を動かして確かめよう。2辺の和が残りの1辺以下だと、三角形ができない。</p>`
});
