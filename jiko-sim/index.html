<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>机上の空論CL</title>
<script>window.IZ_BASE={pos:'br'};</script>
<meta name="description" content="信号のない十字路での出会い頭事故を、摩擦係数・速度・見通しなどの数値から検証・逆算・現場推定する上空図シミュレーター">
<style>
:root{
  --bg:#ffffff; --ink:#1d2228; --sub:#5d6670; --line:#d9dde2; --soft:#f3f5f7; --card:#ffffff;
  --accent:#2457c5; --A:#2563d9; --B:#e0522a; --ok:#1f8a4c; --ng:#c62f2f; --warn:#b7791f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.5 "Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,input,select{font:inherit;color:inherit}
header.top{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:#fff;flex:none;padding-top:max(6px,env(safe-area-inset-top))}
header.top a.back{color:var(--sub);text-decoration:none;font-size:13px;white-space:nowrap}
header.top h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.tabs{display:flex;gap:2px;background:var(--soft);border-radius:9px;padding:2px;flex:none}
.tabs button{border:0;background:none;padding:5px 9px;border-radius:7px;font-size:13px;cursor:pointer;white-space:nowrap}
@media (max-width:430px){header.top h1{font-size:0;flex:1}header.top h1::after{content:"机上の空論CL";font-size:14px}.tabs button{padding:5px 7px;font-size:12.5px}}
.tabs button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:700;color:var(--accent)}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
#stage{position:relative;flex:none;height:46dvh;min-height:240px;border-bottom:1px solid var(--line);background:#f4f4f0}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stagebar{position:absolute;right:6px;top:6px;display:flex;gap:4px}
.stagebar button{border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer}
.stagebar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#hint{position:absolute;left:6px;bottom:6px;right:6px;font-size:11px;color:var(--sub);pointer-events:none;text-shadow:0 0 3px #fff,0 0 3px #fff}
#panel{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 40px}
@media (min-width:900px){
  #app{flex-direction:row}
  #stage{flex:1;height:auto;border-bottom:0;border-right:1px solid var(--line)}
  #panel{flex:none;width:440px}
}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;background:var(--card)}
.card h2{font-size:13px;margin:0 0 6px;color:var(--sub);font-weight:700;letter-spacing:.02em}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:14px;color:#fff}
.badge.ng{background:var(--ng)} .badge.ok{background:var(--ok)} .badge.warn{background:var(--warn)} .badge.gray{background:#8a939c}
.kv{display:grid;grid-template-columns:auto 1fr 1fr;gap:2px 10px;font-size:13px;margin-top:6px}
.kv .h{font-weight:700;font-size:12px}
.kv .k{color:var(--sub)}
.kv .a{color:var(--A)} .kv .b{color:var(--B)}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin-top:6px}
.kv2 .k{color:var(--sub)}
.note{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.55}
.small{font-size:12px;color:var(--sub)}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.row label{min-width:5.5em;color:var(--sub);font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(6.5em,auto) 1fr 1fr;gap:5px 8px;align-items:center}
.grid2 .h{font-size:12px;font-weight:700;text-align:center;padding:2px 0;border-radius:6px}
.grid2 .h.a{background:#e7efff;color:var(--A)} .grid2 .h.b{background:#ffece5;color:var(--B)}
.grid2 .l{font-size:12.5px;color:var(--sub);line-height:1.3}
.grid2 .l small{display:block;font-size:10.5px;color:#8a939c}
input[type=number],input[type=text],select{width:100%;min-width:0;padding:5px 7px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
input[type=number]{font-variant-numeric:tabular-nums}
input[type=range]{width:100%}
input:disabled,select:disabled{background:var(--soft);color:var(--sub)}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;cursor:pointer;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:#222;color:#fff;border-color:#222}
.btn.a{border-color:var(--A);color:var(--A)} .btn.a.on{background:var(--A);color:#fff}
.btn.b{border-color:var(--B);color:var(--B)} .btn.b.on{background:var(--B);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);color:#fff}
.basic .vrow{display:grid;grid-template-columns:2.2em 1fr 6.2em;gap:6px;align-items:center;margin:5px 0}
.tagA,.tagB{display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;border-radius:7px;font-weight:800;color:#fff}
.tagA{background:var(--A)} .tagB{background:var(--B)}
.unitin{display:flex;align-items:center;gap:4px}
.unitin span{font-size:12px;color:var(--sub);white-space:nowrap}
.acc{border:1px solid var(--line);border-radius:12px;margin:0 0 8px;background:#fff;overflow:hidden}
.acc-h{display:flex;align-items:center}
.acc-h .t{flex:1;border:0;background:none;text-align:left;padding:10px 12px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.acc-h .t::before{content:"";width:7px;height:7px;border-right:2px solid #889;border-bottom:2px solid #889;transform:rotate(-45deg);transition:transform .15s}
.acc.open .acc-h .t::before{transform:rotate(45deg)}
.acc-h .pin{border:1px solid var(--line);background:#fff;border-radius:999px;font-size:11px;padding:2px 8px;margin-right:8px;cursor:pointer;color:var(--sub);white-space:nowrap}
.acc-h .pin.on{background:#fff4d6;border-color:#e2b53d;color:#7a5a00;font-weight:700}
.acc-b{display:none;padding:4px 12px 12px;border-top:1px solid var(--line)}
.acc.open .acc-b{display:block}
.lock{border:1px solid var(--line);background:#fff;border-radius:8px;width:2.4em;height:2.1em;cursor:pointer;font-size:15px;line-height:1}
.lock.on{background:#fff4d6;border-color:#e2b53d}
.ltab{display:grid;grid-template-columns:1fr 6.8em 2.4em;gap:5px 6px;align-items:center}
.ltab .l{font-size:12.5px;color:var(--sub)}
.cands{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.cand{border:1px solid var(--line);border-radius:9px;padding:6px 9px;cursor:pointer;font-size:12.5px;background:#fff;text-align:left}
.cand.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(36,87,197,.18)}
.cand b{font-variant-numeric:tabular-nums}
.strip{display:flex;height:16px;border-radius:5px;overflow:hidden;margin:6px 0 2px;border:1px solid var(--line)}
.strip i{flex:1}
.strip i.c{background:#f1b5b5} .strip i.n{background:#b9e2c8}
.stripax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub)}
.obs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 2em;gap:4px;align-items:center;margin:4px 0}
.obs input{padding:4px 5px;font-size:13px}
.warnline{color:var(--warn);font-size:12px;margin-top:4px}
hr.sep{border:0;border-top:1px solid var(--line);margin:10px 0}
.big{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
</style>

<header class="top">

<!-- ============================================================
     計算部分（物理モデル）。DOM に触れない純粋な関数だけを置く。
     単位はすべて SI（m, s, kg, rad）。座標は上空図で x=東, y=北。
     ============================================================ -->
<script id="phys">
const PHYS = (() => {
  const G = 9.80665;
  const v2 = (x, y) => ({ x, y });
  const add = (a, b) => v2(a.x + b.x, a.y + b.y);
  const sub = (a, b) => v2(a.x - b.x, a.y - b.y);
  const mul = (a, k) => v2(a.x * k, a.y * k);
  const dot = (a, b) => a.x * b.x + a.y * b.y;
  const crs = (a, b) => a.x * b.y - a.y * b.x;
  const len = a => Math.hypot(a.x, a.y);
  const unit = a => { const l = len(a); return l > 1e-12 ? mul(a, 1 / l) : v2(1, 0); };
  const dir = th => v2(Math.cos(th), Math.sin(th));
  const angN = a => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };
  const wx = (w, r) => v2(-w * r.y, w * r.x);           // ω × r（平面）
  const rotL = (p, th) => { const c = Math.cos(th), s = Math.sin(th); return v2(p.x * c - p.y * s, p.x * s + p.y * c); };

  /* ---------- プリセット ---------- */
  const VEH_PRESETS = {
    kei:    { label: '軽自動車',        m: 900,   L: 3.40, W: 1.48, wb: 2.45, tr: 1.30, eyeF: 1.7, eyeR: 0.30, k: 900,  eff: 1.00 },
    car:    { label: '普通乗用車',      m: 1400,  L: 4.60, W: 1.78, wb: 2.70, tr: 1.53, eyeF: 2.1, eyeR: 0.35, k: 1200, eff: 1.00 },
    suv:    { label: 'SUV・ミニバン',   m: 1850,  L: 4.80, W: 1.85, wb: 2.85, tr: 1.60, eyeF: 2.0, eyeR: 0.37, k: 1500, eff: 1.00 },
    truckS: { label: '小型トラック(2t)', m: 3500,  L: 4.70, W: 1.70, wb: 2.50, tr: 1.40, eyeF: 0.8, eyeR: 0.35, k: 1800, eff: 0.90 },
    truckL: { label: '大型トラック',    m: 12000, L: 11.0, W: 2.49, wb: 6.00, tr: 2.00, eyeF: 0.9, eyeR: 0.50, k: 3500, eff: 0.85 },
    bike:   { label: 'バイク(250cc)',   m: 230,   L: 2.10, W: 0.80, wb: 1.40, tr: 0,    eyeF: 1.1, eyeR: 0.00, k: 300,  eff: 0.85 },
  };
  const ROAD_PRESETS = {
    dry:    { label: '乾燥アスファルト', mu: 0.75 },
    wet:    { label: '湿ったアスファルト', mu: 0.55 },
    rain:   { label: '雨（水たまり）', mu: 0.40 },
    gravel: { label: '砂利道', mu: 0.55 },
    snow:   { label: '圧雪', mu: 0.25 },
    ice:    { label: '凍結路', mu: 0.10 },
  };

  /* ---------- 経路（折れ線を等間隔に取り直し、位置・向き・曲率を引けるようにする） ---------- */
  function makePath(pts, opt = {}) {
    const h = opt.h || 0.25, smooth = opt.smooth || 0;
    const raw = [v2(pts[0].x, pts[0].y)];
    for (const p of pts) if (len(sub(p, raw[raw.length - 1])) > 1e-6) raw.push(v2(p.x, p.y));
    if (raw.length < 2) raw.push(add(raw[0], v2(1, 0)));
    const cs = [0];
    for (let i = 1; i < raw.length; i++) cs.push(cs[i - 1] + len(sub(raw[i], raw[i - 1])));
    const total = cs[cs.length - 1];
    const n = Math.max(2, Math.ceil(total / h) + 1), step = total / (n - 1);
    let P = []; let j = 0;
    for (let k = 0; k < n; k++) {
      const s = Math.min(total, k * step);
      while (j < raw.length - 2 && cs[j + 1] < s) j++;
      const t = (s - cs[j]) / ((cs[j + 1] - cs[j]) || 1);
      P.push(add(raw[j], mul(sub(raw[j + 1], raw[j]), t)));
    }
    if (smooth > 0 && n > 2 * smooth + 2) {   // 手描きの揺れを均す（端点は固定）
      const Q = P.map(p => v2(p.x, p.y));
      for (let k = 1; k < n - 1; k++) {
        const w = Math.min(smooth, k, n - 1 - k); let sx = 0, sy = 0;
        for (let d = -w; d <= w; d++) { sx += P[k + d].x; sy += P[k + d].y; }
        Q[k] = v2(sx / (2 * w + 1), sy / (2 * w + 1));
      }
      P = Q;
    }
    const th = new Array(n);
    for (let k = 0; k < n; k++) {
      const a = P[Math.max(0, k - 1)], b = P[Math.min(n - 1, k + 1)];
      const raw_th = Math.atan2(b.y - a.y, b.x - a.x);
      th[k] = k === 0 ? raw_th : th[k - 1] + angN(raw_th - th[k - 1]);
    }
    let kap = new Array(n).fill(0);
    for (let k = 1; k < n - 1; k++) kap[k] = (th[k + 1] - th[k - 1]) / (2 * step);
    if (smooth > 0) { const K = kap.slice(); for (let k = 2; k < n - 2; k++) K[k] = (kap[k - 2] + kap[k - 1] + kap[k] + kap[k + 1] + kap[k + 2]) / 5; kap = K; }
    function at(s) {
      if (s <= 0) return { p: add(P[0], mul(dir(th[0]), s)), th: th[0], k: 0 };
      if (s >= total) return { p: add(P[n - 1], mul(dir(th[n - 1]), s - total)), th: th[n - 1], k: 0 };
      const x = s / step, i = Math.min(n - 2, Math.floor(x)), f = x - i;
      return { p: add(P[i], mul(sub(P[i + 1], P[i]), f)), th: th[i] + (th[i + 1] - th[i]) * f, k: kap[i] + (kap[i + 1] - kap[i]) * f };
    }
    return { P, th, kap, total, step, at, src: raw };
  }
  function straightPath(p, th, length = 400) { return makePath([p, add(p, mul(dir(th), length))], { h: 2 }); }

  // 点を経路へ投影した弧長（始点より前・終点より先は接線を延長して扱う）
  function projectS(path, q) {
    let best = Infinity, bs = 0;
    const P = path.P;
    for (let i = 0; i < P.length - 1; i++) {
      const a = P[i], d = sub(P[i + 1], a), L2 = dot(d, d) || 1e-9;
      const t = Math.max(0, Math.min(1, dot(sub(q, a), d) / L2));
      const pt = add(a, mul(d, t)), dd = len(sub(q, pt));
      if (dd < best) { best = dd; bs = (i + t) * path.step; }
    }
    if (bs <= 1e-6) { const s = dot(sub(q, P[0]), dir(path.th[0])); if (s < 0) return { s, d: Math.abs(crs(dir(path.th[0]), sub(q, P[0]))) }; }
    if (bs >= path.total - 1e-6) { const e = P[P.length - 1], s = dot(sub(q, e), dir(path.th[path.th.length - 1])); if (s > 0) return { s: path.total + s, d: Math.abs(crs(dir(path.th[path.th.length - 1]), sub(q, e))) }; }
    return { s: bs, d: best };
  }

  /* ---------- 幾何：回転する長方形 ---------- */
  function obb(c, th, L, W) {
    const f = dir(th), l = v2(-f.y, f.x), hl = L / 2, hw = W / 2;
    return { c, th, f, l, hl, hw, pts: [add(add(c, mul(f, hl)), mul(l, hw)), add(sub(c, mul(l, hw)), mul(f, hl)), sub(sub(c, mul(f, hl)), mul(l, hw)), add(sub(c, mul(f, hl)), mul(l, hw))] };
  }
  function sat(A, B) {
    const d = sub(B.c, A.c);
    if (len(d) > Math.hypot(A.hl, A.hw) + Math.hypot(B.hl, B.hw)) return null;
    let best = null;
    for (const ax of [A.f, A.l, B.f, B.l]) {
      const rA = A.hl * Math.abs(dot(A.f, ax)) + A.hw * Math.abs(dot(A.l, ax));
      const rB = B.hl * Math.abs(dot(B.f, ax)) + B.hw * Math.abs(dot(B.l, ax));
      const pd = dot(d, ax), o = rA + rB - Math.abs(pd);
      if (o <= 0) return null;
      if (!best || o < best.depth) best = { depth: o, n: pd >= 0 ? ax : mul(ax, -1) };
    }
    return best;   // n は A → B の向き
  }
  const inObb = (p, O) => { const d = sub(p, O.c); return Math.abs(dot(d, O.f)) <= O.hl + 1e-9 && Math.abs(dot(d, O.l)) <= O.hw + 1e-9; };
  function segX(p1, p2, q1, q2) {
    const r = sub(p2, p1), s = sub(q2, q1), den = crs(r, s);
    if (Math.abs(den) < 1e-12) return null;
    const t = crs(sub(q1, p1), s) / den, u = crs(sub(q1, p1), r) / den;
    return (t >= 0 && t <= 1 && u >= 0 && u <= 1) ? { p: add(p1, mul(r, t)), t, u } : null;
  }
  function contactPoint(A, B) {
    const pts = [];
    A.pts.forEach(p => { if (inObb(p, B)) pts.push(p); });
    B.pts.forEach(p => { if (inObb(p, A)) pts.push(p); });
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { const x = segX(A.pts[i], A.pts[(i + 1) % 4], B.pts[j], B.pts[(j + 1) % 4]); if (x) pts.push(x.p); }
    if (!pts.length) return mul(add(A.c, B.c), 0.5);
    return mul(pts.reduce((s, p) => add(s, p), v2(0, 0)), 1 / pts.length);
  }
  function segPtDist(p, a, b) { const d = sub(b, a), t = Math.max(0, Math.min(1, dot(sub(p, a), d) / (dot(d, d) || 1e-9))); return len(sub(p, add(a, mul(d, t)))); }
  function obbGap(A, B) {
    if (sat(A, B)) return 0;
    let m = Infinity;
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      m = Math.min(m, segPtDist(A.pts[i], B.pts[j], B.pts[(j + 1) % 4]), segPtDist(B.pts[i], A.pts[j], A.pts[(j + 1) % 4]));
    }
    return m;
  }

  /* ---------- 見通し ---------- */
  function segHitsRect(p, q, r) {   // Liang–Barsky
    let t0 = 0, t1 = 1; const dx = q.x - p.x, dy = q.y - p.y;
    const chk = (pp, qq) => { if (Math.abs(pp) < 1e-12) return qq >= 0; const t = qq / pp; if (pp < 0) { if (t > t1) return false; if (t > t0) t0 = t; } else { if (t < t0) return false; if (t < t1) t1 = t; } return true; };
    return chk(-dx, p.x - r.x1) && chk(dx, r.x2 - p.x) && chk(-dy, p.y - r.y1) && chk(dy, r.y2 - p.y) && t1 > t0;
  }
  const FOV_COS = Math.cos(110 * Math.PI / 180);
  function canSee(eye, fwd, target, obstacles) {
    for (const p of [target.c, ...target.pts]) {
      const d = sub(p, eye);
      if (dot(unit(d), fwd) < FOV_COS) continue;
      if (!obstacles.some(r => segHitsRect(eye, p, r))) return { p };
    }
    return null;
  }
  const eyePos = (c, th, vp) => { const f = dir(th), right = v2(f.y, -f.x); return add(add(c, mul(f, vp.L / 2 - vp.eyeF)), mul(right, vp.eyeR)); };

  /* ---------- 2本の経路の交わり（「衝突地点の手前 D m で発見」に使う） ---------- */
  const confCache = new WeakMap();
  function conflictS(pa, pb) {
    let m = confCache.get(pa); if (!m) { m = new WeakMap(); confCache.set(pa, m); }
    if (m.has(pb)) return m.get(pb);
    let res = Infinity;
    const A = pa.P, B = pb.P, sa = Math.max(1, Math.round(1 / pa.step)), sb = Math.max(1, Math.round(1 / pb.step));
    outer: for (let i = 0; i + sa < A.length; i += sa) {
      for (let j = 0; j + sb < B.length; j += sb) {
        const x = segX(A[i], A[i + sa], B[j], B[j + sb]);
        if (x) { res = (i + x.t * sa) * pa.step; break outer; }
      }
    }
    m.set(pb, res); return res;
  }

  /* ---------- 衝突（撃力・反発係数・車両間摩擦） ---------- */
  function impact(pre, P, n, cfg) {
    const [a, b] = pre, pa = cfg.veh[0], pb = cfg.veh[1];
    const rA = sub(P, a.c), rB = sub(P, b.c);
    const vrel = sub(add(b.vel, wx(b.w, rB)), add(a.vel, wx(a.w, rA)));
    let vn = dot(vrel, n); const vnUsed = Math.min(vn, -1e-3);
    const Kn = 1 / pa.m + 1 / pb.m + crs(rA, n) ** 2 / pa.I + crs(rB, n) ** 2 / pb.I;
    const jn = -(1 + cfg.e) * vnUsed / Kn;
    const vt = sub(vrel, mul(n, vn)); let J = mul(n, jn), jt = 0;
    if (len(vt) > 1e-6) {
      const t = unit(vt);
      const Kt = 1 / pa.m + 1 / pb.m + crs(rA, t) ** 2 / pa.I + crs(rB, t) ** 2 / pb.I;
      jt = Math.max(-cfg.muc * jn, Math.min(cfg.muc * jn, -dot(vrel, t) / Kt));
      J = add(J, mul(t, jt));
    }
    const post = [
      { c: a.c, th: a.th, vel: sub(a.vel, mul(J, 1 / pa.m)), w: a.w - crs(rA, J) / pa.I },
      { c: b.c, th: b.th, vel: add(b.vel, mul(J, 1 / pb.m)), w: b.w + crs(rB, J) / pb.I },
    ];
    const ke = (s, p) => 0.5 * p.m * dot(s.vel, s.vel) + 0.5 * p.I * s.w * s.w;
    const E0 = ke(a, pa) + ke(b, pb), E1 = ke(post[0], pa) + ke(post[1], pb), dE = Math.max(0, E0 - E1);
    const kA = pa.k * 1000, kB = pb.k * 1000, keff = kA * kB / (kA + kB);
    const dTot = Math.sqrt(2 * dE / keff), F = keff * dTot;
    return {
      P, n, pre, post, J, jn, jt, dE, E0, E1,
      dv: [len(J) / pa.m, len(J) / pb.m],
      closing: -vn, vrel: len(vrel),
      crush: [F / kA, F / kB], force: F,
    };
  }

  /* ---------- 衝突後：4輪（バイクは2輪）の摩擦で滑って止まるまで ---------- */
  function postCrash(vp, st, mu, opt = {}) {
    const dt = 0.001, tMax = opt.tMax || 20;
    const wheels = vp.tr > 0
      ? [v2(vp.wb / 2, vp.tr / 2), v2(vp.wb / 2, -vp.tr / 2), v2(-vp.wb / 2, vp.tr / 2), v2(-vp.wb / 2, -vp.tr / 2)]
      : [v2(vp.wb / 2, 0), v2(-vp.wb / 2, 0)];
    const N = vp.m * G / wheels.length, locked = vp.post !== 'roll', cr = 0.015;
    let c = st.c, th = st.th, vel = st.vel, w = st.w, t = 0;
    const path = [{ c, th, t: 0 }], tracks = wheels.map(() => []), frames = [{ c, th, t: 0 }];
    let dist = 0, k = 0;
    while (t < tMax) {
      let F = v2(0, 0), M = 0;
      const f = dir(th), lat = v2(-f.y, f.x);
      for (const wl of wheels) {
        const r = rotL(wl, th), vw = add(vel, wx(w, r));
        let fw;
        if (locked) {
          const sp = len(vw); fw = mul(vw, -mu * N / Math.max(sp, 0.05));
        } else {
          const vl = dot(vw, f), vt = dot(vw, lat);
          const fl = -cr * N * vl / Math.max(Math.abs(vl), 0.05), ft = -mu * N * vt / Math.max(Math.abs(vt), 0.05);
          fw = add(mul(f, fl), mul(lat, ft));
          const mag = len(fw); if (mag > mu * N) fw = mul(fw, mu * N / mag);
        }
        F = add(F, fw); M += crs(r, fw);
      }
      vel = add(vel, mul(F, dt / vp.m)); w += M / vp.I * dt;
      const dc = mul(vel, dt); c = add(c, dc); th += w * dt; dist += len(dc); t += dt; k++;
      if (k % 20 === 0) {
        path.push({ c, th, t });
        wheels.forEach((wl, i) => tracks[i].push(add(c, rotL(wl, th))));
      }
      if (k % 250 === 0) frames.push({ c, th, t });
      if (len(vel) < 0.03 && Math.abs(w) < 0.03) break;
      if (!locked && len(vel) < 0.3 && Math.abs(w) < 0.05) break;
    }
    path.push({ c, th, t });
    return { path, tracks, frames, rest: { c, th }, t, dist, rot: th - st.th };
  }

  /* ---------- 衝突前：直進（経路に沿う）＋発見→反応→ブレーキ ---------- */
  function simulate(cfg, opt = {}) {
    const lite = !!opt.lite, dt = opt.dt || (lite ? 0.004 : 0.002), tMax = opt.tMax || 30;
    const V = cfg.veh.map(p => ({ p, path: p.path, s: 0, v: p.v0, tSee: -1, sSee: null, seeAt: null, tBrake: -1, sBrake: null, vBrake: null, tStop: -1, sStop: null, slip: false }));
    const sConf = [0, 1].map(i => (V[i].p.brake === 'distance') ? conflictS(V[i].path, V[1 - i].path) : Infinity);
    const recs = [], seeEvery = Math.max(1, Math.round(0.01 / dt));
    const state = a => { const q = a.path.at(a.s); return { c: q.p, th: q.th, k: q.k }; };
    let t = 0, coll = null, minGap = Infinity, minGapT = 0, lastD = Infinity, grew = 0, step = 0;
    let prevS = V.map(a => a.s);
    while (t <= tMax) {
      const S = V.map(state), O = S.map((q, i) => obb(q.c, q.th, V[i].p.L, V[i].p.W));
      const hit = sat(O[0], O[1]);
      if (hit) {
        // 直前の時刻との間を二分して、最初に触れた瞬間を求める
        let lo = 0, hi = 1; const curS = V.map(a => a.s);
        for (let it = 0; it < 14; it++) {
          const m = (lo + hi) / 2;
          V.forEach((a, i) => a.s = prevS[i] + (curS[i] - prevS[i]) * m);
          const Sm = V.map(state), Om = Sm.map((q, i) => obb(q.c, q.th, V[i].p.L, V[i].p.W));
          if (sat(Om[0], Om[1])) hi = m; else lo = m;
        }
        V.forEach((a, i) => a.s = prevS[i] + (curS[i] - prevS[i]) * hi);
        const Sh = V.map(state), Oh = Sh.map((q, i) => obb(q.c, q.th, V[i].p.L, V[i].p.W));
        const h2 = sat(Oh[0], Oh[1]) || hit;
        const P = contactPoint(Oh[0], Oh[1]);
        const pre = Sh.map((q, i) => ({ c: q.c, th: q.th, vel: mul(dir(q.th), V[i].v), w: V[i].v * q.k, v: V[i].v, s: V[i].s }));
        coll = impact(pre, P, h2.n, cfg);
        coll.t = t - dt * (1 - hi);
        break;
      }
      if (!lite && step % 25 === 0) {
        recs.push({ t, st: S.map((q, i) => ({ c: q.c, th: q.th, v: V[i].v })) });
        const gp = obbGap(O[0], O[1]); if (gp < minGap) { minGap = gp; minGapT = t; }
      }
      // 発見
      for (let i = 0; i < 2; i++) {
        const a = V[i];
        if (a.tSee >= 0) continue;
        if (a.p.brake === 'auto') {
          if (step % seeEvery === 0) {
            const vis = canSee(eyePos(S[i].c, S[i].th, a.p), dir(S[i].th), O[1 - i], cfg.obstacles);
            if (vis) { a.tSee = t; a.sSee = a.s; a.seeAt = { eye: eyePos(S[i].c, S[i].th, a.p), tgt: vis.p, self: { c: S[i].c, th: S[i].th }, other: { c: S[1 - i].c, th: S[1 - i].th } }; }
          }
        } else if (a.p.brake === 'distance') {
          if (sConf[i] - (a.s + a.p.L / 2) <= a.p.D) { a.tSee = t; a.sSee = a.s; a.seeAt = { eye: eyePos(S[i].c, S[i].th, a.p), tgt: S[1 - i].c, self: { c: S[i].c, th: S[i].th }, other: { c: S[1 - i].c, th: S[1 - i].th } }; }
        }
      }
      // 走行（摩擦円：曲がりながらのブレーキは横方向の分だけ弱くなる）
      prevS = V.map(a => a.s);
      for (let i = 0; i < 2; i++) {
        const a = V[i]; let acc = 0;
        const lat = a.v * a.v * Math.abs(S[i].k);
        if (lat > cfg.mu * G * 1.001) a.slip = true;
        if (a.tSee >= 0 && t >= a.tSee + a.p.react && a.v > 0) {
          if (a.tBrake < 0) { a.tBrake = t; a.sBrake = a.s; a.vBrake = a.v; }
          const ramp = a.p.rise > 0 ? Math.min(1, (t - a.tBrake) / a.p.rise) : 1;
          const amax = cfg.mu * G * a.p.eff;
          acc = Math.min(amax * ramp, Math.sqrt(Math.max(0, amax * amax - lat * lat)));
        }
        const v1 = Math.max(0, a.v - acc * dt);
        a.s += (a.v + v1) / 2 * dt;
        if (a.v > 0 && v1 === 0) { a.tStop = t; a.sStop = a.s; }
        a.v = v1;
      }
      t += dt; step++;
      // 終了判定：両方停止、または互いに離れていく
      const d = len(sub(S[0].c, S[1].c));
      if (d > lastD + 1e-9) grew++; else grew = 0;
      lastD = d;
      if (V[0].v === 0 && V[1].v === 0) break;
      if (grew > 50 && d > V[0].p.L + V[1].p.L + 25) break;
      if ((V[0].v === 0 || V[1].v === 0) && grew > 50) break;
    }
    const res = {
      collided: !!coll, coll, recs, minGap, minGapT, sConf, tEnd: t,
      veh: V.map(a => ({ tSee: a.tSee, sSee: a.sSee, seeAt: a.seeAt, tBrake: a.tBrake, sBrake: a.sBrake, vBrake: a.vBrake, tStop: a.tStop, sStop: a.sStop, sEnd: a.s, vEnd: a.v, slip: a.slip })),
    };
    if (coll && !opt.noPost) res.post = [0, 1].map(i => postCrash(cfg.veh[i], coll.post[i], cfg.mu));
    if (!coll) res.final = V.map(a => { const q = a.path.at(a.s); return { c: q.p, th: q.th }; });
    return res;
  }

  /* ---------- 逆算：衝突しなくなる境界を走査＋二分探索で求める ---------- */
  const REV_ITEMS = {
    speed:    { label: '限界速度（回避できる最大速度）', lo: 0, hi: 160 / 3.6, n: 65 },
    mu:       { label: '必要な制動距離・最低摩擦係数', lo: 0.05, hi: 1.20, n: 47 },
    reaction: { label: '反応時間の限界', lo: 0, hi: 3.0, n: 61 },
    discover: { label: '発見地点の限界距離', lo: 0, hi: 120, n: 61 },
  };
  function* reverseGen(build, item) {
    const R = REV_ITEMS[item], xs = [], col = [];
    for (let i = 0; i < R.n; i++) {
      const x = R.lo + (R.hi - R.lo) * i / (R.n - 1);
      xs.push(x); col.push(simulate(build(x), { lite: true, noPost: true }).collided);
      yield i / (R.n + 20);
    }
    const bounds = [];
    for (let i = 1; i < xs.length; i++) {
      if (col[i] === col[i - 1]) continue;
      let a = xs[i - 1], b = xs[i]; const ca = col[i - 1];
      for (let it = 0; it < 14; it++) {
        const m = (a + b) / 2, cm = simulate(build(m), { lite: true, noPost: true }).collided;
        if (cm === ca) a = m; else b = m;
        yield 0.9;
      }
      bounds.push({ x: ca ? b : a, from: ca, to: !ca });  // x は衝突しない側の値。to=true は「x を超えると衝突」
    }
    return { item, xs, col, bounds };
  }

  /* ---------- 現場推定：停止位置から衝突直前の状態を逆算 ---------- */
  // oA・oB：ぶつかった面のどこが当たったか（面の中央=0、端=±0.5）。画面には出さない内部の調整値
  const PNAMES = ['ix', 'iy', 'vA', 'vB', 'hA', 'hB', 'mu', 'oA', 'oB'];
  const PARTS = { front: v2(0.5, 0), rear: v2(-0.5, 0), left: v2(0, 0.5), right: v2(0, -0.5) };
  function contactLocal(part, vp, o = 0) {
    const q = PARTS[part] || PARTS.front;
    return q.x !== 0 ? v2(q.x * vp.L, o * vp.W) : v2(o * vp.L, q.y * vp.W);
  }

  function sceneModel(sc) {
    const m = sc.veh.map(v => v.m);
    const momentum = sc.rest[0].on && sc.rest[1].on;
    function derive(p) {
      const [ix, iy, vA, vB, hA, hB, mu, oA, oB] = p, I = v2(ix, iy), H = [hA, hB], VV = [vA, vB], OO = [oA || 0, oB || 0];
      const out = { I, veh: [] };
      for (let i = 0; i < 2; i++) {
        const vp = sc.veh[i], c = sub(I, rotL(contactLocal(sc.part[i], vp, OO[i]), H[i]));
        const o = { c, th: H[i], v: VV[i], vel: mul(dir(H[i]), VV[i]) };
        const R = sc.rest[i];
        if (R.on) {
          // 滑りと回転は同じ摩擦で止まる：車輪の平均の滑り距離 ≒ √(移動² + (r·回転角)²) に摩擦力を掛けた仕事を、
          // 移動と回転に（距離の2乗の比で）分ける
          const rc = v2(R.x, R.y), d = len(sub(rc, c));
          o.dth = angN(R.th - H[i]);
          const ravg = 0.5 * Math.hypot(vp.wb, vp.tr), dr = ravg * Math.abs(o.dth);
          const Etot = mu * vp.m * G * sc.fpost * Math.hypot(d, dr), share = (d * d + dr * dr) > 1e-9 ? d * d / (d * d + dr * dr) : 1;
          const u = Math.sqrt(2 * Etot * share / vp.m);

          o.u = u; o.uvel = mul(ud, u); o.dpost = d;
          o.w = Math.sqrt(2 * Etot * (1 - share) / vp.I);

        out.veh.push(o);
      }

        const [a, b] = out.veh;
        const E0 = 0.5 * m[0] * a.v * a.v + 0.5 * m[1] * b.v * b.v;
        const E1 = 0.5 * m[0] * a.u * a.u + 0.5 * m[1] * b.u * b.u + 0.5 * sc.veh[0].I * a.w * a.w + 0.5 * sc.veh[1].I * b.w * b.w;
        out.E0 = E0; out.E1 = E1; out.dE = E0 - E1;
        const relPre = sub(b.vel, a.vel), relPost = sub(b.uvel, a.uvel), nn = unit(relPre);
        out.eApp = len(relPre) > 0.1 ? -dot(relPost, nn) / dot(relPre, nn) : NaN;
        out.closing = len(relPre);
        out.dv = [len(sub(a.uvel, a.vel)), len(sub(b.uvel, b.vel))];
      }

    }
    function resid(p, prior) {
      const d = derive(p), r = [];
      const [, , vA, vB, hA, hB, mu, oA, oB] = p;
      if (momentum) {
        const M = m[0] + m[1];
        const P0 = add(mul(d.veh[0].vel, m[0]), mul(d.veh[1].vel, m[1]));
        const P1 = add(mul(d.veh[0].uvel, m[0]), mul(d.veh[1].uvel, m[1]));
        r.push(3 * (P0.x - P1.x) / M, 3 * (P0.y - P1.y) / M);
        r.push(d.dE < 0 ? -3 * Math.sqrt(-2 * d.dE / M) : 0);  // 衝突でエネルギーは増えない
      }
      [oA, oB].forEach(o => { o = o || 0; r.push(0.4 * o, Math.abs(o) > 0.5 ? 6 * (Math.abs(o) - 0.5) : 0); });
      for (let i = 0; i < 2; i++) {
        const h = i ? hB : hA;
        if (sc.hint && sc.hint[i] != null) {
          r.push(0.5 * angN(h - sc.hint[i]));                 // 検証モードの進む向きを目安に
        } else {
          r.push(2 * angN(h - prior.h[i]));
        }
      }
      r.push(25 * (mu - sc.mu0));
      r.push(vA < 0 ? 5 * vA : 0, vB < 0 ? 5 * vB : 0);
      const ext = Math.max(0, Math.abs(d.I.x) - sc.box, Math.abs(d.I.y) - sc.box);
      r.push(0.3 * ext);
      return r;
    }
    return { derive, resid, momentum };
  }

  function solveLin(A, b) {
    const n = b.length, M = A.map((r, i) => [...r, b[i]]);
    for (let c = 0; c < n; c++) {
      let piv = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
      [M[c], M[piv]] = [M[piv], M[c]];
      if (Math.abs(M[c][c]) < 1e-14) return null;
      for (let r = 0; r < n; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
    }
    return M.map((r, i) => r[n] / r[i]);
  }
  function lm(f, x0, iters = 80) {
    let x = x0.slice(), r = f(x), c = r.reduce((s, v) => s + v * v, 0), lam = 1e-2;
    const n = x.length;
    if (!n) return { x, cost: c };
    for (let it = 0; it < iters; it++) {
      const J = [];
      for (let j = 0; j < n; j++) {
        const h = 1e-6 * Math.max(1, Math.abs(x[j])), xp = x.slice(); xp[j] += h;
        const rp = f(xp); J.push(rp.map((v, k) => (v - r[k]) / h));
      }
      const A = [...Array(n)].map((_, i) => [...Array(n)].map((_, j) => J[i].reduce((s, v, k) => s + v * J[j][k], 0)));
      const g = [...Array(n)].map((_, i) => J[i].reduce((s, v, k) => s + v * r[k], 0));
      let improved = false;
      while (lam < 1e9) {
        const Ad = A.map((row, i) => row.map((v, j) => i === j ? v * (1 + lam) + 1e-9 : v));
        const dx = solveLin(Ad, g.map(v => -v));
        if (!dx) { lam *= 10; continue; }
        const xn = x.map((v, i) => v + dx[i]), rn = f(xn), cn = rn.reduce((s, v) => s + v * v, 0);
        if (cn < c) { const gain = c - cn; x = xn; r = rn; c = cn; lam = Math.max(1e-7, lam * 0.3); improved = true; if (gain < 1e-12) it = iters; break; }
        lam *= 10;
      }
      if (!improved) break;
    }
    return { x, cost: c };
  }

  // sc.locks: {名前: 固定値}（ロックしていない項目は含めない）
  function sceneSolve(sc) {
    const model = sceneModel(sc);
    if (!model.momentum) return { cands: [], model, reason: '停止位置（2台分）を入れると推定できます。' };
    const free = PNAMES.filter(k => !(k in sc.locks));
    const ROAD = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
    // 初期値の候補
    const Is = [v2(0, 0)];
    if (sc.rest[0].on && sc.rest[1].on) Is.push(v2((sc.rest[0].x + sc.rest[1].x) / 4, (sc.rest[0].y + sc.rest[1].y) / 4));
    const hOpts = [0, 1].map(i => (sc.hint && sc.hint[i] != null ? [sc.hint[i], ...ROAD.filter(r => Math.abs(angN(r - sc.hint[i])) > 0.1)] : ROAD));
    const starts = [];
    for (const I0 of Is) for (const ha of hOpts[0]) for (const hb of hOpts[1]) {
      if (Math.abs(Math.sin(ha - hb)) < 0.2) continue;   // 平行は出会い頭ではない
      starts.push({ I0, ha, hb });
    }
    const cands = [];
    for (const st of starts) {
      const prior = { h: [st.ha, st.hb] };
      const base = { ix: st.I0.x, iy: st.I0.y, vA: 10, vB: 10, hA: st.ha, hB: st.hb, mu: sc.mu0, oA: 0, oB: 0, ...sc.locks };
      const pack = x => { const o = { ...base }; free.forEach((k, i) => o[k] = x[i]); return PNAMES.map(k => o[k]); };
      const f = x => model.resid(pack(x), prior);
      // 速度の初期値は運動量の連立から
      if (free.includes('vA') && free.includes('vB')) {
        const d0 = model.derive(PNAMES.map(k => base[k]));
        const P1 = add(mul(d0.veh[0].uvel, sc.veh[0].m), mul(d0.veh[1].uvel, sc.veh[1].m));
        const a = mul(dir(base.hA), sc.veh[0].m), b = mul(dir(base.hB), sc.veh[1].m), den = crs(a, b);
        if (Math.abs(den) > 1e-6) { base.vA = Math.max(1, crs(P1, b) / den); base.vB = Math.max(1, crs(a, P1) / den); }
      }
      const x0 = free.map(k => base[k]);
      const res = lm(f, x0);
      const p = pack(res.x);
      if (p[2] < -0.5 || p[3] < -0.5) continue;
      if (!isFinite(res.cost)) continue;
      cands.push({ p, cost: res.cost, prior });
    }
    cands.sort((a, b) => a.cost - b.cost);
    const uniq = [];
    for (const c of cands) {
      if (uniq.some(u => Math.hypot(u.p[0] - c.p[0], u.p[1] - c.p[1]) < 0.6 && Math.abs(u.p[2] - c.p[2]) < 0.6 && Math.abs(u.p[3] - c.p[3]) < 0.6 && Math.abs(angN(u.p[4] - c.p[4])) < 0.12 && Math.abs(angN(u.p[5] - c.p[5])) < 0.12)) continue;
      c.p[4] = angN(c.p[4]); c.p[5] = angN(c.p[5]);
      c.d = model.derive(c.p);
      c.score = 100 / (1 + c.cost);
      uniq.push(c);
      if (uniq.length >= 8) break;
    }
    return { cands: uniq, model };
  }

  return {
    G, v2, add, sub, mul, dot, crs, len, unit, dir, angN, rotL,
    VEH_PRESETS, ROAD_PRESETS, REV_ITEMS, PNAMES,
    makePath, straightPath, projectS, obb, sat, obbGap, canSee, eyePos, conflictS,
    simulate, postCrash, impact, reverseGen, sceneSolve, sceneModel, contactLocal,
  };
})();
</script>

  function vehStart(v) { if (v.path) { const p = vehPath(v), q = p.at(0); return { c: q.p, th: q.th }; } return { c: v2(v.x, v.y), th: v.hdg * D2R }; }

  /* ---------- 結果 ---------- */

      h.push(`<span class="k">変形エネルギー</span><span>${f1(d.dE / 1000)} kJ</span>`);
      h.push(`<span class="k">運動エネルギー</span><span>衝突前 ${f1(d.E0 / 1000)} → 衝突後 ${f1(d.E1 / 1000)} kJ</span>`);
      h.push(`<span class="k">速度変化 ΔV</span><span>A ${kmh(d.dv[0])} ／ B ${kmh(d.dv[1])} km/h</span>`);
      h.push('</div>');
      if (d.dE < -500) h.push('<div class="warnline">衝突後のエネルギーが衝突前より大きくなっています。停止位置・摩擦係数・ロック値のどこかが合っていません。</div>');
    }
    if (r.cands.length > 1) {
      h.push(`<div style="margin-top:10px;font-weight:700;font-size:12.5px">解の候補（${r.cands.length}件・整合度の高い順。タップで図に描きます）</div><div class="cands">`);
      r.cands.forEach((cc, k) => {
        h.push(`<button class="cand${k === S.scene.sel ? ' on' : ''}" data-cand="${k}"><b>${k + 1}.</b> 整合度 <b>${cc.score.toFixed(0)}</b> ／ A ${kmh(cc.p[2])} km/h ${f1(cc.p[4] * R2D, 0)}° ／ B ${kmh(cc.p[3])} km/h ${f1(cc.p[5] * R2D, 0)}° ／ 地点 (${f1(cc.p[0])}, ${f1(cc.p[1])})</button>`);
      });
      h.push('</div>');
    }
    h.push(`<div class="note">${NOTE} ${NOTE_SCENE} 速度の幅は摩擦係数を ±${S.scene.dmu} 動かしたときの値。衝突後の移動は直線で滑ったと近似し、回転は角度の変化から別に見積もっています。</div></div>`);
    return h.join('');
  }

  /* ---------- 現場推定 → 検証モード ---------- */
  function sendToVerify() {
    const r = sceneRes, c = r && r.cands[S.scene.sel]; if (!c) return;
    const d = c.d, paths = [];
    for (const i of [0, 1]) {
      const o = d.veh[i];
      paths.push({ pts: [sub(o.c, mul(dir(o.th), 40)), add(o.c, mul(dir(o.th), 60))], v0: o.v });
    }
    // 両車が同じ時刻に衝突地点へ着くよう、早く着く方の出発点を後ろへ延ばす（どちらも一定速度の直進）
    const built = paths.map(p => P.makePath(p.pts, { h: 0.25 }));
    const tt = [0, 1].map(i => P.projectS(built[i], d.veh[i].c).s / Math.max(0.1, paths[i].v0));
    const early = tt[0] < tt[1] ? 0 : 1, gap = Math.abs(tt[0] - tt[1]);
    if (gap > 1e-3) {
      const p = paths[early], b = built[early], ext = gap * p.v0;
      p.pts = [sub(b.at(0).p, mul(dir(b.at(0).th), ext)), ...p.pts];
    }
    for (const i of [0, 1]) {
      const v = S.veh[i], p = paths[i];
      v.path = p.pts.map(q => [round2(q.x), round2(q.y)]);
      v.v0 = Math.round(p.v0 * 3.6 * 10) / 10;
      v.brake = 'never';
    }
    S.mode = 'verify'; renderAll();
    alert('推定したルートと速度を検証モードへ送りました。\n・両車ともブレーキなしで設定\n衝突後の動きが停止位置と合うか確かめてください。');
  }

  /* ---------- 出力 ---------- */
  function summaryLines() {
    const L = [];
    const modeName = { verify: '①検証', reverse: '②逆算', scene: '③現場推定' }[S.mode];
    L.push(`机上の空論CL 交通事故シミュレーション（${modeName}）  ${new Date().toLocaleString('ja-JP')}`);
    L.push(`路面 μ=${S.road.mu}（${(P.ROAD_PRESETS[S.road.preset] || { label: '手入力' }).label}）／ 反発係数 ${S.coll.e} ／ 車両間摩擦 ${S.coll.muc}`);
    S.veh.forEach((v, i) => {
      const st = vehStart(v);
      L.push(`${vname(i)}: ${P.VEH_PRESETS[v.preset]?.label || ''} ${v.m}kg ${v.L}×${v.W}m 速度${v.v0}km/h 反応${v.react}s 効き${v.eff}% 位置(${st.c.x.toFixed(1)},${st.c.y.toFixed(1)}) 向き${(st.th * R2D).toFixed(0)}° 発見:${{ auto: '見通し', distance: '手前' + v.D + 'm', never: 'なし' }[v.brake]}${v.path ? ' 経路:曲線' : ''}`);
    });
    if (S.mode === 'verify' && simRes) {
      if (simRes.collided) { const C = simRes.coll; L.push(`結果: 衝突 ${C.t.toFixed(2)}s 衝突速度 A${kmh(C.pre[0].v)} B${kmh(C.pre[1].v)} km/h 相対${kmh(C.vrel)}km/h 変形エネルギー${(C.dE / 1000).toFixed(1)}kJ ΔV A${kmh(C.dv[0])} B${kmh(C.dv[1])}`); }
      else L.push(`結果: 衝突しない（最接近 ${simRes.minGap.toFixed(2)} m）`);
      if (avoid && avoid.lim) avoid.lim.forEach((x, i) => { if (x && x.vmax != null) L.push(`回避: ${vname(i)} は ${(x.vmax * 3.6).toFixed(1)} km/h 以下なら回避`); });
    } else if (S.mode === 'reverse' && revRes && !revRes.busy) {
      const o = revRes, it = o.item; let s = o.msg || '';
      if (o.limit != null) s = it === 'speed' ? `${(o.limit * 3.6).toFixed(1)} km/h` : it === 'mu' ? `μ ${o.limit.toFixed(3)}` : it === 'reaction' ? `${o.limit.toFixed(2)} 秒` : `手前 ${o.limit.toFixed(1)} m`;
      L.push(`逆算: ${P.REV_ITEMS[it].label}（${vname(S.rev.who)}）= ${s}`);
    } else if (S.mode === 'scene' && sceneRes && sceneRes.cands.length) {
      const c = sceneRes.cands[S.scene.sel], d = c.d;
      L.push(`推定（候補${S.scene.sel + 1}・整合度${c.score.toFixed(0)}）: 衝突地点(${d.I.x.toFixed(1)},${d.I.y.toFixed(1)}) A ${kmh(d.veh[0].v)} km/h ${(d.veh[0].th * R2D).toFixed(0)}° ／ B ${kmh(d.veh[1].v)} km/h ${(d.veh[1].th * R2D).toFixed(0)}°`);
      S.scene.rest.forEach((R, i) => { if (R.on) L.push(`${vname(i)} 停止位置 (${R.x},${R.y}) 角度${R.th}°`); });
      if (sceneRes.range) { const a = sceneRes.range.map(x => x.p[2] * 3.6), b = sceneRes.range.map(x => x.p[3] * 3.6); L.push(`速度の幅（μ±${S.scene.dmu}）: A ${Math.min(...a).toFixed(0)}〜${Math.max(...a).toFixed(0)} ／ B ${Math.min(...b).toFixed(0)}〜${Math.max(...b).toFixed(0)} km/h`); }
    }
    L.push('注：' + NOTE + (S.mode === 'scene' ? ' ' + NOTE_SCENE : ''));
    return L;
  }
  function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
  const stamp = () => { const d = new Date(), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`; };
  function exportPng() {
    const W = 1200, Hd = 1000, lines = summaryLines();
    const c = document.createElement('canvas'), g = c.getContext('2d');
    g.font = '18px system-ui,sans-serif';
    const wrap = [];
    for (const l of lines) { let s = ''; for (const ch of l) { if (g.measureText(s + ch).width > W - 40) { wrap.push(s); s = ''; } s += ch; } wrap.push(s); }
    const Ht = 30 + wrap.length * 26;
    c.width = W; c.height = Hd + Ht;
    const k = W / cssW, vw = { cx: view.cx, cy: view.cy, scale: view.scale * Math.min(k, Hd / cssH) };
    drawScene(g, W, Hd, vw, { export: true });
    g.fillStyle = '#fff'; g.fillRect(0, Hd, W, Ht); g.fillStyle = '#ccc'; g.fillRect(0, Hd, W, 1);
    g.fillStyle = '#222'; g.font = '18px system-ui,sans-serif'; g.textAlign = 'left';
    wrap.forEach((l, i) => g.fillText(l, 20, Hd + 30 + i * 26));
    c.toBlob(b => download(`jiko-sim-${stamp()}.png`, b), 'image/png');
  }
  function exportJson() {
    const out = { app: 'jiko-sim', version: 1, saved: new Date().toISOString(), settings: S, summary: summaryLines() };
    download(`jiko-sim-${stamp()}.json`, new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
  }
  async function copyText() {
    const t = summaryLines().join('\n');
    try { await navigator.clipboard.writeText(t); alert('コピーしました。'); } catch (e) { prompt('コピーしてください', t); }
  }

  /* ---------- 組み立て ---------- */
  function renderPanel() {
    binds = [];
    const st = panel.scrollTop;
    panel.innerHTML = '';
    panel.append(resBox);
    if (S.mode === 'reverse') panel.append(reverseSection());
    if (S.mode === 'scene') panel.append(...sceneSection());
    panel.append(basicSection(), vehicleAcc(), roadAcc(), geomAcc(), sightAcc(), collAcc(), outAcc());
    panel.scrollTop = st;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === S.mode));
    updateHint();
  }
  function updateHint() {
    const h = document.getElementById('hint');
    h.textContent = S.mode === 'scene'
      ? '停止車両・★（衝突地点）・建物をドラッグ ／ 2本指で拡大・移動'
      : '車・建物をドラッグして配置 ／ 何もない所をドラッグで移動、2本指（ホイール）で拡大';
  }
  function renderAll() { renderPanel(); compute(); }
  document.getElementById('tabs').addEventListener('click', e => { const m = e.target.dataset && e.target.dataset.m; if (!m || m === S.mode) return; S.mode = m; renderAll(); fit(); });
  document.getElementById('bFit').onclick = fit;
  document.getElementById('bPng').onclick = exportPng;
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
  resize();
  renderAll(); fit();
  window.__jiko = { S: () => S, compute, P, sceneRes: () => sceneRes, simRes: () => simRes, revRes: () => revRes };
})();
</script>
</body>
</html>
