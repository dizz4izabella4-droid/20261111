<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>既存パズル</title>
<style>
  html,body{margin:0;background:#fff;color:#111;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
  main{max-width:560px;margin:0 auto;padding:24px 18px}
  h1{font-size:20px;font-weight:600;margin:0 0 16px}
  ul{list-style:none;margin:0;padding:0}
  li{margin:0 0 10px}
  a{color:#111;text-decoration:underline}
</style>
</head>
<body>
<main>
  <h1>既存パズル</h1>
  <ul id="list"></ul>
</main>
<script>
(function () {
  fetch('../data/works.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function (d) {
      var list = document.getElementById('list');
      d.works.filter(function (w) { return w.group === 'puzzles-existing'; }).forEach(function (w) {
        var li = document.createElement('li'), a = document.createElement('a');
        a.href = '../' + w.path; a.textContent = w.title;
        li.appendChild(a); list.appendChild(li);
      });
    })
    .catch(function () {});
})();
</script>
</body>
</html>
