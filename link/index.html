<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0c0a">
<title>連携アプリ（試作）</title>
<style>
:root{
  --bg:#0d0c0a; --wall:#16130f; --edge:#2a241c; --paper:#d9cfbb;
  --ink:#e8dfcc; --dim:#8a7f6c; --red:#b3261e; --lamp:#f0c674;
  --tab-w:22px; --strip-w:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;touch-action:none}
#viewport{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#221d16 0%,var(--bg) 70%)}
#track{position:absolute;top:0;left:0;height:100%;display:flex;will-change:transform}
#track.anim{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.pane{position:relative;height:100%;flex:0 0 auto;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.pane iframe{display:block;width:100%;height:100%;border:0;background:#000}
.pane .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:13px;letter-spacing:.2em;pointer-events:none}

/* 左右端のスワイプ受付帯（iframeの上に重ねる） */
.strip{position:fixed;top:0;bottom:0;width:var(--strip-w);z-index:10;touch-action:none}
.strip.l{left:0}
.strip.r{right:0}

/* 補助タブ（常時表示） */
.tab{position:fixed;top:50%;z-index:11;width:var(--tab-w);height:120px;margin-top:-60px;white-space:nowrap;padding-top:10px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#3a3127,#251f18);border:1px solid #4a3f31;
  color:var(--paper);font-size:11px;line-height:1.15;flex-direction:column;text-align:center;font-family:system-ui,"Hiragino Sans",sans-serif;
  box-shadow:0 2px 8px rgba(0,0,0,.6);cursor:pointer;opacity:.85;
  transition:opacity .2s,transform .2s}
.tab:active{opacity:1}
.tab.l{left:0;border-left:0;border-radius:0 6px 6px 0}
.tab.r{right:0;border-right:0;border-radius:6px 0 0 6px}
.tab.hide{opacity:0;pointer-events:none;transform:scaleX(0)}
.tab::before{content:"";position:absolute;top:8px;width:4px;height:4px;border-radius:50%;background:var(--red)}

/* 現在位置のしるし */
#dots{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:12;display:flex;gap:8px;pointer-events:none}
#dots i{width:6px;height:6px;border-radius:50%;background:#4a3f31;transition:background .2s}
#dots i.on{background:var(--lamp)}
</style>
<!--IZ-LINK-BRIDGE:START--><script id="izlink-bridge">
/* izlink bridge v1 — 連携アプリの共通データ層とイベント
 *
 * 各アプリ（保管庫・レッドライン・iz2611）と外枠（link/）に埋め込む小さな部品。
 * 埋め込みは tools/apply_link_bridge.py で行う（作品は1ファイル完結のため）。
 *
 * 保存先（同一ドメインの localStorage）
 *   izlink.v1.meta      : { caseId, settings:{ brand, stringsForFloppy } }
 *   izlink.v1.<caseId>  : { marks:[], floppies:{}, terminal:{}, board:{items:[],pins:[],strings:[]}, truth:null }
 *
 * API（window.IzLink）
 *   IzLink.linked                 外枠の中で動いているか（単体起動なら false）
 *   IzLink.brand()                端末名（既定 'iz2611'）
 *   IzLink.setting(key)           設定値
 *   IzLink.caseId()               現在の事件ID
 *   IzLink.meta() / setMeta(fn)   メタの読み出し・更新
 *   IzLink.get(caseId?)           事件データ（無ければ空の形で返す）
 *   IzLink.update(fn, caseId?)    事件データを fn(data) で書き換えて保存し、'data.changed' を流す
 *   IzLink.on(type, cb)           イベント受信（自分・他の画面・外枠のどこから来たものも）。戻り値で解除
 *   IzLink.emit(type, payload)    イベント送信（自分にも届く。外枠経由で他の画面へも届く）
 *   IzLink.onVisibility(cb)       表示・非表示の通知（外枠が送る）
 *
 * 主なイベント
 *   case.selected {caseId}  mark.added {docId,...}  string.added {stringId}
 *   floppy.found {caseId}   floppy.inserted {caseId}  article.pinned {articleId}
 *   evidence.found {...}    truth.revealed {...}      data.changed {caseId}
 */
(function (global) {
  'use strict';
  if (global.IzLink) return;

  var PREFIX = 'izlink.v1.';
  var META_KEY = PREFIX + 'meta';
  var DEFAULT_SETTINGS = { brand: 'iz2611', stringsForFloppy: 3 };
  var listeners = {};
  var visListeners = [];
  var isTop = global.parent === global;

  function read(key, fallback) {
    try {
      var s = global.localStorage.getItem(key);
      return s ? JSON.parse(s) : fallback;
    } catch (e) { return fallback; }
  }
  function write(key, value) {
    try { global.localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }

  function emptyCase() {
    return { marks: [], floppies: {}, terminal: {}, board: { items: [], pins: [], strings: [] }, truth: null };
  }
  function normalizeCase(d) {
    var e = emptyCase();
    if (!d || typeof d !== 'object') return e;
    for (var k in e) if (!(k in d)) d[k] = e[k];
    if (!d.board || typeof d.board !== 'object') d.board = e.board;
    ['items', 'pins', 'strings'].forEach(function (k) { if (!Array.isArray(d.board[k])) d.board[k] = []; });
    return d;
  }

  function meta() {
    var m = read(META_KEY, null) || {};
    m.settings = m.settings || {};
    for (var k in DEFAULT_SETTINGS) if (!(k in m.settings)) m.settings[k] = DEFAULT_SETTINGS[k];
    if (!('caseId' in m)) m.caseId = null;
    return m;
  }
  function setMeta(fn) {
    var m = meta();
    var r = fn(m);
    write(META_KEY, r || m);
    return r || m;
  }

  function caseId() { return meta().caseId; }
  function get(id) {
    id = id || caseId();
    if (!id) return emptyCase();
    return normalizeCase(read(PREFIX + id, null));
  }
  function update(fn, id) {
    id = id || caseId();
    if (!id) return null;
    var d = get(id);
    var r = fn(d);
    d = normalizeCase(r || d);
    write(PREFIX + id, d);
    emit('data.changed', { caseId: id });
    return d;
  }

  function deliver(type, payload, origin) {
    var ev = { type: type, payload: payload || {}, origin: origin };
    (listeners[type] || []).slice().forEach(function (cb) { try { cb(ev.payload, ev); } catch (e) { console.error(e); } });
    (listeners['*'] || []).slice().forEach(function (cb) { try { cb(ev.payload, ev); } catch (e) { console.error(e); } });
  }
  function on(type, cb) {
    (listeners[type] = listeners[type] || []).push(cb);
    return function () {
      var a = listeners[type] || [];
      var i = a.indexOf(cb);
      if (i >= 0) a.splice(i, 1);
    };
  }

  var selfId = Math.random().toString(36).slice(2);
  function emit(type, payload) {
    deliver(type, payload, 'self');
    var msg = { izlink: 1, kind: 'event', type: type, payload: payload || {}, from: selfId };
    if (!isTop) {
      try { global.parent.postMessage(msg, '*'); } catch (e) {}
    } else {
      broadcastToFrames(msg, null);
    }
  }
  // 外枠だけが使う：各枠へ配る（送り元には返さない）
  function broadcastToFrames(msg, exceptWin) {
    var frames = global.document ? global.document.querySelectorAll('iframe') : [];
    Array.prototype.forEach.call(frames, function (f) {
      if (f.contentWindow && f.contentWindow !== exceptWin) {
        try { f.contentWindow.postMessage(msg, '*'); } catch (e) {}
      }
    });
  }

  global.addEventListener('message', function (e) {
    var d = e.data;
    if (!d) return;
    // 外枠からの表示通知（link/ の既存形式）
    if (d.type === 'izlink.visibility') {
      visListeners.slice().forEach(function (cb) { try { cb(!!d.visible); } catch (er) {} });
      return;
    }
    if (d.izlink !== 1 || d.kind !== 'event' || d.from === selfId) return;
    if (isTop) {
      // 外枠：子の emit を受けて、自分にも届け、他の枠へ中継する
      deliver(d.type, d.payload, 'frame');
      broadcastToFrames(d, e.source);
    } else if (e.source === global.parent) {
      deliver(d.type, d.payload, 'frame');
    }
  });

  var api = {
    version: 1,
    linked: !isTop,
    isFrame: isTop,
    brand: function () { return meta().settings.brand; },
    setting: function (k) { return meta().settings[k]; },
    meta: meta,
    setMeta: setMeta,
    caseId: caseId,
    get: get,
    update: update,
    on: on,
    emit: emit,
    onVisibility: function (cb) { visListeners.push(cb); },
    _keys: { prefix: PREFIX, meta: META_KEY }
  };
  global.IzLink = api;
  if (!isTop) {
    try { global.parent.postMessage({ type: 'izlink.ready' }, '*'); } catch (e) {}
  }
})(window);
</script><!--IZ-LINK-BRIDGE:END-->
</head>
<body>
<div id="viewport"><div id="track"></div></div>
<div class="strip l" id="stripL"></div>
<div class="strip r" id="stripR"></div>
<div class="tab l" id="tabL"></div>
<div class="tab r" id="tabR"></div>
<div id="dots"></div>

<script>
(function(){
'use strict';

/* ===== 設定（1か所で管理） ===== */
var CONFIG = {
  brand: 'iz2611',            // 端末名。画面に出る表記はここから取る
  stringsForFloppy: 3,        // フロッピー出現に必要な紐の本数
  startIndex: 1,              // 起動時の画面（0:左 1:中央 2:右）
  panes: [
    { id:'shoko',   label:'資料保管庫', real:'../shoko/index.html' },
    { id:'redline', label:'レッドライン', real:'../redline/play/index.html' },
    { id:'term',    label:'{brand}',    real:'../pc98-novel/index.html' }
  ]
};
// ?real=1 で本物のアプリを読み込む（既定はダミー）
var USE_REAL = /[?&]real=1\b/.test(location.search);

/* ===== ダミーの事件（試作用テストデータ） ===== */
var CATALOG = {
  cases: [
    { id:'test01', title:'テスト事件A（ダミー）',
      docs:[ {id:'d1', title:'調書：第一発見者の供述'},
             {id:'d2', title:'写真：現場の見取り図'},
             {id:'d3', title:'鑑識メモ：凶器について'},
             {id:'d4', title:'聴取：管理人の証言'} ],
      papers:{
        '1987-02-14':[ {id:'a1', title:'県道で雪崩、山荘地区が孤立'},
                       {id:'a2', title:'地方版：猟銃の盗難届相次ぐ'} ],
        '1987-02-15':[ {id:'a3', title:'洋館で宿泊客が死亡'},
                       {id:'a4', title:'小欄：除雪車、未明に故障'} ] } },
    { id:'test02', title:'テスト事件B（ダミー）',
      docs:[ {id:'d1', title:'調書：通報記録'},
             {id:'d2', title:'写真：遺留品'} ],
      papers:{ '1990-07-01':[ {id:'a1', title:'港で漁船火災'} ] } }
  ]
};
function findCase(id){ for (var i=0;i<CATALOG.cases.length;i++) if (CATALOG.cases[i].id===id) return CATALOG.cases[i]; return null; }

function label(p){ return p.label.replace('{brand}', CONFIG.brand); }

/* ===== 共通データの初期化 ===== */
if (/[?&]reset=1\b/.test(location.search)) {
  try {
    Object.keys(localStorage).forEach(function(k){ if (k.indexOf(IzLink._keys.prefix)===0) localStorage.removeItem(k); });
  } catch(e){}
}
IzLink.setMeta(function(m){
  m.settings.brand = CONFIG.brand;
  m.settings.stringsForFloppy = CONFIG.stringsForFloppy;
});

/* ===== 連携のルール（外枠が受け持つ） ===== */
function boardHas(d, id){ return d.board.items.some(function(it){ return it.id===id; }); }
function addBoardItem(d, item){
  if (boardHas(d, item.id)) return;
  var n = d.board.items.length;
  item.x = 40 + (n % 4) * 160; item.y = 40 + Math.floor(n / 4) * 140; // 仮の配置
  d.board.items.push(item);
}

IzLink.on('case.selected', function(p){
  if (!findCase(p.caseId)) return;
  IzLink.setMeta(function(m){ m.caseId = p.caseId; });
  IzLink.emit('data.changed', { caseId: p.caseId });
  go(1); // 「この事件を開く」→ ボードへ
});

IzLink.on('mark.added', function(p){
  var c = findCase(p.caseId); if (!c) return;
  var doc = c.docs.filter(function(x){ return x.id===p.docId; })[0]; if (!doc) return;
  IzLink.update(function(d){
    if (!d.marks.some(function(m){ return m.docId===doc.id; })) d.marks.push({ docId:doc.id, at:Date.now() });
    // 資料ごとボードへ（通知はしない）
    addBoardItem(d, { id:'doc:'+doc.id, kind:'doc', ref:doc.id, title:doc.title });
  }, p.caseId);
});

IzLink.on('article.pinned', function(p){
  var c = findCase(p.caseId); if (!c) return;
  var art = null;
  Object.keys(c.papers).forEach(function(date){
    c.papers[date].forEach(function(a){ if (a.id===p.articleId) art = { a:a, date:date }; });
  });
  if (!art) return;
  IzLink.update(function(d){
    addBoardItem(d, { id:'article:'+art.a.id, kind:'article', ref:art.a.id, title:art.a.title, date:art.date });
  }, p.caseId);
});

IzLink.on('string.added', function(p){
  var id = p.caseId || IzLink.caseId(); if (!id) return;
  var d = IzLink.get(id);
  var f = d.floppies[id];
  if (f && f.found) return;
  if (d.board.strings.length >= IzLink.setting('stringsForFloppy')) {
    IzLink.update(function(d){ d.floppies[id] = { found:true, taken:false, at:Date.now() }; }, id);
    IzLink.emit('floppy.found', { caseId:id });
  }
});

IzLink.on('floppy.inserted', function(p){
  IzLink.update(function(d){ d.terminal.inserted = p.caseId; d.terminal.at = Date.now(); }, p.caseId);
});

/* ===== ダミー画面 ===== */
var THEMES = [
  {bg:'#2b241b', fg:'#e8dfcc', accent:'#b3261e', font:'serif'},
  {bg:'#3b2a20', fg:'#f3ead8', accent:'#c0392b', font:'serif'},
  {bg:'#000a00', fg:'#7cff7c', accent:'#7cff7c', font:'monospace'}
];

/* 以下の dummy* 関数は、そのまま iframe の中で実行される（外の変数は使えない） */
function dummyShoko(CAT){
  var root = document.getElementById('app');
  function find(id){ return CAT.cases.filter(function(c){ return c.id===id; })[0]; }
  function render(){
    var cid = IzLink.caseId(), h = '<h1>資料保管庫</h1><h2>事件ファイル</h2>';
    CAT.cases.forEach(function(c){
      h += '<div class="card'+(c.id===cid?' cur':'')+'"><span class="spine"></span>'+
           '<div><b>'+c.title+'</b> <span class="stamp">再捜査</span></div>'+
           (c.id===cid ? '<div class="dim">現在の事件</div>' : '<button data-open="'+c.id+'">この事件を開く</button>')+'</div>';
    });
    if (cid) {
      var c = find(cid), d = IzLink.get(cid);
      h += '<h2>資料</h2>';
      c.docs.forEach(function(doc){
        var marked = d.marks.some(function(m){ return m.docId===doc.id; });
        h += '<div class="row"><span>'+doc.title+'</span><button data-mark="'+doc.id+'"'+(marked?' disabled':'')+'>'+
             (marked?'マーカー済み':'マーカーを引く')+'</button></div>';
      });
      var f = d.floppies[cid];
      h += '<h2>フロッピー</h2>';
      if (f && f.found) h += '<div class="row"><span>専用フロッピー（'+IzLink.brand()+'用）</span>'+
             (f.taken ? '<span class="dim">手に取った</span>' : '<button data-take="1">手に取る</button>')+'</div>';
      else h += '<div class="row dim">まだ見当たらない</div>';
    }
    root.innerHTML = h;
  }
  root.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.open) IzLink.emit('case.selected', { caseId:b.dataset.open });
    else if (b.dataset.mark) IzLink.emit('mark.added', { caseId:IzLink.caseId(), docId:b.dataset.mark });
    else if (b.dataset.take) { var id = IzLink.caseId(); IzLink.update(function(d){ d.floppies[id].taken = true; }); }
  });
  IzLink.on('data.changed', render);
  render();
}

function dummyRedline(CAT){
  var root = document.getElementById('app');
  var COLORS = { red:'#c0392b', blue:'#2e6db4', black:'#111' };
  var COLOR_NAMES = { red:'赤', blue:'青', black:'黒' };
  var color = 'red', sel = null;
  function uid(){ return Math.random().toString(36).slice(2, 8); }
  function render(){
    var cid = IzLink.caseId(), h = '<h1>レッドライン</h1>';
    if (!cid) { root.innerHTML = h + '<p class="dim">事件が選ばれていない。<br>保管庫の事件ファイルで「この事件を開く」を押す。</p>'; return; }
    var d = IzLink.get(cid), b = d.board;
    var title = (CAT.cases.filter(function(c){ return c.id===cid; })[0] || {}).title;
    h += '<p class="dim">'+title+' のボード</p><h2>貼られた物</h2>';
    if (!b.items.length) h += '<p class="dim">まだ何もない（保管庫でマーカーを引く／端末で記事を貼る）</p>';
    b.items.forEach(function(it){
      var pin = b.pins.filter(function(p){ return p.itemId===it.id; })[0];
      h += '<div class="row"><span><small>'+(it.kind==='doc'?'資料':'記事')+'</small> '+it.title+'</span>'+
        (pin ? '<button class="pin'+(sel===pin.id?' sel':'')+'" data-pin="'+pin.id+'">ピン</button>'
             : '<button data-addpin="'+it.id+'">ピンを刺す</button>')+'</div>';
    });
    h += '<h2>紐 '+b.strings.length+' / '+IzLink.setting('stringsForFloppy')+'</h2><div class="row">';
    Object.keys(COLORS).forEach(function(k){
      h += '<button class="sw'+(color===k?' sel':'')+'" data-color="'+k+'" style="border-color:'+COLORS[k]+'">'+COLOR_NAMES[k]+'</button>';
    });
    h += '</div><p class="dim">ピン → ピンの順にタップすると紐を張る</p>';
    b.strings.forEach(function(s){
      function name(pid){ var p = b.pins.filter(function(x){ return x.id===pid; })[0];
        var it = p && b.items.filter(function(x){ return x.id===p.itemId; })[0]; return it ? it.title : '?'; }
      h += '<div class="row"><span style="color:'+COLORS[s.color]+'">━</span><span>'+name(s.a)+' — '+name(s.b)+'</span></div>';
    });
    root.innerHTML = h;
  }
  root.addEventListener('click', function(e){
    var btn = e.target.closest('button'); if (!btn) return;
    var cid = IzLink.caseId();
    if (btn.dataset.color) { color = btn.dataset.color; render(); return; }
    if (btn.dataset.addpin) {
      IzLink.update(function(d){ d.board.pins.push({ id:'p'+uid(), itemId:btn.dataset.addpin }); });
      return;
    }
    if (btn.dataset.pin) {
      var pid = btn.dataset.pin;
      if (!sel || sel===pid) { sel = sel===pid ? null : pid; render(); return; }
      var a = sel; sel = null;
      var dup = IzLink.get().board.strings.some(function(s){ return (s.a===a&&s.b===pid)||(s.a===pid&&s.b===a); });
      if (dup) { render(); return; }
      var sid = 's'+uid();
      IzLink.update(function(d){ d.board.strings.push({ id:sid, a:a, b:pid, color:color }); });
      IzLink.emit('string.added', { caseId:cid, stringId:sid });
    }
  });
  IzLink.on('data.changed', render);
  render();
}

function dummyTerm(CAT){
  var root = document.getElementById('app');
  var booting = false, date = null;
  function render(){
    var brand = IzLink.brand(), cid = IzLink.caseId();
    var h = '<h1>'+brand+'</h1>';
    if (booting) return;
    if (!cid) { root.innerHTML = h + '<p>A:\\&gt; ディスクがありません_</p>'; return; }
    var d = IzLink.get(cid), f = d.floppies[cid], c = CAT.cases.filter(function(x){ return x.id===cid; })[0];
    if (d.terminal.inserted !== cid) {
      h += '<p>A:\\&gt; ディスクがありません_</p>';
      if (f && f.taken) h += '<button data-insert="1">フロッピーを挿す</button>';
      else h += '<p class="dim">専用フロッピーが必要（保管庫で見つける）</p>';
      root.innerHTML = h; return;
    }
    var dates = Object.keys(c.papers);
    if (!date || dates.indexOf(date) < 0) date = dates[0];
    h += '<p>新聞縮刷版 検索</p><div class="row">';
    dates.forEach(function(dt){ h += '<button class="'+(dt===date?'sel':'')+'" data-date="'+dt+'">'+dt+'</button>'; });
    h += '</div>';
    c.papers[date].forEach(function(a){
      var on = d.board.items.some(function(it){ return it.id==='article:'+a.id; });
      h += '<div class="row"><span>'+a.title+'</span><button data-pin="'+a.id+'"'+(on?' disabled':'')+'>'+(on?'貼った':'ボードに貼る')+'</button></div>';
    });
    root.innerHTML = h;
  }
  function boot(){
    booting = true;
    var lines = [IzLink.brand()+' SYSTEM', 'MEMORY CHECK ... 640KB OK', 'FDD A: READ ...', 'LOADING CASE DISK ...', 'READY'];
    var i = 0;
    root.innerHTML = '<h1>'+IzLink.brand()+'</h1><pre id="boot"></pre>';
    (function next(){
      if (i >= lines.length) { booting = false; render(); return; }
      document.getElementById('boot').textContent += lines[i++] + '\n';
      setTimeout(next, 280);
    })();
  }
  root.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.insert) { IzLink.emit('floppy.inserted', { caseId:IzLink.caseId() }); boot(); }
    else if (b.dataset.date) { date = b.dataset.date; render(); }
    else if (b.dataset.pin) IzLink.emit('article.pinned', { caseId:IzLink.caseId(), articleId:b.dataset.pin });
  });
  IzLink.on('data.changed', render);
  render();
}

var DUMMIES = [dummyShoko, dummyRedline, dummyTerm];
var BRIDGE_SRC = (document.getElementById('izlink-bridge') || {}).textContent || '';

function dummyDoc(p, i){
  var t = THEMES[i];
  return '<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">'+
  '<meta name="viewport" content="width=device-width,initial-scale=1">'+
  '<style>*{box-sizing:border-box;margin:0}html,body{min-height:100%}'+
  'body{background:'+t.bg+';color:'+t.fg+';font-family:'+t.font+';padding:28px 36px 48px;font-size:14px;line-height:1.6}'+
  'h1{font-size:20px;letter-spacing:.2em;border-bottom:2px solid '+t.accent+';padding-bottom:6px;margin-bottom:10px}'+
  'h2{font-size:13px;letter-spacing:.15em;margin:18px 0 6px;opacity:.85}'+
  '.dim{opacity:.6;font-size:12px}'+
  '.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}'+
  '.card{position:relative;padding:10px 12px 10px 18px;margin:6px 0;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12)}'+
  '.card.cur{border-color:'+t.accent+'}'+
  '.spine{position:absolute;left:0;top:0;bottom:0;width:6px;background:#b3261e}'+
  '.stamp{display:inline-block;border:2px solid #b3261e;color:#d0453a;font-size:11px;padding:0 4px;transform:rotate(-6deg);margin-left:6px}'+
  'button{font:inherit;font-size:12px;padding:6px 10px;margin:2px;background:rgba(0,0,0,.35);color:inherit;border:1px solid '+t.accent+';border-radius:3px}'+
  'button:disabled{opacity:.4}button.sel{background:'+t.accent+';color:'+t.bg+'}'+
  'button.sw{border-width:3px}pre{font:inherit;white-space:pre-wrap}'+
  '#vis{position:fixed;right:8px;bottom:22px;font-size:10px;opacity:.5}'+
  '</style><script>'+BRIDGE_SRC+'<\/script></head><body>'+
  '<div id="app"></div><div id="vis">停止中</div>'+
  '<script>IzLink.onVisibility(function(v){document.getElementById("vis").textContent=v?"表示中":"停止中";});'+
  '('+DUMMIES[i].toString()+')('+JSON.stringify(CATALOG)+');<\/script></body></html>';
}

/* ===== 組み立て ===== */
var track = document.getElementById('track');
var dotsEl = document.getElementById('dots');
var tabL = document.getElementById('tabL'), tabR = document.getElementById('tabR');
var N = CONFIG.panes.length;
var frames = [];
var index = CONFIG.startIndex;

CONFIG.panes.forEach(function(p, i){
  var pane = document.createElement('div');
  pane.className = 'pane';
  var ld = document.createElement('div');
  ld.className = 'loading'; ld.textContent = '読み込み中…';
  pane.appendChild(ld);
  track.appendChild(pane);
  var dot = document.createElement('i');
  dotsEl.appendChild(dot);
  frames.push({pane:pane, loading:ld, iframe:null, loaded:false, p:p, i:i});
});

function loadFrame(f){
  if (f.iframe) return;
  var ifr = document.createElement('iframe');
  ifr.title = label(f.p);
  ifr.setAttribute('allow', 'autoplay; fullscreen');
  ifr.addEventListener('load', function(){
    f.loaded = true;
    f.loading.remove();
    sendVisibility();
  });
  if (USE_REAL) ifr.src = f.p.real; else ifr.srcdoc = dummyDoc(f.p, f.i);
  f.pane.insertBefore(ifr, f.loading);
  f.iframe = ifr;
}

/* 中央（起動画面）を先に、残りは後から */
loadFrame(frames[index]);
setTimeout(function(){ frames.forEach(loadFrame); }, 800);

/* ===== 表示制御 ===== */
var W = 0, dragX = 0;
function layout(){
  W = window.innerWidth;
  track.style.width = (W * N) + 'px';
  frames.forEach(function(f){ f.pane.style.width = W + 'px'; });
  apply(false);
}
function apply(anim){
  track.classList.toggle('anim', !!anim);
  track.style.transform = 'translate3d(' + (-index * W + dragX) + 'px,0,0)';
}
function setTab(el, p){ // 1文字ずつ縦に積む（縦書き指定はフォントにより崩れるため）
  el.textContent = '';
  if (!p) return;
  Array.from(label(p)).forEach(function(c){
    var s = document.createElement('span'); s.textContent = c; s.style.display = 'block';
    el.appendChild(s);
  });
}
function updateChrome(){
  var prev = CONFIG.panes[index - 1], next = CONFIG.panes[index + 1];
  setTab(tabL, prev); setTab(tabR, next);
  tabL.classList.toggle('hide', !prev);
  tabR.classList.toggle('hide', !next);
  document.getElementById('stripL').style.display = prev ? '' : 'none';
  document.getElementById('stripR').style.display = next ? '' : 'none';
  Array.prototype.forEach.call(dotsEl.children, function(d, i){ d.classList.toggle('on', i === index); });
}
/* 見えない枠は音と動きを止める：各アプリへ通知 */
function sendVisibility(){
  frames.forEach(function(f){
    if (!f.iframe || !f.loaded) return;
    try { f.iframe.contentWindow.postMessage({type:'izlink.visibility', visible: f.i === index}, '*'); } catch(e){}
  });
}
function go(i){
  i = Math.max(0, Math.min(N - 1, i));
  var changed = i !== index;
  index = i; dragX = 0;
  apply(true);
  updateChrome();
  if (changed) sendVisibility();
}

/* ===== エッジスワイプ ===== */
function bindStrip(el, dir){ // dir: -1=左端（前の画面へ） +1=右端（次の画面へ）
  var sx = 0, t0 = 0, id = null, moved = false;
  el.addEventListener('pointerdown', function(e){
    id = e.pointerId; sx = e.clientX; t0 = performance.now(); moved = false;
    el.setPointerCapture(id);
    track.classList.remove('anim');
  });
  el.addEventListener('pointermove', function(e){
    if (e.pointerId !== id) return;
    var dx = e.clientX - sx;
    // 左端は右へ、右端は左へ引いたときだけ追従
    var pull = dir < 0 ? Math.max(0, dx) : Math.min(0, dx);
    if (Math.abs(pull) > 4) moved = true;
    dragX = pull;
    apply(false);
  });
  function end(e){
    if (e.pointerId !== id) return;
    id = null;
    var dx = dragX, dt = performance.now() - t0;
    var fast = Math.abs(dx) / Math.max(dt, 1) > 0.4;
    if (moved && (Math.abs(dx) > W * 0.25 || fast)) go(index + dir);
    else go(index);
  }
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
bindStrip(document.getElementById('stripL'), -1);
bindStrip(document.getElementById('stripR'), +1);

/* ===== 補助タブ ===== */
tabL.addEventListener('click', function(){ go(index - 1); });
tabR.addEventListener('click', function(){ go(index + 1); });

/* キーボード（PC確認用） */
window.addEventListener('keydown', function(e){
  if (e.key === 'ArrowLeft' && e.altKey) go(index - 1);
  if (e.key === 'ArrowRight' && e.altKey) go(index + 1);
});

/* 子アプリからの外枠向け通知 */
window.addEventListener('message', function(e){
  var d = e.data;
  if (!d || typeof d.type !== 'string') return;
  if (d.type === 'izlink.ready') sendVisibility();
  if (d.type === 'izlink.go' && typeof d.index === 'number') go(d.index);
});

window.addEventListener('resize', layout);
layout();
updateChrome();

// 確認用に公開
window.IZLINK = { config: CONFIG, go: go, get index(){ return index; } };
})();
</script>
