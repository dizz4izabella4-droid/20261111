<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3eee3">
<title>ワイヤダ</title>
<style>
/* ワイヤダ: 数字をたよりに1本の輪を作るパズル。紙とインクの落ち着いた見た目。HTML/CSS/JS すべてこの1ファイル */
:root{
  --paper:#f3eee3; --card:#fbf8f1; --ink:#1e2b3f; --ink2:#5f6b7c; --rule:#d9d1c0; --dot:#1e2b3f;
  --line:#1e2b3f; --done:#a9a394; --err:#c8442e; --hint:#e08a00; --hintbg:rgba(224,138,0,.16);
  --acc:#2f7d5b; --accbg:rgba(47,125,91,.17); --btn:#fffdf8; --shadow:rgba(30,43,63,.12);
  --ja:"Yu Gothic UI","游ゴシック","YuGothic","Hiragino Sans","ヒラギノ角ゴシック","Hiragino Kaku Gothic ProN",Meiryo,"Noto Sans JP",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root{
  --paper:#151a22; --card:#1d2430; --ink:#e8e4d8; --ink2:#9aa3b0; --rule:#2e3746; --dot:#e8e4d8;
  --line:#e8e4d8; --done:#5d6675; --err:#ff7a62; --hint:#ffb84a; --hintbg:rgba(255,184,74,.16);
  --acc:#5cc39a; --accbg:rgba(92,195,154,.16); --btn:#252d3b; --shadow:rgba(0,0,0,.4); color-scheme:dark; } }
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--ja);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-tap-highlight-color:transparent;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto}
.app,.col{display:flex;flex-direction:column;gap:14px}
[hidden]{display:none!important}

/* 上の帯 */
.top{display:flex;align-items:center;gap:10px;min-height:40px}
.top a,.top button{flex:none;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--btn);
  font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink2);text-decoration:none;cursor:pointer}
.top a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top .sp{flex:1}
#snd[aria-pressed="false"]{opacity:.55}

/* 問題をえらぶ画面 */
.lead{margin:6px 0 0;text-align:center;font-size:14px;color:var(--ink2);letter-spacing:.04em;text-wrap:balance}
.lead b{color:var(--ink)}
.homebar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.pill{height:38px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--btn);font-size:14px;font-weight:700;letter-spacing:.06em;cursor:pointer}
.total{font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.level{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px 14px 16px;box-shadow:0 2px 0 var(--shadow)}
.level h2{margin:0;display:flex;align-items:baseline;gap:10px;font-size:17px;font-weight:800;letter-spacing:.12em}
.level h2 small{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.06em}
.level p{margin:2px 0 12px;font-size:12.5px;color:var(--ink2)}
.pz{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pz button{position:relative;aspect-ratio:1/1;min-height:52px;border-radius:12px;border:1.5px solid var(--rule);background:var(--btn);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.pz button .n{font-size:19px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.pz button .t{font-size:10.5px;font-weight:700;color:var(--ink2);line-height:1.2;font-variant-numeric:tabular-nums;min-height:13px}
.pz button.done{border-color:var(--acc);background:var(--accbg)}
.pz button.done .t{color:var(--acc)}
.pz button.going::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--hint)}
.pz button:active{transform:translateY(1px)}
.foot{text-align:center;font-size:11.5px;color:var(--ink2);letter-spacing:.04em}

/* あそぶ画面 */
.bar{display:flex;align-items:center;gap:10px}
.bar .name{flex:1;font-size:16px;font-weight:800;letter-spacing:.1em}
.bar .name small{font-size:12px;font-weight:700;color:var(--ink2);margin-left:8px;letter-spacing:.04em}
.bar .time{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.boardwrap{display:flex;justify-content:center}
.board{display:block;width:100%;width:min(100%,max(240px,calc(100dvh - 346px)));max-width:520px;height:auto;background:var(--card);border:1px solid var(--rule);border-radius:16px;box-shadow:0 2px 0 var(--shadow);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.board text{font-family:var(--ja);font-weight:700;font-size:31px;fill:var(--ink);text-anchor:middle;pointer-events:none;transition:fill .15s}
.board text.ok{fill:var(--done)}
.board text.over{fill:var(--err)}
.board .dot{fill:var(--dot)}
.board .dot.bad{fill:var(--err)}
.board .tint{fill:var(--accbg);opacity:0;transition:opacity .6s}
.board.won .tint.in{opacity:1}
.board .ln{stroke:var(--line);stroke-width:7;stroke-linecap:round;opacity:0}
.board .x{stroke:var(--ink2);stroke-width:2.4;stroke-linecap:round;fill:none;opacity:0}
.board .e[data-s="1"] .ln{opacity:1}
.board .e[data-s="2"] .x{opacity:.75}
.board .e.pop .ln{animation:pop .18s ease-out}
@keyframes pop{from{stroke-width:13}to{stroke-width:7}}
.board.won .ln{stroke:var(--acc)}
.board.won .e .x{opacity:0}
.board.won text.ok{fill:var(--ink)}
.board .hv{stroke:var(--ink2);stroke-width:7;stroke-linecap:round;opacity:0;pointer-events:none}
.board .hv.on{opacity:.22}
/* ヒントの印 */
.board .hl{stroke:var(--hint);stroke-width:13;stroke-linecap:round;opacity:0}
.board .e.hint .hl{opacity:.55;animation:glow 1.1s ease-in-out infinite}
.board .e.wrong .hl{stroke:var(--err);opacity:.6;animation:glow .7s ease-in-out infinite}
@keyframes glow{50%{opacity:.25}}
.board .hcell{fill:var(--hintbg);stroke:var(--hint);stroke-width:2;opacity:0}
.board .hcell.on{opacity:1}
.board .hring{fill:none;stroke:var(--hint);stroke-width:3;opacity:0}
.board .hring.on{opacity:1}
.msg{min-height:88px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--rule);font-size:13.5px;line-height:1.65}
.msg b{color:var(--acc)}
.msg .res{display:flex;flex-direction:column;gap:6px}
.msg .res strong{font-size:16px;letter-spacing:.12em;color:var(--acc);margin-right:10px}
.msg .res .row{display:flex;gap:8px;flex-wrap:wrap}
.msg .res .row button{flex:1;min-width:120px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tools button{height:52px;border-radius:12px;border:1px solid var(--rule);background:var(--btn);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:12px;font-weight:700;letter-spacing:.08em;cursor:pointer}
.tools button svg{width:20px;height:20px}
.tools button:disabled{opacity:.38;cursor:default}
.tools button:not(:disabled):active,.pill:active,.go:active{transform:translateY(1px)}
.tools #bHint{border-color:var(--hint)}
.go{height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--acc);background:var(--acc);color:#fff;font-size:14px;font-weight:800;letter-spacing:.08em;cursor:pointer}
.go.sub{background:var(--btn);color:var(--ink);border-color:var(--rule)}
@media (prefers-color-scheme:dark){ .go{color:#10201a} .go.sub{color:var(--ink)} }
.ops{margin:0;text-align:center;font-size:11.5px;color:var(--ink2)}
#play.won .tools,#play.won .ops{display:none}

/* あそびかた・確認の窓 */
dialog{border:1px solid var(--rule);border-radius:18px;background:var(--card);color:var(--ink);padding:20px 18px 16px;width:min(440px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto}
dialog::backdrop{background:rgba(20,26,36,.5)}
dialog h2{margin:0 0 10px;font-size:17px;letter-spacing:.14em}
dialog h3{margin:14px 0 4px;font-size:13.5px;letter-spacing:.08em;color:var(--acc)}
dialog ol,dialog ul{margin:0;padding-left:1.4em;font-size:13.5px}
dialog li{margin:3px 0}
dialog p{margin:6px 0;font-size:13.5px}
dialog .ex{display:flex;align-items:center;gap:14px;margin-top:6px}
dialog .ex svg{flex:none;width:132px;height:auto;border-radius:12px;cursor:default}
dialog .ex p{font-size:12.5px;color:var(--ink2);margin:0}
dialog .row{display:flex;gap:8px;margin-top:16px}
dialog .row button{flex:1}
/* スマホ: 押しやすさを優先して盤を大きく保つ。背の低い画面では余白と説明を詰める */
@media (pointer:coarse){ .board{width:min(100%,max(300px,calc(100dvh - 342px)))} }
@media (max-height:620px){ .app,.col{gap:10px} .ops{display:none} body.playing .top{display:none} .msg{min-height:76px;padding:7px 12px;font-size:13px;line-height:1.55} .tools button{height:46px} }
@media (max-height:620px) and (pointer:coarse){ .board{width:min(100%,max(300px,calc(100dvh - 232px)))} }
@media (prefers-reduced-motion:reduce){ .board .e.pop .ln,.board .e.hint .hl,.board .e.wrong .hl{animation:none} .board .tint{transition:none} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="sp" aria-hidden="true"></span>
    <button type="button" id="snd" aria-pressed="true">音 ON</button>
  </header>

  <main id="home" class="col">
    <p class="lead">数字をたよりに<b>1本の輪</b>を引いて、<br>マスを「内」と「外」に組み分けるパズル</p>
    <div class="homebar"><button type="button" class="pill" id="bHow">あそびかた</button><span class="total" id="total"></span></div>
    <div id="levels" class="col"></div>
    <p class="foot">どの問題も答えは1つだけ。あてずっぽうなしで、理詰めで解けます。</p>
  </main>

  <main id="play" class="col" hidden>
    <div class="bar"><button type="button" class="pill" id="bList">&lt; 一覧</button><div class="name" id="pName"></div><div class="time" id="pTime" aria-label="経過時間">0:00</div></div>
    <div class="boardwrap"><svg class="board" id="board" role="img" aria-label="パズルの盤面"></svg></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="tools">
      <button type="button" id="bUndo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 13L4 8l5-5"/><path d="M4 8h10a6 6 0 010 12h-4"/></svg>戻す</button>
      <button type="button" id="bRedo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 13l5-5-5-5"/><path d="M20 8H10a6 6 0 000 12h4"/></svg>進む</button>
      <button type="button" id="bHint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0012 3z"/></svg>ヒント</button>
      <button type="button" id="bReset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>全部消す</button>
    </div>
    <p class="ops" id="ops"></p>
  </main>
</div>

<dialog id="dReset" aria-labelledby="rsT">
  <h2 id="rsT">全部消す</h2>
  <p>この問題の線と×を、すべて消して最初からにします。タイムも0に戻ります。</p>
  <div class="row"><button type="button" class="go sub" data-close>やめる</button><button type="button" class="go" id="bResetOk">消す</button></div>
</dialog>

<script>
/*SOLVER-BEGIN*/
// ===== 盤の形と、論理だけで解く仕組み（ヒントと問題の検証で同じものを使う） =====
// 辺の状態: 0 = 未定, 1 = 線, 2 = ×（線なし）
function makeGrid(R,C){
  const HN=(R+1)*C, VN=R*(C+1), EN=HN+VN, VW=C+1;
  const H=(r,c)=>r*C+c, V=(r,c)=>HN+r*(C+1)+c;
  const cellE=[], cellV=[], vertE=[], edgeV=[];
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){
    cellE.push([H(r,c),V(r,c+1),H(r+1,c),V(r,c)]);
    cellV.push([r*VW+c, r*VW+c+1, (r+1)*VW+c+1, (r+1)*VW+c]);
  }
  for(let r=0;r<=R;r++) for(let c=0;c<=C;c++){
    const a=[]; if(r>0) a.push(V(r-1,c)); if(c<C) a.push(H(r,c)); if(r<R) a.push(V(r,c)); if(c>0) a.push(H(r,c-1));
    vertE.push(a);
  }
  for(let r=0;r<=R;r++) for(let c=0;c<C;c++) edgeV[H(r,c)]=[r*VW+c, r*VW+c+1];
  for(let r=0;r<R;r++) for(let c=0;c<=C;c++) edgeV[V(r,c)]=[r*VW+c, (r+1)*VW+c];
  return {R,C,HN,VN,EN,VW,VNUM:(R+1)*(C+1),H,V,cellE,cellV,vertE,edgeV};
}
function parseClues(rows){ const a=[]; rows.forEach(s=>{ for(const ch of s) a.push(ch==='.'?-1:+ch); }); return a; }

// 手筋1: 数字のまわりの本数だけで決まる
function ruleNumber(g,clues,st){
  const out=[];
  for(let i=0;i<clues.length;i++){ const n=clues[i]; if(n<0) continue;
    let L=0,U=0; for(const e of g.cellE[i]){ if(st[e]===1) L++; else if(st[e]===0) U++; }
    if(!U) continue;
    if(L===n) for(const e of g.cellE[i]){ if(st[e]===0) out.push({e,v:2,rule:'num',cell:i,n}); }
    else if(L+U===n) for(const e of g.cellE[i]){ if(st[e]===0) out.push({e,v:1,rule:'num',cell:i,n}); }
  }
  return out;
}
// 手筋2: 点のまわりだけで決まる（枝分かれしない・行き止まりにしない）
function ruleVertex(g,clues,st){
  const out=[];
  for(let v=0;v<g.VNUM;v++){
    let L=0,U=0; for(const e of g.vertE[v]){ if(st[e]===1) L++; else if(st[e]===0) U++; }
    if(!U) continue;
    if(L===2) for(const e of g.vertE[v]){ if(st[e]===0) out.push({e,v:2,rule:'vert',vert:v,kind:'full'}); }
    else if(L===1&&U===1) for(const e of g.vertE[v]){ if(st[e]===0) out.push({e,v:1,rule:'vert',vert:v,kind:'go'}); }
    else if(L===0&&U===1) for(const e of g.vertE[v]){ if(st[e]===0) out.push({e,v:2,rule:'vert',vert:v,kind:'dead'}); }
  }
  return out;
}
// 数字のマス（1つ、または2つ）のまわりの引き方をすべて試し、角の点で枝分かれ・行き止まりにならないものだけ残す。
// 残った引き方のすべてで同じになる辺を返す。1つも残らなければ null（矛盾）
function enumCells(g,clues,st,cells){
  const S=[], inS=new Set(), verts=new Set();
  cells.forEach(i=>{ g.cellE[i].forEach(e=>{ if(!inS.has(e)){ inS.add(e); S.push(e); } }); g.cellV[i].forEach(v=>verts.add(v)); });
  const unk=S.filter(e=>st[e]===0);
  const poss=new Map(); let valid=0;
  const val=new Map();
  for(let m=0;m<(1<<unk.length);m++){
    S.forEach(e=>val.set(e,st[e])); unk.forEach((e,k)=>val.set(e,(m>>k&1)?1:2));
    let ok=true;
    for(const i of cells){ if(clues[i]<0) continue; let L=0; for(const e of g.cellE[i]) if(val.get(e)===1) L++; if(L!==clues[i]){ ok=false; break; } }
    if(!ok) continue;
    const am=new Map();
    for(const v of verts){
      let k=0,L=0; const ou=[];
      for(const e of g.vertE[v]){ if(inS.has(e)){ if(val.get(e)===1) k++; } else if(st[e]===1) L++; else if(st[e]===0) ou.push(e); }
      const b=k+L, U=ou.length;
      if(b>2){ ok=false; break; }
      // この点に外から入る線の本数として許されるもの: b=0 → 0本か2本、 b=1 → 1本、 b=2 → 0本
      const feas=(b===0?[0,2]:b===1?[1]:[0]).filter(u=>u<=U);
      if(!feas.length){ ok=false; break; }
      let mask=3;
      if(feas.length===1){ if(feas[0]===0) mask=1; else if(feas[0]===U) mask=2; }
      for(const e of ou){ const x=(am.has(e)?am.get(e):3)&mask; if(!x){ ok=false; break; } am.set(e,x); }
      if(!ok) break;
    }
    if(!ok) continue;
    valid++;
    unk.forEach(e=>poss.set(e,(poss.get(e)||0)|(val.get(e)===1?2:1)));
    am.forEach((x,e)=>poss.set(e,(poss.get(e)||0)|x));
  }
  if(!valid) return null;
  const out=[]; poss.forEach((p,e)=>{ if(p===1) out.push({e,v:2}); else if(p===2) out.push({e,v:1}); });
  return out;
}
// 手筋3: 1つの数字と、その角の点を合わせて考える
function ruleCell(g,clues,st){
  const out=[];
  for(let i=0;i<clues.length;i++){ if(clues[i]<0) continue;
    const d=enumCells(g,clues,st,[i]); if(!d) return null;
    d.forEach(x=>out.push({e:x.e,v:x.v,rule:'cell',cell:i,n:clues[i],own:g.cellE[i].includes(x.e)}));
  }
  return out;
}
// 手筋4: 隣り合う3、ななめに並ぶ3
function rulePair3(g,clues,st){
  const out=[], R=g.R, C=g.C;
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){ const i=r*C+c; if(clues[i]!==3) continue;
    const cand=[]; if(c+1<C) cand.push([i+1,'side']); if(r+1<R) cand.push([i+C,'side']);
    if(r+1<R&&c+1<C) cand.push([i+C+1,'diag']); if(r+1<R&&c>0) cand.push([i+C-1,'diag']);
    for(const [j,kind] of cand){ if(clues[j]!==3) continue;
      const d=enumCells(g,clues,st,[i,j]); if(!d) return null;
      d.forEach(x=>out.push({e:x.e,v:x.v,rule:'pair',cells:[i,j],kind}));
    }
  }
  return out;
}
// 手筋5: 途中で小さな輪を閉じない
function ruleLoop(g,clues,st){
  const p=new Int32Array(g.VNUM).map((_,i)=>i), deg=new Uint8Array(g.VNUM), cnt=new Int32Array(g.VNUM);
  const find=x=>{ while(p[x]!==x){ p[x]=p[p[x]]; x=p[x]; } return x; };
  let LN=0;
  for(let e=0;e<g.EN;e++) if(st[e]===1){ LN++; const [a,b]=g.edgeV[e]; deg[a]++; deg[b]++; p[find(a)]=find(b); }
  for(let e=0;e<g.EN;e++) if(st[e]===1) cnt[find(g.edgeV[e][0])]++;
  const out=[];
  for(let e=0;e<g.EN;e++){ if(st[e]!==0) continue; const [a,b]=g.edgeV[e];
    if(deg[a]!==1||deg[b]!==1||find(a)!==find(b)) continue;
    let fin=cnt[find(a)]===LN;
    if(fin) for(let i=0;i<clues.length&&fin;i++){ if(clues[i]<0) continue; let L=0; for(const x of g.cellE[i]) if(st[x]===1||x===e) L++; if(L!==clues[i]) fin=false; }
    if(!fin) out.push({e,v:2,rule:'loop'});
  }
  return out;
}
const RULES=[['num',ruleNumber],['vert',ruleVertex],['cell',ruleCell],['pair',rulePair3],['loop',ruleLoop]];
// いま使える、いちばんやさしい手筋で決まる辺を返す。 allow に無い手筋は使わない。矛盾なら null
function nextDeductions(g,clues,st,allow){
  for(const [name,fn] of RULES){ if(allow&&!allow[name]) continue;
    const d=fn(g,clues,st); if(d===null) return null;
    const seen=new Set(), u=d.filter(x=>st[x.e]===0&&!seen.has(x.e)&&seen.add(x.e));
    if(u.length) return u;
  }
  return [];
}
// 線だけを見て、正解の形（数字どおりの1つの輪）になっているか
function isComplete(g,clues,st){

  for(let e=0;e<g.EN;e++) if(st[e]===1) LN++;

  let v=start, prev=-1, n=0;
  do{ let nx=-1; for(const e of g.vertE[v]){ if(st[e]===1&&e!==prev){ nx=e; break; } }
    prev=nx; const [a,b]=g.edgeV[nx]; v=(a===v?b:a); n++; }while(v!==start&&n<=LN);
  return n===LN;

  let all=true; for(let e=0;e<g.EN;e++) if(st[e]===0){ all=false; break; }

// ===== ヒント: いま論理で決まる辺を、理由つきで1か所示す =====
function clearHint(){ if(!B) return; B.edge.forEach(x=>x.classList.remove('hint','wrong')); B.hcell.forEach(x=>x.classList.remove('on')); B.ring.forEach(x=>x.classList.remove('on')); $('msg').dataset.keep=''; }
function hint(){

  const g=cur.g, st=cur.st, key=Array.from(st).join('');
  clearHint();
  const wrong=[]; for(let e=0;e<g.EN;e++) if(st[e]&&st[e]!==cur.sol[e]) wrong.push(e);
  if(wrong.length){ wrong.forEach(e=>B.edge[e].classList.add('wrong')); SE.warn();
    say('赤く光っている辺（'+wrong.length+' か所）が、正解とちがっています。まずそこを直しましょう。'); $('msg').dataset.keep='1'; return; }
  if(key!==cur.hintKey){ cur.hints++; cur.hintKey=key; store(); }
  SE.hint();
  const d=nextDeductions(g,cur.clues,st,null);
  if(!d||!d.length){ // 念のための予備（通常はここに来ない）: 正解の線を1本示す
    let e=-1; for(let x=0;x<g.EN;x++) if(!st[x]&&cur.sol[x]===1){ e=x; break; } if(e<0) for(let x=0;x<g.EN;x++) if(!st[x]){ e=x; break; }
    if(e<0) return; B.edge[e].classList.add('hint'); say('光っている辺は'+(cur.sol[e]===1?'<b>線</b>です。':'<b>×</b>（線なし）です。')); return; }
  const d0=d.find(x=>x.v===1)||d[0];
  const same=x=>x.rule===d0.rule&&x.v===d0.v&&(d0.rule==='loop'?x.e===d0.e:d0.rule==='vert'?x.vert===d0.vert:d0.rule==='pair'?x.cells.join()===d0.cells.join():x.cell===d0.cell);
  const grp=d.filter(same);

  (d0.rule==='pair'?d0.cells:d0.cell!=null?[d0.cell]:[]).forEach(i=>B.hcell[i].classList.add('on'));
  if(d0.rule==='vert') B.ring[d0.vert].classList.add('on');

    else why='「'+d0.n+'」には線が '+d0.n+' 本いります。残っている辺がちょうどその本数なので、光っている辺は'+R;

  } else {
    why='光っている辺に線を引くと、そこで小さな輪が閉じてしまいます。輪は全体で1つだけなので、光っている辺は'+R;
  }
  say(why); $('msg').dataset.keep='1';
}

// ===== 入力: いちばん近い辺をえらぶ =====
function pick(ev){
  const g=cur.g, pt=B.svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY; const p=pt.matrixTransform(B.svg.getScreenCTM().inverse());
  const gx=(p.x-PAD)/CELL, gy=(p.y-PAD)/CELL;
  if(gx<-.4||gy<-.4||gx>g.C+.4||gy>g.R+.4) return -1;
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  const hr=cl(Math.round(gy),0,g.R), hc=cl(Math.floor(gx),0,g.C-1), vr=cl(Math.floor(gy),0,g.R-1), vc=cl(Math.round(gx),0,g.C);
  // マスのまんなか付近は、どの辺かあいまいなので反応しない
  if(Math.abs(gx-(hc+.5))<.17&&Math.abs(gy-(vr+.5))<.17) return -1;
  const dh=Math.hypot(gx-(hc+.5),gy-hr), dv=Math.hypot(gx-vc,gy-(vr+.5));
  return dh<=dv?g.H(hr,hc):g.V(vr,vc);
}

  if(ev.pointerType==='mouse'){ if(ev.button===0) setEdge(e,cur.st[e]===1?0:1); else if(ev.button===2) setEdge(e,cur.st[e]===2?0:2); return; }
  press={e,x:ev.clientX,y:ev.clientY,id:ev.pointerId,long:false,
    timer:setTimeout(()=>{ if(!press) return; press.long=true; setEdge(press.e,cur.st[press.e]===2?0:2); if(navigator.vibrate) navigator.vibrate(12); },430)};
});
board.addEventListener('pointermove',ev=>{
  if(press&&ev.pointerId===press.id&&Math.hypot(ev.clientX-press.x,ev.clientY-press.y)>12){ clearTimeout(press.timer); press=null; }
  if(ev.pointerType==='mouse'&&cur&&!cur.won&&B){ const e=pick(ev); if(e<0){ B.hv.classList.remove('on'); return; }
    const [x1,y1,x2,y2]=edgeXY(cur.g,e); B.hv.setAttribute('x1',x1); B.hv.setAttribute('y1',y1); B.hv.setAttribute('x2',x2); B.hv.setAttribute('y2',y2); B.hv.classList.toggle('on',cur.st[e]===0); }
});
board.addEventListener('pointerup',ev=>{ if(!press||ev.pointerId!==press.id) return; clearTimeout(press.timer); const p=press; press=null;
  if(!p.long&&cur&&!cur.won) setEdge(p.e,(cur.st[p.e]+1)%3); });
board.addEventListener('pointercancel',()=>{ if(press){ clearTimeout(press.timer); press=null; } });
board.addEventListener('pointerleave',()=>{ if(B) B.hv.classList.remove('on'); });
board.addEventListener('contextmenu',ev=>ev.preventDefault());

// ===== ボタンとキー =====
$('bUndo').addEventListener('click',undo); $('bRedo').addEventListener('click',redo); $('bHint').addEventListener('click',()=>{ audio(); hint(); });
$('bReset').addEventListener('click',()=>$('dReset').showModal());
$('bResetOk').addEventListener('click',()=>{ $('dReset').close(); resetPuzzle(); });
$('bList').addEventListener('click',()=>{ if(cur&&!cur.won&&cur.st.some(x=>x)){ stopClock(); store(); } showHome(); });
$('bHow').addEventListener('click',()=>{ location.href='rules.html'; });
document.querySelectorAll('dialog').forEach(d=>{ d.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>d.close()));
  d.addEventListener('click',ev=>{ if(ev.target===d) d.close(); }); });
function syncSound(){ $('snd').textContent=SAVE.sound?'音 ON':'音 OFF'; $('snd').setAttribute('aria-pressed',String(!!SAVE.sound)); }
$('snd').addEventListener('click',()=>{ SAVE.sound=!SAVE.sound; persist(); syncSound(); if(SAVE.sound) SE.line(); });
document.addEventListener('keydown',ev=>{ if(!cur||ev.ctrlKey||ev.metaKey||ev.altKey||document.querySelector('dialog[open]')) return;
  const k=ev.key.toLowerCase(); if(k==='z') undo(); else if(k==='y') redo(); else if(k==='h') hint(); });
addEventListener('pageshow',ev=>{ if(ev.persisted&&!cur) renderHome(); });
syncSound(); renderHome();
</script>
