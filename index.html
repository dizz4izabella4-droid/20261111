<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffe3ef">
<title>iz Games</title>
<style>
/* ゲーム選択画面: パステルのお菓子箱。ふわふわ浮かぶ星とハート、キャンディのようなカード。作品は下の APPS に1件足すと増える */
:root{
  --sky1:#ffe3ef; --sky2:#efe4ff; --sky3:#dff6f0;
  --ink:#6b4a7a; --ink2:#9a7fa8; --white:#fffafc;
  --pink:#ff8fb8; --pinkD:#e8668f; --mint:#6fd6b8; --mintD:#3fb393; --lav:#b39cf2; --lavD:#8e72e0;
  --lemon:#ffd66b; --lemonD:#f0b93a;
  --ja: "Yu Gothic UI","游ゴシック","YuGothic","Hiragino Sans","ヒラギノ角ゴシック","Hiragino Kaku Gothic ProN",Meiryo,"Noto Sans JP",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--ja);color:var(--ink);background:linear-gradient(160deg,var(--sky1) 0%,var(--sky2) 52%,var(--sky3) 100%) fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(18px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
/* ゲームを選ぶ枠: 背景に邪神と流血の宗教画。上の部分は絵が見えるように空けて、カードは半透明にする */
.stage{position:relative;display:flex;flex-direction:column;gap:16px;padding:16px 14px 18px;border-radius:30px;overflow:hidden;
  background:#1a0806 url(launcher-bg.jpg) center top/cover no-repeat;border:4px solid #d9b25a;
  box-shadow:0 0 0 4px #fffafc,0 10px 0 #e6d3ea,0 20px 40px rgba(107,74,122,.25)}
.stage .sub{align-self:center}
.window{height:clamp(220px,min(92vw,46vh),520px);flex:none}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
body.abyss #sky{z-index:9}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* 見出し: リボンの帯 */
header{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px;text-align:center}
.ribbon{position:relative;display:inline-block;padding:12px 34px 14px;background:var(--pink);color:#fff;border-radius:999px;
  font-weight:800;font-size:clamp(26px,7vw,38px);letter-spacing:.12em;box-shadow:0 6px 0 var(--pinkD),0 12px 24px rgba(232,102,143,.28);
  text-shadow:0 2px 0 rgba(200,70,120,.35)}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:50%;width:22px;height:22px;background:var(--white);border-radius:50%;transform:translateY(-50%);
  box-shadow:inset 0 0 0 5px var(--lemon)}
.ribbon::before{left:-12px}.ribbon::after{right:-12px}
.ribbon .t{display:inline-block;animation:bob 3.2s ease-in-out infinite}
.sub{font-size:14px;font-weight:700;color:#fff;letter-spacing:.1em;padding:6px 18px;border-radius:999px;background:rgba(40,10,20,.62);text-align:center}
.sub b{color:var(--pink)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* 音楽ボタン */
.music{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:8px;padding:8px 14px 8px 12px;border:0;border-radius:999px;background:var(--white);color:var(--ink);
  font:800 13px var(--ja);letter-spacing:.06em;cursor:pointer;box-shadow:0 4px 0 #e6d3ea,0 8px 18px rgba(107,74,122,.15)}
.music:active{transform:translateY(2px);box-shadow:0 2px 0 #e6d3ea}
.music:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;height:4px;border-radius:2px;background:var(--pink)}
.music.on .eq i{animation:eq .8s ease-in-out infinite}
.music.on .eq i:nth-child(2){animation-delay:-.3s;background:var(--mint)}
.music.on .eq i:nth-child(3){animation-delay:-.55s;background:var(--lav)}
.music:not(.on) .eq i{background:#d9c8de}
/* オン・オフのスイッチ */
.sw{position:relative;width:30px;height:18px;border-radius:999px;background:#e6d3ea;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(107,74,122,.3);transition:transform .2s}
.music.on .sw{background:var(--pink)}
.music.on .sw::after{transform:translateX(12px)}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

/* カード: 1行のコンパクトな札。アイコン・名前とひとこと・向いている端末・矢印。背景の絵が透けて見える */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.app{--c:var(--pink);--cD:var(--pinkD);--cL:#ffe9f1;
  position:relative;display:flex;align-items:center;gap:12px;padding:9px 12px 9px 9px;
  background:rgba(255,250,252,.5);border-radius:20px;color:inherit;text-decoration:none;border:2px solid rgba(255,255,255,.7);
  box-shadow:0 4px 0 rgba(255,255,255,.35),0 10px 22px rgba(20,4,8,.25);transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s,border-color .18s,background .18s;
  opacity:0;transform:translateY(14px) scale(.97)}
.app.mint{--c:var(--mint);--cD:var(--mintD);--cL:#dcf6ee}
.app.lav{--c:var(--lav);--cD:var(--lavD);--cL:#ece5ff}
.app.lemon{--c:var(--lemon);--cD:var(--lemonD);--cL:#fff3cf}
.app.show{opacity:1;transform:none;transition:opacity .35s,transform .45s cubic-bezier(.3,1.6,.5,1),box-shadow .18s,border-color .18s,background .18s}
.app.sel,.app:hover,.app:focus-visible{border-color:var(--c);background:rgba(255,250,252,.72);transform:translateY(-2px);outline:none}
.app:active{transform:translateY(2px)}
.icon{flex:none;width:48px;height:48px;border-radius:15px;background:var(--c);display:grid;place-items:center;box-shadow:inset 0 -4px 0 var(--cD)}
.icon svg{width:32px;height:32px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.en{font-size:10px;font-weight:700;color:#5a3a68;letter-spacing:.08em;line-height:1.3}
.ds{font-size:15px;font-weight:700;color:#3e2448;letter-spacing:.04em}
.tag{flex:none;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--cL);color:var(--cD);letter-spacing:.06em}
.rec{position:absolute;top:-9px;right:48px;padding:2px 10px;border-radius:999px;background:var(--lemon);color:#7a5a10;font-size:10px;font-weight:800;
  letter-spacing:.06em;box-shadow:0 2px 0 var(--lemonD);transform:rotate(2deg)}
.go{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);display:grid;place-items:center;box-shadow:0 3px 0 var(--cD)}
.go svg{width:13px;height:13px}

footer{text-align:center;font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.08em;display:flex;flex-direction:column;gap:4px}
footer .keys{opacity:.8}
@media (max-width:480px){
  .app{gap:10px}
  .ds{font-size:14px}
  footer .keys{display:none}
  .music{padding:7px 12px 7px 10px;font-size:12px}
  header{padding-top:46px}
}

/* ===== 主題歌モード「ABYSS CODE」: かわいい画面が崩れ落ち、ダークファンタジーのカラオケ画面になる ===== */
#abyss{position:fixed;inset:0;z-index:8;display:none;overflow:hidden;color:#f4e6d0;background:#050104}
body.abyss #abyss{display:block}
body.abyss,html.lock,html.lock body{overflow:hidden}
html.lock .wrap{contain:paint}
.abg{position:absolute;inset:-4%;background:#050104 url(launcher-bg.jpg) center 30%/cover no-repeat;filter:brightness(.32) saturate(1.25) contrast(1.1);
  animation:abgz 40s linear infinite alternate}
@keyframes abgz{from{transform:scale(1)}to{transform:scale(1.12)}}
.abg2{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(150,0,20,.0) 0%,rgba(90,0,12,.35) 55%,rgba(5,0,3,.92) 100%),
  linear-gradient(180deg,rgba(5,0,3,.6) 0%,rgba(5,0,3,0) 30%,rgba(5,0,3,0) 70%,rgba(5,0,3,.75) 100%)}
#flash{position:absolute;inset:0;background:#ff1a2a;opacity:0;pointer-events:none;mix-blend-mode:screen}
#flash.go{animation:aflash .9s ease-out}
@keyframes aflash{0%{opacity:.85}100%{opacity:0}}
/* 題名 */
#atitle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));opacity:0;pointer-events:none;transition:opacity .8s}
#atitle.on{opacity:1}
#atitle h1{margin:0;font:700 clamp(46px,15vw,120px)/.95 "Times New Roman","Liberation Serif",serif;letter-spacing:.06em;color:#f7e3b0;
  text-shadow:0 0 18px rgba(255,40,40,.75),0 0 46px rgba(200,0,20,.6),3px 3px 0 #3a0008}
#atitle h1 span{display:block}
#atitle.on h1{animation:tin 1.6s cubic-bezier(.2,.8,.2,1) both}
#atitle p{margin:0;font:700 clamp(17px,5vw,30px) var(--ja);letter-spacing:.32em;color:#e8b8a0;text-shadow:0 0 12px rgba(255,40,40,.6)}
#atitle.on p{animation:tin 1.6s .5s cubic-bezier(.2,.8,.2,1) both}
#atitle.glitch h1{animation:tglitch .35s steps(3) 2}
@keyframes tin{0%{opacity:0;transform:scale(1.35);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
@keyframes tglitch{0%{transform:translate(0,0);clip-path:inset(0 0 0 0)}33%{transform:translate(-6px,2px);clip-path:inset(20% 0 40% 0)}66%{transform:translate(5px,-3px);clip-path:inset(55% 0 5% 0)}100%{transform:none;clip-path:inset(0 0 0 0)}}
/* 歌詞 */
#kara{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,3.5vh,30px);text-align:center;opacity:0;transition:opacity .6s;
  padding:calc(70px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(80px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
#kara.on{opacity:1}
#kara,#atitle{pointer-events:none;z-index:1}
#abar{z-index:3}
#atoast{z-index:4}
#kcal{z-index:3}
#ksec{align-self:center;white-space:nowrap;font:700 clamp(12px,3.4vw,16px) "Times New Roman","Liberation Serif",serif;letter-spacing:.24em;color:#c9a35a;text-shadow:0 0 10px rgba(255,60,40,.5)}
#ksec::before,#ksec::after{content:"";display:inline-block;width:2.4em;height:1px;background:currentColor;vertical-align:middle;margin:0 .8em;opacity:.6}
.kl{align-self:center;font-family:var(--ja);font-weight:800;letter-spacing:.06em;line-height:1.35;white-space:nowrap;transition:opacity .3s}
#kprev{font-size:clamp(15px,4.4vw,26px);color:rgba(244,230,208,.32);min-height:1.35em}
#kcur{--p:0%;font-size:clamp(30px,9.4vw,68px);min-height:1.35em;align-self:center;display:inline-block;
  background:linear-gradient(90deg,#ffe2a0 0%,#ff5a3a calc(var(--p) - 2%),rgba(255,240,220,.38) var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,40,30,.55)) drop-shadow(0 2px 0 rgba(40,0,6,.9))}
#kcur.shout{letter-spacing:.04em}
#kcur.pop{animation:kpop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes kpop{0%{transform:scale(.86);opacity:.2}100%{transform:none;opacity:1}}
#knext{font-size:clamp(16px,4.8vw,28px);color:rgba(244,230,208,.5);min-height:1.35em}
/* 下の進み具合 */
#abar{position:absolute;left:max(18px,env(safe-area-inset-left,0px));right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;font:12px "Times New Roman","Liberation Serif",serif;color:#a8845a;font-variant-numeric:tabular-nums}
#abar .tr{flex:1;height:3px;background:rgba(200,150,90,.22);border-radius:3px;overflow:hidden}
#abar .tr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a0010,#ff4a2a,#ffd27a)}
#abar button{font:700 11px var(--ja);letter-spacing:.06em;color:#e8c890;background:rgba(40,6,10,.7);border:1px solid rgba(200,150,90,.4);border-radius:999px;padding:6px 12px;cursor:pointer}
#abar button:focus-visible{outline:2px solid #ffd27a;outline-offset:2px}
#abar button[hidden]{display:none}
#atoast{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 36px);padding:10px 16px;border-radius:12px;
  background:rgba(30,4,8,.92);border:1px solid rgba(220,160,90,.45);font:700 13px/1.6 var(--ja);color:#f4e0c0;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#atoast.on{opacity:1}
#atoast.btn{pointer-events:auto}
#atoast button{margin-top:8px;font:700 12px var(--ja);color:#1a0306;background:#ffd27a;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
/* 調整中の表示 */
#kcal{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font:700 13px var(--ja);color:#ffd27a;letter-spacing:.06em;display:none}
body.calib #kcal{display:block}
/* ひび割れ */
#crack{position:fixed;inset:0;z-index:9;width:100%;height:100%;pointer-events:none;opacity:0}
#crack.go{animation:crk 1.2s ease-out forwards}
@keyframes crk{0%{opacity:0}8%{opacity:1}70%{opacity:.85}100%{opacity:0}}
/* 崩壊のときの揺れ */
.quake{animation:quake .5s steps(8)}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-8px,4px) rotate(-.6deg)}40%{transform:translate(7px,-5px) rotate(.5deg)}60%{transform:translate(-5px,-3px)}80%{transform:translate(6px,5px) rotate(.4deg)}}
/* 主題歌モード中のスイッチ */
.music{z-index:12}
body.abyss .music{background:rgba(24,4,8,.85);color:#f0d6a0;box-shadow:0 0 0 1px rgba(220,160,90,.45),0 0 18px rgba(255,40,30,.35)}
body.abyss .music .sw{background:#5a1018}
body.abyss .music.on .sw{background:#c41a2a}
@media (prefers-reduced-motion:reduce){.abg,#atitle.on h1,#atitle.on p,#kcur.pop,.quake{animation:none}}
@media (prefers-reduced-motion:reduce){.ribbon .t,.music.on .eq i{animation:none}.app,.app.show{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<button type="button" class="music" id="music" role="switch" aria-checked="false"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="mLabel">主題歌を流す</span><span class="sw" aria-hidden="true"></span></button>
<div class="wrap">
  <header>
    <div class="ribbon"><span class="t">iz Games</span></div>
  </header>
  <section class="stage" aria-label="ゲームをえらぶ">
    <div class="sub">あそぶゲームを<b>えらんでね</b></div>
    <div class="window" aria-hidden="true"></div>
    <ul class="list" id="list"></ul>
  </section>
  <footer><span id="count"></span><span class="keys">↑↓ でえらんで Enter であそぶ</span></footer>
</div>
<div id="abyss" aria-live="polite">
  <div class="abg"></div><div class="abg2"></div><div id="flash"></div>
  <div id="atitle"><h1><span>ABYSS</span><span>CODE</span></h1><p>— 深淵の黙示録 —</p></div>
  <div id="kcal"></div>
  <div id="kara"><div id="ksec"></div><div class="kl" id="kprev"></div><div class="kl" id="kcur"></div><div class="kl" id="knext"></div></div>
  <div id="atoast"></div>
  <div id="abar"><span id="atime">0:00</span><span class="tr"><i id="aprog"></i></span><button type="button" id="acal">タイミングを合わせる</button><button type="button" id="areset" hidden>元に戻す</button></div>
</div>
<canvas id="crack" aria-hidden="true"></canvas>
<audio id="bgm" preload="auto" src="launcher-bgm.mp3"></audio>
<script>
// ===== 作品の一覧 =====
// 新しい作品を載せるとき: リポジトリに作品のフォルダ（中に index.html）を作り、ここに1件足す
//   path … フォルダ名（末尾に /）   ja … 日本語の名前   name … 英語の名前   desc … ひとこと説明
//   for  … 'pc' / 'mobile' / 'both'   color … 'pink' / 'mint' / 'lav' / 'lemon'   icon … 下の ICONS の名前
const APPS=[
  {path:'typing-pc/', ja:'CMDタイピング', name:'CMD TYPING', for:'pc', color:'mint', icon:'keyboard',
   desc:'キーボード使用'},
  {path:'typing-mobile/', ja:'CMDタイピング スマホ版', name:'CMD TYPING MOBILE', for:'mobile', color:'lav', icon:'phone',
   desc:'フリック'},
  {path:'tori-to-kemono/', ja:'鳥と獣の戦い', name:'BIRDS VS BEASTS', for:'mobile', color:'pink', icon:'bird',
   desc:'机に置いて対戦'},
];
// アイコン（白で描く）
const ICONS={
  keyboard:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="13" width="38" height="24" rx="6"/><path d="M12 21h.01M18 21h.01M24 21h.01M30 21h.01M36 21h.01M12 27h.01M36 27h.01M17 30h14" stroke-width="4"/></svg>',
  phone:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="4" width="22" height="40" rx="6"/><path d="M21 38h6"/><text x="24" y="27" text-anchor="middle" fill="#fff" stroke="none" font-size="14" font-weight="800" font-family="sans-serif">あ</text></svg>',
  bird:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 28c0-9 7-15 16-15 6 0 10 3 12 7l6 1-5 4c0 9-7 14-16 14-7 0-13-4-13-11z" fill="rgba(255,255,255,.25)"/><path d="M14 25c4 4 10 4 14 0"/><circle cx="31" cy="20" r="1.6" fill="#fff"/></svg>',
  star:'<svg viewBox="0 0 48 48" fill="#fff"><path d="M24 6l5.5 11.6 12.5 1.7-9.2 8.7 2.3 12.5L24 34.4 12.9 40.5l2.3-12.5L6 19.3l12.5-1.7z"/></svg>'
};
const GO='<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>';
const LABEL={pc:'PC',mobile:'スマホ'};

const $=id=>document.getElementById(id);
const touch=matchMedia('(pointer:coarse)').matches, myDev=touch?'mobile':'pc';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const list=$('list');
let sel=0;
const items=APPS.map((a,i)=>{
  const li=document.createElement('li'), el=document.createElement('a');
  el.className='app '+(a.color||'pink'); el.href=a.path;
  const ic=document.createElement('span'); ic.className='icon'; ic.innerHTML=ICONS[a.icon]||ICONS.star;
  const en=document.createElement('span'); en.className='en'; en.textContent=a.name;
  const ds=document.createElement('span'); ds.className='ds'; ds.textContent=a.desc;
  const tx=document.createElement('span'); tx.className='txt'; tx.append(en,ds);
  el.setAttribute('aria-label',a.ja+'（'+a.desc+'）');
  el.append(ic,tx);
  (a.for==='both'?['pc','mobile']:[a.for]).forEach(f=>{ const t=document.createElement('span'); t.className='tag'; t.textContent=LABEL[f]+'むけ'; el.appendChild(t); });
  if(a.for===myDev||a.for==='both'){ const r=document.createElement('span'); r.className='rec'; r.textContent='この端末におすすめ'; el.appendChild(r); }
  const go=document.createElement('span'); go.className='go'; go.innerHTML=GO; el.appendChild(go);
  el.addEventListener('mouseenter',()=>{ sel=i; mark(); pop(560+i*80); });
  el.addEventListener('click',e=>{ e.preventDefault(); launch(i); });
  li.appendChild(el); list.appendChild(li); return el;
});
sel=Math.max(0,APPS.findIndex(a=>a.for===myDev||a.for==='both'));
function mark(){ items.forEach((el,i)=>el.classList.toggle('sel',i===sel)); }
$('count').textContent='ぜんぶで '+APPS.length+' こ';
items.forEach((el,i)=>setTimeout(()=>el.classList.add('show'),reduce?0:150+i*120));
mark();

// ===== 主題歌モード「ABYSS CODE — 深淵の黙示録 —」 =====
// スイッチを入れると: かわいい画面が揺れてひび割れ、崩れ落ちる → 暗転して題名 → 曲に合わせて歌詞を大きく表示（カラオケ）

const DEF=[]; // 推定の歌い出し時刻
SONG.forEach(([label,a,b,txt])=>{ const ls=txt.split('\n'), w=ls.map(l=>l.replace(/[\s・！]/g,'').length+3), tot=w.reduce((x,y)=>x+y,0);
  let t=a; ls.forEach((l,k)=>{ DEF.push({label,text:l,start:+t.toFixed(2),secEnd:b}); t+=(b-a)*w[k]/tot; }); });
const TKEY='abyss-timing-v1';
let LINES=[];
function buildLines(){
  let custom=null; try{ const v=JSON.parse(localStorage.getItem(TKEY)||'null'); if(Array.isArray(v)&&v.length===DEF.length) custom=v; }catch(e){}
  LINES=DEF.map((d,i)=>({...d,start:custom?custom[i]:d.start}));
  LINES.forEach((l,i)=>{ const nx=LINES[i+1]; const sameSec=nx&&nx.label===l.label;
    l.end=nx?(sameSec?nx.start:Math.min(nx.start,l.secEnd+(custom?2:0))):Math.min(l.start+6,l.secEnd+2); });
  $('areset').hidden=!custom;
}
let abyss=false, phase='', calib=false, calIdx=0, calTimes=[], shown=-2, endT=0;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function show(on){ $('music').classList.toggle('on',on); $('music').setAttribute('aria-checked',String(on)); }
$('music').addEventListener('click',e=>{ e.stopPropagation(); audio(); abyss?exitAbyss():enterAbyss(); });

// 崩壊: 揺れ・ひび割れ・赤い閃光のあと、パーツが重力で落ちていく
const FALL=()=>[document.querySelector('.ribbon'),document.querySelector('.sub'),...items,document.querySelector('.stage'),document.querySelector('footer')];
let fallRaf=0;
function collapse(done){
  const wrap=document.querySelector('.wrap'); document.documentElement.classList.add('lock'); scrollTo(0,0);
  if(reduce){ wrap.style.opacity='0'; done(); return; }
  wrap.classList.remove('quake'); void wrap.offsetWidth; wrap.classList.add('quake');
  drawCrack(); $('crack').classList.remove('go'); void $('crack').offsetWidth; $('crack').classList.add('go');
  if(audio()){ rumble(); }
  const els=FALL(), st=els.map((el,k)=>({el,x:0,y:0,r:0,vx:(Math.random()-.5)*260,vy:-120-Math.random()*220,vr:(Math.random()-.5)*220,delay:.35+k*.06+Math.random()*.12}));
  let t0=performance.now(), last=t0;
  cancelAnimationFrame(fallRaf);
  const step=now=>{ const dt=Math.min(.05,(now-last)/1000); last=now; const el=(now-t0)/1000; let alive=false;
    st.forEach(o=>{ if(el<o.delay){ alive=true; return; } o.vy+=1500*dt; o.x+=o.vx*dt; o.y+=o.vy*dt; o.r+=o.vr*dt;
      o.el.style.transition='none'; o.el.style.transform=`translate(${o.x}px,${o.y}px) rotate(${o.r}deg)`;
      if(o.y<innerHeight*1.4) alive=true; });
    if(alive&&el<3) fallRaf=requestAnimationFrame(step); else { wrap.style.visibility='hidden'; done(); } };
  fallRaf=requestAnimationFrame(step);
}
function restoreUI(){
  cancelAnimationFrame(fallRaf);
  const wrap=document.querySelector('.wrap'); wrap.style.visibility=''; wrap.style.opacity=''; wrap.classList.remove('quake');
  FALL().forEach((el,k)=>{ el.style.transition='none'; el.style.transform='translateY(-120vh) rotate('+((Math.random()-.5)*40)+'deg)';
    void el.offsetWidth; setTimeout(()=>{ el.style.transition='transform .8s cubic-bezier(.3,1.35,.5,1)'; el.style.transform=''; },60+k*70);
    setTimeout(()=>{ el.style.transition=''; },1200+k*70); });
  setTimeout(()=>{ if(!abyss) document.documentElement.classList.remove('lock'); },1600);
}
// ひび割れの線（画面の一点から放射状に走る）
function drawCrack(){
  const c=$('crack'), d=Math.min(2,devicePixelRatio||1); c.width=innerWidth*d; c.height=innerHeight*d; const g=c.getContext('2d'); g.scale(d,d);
  const ox=innerWidth*(.35+Math.random()*.3), oy=innerHeight*(.35+Math.random()*.25);
  g.lineCap='round';
  for(let i=0;i<14;i++){ let a=i/14*Math.PI*2+Math.random()*.3, x=ox, y=oy, len=Math.max(innerWidth,innerHeight)*(.4+Math.random()*.5);
    g.beginPath(); g.moveTo(x,y);
    for(let s=0;s<len;s+=20+Math.random()*40){ a+=(Math.random()-.5)*.6; x+=Math.cos(a)*30; y+=Math.sin(a)*30; g.lineTo(x,y);
      if(Math.random()<.18){ g.moveTo(x,y); } }
    g.strokeStyle='rgba(255,255,255,.9)'; g.lineWidth=2.2; g.shadowColor='rgba(255,30,40,.9)'; g.shadowBlur=10; g.stroke(); }
}
// 低い地鳴り（効果音）
function rumble(){ const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(70,t); o.frequency.exponentialRampToValueAtTime(28,t+1.4);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.05); g.gain.exponentialRampToValueAtTime(.0001,t+1.5);
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=300; o.connect(f); f.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+1.6);
  [0,.12,.3].forEach(d=>tone(1800+Math.random()*900,d,.12,.04,'square')); }

function enterAbyss(){
  if(abyss) return; abyss=true; show(true); buildLines(); shown=-2; phase='title';
  try{ bgm.currentTime=0; }catch(e){}
  const p=bgm.play(); if(p&&p.catch) p.catch(()=>{ toast('曲を再生できませんでした。もう一度スイッチを押してください'); exitAbyss(); });
  collapse(()=>{});
  setTimeout(()=>{ if(!abyss) return; document.body.classList.add('abyss'); embers(true);
    const f=$('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    $('atitle').classList.add('on'); $('kara').classList.remove('on'); },reduce?0:1100);
  requestAnimationFrame(tick);
}
function exitAbyss(){
  if(!abyss) return; abyss=false; calib=false; document.body.classList.remove('calib'); show(false);
  bgm.pause(); try{ bgm.currentTime=0; }catch(e){}
  $('atitle').classList.remove('on'); $('kara').classList.remove('on'); toast('');
  document.body.classList.remove('abyss'); embers(false); restoreUI();
}
bgm.addEventListener('ended',()=>{ if(!abyss) return; if(calib) finishCalib(); setTimeout(exitAbyss,1800); });

// 毎フレーム: 曲の再生位置に合わせて表示を切り替える
// 1行に収まるよう文字の大きさを縮める（行の折り返しをなくして、左から右へ色が流れるようにする）
const KMAX={kprev:26,kcur:68,knext:28,ksec:16}, KMIN={kprev:11,kcur:18,knext:12,ksec:9};
function fit(id,shout){ const el=$(id); const max=Math.min(KMAX[id]*(shout?1.35:1),innerWidth*(id==='kcur'?(shout?.13:.094):id==='ksec'?.034:.05));
  el.style.fontSize=max+'px'; const k=$('kara'), cs=getComputedStyle(k), w=k.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-8;
  const inner=el.offsetWidth; if(inner>w) el.style.fontSize=Math.max(KMIN[id],max*w/inner*.98)+'px'; }
function fitAll(){ fit('ksec'); fit('kprev'); fit('kcur',$('kcur').classList.contains('shout')); fit('knext'); }
addEventListener('resize',()=>{ if(abyss) fitAll(); });
function setLine(i){
  const cur=$('kcur'), L=LINES[i];
  $('kprev').textContent=i>0&&LINES[i-1].label===(L?L.label:'')?LINES[i-1].text:'';
  cur.textContent=L?L.text:''; cur.classList.toggle('shout',!!L&&/アビス・コード/.test(L.text));
  cur.classList.remove('pop'); void cur.offsetWidth; cur.classList.add('pop');
  const nx=LINES[i+1]; $('knext').textContent=nx?nx.text:'';
  $('ksec').textContent=L?L.label:'';
  fitAll();
}
function tick(){
  if(!abyss) return;
  const t=bgm.currentTime||0, dur=bgm.duration||180.85;
  $('aprog').style.width=(t/dur*100)+'%'; $('atime').textContent=fmt(t)+' / '+fmt(dur);
  if(calib){ calView(t); requestAnimationFrame(tick); return; }
  const first=LINES[0].start, lastL=LINES[LINES.length-1];
  if(t<first-.4||t>lastL.end+1){ // 前奏と後奏は題名
    if(phase!=='title'){ phase='title'; $('kara').classList.remove('on'); $('atitle').classList.add('on'); $('atitle').classList.add('glitch'); setTimeout(()=>$('atitle').classList.remove('glitch'),800); }
  } else {
    if(phase!=='lyrics'){ phase='lyrics'; $('atitle').classList.remove('on'); $('kara').classList.add('on'); shown=-2; }
    let i=-1; for(let k=0;k<LINES.length;k++){ if(LINES[k].start<=t+.05) i=k; else break; }
    if(i<0) i=0;
    // 休止（間奏）: 次の行が来るまで、次の部分の見出しと次の行だけ出す
    const L=LINES[i], gap=t>L.end+.3&&LINES[i+1]&&LINES[i+1].start-t>.9;
    const key=gap?'g'+i:i;
    if(key!==shown){ shown=key;
      if(gap){ const nx=LINES[i+1]; $('kprev').textContent=''; $('kcur').textContent='…'; $('kcur').classList.remove('shout'); $('knext').textContent=nx.text; $('ksec').textContent=nx.label; $('kcur').style.setProperty('--p','0%'); fitAll(); }
      else setLine(i); }
    if(!gap){ const p=Math.max(0,Math.min(1,(t-L.start)/Math.max(.4,(L.end-L.start)*.9))); $('kcur').style.setProperty('--p',(p*104).toFixed(1)+'%'); }
  }
  requestAnimationFrame(tick);
}

// ===== タイミング合わせ: 曲を頭から流し、各行の歌い出しで画面をタップ。タップした時刻をこの端末に保存する =====
function startCalib(){
  calib=true; calIdx=0; calTimes=[]; document.body.classList.add('calib');
  try{ bgm.currentTime=0; }catch(e){} bgm.play();
  $('atitle').classList.remove('on'); $('kara').classList.add('on'); phase='calib';
  toast('歌い出しに合わせて、画面のどこかをタップしてください（パソコンはスペースキーでも可）',4000);
  calShow();
}
function calShow(){
  const L=LINES[calIdx], P=LINES[calIdx-1];
  $('kcal').textContent='タイミング合わせ中　'+calIdx+' / '+LINES.length;
  $('ksec').textContent=L?L.label:'';
  $('kprev').textContent=P?P.text:'';
  $('kcur').textContent=L?L.text:'おわり'; $('kcur').classList.toggle('shout',!!L&&/アビス・コード/.test(L.text)); $('kcur').style.setProperty('--p','0%');
  $('knext').textContent=LINES[calIdx+1]?LINES[calIdx+1].text:'';
  fitAll();
}
function calView(t){ /* 調整中は、次にタップする行を薄く表示しておく */ }
function calTap(){
  if(!calib||calIdx>=LINES.length) return;
  calTimes.push(+(bgm.currentTime).toFixed(2)); $('kcur').style.setProperty('--p','104%');
  const cur=$('kcur'); cur.classList.remove('pop'); void cur.offsetWidth; cur.classList.add('pop');
  calIdx++; setTimeout(()=>{ if(calib) calShow(); },220);
  if(calIdx>=LINES.length) setTimeout(finishCalib,400);
}
function finishCalib(){
  if(!calib) return; calib=false; document.body.classList.remove('calib');
  if(calTimes.length===LINES.length){
    try{ localStorage.setItem(TKEY,JSON.stringify(calTimes)); }catch(e){}
    buildLines();
    toastCopy('タイミングを保存しました。この端末では次からこのタイミングで表示します。下のボタンでデータをコピーして送ってもらえれば、どの端末でも同じになるよう組み込みます。',JSON.stringify(calTimes));
  } else toast('最後まで合わせられなかったので、保存しませんでした',4000);
  shown=-2; phase='';
}
$('abyss').addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; if(calib){ e.preventDefault(); calTap(); } });
document.addEventListener('keydown',e=>{ if(calib&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); calTap(); } else if(abyss&&e.key==='Escape') exitAbyss(); });
$('acal').addEventListener('click',e=>{ e.stopPropagation(); startCalib(); });
$('areset').addEventListener('click',e=>{ e.stopPropagation(); try{ localStorage.removeItem(TKEY); }catch(_){} buildLines(); shown=-2; toast('推定のタイミングに戻しました',2500); });

let toastT=0;
function toast(msg,ms){ const t=$('atoast'); clearTimeout(toastT); t.classList.remove('btn'); t.textContent=msg; t.classList.toggle('on',!!msg); if(msg&&ms) toastT=setTimeout(()=>t.classList.remove('on'),ms); }
function toastCopy(msg,data){ const t=$('atoast'); clearTimeout(toastT); t.textContent=msg; t.appendChild(document.createElement('br'));
  const b=document.createElement('button'); b.type='button'; b.textContent='データをコピー';
  b.addEventListener('click',e=>{ e.stopPropagation(); const done=()=>{ b.textContent='コピーしました'; setTimeout(()=>t.classList.remove('on'),1500); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(data).then(done,()=>{ b.textContent='コピーできませんでした'; }); else b.textContent='コピーできませんでした'; });
  const c=document.createElement('button'); c.type='button'; c.textContent='閉じる'; c.style.marginLeft='8px'; c.addEventListener('click',e=>{ e.stopPropagation(); t.classList.remove('on'); });
  t.append(b,c); t.classList.add('on','btn'); }
buildLines();

// ===== 効果音: ぽわん（選ぶ）、きらりん（決定） =====
let ac=null;
function audio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); return ac; }
function tone(f,t,d,v,type){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,ac.currentTime+t);
  g.gain.setValueAtTime(0,ac.currentTime+t); g.gain.linearRampToValueAtTime(v,ac.currentTime+t+.01); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);
  o.connect(g); g.connect(ac.destination); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+d+.02); }
let lastPop=0;
function pop(f){ if(!ac||ac.state!=='running') return; const n=performance.now(); if(n-lastPop<60) return; lastPop=n; tone(f,0,.18,.08,'sine'); tone(f*2,0,.12,.03,'triangle'); }
function launch(i){
  sel=i; mark();
  if(audio()){ [784,988,1319,1568].forEach((f,k)=>tone(f,k*.06,.3,.08,'triangle')); }
  bgm.pause(); burst(items[i]);
  setTimeout(()=>{ location.href=APPS[i].path; },reduce?0:420);
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); sel=(sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length; mark(); items[sel].focus(); audio(); pop(560+sel*80); }
  else if(e.key==='Enter'&&(document.activeElement===document.body||items.includes(document.activeElement))){ e.preventDefault(); launch(items.includes(document.activeElement)?items.indexOf(document.activeElement):sel); }
});

// ===== 背景: ふわふわ浮かぶ星・ハート・まる。決定するとカードから飛び散る =====
const cv=$('sky'), cx=cv.getContext('2d');
const COLS=['#ff8fb8','#6fd6b8','#b39cf2','#ffd66b','#ffffff'];
let W=0,H=0,DPR=1, parts=[], sparks=[];
let ember=false;
const EMB=['#ff3a1a','#ff7a2a','#ffc46a','#b01010','#ff5a3a'];
function embers(on){ ember=on; parts.forEach(p=>{ if(on){ p.c=EMB[Math.random()*EMB.length|0]; p.k=2; p.vy=-(30+Math.random()*70); p.r=2+Math.random()*4; p.a=.5+Math.random()*.5; } else Object.assign(p,mk()); }); }
function size(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
function mk(y){ return {x:Math.random()*W,y:y==null?Math.random()*H:y,r:5+Math.random()*9,k:Math.random()*3|0,c:COLS[Math.random()*COLS.length|0],
  vy:reduce?0:-(6+Math.random()*12),sw:Math.random()*6.28,sp:reduce?0:.6+Math.random()*.8,rot:Math.random()*6.28,vr:reduce?0:(Math.random()-.5)*.6,a:.35+Math.random()*.35}; }
function shape(k,r){
  cx.beginPath();
  if(k===0){ for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, q=i%2?r*.45:r; cx.lineTo(Math.cos(a)*q,Math.sin(a)*q); } cx.closePath(); }
  else if(k===1){ cx.moveTo(0,r*.9); cx.bezierCurveTo(-r*1.3,-r*.1,-r*.6,-r*1.1,0,-r*.35); cx.bezierCurveTo(r*.6,-r*1.1,r*1.3,-r*.1,0,r*.9); }
  else cx.arc(0,0,r*.6,0,6.283);
  cx.fill();
}
function burst(el){
  if(reduce) return; const b=el.getBoundingClientRect();
  for(let i=0;i<26;i++){ const a=Math.random()*6.283, s=120+Math.random()*260;
    sparks.push({x:b.left+b.width*(.2+Math.random()*.6),y:b.top+b.height/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,r:4+Math.random()*7,k:Math.random()*3|0,c:COLS[Math.random()*4|0],t:0,rot:0}); }
}
let last=0;
function frame(t){
  const dt=Math.min(.05,(t-(last||t))/1000); last=t;
  cx.clearRect(0,0,W,H);
  parts.forEach(p=>{
    p.y+=p.vy*dt; p.sw+=dt*p.sp; p.rot+=p.vr*dt; if(p.y<-20){ Object.assign(p,mk(H+20)); if(ember){ p.c=EMB[Math.random()*EMB.length|0]; p.k=2; p.vy=-(30+Math.random()*70); p.r=2+Math.random()*4; } }
    cx.save(); cx.translate(p.x+Math.sin(p.sw)*14,p.y); cx.rotate(p.rot); cx.globalAlpha=ember?p.a*(.6+Math.random()*.4):p.a; cx.fillStyle=p.c; if(ember){ cx.shadowColor=p.c; cx.shadowBlur=8; } shape(p.k,p.r); cx.restore();
  });
  sparks=sparks.filter(s=>(s.t+=dt)<.9);
  sparks.forEach(s=>{ s.vy+=520*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.rot+=dt*6;
    cx.save(); cx.translate(s.x,s.y); cx.rotate(s.rot); cx.globalAlpha=1-s.t/.9; cx.fillStyle=s.c; shape(s.k,s.r); cx.restore(); });
  requestAnimationFrame(frame);
}
size(); addEventListener('resize',size);
parts=Array.from({length:reduce?14:Math.min(34,Math.round(W*H/22000))},()=>mk());
if(reduce){ frame(0); } else requestAnimationFrame(frame);

addEventListener('pageshow',e=>{ if(e.persisted){ sparks=[]; if(abyss) exitAbyss(); } });
