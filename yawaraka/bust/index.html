*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0c0b;color:var(--ink);font-family:var(--ja)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}

.tabs{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--panel);border:1px solid var(--line);pointer-events:auto}

.tab{padding:7px 9px;border-radius:9px}

.pill{pointer-events:auto;padding:7px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.panel{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(94%,480px);
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.panel section{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
.chip.on{background:rgba(200,146,74,.18);border-color:var(--acc);color:var(--ink)}

.ctl{display:flex;align-items:center;gap:10px;min-height:28px}

.seg{flex:1;display:flex;gap:4px}

.seg button.on{background:var(--acc);color:#1b1208;border-color:var(--acc)}

<body>
<canvas id="cv"></canvas>
<div id="err" class="hidden">WebGL is not available on this device.</div>

<div class="top-bar">
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="sculpt">SCULPT</button>
    <button class="tab" data-tab="soft">SOFT</button>
    <button class="tab" data-tab="shake">SHAKE</button>
    <button class="tab" data-tab="parts">PARTS</button>
    <button class="tab" data-tab="view">VIEW</button>
  </div>
</div>

<div class="panel" id="panel">
  <!-- SCULPT -->
  <section data-pane="sculpt">
    <div class="chips" id="chips"></div>
    <div id="ctrls"></div>
    <div class="row end"><button class="mini" id="reset">RESET</button></div>
  </section>
  <!-- SOFT -->
  <section data-pane="soft" class="hidden">
    <div class="ctl-col" id="softBox"></div>
    <div class="note">Drag the bust to test the wobble.</div>
  </section>
  <!-- SHAKE -->
  <section data-pane="shake" class="hidden">
    <div class="ctl"><label>Scene</label><div class="seg" id="bgSeg"></div></div>
    <div class="note">Grab the bust and swing it around.</div>
  </section>
  <!-- PARTS -->
  <section data-pane="parts" class="hidden">
    <div class="ctl"><label>Explode</label><input type="range" id="explode" min="0" max="1" step="0.01" value="0"><output id="explodeV">0%</output></div>
    <div class="plist" id="plist"></div>
    <div class="note">Tap a part to highlight it.</div>
  </section>
  <!-- VIEW -->
  <section data-pane="view" class="hidden">
    <div class="ctl"><label>Finish</label><div class="seg" id="finSeg"></div></div>
    <div class="ctl"><label>Light</label><input type="range" id="light" min="-3.14" max="3.14" step="0.01" value="-0.7"><output id="lightV"></output></div>
    <div class="row">
      <button class="mini" id="turn">TURNTABLE</button>
      <button class="mini" id="front">FRONT</button>
      <button class="mini" id="shot">SAVE PNG</button>
    </div>
  </section>
</div>

float h31(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z); }

/* 胴の素の形（胸郭・背中・胸の前面・腹部）。衣はこれを外へ広げて作る */
float chestF(vec3 p){
  float swm=mix(1.,uShW,.6);
  float rib=sdE(p-vec3(0.,.56,-.02),vec3(.285*swm,.33,.19*uChest));
  float bk=sdE(p-vec3(0.,.62,-.07),vec3(.30*swm,.24,.14));
  float fr=sdE(p-vec3(0.,.55,.03),vec3(.25*swm,.16,.155*uChest));
  return smin(smin(rib,bk,.08),fr,.12);
}
float waistF(vec3 p){ return sdE(p-vec3(0.,.17,0.),vec3(.25*uWaist,.32,.165)); }
float shoulderF(vec3 p){
  vec3 a=vec3(abs(p.x),p.y,p.z);
  float trap=sdE(p-vec3(0.,.835,-.05),vec3(.23*uShW,.075,.10));
  float clav=sdCap(a,vec3(.05,.80,.075),vec3(.33*uShW,.855,.01),.02);
  float delt=sdE(a-vec3(.405*uShW,.775,0.),vec3(.086,.108,.096));
  return smin(smin(trap,clav,.05),delt,.06);
}

/* 頭部（頭の中心=首の付け根の上）。1:頭部 2:顔の部品 3:髪 */
vec2 headSDF(vec3 q){
  float e=uExp;
  float bnd=length(q-vec3(0.,.25,-.03))-.36;
  if(bnd>.08) return vec2(bnd,1.);
  float fl=uFace;
  float cr=sdE(q-vec3(0.,.27,-.03),vec3(.158,.195,.19));
  float jy=.15+(1.-fl)*.04;
  float jaw=sdE(q-vec3(0.,jy+.01,.045),vec3(.124,.138*fl,.125));
  float d=smin(cr,jaw,.06);
  vec3 qa=vec3(abs(q.x),q.y,q.z);
  d=smin(d,sdE(qa-vec3(.068,.205,.10),vec3(.055,.045,.05)),.04);
  d=smin(d,sdE(q-vec3(0.,jy+.01-.138*fl+.035,.112),vec3(.045,.032,.04)),.03);
  d=smin(d,sdE(q-vec3(0.,.272,.118),vec3(.10,.026,.05)),.035);
  d=smax(d,-sdE(qa-vec3(.052,.238,.16),vec3(.032,.019,.022)),.018);
  vec2 res=vec2(d,1.);
  // 顔の部品
  vec3 f=q-vec3(0.,0.,.22*e); vec3 fa=vec3(abs(f.x),f.y,f.z);
  float nz=.02*(uNose-1.);
  float eye=sdE(fa-vec3(.052,.236,.145),vec3(.026,.015,.02));
  float nose=sdCapT(f,vec3(0.,.248,.158),vec3(0.,.178,.188+nz),.014,.02);
  nose=smin(nose,sdE(f-vec3(0.,.174,.186+nz),vec3(.02,.017,.019)),.015);
  nose=smin(nose,sdE(fa-vec3(.019,.172,.166),vec3(.017,.013,.014)),.012);
  float lip=min(sdE(f-vec3(0.,.137,.163),vec3(.038,.011,.018)),sdE(f-vec3(0.,.118,.158),vec3(.032,.013,.018)));
  lip=smax(lip,-sdE(f-vec3(0.,.128,.18),vec3(.036,.003,.02)),.004);
  float ear=sdE(fa-vec3(.152,.215,-.01),vec3(.02,.048,.03));
  ear=smax(ear,-sdE(fa-vec3(.166,.21,-.005),vec3(.012,.03,.018)),.006);
  float fp=min(min(eye,nose),min(lip,ear));
  res=SU(res,vec2(fp,2.),.012*(1.-e));
  // 髪
  vec3 h=q-vec3(0.,.06*e,-.18*e);
  float line=.335-1.15*max(.07-h.z,0.);
  float hair;
  if(uHair<.5){
    float sh=sdE(h-vec3(0.,.275,-.035),vec3(.168,.205,.20));
    float ang=atan(h.x,h.y-.12);
    sh+=.0055*sin(ang*22.+3.*sin(h.z*13.));
    hair=smax(sh,line-h.y,.03);
    vec3 b=h-vec3(0.,.24,-.235);
    float bun=sdE(b,vec3(.085,.075,.07));
    bun+=.006*sin(atan(b.y,b.x)*9.+length(b.xy)*60.);
    hair=smin(hair,bun,.03);
  } else {
    float sh=sdE(h-vec3(0.,.28,-.035),vec3(.178,.215,.21));
    sh+=.011*sin(h.x*70.)*sin(h.y*70.)*sin(h.z*70.);
    hair=smax(sh,line-h.y,.03);
  }
  res=SU(res,vec2(hair,3.),.015*(1.-e));
  return res;
}

vec2 mapB(vec3 p){
  float e=uExp, kb=1.-e*.92, sw=uShW;
  // 7:胸郭 8:腹部（へそで切断）
  float ch=chestF(p);
  vec3 pw=p-vec3(0.,-.18*e,0.);
  float wst=max(waistF(pw),-pw.y);
  vec2 res=SU(vec2(ch,7.),vec2(wst,8.),.14*kb);
  // 5:肩
  res=SU(res,vec2(shoulderF(p-vec3(0.,.12*e,0.)),5.),.07*kb);
  // 6:上腕（途中で切った断面）
  if(uArm>.01){
    vec3 pr=vec3(abs(p.x)-.35*e,p.y,p.z);
    vec3 a=vec3(.42*sw,.76,0.), dir=normalize(vec3(.07,-1.,.03));
    float len=mix(.10,.48,uArm); vec3 b=a+dir*len;
    float arm=sdCapT(pr,a,b,.080,.068);
    arm=smin(arm,sdE(pr-(a+dir*.26)-vec3(0.,0.,.02),vec3(.068,.12,.074)),.04);
    arm=max(arm,dot(pr-b,dir));
    res=SU(res,vec2(arm,6.),.05*kb);
  }
  // 4:首
  vec3 piv=vec3(0.,.98+(uNeckL-1.)*.14,0.);
  vec3 pn=p-vec3(0.,.30*e,0.); vec3 pna=vec3(abs(pn.x),pn.y,pn.z);
  float nk=sdCapT(pn,vec3(0.,.76,-.035),piv+vec3(0.,.05,-.02),.082*uNeckW,.07*uNeckW);
  nk=smin(nk,sdCap(pna,vec3(.052,piv.y-.01,-.01),vec3(.03,.80,.07),.021*uNeckW),.035);
  res=SU(res,vec2(nk,4.),.06*kb);
  // 1〜3:頭
  vec3 q=p-(piv+vec3(0.,.55*e,0.));
  q.xz=rot(uTurn)*q.xz; q.yz=rot(uTilt)*q.yz;
  q/=uHead;
  vec2 hd=headSDF(q); hd.x*=uHead;
  res=SU(res,hd,.05*kb);
  // 9:衣（キトン）と帯
  vec3 pb=p-vec3(0.,0.,.45*e);
  float g=smin(chestF(pb),waistF(pb),.14)-.022;
  float ang=atan(pb.x,pb.z);
  float wob=sin(ang*3.1+pb.y*2.3)+.6*sin(ang*5.7-pb.y*4.1);
  float fo=uFold*(.010*sin(ang*9.+1.6*wob+2.*sin(pb.y*5.))+.0035*sin(ang*23.+2.5*wob+pb.y*9.))*mix(.45,1.15,smoothstep(.75,.1,pb.y));
  g-=fo;
  g-=.006*smoothstep(.41,.47,pb.y)*smoothstep(.60,.47,pb.y);
  if(uRobe<.5){
    g=smax(g,pb.y-(.70+.18*pb.x),.02);
    // 肩ひも：体の表面に沿わせた帯（斜めの平面で切り出す）
    float shell=smin(chestF(pb),shoulderF(pb),.06)-.034;
    float band=abs(dot(pb.xy-vec2(.25*sw,.86),vec2(.80,-.60)))-.03;
    float st=smax(smax(shell,band,.012),.62-pb.y,.02);
    st-=.004*uFold*sin(dot(pb,vec3(40.,20.,30.)));
    g=smin(g,st,.03);
  } else {
    float shr=shoulderF(pb)-.022-fo*.6;
    g=smin(g,shr,.06);
    float hole=max(length(vec2(pb.x,pb.z*1.1))-.145,.70-pb.y);
    g=smax(g,-hole,.025);
    g=smax(g,abs(pb.x)-.47*sw,.02);
  }
  g=max(g,-pb.y);
  float belt=sdE(pb-vec3(0.,.40,0.),vec3(.292*mix(1.,uShW,.6),.022,.205*uChest));
  g=min(g,max(belt,-pb.y));
  res=SU(res,vec2(g,9.),.01*kb);
  // 10:台座
  vec3 pp=p-vec3(0.,-.40*e,0.);
  float yT=-.06, yB=-.06-.30*uPedH;
  float bs;
  if(uPedS<.5){
    float tt=clamp((pp.y-yB)/(yT-yB),0.,1.);
    float r=.118+.06*pow(abs(2.*tt-1.),2.4);
    float col=(length(pp.xz)-r)*.85;
    col=max(col,abs(pp.y-(yT+yB)*.5)-(yT-yB)*.5);
    bs=min(col,min(sdTorus(pp-vec3(0.,yT-.016,0.),vec2(.165,.018)),sdTorus(pp-vec3(0.,yB+.02,0.),vec2(.17,.026))));
  } else {
    bs=sdRB(pp-vec3(0.,(yT+yB)*.5,0.),vec3(.15,(yT-yB)*.5,.15),.004);
    bs=min(bs,sdRB(pp-vec3(0.,yT-.018,0.),vec3(.19,.018,.19),.005));
    bs=min(bs,sdRB(pp-vec3(0.,yB+.022,0.),vec3(.2,.022,.2),.006));
  }
  bs=min(bs,sdRB(pp-vec3(0.,-.03,0.),vec3(.25,.03,.205),.006));
  bs=min(bs,sdRB(pp-vec3(0.,yB-.06,0.),vec3(.25,.06,.25),.01));
  res=U(res,vec2(bs,10.));
  return res;
}
/* 柔らかさ：台座は動かさず、下・中・頭の3つの節がそれぞれ遅れて動く。節の間はなめらかにつなぐ */
vec3 warp(vec3 p){
  p-=uHold;
  float y=p.y;
  vec3 off=mix(mix(mix(vec3(0.),uN1,smoothstep(-.06,.15,y)),uN2,smoothstep(.15,.62,y)),uN3,smoothstep(.62,1.2,y));
  return p-off;
}
vec2 mapS(vec3 p){
  if(uAct>.5){ vec2 r=mapB(warp(p)); r.x*=.62; return r; }
  return mapB(p);
}
float FLOORY(){ return -.06-.30*uPedH-.12-.40*uExp; }

vec3 calcN(vec3 p){
  const vec2 k=vec2(1.,-1.); float h=.0012;
  return normalize(k.xyy*mapS(p+k.xyy*h).x+k.yyx*mapS(p+k.yyx*h).x+k.yxy*mapS(p+k.yxy*h).x+k.xxx*mapS(p+k.xxx*h).x);
}
float calcAO(vec3 p, vec3 n){
  float o=0., s=1.;
  for(int i=1;i<=5;i++){ float h=.012+.035*float(i); o+=(h-mapS(p+n*h).x)*s; s*=.75; }
  return clamp(1.-2.2*o,0.,1.);
}
float shadow(vec3 ro, vec3 rd){
  float r=1., t=.02;
  for(int i=0;i<36;i++){ float h=mapS(ro+rd*t).x; r=min(r,10.*h/t); t+=clamp(h,.012,.2); if(r<.002||t>3.) break; }
  return clamp(r,0.,1.);
}
vec3 partCol(float id){
  if(id<1.5) return vec3(.93,.70,.45); if(id<2.5) return vec3(.98,.45,.40); if(id<3.5) return vec3(.62,.44,.85);
  if(id<4.5) return vec3(.40,.75,.95); if(id<5.5) return vec3(.35,.85,.65); if(id<6.5) return vec3(.95,.85,.35);
  if(id<7.5) return vec3(.98,.55,.75); if(id<8.5) return vec3(.55,.60,.98); if(id<9.5) return vec3(.85,.88,.92);
  return vec3(.55,.55,.58);
}
vec3 envC(vec3 r, vec3 L){
  vec3 c=mix(vec3(.015,.014,.013),vec3(.10,.085,.07),smoothstep(-.3,.6,r.y));
  c+=vec3(1.,.92,.80)*2.2*pow(max(dot(r,L),0.),24.);
  c+=vec3(.55,.62,.75)*.5*pow(max(dot(r,normalize(vec3(-L.x,.3,-L.z))),0.),6.);
  return c;
}
vec3 bg(vec2 uv){
  vec3 c=mix(vec3(.012,.011,.013),vec3(.035,.031,.028),smoothstep(-.6,.5,uv.y));
  c+=vec3(.11,.085,.06)*exp(-length((uv-vec2(0.,.12))*vec2(1.,.8))*2.6);
  return c;
}
vec3 bgX(vec2 uv){
  if(uBg<.5) return bg(uv);
  vec3 c;
  if(uBg<1.5){
    c=mix(vec3(.10,.06,.22),vec3(.015,.015,.06),clamp(.5+uv.y,0.,1.));
    vec2 g=uv*52.; vec2 id=floor(g); vec2 f=fract(g)-.5;
    float h=h31(vec3(id,1.7));
    vec2 j=(vec2(h31(vec3(id,3.1)),h31(vec3(id,5.3)))-.5)*.6;
    c+=vec3(1.)*smoothstep(.12,.0,length(f-j))*step(.93,h)*(.35+.65*h);
    vec2 q=uv-vec2(.13,.30); float d=length(q);
    c=mix(c,vec3(.55,.30,.02)*(.7+.8*clamp(.5-q.x/.11,0.,1.)),smoothstep(.055,.052,d));
    vec2 r=mat2(.955,.296,-.296,.955)*q;
    float ring=smoothstep(.004,0.,abs(length(r/vec2(1.,.24))-.105));
    c+=vec3(.45,.36,.10)*ring*(((r.y<0.)||(d>.055))?1.:0.);
  } else if(uBg<2.5){
    c=vec3(.30,.24,.15)*(1.-.75*dot(uv,uv))+vec3(.04,.03,.02)*clamp(uv.y+.3,0.,1.);
    vec2 w=uv-vec2(-.07,.22); vec2 aw=abs(w)-vec2(.085,.105);
    float m=max(aw.x,aw.y);
    float inW=step(m,0.);
    float fr=step(m,.014)-inW;
    float crs=clamp(step(abs(w.x),.005)+step(abs(w.y),.005),0.,1.);
    vec3 sky=mix(vec3(.50,.70,.85),vec3(.75,.85,.90),clamp(w.y*4.+.5,0.,1.));
    c=mix(c,sky,inW);
    c=mix(c,vec3(.13,.07,.03),clamp(fr+inW*crs,0.,1.));
  } else if(uBg<3.5){
    c=mix(vec3(.004,.03,.016),vec3(.012,.07,.035),clamp(.5+uv.y,0.,1.));
    for(int i=0;i<7;i++){
      float fi=float(i);
      float tx=-.6+fi*.2+.05*sin(fi*2.3);
      float ty=-.02+.05*sin(fi*1.7);
      float x=abs(uv.x-tx), yy=uv.y-ty;
      float trunk=step(x,.012)*step(-.2,yy)*step(yy,.1);
      float can=step(x,(.38-yy)*.4)*step(.05,yy)*step(yy,.38);
      c=mix(c,vec3(.04,.017,.004),trunk);
      c=mix(c,(mod(fi,2.)<.5)?vec3(.010,.075,.028):vec3(.007,.055,.020),can);
    }
  } else {
    c=vec3(.05,.045,.042)+vec3(.02,.015,.01)*clamp(uv.y+.5,0.,1.)+.012*vn(vec3(uv*6.,1.));
    for(int i=0;i<9;i++){
      float fi=float(i);
      float tx=-.8+fi*.2, len=.10+.06*mod(fi,3.);
      float x=abs(uv.x-tx);
      float m=step(x,.07)*step(.52-len*(1.-x/.07),uv.y);
      c=mix(c,vec3(.065,.058,.054),m);
    }
    vec2 cq=uv-vec2(-.10,-.08);
    float cry=step(abs(cq.x),(cq.y+.09)*.4)*step(-.09,cq.y)*step(cq.y,.07);
    c=mix(c,vec3(.25,.65,.95),cry);
    c+=vec3(.04,.15,.28)*exp(-length(cq)*7.);
  }
  return c;
}
float ggx(float NdH, float a){ float a2=a*a; float d=NdH*NdH*(a2-1.)+1.; return a2/(3.14159*d*d); }

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;
  vec2 cuv=uv+uOff;
  vec3 ww=normalize(uTa-uRo), uu=normalize(cross(ww,vec3(0.,1.,0.))), vv=cross(uu,ww);
  vec3 rd=normalize(cuv.x*uu+cuv.y*vv+uFoc*ww), ro=uRo;
  vec3 L=normalize(vec3(sin(uLight)*.85,.95,cos(uLight)*.85));
  float e=uExp, fy=FLOORY();
  vec3 col=bgX(uv);
  // 外箱との交差で探索範囲をしぼる
  vec3 bmin=vec3(-.75-.4*e,fy,-.6-.1*e), bmax=vec3(.75+.4*e,1.62+.75*e,.6+.5*e);
  bmin.xz-=vec2(.9)*uAct; bmax.xz+=vec2(.9)*uAct; bmax.y+=1.15*uAct;
  vec3 inv=1./rd, t0=(bmin-ro)*inv, t1=(bmax-ro)*inv;
  vec3 tn=min(t0,t1), tf=max(t0,t1);
  float tN=max(max(tn.x,tn.y),tn.z), tF=min(min(tf.x,tf.y),tf.z);
  float t=-1., id=0.;
  if(tF>max(tN,0.)){
    float tt=max(tN,0.);
    for(int i=0;i<180;i++){
      vec2 h=mapS(ro+rd*tt);
      if(h.x<.0006*tt){ t=tt; id=h.y; break; }
      tt+=h.x*.82;
      if(tt>tF) break;
    }
  }
  float tfl=(fy-ro.y)/rd.y;
  if(t<0. && tfl>0. && abs(uBg-1.)>.5){
    vec3 p=ro+rd*tfl;
    float sh=shadow(p+vec3(0.,.002,0.),L);
    float pool=exp(-dot(p.xz,p.xz)*1.6);
    vec3 fb=vec3(.035,.032,.03), ft=vec3(.20,.16,.12);
    if(uBg>1.5&&uBg<2.5){ fb=vec3(.20,.10,.04); ft=vec3(.45,.28,.12); }
    else if(uBg>2.5&&uBg<3.5){ fb=vec3(.016,.036,.012); ft=vec3(.06,.12,.04); }
    else if(uBg>3.5){ fb=vec3(.045,.04,.037); ft=vec3(.30,.26,.20); }
    vec3 fc=fb*(.35+.65*sh)+ft*pool*(.25+.75*sh);
    float ao=clamp(length(p.xz)*1.8,.35,1.);
    fc*=ao;
    col=mix(fc,col,1.-exp(-.06/max(rd.y*rd.y,1e-3)*0.));
    col=mix(fc,col,smoothstep(1.2,3.,length(p.xz)));
  }
  if(t>0.){
    vec3 p=ro+rd*t, n=calcN(p), v=-rd;
    float ao=calcAO(p,n), sh=shadow(p+n*.004,L);
    vec3 H=normalize(L+v);
    float NdL=max(dot(n,L),0.), NdV=max(dot(n,v),.001), NdH=max(dot(n,H),0.), VdH=max(dot(v,H),0.);
    vec3 R=reflect(rd,n);
    vec3 L2=normalize(vec3(-L.x,.25,-L.z)*vec3(1.,1.,1.)+vec3(0.,0.,.4));
    float rim=pow(1.-NdV,3.)*max(dot(n,normalize(vec3(-L.x,.5,-L.z))),0.);
    if(uMode>.5){
      vec3 pc=partCol(id);
      float dim=(uSel>.5 && abs(id-uSel)>.5)?.22:1.;
      col=pc*dim*(.25+.75*NdL*(.4+.6*sh))*(.4+.6*ao)+vec3(.25)*dim*pow(NdH,40.)*sh;
      if(uSel>.5 && abs(id-uSel)<.5) col+=pc*.15;
    } else if(id>9.5){
      // 黒大理石
      float vein=smoothstep(.07,0.,abs(sin(p.x*9.+p.y*4.+p.z*6.+vn(p*7.)*5.)));
      vec3 alb=mix(vec3(.035,.035,.04),vec3(.32,.31,.30),vein*.6);
      float F=.04+.96*pow(1.-NdV,5.);
      col=alb*(NdL*sh*vec3(1.,.93,.85)*1.4+.12)*ao;
      col+=envC(R,L)*F*ao*.9+vec3(1.,.95,.85)*ggx(NdH,.12)*.04*NdL*sh;
    } else {
      // ブロンズ（0:ブロンズ 1:緑青 2:磨き）
      float rough=uFinish<.5?.36:(uFinish<1.5?.55:.17);
      float patA=uFinish<.5?.45:(uFinish<1.5?1.:.04);
      vec3 F0=uFinish<1.5?vec3(.60,.38,.19):vec3(.85,.58,.30);
      float nz=vn(p*16.), nz2=vn(p*55.);
      F0*=mix(.30,1.,smoothstep(.2,.9,ao))*(.85+.3*nz2);
      float pat=clamp(((1.-ao)*1.6+(nz-.5)*1.2+max(n.y,0.)*.45-.35)*patA*1.7+(uFinish>.5&&uFinish<1.5?.35*nz:0.),0.,1.);
      float a=rough*rough;
      vec3 F=F0+(1.-F0)*pow(1.-VdH,5.);
      float k=(rough+1.)*(rough+1.)/8.;
      float G=(NdL/(NdL*(1.-k)+k))*(NdV/(NdV*(1.-k)+k));
      vec3 spec=ggx(NdH,a)*G*F/(4.*NdV+1e-3);
      vec3 lc=vec3(1.,.93,.82)*3.2;
      vec3 metal=spec*lc*sh;
      vec3 Fe=F0+(1.-F0)*pow(1.-NdV,5.)*(1.-rough);
      metal+=envC(R,L)*Fe*ao*(1.-rough*.5);
      metal+=F0*NdL*sh*.10*lc*.3;
      metal+=F0*rim*.9;
      vec3 palb=mix(vec3(.16,.36,.30),vec3(.36,.55,.46),nz2)*(.8+.4*nz);
      vec3 patc=palb*(NdL*sh*lc*.32+.10+.12*max(n.y,0.))*ao+palb*rim*.3;
      col=mix(metal,patc,pat);
      if(uZone>.5){
        float oy=(p-uHold).y;
        vec3 zc=oy>.91?vec3(.40,.65,1.):(oy>.385?vec3(.98,.50,.72):vec3(.30,.85,.62));
        col=mix(col,zc*.9,.28);
        col=mix(col,vec3(1.),smoothstep(.007,0.,abs(oy-.91))*.7+smoothstep(.007,0.,abs(oy-.385))*.7);
      }
    }
  }
  // トーンマップ・ガンマ・周辺減光
  col=col*(2.51*col+.03)/(col*(2.43*col+.59)+.14);
  col=pow(clamp(col,0.,1.),vec3(1./2.2));
  col*=1.-.35*dot(uv,uv);
  gl_FragColor=vec4(col,1.);
}
</script>

<script>
(()=>{
'use strict';
/* ===== 胸像の部品と調整項目 =====
 * 形はすべて「符号付き距離関数」（SDF）の基本形（楕円体・カプセル・箱・円環）を
 * なめらかに足し引きして作る。数値はシェーダーの uniform に渡す */
const PARAMS={
  uHead:{v:1.06,min:.88,max:1.2},uFace:{v:1,min:.85,max:1.15},uNose:{v:1,min:.4,max:1.6},
  uTurn:{v:.25,min:-.6,max:.6},uTilt:{v:.06,min:-.25,max:.25},uHair:{v:0},
  uNeckL:{v:1,min:.8,max:1.25},uNeckW:{v:1,min:.8,max:1.3},
  uArm:{v:.35,min:0,max:1},uShW:{v:1,min:.88,max:1.15},uChest:{v:1,min:.85,max:1.2},uWaist:{v:1,min:.85,max:1.15},
  uRobe:{v:0},uFold:{v:1,min:0,max:1.6},uPedS:{v:0},uPedH:{v:1,min:.6,max:1.5}
};
const GROUPS=[
  {k:'HEAD',c:[['uHead','Size'],['uFace','Face length'],['uNose','Nose'],['uTurn','Turn'],['uTilt','Tilt']]},
  {k:'HAIR',c:[['uHair','Style',['BUN','CURLS']]]},
  {k:'NECK',c:[['uNeckL','Length'],['uNeckW','Thickness']]},
  {k:'ARMS',c:[['uArm','Length']]},
  {k:'TORSO',c:[['uShW','Shoulders'],['uChest','Chest depth'],['uWaist','Waist']]},
  {k:'ROBE',c:[['uRobe','Style',['ONE SHOULDER','BOTH']],['uFold','Folds']]},
  {k:'BASE',c:[['uPedS','Style',['ROUND','SQUARE']],['uPedH','Height']]},
];
const PARTS=[
  [1,'HEAD','頭部（頭蓋・あご・頬・眉）'],[2,'FACE','顔の部品（目・鼻・口・耳）'],[3,'HAIR','髪（まとめ髪）'],
  [4,'NECK','首（胸鎖乳突筋つき）'],[5,'SHOULDERS','肩（僧帽筋・鎖骨・三角筋）'],[6,'ARMS','上腕（断面で切る）'],
  [7,'CHEST','胸郭（背中を含む）'],[8,'WAIST','腹部（へそで水平に切る）'],[9,'ROBE','衣（キトン・帯）'],[10,'BASE','台座（大理石）']
];
const PCOL=['#edb373','#fa7366','#9e70d9','#66bff2','#59d9a6','#f2d959','#fa8cbf','#8c99fa','#d9e0eb','#8c8c94'];
const FIN=['BRONZE','PATINA','POLISHED'];
const KEY='yawaraka.bust.v1';
const st={exp:0,sel:0,fin:0,light:-.7,yaw:.35,pitch:.10,zoom:1,tab:'sculpt',grp:'HEAD',turn:false,soft:[.8,.5,.2],bg:1,grab:false,dist:3};
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s){ for(const k in s.p) if(PARAMS[k]) PARAMS[k].v=s.p[k]; ['fin','light','yaw','pitch','zoom','bg'].forEach(k=>{ if(typeof s[k]==='number') st[k]=s[k]; }); if(Array.isArray(s.soft)&&s.soft.length===3) st.soft=s.soft.map(x=>Math.max(0,Math.min(1,+x||0))); } }catch(e){}
let saveT=0; function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ const p={}; for(const k in PARAMS) p[k]=PARAMS[k].v; localStorage.setItem(KEY,JSON.stringify({p,fin:st.fin,light:st.light,yaw:st.yaw,pitch:st.pitch,zoom:st.zoom,bg:st.bg,soft:st.soft})); }catch(e){} },300); }

/* ===== 柔らかさの物理 =====
 * H：掴んで動かす位置（離すとバネで戻る）。Z：頭・胴・下の3つの節（H を追いかけて遅れ、揺れる）
 * バネの強さと減衰は、柔らかいほど弱く・長くなる（旧版と同じ式） */
const HD={p:[0,0,0],v:[0,0,0]}, Z=[0,1,2].map(()=>({p:[0,0,0],v:[0,0,0]}));
const SW=[1,.75,.45];
const isAct=()=>st.tab==='soft'||st.tab==='shake';
function resetPhys(){ [HD,...Z].forEach(o=>{ o.p=[0,0,0]; o.v=[0,0,0]; }); st.grab=false; }
function stepPhys(){
  if(!st.grab) for(let k=0;k<3;k++){ HD.v[k]=(HD.v[k]-HD.p[k]*.08)*.82; HD.p[k]+=HD.v[k]; }
  for(let i=0;i<3;i++){
    const sf=st.soft[i], stf=.24-sf*.17, dmp=.72+sf*.21, z=Z[i];
    for(let k=0;k<3;k++){
      z.v[k]=(z.v[k]+(HD.p[k]-z.p[k])*stf)*dmp; z.p[k]+=z.v[k];
      const r=z.p[k]-HD.p[k]; if(Math.abs(r)>.26){ z.p[k]=HD.p[k]+Math.sign(r)*.26; z.v[k]*=.5; }
    }
  }
}
function physIdle(){
  if(st.grab) return false;
  let s=0; for(let k=0;k<3;k++){ s+=Math.abs(HD.p[k])+Math.abs(HD.v[k]); }
  for(const z of Z) for(let k=0;k<3;k++) s+=Math.abs(z.p[k]-HD.p[k])+Math.abs(z.v[k]);
  if(s<.004){ if(s>0){ resetPhys(); touch(); } return true; }
  return false;
}
function dragHold(dx,dy){
  const upp=st.dist/(1.6*innerHeight), w=dx*upp;
  const d=[Math.cos(st.yaw)*w,-dy*upp,-Math.sin(st.yaw)*w], o=HD.p.slice();
  for(let k=0;k<3;k++) HD.p[k]+=d[k];
  HD.p[1]=Math.max(0,Math.min(.75,HD.p[1]));
  const r=Math.hypot(HD.p[0],HD.p[2]); if(r>.95){ HD.p[0]*=.95/r; HD.p[2]*=.95/r; }
  for(let k=0;k<3;k++){ const a=HD.p[k]-o[k]; for(let i=0;i<3;i++) Z[i].v[k]-=a*st.soft[i]*SW[i]*.9; }
}
let kickDir=1;
function kick(i){ kickDir=-kickDir; Z[i].v[0]+=kickDir*(.012+.05*st.soft[i]); Z[i].v[1]+=.006*st.soft[i]; }

/* ===== WebGL ===== */
const cv=document.getElementById('cv');
const gl=cv.getContext('webgl',{antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
if(!gl){ document.getElementById('err').classList.remove('hidden'); return; }
function sh(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s)); throw new Error('shader'); } return s; }
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent));
gl.linkProgram(prog); gl.useProgram(prog);
const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(prog,'a'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const loc={}; ['uRes','uOff','uRo','uTa','uFoc','uExp','uMode','uSel','uFinish','uLight','uBg','uAct','uZone','uHold','uN1','uN2','uN3',...Object.keys(PARAMS)].forEach(n=>loc[n]=gl.getUniformLocation(prog,n));

const FOC=1.6;
function camera(cssW,cssH){
  const e=st.exp;
  const fy=-.06-.30*PARAMS.uPedH.v-.12-.40*e;
  const top=1.56+.62*e, bot=fy+.02;
  const H=top-bot, W=1.35+.85*e;
  const tb=document.querySelector('.top-bar').getBoundingClientRect().bottom+6;
  const pt=document.getElementById('panel').getBoundingClientRect().top-6;
  const fr=Math.max(.3,(pt-tb)/cssH), fc=(tb+pt)/2;
  let dist=Math.max((H/2*1.08)*FOC/(fr/2),(W/2*1.08)*FOC/(cssW/cssH/2))/st.zoom;
  const ty=(top+bot)/2+(1.02+.4*e-(top+bot)/2)*Math.max(0,Math.min(1,(st.zoom-1)/1.2));
  st.dist=dist;
  const cp=Math.cos(st.pitch);
  return {ta:[0,ty,0],ro:[Math.sin(st.yaw)*cp*dist,ty+Math.sin(st.pitch)*dist,Math.cos(st.yaw)*cp*dist],off:(fc-cssH/2)/cssH};
}
function render(scale){
  const w=innerWidth,h=innerHeight;
  const W=Math.max(2,Math.round(w*scale)),H=Math.max(2,Math.round(h*scale));
  if(cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; }
  gl.viewport(0,0,W,H);
  const c=camera(w,h);
  gl.uniform2f(loc.uRes,W,H); gl.uniform2f(loc.uOff,0,c.off);
  gl.uniform3fv(loc.uRo,c.ro); gl.uniform3fv(loc.uTa,c.ta); gl.uniform1f(loc.uFoc,FOC);
  for(const k in PARAMS) gl.uniform1f(loc[k],PARAMS[k].v);
  gl.uniform1f(loc.uExp,st.exp); gl.uniform1f(loc.uMode,st.tab==='parts'?1:0); gl.uniform1f(loc.uSel,st.tab==='parts'?st.sel:0);
  gl.uniform1f(loc.uFinish,st.fin); gl.uniform1f(loc.uLight,st.light);
  const act=isAct(); gl.uniform1f(loc.uAct,act?1:0); gl.uniform1f(loc.uBg,st.tab==='shake'?st.bg:0); gl.uniform1f(loc.uZone,st.tab==='soft'?1:0);
  const rel=i=>[Z[i].p[0]-HD.p[0],Z[i].p[1]-HD.p[1],Z[i].p[2]-HD.p[2]];
  gl.uniform3fv(loc.uHold,HD.p); gl.uniform3fv(loc.uN1,rel(2)); gl.uniform3fv(loc.uN2,rel(1)); gl.uniform3fv(loc.uN3,rel(0));
  gl.drawArrays(gl.TRIANGLES,0,3);
}
/* 操作中は粗く、止まったら細かく描く（スマホの負荷を抑える） */
const DPR=Math.min(devicePixelRatio||1,2);
function hiScale(){ const px=innerWidth*innerHeight*DPR*DPR, cap=1.8e6; return px>cap?DPR*Math.sqrt(cap/px):DPR; }
let dirty=true, hq=false, lastAct=0, lastT=0, acc=0;
function touch(){ dirty=true; lastAct=performance.now(); }
function frame(now){
  requestAnimationFrame(frame);
  if(isAct()){
    acc+=Math.min(3,(now-(lastT||now))/16.667);
    while(acc>=1){ stepPhys(); acc-=1; }
    if(!physIdle()){ dirty=true; lastAct=now; }
  } else acc=0;
  lastT=now;
  if(st.turn){ st.yaw+=.008; dirty=true; lastAct=now; }
  if(dirty){ render(Math.min(.5,hiScale())); dirty=false; hq=true; }
  else if(hq && now-lastAct>260){ render(hiScale()); hq=false; }
}

/* ===== UI ===== */
const $=id=>document.getElementById(id);
function fmt(k){ const p=PARAMS[k]; return Math.round((p.v-p.min)/(p.max-p.min)*100)+'%'; }
function buildChips(){
  $('chips').innerHTML='';
  GROUPS.forEach(g=>{ const b=document.createElement('button'); b.className='chip'+(g.k===st.grp?' on':''); b.textContent=g.k;
    b.onclick=()=>{ st.grp=g.k; buildChips(); buildCtrls(); }; $('chips').appendChild(b); });
}
function buildCtrls(){
  const box=$('ctrls'); box.innerHTML='';
  const g=GROUPS.find(x=>x.k===st.grp);
  g.c.forEach(([k,label,opts])=>{
    const row=document.createElement('div'); row.className='ctl';
    const lb=document.createElement('label'); lb.textContent=label; row.appendChild(lb);
    if(opts){
      const seg=document.createElement('div'); seg.className='seg';
      opts.forEach((o,i)=>{ const b=document.createElement('button'); b.textContent=o; if(Math.round(PARAMS[k].v)===i) b.className='on';
        b.onclick=()=>{ PARAMS[k].v=i; [...seg.children].forEach((c,j)=>c.className=j===i?'on':''); touch(); save(); }; seg.appendChild(b); });
      row.appendChild(seg);
    } else {
      const p=PARAMS[k], r=document.createElement('input'); r.type='range'; r.min=p.min; r.max=p.max; r.step=(p.max-p.min)/200; r.value=p.v;
      const out=document.createElement('output'); out.textContent=fmt(k);
      r.oninput=()=>{ p.v=+r.value; out.textContent=fmt(k); touch(); save(); };
      row.append(r,out);
    }
    box.appendChild(row);
  });
}
function buildParts(){
  const box=$('plist'); box.innerHTML='';
  PARTS.forEach(([id,en,ja])=>{
    const b=document.createElement('button'); b.className='part'+(st.sel===id?' on':'');
    b.innerHTML='<i style="background:'+PCOL[id-1]+'"></i><span><b>'+en+'</b><small>'+ja+'</small></span>';
    b.onclick=()=>{ st.sel=st.sel===id?0:id; buildParts(); touch(); };
    box.appendChild(b);
  });
}
function setTab(t){
  st.tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('[data-pane]').forEach(s=>s.classList.toggle('hidden',s.dataset.pane!==t));
  if(!isAct()) resetPhys();
  touch();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function seg(box,names,get,set){
  box.innerHTML='';
  names.forEach((n,i)=>{ const b=document.createElement('button'); b.textContent=n; if(get()===i) b.className='on';
    b.onclick=()=>{ set(i); [...box.children].forEach((c,j)=>c.className=j===i?'on':''); touch(); save(); }; box.appendChild(b); });
}
seg($('finSeg'),FIN,()=>st.fin,i=>{ st.fin=i; });
seg($('bgSeg'),['SPACE','ROOM','FOREST','CAVE'],()=>st.bg-1,i=>{ st.bg=i+1; });
[['HEAD','#7fb0ff'],['BODY','#f78fb9'],['LOWER','#59d9a6']].forEach(([n,c],i)=>{
  const row=document.createElement('div'); row.className='ctl';
  const lb=document.createElement('label'); lb.textContent=n; lb.style.color=c;
  const r=document.createElement('input'); r.type='range'; r.min=0; r.max=1; r.step=.01; r.value=st.soft[i];
  const out=document.createElement('output'); out.textContent=Math.round(st.soft[i]*100)+'%';
  r.oninput=()=>{ st.soft[i]=+r.value; out.textContent=Math.round(st.soft[i]*100)+'%'; kick(i); touch(); save(); };
  row.append(lb,r,out); $('softBox').appendChild(row);
});
$('reset').onclick=()=>{ const g=GROUPS.find(x=>x.k===st.grp); g.c.forEach(([k])=>PARAMS[k].v=DEF[k]); buildCtrls(); touch(); save(); };
const DEF={}; for(const k in PARAMS) DEF[k]=PARAMS[k].v;
// RESET は初期値に戻す（保存値ではなく）
Object.assign(DEF,{uHead:1.06,uFace:1,uNose:1,uTurn:.25,uTilt:.06,uHair:0,uNeckL:1,uNeckW:1,uArm:.35,uShW:1,uChest:1,uWaist:1,uRobe:0,uFold:1,uPedS:0,uPedH:1});
$('explode').oninput=e=>{ st.exp=+e.target.value; $('explodeV').textContent=Math.round(st.exp*100)+'%'; touch(); };
$('light').value=st.light;
$('light').oninput=e=>{ st.light=+e.target.value; touch(); save(); };
$('turn').onclick=()=>{ st.turn=!st.turn; $('turn').classList.toggle('on',st.turn); touch(); };
$('front').onclick=()=>{ st.yaw=0; st.pitch=.08; st.zoom=1; touch(); save(); };
$('shot').onclick=()=>{ render(hiScale()); cv.toBlob(b=>{ if(!b) return; const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='bronze-bust.png'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); },'image/png'); };

/* 回す（1本指・マウス）・拡大縮小（2本指・ホイール） */
const ptrs=new Map(); let pinch0=0, zoom0=1;
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(isAct()&&ptrs.size===1) st.grab=true;
  if(ptrs.size===2){ st.grab=false; const [a,b]=[...ptrs.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); zoom0=st.zoom; } });
cv.addEventListener('pointermove',e=>{ const p=ptrs.get(e.pointerId); if(!p) return;
  if(ptrs.size===1){ if(isAct()){ if(st.grab) dragHold(e.clientX-p.x,e.clientY-p.y); } else { st.yaw-=(e.clientX-p.x)*.009; st.pitch=Math.max(-.15,Math.min(.6,st.pitch+(e.clientY-p.y)*.005)); } }
  p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===2&&pinch0){ const [a,b]=[...ptrs.values()]; st.zoom=Math.max(.6,Math.min(2.4,zoom0*Math.hypot(a.x-b.x,a.y-b.y)/pinch0)); }
  touch(); });
const up=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=0; if(!ptrs.size) st.grab=false; save(); };
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{ e.preventDefault(); st.zoom=Math.max(.6,Math.min(2.4,st.zoom*Math.exp(-e.deltaY*.0012))); touch(); save(); },{passive:false});
addEventListener('resize',touch);

buildChips(); buildCtrls(); buildParts();
requestAnimationFrame(frame);
window.__bust={st,PARAMS,render,touch,HD,Z};
})();
</script>
</body>
</html>
