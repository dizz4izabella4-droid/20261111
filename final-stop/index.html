  font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#0b1020}
canvas{position:absolute;left:0;top:0;display:block}
#hit{position:absolute;inset:0;z-index:1;touch-action:none}
.ui{position:absolute;z-index:2;pointer-events:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.btn{position:absolute;z-index:3;pointer-events:auto;touch-action:manipulation;font:700 13px ui-monospace,Menlo,Consolas,monospace;color:#fff;
  background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.55);border-radius:8px;letter-spacing:.06em;padding:0;cursor:pointer}
.btn:active{background:rgba(255,255,255,.25)}
.hide{display:none!important}
#unit{left:14px;top:12px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.14em;opacity:.85}
#gauge{top:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
#gauge i{display:block;width:34px;height:8px;border:1px solid rgba(255,255,255,.7);border-radius:2px;background:transparent}
#gauge i.on{background:#ff2a3a;border-color:#ff2a3a}
#radio{font:600 13px ui-monospace,Menlo,monospace;color:#6cff9a;background:rgba(0,0,0,.55);border:1px solid rgba(108,255,154,.45);border-radius:4px;padding:6px 10px;text-align:center;opacity:0;transition:opacity .2s}
#radio.on{opacity:1}
.port #radio{left:20px;right:20px;top:44px}
.land #radio{left:20%;right:20%;top:36px}
#siren{left:12px;bottom:12px;width:76px;height:56px;line-height:1.25}
#lights{right:12px;bottom:12px;width:76px;height:56px}
#ram{left:50%;bottom:14px;margin-left:-60px;width:120px;height:64px;background:#c01428;border-color:#fff;font-size:18px;animation:bl .5s infinite alternate}
#ram.armed{animation:none;background:#6a0a14}
@keyframes bl{from{opacity:1}to{opacity:.45}}
#cmdp{background:rgba(5,8,20,.82);border-top:1px solid rgba(108,255,154,.4);display:flex;flex-direction:column;justify-content:center;gap:10px;padding:14px 18px;box-sizing:border-box;pointer-events:auto}
.port #cmdp{left:0;right:0;bottom:0;height:33%}
.land #cmdp{right:0;top:0;bottom:0;width:40%;border-top:0;border-left:1px solid rgba(108,255,154,.4)}
#cmdtext{font:700 22px/1.25 ui-monospace,Menlo,monospace;color:#6cff9a;text-align:center}
#cmdhint{font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-align:center;opacity:.85}
#cmdbtn{display:flex;gap:12px;justify-content:center}
#cmdbtn .btn{position:static;width:110px;height:42px}
.ov{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none}
#title{background:rgba(5,8,20,.55)}
#title h1{margin:0;font:800 40px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-shadow:0 0 16px #ff2a3a,0 0 28px #2a6bff}
#title .btn,#end .btn{position:static;width:150px;height:52px;font-size:18px}
#micnote,#micerr{font:600 13px/1.55 'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif;text-align:center;max-width:300px;padding:0 8px;text-shadow:0 1px 4px #000}
#micnote{color:#ffe9b0}
#micerr{color:#ff9a9a;font-size:12px}
#end{background:linear-gradient(rgba(5,8,20,.65),rgba(5,8,20,0) 40%,rgba(5,8,20,0) 70%,rgba(5,8,20,.6));justify-content:space-between;padding:12% 0 18%}
.land #end{padding:6% 0 8%}
#end h2{margin:0;font:800 34px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:#6cff9a;text-shadow:0 0 14px #000}
#resume{background:rgba(0,0,0,.75);pointer-events:auto;font:700 20px ui-monospace,Menlo,monospace;letter-spacing:.1em;z-index:5}
#dbg{left:6px;top:64px;font:11px/1.35 ui-monospace,Menlo,monospace;color:#9f9;background:rgba(0,0,0,.6);padding:4px 6px;white-space:pre;z-index:6}

      if (t <= pts[i][0]) return lerp(pts[i - 1][1], pts[i][1], ss((t - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0])));
    }
    return pts[pts.length - 1][1];
  }
  const PHASE_OF = { TITLE: 'TITLE', INTRO: 'CHASE', APPROACH: 'CHASE', WINDOW: 'CHASE', LUNGE: 'CHASE', HIT: 'CHASE', RECOVER: 'CHASE', MISS: 'CHASE', FINISH: 'CHASE',
    PULLOVER: 'PULLOVER', EVENT: 'EVENT', PREVIEW: 'CMD', SPEAK: 'CMD', YOURTURN: 'CMD', REACT: 'CMD', ARREST: 'ARREST', END: 'END', DEAD: 'DEAD' };
  const MAX_DWELL = { INTRO: 6, APPROACH: 8, WINDOW: 3.5, LUNGE: 1, HIT: 1, RECOVER: 3, MISS: 2, FINISH: 2, PULLOVER: 6, EVENT: 10, SPEAK: 6, YOURTURN: 10, REACT: 6, ARREST: 5, DEAD: 8 };
  const FORCE_NEXT = { INTRO: 'APPROACH', APPROACH: 'WINDOW', WINDOW: 'MISS', LUNGE: 'HIT', HIT: 'RECOVER', RECOVER: 'APPROACH', MISS: 'APPROACH', FINISH: 'PULLOVER',
    PULLOVER: 'EVENT', EVENT: 'PREVIEW', SPEAK: 'YOURTURN', YOURTURN: 'REACT', REACT: 'PREVIEW', ARREST: 'END', DEAD: 'TITLE' };

  function create(C, opt) {
    opt = opt || {};
    const rnd = mulberry32(opt.seed || 1);
    const phi = rnd() * 6.2832;
    const S = { phase: 'TITLE', sub: 'TITLE', t: 0, ct: 0, gap: C.INTRO_GAP[0], sx: 0, px: 0, speed: 0, hits: 0, damage: 0, misses: 0, streakMiss: 0, sinceHit: 0,
      window: null, ram: false, ramArmed: false, cmd: { i: 0, step: '' }, pose: { from: 'inCar', to: 'inCar', k: 1 }, ytLimit: 5, siren: 'OFF', lights: true, timeScale: 1,
      elapsed: 0, side: 1, tilt: 0, fade: 0, wobble: 0, lock: 0, dur: 0, auto: false, crackSeed: Math.floor(rnd() * 1e9), pxKick: 0, hintShown: false };
    let ev = [], n = 0, simT = 0, acc = 0, wentAt = -1, lock = 0, swipeLock = 0, wobble = 0;
    let gapE = 0, sxE = 0, pxE = 0, tiltE = 0, beatSide = C.SIDES[0], afterMiss = false, buffered = false, radioIdx = 0, pxF = 0, speakAuto = false, stuckSent = false;
    let flags = {}, sirenIdx = 0, ytLimit = 5, ytMore = 0;
    let pend = { swipe: null, tap: false, button: null, voice: false, more: false };

    const emit = (type, o) => { ev.push(Object.assign({ type: type, at: n * C.STEP }, o || {})); };
    const snake = ct => C.SNAKE.a1 * Math.sin(6.2832 * ct / C.SNAKE.p1) + C.SNAKE.a2 * Math.sin(6.2832 * ct / C.SNAKE.p2 + phi);

    function reset() {
      Object.assign(S, { hits: 0, damage: 0, misses: 0, streakMiss: 0, sinceHit: 0, window: null, ram: false, ramArmed: false, elapsed: 0, ct: 0, gap: C.INTRO_GAP[0], sx: 0, px: 0,
        pose: { from: 'inCar', to: 'inCar', k: 1 }, cmd: { i: 0, step: '' }, tilt: 0, fade: 0, timeScale: 1, pxKick: 0, speed: 0, hintShown: false });
      pxF = 0; radioIdx = 0; beatSide = C.SIDES[0]; afterMiss = false; buffered = false;
    }
    function go(sub) {
      if (wentAt === n) return false;                   // 同じ瞬間の二重遷移は捨てる
      wentAt = n;
      const prev = S.phase;
      S.sub = sub; S.phase = PHASE_OF[sub]; S.t = 0; stuckSent = false; flags = {};
      gapE = S.gap; sxE = S.sx; pxE = S.px; tiltE = S.tilt;
      if (S.phase !== prev) { lock = C.LOCK; emit('phase', { from: prev, to: S.phase }); }
      emit('sub', { sub: sub });
      if (subs[sub].enter) subs[sub].enter();
      return true;
    }
    function lunge() { go('LUNGE'); }
    function swipeOutside(wob) { if (wob && swipeLock <= 0) { wobble = C.WOBBLE; swipeLock = C.WOBBLE + C.SWIPE_LOCK; emit('whiff'); } }

    const subs = {
      TITLE: { enter() { reset(); }, upd(h, i, locked) { if (i.button === 'start' && !locked) { reset(); go('INTRO'); } } },
      INTRO: {
        enter() { S.speed = 30; },
        upd(h, i) {
          S.gap = lerp(C.INTRO_GAP[0], C.INTRO_GAP[1], ss(S.t / C.INTRO));
          S.sx = snake(S.ct) * ss(S.t / 1.5);
          if (S.t >= C.INTRO) go('APPROACH');
        }
      },
      APPROACH: {
        enter() { S.dur = afterMiss ? C.APPROACH_AFTER_MISS : C.APPROACH; buffered = false; },
        upd(h, i) {
          const d = S.dur;
          S.gap = lerp(gapE, C.GAP_WINDOW, ss(S.t / d));
          const base = lerp(sxE, snake(S.ct), ss(S.t / 0.8));
          S.sx = lerp(base, beatSide * 1.0, ss((S.t - (d - 1)) / 1));
          S.tilt = tiltE * (1 - ss(S.t / 0.5));
          if (i.swipe) { if (d - S.t <= C.PREBUF) buffered = true; else swipeOutside(true); }
          if (S.t >= d) go('WINDOW');
        }
      },
      WINDOW: {
        enter() {
          const len = S.streakMiss >= C.RESCUE.widen ? C.WINDOW_RESCUE : C.WINDOW;
          S.window = { side: beatSide, t: 0, len: len }; S.gap = C.GAP_WINDOW;
          emit('window', { side: beatSide, len: len });
        },
        upd(h, i, locked) {
          S.window.t = S.t; S.gap = C.GAP_WINDOW; S.side = beatSide;
          S.sx = beatSide * 1.0 + 0.2 * Math.sin(6.2832 * 5 * S.t);
          const ramNow = i.button === 'ram' && S.ram && !locked;
          if (i.swipe || buffered || ramNow || S.ramArmed || S.elapsed >= C.RESCUE.auto) { lunge(); return; }
          if (S.t >= S.window.len) go('MISS');
        }
      },
      LUNGE: {
        enter() { S.window = null; },
        upd(h) {
          const p = ss(S.t / C.LUNGE);
          S.gap = lerp(C.GAP_WINDOW, 0, p); S.sx = lerp(sxE, beatSide * 1.2, p); S.pxKick = beatSide * 0.6 * p;
          if (S.t >= C.LUNGE) {
            S.hits++; S.damage = Math.min(3, S.hits); S.sinceHit = 0; S.streakMiss = 0; S.ram = false; S.ramArmed = false;
            emit('hit', { stage: S.hits, x: S.sx, side: beatSide });

          }
        }
      },
      HIT: {
        enter() { S.timeScale = 0; S.tilt = beatSide * C.TILT[Math.min(S.hits, 3) - 1]; S.dur = C.HITSTOP[Math.min(S.hits, 3) - 1]; },
        upd(h) { if (S.t >= S.dur) { S.timeScale = 1; go(S.hits >= C.HITS_TO_STOP ? 'FINISH' : 'RECOVER'); } }
      },
      FINISH: {
        enter() { S.timeScale = C.SLOWMO; },
        upd(h) { if (S.t >= C.FINISH) { S.timeScale = 1; go('PULLOVER'); } }
      },
      RECOVER: {
        upd(h, i) {
          const p = ss(S.t / C.RECOVER);
          S.gap = lerp(gapE, C.RECOVER_GAP, p); S.sx = lerp(sxE, 0, p); S.tilt = tiltE * (1 - p); S.pxKick = (beatSide * 0.6) * (1 - p);

        }
      },
      MISS: {
        enter() {
          S.misses++; S.streakMiss++; S.window = null; emit('miss', { streak: S.streakMiss });
          if (S.streakMiss >= C.RESCUE.misses && !S.ram) { S.ram = true; emit('ram', { on: true }); }
        },
        upd(h) {
          const p = ss(S.t / C.MISS);

        }
      },
      PULLOVER: {
        enter() { S.speed = 30; S.fade = 0; },
        upd(h) {
          const t = S.t;
          S.sx = kf(t, [[0, sxE], [1.2, 3.5], [2.6, 4.6]]);
          S.px = kf(t, [[0, pxE], [1.2, pxE], [2.6, 3.0]]);
          S.gap = kf(t, [[0, gapE], [2.6, 13]]);
          S.speed = kf(t, [[0, 30], [1.2, 12], [2.6, 0]]);
          S.tilt = kf(t, [[0, tiltE], [1.8, 0], [2.6, 5]]);

        }
      },
      EVENT: {
        enter() { S.speed = 0; S.fade = 1; S.cmd = { i: 0, step: '' }; emit('radio', { text: C.EVENT_RADIO }); },
        upd(h, i, locked) {
          S.fade = 1 - ss(S.t / 0.5);

          if (S.t >= 3.0 && !flags.door) { flags.door = true; emit('door'); }

        }
      },
      PREVIEW: {
        enter() { S.cmd.step = 'preview'; emit('cmd', { i: S.cmd.i, step: 'preview', text: C.CMDS[S.cmd.i].text }); },
        upd(h, i, locked) {
          const tapped = (i.tap || i.button === 'next') && !locked;

        }
      },
      SPEAK: {
        enter() { const t = C.CMDS[S.cmd.i].text; S.dur = t.length * 0.07 + 0.6; S.cmd.step = 'speak'; emit('cmd', { i: S.cmd.i, step: 'speak', text: t, auto: speakAuto, dur: S.dur }); },
        upd(h) { if (S.t >= S.dur) go('YOURTURN'); }
      },
      YOURTURN: {
        enter() { ytLimit = C.YOURTURN; ytMore = 0; S.ytLimit = ytLimit; S.cmd.step = 'yourturn'; emit('cmd', { i: S.cmd.i, step: 'yourturn' });  },
        upd(h, i, locked) {

        }
      },
      REACT: {
        enter() {
          const c = C.CMDS[S.cmd.i]; S.cmd.step = 'react';
          S.pose = { from: S.pose.to, to: c.pose, k: 0 }; S.dur = c.dur;
          emit('react', { i: S.cmd.i, pose: c.pose, sfx: c.sfx });
        },
        upd(h) {
          S.pose.k = ss(S.t / (S.dur * 0.8));
          if (S.t >= S.dur) { S.cmd.i++; go(S.cmd.i >= C.CMDS.length ? 'ARREST' : 'PREVIEW'); }
        }
      },
      ARREST: {
        enter() { emit('arrest'); },
        upd(h) {
          if (S.t >= 0.5 && !flags.cuffs) { flags.cuffs = true; emit('cuffs'); }
          if (S.t >= C.ARREST) go('END');
        }
      },
      DEAD: {
        enter() { S.speed = 0; S.timeScale = 1; S.window = null; emit('draw'); },
        upd(h, i, locked) {
          if (S.t >= 0.6 && !flags.shot) { flags.shot = true; emit('shot'); }
          if (S.t >= 1.1 && !flags.dead) { flags.dead = true; emit('dead'); }
          if (S.t >= C.DEAD || (i.tap && S.t >= C.DEAD_SKIP && !locked)) go('TITLE');
        }
      },
      END: {
        enter() { emit('end'); },
        upd(h, i, locked) { if ((i.button === 'replay' || i.tap) && !locked) { reset(); go('INTRO'); } }
      }
    };

    function tick(h, inp) {
      n++; S.t += h; lock = Math.max(0, lock - h); swipeLock = Math.max(0, swipeLock - h); wobble = Math.max(0, wobble - h);
      S.wobble = wobble > 0 ? wobble / C.WOBBLE : 0; S.lock = lock;
      const locked = lock > 0, b = inp.button;
      if (b === 'siren') { sirenIdx = (sirenIdx + 1) % C.SIRENS.length; S.siren = C.SIRENS[sirenIdx]; emit('siren', { mode: S.siren }); }
      if (b === 'lights') { S.lights = !S.lights; emit('lights', { on: S.lights }); }
      if (b === 'ram' && S.ram && S.phase === 'CHASE' && !locked && S.sub !== 'WINDOW') { S.ramArmed = true; emit('ramArm'); }

        S.ct += h; S.elapsed += h;
        if (S.sub !== 'INTRO') S.sinceHit += h;
        if (radioIdx < C.RADIO.length && S.ct >= C.RADIO[radioIdx].t) { emit('radio', { text: C.RADIO[radioIdx].text }); radioIdx++; }
        if (S.sinceHit >= C.RESCUE.idle && !S.ram) { S.ram = true; emit('ram', { on: true }); }
        pxF += (S.sx - pxF) * (1 - Math.exp(-h / C.LAG));
        S.px = pxF + S.pxKick;
      }
      const sub = subs[S.sub];
      if (sub.upd) sub.upd(h, inp, locked);
      if (MAX_DWELL[S.sub] && S.t > MAX_DWELL[S.sub]) {      // 見張り：想定より長く居座ったら先へ進める
        if (!stuckSent) { stuckSent = true; emit('stuck', { sub: S.sub }); }
        if (FORCE_NEXT[S.sub]) go(FORCE_NEXT[S.sub]);
      }
    }

    function step(dt, input) {
      if (input) {
        if (input.swipe) pend.swipe = input.swipe;
        if (input.tap) pend.tap = true;
        if (input.button) pend.button = input.button;
        if (input.voice) pend.voice = true;
        if (input.more) pend.more = true;
      }
      acc += Math.min(Math.max(dt, 0), C.DT_MAX);
      ev = [];
      while (acc >= C.STEP - 1e-9) {
        acc -= C.STEP;

        tick(C.STEP, inp);
      }
      const r = ev; ev = []; return r;
    }

    function bot(s, o) {
      o = o || {};
      const i = { swipe: null, tap: false, button: null, voice: false };
      if (s.sub === 'TITLE') i.button = 'start';
      else if (s.sub === 'WINDOW' && s.window && s.window.t >= (o.delay || 0.3) && !o.noSwipe) i.swipe = { dir: s.window.side };

      else if (s.sub === 'YOURTURN') i.voice = !o.noVoice;
      else if (s.sub === 'EVENT' && o.skip) i.tap = true;
      else if (s.sub === 'END' && o.replay) i.button = 'replay';

    }
    function warp(label) {
      const m = /^(PREVIEW|REACT|YOURTURN)(\d)$/.exec(label), mh = /^HIT(\d)$/.exec(label);
      const pred = {
        WINDOW: () => S.sub === 'WINDOW' && S.window && S.window.t >= 0.2,
        MISS: () => S.sub === 'MISS'
      }[label] || (mh ? () => S.sub === 'HIT' && S.hits === +mh[1]
        : m ? () => S.sub === m[1] && S.cmd.i === +m[2] : () => S.sub === label);
      const o = { noSwipe: label === 'MISS', noVoice: label === 'DEAD' || /^YOURTURN/.test(label) };
      for (let k = 0; k < 60 * 900; k++) {
        if (pred()) { ev = []; return true; }
        step(1 / 60, bot(S, o));
      }
      return false;
    }
    return { step: step, state: S, warp: warp, bot: bot, config: C, get simTime() { return n * C.STEP; } };
  }
  return { create: create };
})();
/*@END*/
/*@END_TESTABLE*/
</script>

<script>
(function () {
  'use strict';
  const Q = new URLSearchParams(location.search);
  const DEBUG = Q.get('debug') === '1', AUTO = Q.get('auto') === '1', SHOT = Q.get('shot');
  const core = CORE.create(CONFIG, { seed: +Q.get('seed') || 1 });
  const S = core.state;
  const $ = id => document.getElementById(id);
  const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');

  /* ================= VIEW ================= */
  const VIEWS = {
    port: { W: 360, H: 640, hor: 230, F: 1018 },
    land: { W: 640, H: 360, hor: 110, F: 720 }
  };
  const CAM_H = 3.2, CAR = { w: 1.8, h: 1.45, l: 4.6 }, ZP = 7.6;
  let V = VIEWS.port, scale = 1, dpr = 1;
  function layout() {
    const land = innerWidth > innerHeight;
    V = land ? VIEWS.land : VIEWS.port;
    stage.className = land ? 'land' : 'port';
    scale = Math.min(innerWidth / V.W, innerHeight / V.H);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    stage.style.width = V.W + 'px'; stage.style.height = V.H + 'px';
    stage.style.transform = 'translate(' + ((innerWidth - V.W * scale) / 2) + 'px,' + ((innerHeight - V.H * scale) / 2) + 'px) scale(' + scale + ')';
    cv.style.width = V.W + 'px'; cv.style.height = V.H + 'px';
    cv.width = Math.round(V.W * scale * dpr); cv.height = Math.round(V.H * scale * dpr);
  }
  addEventListener('resize', () => { layout(); if (SHOT) render(); });
  layout();
  const proj = (x, z, camX) => { const k = V.F / z; return { x: V.W / 2 + (x - camX) * k, y: V.hor + CAM_H * k, k: k }; };
  function carBox(x, z, camX) { const p = proj(x, z, camX); return { cx: p.x, w: CAR.w * p.k, bot: p.y, top: p.y - CAR.h * p.k, h: CAR.h * p.k }; }

  /* ================= AUDIO（B2：合成音。マナーモードではiOSの既定で鳴らない） ================= */
  const AUDIO = {
    ctx: null, master: null, nbuf: null, eng: null, sir: null,
    init() {
      if (this.ctx) { if (this.ctx.state !== 'running') this.ctx.resume(); return; }
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        const c = this.ctx = new AC(); this.master = c.createGain(); this.master.gain.value = 1;
        const comp = c.createDynamicsCompressor(); this.master.connect(comp); comp.connect(c.destination);
        const nb = c.createBuffer(1, c.sampleRate * 1, c.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; this.nbuf = nb;
        // エンジン：のこぎり波＋ローパス
        const eo = c.createOscillator(), ef = c.createBiquadFilter(), eg = c.createGain(); eo.type = 'sawtooth'; eo.frequency.value = 60; ef.type = 'lowpass'; ef.frequency.value = 420; eg.gain.value = 0;
        eo.connect(ef); ef.connect(eg); eg.connect(this.master); eo.start(); this.eng = { o: eo, g: eg, f: ef };
        // サイレン：矩形波＋ローパス
        const so = c.createOscillator(), sf = c.createBiquadFilter(), sg = c.createGain(); so.type = 'square'; so.frequency.value = 700; sf.type = 'lowpass'; sf.frequency.value = 2200; sg.gain.value = 0;
        so.connect(sf); sf.connect(sg); sg.connect(this.master); so.start(); this.sir = { o: so, g: sg };

      } catch (e) { this.ctx = null; }
    },
    on() { return this.ctx && !AUTO && this.ctx.state === 'running'; },
    beep(f, d, type, v, f2) {
      if (!this.on()) return;
      const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
      o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
      g.gain.setValueAtTime(v || 0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);

    noise(d, f0, f1, type, v, delay) {

      s.buffer = this.nbuf; fl.type = type || 'bandpass'; fl.frequency.setValueAtTime(f0, t); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + d); fl.Q.value = 0.9;
      g.gain.setValueAtTime(v || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);

    },

      this.eng.f.frequency.setTargetAtTime(300 + Math.min(S.speed, 70) * 9, now, 0.2);

      if (m === 'WAIL') f = 640 + 560 * (0.5 + 0.5 * Math.sin(t * 2 * Math.PI * 0.28));

    },
    mute() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); },
    // 効果音
    sfx(name, a) {
      if (a && typeof a === 'object') a = a.stage || a.i;

  /* ================= 人物（B4：容疑者と警官。関節をメートルで持ち、補間する） ================= */

  const INCAR = { inCar: 1, handsUpInCar: 1 };
  function poseJoints(p) {

    for (const key in A) o[key] = [A[key][0] + (B[key][0] - A[key][0]) * k, A[key][1] + (B[key][1] - A[key][1]) * k];

  function drawFigure(J, ks, ox, oy, col, skin, cap) {

  }

  // 褒め演出：GOOD / GREAT / EXCELLENT / PERFECT を激しく
  function drawPraise(W, H, land) {
    if (!PR) return; const t = tNow - PR.t0, D = 1.6; if (t >= D) { PR = null; return; }
    const cd = CONFIG.CMDS[PR.i].praise, c = praisePos(), cx = c[0], cy = c[1], fade = t > D - 0.3 ? (D - t) / 0.3 : 1, mono = 'ui-monospace,Menlo,monospace';
    ctx.save(); ctx.globalAlpha = fade;
    ctx.globalCompositeOperation = 'lighter'; const R = Math.max(W, H) * (0.45 + 0.2 * Math.min(1, t / 0.25));
    for (let i = 0; i < 18; i++) { const a = t * 1.6 + i * Math.PI / 9; ctx.fillStyle = i % 2 ? 'rgba(255,220,90,.24)' : 'rgba(255,120,60,.16)'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a, a + Math.PI / 18); ctx.closePath(); ctx.fill(); }
    ctx.globalCompositeOperation = 'source-over';
    const n = PR.i + 1; for (let i = 0; i < n; i++) { const pt = clamp01((t - 0.05 - i * 0.07) / 0.15); if (pt <= 0) continue; const sx = cx + (i - (n - 1) / 2) * 36, sy = cy - (land ? 52 : 60); ctx.fillStyle = '#ffe14a'; ctx.strokeStyle = '#7a3a00'; ctx.lineWidth = 2; star(sx, sy, 15 * pt * (1 + 0.1 * Math.sin(t * 20 + i)), t * 2 + i); ctx.fill(); ctx.stroke(); }
    const ease = t < 0.12 ? t / 0.12 * 1.45 : t < 0.3 ? 1.45 - 0.45 * (t - 0.12) / 0.18 : 1 + 0.04 * Math.sin(t * 22);
    let fs = land ? 56 : 64; ctx.font = '900 ' + fs + 'px ' + mono; const mw = ctx.measureText(cd.word).width, maxW = (land ? W * 0.56 : W * 0.9) / 1.12; if (mw > maxW) fs = Math.floor(fs * maxW / mw);
    ctx.font = '900 ' + fs + 'px ' + mono; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.translate(cx, cy); ctx.rotate(Math.sin(t * 28) * 0.06 * Math.max(0, 1 - t) - 0.05); ctx.scale(ease, ease);
    for (let k = 2; k >= 1; k--) { ctx.globalAlpha = fade * 0.25 / k; ctx.strokeStyle = '#ffe14a'; ctx.lineWidth = 3; ctx.save(); ctx.scale(1 + 0.18 * k, 1 + 0.18 * k); ctx.strokeText(cd.word, 0, 0); ctx.restore(); }
    ctx.globalAlpha = fade; ctx.shadowColor = '#ff3a3a'; ctx.shadowBlur = 24; ctx.lineWidth = Math.max(6, fs * 0.16); ctx.strokeStyle = '#1a0a00'; ctx.strokeText(cd.word, 0, 0);
    const gr = ctx.createLinearGradient(0, -fs / 2, 0, fs / 2); gr.addColorStop(0, '#fff7a8'); gr.addColorStop(0.5, '#ffe14a'); gr.addColorStop(1, '#ff8a1a'); ctx.fillStyle = gr; ctx.shadowBlur = 0; ctx.fillText(cd.word, 0, 0);
    ctx.restore();
  }

  // 撃たれる演出：銃口、発砲、画面の亀裂、YOU'RE DEAD..
  function drawDead(W, H, land) {
    const t = S.t, mono = 'ui-monospace,Menlo,monospace';
    const tv = clamp01(t / 0.6) * 0.4, vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.8); vg.addColorStop(0, 'rgba(160,0,0,0)'); vg.addColorStop(1, 'rgba(160,0,0,' + tv.toFixed(3) + ')'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    if (t >= 0.6) {
      ctx.fillStyle = 'rgba(120,0,0,' + (0.38 - 0.1 * clamp01((t - 0.6) / 1)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H);
      const px = W * 0.58, py = H * 0.4, grow = ss01((t - 0.6) / 0.12);
      ctx.save(); ctx.lineCap = 'round';
      for (let pass = 0; pass < 2; pass++) { ctx.strokeStyle = pass ? 'rgba(255,255,255,.8)' : 'rgba(0,0,0,.45)'; ctx.lineWidth = pass ? 1.3 : 3.2;
        for (let i = 0; i < 16; i++) { const a = hash(i + 50) * 6.2832; let x = px, y = py; ctx.beginPath(); ctx.moveTo(x, y); const segs = 3 + (hash(i + 90) * 3 | 0); for (let k = 0; k < segs; k++) { const l = (14 + hash(i * 9 + k) * 52) * grow, aa = a + (hash(i * 5 + k + 7) - 0.5) * 0.7; x += Math.cos(aa) * l; y += Math.sin(aa) * l; ctx.lineTo(x, y); } ctx.stroke(); } }
      ctx.restore();
    }
    const fb = clamp01((t - 0.9) / 0.9) * 0.88; if (fb > 0) { ctx.fillStyle = 'rgba(0,0,0,' + fb.toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
    if (t >= 1.1) {
      const full = "YOU'RE DEAD..", n = Math.min(full.length, Math.floor((t - 1.1) * 12) + 1), txt = full.slice(0, n), fs = land ? 38 : 42, gx = (hash(Math.floor(t * 20)) - 0.5) * (t < 2 ? 5 : 1.5);
      ctx.save(); ctx.font = '800 ' + fs + 'px ' + mono; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 20;
      ctx.fillStyle = 'rgba(0,255,255,.35)'; ctx.fillText(txt, W / 2 + gx - 2, H * 0.42); ctx.fillStyle = '#ff2a2a'; ctx.fillText(txt, W / 2 + gx, H * 0.42); ctx.shadowBlur = 0;
      if (t >= 2.0) { ctx.font = '700 13px ' + mono; ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + 0.4 * Math.sin(t * 6)).toFixed(2) + ')'; ctx.fillText('TAP TO RETURN TO TITLE', W / 2, H * 0.42 + fs * 1.1); }
      ctx.restore();
    }
    const out = clamp01((t - (CONFIG.DEAD - 0.4)) / 0.4); if (out > 0) { ctx.fillStyle = 'rgba(0,0,0,' + out.toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  const EVPH = { EVENT: 1, CMD: 1, ARREST: 1, END: 1, DEAD: 1 };
  function render() {
    const W = V.W, H = V.H, land = W > H, inEv = !!EVPH[S.phase];
    if (S.hits < GLASS.n) GLASS.reset();                                   // 新しいゲームでガラスを元に戻す
    const camX = S.px + (land && inEv ? 1.5 : 0);
    const sz = ZP + CAR.l + S.gap, sb = carBox(S.sx, sz, camX), pb = carBox(S.px, ZP, camX), ks = sb.w / CAR.w;
    const flash = Math.floor(tNow * 4) % 2 === 0, so = FX.off();
    const zoom = S.phase === 'ARREST' ? 1 + 0.08 * clamp01(S.t / 3) : S.phase === 'END' ? 1.08 : 1;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, so[0] * scale * dpr, so[1] * scale * dpr);
    if (zoom !== 1) { ctx.translate(sb.cx, sb.top); ctx.scale(zoom, zoom); ctx.translate(-sb.cx, -sb.top); }
    drawSky(W, camX);
    drawRoad(W, H, camX);
    drawScenery(W, camX);
    if (S.phase === 'CHASE' && S.speed > 25) {
      ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
      for (let i = 0; i < 16; i++) { const a = hash(i + 900) * 6.2832, r0 = 90 + ((tNow * 260 + i * 53) % 260), x0 = W / 2 + Math.cos(a) * r0 * 1.1, y0 = V.hor + 40 + Math.sin(a) * r0 * 0.7; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + Math.cos(a) * 18, y0 + Math.sin(a) * 14); ctx.stroke(); }
    }
    const doorK = S.phase === 'EVENT' ? ss01((S.t - 3) / 0.4) : (S.phase === 'CMD' || S.phase === 'ARREST' || S.phase === 'END' || S.phase === 'DEAD') ? 1 : 0;
    drawCarRear(sb.cx, sb.bot, sb.w, sb.h, { body: '#a82b2b', bodyLow: '#6e1c1c', roof: '#8c2424', bumper: '#2a2a30', tail: '#ff3030', tilt: S.tilt, damage: S.damage, glass: GLASS, hazard: inEv ? (Math.floor(tNow * 2.6) % 2 === 0) : null, door: doorK });
    probe.cuffs = null;
    if (inEv && !(S.phase === 'EVENT' && S.t < 0.3)) {
      const J = poseJoints(S.pose), wIn = (INCAR[S.pose.from] ? 1 - S.pose.k : 0) + (INCAR[S.pose.to] ? S.pose.k : 0);
      ctx.save();
      if (wIn > 0.5) { ctx.beginPath(); ctx.rect(sb.cx - sb.w * 0.4, sb.bot - 2.2 * ks, sb.w * 0.8, 1.32 * ks); ctx.clip(); }
      const hs = drawFigure(J, ks, sb.cx, sb.bot, '#7b8190', '#c9a27e', null);
      ctx.restore();
      if (S.phase === 'DEAD') {                                           // 銃を構えて、こちらへ向ける
        const gx = hs.hR[0], gy = hs.hR[1], r = ss01(S.t / 0.35);
        ctx.fillStyle = '#0c0c10'; ctx.fillRect(gx - 0.09 * ks, gy - 0.07 * ks, 0.18 * ks, 0.12 * ks * r + 1); ctx.beginPath(); ctx.arc(gx, gy - 0.01 * ks, 0.05 * ks, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = '#6a6a74'; ctx.lineWidth = 1; ctx.stroke();
        if (S.t >= 0.6 && S.t < 0.9) { const fa = 1 - (S.t - 0.6) / 0.3, fr = 1.1 * ks; ctx.save(); ctx.globalCompositeOperation = 'lighter'; const fg = ctx.createRadialGradient(gx, gy, 0, gx, gy, fr); fg.addColorStop(0, 'rgba(255,255,230,' + fa.toFixed(2) + ')'); fg.addColorStop(0.35, 'rgba(255,190,70,' + (fa * 0.8).toFixed(2) + ')'); fg.addColorStop(1, 'rgba(255,90,0,0)'); ctx.fillStyle = fg; ctx.fillRect(gx - fr, gy - fr, fr * 2, fr * 2); ctx.restore(); }
      }
      if (S.pose.to === 'prone' && S.pose.k > 0.9) probe.cuffs = { x: (hs.hL[0] + hs.hR[0]) / 2, y: (hs.hL[1] + hs.hR[1]) / 2 };
      if (S.phase === 'ARREST' || S.phase === 'END') drawFigure(OFFICER, ks * 1.04, sb.cx, sb.bot + 3, '#2a4585', '#c9a27e', '#10182e');
    }
    const sway = S.wobble > 0 ? Math.sin(tNow * 42) * 2.6 * S.wobble : 0;
    const talking = S.sub === 'SPEAK' || !!(SAY.text && tNow - SAY.t0 < SAY.dur);
    drawCarRear(pb.cx, pb.bot, pb.w, pb.h, { body: '#1b2440', bodyLow: '#0e1426', roof: '#141b32', bumper: '#0a0d18', tail: '#ff2a2a', police: true, lights: S.lights, flash: flash, tilt: sway, talk: talking });
    if (inEv && S.phase !== 'DEAD' && !(S.phase === 'EVENT' && S.t < 1.5)) {
      const a0 = ctx.globalCompositeOperation; ctx.globalCompositeOperation = 'lighter';
      const sx0 = pb.cx + pb.w * 0.1, sy0 = pb.top + pb.h * 0.02, tx = sb.cx - sb.w * 0.9, ty = sb.top + sb.h * 0.4, spread = sb.w * 1.5;
      const sg = ctx.createRadialGradient(tx, ty, 2, tx, ty, spread); sg.addColorStop(0, 'rgba(255,250,225,.55)'); sg.addColorStop(1, 'rgba(255,250,225,0)');
      ctx.fillStyle = sg; ctx.beginPath(); ctx.moveTo(sx0 - 6, sy0); ctx.lineTo(tx - spread, ty + spread * 0.5); ctx.lineTo(tx + spread, ty - spread * 0.2); ctx.lineTo(sx0 + 6, sy0); ctx.closePath(); ctx.fill();
      ctx.globalCompositeOperation = a0;
    }
    if (S.lights) {
      const a = ctx.globalCompositeOperation; ctx.globalCompositeOperation = 'lighter';
      const lw = ctx.createLinearGradient(0, 0, W * 0.45, 0); lw.addColorStop(0, flash ? 'rgba(255,40,60,.32)' : 'rgba(40,100,255,.32)'); lw.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = lw; ctx.fillRect(0, 0, W * 0.45, H);
      const rw = ctx.createLinearGradient(W, 0, W * 0.55, 0); rw.addColorStop(0, flash ? 'rgba(40,100,255,.32)' : 'rgba(255,40,60,.32)'); rw.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rw; ctx.fillRect(W * 0.55, 0, W * 0.45, H);
      ctx.globalCompositeOperation = a;
    }
    FX.draw();
    if (S.window) drawWindowHUD(sb);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    if (S.phase === 'CMD' || S.phase === 'ARREST') drawPartner(W, H, land, flash);
    if (S.sub === 'YOURTURN') drawSayIt(W, H, land);
    drawPraise(W, H, land);
    ctx.textAlign = 'center';
    if (S.sub === 'MISS') { ctx.fillStyle = '#ff6a6a'; ctx.font = '700 14px ui-monospace,Menlo,monospace'; ctx.fillText('MISS', W / 2, V.hor - 40); }
    if (DEBUG && (S.phase === 'CMD' || S.phase === 'ARREST')) { ctx.fillStyle = '#fff'; ctx.font = '700 12px ui-monospace,Menlo,monospace'; ctx.fillText('POSE: ' + S.pose.to + ' ' + S.pose.k.toFixed(2), sb.cx, sb.bot + 16); }
    if (S.sub === 'FINISH' || (S.sub === 'HIT' && S.hits >= 3)) {
      const vg = ctx.createRadialGradient(W / 2, H * 0.5, H * 0.2, W / 2, H * 0.5, H * 0.75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.6)');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    }
    if (S.phase === 'DEAD') drawDead(W, H, land);
    if (FX.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, FX.flash).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
    if (S.fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + S.fade + ')'; ctx.fillRect(0, 0, W, H); }
    ctx.textAlign = 'start';
    probe.suspect = { w: sb.w, top: sb.top, bot: sb.bot, cx: sb.cx }; probe.police = { w: pb.w, top: pb.top, bot: pb.bot, cx: pb.cx };
    probe.view = { W: W, H: H, scale: scale, hor: V.hor };
    probe.state = { phase: S.phase, sub: S.sub, gap: S.gap, sx: S.sx, px: S.px, hits: S.hits };
  }

  /* ================= MAIN ================= */
  let yTick = 0, last = performance.now(), fps = 60, fpsN = 0, fpsT = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1); last = now;
    if (!paused) {
      if (!AUTO) { const r = MICV.update(dt, S); if (r === 'voice') pend.voice = true; else if (r === 'more') pend.more = true; if (NOMIC && S.sub === 'YOURTURN' && S.t > 1.0) pend.voice = true; }
      const evs = core.step(dt, AUTO ? core.bot(S, { replay: true }) : null);
      if (!AUTO) { /* 入力は下の pend で渡す */ }
      handle(evs);
      tNow += dt; scroll += S.speed * dt * S.timeScale; AUDIO.update(S, tNow); FX.update(dt);
      if (S.sub === 'YOURTURN') { yTick += dt; if (yTick >= ((1 - S.t / S.ytLimit) < 0.4 ? 0.25 : 0.5)) { yTick = 0; AUDIO.sfx('tick'); } } else yTick = 0;
      fpsN++; fpsT += dt; if (fpsT >= 0.5) { fps = fpsN / fpsT; fpsN = 0; fpsT = 0; }
      updateUI(dt);
    }
    render();
    requestAnimationFrame(frame);
  }
  // 入力は core.step に1フレーム分まとめて渡す
  const _step = core.step;
  core.step = function (dt, input) {
    const merged = { swipe: pend.swipe, tap: pend.tap, button: pend.button, voice: pend.voice, more: pend.more };
    pend = { swipe: null, tap: false, button: null, voice: false, more: false };
    if (input) { merged.swipe = merged.swipe || input.swipe; merged.tap = merged.tap || input.tap; merged.button = merged.button || input.button; }
    return _step(dt, merged);
  };

  if (SHOT) {
    // 撮影用：その場面まで進めて止める（?shot=HIT2&t=0.5）
    document.documentElement.classList.add('shot');
    core.warp(SHOT === 'TITLE' ? 'TITLE' : SHOT);
    const extra = +Q.get('t') || 0, o = { noVoice: SHOT === 'DEAD' || /^YOURTURN/.test(SHOT) };
    if (S.hits > 0) { GLASS.reset(); for (let h = 1; h <= S.hits; h++) GLASS.hit(h, S.side || 1, false); }
    for (let k = 0; k < Math.round(extra * 60); k++) { const evs = _step(1 / 60, core.bot(S, o)); scroll += S.speed / 60 * S.timeScale; tNow += 1 / 60; }
    updateUI(0.016); render();
    if (S.sub === 'HIT') { GLASS.reset(); for (let h = 1; h < S.hits; h++) GLASS.hit(h, S.side || 1, false); GLASS.hit(S.hits, S.side || 1, true); FX.hit({ stage: S.hits, side: S.side || 1 }); FX.update(0.08 + extra); }
    if (S.sub === 'REACT') { PR = { t0: tNow - Math.min(extra, 1.0), i: S.cmd.i }; FX.praise(); FX.update(0.3); SAY = { text: CONFIG.CMDS[S.cmd.i].praise.say, t0: tNow - 0.1, dur: 3 }; }
    if (S.sub === 'YOURTURN' && extra >= 0.8) { MICV.gauge = 0.6; MICV.level = 0.06; }
    if (S.sub === 'PULLOVER' && S.t > 2.6) { FX.dust(); FX.update(0.5); }
    if (S.phase === 'ARREST' || S.phase === 'END') { FX.glint(); FX.update(0.2); }
    render(); window.__ready = true;
  } else {
    requestAnimationFrame(frame);
  }
  window.__core = core;
})();
</script>
