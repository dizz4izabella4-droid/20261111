<style>
/* ============================================================
   izのおもちゃ箱 — レトロPC風トップ「フロッピーでえらぶ」
   作品は下の DISKS に1件足すと、ディスクが1枚増える（書き方は DISK_SPEC.md）
   ============================================================ */
:root{
  --ja:"Yu Gothic UI","游ゴシック","YuGothic","Hiragino Sans","ヒラギノ角ゴシック","Hiragino Kaku Gothic ProN",Meiryo,"Noto Sans JP","Noto Sans CJK JP",sans-serif;
  --mono:"MS Gothic","ＭＳ ゴシック","Osaka-Mono","Noto Sans Mono CJK JP","Noto Sans CJK JP",monospace;
  --beige:#d9d4c1; --beigeD:#bdb7a1; --beigeDD:#8d8774; --ink:#4a463b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--ja);color:#e8e4d4;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  background:radial-gradient(ellipse at 40% 20%,#3b372f 0%,#26231e 55%,#191714 100%)}
button{font:inherit;color:inherit}

/* ---------- 机（全体の配置）: 縦長は 上=本体 下=ディスクケース、横長は 左=本体 右=ディスクケース ---------- */
.desk{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,47fr) minmax(0,53fr);gap:8px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
@media (min-aspect-ratio:23/20){
  .desk{grid-template-columns:minmax(0,1fr) clamp(300px,34vw,440px);grid-template-rows:minmax(0,1fr);gap:14px;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
}
.stagebox{position:relative;min-width:0;min-height:0}
.scene{position:absolute;left:0;top:0;width:720px;height:730px;transform-origin:0 0;--s:1}
.scene>*{position:absolute}

/* ---------- モニター ---------- */
.monitor{left:10px;top:0;width:700px;height:472px;z-index:1;border-radius:26px 26px 16px 16px;
  background:linear-gradient(180deg,#e2ddca 0%,#d3cdb8 60%,#c7c1ab 100%);
  box-shadow:inset 0 2px 0 #f3efdf,inset 0 -5px 0 #aaa48e,0 9px 0 #8c8672,0 24px 30px rgba(0,0,0,.5)}
.bezel{position:absolute;left:30px;top:28px;width:640px;height:400px;border-radius:16px;background:#0a0a0c;
  box-shadow:0 0 0 5px #1c1c20,0 0 0 7px #a39d88,0 0 0 8px #efeadb,inset 0 0 20px #000}
.screen{position:absolute;inset:0;border-radius:16px;overflow:hidden;background:#04050a;color:#e6e6e6;font:16px/17px var(--mono)}
.screen::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px)}
.screen::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(0,0,0,.55) 100%),linear-gradient(155deg,rgba(255,255,255,.07) 0%,transparent 32%)}
.screen .txt{position:absolute;inset:0;padding:0;text-shadow:0 0 5px rgba(150,200,255,.45);transform-origin:50% 50%}
.screen.off .txt{display:none}
.screen.on .txt{animation:crton .55s cubic-bezier(.3,.7,.2,1) both}
@keyframes crton{0%{transform:scale(.2,.006);filter:brightness(5)}45%{transform:scale(1,.006);filter:brightness(4)}100%{transform:none;filter:none}}
.screen.flick .txt{animation:flick .3s steps(3) 1}
@keyframes flick{0%,100%{opacity:1}33%{opacity:.25}66%{opacity:.8}}
.chin{position:absolute;left:30px;right:30px;bottom:0;height:44px}
.chin .mname{position:absolute;left:4px;top:11px;font:italic 800 18px/1 "Arial Black","Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;color:#6d685a;text-shadow:0 1px 0 #f2eedf}
.chin .mname small{font:700 10px var(--ja);letter-spacing:.2em;margin-left:10px;font-style:normal}
.plamp{position:absolute;right:6px;top:16px;width:12px;height:12px;border-radius:50%;background:#2c3a1a;box-shadow:inset 0 0 0 2px #8f8a76}
.plamp.on{background:#8cff5a;box-shadow:inset 0 0 0 2px #8f8a76,0 0 8px #8cff5a}
.stand{left:300px;top:466px;width:120px;height:110px;z-index:0;border-radius:4px 4px 0 0;background:linear-gradient(90deg,#a9a38e,#d9d4c1 40%,#b7b19b)}

/* ---------- 画面の中身（テキスト画面） ---------- */
.bar{height:24px;line-height:24px;padding:0 12px;background:#1a2bd8;color:#fff;display:flex;justify-content:space-between;letter-spacing:.08em;text-shadow:none}
.menu{position:absolute;inset:0;display:flex;flex-direction:column}
.menu .ttl{margin:20px 0 0 28px;font:800 34px/1.1 var(--ja);letter-spacing:.06em;color:#6ff;text-shadow:0 0 10px rgba(80,255,255,.5)}
.menu .sub{margin:4px 0 0 30px;color:#9aa;letter-spacing:.3em;font-size:12px}
.menu .pr{margin:20px 0 0 30px;font-size:18px}
.cur{display:inline-block;width:9px;height:16px;margin-left:3px;background:#e6e6e6;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.menu .inf{margin:18px 30px 0;padding:10px 14px;border:2px solid #4a58d8;min-height:112px}
.menu .inf .hint{color:#aab;line-height:1.7}
.kv{display:flex;gap:12px;line-height:22px}
.kv span{width:76px;color:#8d96ff;flex:none}
.kv b{font-weight:400;color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .ft{margin-top:auto;height:24px;line-height:24px;padding:0 12px;background:#e6e6e6;color:#000;display:flex;justify-content:space-between;text-shadow:none;letter-spacing:.06em}
.ln{min-height:20px;line-height:20px;white-space:pre}
.boot{position:absolute;inset:0;padding:18px 26px}
.cy{color:#6ff}.yl{color:#ff6}.gn{color:#6f6}.mg{color:#f6f}.rd{color:#f66}.dm{color:#98a}
.barw{display:inline-flex;gap:2px;margin-left:4px;vertical-align:-1px}
.barw i{width:9px;height:14px;background:#26306b}
.barw i.f{background:#6ff;box-shadow:0 0 5px rgba(100,255,255,.6)}
.hintskip{position:absolute;right:16px;bottom:10px;color:#667;font-size:12px;letter-spacing:.1em}

/* ---------- ディスクの差し込み口（ベイ）と本体 ---------- */
.bay{left:480px;top:272px;width:200px;height:300px;z-index:2;overflow:hidden;pointer-events:none}
.bay .bayd{position:absolute;left:0;top:248px;width:200px;transform:translateY(var(--y,0px));will-change:transform;pointer-events:auto;cursor:pointer}
.bay.drop::after{content:"";position:absolute;inset:0;border:3px dashed #ffe27a;border-radius:8px;animation:blink .8s steps(2) infinite}
.unit{left:10px;top:572px;width:700px;height:146px;z-index:3;border-radius:6px 6px 16px 16px;
  background:linear-gradient(180deg,#ddd8c5 0%,#cfc9b4 55%,#c3bda7 100%);
  box-shadow:inset 0 2px 0 #f2eedf,inset 0 -5px 0 #a39d88,0 8px 0 #7d7764,0 22px 26px rgba(0,0,0,.5)}
.unit::before{content:"";position:absolute;left:0;right:0;top:-9px;height:9px;border-radius:12px 12px 0 0;background:linear-gradient(180deg,#eeeadb,#e0dbc8)}
.lip{left:468px;top:560px;width:224px;height:12px;z-index:5;border-radius:6px;pointer-events:none;
  background:linear-gradient(180deg,#0a0a0a 0%,#1d1d1d 70%,#3a3a3a 100%);box-shadow:0 2px 0 #f2eedf,0 3px 0 #a39d88}
.unit>*{position:absolute}
.badge{left:28px;top:18px;font:italic 800 30px/1 "Arial Black","Helvetica Neue",Arial,sans-serif;letter-spacing:.04em;color:#5d594b;text-shadow:0 1px 0 #f4f0e1}
.badge small{display:block;margin-top:6px;font:700 11px var(--ja);letter-spacing:.2em;font-style:normal;color:#7b7666}
.vent{left:196px;top:22px;width:170px;height:46px;border-radius:3px;background:repeating-linear-gradient(180deg,#a7a18c 0 3px,#d9d4c1 3px 8px);box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.ctl{cursor:pointer;border:0;padding:0;font-family:var(--ja);-webkit-appearance:none;appearance:none}
.ctl::after{content:"";position:absolute;
  top:calc(max(0px,(44px / var(--s) - 100%) / 2) * -1);bottom:calc(max(0px,(44px / var(--s) - 100%) / 2) * -1);
  left:calc(max(0px,(44px / var(--s) - 100%) / 2) * -1);right:calc(max(0px,(44px / var(--s) - 100%) / 2) * -1)}
.ctl:focus-visible{outline:3px solid #6af;outline-offset:3px}
.lab{font:700 11px var(--ja);letter-spacing:.14em;color:#6d685a;text-shadow:0 1px 0 #f4f0e1;white-space:nowrap}
.power{left:28px;top:80px;width:76px;height:38px;border-radius:6px;background:linear-gradient(180deg,#8f8a78,#6e6a5b);box-shadow:0 4px 0 #4f4c41,inset 0 2px 0 #b3ad98;color:#fff;font-weight:800;font-size:12px;letter-spacing:.1em}
.power:active,.power.pr{transform:translateY(3px);box-shadow:0 1px 0 #4f4c41,inset 0 2px 0 #b3ad98}
.pled{left:116px;top:92px;width:14px;height:14px;border-radius:50%;background:#2c3a1a;box-shadow:inset 0 0 0 2px #8f8a76}
.pled.on{background:#8cff5a;box-shadow:inset 0 0 0 2px #8f8a76,0 0 9px #8cff5a}
.reset{left:226px;top:82px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c94a3a,#8e2a20);box-shadow:0 4px 0 #5a1a14,inset 0 -3px 0 rgba(0,0,0,.25)}
.reset:active{transform:translateY(3px);box-shadow:0 1px 0 #5a1a14}
.snd{left:298px;top:88px;width:74px;height:32px;border-radius:16px;background:#a39d88;box-shadow:inset 0 2px 4px rgba(0,0,0,.35);color:#4a463b;font-weight:800;font-size:11px;letter-spacing:.1em}
.snd::before{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#e9e5d3;box-shadow:0 2px 0 #7d7764;transition:transform .2s}
.snd.on{background:#5aa86a}.snd.on::before{transform:translateX(42px)}
.snd span{position:absolute;top:0;line-height:32px}
.dplate{left:446px;top:14px;width:240px;height:118px;border-radius:8px;background:linear-gradient(180deg,#bdb7a1,#cbc5af);box-shadow:inset 0 3px 6px rgba(0,0,0,.28),inset 0 -1px 0 #efeadb}
.dplate>*{position:absolute}
.lever{left:88px;top:20px;width:64px;height:22px;border-radius:11px;background:linear-gradient(180deg,#5b574c,#2d2b26);box-shadow:0 2px 0 #1a1916,inset 0 2px 0 #7f7b6d;transition:transform .22s cubic-bezier(.4,1.4,.5,1)}
.lever::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#a8a28d;box-shadow:inset 0 1px 0 #ddd}
.lever.closed{transform:rotate(90deg)}
.dlab{left:14px;top:88px}
.acc{left:14px;top:20px;width:16px;height:16px;border-radius:50%;background:#3a1810;box-shadow:inset 0 0 0 2px #8f8a76}
.acc.on{background:#ff5a2a;box-shadow:inset 0 0 0 2px #8f8a76,0 0 10px #ff5a2a}
.accl{left:12px;top:40px}
.eject{left:162px;top:74px;width:64px;height:30px;border-radius:5px;background:linear-gradient(180deg,#6e6a5b,#4f4c41);box-shadow:0 4px 0 #2e2c26,inset 0 2px 0 #9a947f;color:#fff;font-weight:800;font-size:12px;letter-spacing:.06em}
.eject:active{transform:translateY(3px);box-shadow:0 1px 0 #2e2c26}

/* ---------- フロッピーディスク（5.25インチ）: ケースの中・空中・ベイの中で同じ見た目。大きさは親の幅で決まる ---------- */
.disk{--c:#e8668f;position:relative;display:block;aspect-ratio:1;container-type:inline-size;-webkit-user-drag:none;user-select:none}
.disk .sl{position:absolute;inset:0;border-radius:3cqw;overflow:hidden;
  background:linear-gradient(135deg,#323237 0%,#1b1b1f 55%,#28282d 100%);
  box-shadow:inset 0 0 0 .7cqw #0b0b0d,inset 0 1.2cqw 0 rgba(255,255,255,.07),0 1.2cqw 2.4cqw rgba(0,0,0,.55)}
.disk .sl::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 .6cqw,transparent .6cqw 1.4cqw)}
.disk .hub{position:absolute;left:50%;top:60%;width:23cqw;height:23cqw;margin:-11.5cqw;border-radius:50%;
  background:radial-gradient(circle,#0a0a0a 0 36%,#e9e5d3 37% 52%,#bdb8a6 53% 58%,transparent 59%)}
.disk .idx{position:absolute;left:62%;top:50%;width:3.4cqw;height:3.4cqw;border-radius:50%;background:#0a0a0a;box-shadow:0 0 0 .5cqw #d9d4c1}
.disk .hd{position:absolute;left:43.5%;top:74%;width:13cqw;height:27cqw;border-radius:6.5cqw;background:linear-gradient(90deg,#4a3a2a,#7a6246 50%,#4a3a2a);box-shadow:inset 0 0 0 .9cqw #0a0a0a,0 0 0 .5cqw #55555c}
.disk .wp{position:absolute;left:0;top:36%;width:3.4cqw;height:9cqw;background:#09090b;border-radius:0 1cqw 1cqw 0}
.disk .lb{position:absolute;left:8cqw;top:5cqw;width:84cqw;height:30cqw;background:#f0ead7;border-radius:1.2cqw;overflow:hidden;
  box-shadow:inset 0 0 0 .4cqw rgba(0,0,0,.14),0 .5cqw 1cqw rgba(0,0,0,.4)}
.disk .st{position:absolute;left:0;right:0;top:0;height:4.4cqw;background:var(--c)}
.disk .en{position:absolute;left:3cqw;right:2cqw;top:6.6cqw;white-space:nowrap;overflow:hidden;font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;color:#1d1b17;letter-spacing:.01em;line-height:1.15}
.disk .ja{position:absolute;left:3cqw;right:2cqw;top:18.4cqw;white-space:nowrap;overflow:hidden;font-family:var(--ja);font-weight:700;color:#4a463b;line-height:1.2}
.disk .mt{position:absolute;left:3cqw;right:2cqw;bottom:1.4cqw;display:flex;gap:1.6cqw;font:700 3.3cqw/1 "Arial Narrow",Arial,sans-serif;color:#6d685a}
.disk .mt em{font-style:normal;padding:.5cqw 1.2cqw;border:.3cqw solid #8d8774;border-radius:.6cqw}
.disk .mt em.pc{background:var(--c);border-color:var(--c);color:#fff}
.disk .tp{position:absolute;right:3cqw;top:38cqw;padding:.8cqw 2cqw;transform:rotate(7deg);background:#d9483b;color:#fff;font:900 4.2cqw/1 "Arial Black",Arial,sans-serif;letter-spacing:.12em;box-shadow:0 .5cqw 0 rgba(0,0,0,.35)}
.disk.test .wp{background:linear-gradient(90deg,#c9c9cf,#8c8c94);width:4.4cqw}
.disk.stopped{filter:grayscale(.85) brightness(.8)}

/* 空中を飛ぶディスク */
.fly{position:fixed;left:0;top:0;z-index:150;display:none;pointer-events:none;transform-origin:0 0;filter:drop-shadow(0 12px 14px rgba(0,0,0,.45))}

/* ---------- ディスクケース ---------- */
.case{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:14px;
  background:linear-gradient(180deg,#2a2926,#1d1c1a);box-shadow:inset 0 0 0 2px #3a3835,inset 0 3px 0 #4a4844,0 10px 24px rgba(0,0,0,.5)}
.chead{flex:none;display:flex;align-items:center;gap:6px;padding:10px 46px 0 12px}
.cname{font:800 12px var(--mono);letter-spacing:.2em;color:#b7b19a;margin-right:auto;white-space:nowrap}
.tab{flex:none;padding:7px 11px 6px;border:0;border-radius:8px 8px 0 0;background:#3c3a35;color:#9d9784;font:800 11px/1.2 var(--ja);letter-spacing:.06em;cursor:pointer;min-height:34px}
.tab b{display:block;font:800 10px var(--mono);letter-spacing:.1em}
.tab[aria-selected=true]{background:#d9d4c1;color:#3d3a30}
.tab:focus-visible{outline:3px solid #6af;outline-offset:-3px}
.shelf{flex:1;min-height:0;margin:0 8px 8px;padding:12px;border-radius:0 0 10px 10px;background:#d9d4c1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;align-content:start;
  box-shadow:inset 0 4px 10px rgba(0,0,0,.35);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.04) 0 2px,transparent 2px 6px)}
.shelf[hidden]{display:none}
.slot{position:relative;border-radius:6px}
.pick{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;border-radius:5px;transition:transform .16s cubic-bezier(.3,1.6,.5,1);touch-action:pan-y}
.pick:hover,.pick:focus-visible{transform:translateY(-7px) rotate(-1.2deg)}
.pick:active{transform:translateY(-2px)}
.pick:focus-visible{outline:3px solid #2f6fe0;outline-offset:3px}
.slot.away .pick{visibility:hidden}
.slot.away::after{content:"IN A:";position:absolute;inset:0;display:grid;place-items:center;border:2px dashed #a9a38d;border-radius:6px;color:#8d8774;font:800 12px var(--mono);letter-spacing:.2em}
.cfoot{flex:none;display:flex;align-items:center;gap:2px;padding:0 10px 8px 6px;margin-top:-2px}
.cfoot a{display:grid;place-items:center;width:40px;height:40px;color:#9d9784;opacity:.75;text-decoration:none;border-radius:6px}
.cfoot a:hover,.cfoot a:focus-visible{opacity:1;outline:none;color:#e8e4d4}
.cfoot a:focus-visible{box-shadow:0 0 0 2px #6af}
.cfoot svg{width:22px;height:22px}
.byiz{position:fixed;z-index:4;right:max(12px,env(safe-area-inset-right,0px));bottom:max(6px,env(safe-area-inset-bottom,0px));font:italic 600 11px/1 "Times New Roman","Liberation Serif",serif;letter-spacing:.08em;color:#9d9784;opacity:.6;pointer-events:none}

/* ---------- ゲーム画面（モニターから全画面へズーム） ---------- */
#run{position:fixed;inset:0;z-index:100;background:#000;transform-origin:0 0;opacity:0;pointer-events:none;overflow:hidden}
#run iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:block}
body.running .desk{visibility:hidden}
/* ディスクのタブ（左上の小さな印）: 開くと「EJECT」「RESET」 */
#chip{position:fixed;z-index:200;top:max(8px,env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));display:none;align-items:flex-start;gap:6px}
body.running #chip{display:flex}
#chip .cb{width:30px;height:30px;padding:3px;border:1px solid rgba(255,255,255,.25);border-radius:7px;background:rgba(20,20,24,.5);opacity:.32;cursor:pointer;transition:opacity .2s}
#chip .cb:hover,#chip .cb:focus-visible,#chip.open .cb{opacity:.95;outline:none}
#chip .cb svg{display:block;width:100%;height:100%}
#chip .cm{display:none;flex-direction:column;gap:5px}
#chip.open .cm{display:flex}

<!--IZ-LINK-BRIDGE:START--><script id="izlink-bridge">
/* izlink bridge v1 — 連携アプリの共通データ層とイベント
 *
 * 各アプリ（保管庫・レッドライン・iz2611）と外枠（link/）に埋め込む小さな部品。
 * 埋め込みは tools/apply_link_bridge.py で行う（作品は1ファイル完結のため）。
 *
 * 保存先（同一ドメインの localStorage）
 *   izlink.v1.meta      : { caseId, settings:{ brand, stringsForFloppy } }
 *   izlink.v1.<caseId>  : { marks:[], floppies:{}, terminal:{}, board:{items:[],pins:[],strings:[]}, truth:null }
 *
 * API（window.IzLink）
 *   IzLink.linked                 外枠の中で動いているか（単体起動なら false）
 *   IzLink.brand()                端末名（既定 'iz2611'）
 *   IzLink.setting(key)           設定値
 *   IzLink.caseId()               現在の事件ID
 *   IzLink.meta() / setMeta(fn)   メタの読み出し・更新
 *   IzLink.get(caseId?)           事件データ（無ければ空の形で返す）
 *   IzLink.update(fn, caseId?)    事件データを fn(data) で書き換えて保存し、'data.changed' を流す
 *   IzLink.on(type, cb)           イベント受信（自分・他の画面・外枠のどこから来たものも）。戻り値で解除
 *   IzLink.emit(type, payload)    イベント送信（自分にも届く。外枠経由で他の画面へも届く）
 *   IzLink.onVisibility(cb)       表示・非表示の通知（外枠が送る）
 *
 * 主なイベント
 *   case.selected {caseId}  mark.added {docId,...}  string.added {stringId}
 *   floppy.found {caseId}   floppy.inserted {caseId}  article.pinned {articleId}
 *   evidence.found {...}    truth.revealed {...}      data.changed {caseId}
 */
(function (global) {
  'use strict';
  if (global.IzLink) return;

  var PREFIX = 'izlink.v1.';
  var META_KEY = PREFIX + 'meta';
  var DEFAULT_SETTINGS = { brand: 'iz2611', stringsForFloppy: 3 };
  var listeners = {};
  var visListeners = [];
  var isTop = global.parent === global;
  // 外枠（link/）は、部品より先に window.IZLINK_HOST = 1 を置く。
  // 祖先に外枠がいるときだけ「連携中」とみなす（単体の端末の中のディスクなどは連携しない）
  var hostWin = null;
  (function () {
    var w = global;

    } catch (e) { return fallback; }
  }

    try { global.localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }

  function emptyCase() {
    return { marks: [], floppies: {}, terminal: {}, board: { items: [], pins: [], strings: [] }, truth: null };
  }
  function normalizeCase(d) {
    var e = emptyCase();
    if (!d || typeof d !== 'object') return e;
    for (var k in e) if (!(k in d)) d[k] = e[k];
    if (!d.board || typeof d.board !== 'object') d.board = e.board;
    ['items', 'pins', 'strings'].forEach(function (k) { if (!Array.isArray(d.board[k])) d.board[k] = []; });
    return d;
  }

  function meta() {
    var m = read(META_KEY, null) || {};
    m.settings = m.settings || {};
    for (var k in DEFAULT_SETTINGS) if (!(k in m.settings)) m.settings[k] = DEFAULT_SETTINGS[k];
    if (!('caseId' in m)) m.caseId = null;
    return m;
  }
  function setMeta(fn) {
    var m = meta();
    var r = fn(m);
    write(META_KEY, r || m);
    return r || m;
  }

  function caseId() { return meta().caseId; }
  function get(id) {
    id = id || caseId();
    if (!id) return emptyCase();
    return normalizeCase(read(PREFIX + id, null));
  }
  function update(fn, id) {
    id = id || caseId();
    if (!id) return null;
    var d = get(id);
    var r = fn(d);
    d = normalizeCase(r || d);
    write(PREFIX + id, d);
    emit('data.changed', { caseId: id });
    return d;
  }

  function deliver(type, payload, origin) {
    var ev = { type: type, payload: payload || {}, origin: origin };
    (listeners[type] || []).slice().forEach(function (cb) { try { cb(ev.payload, ev); } catch (e) { console.error(e); } });
    (listeners['*'] || []).slice().forEach(function (cb) { try { cb(ev.payload, ev); } catch (e) { console.error(e); } });
  }
  function on(type, cb) {
    (listeners[type] = listeners[type] || []).push(cb);
    return function () {
      var a = listeners[type] || [];

  // 窓の木（外枠 → 各アプリ → その中のディスク …）に沿って、送り元以外の隣へ流す
  function neighbors() {

  }

    var d = e.data;

    if (d.type === 'izlink.visibility') {
      if (e.source === global.parent) visListeners.slice().forEach(function (cb) { try { cb(!!d.visible); } catch (er) {} });

    }
    if (d.izlink !== 1 || d.kind !== 'event' || d.from === selfId || !hostWin) return;
    var known = e.source === global.parent && !isTop;
    if (!known) {
      var frames = global.document ? global.document.querySelectorAll('iframe') : [];
      for (var i = 0; i < frames.length; i++) if (frames[i].contentWindow === e.source) { known = true; break; }
    }
    if (!known) return;
    deliver(d.type, d.payload, 'frame');
    relay(d, e.source);
  });

  var api = {
    version: 1,
    linked: !!hostWin && hostWin !== global,
    isFrame: hostWin === global,
    brand: function () { return meta().settings.brand; },
    setting: function (k) { return meta().settings[k]; },
    meta: meta,
    setMeta: setMeta,
    caseId: caseId,
    get: get,
    update: update,
    on: on,
    emit: emit,
    onVisibility: function (cb) { visListeners.push(cb); },
    _keys: { prefix: PREFIX, meta: META_KEY }
  };
  global.IzLink = api;
  if (api.linked) {
    try { global.parent.postMessage({ type: 'izlink.ready' }, '*'); } catch (e) {}
  }
})(window);
</script><!--IZ-LINK-BRIDGE:END-->

 * 位置を変えたいときは、この前に window.IZ_BASE={pos:'tr'|'tl'|'br'|'bl'} を書く。
 */
(function () {
  'use strict';
  if (window.__izGameBase) return;
  window.__izGameBase = 1;
  var D = document, W = window, DE = D.documentElement;
  var KEY = 'izGameBase.orient';
  var cfg = W.IZ_BASE || {};
  /* 表示文言。作品側で window.IZ_BASE={lang:'en'} を書くと英語になる（既定は日本語） */
  var T = cfg.lang === 'en'
    ? { set: 'Display settings', scr: 'SCREEN', fs: 'Go full screen', fsOff: 'Exit full screen', ori: 'ORIENTATION', auto: 'Auto', port: 'Portrait', land: 'Landscape', close: 'Close', nAuto: 'Follows your device orientation.', nFix: 'Locks the orientation in full screen. If it cannot be locked, please rotate your device.', rot: function (m) { return '\u21bb Please turn your device to ' + (m === 'land' ? 'landscape' : 'portrait'); } }
    : { set: '表示設定', scr: '画面', fs: '全画面にする', fsOff: '全画面をやめる', ori: '向き', auto: '自動', port: '縦', land: '横', close: '閉じる', nAuto: '端末の向きに合わせます。', nFix: '全画面のときに向きを固定します。固定できない場合は、端末を回してください。', rot: function (m) { return '\u21bb 端末を' + (m === 'land' ? '横' : '縦') + '向きにしてください'; } };

  /* ---------- 1. 拡大の無効化 ---------- */
  function fixViewport() {

    if (!m) {
      m = D.createElement('meta');
      m.name = 'viewport';
      (D.head || DE).appendChild(m);
      m.content = 'width=device-width,initial-scale=1,viewport-fit=cover';

    c = c.replace(/(^|,)\s*(maximum-scale|minimum-scale|user-scalable)\s*=\s*[^,]*/gi, '').replace(/^,/, '');

  });

  D.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length > 1 && e.scale && e.scale !== 1) e.preventDefault();

  // ダブルタップ拡大の保険。ボタン・入力欄などは click を壊さないよう除外し、CSS の touch-action に任せる
  var lastEnd = 0;
  var SKIP = 'input,textarea,select,button,a,label,summary,video,audio,[contenteditable],[role="button"],[data-iz-base-ui]';

  function isFs() { return !!(D.fullscreenElement || D.webkitFullscreenElement); }

  }

    try {
      var p = fsReq.call(fsEl, { navigationUI: 'hide' });

    try { var p = f && f.call(D); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  function lockApi() { return W.screen && screen.orientation && screen.orientation.lock; }

  var uiOk = fsOk || orOk;

    if (mode === 'auto') {
      try { if (W.screen && screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
      return;
    }
    var tgt = mode === 'land' ? 'landscape' : 'portrait';
    function lock() {
      if (!lockApi()) return;
      try { var p = screen.orientation.lock(tgt); if (p && p.catch) p.catch(function () {}); } catch (e) {}

  try { mode = localStorage.getItem(KEY) || 'auto'; } catch (e) {}

  var pos = cfg.pos || 'tr';
  function build() {
    if (ui || !D.body || !uiOk) return;
    var css = D.createElement('style');
    css.textContent =
      '#izb{position:fixed;z-index:2147483646;font:12px/1.4 "Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}' +
      '#izb *{box-sizing:border-box}' +
      '#izb.tr{top:calc(6px + env(safe-area-inset-top,0px));right:calc(6px + env(safe-area-inset-right,0px))}' +
      '#izb.tl{top:calc(6px + env(safe-area-inset-top,0px));left:calc(6px + env(safe-area-inset-left,0px))}' +
      '#izb.br{bottom:calc(6px + env(safe-area-inset-bottom,0px));right:calc(6px + env(safe-area-inset-right,0px))}' +
      '#izb.bl{bottom:calc(6px + env(safe-area-inset-bottom,0px));left:calc(6px + env(safe-area-inset-left,0px))}' +
      '#izb button{font:inherit;color:inherit;border:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}' +
      '#izb .iz-b{width:30px;height:30px;border-radius:8px;background:rgba(20,20,24,.45);border:1px solid rgba(255,255,255,.25);font-size:16px;line-height:28px;text-align:center;padding:0;opacity:.45;transition:opacity .2s}' +
      '#izb .iz-b:active,#izb.open .iz-b{opacity:1}' +
      '#izb .iz-p{display:none;position:absolute;width:210px;padding:10px;border-radius:10px;background:rgba(18,18,22,.94);border:1px solid rgba(255,255,255,.22);box-shadow:0 4px 18px rgba(0,0,0,.5)}' +
      '#izb.open .iz-p{display:block}' +
      '#izb.tr .iz-p,#izb.tl .iz-p{top:36px}#izb.br .iz-p,#izb.bl .iz-p{bottom:36px}' +
      '#izb.tr .iz-p,#izb.br .iz-p{right:0}#izb.tl .iz-p,#izb.bl .iz-p{left:0}' +
      '#izb .iz-h{font-size:11px;color:#aab;margin:0 0 5px}' +
      '#izb .iz-r{display:flex;gap:4px;margin-bottom:9px}' +
      '#izb .iz-r button{flex:1;padding:8px 0;border-radius:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:13px}' +
      '#izb .iz-r button.on{background:#e8c13a;color:#111;border-color:#e8c13a;font-weight:700}' +
      '#izb .iz-r button[disabled]{opacity:.4}' +
      '#izb .iz-n{font-size:10.5px;color:#9a9aa8;margin:-3px 0 6px}' +
      '#izb .iz-x{display:block;width:100%;padding:6px 0;border-radius:7px;background:transparent;border:1px solid rgba(255,255,255,.18);font-size:12px;color:#ccd}' +
      '#izbn{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:2147483645;padding:7px 14px;border-radius:18px;background:rgba(18,18,22,.88);border:1px solid rgba(255,255,255,.25);color:#fff;font:13px/1.3 "Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;pointer-events:none;display:none;white-space:nowrap}';

    ui.className = pos;
    ui.setAttribute('data-iz-base-ui', '');

      '<button type="button" class="iz-b" tabindex="-1" aria-label="' + T.set + '">⛶</button>' +
      '<div class="iz-p">' +
      (fsOk ? '<div class="iz-h">' + T.scr + '</div><div class="iz-r"><button type="button" tabindex="-1" data-fs="1">' + T.fs + '</button></div>' : '') +
      (orOk ? '<div class="iz-h">' + T.ori + '</div><div class="iz-r" id="izor"><button type="button" tabindex="-1" data-o="auto">' + T.auto + '</button><button type="button" tabindex="-1" data-o="port">' + T.port + '</button><button type="button" tabindex="-1" data-o="land">' + T.land + '</button></div><div class="iz-n" id="izon"></div>' : '') +
      '<button type="button" class="iz-x" tabindex="-1" data-close="1">' + T.close + '</button>' +

    panel = ui.querySelector('.iz-p');

    });

</div>

<script>
(()=>{'use strict';
/* ===================================================================
   ディスクの一覧（DISKS）
   新しい作品を載せるとき: リポジトリに作品のフォルダ（中に index.html）を作り、ここに1件足す。詳しくは DISK_SPEC.md
     id … フォルダ名（英数とハイフン）  path … フォルダの場所（末尾に /）  name … 英語の題名（ラベルの大きな字。20字まで）
     ja … 日本語のひとこと（ラベルの小さな字。12字まで）  label … 読み上げ用の名前（省略すると ja）
     for … 'pc'（PC専用。ラベルに「PC ONLY」）/ 'mobile' / 'both'   color … 'pink' / 'mint' / 'lav' / 'lemon' / 'red' / 'blue' / 'orange'
     box … 'A'（おもちゃ箱）/ 'B'（実験室。ラベルに TEST の赤い印）   start・upd … 制作開始日・最終更新日（YYYY-MM-DD）  ver … バージョン
     stopped … true で開発休止（灰色）   launch … 'embed'（既定。モニターの中で動かす）/ 'page'（ページ移動で動かす。埋め込めない作品用）
   新しい作品は先頭に足す（新しいものが一番上）
   =================================================================== */
const DISKS=[
  {id:'reiji-no-kiroku', path:'works/reiji-no-kiroku/', name:'ZERO HOUR LOG', ja:'零時の記録', label:'零時の記録（サンプル）', for:'both', color:'blue', box:'A', start:'2026-11-14', upd:'2026-11-14', ver:'0.1'},
  {id:'giulia', path:'works/giulia/', name:'MIDNIGHT BROADCAST', ja:'午前零時の放送室', label:'午前零時の放送室（脚本：Giulia）', for:'both', color:'pink', box:'A', start:'2026-11-16', upd:'2026-11-16', ver:'1.0'},
  {id:'chiara', path:'works/chiara/', name:'SEVENTH MOVEMENT', ja:'零時の第七楽章', label:'零時の第七楽章（脚本：Chiara）', for:'both', color:'lav', box:'A', start:'2026-11-16', upd:'2026-11-16', ver:'1.0'},
  {id:'elena', path:'works/elena/', name:'CLOCK TOWER', ja:'時計塔の密室', label:'時計塔の密室（脚本：Elena）', for:'both', color:'orange', box:'A', start:'2026-11-16', upd:'2026-11-16', ver:'1.0'},
  {id:'olivia', path:'works/olivia/', name:'DUSK CLOCKTOWER', ja:'黄昏のクロックタワー', label:'黄昏のクロックタワー（脚本：Olivia）', for:'both', color:'mint', box:'A', start:'2026-11-16', upd:'2026-11-16', ver:'1.0'},
];
/* ===== 連携アプリ（link/）の中で動くとき（単体で開いたときは何も変わらない） =====
   ・端末名は共通設定から取る（既定 iz2611）。画面に出る端末名は TERM だけを使う
   ・ディスクケースには、保管庫で手に取った事件の専用フロッピーだけを並べる
   ・CASE_DISKS … 事件ID → 専用フロッピー（cases/<id>/ に1ファイル完結で置く） */
const LINKED=!!(window.IzLink&&IzLink.linked);
const TERM=LINKED?{model:IzLink.brand(),title:IzLink.brand()}:{model:'iz2611',title:'iz2611'};
const CASE_DISKS={
  'X-01':{path:'cases/x-01/',name:'CASE FILE X-01',ja:'テスト事件（試作）'}
};
function linkDisks(){
  const out=[];
  Object.keys(CASE_DISKS).forEach(cid=>{
    const f=IzLink.get(cid).floppies[cid]; if(!f||!f.taken) return;
    const c=CASE_DISKS[cid];
    out.push({id:'case-'+cid.toLowerCase(),path:c.path,name:c.name,ja:c.ja,label:c.ja,for:'both',color:'red',box:'A',ver:'1.0',caseId:cid});
  });
  return out;
}
if(LINKED) DISKS.splice(0,DISKS.length,...linkDisks());
/* 実験室へ入る・戻るはタブで行う。BOXの名前 */
const BOXES={A:{key:'A:',ja:'おもちゃ箱'},B:{key:'B:',ja:'実験室'}};

/* ---------- 基本 ---------- */
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const T=ms=>reduce?Math.max(0,Math.round(ms*.12)):ms;
const sleep=ms=>new Promise(r=>setTimeout(r,T(ms)));
const ORIGIN=(location.protocol==='file:'||location.origin==='null')?'*':location.origin;
const COL={pink:'#e8668f',mint:'#3fb393',lav:'#8e72e0',lemon:'#f0b93a',red:'#d9483b',blue:'#3f7fd9',orange:'#ea8a3a'};
const byId={}; DISKS.forEach((d,i)=>{ d.i=i; byId[d.id]=d; });
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vol=id=>id.toUpperCase().replace(/[^A-Z0-9]/g,'_');
const fd=s=>String(s||'').replace(/-/g,'.');
const st={phase:'empty',disk:null,busy:false,pushed:false,pendingEject:false,power:true,sound:true,box:'A',S:1,frame:null,readyRes:null,savedRes:null,skip:false,mode:'embed',peek:null};
try{ st.sound=localStorage.getItem('izTop.sound')!=='0'; }catch(e){}
const scene=$('scene'), stagebox=$('stagebox'), screenEl=$('screen'), txt=$('txt'), bay=$('bay'), flyer=$('flyer'), run=$('run'), lever=$('lever'), chip=$('chip');
const say=m=>{ $('live').textContent=m; };

/* ---------- 音（Web Audioで合成。消音スイッチ・SOUNDスイッチに従う） ---------- */
const sfx=(()=>{
  let ac=null, nb=null, motor=null;
  function ctx(){ if(!st.sound) return null; if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(ac.state==='suspended') ac.resume(); return ac; }
  function noise(a){ if(!nb){ nb=a.createBuffer(1,a.sampleRate,a.sampleRate); const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return nb; }
  function tone(f,t0,dur,v,type,f2){ const a=ctx(); if(!a) return; const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+t0; o.type=type||'square';
    o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.03); }
  function burst(t0,dur,v,f1,f2,q){ const a=ctx(); if(!a) return; const s=a.createBufferSource(), b=a.createBiquadFilter(), g=a.createGain(), t=a.currentTime+t0;
    s.buffer=noise(a); b.type='bandpass'; b.Q.value=q||1; b.frequency.setValueAtTime(f1,t); b.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(b); b.connect(g); g.connect(a.destination); s.start(t); s.stop(t+dur+.03); }
  return {
    unlock(){ ctx(); },
    click(){ tone(1500,0,.03,.05,'square'); },
    pick(){ tone(660,0,.06,.05,'triangle'); tone(990,.05,.07,.04,'triangle'); },
    whoosh(){ burst(0,.34,.09,500,2200,.8); },
    slide(){ burst(0,.34,.06,2600,800,2); },
    thunk(){ tone(130,0,.14,.16,'sine',48); burst(0,.05,.07,900,400,1); },
    latch(){ tone(900,0,.02,.06,'square'); tone(520,.05,.04,.07,'square'); tone(110,.06,.12,.12,'sine',55); },
    seek(n){ for(let i=0;i<n;i++){ const t=i*.075+Math.random()*.03; burst(t,.05,.05,160+Math.random()*180,80,2); tone(95+Math.random()*60,t,.04,.025,'square'); } },
    beep(){ tone(1000,0,.09,.05,'square'); tone(2000,.09,.09,.04,'square'); },
    eject(){ burst(0,.08,.12,1800,500,1); tone(320,0,.18,.09,'triangle',90); tone(760,.03,.22,.04,'triangle',300); },
    off(){ tone(180,0,.25,.07,'sawtooth',40); },
    motorOn(){ const a=ctx(); if(!a||motor) return; const o=a.createOscillator(), lp=a.createBiquadFilter(), g=a.createGain();
      o.type='sawtooth'; o.frequency.value=47; lp.type='lowpass'; lp.frequency.value=240; g.gain.setValueAtTime(0,a.currentTime); g.gain.linearRampToValueAtTime(.045,a.currentTime+.3);
      o.connect(lp); lp.connect(g); g.connect(a.destination); o.start(); motor={o,g,a}; },
    motorOff(){ if(!motor) return; const {o,g,a}=motor; motor=null; try{ g.gain.cancelScheduledValues(a.currentTime); g.gain.setValueAtTime(g.gain.value,a.currentTime); g.gain.linearRampToValueAtTime(0,a.currentTime+.25); o.stop(a.currentTime+.3); }catch(e){} }
  };
})();

/* ---------- ディスクの絵 ---------- */
function diskEl(d){
  const el=document.createElement('div');
  el.className='disk'+(d.test?' test':'')+(d.stopped?' stopped':'');
  el.style.setProperty('--c',COL[d.color]||COL.pink);
  const n1=[...d.name].length, n2=[...d.ja].length;
  const fe=Math.min(10,112/Math.max(n1,1)), fj=Math.min(5.4,74/Math.max(n2,1));
  el.innerHTML='<div class="sl"><i class="wp"></i><i class="hub"></i><i class="idx"></i><i class="hd"></i>'+
    '<div class="lb"><b class="st"></b><b class="en" style="font-size:'+fe.toFixed(2)+'cqw">'+esc(d.name)+'</b>'+
    '<span class="ja" style="font-size:'+fj.toFixed(2)+'cqw">'+esc(d.ja)+'</span>'+
    '<span class="mt"><em>NO.'+String(d.i+1).padStart(2,'0')+'</em>'+(d.for==='pc'?'<em class="pc">PC ONLY</em>':'')+'<em>2HD</em></span></div>'+
    (d.test?'<span class="tp">TEST</span>':'')+'</div>';
  return el;
}

/* ---------- ケース（棚とタブ） ---------- */
const shelves={A:$('shelfA'),B:$('shelfB')};
const slots={};
function buildCase(){
  const head=document.querySelector('.chead');
  const used=['A','B'].filter(k=>DISKS.some(d=>d.box===k));
  if(used.length>1) used.forEach(k=>{
    const n=DISKS.filter(d=>d.box===k).length;
    const t=document.createElement('button'); t.type='button'; t.className='tab'; t.dataset.box=k; t.setAttribute('role','tab');
    t.innerHTML='<b>'+BOXES[k].key+'</b>'+esc(BOXES[k].ja)+' '+n; head.appendChild(t);
    t.addEventListener('click',()=>{ sfx.click(); setBox(k); });
  });
  DISKS.forEach(d=>{
    const s=document.createElement('div'); s.className='slot'; s.dataset.id=d.id;
    const b=document.createElement('button'); b.type='button'; b.className='pick'; b.setAttribute('aria-label',(d.label||d.ja)+' '+d.name+' — insert disk');
    b.appendChild(diskEl(d)); s.appendChild(b); shelves[d.box].appendChild(s); slots[d.id]=s;
    b.addEventListener('mouseenter',()=>peek(d)); b.addEventListener('focus',()=>peek(d));
    b.addEventListener('mouseleave',()=>peek(null)); b.addEventListener('blur',()=>peek(null));
    b.addEventListener('click',()=>{ if(drag.swallow){ drag.swallow=false; return; } insert(d.id); });
    b.addEventListener('keydown',e=>shelfKey(e,b));
  });
  setBox('A');
}
function setBox(k){
  st.box=k;
  ['A','B'].forEach(x=>{ shelves[x].hidden=(x!==k); });
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.box===k)));
}
function shelfKey(e,b){
  const keys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
  if(!keys.includes(e.key)) return;
  const all=[...shelves[st.box].querySelectorAll('.slot:not(.away) .pick')]; const i=all.indexOf(b); if(i<0) return;
  const top0=all[0].getBoundingClientRect().top; let cols=0; for(const p of all){ if(Math.abs(p.getBoundingClientRect().top-top0)<4) cols++; else break; } cols=Math.max(cols,1);
  const j=i+(e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:e.key==='ArrowUp'?-cols:cols);
  if(j>=0&&j<all.length){ e.preventDefault(); all[j].focus(); }
}

/* ---------- 画面の大きさに合わせて本体を拡縮 ---------- */
function fit(){
  const w=stagebox.clientWidth, h=stagebox.clientHeight; if(!w||!h) return;
  const S=Math.max(.15,Math.min(w/720,h/730)); st.S=S;
  scene.style.transform='scale('+S+')'; scene.style.setProperty('--s',S);
  scene.style.left=((w-720*S)/2)+'px'; scene.style.top=((h-730*S)/2)+'px';
}
new ResizeObserver(fit).observe(stagebox); addEventListener('resize',fit);

/* ---------- CRTの画面 ---------- */
function setScreen(html){ txt.innerHTML=html; }
function menuHTML(d){
  const nA=DISKS.filter(x=>x.box==='A').length, nB=DISKS.length-nA;
  let inf;
  if(d){
    inf='<div class="kv"><span>VOLUME</span><b>'+esc(vol(d.id))+'</b></div><div class="kv"><span>TITLE</span><b class="yl">'+esc(d.name)+'</b></div>'+
      '<div class="kv"><span>NOTE</span><b>'+esc(d.ja)+'</b></div><div class="kv"><span>FOR</span><b>'+(d.for==='pc'?'PC':d.for==='mobile'?'SMARTPHONE':'PC / SMARTPHONE')+'</b></div>'+
      '<div class="kv"><span>VER</span><b>'+esc(d.ver||'-')+(d.start?'   START '+fd(d.start):'')+(d.upd?'   UPD '+fd(d.upd):'')+'</b></div>';
  } else if(LINKED&&!DISKS.length) inf='<div class="hint">NO CASE DISK.<br>専用フロッピーは保管庫で見つかる。</div>';
  else inf='<div class="hint">SELECT A FLOPPY DISK FROM THE DISK CASE.<br>TAP / CLICK TO INSERT.<br><span class="dm">(PC: DRAG A DISK TO DRIVE A:)</span></div>';
  return '<div class="menu"><div class="bar"><span>'+esc(TERM.model)+' FD MONITOR</span><span>Ver 1.0</span></div><div class="ttl">'+esc(TERM.title)+'</div><div class="sub">D I S K &nbsp; O P E R A T I N G &nbsp; M E N U</div>'+
    '<div class="pr">A&gt; <span class="cy">INSERT A DISK</span><i class="cur"></i></div><div class="inf">'+inf+'</div>'+
    '<div class="ft"><span>DRIVE A: [NO DISK]</span><span>WORKS:'+DISKS.length+'</span></div></div>';
}
function showMenu(d){ if(!st.power) return; setScreen(menuHTML(d||null)); }
function peek(d){ st.peek=d; if(st.phase==='empty'&&!st.busy&&st.power&&!st.posting) showMenu(d); }
function msgScreen(lines){ setScreen('<div class="menu"><div class="bar"><span>'+esc(TERM.model)+' FD MONITOR</span><span>Ver 1.0</span></div><div class="boot" style="top:24px">'+lines.map(l=>'<div class="ln '+(l[1]||'')+'">'+esc(l[0])+'</div>').join('')+'</div></div>'); }
function setLed(id,on){ $(id).classList.toggle('on',!!on); }
function blinkAcc(n){ let i=0; const f=()=>{ setLed('acc',i%2===0); if(++i<(n||4)*2) setTimeout(f,55); else setLed('acc',st.phase==='in'&&st.reading); }; f(); }

/* 電源を入れたときの画面（BIOS風。クリックで飛ばせる） */
async function post(){
  st.posting=true; screenEl.classList.remove('off'); screenEl.classList.remove('on'); void screenEl.offsetWidth; screenEl.classList.add('on');
  const L=[[TERM.model+' BIOS  Ver 1.00','cy'],['',''],['MEMORY CHECK','']];
  const draw=m=>setScreen('<div class="boot">'+L.map(l=>'<div class="ln '+l[1]+'">'+esc(l[0])+'</div>').join('')+(m||'')+'</div>');
  draw(); await sleep(260);
  for(let k=0;k<=640&&!st.skip;k+=160){ L[2][0]='MEMORY CHECK  '+k+'KB'; draw(); await sleep(90); }
  L[2][0]='MEMORY CHECK  640KB ... OK'; L[2][1]='gn'; L.push(['FDD A: ... '+(st.phase==='empty'?'NO DISK':'DISK IN DRIVE'),'']); draw(); await sleep(260);
  st.posting=false; st.skip=false;
  if(st.phase==='empty') showMenu(st.peek);
}

/* ---------- 飛行・スライド ---------- */
const BAY={x:480,y:272,w:200,h:300}, Y_IN=0, Y_POP=-36, Y_HOV=-160, DISK_TOP=248;
function hoverRect(){ const r=bay.getBoundingClientRect(), S=st.S; return {left:r.left,top:r.top+(DISK_TOP+Y_HOV)*S,width:BAY.w*S,height:BAY.w*S}; }
async function fly(el,from,to,ms,arc){
  el.style.width=to.width+'px'; el.style.left=to.left+'px'; el.style.top=to.top+'px'; el.style.display='block';
  const k0=from.width/to.width, dx=from.left-to.left, dy=from.top-to.top;
  const kf=[{transform:'translate('+dx+'px,'+dy+'px) scale('+k0+')'},
            {transform:'translate('+(dx*.45)+'px,'+(dy*.45-arc)+'px) scale('+((k0+1)/2*1.03)+')',offset:.55},
            {transform:'translate(0,0) scale(1)'}];
  const a=el.animate(kf,{duration:T(ms),easing:'cubic-bezier(.4,0,.2,1)',fill:'both'});
  await a.finished.catch(()=>{});
}
function hideFlyer(){ flyer.getAnimations().forEach(a=>a.cancel()); flyer.style.display='none'; flyer.replaceChildren(); }
async function slide(el,from,to,ms,o){
  o=o||{}; el.style.setProperty('--y',from+'px');
  const kf=[{transform:'translateY('+from+'px)',easing:o.ease||'cubic-bezier(.4,0,.2,1)'}];
  if(o.over!=null) kf.push({transform:'translateY('+(to+o.over)+'px)',offset:o.at||.8,easing:'ease-out'});
  kf.push({transform:'translateY('+to+'px)'});
  const a=el.animate(kf,{duration:T(ms),fill:'both'}); await a.finished.catch(()=>{});
  el.style.setProperty('--y',to+'px'); a.cancel();
}
function slotRectOf(d){ setBox(d.box); const s=slots[d.id]; s.scrollIntoView({block:'nearest'}); return s.getBoundingClientRect(); }

/* ---------- ゲームの読み込み ---------- */
function loadFrame(d){
  const f=document.createElement('iframe'); f.title=d.name; f.className='gf';
  f.setAttribute('allow','autoplay; fullscreen; gamepad; accelerometer; gyroscope; clipboard-write'); 
  const ready=new Promise(r=>{ st.readyRes=r; });
  st.frame=f;
  f.addEventListener('load',()=>{ setTimeout(()=>st.readyRes&&st.readyRes(),600); try{ f.contentWindow.postMessage({izdisk:1,type:'hello',id:d.id,host:1},ORIGIN); }catch(e){} });
  f.src=d.path; run.replaceChildren(f);
  return ready;
}
addEventListener('message',e=>{
  const m=e.data; if(!m||m.izdisk!==1||!st.frame||e.source!==st.frame.contentWindow) return;
  if(m.type==='ready'&&st.readyRes) st.readyRes();
  else if(m.type==='access'){ blinkAcc(3); sfx.seek(2); }
  else if(m.type==='saved'&&st.savedRes) st.savedRes();
  else if(m.type==='eject') requestEject();
});

/* ---------- 起動画面 ---------- */
async function bootSeq(d,ready){
  st.reading=true; setLed('acc',true); sfx.motorOn(); st.skip=false;
  const L=[[TERM.model+' DISK LOADER  Ver 1.0','cy'],['',''],['DRIVE A: ......... READY',''],['VOLUME : '+vol(d.id),''],['TITLE  : '+d.name,'yl'],
           ['VER    : '+(d.ver||'-')+(d.upd?'   '+fd(d.upd):''),''],['','']];
  let shown=0, barN=0; const CELLS=32;
  const draw=extra=>{ setScreen('<div class="menu"><div class="bar"><span>'+esc(TERM.model)+' FD MONITOR</span><span>Ver 1.0</span></div><div class="boot" style="top:24px">'+
    L.slice(0,shown).map(l=>'<div class="ln '+(l[1]||'')+'">'+esc(l[0])+'</div>').join('')+
    (shown>=L.length?'<div class="ln">LOADING <span class="barw">'+Array.from({length:CELLS},(_,i)=>'<i'+(i<barN?' class="f"':'')+'></i>').join('')+'</span></div>':'')+(extra||'')+
    '</div><div class="hintskip">TAP TO SKIP</div></div>'); };
  const wait=ms=>st.skip?Promise.resolve():sleep(ms);
  for(shown=1;shown<=L.length;shown++){ draw(); sfx.seek(1); await wait(120); }
  while(barN<CELLS){ barN=Math.min(CELLS,barN+(st.skip?CELLS:1+(Math.random()*3|0))); draw(); if(!st.skip&&Math.random()<.6) sfx.seek(1); await wait(55); }
  draw('<div class="ln gn">STARTING '+esc(vol(d.id))+'.EXE</div>'); sfx.beep(); await wait(260);
  let waited=false; const t0=performance.now();
  const timeout=new Promise(r=>setTimeout(()=>r('timeout'),12000));
  const dots=setInterval(()=>{ waited=true; draw('<div class="ln gn">STARTING '+esc(vol(d.id))+'.EXE</div><div class="ln dm">WAITING FOR DISK'+'.'.repeat(1+((performance.now()-t0)/400|0)%3)+'</div>'); },400);
  const r=await Promise.race([ready,timeout]); clearInterval(dots);
  st.reading=false; setLed('acc',false); sfx.motorOff();
  return r!=='timeout';
}

/* ---------- ズーム（モニター ⇄ 全画面） ---------- */
function fitXf(){
  const sr=screenEl.getBoundingClientRect(), w=run.offsetWidth, h=run.offsetHeight, k=Math.min(sr.width/w,sr.height/h);
  return 'translate('+(sr.left+(sr.width-w*k)/2)+'px,'+(sr.top+(sr.height-h*k)/2)+'px) scale('+k+')';
}
async function zoomIn(){
  const xf=fitXf(); setScreen(''); run.style.opacity='1'; run.style.pointerEvents='none';
  const a=run.animate([{transform:xf,filter:'brightness(1.8)'},{transform:'translate(0px,0px) scale(1)',filter:'brightness(1)'}],{duration:T(560),easing:'cubic-bezier(.5,0,.15,1)',fill:'both'});
  await a.finished.catch(()=>{}); a.cancel(); run.style.transform='none'; run.style.pointerEvents='auto';
  document.body.classList.add('running'); focusGame();
}
async function zoomOut(){
  document.body.classList.remove('running'); closeChip(); run.style.pointerEvents='none';
  const xf=fitXf();
  const a=run.animate([{transform:'none',filter:'brightness(1)',opacity:1},{transform:xf,filter:'brightness(1.4)',opacity:1,offset:.72},
    {transform:xf+' scale(1,.02)',filter:'brightness(3)',opacity:1,offset:.9},{transform:xf+' scale(1,.02)',filter:'brightness(3)',opacity:0}],
    {duration:T(640),easing:'cubic-bezier(.5,0,.2,1)',fill:'both'});
  await a.finished.catch(()=>{}); a.cancel(); run.style.opacity='0'; run.style.transform='';
}
function focusGame(){ try{ st.frame.focus(); st.frame.contentWindow.focus(); }catch(e){} }

/* ---------- 挿入 ---------- */
async function _insert(d,startRect,fromDrag){
  if(!st.power){ await powerOn(true); }
  else if(st.posting){ st.skip=true; await sleep(60); }
  st.mode=d.launch==='page'?'page':'embed';
  if(!startRect) startRect=slotRectOf(d);
  const slot=slots[d.id];
  flyer.replaceChildren(diskEl(d)); flyer.style.display='block';
  slot.classList.add('away'); say('Disk inserted: '+(d.label||d.ja));
  if(!fromDrag) sfx.pick(); sfx.whoosh();
  const hov=hoverRect();
  await fly(flyer,startRect,hov,fromDrag?300:520,28);
  const bd=diskEl(d); bd.classList.add('bayd'); bd.style.setProperty('--y',Y_HOV+'px'); bay.replaceChildren(bd); hideFlyer();
  bd.addEventListener('click',()=>{ if(st.phase==='popped') takeOut(); });
  sfx.slide(); await slide(bd,Y_HOV,Y_IN,430,{over:4,at:.82,ease:'cubic-bezier(.55,0,.9,.55)'}); sfx.thunk();
  st.phase='in'; st.disk=d;
  lever.classList.add('closed'); sfx.latch(); await sleep(230);
  if(st.mode==='embed'&&!st.pushed){ try{ st.histBase=history.length; history.pushState({izdisk:d.id},''); st.pushed=true; }catch(e){} }
  const ready=st.mode==='embed'?loadFrame(d):Promise.resolve();
  const ok=await bootSeq(d,ready);
  if(!ok){ msgScreen([[TERM.model+' DISK LOADER  Ver 1.0','cy'],['',''],['DISK READ ERROR','rd'],['PLEASE EJECT THE DISK.','']]); sfx.off(); await sleep(1800); pendingEjectSoon(); return; }
  if(st.mode==='page'){ try{ sessionStorage.setItem('izTop.page',d.id); }catch(e){} await sleep(200); location.href=d.path; return; }
  if(LINKED&&d.caseId) IzLink.emit('floppy.inserted',{caseId:d.caseId});
  await zoomIn();
}
function pendingEjectSoon(){ st.pendingEject=true; }

/* ---------- 排出 ---------- */
async function _eject(){
  const d=st.disk; if(!d) return;
  if(st.frame&&document.body.classList.contains('running')){
    const saved=new Promise(r=>{ st.savedRes=r; });
    try{ st.frame.contentWindow.postMessage({izdisk:1,type:'before-eject'},ORIGIN); }catch(e){}
    await Promise.race([saved,new Promise(r=>setTimeout(r,T(280)))]); st.savedRes=null;
    await zoomOut();
  } else if(st.frame){ document.body.classList.remove('running'); run.style.opacity='0'; }
  if(st.frame){ st.frame.src='about:blank'; st.frame.remove(); st.frame=null; run.replaceChildren(); }
  try{ sessionStorage.removeItem('izTop.page'); }catch(e){}
  st.reading=false; setLed('acc',false); sfx.motorOff();
  msgScreen([['A> EJECT','cy'],['',''],['DISK EJECTED.',''],['PLEASE REMOVE THE DISK','yl']]);
  lever.classList.remove('closed'); sfx.eject();
  const bd=bay.firstElementChild; if(bd) await slide(bd,Y_IN,Y_POP,360,{over:-6,at:.7,ease:'cubic-bezier(.2,1,.4,1)'});
  st.phase='popped'; say('Disk ejected: '+(d.label||d.ja));
}
async function _takeOut(){
  const d=st.disk; if(!d) return;
  const bd=bay.firstElementChild; sfx.slide();
  if(bd) await slide(bd,Y_POP,Y_HOV,320,{});
  const from=hoverRect(); flyer.replaceChildren(diskEl(d)); flyer.style.display='block'; bay.replaceChildren();
  const to=slotRectOf(d); sfx.whoosh();
  await fly(flyer,from,{left:to.left,top:to.top,width:to.width,height:to.width},460,24);
  slots[d.id].classList.remove('away'); hideFlyer(); sfx.pick();
  st.phase='empty'; st.disk=null; showMenu(st.peek);
}

/* ---------- 操作の入り口（二重操作を防ぐ） ---------- */
async function insert(id,startRect,fromDrag){
  if(st.busy) return; const d=byId[id]; if(!d) return; st.busy=true; sfx.unlock();
  try{
    if(st.phase==='in') await _eject();
    if(st.phase==='popped') await _takeOut();
    await _insert(d,startRect,fromDrag);
  } finally { st.busy=false; if(st.pendingEject){ st.pendingEject=false; setTimeout(ejectNow,0); } }
}
async function ejectNow(){ if(st.busy||st.phase!=='in') return; st.busy=true; try{ await _eject(); } finally { st.busy=false; } }
async function takeOut(){ if(st.busy||st.phase!=='popped') return; st.busy=true; sfx.unlock(); try{ await _takeOut(); } finally { st.busy=false; } }
function requestEject(fromPop){
  if(st.phase==='popped'){ takeOut(); return; }
  if(st.phase!=='in') return;
  if(st.busy){ st.pendingEject=true; return; }
  if(st.pushed&&!fromPop){ history.go(-Math.max(1,history.length-(st.histBase||history.length-1))); setTimeout(()=>{ if(st.phase==='in'&&!st.busy){ st.pushed=false; ejectNow(); } },450); return; }
  st.pushed=false; ejectNow();
}
addEventListener('popstate',()=>{ if(st.pushed){ st.pushed=false; requestEject(true); } });
async function resetGame(){
  if(st.phase!=='in'||st.busy) return; sfx.click();
  if(st.mode==='page'){ location.href=st.disk.path; return; }
  if(!st.frame) return;
  run.animate([{filter:'brightness(1)'},{filter:'brightness(0)',offset:.3},{filter:'brightness(1)'}],{duration:T(420)});
  setTimeout(()=>{ const u=new URL(st.disk.path,location.href).href; try{ st.frame.contentWindow.location.replace(u); }catch(e){ st.frame.src=st.disk.path; } },T(130));
}

/* ---------- 本体のボタン ---------- */
async function powerOn(fast){ if(st.power) return; st.power=true; setLed('pled',true); setLed('plamp',true); sfx.beep(); st.skip=!!fast; await post(); }
function powerOff(){ if(!st.power||st.phase==='in'||st.busy) return; st.power=false; setLed('pled',false); setLed('plamp',false); screenEl.classList.add('off'); sfx.off(); }
$('bPower').addEventListener('click',()=>{ sfx.unlock(); st.power?powerOff():powerOn(false); });
$('bReset').addEventListener('click',()=>{
  sfx.unlock();
  if(st.phase==='in') resetGame();
  else if(st.power&&!st.busy){ sfx.click(); st.skip=false; post(); }
});
$('bEject').addEventListener('click',()=>{ sfx.unlock(); if(st.phase==='in'||st.phase==='popped') requestEject(); });
$('bSnd').addEventListener('click',()=>{ st.sound=!st.sound; try{ localStorage.setItem('izTop.sound',st.sound?'1':'0'); }catch(e){} syncSnd(); if(st.sound){ sfx.unlock(); sfx.click(); } });
function syncSnd(){ const b=$('bSnd'); b.classList.toggle('on',st.sound); b.setAttribute('aria-checked',String(st.sound)); b.firstChild.textContent=st.sound?'ON':'OFF'; b.firstChild.style.left=st.sound?'10px':'34px'; }
screenEl.addEventListener('pointerdown',()=>{ if(st.reading||st.posting) st.skip=true; });
addEventListener('keydown',e=>{ if((st.reading||st.posting)&&(e.key==='Enter'||e.key===' '||e.key==='Escape')) st.skip=true; if(e.key==='Escape') closeChip(); });

/* ---------- 左上のディスクのタブ（ゲーム中） ---------- */
let chipT=0;
function closeChip(){ chip.classList.remove('open'); $('chipBtn').setAttribute('aria-expanded','false'); clearTimeout(chipT); }
$('chipBtn').addEventListener('click',()=>{ const o=!chip.classList.contains('open'); chip.classList.toggle('open',o); $('chipBtn').setAttribute('aria-expanded',String(o)); clearTimeout(chipT); if(o) chipT=setTimeout(closeChip,5000); });
$('cEject').addEventListener('click',()=>{ closeChip(); requestEject(); });
$('cReset').addEventListener('click',()=>{ closeChip(); resetGame(); });

/* ---------- マウスでディスクをつまんで差し込む ---------- */
const drag={on:false,id:null,swallow:false};
(function(){
  let sx=0,sy=0,id=null,rect=null,moved=false,off={x:0,y:0};
  shelvesDown();
  function shelvesDown(){
    document.addEventListener('pointerdown',e=>{
      if(e.pointerType==='touch'||e.button!==0||st.busy||st.phase==='in') return;
      const b=e.target.closest&&e.target.closest('.pick'); if(!b) return;
      id=b.parentNode.dataset.id; sx=e.clientX; sy=e.clientY; moved=false; rect=b.querySelector('.disk').getBoundingClientRect();
      off={x:e.clientX-rect.left,y:e.clientY-rect.top};
    });
  }
  document.addEventListener('pointermove',e=>{
    if(!id) return;
    if(!moved){ if(Math.hypot(e.clientX-sx,e.clientY-sy)<8) return; moved=true; drag.on=true; const d=byId[id];
      flyer.replaceChildren(diskEl(d)); flyer.style.width=rect.width+'px'; flyer.style.display='block'; flyer.style.transform=''; slots[id].classList.add('away'); bay.classList.add('drop'); sfx.pick(); }
    flyer.style.left=(e.clientX-off.x)+'px'; flyer.style.top=(e.clientY-off.y)+'px';
  });
  document.addEventListener('pointerup',async e=>{
    if(!id) return; const mine=id; id=null;
    if(!moved) return;
    drag.on=false; drag.swallow=true; setTimeout(()=>{ drag.swallow=false; },0); bay.classList.remove('drop');
    const fr=flyer.getBoundingClientRect(), br=bay.getBoundingClientRect(), S=st.S;
    const zone={l:br.left-30*S,r:br.right+30*S,t:br.top-20*S,b:br.bottom+30*S};
    const cx=e.clientX, cy=e.clientY;
    flyer.style.left='0px'; flyer.style.top='0px';
    const start={left:fr.left,top:fr.top,width:fr.width,height:fr.height};
    if(cx>=zone.l&&cx<=zone.r&&cy>=zone.t&&cy<=zone.b&&!st.busy){ slots[mine].classList.remove('away'); await insert(mine,start,true); }
    else { const d=byId[mine]; const to=slotRectOf(d); flyer.style.display='block'; await fly(flyer,start,{left:to.left,top:to.top,width:to.width,height:to.width},300,10); slots[mine].classList.remove('away'); hideFlyer(); }
  });
})();

/* ---------- 起動 ---------- */
$('stagebox').setAttribute('aria-label',TERM.model);
document.querySelectorAll('.mname,.badge').forEach(el=>{ if(el.firstChild&&el.firstChild.nodeType===3) el.firstChild.textContent=TERM.model; });
if(LINKED){
  document.title=TERM.title;
  // 保管庫でフロッピーを手に取ったら、ディスクケースを並べ直す（ドライブが空のときだけ）
  IzLink.on('data.changed',()=>{
    const nd=linkDisks();
    if(nd.map(d=>d.id).join()===DISKS.map(d=>d.id).join()||st.phase!=='empty'||st.busy) return;
    DISKS.splice(0,DISKS.length,...nd);
    Object.keys(byId).forEach(k=>delete byId[k]); DISKS.forEach((d,i)=>{ d.i=i; byId[d.id]=d; });
    shelves.A.replaceChildren(); shelves.B.replaceChildren(); Object.keys(slots).forEach(k=>delete slots[k]);
    buildCase(); if(!st.posting) showMenu(st.peek);
  });
}
buildCase(); syncSnd(); fit();
addEventListener('pageshow',e=>{ if(e.persisted) location.reload(); });
(function init(){
  let pid=null; try{ pid=sessionStorage.getItem('izTop.page'); }catch(e){}
  const d=pid&&byId[pid];
  if(d){
    /* ページ移動で動かす作品から戻ってきた: ディスクは入ったまま */
    st.phase='in'; st.disk=d; st.mode='page'; slots[d.id].classList.add('away');
    const bd=diskEl(d); bd.classList.add('bayd'); bay.appendChild(bd); lever.classList.add('closed');
    msgScreen([['A> DISK IN DRIVE A:','cy'],['',''],['PUSH RESET TO RUN AGAIN.',''],['PUSH EJECT TO REMOVE THE DISK.','yl']]);
    screenEl.classList.add('on'); return;
  }
  post();
})();
})();
</script>
