<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スタッフ｜izのおもちゃ箱</title>
<meta name="description" content="izのおもちゃ箱のスタッフ全11名">
<style>
:root{
  --ja:"Yu Gothic","游ゴシック","Hiragino Sans","Hiragino Kaku Gothic ProN","Meiryo","Noto Sans JP",sans-serif;
  --lat:Georgia,"Times New Roman","Liberation Serif",serif;
  --navy0:#070f20; --navy1:#0d1b38; --navy2:#14264a; --navy3:#1d3562;
  --gold:#e6c56a; --gold2:#c9a24a; --cream:#f6ecd2; --ink:#2a1f0e; --mute:#a9b4cc;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--navy0)}
body{margin:0;min-height:100vh;color:var(--cream);font:400 15px/1.8 var(--ja);letter-spacing:.02em;
  background:
    radial-gradient(1200px 600px at 50% -120px,rgba(230,197,106,.16),transparent 70%),
    radial-gradient(800px 500px at 100% 30%,rgba(70,110,200,.18),transparent 70%),
    radial-gradient(800px 500px at 0% 60%,rgba(70,110,200,.14),transparent 70%),
    repeating-conic-gradient(from 45deg at 50% 50%,rgba(255,255,255,.018) 0 25%,transparent 0 50%) 0 0/46px 46px,
    linear-gradient(180deg,var(--navy0),var(--navy1) 40%,var(--navy0));
  }
a{color:inherit}

/* ===== ヘッダー ===== */
header.hero{position:relative;text-align:center;padding:clamp(48px,9vw,96px) 20px 28px;overflow:hidden}
.crest{display:block;margin:0 auto 14px;width:64px;height:64px;color:var(--gold);filter:drop-shadow(0 0 10px rgba(230,197,106,.45))}
.eyebrow{font:700 12px var(--lat);letter-spacing:.5em;padding-left:.5em;color:var(--gold);text-transform:uppercase}
h1{margin:10px 0 0;font:800 clamp(40px,10vw,84px)/1.1 var(--ja);letter-spacing:.3em;padding-left:.3em;
  background:linear-gradient(100deg,#9c7a2a 0%,#f7e39a 22%,#e6c56a 40%,#fff3c4 52%,#e6c56a 64%,#b88f35 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s ease-in-out infinite alternate}
@keyframes shine{from{background-position:0% 0}to{background-position:100% 0}}
.hero .ja{margin:8px 0 0;font:800 clamp(16px,3.4vw,24px) var(--ja);letter-spacing:.5em;padding-left:.5em}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;margin:22px auto 16px;max-width:560px;color:var(--gold)}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.orn b{width:9px;height:9px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 12px rgba(230,197,106,.7)}
.lead-text{margin:0 auto;max-width:620px;text-wrap:balance;color:var(--mute);font-size:14px}
.counts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;margin:26px 0 0;padding:0;list-style:none}
.counts li{font:700 12px var(--lat);letter-spacing:.14em;color:var(--mute)}
.counts li b{display:block;font:700 30px/1.1 var(--lat);color:var(--cream);letter-spacing:.02em}

/* ===== 絞り込み ===== */
.filter{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px 14px;
  background:linear-gradient(180deg,rgba(7,15,32,.92),rgba(7,15,32,.72));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(230,197,106,.18)}
.chip{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;
  font:700 12.5px var(--lat);letter-spacing:.1em;color:var(--cream);background:rgba(255,255,255,.04);border:1px solid rgba(230,197,106,.3);transition:all .25s}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--gold));box-shadow:0 0 8px var(--c,var(--gold))}
.chip:hover{background:rgba(230,197,106,.12)}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.chip:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ===== 本文 ===== */
main{max-width:1180px;margin:0 auto;padding:30px 18px 40px}
.grp{margin:44px 0 0}
.grp>h2{display:flex;align-items:center;gap:16px;margin:0 0 22px;font:700 13px var(--lat);letter-spacing:.34em;color:var(--gold);text-transform:uppercase}
.grp>h2::before,.grp>h2::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(230,197,106,.55))}
.grp>h2::after{transform:scaleX(-1)}
.grp>h2 span{white-space:nowrap}
.grp>h2 small{display:block;margin-top:2px;font:700 12px var(--ja);letter-spacing:.3em;color:var(--mute);text-transform:none;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,320px));justify-content:center;gap:26px}

/* ===== カード ===== */
.card{--ac:var(--gold);position:relative;padding:16px 16px 20px;border-radius:16px;
  background:linear-gradient(180deg,var(--navy3),var(--navy1) 55%);
  border:1px solid rgba(230,197,106,.4);
  box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 5px var(--navy1),inset 0 0 0 6px rgba(230,197,106,.28);
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease,box-shadow .25s;
  opacity:0;translate:0 22px}
.js-on .card.in{opacity:1;translate:0 0;transition:transform .25s ease,box-shadow .25s,opacity .7s ease var(--d,0s),translate .7s ease var(--d,0s)}
.card:not(.js-wait){opacity:1;translate:0 0}
.card:hover{box-shadow:0 26px 54px rgba(0,0,0,.55),0 0 0 1px var(--ac),inset 0 0 0 5px var(--navy1),inset 0 0 0 6px rgba(230,197,106,.5)}
.card::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px 200px at var(--mx,50%) var(--my,20%),rgba(255,255,255,.12),transparent 70%)}
.card:hover::after{opacity:1}
.badge{position:absolute;z-index:3;top:20px;left:20px;display:inline-flex;align-items:center;gap:6px;padding:3px 11px 3px 9px;border-radius:999px;
  font:700 11px var(--lat);letter-spacing:.1em;color:#fff;background:rgba(7,15,32,.7);border:1px solid var(--ac);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac)}
.ph{position:relative;margin:8px 8px 0;aspect-ratio:1/1.1;overflow:hidden;
  border-radius:50% 50% 10px 10px/34% 34% 10px 10px;
  background:linear-gradient(160deg,#3b66b0,#27457d);
  box-shadow:0 0 0 3px var(--gold),0 0 0 6px var(--navy1),0 0 0 7px rgba(230,197,106,.6),0 10px 24px rgba(0,0,0,.5)}
.ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%;transition:transform .8s ease}
.card:hover .ph img{transform:scale(1.05)}
.plate{position:relative;z-index:2;margin:-30px -4px 0;padding:8px 22px 7px;text-align:center;color:var(--ink);
  background:linear-gradient(180deg,#fbf3dc,#eadbb4);
  clip-path:polygon(0 0,100% 0,calc(100% - 12px) 50%,100% 100%,0 100%,12px 50%);
  box-shadow:inset 0 2px 0 var(--gold2),inset 0 -2px 0 var(--gold2)}
.plate h3{margin:0;font:700 28px/1.15 var(--lat);letter-spacing:.06em}
.plate small{display:block;font:700 11px var(--ja);letter-spacing:.3em;padding-left:.3em;color:#6a5524}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:12px 0 0;border:1px solid rgba(230,197,106,.5);border-radius:6px;overflow:hidden;background:rgba(230,197,106,.35)}
.bar div{padding:6px 10px;background:#0a1530;min-width:0}
.bar .wide{grid-column:1/-1}
.bar dt{font:700 10.5px var(--lat);letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.bar dd{margin:0;font:600 13.5px/1.45 var(--ja);color:var(--cream)}
.bar dd.lat{font-family:var(--lat);font-size:14.5px}
.txt{margin:14px 4px 0}
.txt p{margin:0 0 10px;font-size:13.5px;line-height:1.85}
.txt p:last-child{margin-bottom:0}
.txt b{display:inline-block;margin-right:.6em;padding:0 8px;border-radius:3px;font:800 11px/1.8 var(--ja);letter-spacing:.14em;color:var(--ink);background:var(--gold)}
.txt .unset{color:var(--mute)}

/* リーダー（横長） */
.card.lead{grid-column:1/-1;max-width:880px;margin:0 auto;width:100%}
@media (min-width:820px){
  .card.lead{display:grid;grid-template-columns:320px 1fr;column-gap:26px;align-items:start;padding:22px}
  .card.lead .ph{grid-row:1/4;margin:8px 0 0}
  .card.lead .plate{grid-column:2;grid-row:1;margin:0 0 0;align-self:start}
  .card.lead .bar{grid-column:2;grid-row:2;margin-top:12px}
  .card.lead .txt{grid-column:2;grid-row:3;margin:14px 2px 0}
  .card.lead .badge{top:26px;left:26px}
}

footer{padding:30px 20px calc(36px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mute);font:italic 600 12px var(--lat);letter-spacing:.14em}
.empty{display:none;text-align:center;color:var(--mute);padding:40px 0}

@media (max-width:700px){
  .grid{grid-template-columns:minmax(0,340px)}
}
@media (max-width:480px){
  .filter{position:static}
  main{padding:20px 12px 30px}
  .grid{grid-template-columns:minmax(0,340px)}
  .grp>h2{letter-spacing:.2em;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  h1{animation:none}
  .card{transition:none;translate:0 0;opacity:1}
  .ph img{transition:none}
}
</style>
</head>
<body>

<header class="hero">
  <svg class="crest" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
    <path d="M32 4l22 8v18c0 14-9 24-22 30C19 54 10 44 10 30V12z" fill="rgba(230,197,106,.1)"/>
    <path d="M32 11l15 5.5v13c0 10-6.5 17-15 21.5C23.500 46.500 17 39.500 17 29.500v-13z"/>
    <path d="M32 20l3.200 6.500 7.200 1-5.200 5 1.300 7.200L32 36.300 25.500 39.700l1.300-7.200-5.200-5 7.200-1z" fill="currentColor" stroke="none"/>
  </svg>
  <h1>スタッフ</h1>
  <div class="orn"><i></i><b></b><i></i></div>
  <p class="lead-text">企画兼監督のもとに集まった、工房のスタッフ全11名。うち2名は、依頼ごとに仕事を出す外注です。</p>
  <ul class="counts" id="counts"></ul>
</header>

<nav class="filter" id="filter" aria-label="AIで絞り込む"></nav>

<main id="main"></main>

<footer>iz no omochabako</footer>

<script>
// ===== スタッフ名簿: 追加・変更はここだけ直す（記載は staff-spec に合わせる） =====
const AI={
  claude:{name:'Claude',c:'#e08a63'},
  gemini:{name:'Gemini',c:'#7f9bff'},
  chatgpt:{name:'ChatGPT',c:'#4fc3a1'},
  codex:{name:'ChatGPT Codex',c:'#b9c2d6'}
};
const GROUPS=[
  {id:'lead',en:'Production Lead',ja:'制作リーダー'},
  {id:'impl',en:'Implementation & Documentation',ja:'実装・文書作成'},
  {id:'music',en:'Music & Sound Effects',ja:'音楽・効果音'},
  {id:'design',en:'Design & Illustration',ja:'設計・イラスト'},
  {id:'ext',en:'External Implementation Contractor',ja:'実装（外注）'}
];
const STAFF=[
 {g:'lead',ai:'claude',img:'nora',name:'Nora',kana:'ノラ',code:'なし',country:'ノルウェー',age:'34',role:'制作リーダー',
  work:'企画を仕様にする。作業担当への指示。納品物の受け入れ検査と main への統合。HANDOFF.md とマスターの管理。バージョン（upd・ver）管理。',
  trait:'静かで落ち着いている。自然や静けさが好きで、大げさに盛り上がらない。'},
 {g:'impl',ai:'claude',img:'tessa',name:'Tessa',kana:'テッサ',code:'iz3',country:'イタリア',age:'29',role:'実装・文書作成',
  work:'担当作品の改修（実装）。仕様書・説明文などの文章。',
  trait:'作家肌のコーダー。言葉選びと文体、書式の作法にこだわり、コードの書き方にも同じ几帳面さを持ち込む。伝統的な言い回しを重んじる。'},
 {g:'impl',ai:'claude',img:'sofia',name:'Sofia',kana:'ソフィア',code:'ap',country:'スウェーデン',age:'28',role:'実装・文書作成',
  work:'担当作品の改修（実装）。文書作成。',
  trait:'協力的で実用的。無駄な装飾を好まず、「ちょうどいい」を大事にする。文章も実用本位で、要点から短く書く。'},
 {g:'music',ai:'gemini',img:'elena',name:'Elena',kana:'エレーナ',code:'iz3',country:'スペイン',age:'27',role:'音楽・効果音',
  work:'音楽・効果音の制作。',
  trait:'ラテンの陽気さを持つ芸術肌で、感情が豊か。感情を揺さぶる曲づくりが得意。'},
 {g:'music',ai:'gemini',img:'olivia',name:'Olivia',kana:'オリヴィア',code:'iz4',country:'イギリス',age:'29',role:'音楽・効果音',
  work:'音楽・効果音の制作。',
  trait:'礼儀正しく控えめ。皮肉まじりのユーモアがあり、紅茶が好き。好きな音楽は激しく重いロック。'},
 {g:'design',ai:'chatgpt',img:'giulia',name:'Giulia',kana:'ジュリア',code:'iz4',country:'アルゼンチン',age:'28',role:'設計・イラスト',
  work:'設計の相談、イラスト制作。',
  trait:'情熱的で行動派。思い立ったらすぐ描き始めたい。'},
 {g:'design',ai:'chatgpt',img:'chiara',name:'Chiara',kana:'キアラ',code:'iz3',country:'フランス',age:'24',role:'設計・イラスト',
  work:'設計の相談、イラスト制作。',
  trait:'社交的でおしゃべり。色やファッションに敏感で、雰囲気を大事にする。'},
 {g:'design',ai:'chatgpt',img:'astrid',name:'Astrid',kana:'アストリッド',code:'ap',country:'スウェーデン',age:'26',role:'設計・イラスト',
  work:'設計の相談、イラスト制作。',
  look:'髪型はポニーテール。',
  trait:'論理的で整理好き。北欧デザインのような簡潔さを好む。'},
 {g:'design',ai:'chatgpt',img:'priya',name:'Priya',kana:'プリヤ',code:'di',country:'インド',age:'22',role:'設計・イラスト',
  work:'設計の相談、イラスト制作。',
  trait:'温かく、仲間を大事にする。祭りや物語の話が好き。'},
 {g:'ext',ai:'codex',img:'dizz',name:'dizz',kana:'ディズ',code:'未設定',country:'未設定',age:'未設定',role:'実装（外注）',
  stand:'外注。工房の正規スタッフとは別枠で、依頼ごとに仕事を出す。',
  work:'依頼された仕様の実装。納品はリーダーが検査してから main に入れる（動作確認・差分確認）。',
  trait:null},
 {g:'ext',ai:'codex',img:'elizabeth',name:'Elizabeth',kana:'エリザベス',code:'未設定',country:'未設定',age:'未設定',role:'実装（外注）',
  stand:'外注。工房の正規スタッフとは別枠で、依頼ごとに仕事を出す。',
  work:'依頼された仕様の実装。納品はリーダーが検査してから main に入れる（動作確認・差分確認）。',
  trait:null}
];

const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const main=$('#main');
let delay=0;

function card(p){
  const a=AI[p.ai];
  const unset=v=>v==='未設定'?' class="unset"':'';
  const ps=[];
  if(p.stand) ps.push(`<p><b>立場</b>${esc(p.stand)}</p>`);
  ps.push(`<p><b>業務</b>${esc(p.work)}</p>`);
  if(p.look) ps.push(`<p><b>見た目</b>${esc(p.look)}</p>`);
  ps.push(p.trait?`<p><b>性格</b>${esc(p.trait)}</p>`:`<p><b>性格</b><span class="unset">未設定</span></p>`);
  const el=document.createElement('article');
  el.className='card js-wait'+(p.g==='lead'?' lead':'');
  el.dataset.ai=p.ai;
  el.style.setProperty('--ac',a.c);
  el.style.setProperty('--d',(delay=(delay+.06)%.36).toFixed(2)+'s');
  el.innerHTML=`
    <span class="badge"><i></i>${esc(a.name)}</span>
    <div class="ph"><img src="img/${p.img}.jpg" alt="${esc(p.name)}の顔写真" width="240" height="260" loading="lazy" decoding="async"></div>
    <div class="plate"><h3>${esc(p.name)}</h3><small>${esc(p.kana)}</small></div>
    <dl class="bar">
      <div class="wide"><dt>Role</dt><dd>${esc(p.role)}</dd></div>
      <div><dt>Surname Code</dt><dd class="lat"${unset(p.code)}>${esc(p.code)}</dd></div>
      <div><dt>AI</dt><dd class="lat">${esc(a.name)}</dd></div>
      <div><dt>出身国</dt><dd${unset(p.country)}>${esc(p.country)}</dd></div>
      <div><dt>年齢</dt><dd${unset(p.age)}>${esc(p.age)}${/^\d+$/.test(p.age)?' 歳':''}</dd></div>
    </dl>
    <div class="txt">${ps.join('')}</div>`;
  return el;
}

GROUPS.forEach(g=>{
  const members=STAFF.filter(s=>s.g===g.id); if(!members.length) return;
  const sec=document.createElement('section'); sec.className='grp'; sec.dataset.g=g.id;
  sec.innerHTML=`<h2><span>${esc(g.en)}<small>${esc(g.ja)}</small></span></h2>`;
  const grid=document.createElement('div'); grid.className='grid';
  members.forEach(p=>grid.appendChild(card(p)));
  sec.appendChild(grid); main.appendChild(sec);
});
main.insertAdjacentHTML('beforeend','<p class="empty" id="empty">該当するスタッフはいません。</p>');

// 人数
const cnt={}; STAFF.forEach(s=>cnt[s.ai]=(cnt[s.ai]||0)+1);
$('#counts').innerHTML=`<li><b>${STAFF.length}</b>STAFF</li>`+Object.keys(AI).map(k=>`<li><b>${cnt[k]||0}</b>${esc(AI[k].name)}</li>`).join('');

// 絞り込み
const fl=$('#filter');
fl.innerHTML=`<button class="chip" type="button" data-k="all" aria-pressed="true"><i></i>ALL</button>`+
  Object.keys(AI).map(k=>`<button class="chip" type="button" data-k="${k}" aria-pressed="false" style="--c:${AI[k].c}"><i></i>${esc(AI[k].name)}</button>`).join('');
fl.addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  const k=b.dataset.k;
  fl.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b?'true':'false'));
  let shown=0;
  document.querySelectorAll('.grp').forEach(sec=>{
    let n=0;
    sec.querySelectorAll('.card').forEach(c=>{ const ok=(k==='all'||c.dataset.ai===k); c.hidden=!ok; if(ok) n++; });
    sec.hidden=n===0; shown+=n;
  });
  $('#empty').style.display=shown?'none':'block';
});

// 出現アニメ（JSが動かない・低速でも内容は見える）
document.documentElement.classList.add('js-on');
const cards=[...document.querySelectorAll('.card')];
if('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion:reduce)').matches){
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),{rootMargin:'0px 0px -6% 0px',threshold:.08});
  cards.forEach(c=>io.observe(c));
}else{ cards.forEach(c=>{ c.classList.remove('js-wait'); }); }

// カードの傾き（マウスのある端末だけ）
if(matchMedia('(hover:hover) and (pointer:fine)').matches && !matchMedia('(prefers-reduced-motion:reduce)').matches){
  cards.forEach(c=>{
    c.addEventListener('pointermove',e=>{
      const r=c.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
      c.style.setProperty('--ry',((x-.5)*7).toFixed(2)+'deg');
      c.style.setProperty('--rx',((.5-y)*7).toFixed(2)+'deg');
      c.style.setProperty('--mx',(x*100).toFixed(1)+'%');
      c.style.setProperty('--my',(y*100).toFixed(1)+'%');
    });
    c.addEventListener('pointerleave',()=>{ c.style.setProperty('--rx','0deg'); c.style.setProperty('--ry','0deg'); });
  });
}
</script>
</body>
</html>
