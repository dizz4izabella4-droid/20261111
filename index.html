<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020604">
<title>Game Launcher</title>
<style>
/* アプリ選択画面。作品を増やすときは、下の <script> にある APPS に1件足すだけでよい */
:root{
  --bg:#020604; --win:#030a06; --bar:#0a1a10; --line:#1b3a26;
  --fg:#b8d8c0; --dim:#4f7d5d; --ok:#d8ffe2; --accent:#22e36a; --gold:#d8f27a; --cyan:#3fd0c0;
  --mono: Consolas, "Cascadia Mono", "MS Gothic", "Osaka-Mono", "Noto Sans Mono CJK JP", "Hiragino Sans", Meiryo, ui-monospace, monospace;
  --ja: "Yu Gothic UI","游ゴシック","Hiragino Sans","ヒラギノ角ゴシック",Meiryo,"Noto Sans JP",sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,rgba(57,255,136,.1),transparent 55%),var(--bg);color:var(--fg);font-family:var(--mono);
  padding:max(16px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto}
.neon{height:4px;border-radius:4px;margin:0 3%;background:#dcffe9;box-shadow:0 0 3px #fff,0 0 9px #39ff88,0 0 22px #39ff88,0 0 46px rgba(57,255,136,.6)}
.screen{position:relative;margin:14px 0;border:1px solid var(--line);border-radius:14px/12px;background:#010402;overflow:hidden;
  box-shadow:inset 0 0 60px rgba(0,0,0,.9),0 0 30px rgba(57,255,136,.08)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%)}
.bar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:linear-gradient(90deg,#0d2416,var(--bar));border-bottom:1px solid rgba(57,255,136,.16);font-size:12px;color:#c6e6cf}
.bar .ico{width:16px;height:12px;border:1px solid #4f7d5d;font-size:9px;line-height:10px;text-align:center;color:#a8d8b6;flex:none}
.bar .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{padding:16px 18px 20px;text-shadow:0 0 4px rgba(90,255,140,.25)}
.cmd{font-size:13px;color:var(--fg);margin:0 0 4px;white-space:pre-wrap}
.cmd::after{content:"_";animation:blink 1s steps(1) infinite}
.cmd.done::after{content:none}
.title{margin:10px 0 2px;font-size:clamp(20px,5vw,30px);letter-spacing:.2em;color:var(--ok);text-shadow:0 0 12px rgba(57,255,136,.5)}
.sub{font:12px var(--ja);color:var(--dim);margin-bottom:16px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.app{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 14px;padding:12px 14px;border:1px solid var(--line);background:#03100a;
  color:inherit;text-decoration:none;opacity:0;transform:translateY(4px);transition:border-color .15s,background .15s,box-shadow .15s}
.app.show{opacity:1;transform:none;transition:opacity .25s,transform .25s,border-color .15s,background .15s,box-shadow .15s}
.app .no{grid-row:1/3;font-size:12px;color:var(--dim);align-self:start;padding-top:2px}
.app .nm{font-size:17px;letter-spacing:.08em;color:var(--ok);min-width:0}
.app .ja{font:13px var(--ja);color:#9fd6a8;margin-left:.6em;letter-spacing:.02em}
.app .ds{grid-column:2/4;font:12px/1.6 var(--ja);color:#6f9a7c}
.app .dv{display:flex;gap:6px;justify-self:end;align-self:start}
.tag{font-size:10px;letter-spacing:.12em;padding:2px 6px;border:1px solid #2f6b43;color:#7fa98a;white-space:nowrap}
.tag.rec{border-color:var(--gold);color:var(--gold)}
.app.sel,.app:hover,.app:focus-visible{border-color:var(--accent);background:#0a2a16;box-shadow:0 0 16px rgba(34,227,106,.25);outline:none}
.app.sel .no::before{content:"> ";color:var(--accent)}
.foot{margin-top:16px;font-size:11px;color:#2f6b43;letter-spacing:.1em;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@keyframes blink{50%{opacity:0}}
@media (max-width:520px){
  .body{padding:12px 12px 16px}
  .app{grid-template-columns:1fr auto;padding:12px}
  .app .no{display:none}
  .app .nm{font-size:15px}
  .app .ja{display:block;margin:2px 0 0}
  .app .ds{grid-column:1/3}
  .foot .keys{display:none}
}
@media (prefers-reduced-motion:reduce){.cmd::after{animation:none}.app,.app.show{transition:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="neon"></div>
  <div class="screen">
    <div class="bar"><span class="ico">C:\</span><span class="t">Command Prompt - launcher.exe</span></div>
    <div class="body">
      <p class="cmd" id="cmd"></p>
      <div class="title">SELECT APPLICATION</div>
      <div class="sub">遊ぶアプリを選んでください</div>
      <ul class="list" id="list"></ul>
      <div class="foot"><span id="count"></span><span class="keys">&uarr;&darr; select &nbsp; ENTER launch</span></div>
    </div>
  </div>
  <div class="neon"></div>
</div>
<script>
// ===== 作品の一覧 =====
// 新しい作品を載せるとき: リポジトリに作品のフォルダ（中に index.html）を作り、ここに1件足す
//   path   … フォルダ名（末尾に / を付ける）
//   name   … 英語の表示名      ja   … 日本語の名前
//   desc   … ひとこと説明       for  … 'pc' / 'mobile' / 'both'（どの端末向けか）
const APPS=[
  {path:'typing-pc/', name:'CMD TYPING', ja:'タイピング PC版', for:'pc',
   desc:'ハッキング攻撃を英単語の入力で防御・追跡・反撃する。キーボードで入力'},
  {path:'typing-mobile/', name:'CMD TYPING MOBILE', ja:'タイピング スマホ版', for:'mobile',
   desc:'PC版と同じ筋立てを縦画面に合わせたもの。漢字・カタカナの語句を、ひらがなのフリック入力で打つ'},
  {path:'tori-to-kemono/', name:'BIRDS VS BEASTS', ja:'鳥と獣の戦い', for:'mobile',
   desc:'スマホを机に置いて2人で向かい合う対戦ゲーム。コンピュータとも対戦できる'},
];

const $=id=>document.getElementById(id);
const touch=matchMedia('(pointer:coarse)').matches;
const LABEL={pc:'PC',mobile:'SMARTPHONE'};
const list=$('list');
let sel=0;
const items=APPS.map((a,i)=>{
  const li=document.createElement('li'), el=document.createElement('a');
  el.className='app'; el.href=a.path;
  const no=document.createElement('span'); no.className='no'; no.textContent=String(i+1).padStart(2,'0');
  const nm=document.createElement('span'); nm.className='nm'; nm.textContent=a.name;
  const ja=document.createElement('span'); ja.className='ja'; ja.textContent=a.ja; nm.appendChild(ja);
  const dv=document.createElement('span'); dv.className='dv';
  (a.for==='both'?['pc','mobile']:[a.for]).forEach(f=>{ const t=document.createElement('span'); t.className='tag'; t.textContent=LABEL[f];
    if(f===(touch?'mobile':'pc')&&a.for!=='both') t.classList.add('rec'); dv.appendChild(t); });
  const ds=document.createElement('span'); ds.className='ds'; ds.textContent=a.desc;
  el.append(no,nm,dv,ds);
  el.addEventListener('mouseenter',()=>{ sel=i; mark(); });
  li.appendChild(el); list.appendChild(li); return el;
});
// 使っている端末に合う作品を最初に選んでおく
sel=Math.max(0,APPS.findIndex(a=>a.for===(touch?'mobile':'pc')||a.for==='both'));
function mark(){ items.forEach((el,i)=>el.classList.toggle('sel',i===sel)); }
$('count').textContent=APPS.length+' APP(S) FOUND';

// 起動の演出: コマンドを打ち込んでから一覧を順に出す
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CMD='C:\\> dir /apps';
let k=0;
(function typeCmd(){
  $('cmd').textContent=CMD.slice(0,k);
  if(k<CMD.length&&!reduce){ k++; setTimeout(typeCmd,40); return; }
  $('cmd').textContent=CMD; $('cmd').classList.add('done');
  items.forEach((el,i)=>setTimeout(()=>el.classList.add('show'),reduce?0:120+i*110));
  mark();
})();

document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); sel=(sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length; mark(); items[sel].focus({preventScroll:false}); }
  else if(e.key==='Enter'&&document.activeElement===document.body){ e.preventDefault(); location.href=APPS[sel].path; }
});
</script>
</body>
</html>
