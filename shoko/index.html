function makeAction(text,active,callback){const b=node('button','tool-btn'+(active?' pressed':''),text);b.addEventListener('click',callback);return b}
let openBookId='',openBookPage=0;
function renderReader(){const wrap=el('readerContent');wrap.replaceChildren();if(state.view==='desk'){renderDesk();return}const d=safeDoc();const frame=node('div','reader-frame');const top=node('div','reader-top');top.append(node('span','',d?'DOCUMENT '+d.id:'DOCUMENT READER'));const acts=node('div','reader-actions');if(d){acts.append(makeAction(state.stars.has(d.id)?'しおりを外す':'しおり',state.stars.has(d.id),()=>{state.stars.has(d.id)?state.stars.delete(d.id):state.stars.add(d.id);store();renderReader();renderCatalog()}));acts.append(makeAction(state.desk.has(d.id)?'机から戻す':'机に置く',state.desk.has(d.id),()=>{state.desk.has(d.id)?state.desk.delete(d.id):state.desk.add(d.id);store();updateDeskCount();renderReader()}))}top.append(acts);frame.append(top);
 const paper=node('article','paper');if(!d){const empty=node('div','empty-paper');const t=node('div');t.append(node('div','glyph','▤'),node('h2','', '資料を選んでください'),node('p','',currentShelf().folderIds.length?'左の資料棚から箱を開き、\n閲覧する資料を選びます。':'この棚にはまだ書類がありません。'));empty.append(t);paper.append(empty)}else{const ph=node('div','paper-heading'),k=node('div','paper-kicker');k.append(node('span','', 'DOCUMENT / '+d.id),node('span','', 'RECORD COPY'));const h=node('h1','',d.title),meta=node('div','paper-meta');[['整理番号',d.id],['作成年月日',d.date.replaceAll('-',' / ')],['作成部署',d.issuer],['保管箱',state.folder]].forEach(([label,val])=>{const div=node('div');div.append(node('strong','',label),document.createTextNode(val));meta.append(div)});ph.append(k,h,meta);paper.append(ph);if(d.pages&&openBookId!==d.id){openBookId=d.id;openBookPage=0;}
const displayPage=d.pages?d.pages[openBookPage]:d.body;
const body=node('div','paper-body');displayPage.split('\n').forEach(p=>{body.append(node('p','',p))});paper.append(body);
if(d.pages){const nav=node('nav','book-pages');nav.setAttribute('aria-label','簿冊のページ');
 const prev=node('button','tool-btn','前のページ');prev.disabled=openBookPage===0;
 prev.addEventListener('click',()=>{openBookPage--;renderReader();el('readerContent').parentElement.scrollTop=0;});
 const label=node('span','book-pages-count',(openBookPage+1)+' / '+d.pages.length+' 頁');
 const next=node('button','tool-btn','次のページ');next.disabled=openBookPage===d.pages.length-1;
 next.addEventListener('click',()=>{openBookPage++;renderReader();el('readerContent').parentElement.scrollTop=0;});
 nav.append(prev,label,next);paper.append(nav);
}const foot=node('div','paper-footer');foot.append(node('span','','PRIVATE ARCHIVES / TEST'),node('span','','— '+d.id+' —'));paper.append(foot);paper.append(node('div','stamp','保管写'));}frame.append(paper);
 if(d){const note=node('div','note-block'),nt=node('div','note-title');nt.append(node('span','','個人メモ'),node('small','','この資料にのみ保存'));note.append(nt);const ta=node('textarea');ta.placeholder='気になったことを自由に記録';ta.value=state.notes[d.id]||'';ta.setAttribute('aria-label','この資料のメモ');ta.addEventListener('input',()=>{state.notes[d.id]=ta.value;store()});note.append(ta);frame.append(note)}wrap.append(frame)}
function renderDesk(){const wrap=el('readerContent');wrap.replaceChildren();const page=node('div','desk-page');page.append(node('div','eyebrow','WORK TABLE / PERSONAL NOTES'),node('h2','desk-title','作業机'),node('p','desk-help','調べながら手元に置いた資料と、自分のメモ。\nこの画面は推理の正誤を判定しません。'));const ids=[...state.desk].filter(byId);if(!ids.length)page.append(node('p','desk-empty','まだ資料はありません。閲覧画面から「机に置く」で追加できます。'));ids.forEach(id=>{const d=byId(id),card=node('div','desk-card'),icon=node('div','file-icon'),t=node('div'),h=node('h3','',d.title);t.append(node('div','item-top',d.id),h,node('p','',d.date+' / '+d.issuer));const spacer=node('div','spacer');const open=node('button','','開く');open.addEventListener('click',()=>{state.view='archive';state.shelf=(SHELVES.find(s=>s.folderIds.includes(d.folder))||SHELVES[0]).id;state.folder=d.folder;state.active=id;state.read.add(id);store();renderAll();switchScreen('reader')});const remove=node('button','','戻す');remove.addEventListener('click',()=>{state.desk.delete(id);store();renderDesk();updateDeskCount()});card.append(icon,t,spacer,open,remove);page.append(card)});const n=node('div','desk-notes');n.append(node('h3','','覚え書き'));const ta=node('textarea');ta.value=state.general;ta.placeholder='仮説、資料番号、疑問点など';ta.setAttribute('aria-label','全体メモ');ta.addEventListener('input',()=>{state.general=ta.value;store()});n.append(ta);const footer=node('div');footer.style.cssText='display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin-top:15px';const save=node('button','tool-btn','メモと机を保存');save.addEventListener('click',()=>{const data={version:1,exportedAt:new Date().toISOString(),desk:[...state.desk],stars:[...state.stars],read:[...state.read],notes:state.notes,general:state.general};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='shoko-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});footer.append(save,node('span','copy-status','メモはこのブラウザにも自動保存'));n.append(footer);page.append(n);wrap.append(page)}
function updateDeskCount(){el('deskCount').textContent=String(state.desk.size)}
function renderAll(){renderShelf();renderCatalog();renderReader();updateDeskCount();el('showArchive').classList.toggle('active',state.view==='archive');el('showDesk').classList.toggle('active',state.view==='desk')}
function viewDesk(toDesk){state.view=toDesk?'desk':'archive';renderAll();if(toDesk)switchScreen('desk');else switchScreen(innerWidth<=850?'shelf':'catalog')}
el('showArchive').addEventListener('click',()=>viewDesk(false));el('showDesk').addEventListener('click',()=>viewDesk(true));el('order').addEventListener('change',e=>{state.sort=e.target.value;renderCatalog()});document.querySelectorAll('.mobile-nav button').forEach(b=>b.addEventListener('click',()=>switchScreen(b.dataset.target)));document.addEventListener('keydown',e=>{if(e.key==='Escape' && innerWidth<=850 && state.screen==='reader'){switchScreen('catalog')}});state.active=(byId(state.active)&&currentShelf().folderIds.includes(byId(state.active).folder))?state.active:'';renderAll();if(innerWidth>850)el('workspace').dataset.screen='reader';
</script>
<script id="shoko-link-data">
// 連携アプリ（link/）の中で開いたときだけ有効。単体の書庫には何も足さない。
// X-01 は連携の試作用ダミー事件。本物の事件（館の連続殺人）ができたら差し替える。
(function(){
 if(!(window.IzLink&&IzLink.linked))return;
 const CASE={id:'X-01',name:'テスト事件（試作）',sub:'再捜査・ダミー資料'};
 const DOCS=[
  ['1987-02-15','初動報告：山荘での死亡事案','所轄署・刑事課','二月十五日午前七時十分ごろ、山荘「白樺荘」の管理人から通報があった。宿泊客の男性一名が食堂で倒れているとのこと。\n前夜からの降雪で県道は不通となっており、現場到着は午前九時四十分となった。\n\n到着時、食堂の暖炉の火は消えていた。窓は内側から施錠されていた。\n宿泊客は男性三名、女性二名、ほかに管理人夫妻。全員が館内にいたと申し立てている。'],
  ['1987-02-15','聴取：第一発見者（管理人の妻）','所轄署・刑事課','朝食の支度のため午前六時半ごろ食堂に入ったが、そのときは暗くて気づかなかった。\n午前七時ごろ、カーテンを開けたところで床に倒れている人を見つけた。\n\n前夜は午後十一時に台所の火を落として休んだ。夜中に一度、廊下を歩く足音を聞いた気がするが、時刻は分からない。\n食堂の鍵は夫が管理しており、自分は持っていない。'],
  ['1987-02-15','写真台帳：食堂の見取図','鑑識係','写真一　食堂全景（入口から）\n写真二　暖炉前の床面。灰が掃き寄せられた跡あり\n写真三　窓の掛け金。内側から掛かった状態\n写真四　テーブル上のグラス二客。うち一客は洗われている\n\n備考：暖炉の灰の量は、一晩焚いた量としては少ない。'],
  ['1987-02-16','聴取：宿泊客（会社員の男性）','所轄署・刑事課','前夜は午後十時ごろまで食堂で被害者と酒を飲んでいた。その後は自室に戻り、朝まで出ていない。\n被害者とは仕事上の付き合いで、この山荘に誘ったのは被害者のほうだった。\n\n夜中に停電があったと思う。枕元の時計が止まっていたが、何時に止まったかは見ていない。']
 ];
 FOLDERS.push(CASE);
 SHELVES.unshift({id:'reinvest',code:'00',name:'再捜査',sub:'再捜査の対象となった事件',folderIds:[CASE.id]});
 DOCS.forEach((d,i)=>docs.push({folder:CASE.id,date:d[0],title:d[1],issuer:d[2],body:d[3],id:CASE.id+'-'+String(i+1).padStart(3,'0'),type:/写真|見取図/.test(d[1])?'photo':'paper'}));
 window.SHOKO_LINK_CASES={[CASE.id]:CASE.name};
})();

<script id="shoko-link-ui">
// 連携アプリの中での追加機能：事件印、「この事件を開く」、ライン→ボード、フロッピー
(function(){
 if(!(window.IzLink&&IzLink.linked))return;
 const CASES=window.SHOKO_LINK_CASES||{};
 const isCase=f=>Object.prototype.hasOwnProperty.call(CASES,f);
 const st=document.createElement('style');
 st.textContent=
  '.drawer.izl-case{position:relative;box-shadow:inset 6px 0 0 #b3261e}'+
  '.izl-stamp{position:absolute;right:8px;top:6px;border:2px solid #b3261e;color:#c8392e;font:700 10px/1.3 sans-serif;padding:1px 4px;transform:rotate(-8deg);letter-spacing:.1em;background:#f4ead6cc}'+
  '.izl-case-box{margin:0 0 12px;padding:12px 14px;border:1px solid #b3261e88;border-left:6px solid #b3261e;background:#2a1c18;color:#f1e6d0;font:13px/1.6 sans-serif}'+
  '.izl-case-box .izl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}'+
  '.izl-case-box .izl-row+.izl-row{margin-top:10px;padding-top:10px;border-top:1px solid #ffffff22}'+
  '.izl-case-box button{background:#8c2a1f;color:#fff3e0;border:0;padding:9px 14px;font:inherit;cursor:pointer}'+
  '.izl-case-box button:disabled{opacity:.5}'+
  '.izl-case-box small{opacity:.7}'+
  '.izl-floppy{display:inline-block;width:22px;height:22px;background:#222;border:2px solid #555;border-radius:2px;position:relative;vertical-align:middle;margin-right:8px}'+
  '.izl-floppy:after{content:"";position:absolute;left:4px;right:4px;top:0;height:7px;background:#aaa}'+
  '.paper.izl-paper{position:relative}'+
  '.izl-paper-stamp{position:absolute;right:28px;top:22px;border:3px solid #b3261e;color:#b3261e;font:700 18px/1.2 serif;padding:3px 10px;transform:rotate(-10deg);letter-spacing:.2em;opacity:.8;pointer-events:none}';
 document.head.append(st);

 // タイトル画面を省いて資料室から始める
 document.body.dataset.shokoStage='room';
 const backBtn=document.querySelector('.shoko-back');if(backBtn)backBtn.style.display='none';

 // ラインを引いたら、その資料ごとボードへ（通知はしない）
 ShokoLines.onAdd(({doc,page,line,replaced})=>{
  if(!isCase(doc.folder))return;
  IzLink.emit('mark.added',{caseId:doc.folder,caseTitle:CASES[doc.folder],docId:doc.id,title:doc.title,
   quote:line.quote,page,lineId:line.id,replaced:(replaced||[]).map(x=>x.id)});
 });

 const pS=renderShelf;
 renderShelf=function(){
  pS();
  document.querySelectorAll('#folderDrawers .drawer').forEach(b=>{
   const code=b.querySelector('.drawer-code');
   if(code&&isCase(code.textContent)){b.classList.add('izl-case');if(!b.querySelector('.izl-stamp'))b.append(node('span','izl-stamp','再捜査'))}
  });
 };

 const pC=renderCatalog;
 renderCatalog=function(){
  pC();
  const f=state.folder;if(!isCase(f))return;
  const d=IzLink.get(f),cur=IzLink.caseId()===f,box=node('div','izl-case-box');
  const r1=node('div','izl-row'),t1=node('div');
  t1.append(node('strong','',CASES[f]),document.createElement('br'),node('small','',cur?'捜査中の事件':'再捜査の対象'));
  const open=node('button','','この事件を開く');open.type='button';
  open.addEventListener('click',()=>IzLink.emit('case.selected',{caseId:f,title:CASES[f]}));
  r1.append(t1,open);box.append(r1);
  const fl=d.floppies[f];
  if(fl&&fl.found){
   const r2=node('div','izl-row'),t2=node('div');
   t2.append(node('span','izl-floppy'),document.createTextNode('専用フロッピー（'+IzLink.brand()+'用）'));
   const take=node('button','',fl.taken?'手に取った':'手に取る');take.type='button';take.disabled=!!fl.taken;
   take.addEventListener('click',()=>IzLink.update(x=>{x.floppies[f].taken=true},f));
   r2.append(t2,take);box.append(r2);
  }
  el('fileList').prepend(box);
 };

 const pR=renderReader;
 renderReader=function(){
  pR();
  const doc=byId(state.active);
  if(state.view!=='archive'||!doc||!isCase(doc.folder))return;
  const paper=document.querySelector('#readerContent .paper');
  if(paper){paper.classList.add('izl-paper');paper.append(node('div','izl-paper-stamp','再捜査'))}
 };

 IzLink.on('data.changed',p=>{if(isCase(state.folder)&&(!p||!p.caseId||p.caseId===state.folder))renderCatalog()});
 IzLink.onVisibility(()=>{});
 renderAll();
})();
</script>
