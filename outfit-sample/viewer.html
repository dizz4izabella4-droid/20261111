<title>衣装の試着室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* layout: stage fills the screen, wardrobe panel at the right (below on phones) */
:root{--bg:#eef0ec;--panel:#fbfbf8;--fg:#1e2622;--muted:#5b665f;--line:#cdd3cc;--accent:#7d2136;--on-accent:#fff6ee;--stage-a:#e8ebe6;--stage-b:#bcc5bd;
--display:"Shippori Mincho",serif;--body:"Zen Kaku Gothic New",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--panel:#18201c;--fg:#e8ece6;--muted:#9eaaa2;--line:#2f3b34;--accent:#d9a94e;--on-accent:#1b1408;--stage-a:#37443d;--stage-b:#121815;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--panel:#18201c;--fg:#e8ece6;--muted:#9eaaa2;--line:#2f3b34;--accent:#d9a94e;--on-accent:#1b1408;--stage-a:#37443d;--stage-b:#121815;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.7 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{box-sizing:border-box;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding-block:16px}
#stage{position:relative;min-height:0;min-width:0;background:radial-gradient(ellipse at 50% 35%,var(--stage-a),var(--stage-b));border:1px solid var(--line);border-radius:6px;overflow:hidden}
#stage canvas{position:absolute;inset:0;touch-action:none}
#msg{position:absolute;inset:auto 0 12px;text-align:center;color:var(--muted)}
aside{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;overflow:auto;min-height:0}
h1{font:700 22px/1.4 var(--display);margin:0 0 4px}
h2{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:16px 0 8px}
p{margin:0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:13px}
@media (max-width:720px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.5fr) minmax(0,1fr);gap:10px;padding-block:10px}}
</style>
<div class="app">
<div id="stage"><div id="msg">衣装を読み込んでいます…</div></div>
<aside>
<h1>衣装の試着室</h1>
<p>素体にサンプル衣装を着せた状態です。ドラッグで回転、ピンチかホイールで拡大できます。</p>
<h2>着ているもの</h2><div class="row" id="parts"></div>
<h2>ポーズ</h2><div class="row" id="poses"></div>
<h2>向き</h2><div class="row" id="views"></div>
<h2>表示</h2><div class="row" id="opts"></div>
<p class="note">服 18,558 頂点・35,516 三角形。身長 153.3 cm の素体に合わせています。<br>服は骨の動きに付いて動くだけで、布の揺れの計算はまだ入っていません。脚や肘を大きく曲げると、素体が服を突き抜けます。</p>
</aside>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
<script type="module">
const msg = document.getElementById('msg');
try {
const THREE = await import('three'); const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'); const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); stage.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.add(new THREE.HemisphereLight(0xffffff, 0x606070, 1.7));
const d1 = new THREE.DirectionalLight(0xffffff, 1.8); d1.position.set(1.5, 2.5, 2); const d2 = new THREE.DirectionalLight(0xcfe0ff, 0.9); d2.position.set(-2, 1.5, -2); scene.add(d1, d2);
const floor = new THREE.Mesh(new THREE.CircleGeometry(0.95, 64), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.1 })); floor.rotation.x = -Math.PI/2; scene.add(floor);
const camera = new THREE.PerspectiveCamera(26, 1, 0.05, 40), controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.78, 0); controls.enableDamping = true; controls.minDistance = 0.6; controls.maxDistance = 9;
let dist = 4, az = 28;
const aim = a => { az = a; const r = a*Math.PI/180; camera.position.set(Math.sin(r)*dist, 0.98, Math.cos(r)*dist); controls.target.set(0, 0.78, 0); controls.update(); };
const resize = () => { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix(); const t = Math.tan(13*Math.PI/180); dist = Math.max(0.88/t, 0.72/(t*camera.aspect)); aim(az); };
new ResizeObserver(resize).observe(stage);
const bin = atob('__GLB__'), buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
const gltf = await new GLTFLoader().parseAsync(buf.buffer, ''); scene.add(gltf.scene);
const bones = {}; gltf.scene.traverse(o => { if (o.isBone) bones[o.name] = { o, q: o.quaternion.clone(), p: o.position.clone() }; if (o.isMesh) o.frustumCulled = false; });
const button = (box, label, pressed, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; if (pressed !== null) b.setAttribute('aria-pressed', pressed); b.onclick = () => fn(b); document.getElementById(box).append(b); return b; };
for (const [label, prefixes] of [['ドレス', ['cloth_bodice','cloth_skirt','cloth_sleeve']], ['帯', ['cloth_sash']], ['マント', ['cloth_cape']], ['フード', ['cloth_hood']], ['素体', ['spare_body']]])
  button('parts', label, true, b => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); gltf.scene.traverse(o => { if (prefixes.some(p => o.name.startsWith(p))) o.visible = on; }); });
let pose = '立ち姿', t0 = 0; const poseButtons = [];
for (const name of ['立ち姿','歩く','腕を上げる','ひねる']) poseButtons.push(button('poses', name, name === pose, b => { pose = name; t0 = performance.now(); poseButtons.forEach(x => x.setAttribute('aria-pressed', x === b)); }));
for (const [label, a] of [['正面', 0], ['斜め', 38], ['横', 90], ['背面', 180]]) button('views', label, null, () => aim(a));
button('opts', '自動で回す', false, b => { controls.autoRotate = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', controls.autoRotate); });
button('opts', '網目を見る', false, b => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); gltf.scene.traverse(o => { if (o.isMesh) o.material.wireframe = on; }); });
const e = new THREE.Euler(), q = new THREE.Quaternion();
const turn = (n, x, y = 0, z = 0) => { const b = bones[n]; if (b) b.o.quaternion.copy(b.q).multiply(q.setFromEuler(e.set(x, y, z))); };
const apply = now => { for (const k in bones) { bones[k].o.quaternion.copy(bones[k].q); bones[k].o.position.copy(bones[k].p); }
  if (pose === '歩く') { const w = (now - t0)/1000*Math.PI*1.7, s = Math.sin(w), c = Math.cos(w);
    turn('thigh_l', -0.34*s); turn('thigh_r', 0.34*s); turn('shin_l', 0.5*Math.max(0, c)); turn('shin_r', 0.5*Math.max(0, -c)); turn('upperarm_l', 0.22*s); turn('upperarm_r', -0.22*s); turn('chest', 0, 0.06*s, 0);
    bones.hips.o.position.y += 0.012*Math.abs(c) - 0.012; }
  if (pose === '腕を上げる') { turn('upperarm_l', 0, 0, 0.9); turn('upperarm_r', 0, 0, -0.9); }
  if (pose === 'ひねる') { turn('spine', 0.15, 0.3, 0); turn('forearm_l', -0.8); turn('forearm_r', -0.8); } };
resize(); aim(28); msg.remove(); window.viewerReady = true;
renderer.setAnimationLoop(now => { apply(now); controls.update(); renderer.render(scene, camera); });
} catch (err) { msg.textContent = '表示できませんでした：' + err.message; }
</script>
