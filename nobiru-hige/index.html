<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no">
<title>Stretchy Mustache</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body {
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
    touch-action: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    max-width: 100%;
  }
  /* スマホ用ソフトキー（タッチ端末だけ表示） */
  #pad {
    display: none;
    width: 100%;
    max-width: 512px;
    padding: 0 14px;
    justify-content: space-between;
    align-items: center;
  }
  .pad-g { display: flex; gap: 14px; }
  .pb {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    border: 3px solid rgba(255,255,255,0.5);
    color: #fff;
    font-size: 26px;
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  /* スティック（左右だけ受け付ける。つまみを左右にスライドさせる） */
  #stick {
    position: relative; width: 168px; height: 76px; border-radius: 38px;
    background: rgba(255,255,255,0.12); border: 3px solid rgba(255,255,255,0.5);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #stick::before { content: '◀'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.45); font-size: 16px; }
  #stick::after { content: '▶'; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.45); font-size: 16px; }
  #stick-knob {
    position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px;
    border-radius: 50%; background: rgba(255,255,255,0.4); border: 3px solid rgba(255,255,255,0.85);
    box-shadow: 0 3px 0 rgba(0,0,0,0.35); pointer-events: none;
  }
  #stick.on { background: rgba(255,255,255,0.2); }
  #stick.on #stick-knob { background: rgba(255,255,255,0.7); }
  .pb.jump { width: 92px; height: 92px; border-color: #f88; background: rgba(220,60,60,0.3); }
  .pb.on { background: rgba(255,255,255,0.42); }
  .pb.jump.on { background: rgba(255,90,90,0.6); }
  .pb.jump.isfire { border-color: #fb4; background: rgba(255,140,0,0.3); font-size: 20px; }
  .pb.jump.isfire.on { background: rgba(255,170,40,0.65); }
  @media (pointer: coarse) {
    #pad { display: flex; }
    canvas { max-height: calc(100vh - 175px); }
  }
  #top { display: flex; justify-content: flex-end; width: 100%; }
  #resetBtn {
    font: bold 15px 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif;
    color: #fff; background: #c8282a; border: 3px solid #fff; box-shadow: 3px 3px 0 #000;
    padding: 4px 14px; cursor: pointer; touch-action: manipulation;
  }
  #resetBtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  .pb.fire { display: none; border-color: #fb4; background: rgba(255,140,0,0.3); }
  .pb.fire.show { display: flex; }
  .pb.fire.on { background: rgba(255,170,40,0.65); }
  #endov {
    display: none; position: absolute; inset: 4px; z-index: 5;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; color: #fff;
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif;
    animation: fadein 2s steps(8) 1;
  }
  #endov .t { font: bold clamp(34px, 9vw, 58px) 'Courier New', monospace; color: #ff4040; text-shadow: 4px 4px 0 #000; letter-spacing: 3px; }
  #endov .s { font-size: clamp(13px, 3.4vw, 18px); text-shadow: 2px 2px 0 #000; }
  #endov button {
    font: bold clamp(16px, 4.5vw, 22px) 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif;
    color: #fff; background: #c8282a; border: 4px solid #fff; box-shadow: 4px 4px 0 #000; padding: 8px 28px; cursor: pointer;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  html, body { touch-action: manipulation; -webkit-touch-callout: none; }
  #endov.good { justify-content: flex-end; padding-bottom: 7%; }
  #endov.good .t, #endov.good .s { display: none; }
  #stage { position: relative; display: flex; max-width: 100%; }
  #start {
    position: absolute; inset: 4px;
    background: rgba(10,12,40,0.8);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 12px; text-align: center; color: #fff;
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif;
  }
  #start .t { font: bold clamp(26px, 7vw, 44px) 'Courier New', monospace; color: #ffec27; text-shadow: 3px 3px 0 #a0301c; letter-spacing: 2px; }
  #start .s { font-size: clamp(13px, 3.4vw, 18px); }
  #start .h { font-size: clamp(11px, 2.8vw, 14px); color: #c2c3c7; line-height: 1.7; }
  #start button {
    font: bold clamp(18px, 5vw, 26px) 'Courier New', monospace;
    color: #fff; background: #2f8f3a; border: 4px solid #fff; box-shadow: 4px 4px 0 #000;
    padding: 10px 34px; cursor: pointer; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { background: #46b552; } }
  canvas {
    background-color: #5c94fc;
    image-rendering: pixelated;
    border: 4px solid #fff;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
    max-width: 100vw;
    max-height: calc(100vh - 56px);
  }
</style>

<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<script>
/* iz-game-base v1 — 全ゲーム共通の基本設計
 *  1. iOS の「ダブルタップで拡大」「ピンチ拡大」を無効にする
 *  2. 全画面表示の切り替え（Fullscreen API。iPhone は非対応のため「ホーム画面に追加」を案内）
 *  3. 画面の向き（自動 / 縦 / 横）の選択（Androidは全画面時に固定、非対応端末は回転の案内を出す）
 * 各作品の <head> へ tools/apply_game_base.py が埋め込む（作品は1ファイル完結のため、外部読み込みはしない）。
 * 位置を変えたいときは、この前に window.IZ_BASE={pos:'tr'|'tl'|'br'|'bl'} を書く。
 */
(function () {
  'use strict';
  if (window.__izGameBase) return;
  window.__izGameBase = 1;
  var D = document, W = window, DE = D.documentElement;
  var KEY = 'izGameBase.orient';
  var cfg = W.IZ_BASE || {};

  /* ---------- 1. 拡大の無効化 ---------- */
  function fixViewport() {
    var m = D.querySelector('meta[name="viewport"]');
    if (!m) {
      m = D.createElement('meta');
      m.name = 'viewport';
      (D.head || DE).appendChild(m);
      m.content = 'width=device-width,initial-scale=1,viewport-fit=cover';
    }
    var c = m.getAttribute('content') || '';
    c = c.replace(/(^|,)\s*(maximum-scale|minimum-scale|user-scalable)\s*=\s*[^,]*/gi, '').replace(/^,/, '');
    m.setAttribute('content', c + ',maximum-scale=1,user-scalable=no');
  }
  fixViewport();

  var st = D.createElement('style');
  st.textContent = 'html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}';
  (D.head || DE).appendChild(st);

  // iOS Safari はピンチを gesture イベントで受ける
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    D.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  // 2本指の拡大（scale が 1 から動いたとき）だけを止める。マルチタッチ操作そのものは妨げない
  D.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length > 1 && e.scale && e.scale !== 1) e.preventDefault();
  }, { passive: false });
  // ダブルタップ拡大の保険。ボタン・入力欄などは click を壊さないよう除外し、CSS の touch-action に任せる
  var lastEnd = 0;
  var SKIP = 'input,textarea,select,button,a,label,summary,video,audio,[contenteditable],[role="button"],[data-iz-base-ui]';
  D.addEventListener('touchend', function (e) {
    var now = Date.now();
    var t = e.target;
    var skip = t && t.closest && t.closest(SKIP);
    if (!skip && now - lastEnd < 350 && e.cancelable) e.preventDefault();
    lastEnd = now;
  }, { passive: false });

  /* ---------- 2・3. 全画面と向き ---------- */
  var fsEl = DE;
  var fsReq = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen || fsEl.msRequestFullscreen;
  var fsOk = !!fsReq && (D.fullscreenEnabled !== false) && (D.webkitFullscreenEnabled !== false);
  function isFs() { return !!(D.fullscreenElement || D.webkitFullscreenElement); }
  function standalone() {
    return !!(navigator.standalone || (W.matchMedia && W.matchMedia('(display-mode: standalone)').matches));
  }
  function enterFs() {
    try {
      var p = fsReq.call(fsEl, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(function () {});
      return p;
    } catch (e) { return null; }
  }
  function exitFs() {
    var f = D.exitFullscreen || D.webkitExitFullscreen || D.msExitFullscreen;
    try { var p = f && f.call(D); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  function lockApi() { return W.screen && screen.orientation && screen.orientation.lock; }
  // 変更できない機能は表示しない（iPhone は両方とも不可なので、ボタン自体を出さない）
  var orOk = !!lockApi() && (navigator.maxTouchPoints > 0);
  var uiOk = fsOk || orOk;
  function applyOrient(mode, wantFs) {
    // 戻り値は使わず、結果は banner() が画面の向きで判定する
    if (mode === 'auto') {
      try { if (W.screen && screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
      return;
    }
    var tgt = mode === 'land' ? 'landscape' : 'portrait';
    function lock() {
      if (!lockApi()) return;
      try { var p = screen.orientation.lock(tgt); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
    if (isFs() || standalone()) lock();
    else if (wantFs && fsOk) {
      var p = enterFs();
      if (p && p.then) p.then(lock, function () {}); else lock();
    }
  }
  var mode = 'auto';
  try { mode = localStorage.getItem(KEY) || 'auto'; } catch (e) {}
  if ((mode !== 'land' && mode !== 'port') || !orOk) mode = 'auto';

  /* ---------- UI ---------- */
  var ui, btn, panel, banner, bT;
  var pos = cfg.pos || 'tr';
  function build() {
    if (ui || !D.body || !uiOk) return;
    var css = D.createElement('style');
    css.textContent =
      '#izb{position:fixed;z-index:2147483646;font:12px/1.4 "Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}' +
      '#izb *{box-sizing:border-box}' +
      '#izb.tr{top:calc(6px + env(safe-area-inset-top,0px));right:calc(6px + env(safe-area-inset-right,0px))}' +
      '#izb.tl{top:calc(6px + env(safe-area-inset-top,0px));left:calc(6px + env(safe-area-inset-left,0px))}' +
      '#izb.br{bottom:calc(6px + env(safe-area-inset-bottom,0px));right:calc(6px + env(safe-area-inset-right,0px))}' +
      '#izb.bl{bottom:calc(6px + env(safe-area-inset-bottom,0px));left:calc(6px + env(safe-area-inset-left,0px))}' +
      '#izb button{font:inherit;color:inherit;border:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}' +
      '#izb .iz-b{width:30px;height:30px;border-radius:8px;background:rgba(20,20,24,.45);border:1px solid rgba(255,255,255,.25);font-size:16px;line-height:28px;text-align:center;padding:0;opacity:.45;transition:opacity .2s}' +
      '#izb .iz-b:active,#izb.open .iz-b{opacity:1}' +
      '#izb .iz-p{display:none;position:absolute;width:210px;padding:10px;border-radius:10px;background:rgba(18,18,22,.94);border:1px solid rgba(255,255,255,.22);box-shadow:0 4px 18px rgba(0,0,0,.5)}' +
      '#izb.open .iz-p{display:block}' +
      '#izb.tr .iz-p,#izb.tl .iz-p{top:36px}#izb.br .iz-p,#izb.bl .iz-p{bottom:36px}' +
      '#izb.tr .iz-p,#izb.br .iz-p{right:0}#izb.tl .iz-p,#izb.bl .iz-p{left:0}' +
      '#izb .iz-h{font-size:11px;color:#aab;margin:0 0 5px}' +
      '#izb .iz-r{display:flex;gap:4px;margin-bottom:9px}' +
      '#izb .iz-r button{flex:1;padding:8px 0;border-radius:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:13px}' +
      '#izb .iz-r button.on{background:#e8c13a;color:#111;border-color:#e8c13a;font-weight:700}' +
      '#izb .iz-r button[disabled]{opacity:.4}' +
      '#izb .iz-n{font-size:10.5px;color:#9a9aa8;margin:-3px 0 6px}' +
      '#izb .iz-x{display:block;width:100%;padding:6px 0;border-radius:7px;background:transparent;border:1px solid rgba(255,255,255,.18);font-size:12px;color:#ccd}' +
      '#izbn{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:2147483645;padding:7px 14px;border-radius:18px;background:rgba(18,18,22,.88);border:1px solid rgba(255,255,255,.25);color:#fff;font:13px/1.3 "Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;pointer-events:none;display:none;white-space:nowrap}';
    (D.head || DE).appendChild(css);

    ui = D.createElement('div');
    ui.id = 'izb';
    ui.className = pos;
    ui.setAttribute('data-iz-base-ui', '');
    ui.innerHTML =
      '<button type="button" class="iz-b" tabindex="-1" aria-label="表示設定">⛶</button>' +
      '<div class="iz-p">' +
      (fsOk ? '<div class="iz-h">画面</div><div class="iz-r"><button type="button" tabindex="-1" data-fs="1">全画面にする</button></div>' : '') +
      (orOk ? '<div class="iz-h">向き</div><div class="iz-r" id="izor"><button type="button" tabindex="-1" data-o="auto">自動</button><button type="button" tabindex="-1" data-o="port">縦</button><button type="button" tabindex="-1" data-o="land">横</button></div><div class="iz-n" id="izon"></div>' : '') +
      '<button type="button" class="iz-x" tabindex="-1" data-close="1">閉じる</button>' +
      '</div>';
    D.body.appendChild(ui);
    btn = ui.querySelector('.iz-b');
    panel = ui.querySelector('.iz-p');

    banner = D.createElement('div');
    banner.id = 'izbn';
    D.body.appendChild(banner);

    // UI 上の操作はゲーム側へ伝えない
    ['touchstart', 'touchend', 'pointerdown', 'pointerup', 'mousedown', 'mouseup', 'click', 'dblclick', 'keydown', 'keyup'].forEach(function (t) {
      ui.addEventListener(t, function (e) { e.stopPropagation(); });
    });
    ui.addEventListener('click', function (e) {
      var t = e.target.closest('button');
      if (!t) return;
      if (t === btn) { ui.classList.toggle('open'); refresh(); }
      else if (t.getAttribute('data-close')) ui.classList.remove('open');
      else if (t.getAttribute('data-fs')) { isFs() ? exitFs() : enterFs(); setTimeout(refresh, 250); }
      else if (t.getAttribute('data-o')) setMode(t.getAttribute('data-o'), true);
      if (t.blur) t.blur();
    });
    refresh();
  }
  function setMode(m, fromUser) {
    mode = m;
    try { localStorage.setItem(KEY, m); } catch (e) {}
    applyOrient(m, fromUser);
    refresh();
    setTimeout(banner_, 400);
  }
  function refresh() {
    if (!ui) return;
    var fb = ui.querySelector('[data-fs]');
    if (fb) fb.textContent = isFs() ? '全画面をやめる' : '全画面にする';
    var bs = ui.querySelectorAll('[data-o]');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-o') === mode);
    var on = ui.querySelector('#izon');
    if (on) on.textContent = mode === 'auto' ? '端末の向きに合わせます。' : '全画面のときに向きを固定します。固定できない場合は、端末を回してください。';
  }
  function banner_() {
    if (!banner) return;
    var land = W.innerWidth > W.innerHeight;
    var bad = (mode === 'land' && !land) || (mode === 'port' && land);
    if (bad) {
      banner.textContent = '↻ 端末を' + (mode === 'land' ? '横' : '縦') + '向きにしてください';
      banner.style.display = 'block';
      clearTimeout(bT);
      bT = setTimeout(function () { banner.style.display = 'none'; }, 6000);
    } else banner.style.display = 'none';
  }
  function onChange() { refresh(); setTimeout(banner_, 300); }
  D.addEventListener('fullscreenchange', onChange);
  D.addEventListener('webkitfullscreenchange', onChange);
  W.addEventListener('orientationchange', onChange);
  W.addEventListener('resize', function () { setTimeout(banner_, 300); });

  function init() {
    build();
    if (mode !== 'auto') { applyOrient(mode, false); setTimeout(banner_, 600); }
  }
  if (D.body) init(); else D.addEventListener('DOMContentLoaded', init);

  W.IZBase = { fullscreen: function (on) { on === false ? exitFs() : enterFs(); }, orientation: setMode, get mode() { return mode; } };
})();
</script>
<!--IZ-GAME-BASE:END-->

<body>
<div id="wrap">
  <div id="top"><button id="resetBtn" type="button">Stuck? (Reset)</button></div>
  <div id="stage">
    <canvas id="game" width="512" height="448"></canvas>
    <div id="start">
      <div class="t">NOBIRU HIGE</div>
      <div class="s">Burn it, or the fungus keeps spreading</div>
      <button id="startBtn" type="button">START</button>
      <div class="h">← → : Walk　Space: Jump<br>On mobile, use the stick and buttons at the bottom</div>
    </div>
    <div id="endov">
      <div class="t">BAD END</div>
      <div class="s">Even after the fire, the fungus in the soil never died…<br>The Earth became a planet of fungus.</div>
      <button id="endBtn" type="button">Play again</button>
    </div>
  </div>
  <div id="pad">
    <div id="stick"><div id="stick-knob"></div></div>
    <div class="pad-g">
      <div class="pb fire" id="pad-fire">FIRE</div>
      <div class="pb jump" id="pad-jump">▲</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// iPhone Safari の拡大（ダブルタップ・ピンチ）を止める
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd < 350) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

// --- Web Audio API (ファミコン風チップチューン音源) ---
let audioCtx = null;
let masterOut = null;   // マスター（コンプレッサー経由）
let activeVoices = 0;   // 鳴っている効果音の数（多すぎる時は鳴らさない）
const MAX_SFX_VOICES = 10;
let bgmPlaying = false;
let bgmInterval = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // 音が重なりまくっても割れないよう、コンプレッサーで潰す
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -20;
    comp.knee.value = 12;
    comp.ratio.value = 8;
    comp.attack.value = 0.002;
    comp.release.value = 0.12;
    masterOut = audioCtx.createGain();
    masterOut.gain.value = 0.9;
    masterOut.connect(comp);
    comp.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playTone(freq, type, duration, vol = 0.1, slideTo = null, isBgm = false) {
  if (!audioCtx) return;
  if (!isBgm) {
    if (activeVoices >= MAX_SFX_VOICES) return; // 同時発音数の上限
    activeVoices++;
  }
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slideTo) {
    osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
  }
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(masterOut);
  if (!isBgm) osc.onended = () => { activeVoices--; };
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

// 効果音
function sfxJump() {
  playTone(180, 'square', 0.25, 0.08, 520);
}
let lastPopTime = 0;
function sfxStomp() {
  // プチッ。踏みまくっても破綻しないよう、間引き＋数が多いほど小さく・短く
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const n = enemies.length;
  const gap = n > 150 ? 0.06 : n > 40 ? 0.045 : 0.03;
  if (now - lastPopTime < gap) return;
  lastPopTime = now;
  const vol = 0.12 / Math.sqrt(1 + n / 25);
  const f = 500 + Math.random() * 900;

(function () {
  const stick = document.getElementById('stick');
  const knob = document.getElementById('stick-knob');
  const DEAD = 0.28; // 中心付近は入力なし
  let pid = null;
  function setAxis(a) {
    keys['ArrowLeft'] = a < -DEAD;
    keys['ArrowRight'] = a > DEAD;
  }
  function move(e) {
    const r = stick.getBoundingClientRect();
    const max = (r.width - 58) / 2 - 2;           // つまみが動ける幅
    let dx = e.clientX - (r.left + r.width / 2);
    dx = Math.max(-max, Math.min(max, dx));
    knob.style.transform = 'translateX(' + dx + 'px)';
    setAxis(dx / max);
  }
  function release() {
    pid = null;
    knob.style.transform = 'translateX(0)';
    stick.classList.remove('on');
    setAxis(0);
  }
  stick.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!started) { startGame(); return; }
    initAudio();
    pid = e.pointerId;
    try { stick.setPointerCapture(pid); } catch (_) {}
    stick.classList.add('on');
    move(e);
  });
  stick.addEventListener('pointermove', e => { if (e.pointerId === pid) { e.preventDefault(); move(e); } });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => stick.addEventListener(t, e => { if (e.pointerId === pid) release(); }));
  stick.addEventListener('contextmenu', e => e.preventDefault());
})();

const GEN_BOOST = 4;          // これだけ小さくなった（世代）キノコは、増殖が4倍になる

// 体重：大きいほど重力が強く（最大2.5倍）、小さいほど普通のまま
function playerWeight() { return 1 + Math.min(1.5, Math.max(0, player.scaleY - 1) * 0.15); }

// 踏んだときの跳ね返り：大きい（重い）ほど浮かない。連続で踏むほど小さくなる。最低限の浮きは確保
function stompBounce(e, harmless) {
  const mass = player.scaleY * player.scaleY;
  const base = harmless ? 4.2 + 4.8 / (1 + mass * 0.25)
                        : 6.0 + 4.0 / (1 + mass * 0.25);
  const sizeF = 0.8 + 0.2 * Math.min(1, e.size / ENEMY_BASE); // 小さい敵ほど少しだけ弾まない
  const decay = Math.max(0.55, Math.pow(0.93, player.chain));
  player.chain++;
  return -Math.max(3.4, base * sizeF * decay * JUMP_SCALE);
}

// ---- 潰す演出・胞子 ----
let splats = [];  // 潰れたキノコの跡

function splatEnemy(e) {

// ---- 汁と菌床：潰れると汁が左右に飛び、落ちた所に菌床ができて、糸が二股に伸び、キノコが生える ----
let mycs = [];          // 菌床
const MYC_BED = 46;     // 菌床ができてからキノコが生えるまでのフレーム
const MYC_FADE = 150;   // 生えたあと、菌床が薄れて消えるまで
// これから生まれる分（飛んでいる汁＋育ち中の菌床）。上限の計算に使う
function pendingBranches() { let n = spores.length; for (const m of mycs) if (!m.done) n++; return n; }
let lastJuice = 0;
function sfxJuice() {
  const now = performance.now();
  if (now - lastJuice < 45) return;
  lastJuice = now;
  playTone(520 + Math.random() * 260, 'sine', 0.07, 0.05, 220);
}
// 潰れたキノコから、汁を vxs の数だけ飛ばす（符号が向き）。1滴ごとに、落ちた所でキノコ1体ぶんの菌床になる
function emitSpores(e, ox, oy, vxs, shrink, grow) {
  // GEN_BOOST 回ぶん小さくなったキノコは4倍に増える（潰れたら4滴、時間で増えるときは3滴＋本体）
  if ((e.gen || 0) >= GEN_BOOST) {
    const want = grow ? 3 : 4;
    vxs = vxs.slice();
    while (vxs.length < want) vxs.push((Math.random() < 0.5 ? -1 : 1) * (0.8 + Math.random() * 1.8));
  }
  const cs = Math.max(ENEMY_MIN, e.size * (shrink || ENEMY_SHRINK));
  const room = MAX_ENEMIES - enemies.length - pendingBranches();
  const n = Math.min(room, vxs.length);
  const col = `hsl(${e.hue},85%,${e.light + 8}%)`;
  for (let k = 0; k < vxs.length; k++) {      // プチュッ：細かい飛沫（数が多いときは控えめ）
    if (particles.length >= 160) break;
    for (let j = 0; j < 3; j++) {
      particles.push({ x: ox, y: oy, vx: vxs[k] * (0.7 + Math.random() * 1.1), vy: -1.5 - Math.random() * 2.8,
        life: 16 + Math.random() * 10, color: j === 0 ? '#fff' : col, s: 1 });
    }
  }
  if (n > 0) sfxJuice();
  for (let k = 0; k < n; k++) {
    spores.push({
      x: ox, y: oy, vx: vxs[k], vy: -3.2 - Math.random() * 2.6,
      size: cs,
      hue: (e.hue + (Math.random() - 0.5) * 40 + 360) % 360,
      light: Math.max(28, Math.min(62, e.light + (Math.random() - 0.5) * 16)),
      safe: cs < footSize() ? 0 : 45,
      gen: (e.gen || 0) + 1,
      age: 0
    });
  }
}
// 汁が地面に落ちた：菌床を作る
function landJuice(sp) {
  if (mycs.length > 260) return;
  mycs.push({ x: Math.max(6, Math.min(canvas.width - 6, sp.x)), t: 0, done: false, dead: false, fade: 0,
    size: sp.size, hue: sp.hue, light: sp.light, safe: sp.safe, gen: sp.gen || 0, seed: Math.random() * 6.28 });
}
function updateMycs() {
  for (let i = mycs.length - 1; i >= 0; i--) {
    const m = mycs[i];
    if (!m.done) {
      m.t++;
      if (m.t >= MYC_BED) {
        m.done = true;
        if (!m.dead && enemies.length < MAX_ENEMIES) {
          const sz = m.size;
          const ne = makeEnemy(Math.max(0, Math.min(canvas.width - sz, m.x - sz / 2)), GROUND_Y - sz, sz,
            m.hue, m.light, (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random() * 0.6), 0, m.safe);
          ne.born = 0;
          ne.gen = m.gen || 0;
          enemies.push(ne);
        }
      }
    } else if (++m.fade > MYC_FADE) {
      mycs.splice(i, 1);
    }
  }
}
function drawMycs() {
  for (const m of mycs) {
    const p = m.done ? 1 : m.t / MYC_BED;
    const al = m.done ? Math.max(0, 1 - m.fade / MYC_FADE) : 1;
    ctx.globalAlpha = al;
    const bw = Math.round(Math.max(8, m.size * 0.9) * Math.min(1, p * 3)); // 菌床の幅（すぐ広がる）
    const gy = GROUND_Y + 3;
    // 菌床：汁の色がしみた白い床
    ctx.fillStyle = 'rgba(40,20,10,0.5)'; ctx.fillRect(Math.round(m.x - bw / 2) - 1, gy + 3, bw + 2, 3);
    ctx.fillStyle = `hsl(${m.hue},45%,78%)`; ctx.fillRect(Math.round(m.x - bw / 2), gy, bw, 4);
    ctx.fillStyle = '#fff6e0'; ctx.fillRect(Math.round(m.x - bw / 2) + 2, gy, Math.max(2, bw - 4), 2);
    // 糸：床から左右へ伸び、途中で二股に分かれる
    const reach = (m.size * 0.9 + 12) * Math.min(1, Math.max(0, (p - 0.2) / 0.8));
    for (let dir = -1; dir <= 1; dir += 2) {
      for (let d = bw / 2; d <= bw / 2 + reach; d += 2) {
        const wob = Math.round(Math.sin(d * 0.4 + m.seed + dir) * 1);
        const x = Math.round(m.x + dir * d);
        ctx.fillStyle = '#f4ecd8'; ctx.fillRect(x, gy + 1 + wob, 2, 2);
      }
      if (reach > 10) {
        const fx = bw / 2 + reach * 0.5;
        for (let sg = -1; sg <= 1; sg += 2) {
          for (let d = 0; d <= reach * 0.5; d += 2) {
            ctx.fillStyle = '#fff6e0';
            ctx.fillRect(Math.round(m.x + dir * (fx + d)), Math.round(gy + 1 + sg * d * 0.35), 2, 2);
          }
        }
      }
    }
    ctx.globalAlpha = 1;
  }
}

// 歩き：足が着くたびに、前回の着地点から今回の着地点までの間のキノコがぶちぶち潰れ、左右に汁が飛ぶ
function footCrush(side) {
  if (phase === 'fire') return;
  const cx = player.x + player.w / 2 + player.dir * 8 * player.scaleX; // 着地した前足の位置
  const fw = 9 * player.scaleX;
  const px = (player.lastFootX == null || Math.abs(player.lastFootX - cx) > 90) ? cx : player.lastFootX;
  player.lastFootX = cx;
  const x0 = Math.min(px, cx) - fw / 2, x1 = Math.max(px, cx) + fw / 2;
  const fs = footSize();
  let cnt = 0;
  for (let i = enemies.length - 1; i >= 0 && cnt < 14; i--) {
    const e = enemies[i];
    if (e.w >= fs) continue;
    if (e.x > x1 || e.x + e.w < x0) continue;
    if (e.y + e.h < GROUND_Y - 70) continue; // 積み重なったキノコも対象
    enemies.splice(i, 1);
    cnt++;
    splatEnemy(e);
    const ex = e.x + e.w / 2;
    emitSpores(e, ex, e.y + e.h * 0.6, [-(1.0 + Math.random() * 1.8), 1.0 + Math.random() * 1.8]);
  }
  if (cnt > 0) {
    sfxStomp();
    score += 10 * cnt;
    shake = Math.max(shake, 0.8);
  }
}

// ジャンプの着地：まわりのキノコが大量に潰れ、外側へ胞子が飛んで生まれる
function landingCrush(cx) {
  if (phase === 'fire') return;
  const fs = footSize();
  const R = 30 + fs * 0.9;
  let cnt = 0;
  for (let i = enemies.length - 1; i >= 0 && cnt < 90; i--) {
    const e = enemies[i];
    if (e.w >= fs) continue;
    const ex = e.x + e.w / 2;
    if (Math.abs(ex - cx) > R) continue;
    if (e.y + e.h < GROUND_Y - 40 - 10 * player.scaleY) continue;
    enemies.splice(i, 1);
    cnt++;
    splatEnemy(e);
    const away = ex >= cx ? 1 : -1;
    emitSpores(e, ex, e.y + e.h / 2, [away * (1.8 + Math.random() * 2.4), -away * (0.8 + Math.random() * 1.4)]);
  }
  score += 10 * cnt;
  rings.push({ x: cx, r: 10, max: R, life: 18 });
  shake = Math.max(shake, Math.min(9, 3 + cnt * 0.15));
  sfxThump();
  if (particles.length < 160) addParticles(cx, GROUND_Y - 6, '#fff1a8', 8);
}

// 足の大きさ（両足を合わせた幅）。敵がこれより小さいと、触れてもダメージなし
function footSize() { return 20 * player.scaleX; }

function enemyColor(hue, light) {
  return {
    cap: `hsl(${hue}, 85%, ${light}%)`,
    dark: `hsl(${hue}, 70%, ${Math.max(10, light - 18)}%)`
  };
}

function makeEnemy(x, y, size, hue, light, vx, vy, safeTimer) {
  const c = enemyColor(hue, light);
  return {
    type: 'goomba', x, y, vx, vy,
    w: size, h: size, size, hue, light,
    capColor: c.cap, darkColor: c.dark,
    safeTimer: safeTimer || 0, frame: Math.random() * 4, burn: 0,
    gen: 0, // 何回小さくなったか（汁から育つたびに+1）
    lift: 0, tl: 0, born: 1, growT: 600 // 一定時間（約10秒）ごとに、菌糸を放出して菌床ができ、1匹増える
  };
}

// 初期配置：敵キノコは2匹だけ（上から落ちてくる仕組みはなし）
function initEnemies() {
  for (let i = 0; i < 2; i++) {
    const x = 120 + Math.random() * (canvas.width - 120 - ENEMY_BASE - 20);
    const e = makeEnemy(x, GROUND_Y - ENEMY_BASE, ENEMY_BASE, 18, 41, (Math.random() < 0.5 ? -1 : 1) * 1.3, 0, 0);
    e.growT = 300 + Math.random() * 300; // 最初だけ分裂のタイミングをずらす
    enemies.push(e);
  }
}

function addParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 1) * 6,
      life: 25 + Math.random() * 15,
      color
    });
  }
}

// 矩形衝突判定
function rectHit(a, b) {
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

// ================= 白い花 → 火炎放射器 → クリア → バッドエンド =================

// ---------- 効果音 ----------
function sfxFlower() { [880, 1109, 1319, 1760].forEach((f, i) => setTimeout(() => playTone(f, 'square', 0.12, 0.07, null, true), i * 90)); }
function sfxTransform() { for (let i = 0; i < 8; i++) setTimeout(() => playTone(300 + i * 110, 'square', 0.1, 0.08, 500 + i * 110, true), i * 60); }
let lastSprout = 0;
function sfxSprout() {
  if (!audioCtx) return;
  const n = audioCtx.currentTime;
  if (n - lastSprout < 0.05) return;
  lastSprout = n;
  const f = 120 + Math.random() * 260;
  playTone(f, 'triangle', 0.06, 0.07, f * 2.4);
}
let lastCrackle = 0;
function crackle() {
  if (!audioCtx) return;
  const n = audioCtx.currentTime;
  if (n - lastCrackle < 0.06) return;
  lastCrackle = n;
  playTone(200 + Math.random() * 700, 'square', 0.02, 0.025);
}
function playFanfare() {
  const N = { C5: 523.25, E5: 659.25, G5: 783.99, A5: 880, B5: 987.77, C6: 1046.5 };
  const seq = [[N.C5, 0, 0.1], [N.E5, 110, 0.1], [N.G5, 220, 0.1], [N.C6, 330, 0.3],
    [N.G5, 700, 0.1], [N.A5, 810, 0.1], [N.B5, 920, 0.1], [N.C6, 1030, 0.5],
    [N.C5, 1600, 0.9], [N.E5, 1600, 0.9], [N.G5, 1600, 0.9], [N.C6, 1600, 0.9]];
  seq.forEach(([f, d, du]) => setTimeout(() => playTone(f, 'square', du, 0.07, null, true), d));
}
// 炎の音：ノイズをローパスで「ゴォォ」
let flameNode = null;
function flameSound(on) {
  if (!audioCtx) return;
  if (!flameNode) {
    const len = Math.floor(audioCtx.sampleRate * 1.5);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 700;
    const g = audioCtx.createGain();
    g.gain.value = 0;
    src.connect(lp); lp.connect(g); g.connect(masterOut);
    src.start();
    flameNode = { g, lp };
  }
  const t = audioCtx.currentTime;
  flameNode.g.gain.setTargetAtTime(on ? 0.3 : 0, t, on ? 0.03 : 0.08);
  flameNode.lp.frequency.setTargetAtTime(on ? 450 + Math.random() * 600 : 300, t, 0.05);
}

// ---------- 白い花 ----------
function enterFlower() {
  setPhase('flower');
  items.length = 0;
  flower = { x: 244, y: -40, w: 24, h: 28, landed: 0 };
  sfxFlower();
}
function updateFlower() {
  const f = flower;
  if (!f) return;
  if (!f.landed) {
    f.y += 2.0;
    if (f.y + f.h >= GROUND_Y) { f.y = GROUND_Y - f.h; f.landed = 1; }
  } else if (++f.landed > 26) {
    pickFlower();
  }
  if (tick % 3 === 0) flames.push({ kind: 'tw', x: f.x + Math.random() * 24, y: f.y + Math.random() * 26, vx: 0, vy: -0.3, life: 0, max: 22, size: 3 });
}
function pickFlower() {
  flower = null;
  flash = 1;
  transform = { t: 0, s0: Math.max(1, player.scaleY) };
  player.fire = true;
  setPhase('fire');
  sfxTransform();
  // 菌の大群があふれ出す
  const n = Math.max(0, 90 - enemies.length);
  for (let i = 0; i < n; i++) {
    const sz = 18 + Math.random() * 6;
    enemies.push(makeEnemy(Math.random() * (canvas.width - sz), GROUND_Y - sz, sz,
      Math.floor(Math.random() * 360), 40 + Math.random() * 14,
      (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random() * 0.6), -3 * Math.random(), 0));
  }
}

// ---------- 火炎放射器 ----------
function nozzle() {
  const dir = player.dir;
  return {
    dir,
    x: player.x + player.w / 2 + dir * 28 * player.scaleX,
    y: player.y + player.h - 16.5 * player.scaleY
  };
}
function emitFlame(nz, f) {
  if (flames.length > 1000) return;
  const n = f < 4 ? 4 : 7;
  for (let k = 0; k < n; k++) {
    const sp = 9 + Math.random() * 4.5;
    const ang = (Math.random() - 0.5) * 0.30;
    flames.push({
      kind: 'f', x: nz.x, y: nz.y + (Math.random() - 0.5) * 3,
      vx: nz.dir * Math.cos(ang) * sp, vy: Math.sin(ang) * sp * 0.6 + 0.15,
      life: 0, max: 24 + Math.random() * 14, size: 3 + Math.random() * 3, seed: Math.random() * 6.28
    });
  }
  if (Math.random() < 0.5) {
    flames.push({ kind: 'e', x: nz.x + nz.dir * (30 + Math.random() * 120), y: nz.y + (Math.random() - 0.5) * 20,
      vx: nz.dir * Math.random() * 2, vy: -1 - Math.random() * 1.5, life: 0, max: 30 + Math.random() * 20, size: 2 });
  }
}
function igniteInFlame(nz, f) {
  const L = 60 + 190 * Math.min(1, f / 10);
  const x0 = nz.dir > 0 ? nz.x : nz.x - L;
  const x1 = nz.dir > 0 ? nz.x + L : nz.x;
  const yTop = GROUND_Y - 70;
  for (const e of enemies) {
    if (!e.burn && e.x + e.w > x0 && e.x < x1 && e.y + e.h > yTop) e.burn = 1;
  }
  for (let i = spores.length - 1; i >= 0; i--) {
    const sp = spores[i];
    if (sp.x > x0 && sp.x < x1 && sp.y > yTop - 60) {
      flames.push({ kind: 'e', x: sp.x, y: sp.y, vx: 0, vy: -1, life: 0, max: 24, size: 2 });
      spores.splice(i, 1);
    }
  }
  for (const m of mycs) { // 育ち中の菌床も焼ける
    if (!m.done && m.x > x0 && m.x < x1) m.dead = true;
  }
}
// 燃えているキノコ：慌てて走る→黒焦げ→灰になって消える。近くのキノコに燃え移る（全焼）
function burnTick(e, i) {
  e.burn++;
  const b = e.burn;
  if (b > 64) {
    enemies.splice(i, 1);
    score += 50;
    const cx = e.x + e.w / 2;
    scorch.push({ x: cx, w: e.size * 1.2 });
    if (scorch.length > 260) scorch.shift();
    for (let k = 0; k < 2; k++) flames.push({ kind: 'a', x: cx, y: e.y + e.h * 0.4, vx: (Math.random() - 0.5) * 0.8, vy: -0.6 - Math.random() * 0.8, life: 0, max: 50 + Math.random() * 30, size: 2 });
    return true;
  }
  if (b < 40) {
    if (Math.abs(e.vx) < 1.6) e.vx = (e.vx >= 0 ? 1 : -1) * (1.6 + Math.random() * 0.8);
    if (e.y + e.h >= GROUND_Y - 0.5 && Math.random() < 0.07) e.vy = -3.2;
  } else {
    e.vx *= 0.8;
  }
  if (b > 5 && b < 38 && (tick + i) % 3 === 0) {
    const r = e.w * 0.8 + 6;
    for (const o of enemies) {
      if (!o.burn && Math.abs(o.x - e.x) < r && Math.abs(o.y - e.y) < 22 && Math.random() < 0.7) o.burn = 1;
    }
  }
  if (flames.length < 900 && b < 48 && Math.random() < 0.6) {
    flames.push({ kind: 'f', x: e.x + Math.random() * e.w, y: e.y + e.h * 0.2,
      vx: (Math.random() - 0.5) * 0.8, vy: -0.8 - Math.random() * 1.2, life: 0, max: 14 + Math.random() * 8,
      size: e.w * 0.18 + 2, seed: Math.random() * 6.28 });
  }
  if (b % 9 === 0) crackle();
  return false;
}
function updateFire() {
  if (transform) {
    transform.t++;
    const k = Math.min(1, transform.t / 70);
    const ease = k * k * (3 - 2 * k);
    const s = Math.exp(Math.log(transform.s0) * (1 - ease));
    player.scaleX = player.scaleY = s;
    player.y = GROUND_Y - player.h; player.vy = 0; player.vx = 0;
    if (transform.t % 2 === 0) {
      flames.push({ kind: 'tw', x: player.x + Math.random() * player.w, y: player.y + Math.random() * player.h, vx: 0, vy: -0.5, life: 0, max: 22, size: 3 });
    }
    if (transform.t >= 70) {
      transform = null;
      player.scaleX = player.scaleY = 1;
      player.y = GROUND_Y - player.h;
    }
    return;
  }
  const want = FIRE_KEYS.some(k => keys[k]);
  firing = want ? firing + 1 : 0;
  const nz = nozzle();
  if (want) {
    emitFlame(nz, firing);
    igniteInFlame(nz, firing);
    if (firing % 3 === 0) shake = Math.max(shake, 0.7);
  } else if (tick % 3 === 0 && flames.length < 1000) {
    // 種火（ゆらゆら）
    flames.push({ kind: 'f', x: nz.x, y: nz.y, vx: nz.dir * 0.4, vy: -0.6, life: 0, max: 10, size: 2.5, seed: Math.random() * 6.28 });
  }
  flameSound(want);
  // 全焼したらクリア
  if (enemies.length === 0 && pendingBranches() === 0) {
    if (++clearTimer > 45) startClear();
  } else {
    clearTimer = 0;
  }
}

// 炎・煙・火の粉・灰
function updateFlames() {
  for (let i = flames.length - 1; i >= 0; i--) {
    const p = flames[i];
    p.life++;
    if (p.life >= p.max) {
      if (p.kind === 'f' && p.size > 3 && flames.length < 900 && Math.random() < 0.18) {
        flames.push({ kind: 's', x: p.x, y: p.y, vx: p.vx * 0.3, vy: -0.5, life: 0, max: 40, size: p.size * 0.8 });
      }
      flames.splice(i, 1);
      continue;
    }
    if (p.kind === 'f') {
      p.vx *= 0.972;
      p.vy -= 0.05;
      p.vy += Math.sin(p.life * 0.5 + p.seed) * 0.07;
      p.x += p.vx; p.y += p.vy;
      p.size += 0.16;
      if (p.y > GROUND_Y - 2) { p.y = GROUND_Y - 2; p.vy *= -0.25; p.vx *= 0.85; }
    } else if (p.kind === 's') {
      p.vx *= 0.98; p.vy -= 0.01;
      p.x += p.vx + Math.sin(p.life * 0.15 + i) * 0.15; p.y += p.vy;
      p.size += 0.1;
    } else if (p.kind === 'e' || p.kind === 'a') {
      p.vy -= 0.02; p.vx += (Math.random() - 0.5) * 0.15;
      p.x += p.vx; p.y += p.vy;
    } else {
      p.y += p.vy;
    }
  }
}
function flameColor(t) {
  return t < 0.12 ? '#ffffff' : t < 0.28 ? '#fff6a8' : t < 0.46 ? '#ffd21f' : t < 0.66 ? '#ff8c12' : t < 0.85 ? '#e0381a' : '#7a1a10';
}
function px2(v) { return Math.round(v / 2) * 2; }
function drawFlames() {
  for (const p of flames) {
    const t = p.life / p.max;
    if (p.kind === 's') {
      ctx.globalAlpha = 0.35 * (1 - t);
      ctx.fillStyle = '#3a3a3a';
      const sz = Math.max(2, px2(p.size));
      ctx.fillRect(px2(p.x) - sz / 2, px2(p.y) - sz / 2, sz, sz);
    } else if (p.kind === 'a') {
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = p.life % 6 < 3 ? '#666' : '#222';
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
    }
  }
  for (const p of flames) {
    if (p.kind !== 'f') continue;
    const t = p.life / p.max;
    ctx.globalAlpha = t > 0.75 ? (1 - t) / 0.25 : 1;
    ctx.fillStyle = flameColor(t);
    const sz = Math.max(2, px2(p.size));
    ctx.fillRect(px2(p.x) - sz / 2, px2(p.y) - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of flames) {
    const t = p.life / p.max;
    if (p.kind === 'e') {
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = p.life % 4 < 2 ? '#ffb020' : '#ff5010';
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
    } else if (p.kind === 'tw') {
      ctx.globalAlpha = Math.sin(t * Math.PI);
      ctx.fillStyle = '#fff';
      ctx.fillRect(p.x - 1, p.y - 3, 2, 6);
      ctx.fillRect(p.x - 3, p.y - 1, 6, 2);
    }
  }
  // 発射中のまぶしい光
  if (phase === 'fire' && firing > 0) {
    const nz = nozzle();
    const L = 60 + 190 * Math.min(1, firing / 10);
    const g = ctx.createRadialGradient(nz.x + nz.dir * L * 0.4, nz.y, 4, nz.x + nz.dir * L * 0.4, nz.y, 40 + L * 0.45);
    g.addColorStop(0, 'rgba(255,170,40,0.38)');
    g.addColorStop(1, 'rgba(255,90,0,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.round(nz.x) - 4 + (nz.dir > 0 ? 2 : -2), Math.round(nz.y) - 4, 8, 8);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawScorch() {
  ctx.fillStyle = 'rgba(25,10,5,0.55)';
  for (const s of scorch) ctx.fillRect(Math.round(s.x - s.w / 2), GROUND_Y - 3, Math.round(s.w), 4);
}
function drawFlower() {
  if (!flower) return;
  const f = flower;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(f.x + 12, f.y + 10, 2, f.x + 12, f.y + 10, 46 + Math.sin(tick * 0.2) * 6);
  g.addColorStop(0, 'rgba(255,255,255,0.65)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(f.x - 40, f.y - 40, 104, 104);
  ctx.restore();
  const sw = Math.round(Math.sin(tick * 0.15));
  ctx.fillStyle = '#00a800';
  ctx.fillRect(f.x + 11, f.y + 18, 3, 10);
  ctx.fillRect(f.x + 5, f.y + 22, 6, 3);
  ctx.fillRect(f.x + 14, f.y + 20, 6, 3);
  [[9, 0], [2, 7], [16, 7], [9, 13]].forEach(([px, py]) => {
    ctx.fillStyle = '#9aa8d8'; ctx.fillRect(f.x + px - 1 + sw, f.y + py - 1, 8, 8);
    ctx.fillStyle = '#fff'; ctx.fillRect(f.x + px + sw, f.y + py, 6, 6);
  });
  ctx.fillStyle = '#ffd21f'; ctx.fillRect(f.x + 8 + sw, f.y + 7, 8, 7);
  ctx.fillStyle = '#ff8c12'; ctx.fillRect(f.x + 10 + sw, f.y + 9, 4, 3);
}
// プレイヤー（ローカル座標、+xが前）の火炎放射器
function drawTank() {

// ---------- クリア：花火・旗・退場 ----------
function startClear() {
  setPhase('clear');
  items.length = 0;
  bgmPlaying = false;
  flameSound(false);
  firing = 0;
  player.dir = 1; player.vx = 0;
  flagH = 0; flagDone = false; playerGone = false;
  pr = null; clearStage = 0; stageT = 0; goneAt = 0; holdHands = false; hearts.length = 0;
  playFanfare();
}
let lastBoom = 0;
function launchFirework() {
  fireworks.push({ x: 60 + Math.random() * 392, y: GROUND_Y - 10, vy: -(8.5 + Math.random() * 2.5), burst: 70 + Math.random() * 150, hue: Math.floor(Math.random() * 360), kind: Math.floor(Math.random() * 4) });
  playTone(500, 'sine', 0.35, 0.05, 1400, true);
}
function burstFirework(r) {
  const n = 46 + Math.floor(Math.random() * 30);
  const hue2 = (r.hue + 150) % 360;
  for (let k = 0; k < n; k++) {
    const a = Math.PI * 2 * k / n + Math.random() * 0.05;
    let sp = 1.5 + Math.random() * 3.2, grav = 0.03, max = 40 + Math.random() * 20, hue = r.hue;
    if (r.kind === 1) { sp = 3.4; }
    if (r.kind === 2) { sp = 1.2 + Math.random() * 2.2; grav = 0.07; max = 70; }
    if (r.kind === 3) { sp = k % 2 ? 2 : 4; hue = k % 2 ? r.hue : hue2; }
    sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max, hue, grav });
  }
  shake = Math.max(shake, 1.5);
  const now = performance.now();
  if (now - lastBoom > 150) {
    lastBoom = now;
    playTone(140, 'square', 0.16, 0.1, 45, true);
    for (let i = 0; i < 3; i++) setTimeout(() => playTone(2000 + Math.random() * 2000, 'square', 0.02, 0.03, null, true), 80 + i * 70);
  }
}
function updateFireworks() {
  for (let i = fireworks.length - 1; i >= 0; i--) {
    const r = fireworks[i];
    r.y += r.vy; r.vy *= 0.985;
    sparks.push({ x: r.x, y: r.y, vx: (Math.random() - 0.5) * 0.4, vy: 0.6, life: 0, max: 14, hue: 40, grav: 0.02 });
    if (r.y <= r.burst || r.vy > -1.2) { burstFirework(r); fireworks.splice(i, 1); }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.life++; p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= 0.985;
    if (p.life >= p.max) sparks.splice(i, 1);
  }
}
function drawFireworks() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of sparks) {
    const t = p.life / p.max;
    ctx.globalAlpha = 1 - t * t;
    ctx.fillStyle = `hsl(${p.hue},100%,${60 - t * 15}%)`;
    ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 3, 3);
    ctx.globalAlpha = (1 - t) * 0.4;
    ctx.fillRect(Math.round(p.x - p.vx * 1.5) - 1, Math.round(p.y - p.vy * 1.5) - 1, 2, 2);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff6a8';
  for (const r of fireworks) ctx.fillRect(Math.round(r.x) - 1, Math.round(r.y) - 1, 3, 4);
  ctx.restore();
}
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    if (e.x + e.w >= canvas.width) { e.x = canvas.width - e.w; e.vx = -Math.abs(e.vx); }

    // 地面（または下に重なったキノコの山）
    if (e.y + e.h >= gy - (e.vy >= 0 ? 3 : 0)) {
      e.y = gy - e.h;
      e.vy = 0;
    }

    // プレイヤーとの接触判定
    if (phase !== 'fire' && rectHit(player, e)) {
      const prevBottom = (player.y - player.vy) + player.h;
      const isStomp = player.vy > 0 && prevBottom <= e.y + e.h * 0.65;
      const harmless = e.w < footSize(); // 足より小さい敵はダメージなし

      if (isStomp) {
        // 踏んだ！ 小さい敵は軽く踏める（バウンドも小さい）
        const impactVy = player.vy;
        player.vy = stompBounce(e, harmless);
        player.stompWin = 9;
        sfxStomp();
        score += 100;

        // 踏まれたキノコはぺしゃんこに潰れて消え、両脇に胞子が飛んで、着地したところで新しいキノコになる
        const cxE = e.x + e.w / 2;
        enemies.splice(i, 1);
        splatEnemy(e);
        const d = Math.random() < 0.5 ? 1 : -1;
        emitSpores(e, cxE, e.y + e.h / 2, [d * (0.8 + Math.random() * 1.6), -d * (0.8 + Math.random() * 1.6)]);
        // 勢いよく小さいキノコを踏んだら、まわりも一気に潰れる
        if (harmless && impactVy > 2.5) pendingLand = player.x + player.w / 2;
        if (particles.length < 160) addParticles(cxE, e.y + e.h / 2, e.capColor, enemies.length > 60 ? 2 : 6);
      } else if (!harmless && e.safeTimer <= 0 && player.invuln <= 0) {
        // 足より大きいキノコに横・下から当たると、無限に小さくなっていく！
        const oldH = player.h;
        const ns = Math.max(MIN_SCALE, player.scaleY * 0.8); // ダメージのたび80%に
        player.scaleY = ns;
        player.scaleX = ns;
        player.y += (oldH - player.h);
        player.invuln = 55;
        player.vy = -5;
        sfxShrink();
        addParticles(player.x + player.w/2, player.y + player.h/2, '#ffffff', 12);
      }
    }
  }

  if (pendingLand !== null) { landingCrush(pendingLand); pendingLand = null; }
  if (phase === 'play' && player.h >= canvas.height / 2) { // 画面の高さの半分（以前の半分の大きさ）で花が出る
    if (goodRoute) enterShroom(); else enterFlower(); }
  updateMycs();
  if (phase === 'flower') updateFlower();
  if (phase === 'fire') updateFire();
  updateFlames();

  // 潰れた跡・衝撃波・画面揺れ
  for (let i = splats.length - 1; i >= 0; i--) { if (--splats[i].life <= 0) splats.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += (r.max - r.r) * 0.3 + 2;
    if (--r.life <= 0) rings.splice(i, 1);
  }
  shake *= 0.85;

  // 胞子の更新：ふわっと飛んで、着地したらキノコに育つ
  for (let i = spores.length - 1; i >= 0; i--) {
    const sp = spores[i];
    sp.age++;
    sp.vy += 0.22;
    sp.x += sp.vx;
    sp.y += sp.vy;
    if (sp.x < 4 || sp.x > canvas.width - 4) { sp.vx *= -1; sp.x = Math.max(4, Math.min(canvas.width - 4, sp.x)); }
    if ((sp.vy > 0 && sp.y >= GROUND_Y - 2) || sp.age > 150) {
      landJuice(sp); // 落ちた所に菌床ができる
      spores.splice(i, 1);
    }
  }

  // パーティクル更新
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.25;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// --- 描画処理 (ファミコン風ドット絵) ---
function drawPlayer() {
  if (phase === 'bad' || phase === 'end') return;
  if (player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0) return;

  ctx.save();
  ctx.translate(player.x + player.w / 2, player.y + player.h);
  ctx.scale(player.dir * player.scaleX, player.scaleY);
  if (player.peerK > 0) { // 前足を支点に前へ傾く
    ctx.translate(4, 0); ctx.rotate(player.peerK * 0.32); ctx.translate(-4, 0);
  }
  drawManBody(player.walkFrame, player.fire, player.fire && phase === 'fire', player.peerK);
  ctx.restore();
}

// 基準サイズ 24x32（原点は足元中央、+xが前）
function drawManBody(wf, fireSuit, armed, peer) {
  peer = peer || 0;
  if (armed) drawTank();
  // オーバーオール（青）
  ctx.fillStyle = fireSuit ? '#e0481a' : '#c88a1a';
  ctx.fillRect(-8, -16, 16, 11);

  // シャツ（赤）
  ctx.fillStyle = fireSuit ? '#ffffff' : '#7a3fb0';
  ctx.fillRect(-10, -17, 20, 6);
  // 黄色いボタン
  ctx.fillStyle = '#f0e8d0';
  ctx.fillRect(-5, -13, 2, 2);
  ctx.fillRect(3, -13, 2, 2);

  // 顔（肌色）— 覗き込み中は頭を前下へ
  ctx.save();
  ctx.translate(Math.round(peer * 3), Math.round(peer * 3));
  ctx.fillStyle = '#ffa044';
  ctx.fillRect(-7, -27, 14, 10);

  // ヒゲメガネ：太い黒フチのメガネ＋大きな鼻＋もじゃもじゃのヒゲ（帽子なし）
  const pd = peer > 0.5 ? 1 : 0;
  ctx.fillStyle = '#111';
  ctx.fillRect(-7, -25, 7, 1);          // つる（耳の方へ）
  ctx.fillRect(-1, -28, 10, 8);         // レンズのフチ
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, -27, 8, 6);           // レンズ
  ctx.fillStyle = '#000';
  ctx.fillRect(4, -26 + pd, 3, 3);      // 目（覗き込み中は下を見る）
  ctx.fillStyle = '#ff8a3a';
  ctx.fillRect(9, -25, 5, 5);           // 大きな鼻
  ctx.fillStyle = '#e0601c';
  ctx.fillRect(9, -21, 5, 1);
  ctx.fillStyle = '#381800';            // ヒゲ
  ctx.fillRect(0, -20, 14, 3);
  ctx.fillRect(2, -21, 9, 1);
  ctx.fillRect(1, -17, 5, 1);
  ctx.restore();
  if (peer > 0.9 && Math.floor(tick / 8) % 2 === 0) { ctx.fillStyle = '#7fd0ff'; ctx.fillRect(-9, -30, 2, 3); } // 冷や汗
  drawFeet(wf, '#6b2c00');
  if (armed) drawGun();
}

function drawItems() {
  items.forEach(it => {
    // 傘（赤地に白水玉）
    ctx.fillStyle = '#f83800';
    ctx.fillRect(it.x + 2, it.y, it.w - 4, 12);
    ctx.fillRect(it.x, it.y + 4, it.w, 8);
    ctx.fillStyle = '#fff';
    ctx.fillRect(it.x + 4, it.y + 3, 4, 4);
    ctx.fillRect(it.x + 14, it.y + 3, 4, 4);
    ctx.fillRect(it.x + 9, it.y + 7, 4, 4);

    // 軸
    ctx.fillStyle = '#ffa044';
    ctx.fillRect(it.x + 5, it.y + 12, it.w - 10, 10);
    // 目
    ctx.fillStyle = '#000';
    ctx.fillRect(it.x + 7, it.y + 14, 2, 4);
    ctx.fillRect(it.x + 13, it.y + 14, 2, 4);
  });
}

function drawEnemies() {
  const fs = footSize();
  enemies.forEach(e => {
    // 分裂直後の無敵点滅
    if (e.safeTimer > 0 && Math.floor(e.safeTimer / 3) % 2 === 0) {
      ctx.globalAlpha = 0.55;
    }
    const walk = Math.floor(e.frame) % 2 === 0 ? -1 : 1;
    let cap = e.capColor, dark = e.darkColor, stem = '#fcbcb0';
    const bt = e.burn > 0 ? Math.min(1, e.burn / 40) : 0;
    if (e.burn > 0) {
      cap = `hsl(${e.hue}, ${Math.round(85 * (1 - bt))}%, ${Math.round(e.light * (1 - bt * 0.88))}%)`;
      dark = '#1a0a05';
      stem = bt > 0.5 ? '#2a1a12' : '#d88a60';
      if (e.burn > 42) ctx.globalAlpha = Math.max(0, 1 - (e.burn - 42) / 22);
    }
    ctx.save();
    const bk = e.born < 1 ? 1 - Math.pow(1 - e.born, 2) : 1; // 地面からにょきっと生える
    ctx.translate(e.x, e.y + e.h * (1 - bk));
    const sc = e.size / ENEMY_BASE;
    ctx.scale(sc, sc * bk);
    // 傘（個体ごとに微妙に違う色）
    ctx.fillStyle = cap;
    ctx.fillRect(4, 0, 16, 6);
    ctx.fillRect(1, 5, 22, 9);
    if (e.w < fs) {
      // 足より小さい＝無害。ほんわか目
      ctx.fillStyle = '#fff';
      ctx.fillRect(5, 7, 4, 5);
      ctx.fillRect(15, 7, 4, 5);
      ctx.fillStyle = '#000';
      ctx.fillRect(6, 9, 3, 3);
      ctx.fillRect(15, 9, 3, 3);
    } else {
      // 怒り眉と目
      ctx.fillStyle = '#fff';
      ctx.fillRect(5, 7, 4, 5);
      ctx.fillRect(15, 7, 4, 5);
      ctx.fillStyle = '#000';
      ctx.fillRect(7, 8, 2, 4);
      ctx.fillRect(15, 8, 2, 4);
      ctx.fillRect(5, 6, 5, 2);
      ctx.fillRect(14, 6, 5, 2);
    }
    // 軸
    ctx.fillStyle = stem;
    ctx.fillRect(7, 14, 10, 6);
    // 足
    ctx.fillStyle = dark;
    ctx.fillRect(3 + walk, 19, 7, 5);
    ctx.fillRect(14 - walk, 19, 7, 5);
    if (e.burn > 0 && bt < 0.85) {
      ctx.fillStyle = Math.floor(e.burn / 2) % 2 ? 'rgba(255,200,40,0.5)' : 'rgba(255,90,0,0.4)';
      ctx.fillRect(1, 0, 22, 14);
    }
    ctx.restore();
    ctx.globalAlpha = 1.0;
  });
}

function drawSplats() {
  splats.forEach(sp => {
    const t = sp.life / 28;
    const w = sp.w * 1.5 * (1 + (1 - t) * 0.25);
    const h = Math.max(2, sp.w * 0.22 * t);
    ctx.globalAlpha = Math.min(1, t * 1.6);
    ctx.fillStyle = sp.dark;
    ctx.fillRect(sp.x - w / 2 - 1, sp.y - h - 1, w + 2, h + 1);
    ctx.fillStyle = sp.cap;
    ctx.fillRect(sp.x - w / 2, sp.y - h, w, h);
    ctx.globalAlpha = 1;
  });
}

function drawRings() {
  rings.forEach(r => {
    ctx.globalAlpha = Math.max(0, r.life / 18);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(r.x, GROUND_Y - 2, r.r, r.r * 0.18, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
}

function drawSpores() { // 飛んでいる汁：1ドット
  spores.forEach(sp => {
    ctx.fillStyle = `hsl(${sp.hue}, 85%, ${sp.light + 8}%)`;
    ctx.fillRect(Math.round(sp.x), Math.round(sp.y), 1, 1);
  });
}

function drawUI() {
  if (phase === 'bad' || phase === 'space' || phase === 'end' || phase === 'dream' || phase === 'night') return;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText(`NOBIRU HIGE`, 24, 28);
  ctx.fillText(String(score).padStart(6, '0'), 24, 46);

  const heightRatio = player.scaleY >= 1
    ? (player.scaleY >= 10000 ? `x${player.scaleY.toExponential(1)}` : `x${player.scaleY.toFixed(1)}`)
    : `1/${(1 / player.scaleY).toFixed(1)}`;
  ctx.fillText(`HEIGHT: ${heightRatio}`, 200, 28);
  ctx.fillText(`ENEMIES: ${enemies.length}`, 375, 28);
  drawBanners();
}

// 数が多いと処理落ち風にスロー＆カクつく
let slowFactor = 1;
let slowAcc = 0;
function loop() {
  const n = enemies.length + spores.length + pendingBranches();
  slowFactor = n <= SLOW_START ? 1 : Math.max(0.85, 1 - (n - SLOW_START) / 400 * 0.15);
  slowAcc += slowFactor;
  while (slowAcc >= 1) { if (started) update(); slowAcc -= 1; }
  // たまに描画をスキップ（ファミコンのチラつき・処理落ち風）
  if (slowFactor < 1 && Math.random() < (1 - slowFactor) * 0.2) {
    requestAnimationFrame(loop);
    return;
  }
  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  if (wob > 0.001) { ctx.translate(256, 224); ctx.rotate(Math.sin(tick * 0.07) * wob); const ws = 1 + Math.sin(tick * 0.11) * wob * 1.5; ctx.scale(ws, ws); ctx.translate(-256, -224); }
  if (inSpace) {
    drawSpace();
  } else if (phase === 'dream') {
    drawDream();
  } else if (phase === 'night') {
    drawNight();
  } else {
  drawBackground();
  drawBad();
  drawSplats();
  drawMycs();
  drawItems();
  if (phase === 'play' || phase === 'flower' || phase === 'fire') drawBlocks();
  drawEnemies();
  drawSpores();
  drawRings();
  drawPrincess();
  drawPlayer();
  drawFlower();
  drawGiantShroom();
  drawTrip();
  drawFlames();
  drawFireworks();
  drawHearts();

  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.s || 4, p.s || 4);
  });
  }

  ctx.restore();
  drawFlash();
  drawWhite();
  drawDissolve(dissolveK());
  drawCurtain();
  drawUI();
  requestAnimationFrame(loop);
}

// STARTを押すまで待機（最初の数体はstartGameで配置）
loop();
</script>
