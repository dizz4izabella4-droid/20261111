<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAWARAKA</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eeece4; font-family: "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","游ゴシック",YuGothic,Meiryo,"Noto Sans JP",sans-serif; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  :root { --ink: #3a3aa8; }
  .ui { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .ui button { border: 2px solid var(--ink); background: #fbfaf5; color: var(--ink); border-radius: 999px; padding: 8px 16px; font-size: 14px; cursor: pointer; font-family: inherit; transition: background .2s, color .2s, border-color .2s; }
  .ui button.on { background: var(--ink); color: #fbfaf5; }
  .chars { position: fixed; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
  .chars button { width: 58px; height: 58px; border-radius: 50%; border: 2px solid #c9c4b6; background: #fbfaf5; padding: 0; cursor: pointer; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(60,50,40,.12); transition: transform .15s, border-color .2s; }
  .chars button:hover { transform: scale(1.06); }
  .chars button.on { border-color: var(--ink); border-width: 3px; }
  .chars svg { width: 44px; height: 44px; }
  @media (max-width: 620px) {
    .ui { left: 12px; right: 84px; transform: none; justify-content: flex-start; }
    .ui button { padding: 7px 12px; font-size: 13px; }
  }
  .name { position: fixed; top: 36px; left: 0; right: 0; text-align: center; color: var(--ink); font-size: 22px; font-weight: bold; letter-spacing: .08em; pointer-events: none; }
  .anims { position: fixed; top: 14px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .anims .main { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--ink); background: #fbfaf5; color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0; box-shadow: 0 2px 6px rgba(60,50,40,.12); }
  .anims .main svg { width: 26px; height: 26px; }
  .anims .main.on { background: var(--ink); color: #fbfaf5; }
  .anims .list { display: none; flex-direction: column; align-items: flex-end; gap: 6px; max-height: calc(100vh - 170px); overflow-y: auto; padding: 2px; }
  body.anim .anims .list { display: flex; }
  .anims .chip { border: 2px solid var(--ink); background: #fbfaf5; color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px; }
  .anims .chip.on { background: var(--ink); color: #fbfaf5; }
  .anims .chip svg { width: 18px; height: 18px; }
  body.anim .ui, body.anim .hint { display: none; }
  .hint { position: fixed; top: 14px; left: 0; right: 0; text-align: center; color: #6a6a8a; font-size: 13px; pointer-events: none; }

  .dock { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(760px, calc(100% - 100px)); display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .dock .ui { position: static; transform: none; flex-wrap: nowrap; overflow-x: auto; max-width: 100%; padding: 2px; scrollbar-width: none; justify-content: flex-start; }
  .dock .ui::-webkit-scrollbar { display: none; }
  .dock .ui button { flex: none; }
  .row { display: flex; gap: 6px; max-width: 100%; overflow-x: auto; padding: 2px; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .row button { flex: none; border: 2px solid var(--ink); background: #fbfaf5; color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: bold; letter-spacing: .04em; cursor: pointer; font-family: inherit; }
  .row button.on { background: var(--ink); color: #fbfaf5; }
  .row button:disabled { opacity: .35; }
  .row button i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; border: 1.5px solid var(--ink); vertical-align: -1px; }
  #tray, #pal { display: none; }
  #pal.open { display: flex; }
  .lab { align-self: center; font-size: 11px; font-weight: bold; color: var(--ink); padding: 0 4px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .row button.sw { width: 28px; height: 28px; padding: 0; border-radius: 50%; border-width: 2px; }
  #ret { width: 140px; accent-color: var(--ink); }
  #tray.open { display: flex; }
  .toast { position: fixed; top: 74px; left: 0; right: 0; text-align: center; color: var(--ink); font-size: 13px; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity .3s; }
  .toast.on { opacity: 1; }
  @media (max-width: 900px) { .dock { left: 12px; right: 84px; width: auto; transform: none; align-items: flex-start; } }
  body.anim .dock, body.anim .toast { display: none; }

  .panel { display: none; }
  .panel.open { display: flex; }
  .dock { bottom: max(14px, env(safe-area-inset-bottom)); gap: 8px; }
  .row { flex-wrap: nowrap; }
  #pMore { flex-wrap: wrap; overflow: visible; }
  .row button { min-height: 40px; padding: 8px 14px; font-size: 13px; }
  .row button.sw { width: 36px; height: 36px; min-height: 0; }
  #ret { width: 130px; }
  .tabs { width: 100%; }
  .tabs button { flex: 1; min-width: 0; padding: 8px 0; font-size: 11px; letter-spacing: 0; }
  .big { display: flex; gap: 8px; width: 100%; }
  .big button { height: 58px; border-radius: 29px; border: 3px solid var(--ink); background: #fbfaf5; color: var(--ink); font-family: inherit; font-weight: bold; letter-spacing: .06em; cursor: pointer; font-size: 15px; }
  #bakeBtn { flex: 2.4; background: var(--ink); color: #fbfaf5; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  #bakeBtn:active { transform: scale(.97); filter: brightness(1.15); }
  #relaxBtn { flex: 1; }

  #pal { flex-direction: column; align-items: flex-start; gap: 8px; overflow: visible; }
  .subrow { display: flex; gap: 6px; align-items: center; max-width: 100%; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .subrow::-webkit-scrollbar { display: none; }
  .subrow > button:not(.sw) { flex: none; border: 2px solid var(--ink); background: #fbfaf5; color: var(--ink); border-radius: 999px; min-height: 34px; padding: 4px 10px; font-size: 12px; font-weight: bold; font-family: inherit; }
  .subrow > button.on { background: var(--ink); color: #fbfaf5; }
  .subrow .sw { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--ink); padding: 0; cursor: pointer; }
  .subrow .rainbow { position: relative; overflow: hidden; background: conic-gradient(#f44, #fd4, #4d6, #4cf, #84f, #f4a, #f44); }
  .subrow .rainbow input { position: absolute; inset: -6px; width: 60px; height: 60px; opacity: 0; cursor: pointer; }

  /* ---- UI色分け：タブごとに色を変え、開いたパネルも同じ色の枠にする。BAKEは朱赤で一番目立たせる ---- */
  :root { --c-str: #3a3aa8; --c-shape: #1f8a8a; --c-item: #3f8f3f; --c-color: #b8439a; --c-more: #5b6470; --c-multi: #b7791f; --c-bake: #e0442a; }
  .tabs button { border-color: var(--tc); color: var(--tc); background: #fbfaf5; }
  .tabs button.on { background: var(--tc); color: #fff; }
  /* Explicit, persistent mode selector — never cycles modes on repeated taps. */
.tool-modes { box-sizing:border-box; display:flex; width:100%; max-width:100%; overflow:visible;
  align-items:stretch; gap:6px; background:#fbfaf5f2; padding:5px; border:2px solid #c9c4b6;
  border-radius:17px; box-shadow:0 2px 8px #60504019; }
.tool-modes button { flex:1 1 0; min-width:0; min-height:46px; background:#fbfaf5; border:2px solid #c4c0c9;
  border-radius:13px; color:#4f4b57; font-size:14px; font-weight:800; padding:9px 3px; }
#modeSculpt { --mc:var(--c-str); } #modePlace { --mc:#7a4fc4; } #modeCamera { --mc:#313343; }
.tool-modes button.on, .tool-modes button[aria-pressed="true"] {
  color:#fff; background:var(--mc); border-color:var(--mc); box-shadow:0 2px 7px #31334329; }
.tool-modes button:focus-visible, #lightHandle:focus-visible { outline:3px solid #fc8d4d; outline-offset:2px; }
.light-handle { position:fixed; z-index:15; width:56px; height:56px; border-radius:50%;
  transform:translate(-50%,-50%); background:#fff6c5; color:#a26a10; border:3px solid #c28d23;
  box-shadow:0 0 0 6px #fff7cb73,0 0 25px #e6b64d99;
  font-size:30px; font-weight:bold; line-height:48px; padding:0; cursor:grab; touch-action:none; user-select:none; }
.light-handle[hidden] { display:none!important; }
.light-handle:active { cursor:grabbing; background:#ffe28a; }
#lightMoveBtn[aria-pressed="true"] { background:var(--c-more); color:#fff; }

  #tShape { --tc: var(--c-shape); } #plantBtn { --tc: var(--c-item); } #colorBtn { --tc: var(--c-color); } #tMore { --tc: var(--c-more); }
  #pShape { --pc: var(--c-shape); } #tray { --pc: var(--c-item); } #pal { --pc: var(--c-color); } #pMore { --pc: var(--c-more); } #multi { --pc: var(--c-multi); }
  .panel.open, #multi { background: rgba(251,250,245,.94); border: 2px solid var(--pc); border-radius: 18px; padding: 8px 10px; box-shadow: 0 3px 10px rgba(60,50,40,.14); }
  .panel button:not(.sw), #multi button, .panel .subrow > button:not(.sw) { border-color: var(--pc); color: var(--pc); }
  .panel button.on:not(.sw), #multi button.on, .panel .subrow > button.on { background: var(--pc); color: #fff; }
  #pMore { --pc: var(--c-more); } #pMore .lab, #multi .lab, #pal .lab { color: var(--pc); }
  #ret, #soft { width: 130px; accent-color: var(--c-more); }
  .grp { flex-basis: 100%; font-size: 10px; font-weight: bold; letter-spacing: .14em; color: var(--c-more); opacity: .75; padding: 2px 4px 0; }
  #undo, #reset { --pc: #8a5a2b; }
  #bakeBtn { flex: 2.4; height: 66px; border-radius: 33px; background: var(--c-bake); border: 3px solid #8f2412; color: #fff; font-size: 25px; box-shadow: 0 6px 16px rgba(224,68,42,.45); }
  #relaxBtn { flex: 1; height: 52px; align-self: center; background: #fbfaf5; border: 2px solid var(--c-more); color: var(--c-more); font-size: 14px; }

/* Selection arrow stays outside the game's touch input layer. */
.selected-arrow { position:fixed; z-index:8; pointer-events:none; transform:translate(-50%,-50%); color:#b8412e;
  font-size:32px; line-height:1; font-weight:900; text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,0 5px 6px #60574b88; }
.selected-arrow[hidden] { display:none!important; }
#lightX,#lightY,#lightZ { width:105px; accent-color:var(--c-more); }
.photo-crop { position:fixed; inset:0; z-index:40; display:grid; place-items:center; background:rgba(32,29,36,.72);
  padding:12px; overflow:auto; }
.photo-crop[hidden] { display:none!important; }
.crop-panel { box-sizing:border-box; background:#fbfaf5; color:#32313d; border-radius:20px;
  width:min(380px,94vw); padding:16px; display:flex; flex-direction:column; align-items:center; gap:10px;
  box-shadow:0 16px 50px #19182466; font:600 13px/1.6 inherit; }
.crop-panel strong { font-size:18px; }
.crop-panel canvas { width:min(320px,80vw); height:auto; aspect-ratio:1; touch-action:none;
  border:2px solid #aea8aa; border-radius:10px; cursor:move; }
.crop-panel label { display:flex; align-items:center; gap:10px; width:100%; justify-content:center; }
.crop-panel label input { width:70%; accent-color:#7c6b88; }
.crop-panel > span { font-size:12px; text-align:center; }
.crop-buttons { display:flex; justify-content:space-between; gap:10px; width:100%; }
.crop-buttons button { flex:1; background:#eeeae9; border:2px solid #99919a; border-radius:14px;
  padding:9px 7px; color:#38313e; font-weight:700; font-family:inherit; cursor:pointer; }
.crop-buttons #cropApply { background:#5a578b; color:#fff; border-color:#5a578b; }
#pal .pattern-row { display:flex; gap:5px; align-items:center; flex-wrap:nowrap; max-width:100%; overflow-x:auto; }
#pal .pattern-row button { flex:none; padding:7px 12px; border:2px solid #b8439a;
  border-radius:999px; background:#fffafa; color:#9b3383; font-weight:700; font-family:inherit; cursor:pointer; }
#pal .pattern-row button.on { background:#b8439a; color:#fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="name" id="cname"></div>
<div id="selectedArrow" class="selected-arrow" aria-hidden="true" hidden>▼</div>
<button type="button" id="lightHandle" class="light-handle" title="ひかりを うごかす" aria-label="ひかりを うごかす" hidden>☀</button>
<div class="anims">
  <button class="main" id="animBtn" title="あにめを みる" aria-label="あにめを みる">
    <svg id="animIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>
  </button>
  <div class="list">
    <button class="chip on" data-anim="hop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 19 q3.5 -9 7 0 q3.5 -9 7 0 q2.5 -6 6 -2"/><path d="M19 15 l3 2 l-1 -3.5"/></svg>
      ぴょんぴょん うごく
    </button>
    <button class="chip" data-anim="dance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8 q4 -4 8 0 q4 4 8 0"/><path d="M4 16 q4 -4 8 0 q4 4 8 0"/></svg>
      ゆらゆら おどる
    </button>
    <button class="chip" data-anim="spin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12 a8 8 0 1 1 -3 -6.2"/><path d="M17.5 2.5 l-0.5 3.8 l3.8 0.3"/></svg>
      くるっと とぶ
    </button>
    <button class="chip" data-anim="melt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 19 q0 -5 9 -5 q9 0 9 5 z"/><path d="M12 4 v5 M9.5 7 l2.5 2.5 l2.5 -2.5"/></svg>
      とろーん
    </button>
    <button class="chip" data-anim="surprise">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3 v12"/><circle cx="12" cy="20" r="1.2" fill="currentColor"/></svg>
      びっくり
    </button>
    <button class="chip" data-anim="bow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20 q0 -9 9 -10 q6 0 7 6"/><path d="M3 20 h18"/></svg>
      おじぎ
    </button>
    <button class="chip" data-anim="sleep">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13 h6 l-6 7 h6"/><path d="M13 4 h7 l-7 8 h7"/></svg>
      すやすや
    </button>
    <button class="chip" data-anim="look">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="12" r="3.2"/><circle cx="16" cy="12" r="3.2"/><path d="M2 12 h2.8 M19.2 12 H22"/></svg>
      きょろきょろ
    </button>
    <button class="chip" data-anim="happy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20 C5 15 3 11 3 8 a4.5 4.5 0 0 1 9 -1 a4.5 4.5 0 0 1 9 1 c0 3 -2 7 -9 12z"/></svg>
      うれしい
    </button>
    <button class="chip" data-anim="shake">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6 l-3 3 l3 3 l-3 3 l3 3"/><path d="M16 6 l3 3 l-3 3 l3 3 l-3 3"/></svg>
      ぶるぶる
    </button>
    <button class="chip" data-anim="angry">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 3 v4 M15 3 v4 M3 9 h4 M3 15 h4 M17 9 h4 M17 15 h4 M9 17 v4 M15 17 v4"/></svg>
      ぷんぷん
    </button>
    <button class="chip" data-anim="stretch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21 V4 M7.5 8 L12 3.5 L16.5 8"/><path d="M5 21 h14"/></svg>
      のびー
    </button>
  </div>
</div>
<div class="hint" id="hint">からだを ひっぱって かたちを かえてね</div>
<div class="dock">
  <div class="row" id="multi"><button id="copyBtn">ふやす</button><span class="lab" id="cnt">1 / 12</span></div>
  <div class="row panel" id="pShape"><button id="hp">たかく</button><button id="hm">ひくく</button><button id="wp">ひろく</button><button id="wm">ほそく</button></div>
  <div class="row panel" id="tray" aria-label="item"></div>
  <div class="row panel" id="pal" aria-label="color"></div>
  <div class="row panel" id="pMore">
    <label class="lab" style="flex-basis:100%">やわらかさ <input type="range" id="soft" min="0" max="1" step="0.05" value="0.55"> <span id="softv">やわらかい</span></label>
    <label class="lab" style="flex-basis:100%">もどるはやさ <input type="range" id="ret" min="0.2" max="4.2" step="0.05" value="4"> <span id="retv">4 びょう</span></label>
    <span class="grp">へんしゅう</span>
    <button id="undo">ひとつもどす</button><button id="reset">はじめから</button>
    <span class="grp">みため</span>
    <button id="mochi">おもち</button><button id="line">せん</button><button id="snd" class="on">おと</button>
    <span class="grp">ひかりの ばしょ</span>
    <button type="button" id="lightMoveBtn" aria-pressed="false">ひかりを うごかす</button>
    <label class="lab">よこ <input type="range" id="lightX" min="-8" max="8" step="0.5" value="3"></label>
    <label class="lab">たかさ <input type="range" id="lightY" min="2" max="12" step="0.5" value="6"></label>
    <label class="lab">おくゆき <input type="range" id="lightZ" min="-8" max="8" step="0.5" value="4"></label>
    <span class="grp">ほぞん と なかま</span>
    <button id="photoSave" type="button" title="つくった こを しゃしんに ほぞん">しゃしんにほぞん</button>
    <button id="sendWW" type="button" title="なかまに とうろく">なかまに とうろく</button>
  </div>
  <div class="row tool-modes" id="toolModes" role="group" aria-label="そうさを えらぶ" data-m="sculpt">
    <button id="modeSculpt" type="button" class="on" aria-pressed="true">のばす</button>
    <button id="modePlace" type="button" aria-pressed="false">おく</button>
    <button id="modeCamera" type="button" aria-pressed="false">みまわす</button>
  </div>
  <div class="row tabs">
    <button id="tShape">かたち</button><button id="plantBtn">かざり</button><button id="colorBtn">いろ</button><button id="tMore">くわしく</button>
  </div>
  <div class="big">
    <button id="bakeBtn"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg>かためる</button>
    <button id="relaxBtn">ゆっくりもどす</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<input id="photoTextureInput" type="file" accept="image/*" hidden>
<div id="cropDialog" class="photo-crop" role="dialog" aria-label="しゃしんを きりとる" aria-modal="true" hidden>
  <div class="crop-panel">
    <strong>しゃしんを きりとる</strong>
    <canvas id="cropCanvas" width="320" height="320" aria-label="しゃしんの きりとり"></canvas>
    <label>おおきさ <input id="cropZoom" type="range" min="1" max="3.5" step="0.05" value="1"></label>
    <span>しゃしんを うごかして きりとる ばしょを きめてね</span>
    <div class="crop-buttons"><button id="cropCancel" type="button">やめる</button><button id="cropApply" type="button">きりとって はる</button></div>
  </div>
</div>
<div class="chars" aria-label="こを えらぶ">
  <button id="ch-neko" title="ぬおん" aria-label="ぬおん">
    <svg viewBox="0 0 48 48" fill="none" stroke="#3a3aa8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21 L10 10 L17 15 M31 15 L38 10 L39 21" fill="#fbf8ef"/>
      <path d="M17 15 Q24 12.5 31 15 Q41 17 41 28 Q41 38 24 38 Q7 38 7 28 Q7 17 17 15Z" fill="#fbf8ef"/>
      <path d="M13 26 L18 23 M35 26 L30 23"/>
      <path d="M21.5 26.5 q1.25 1.8 2.5 0 q1.25 1.8 2.5 0" stroke-width="1.8"/>
    </svg>
  </button>
  <button id="ch-mebae" title="んちょめちょぽ" aria-label="んちょめちょぽ">
    <svg viewBox="0 0 48 48" fill="none" stroke="#5b3a2e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 16 V10"/>
      <ellipse cx="18.5" cy="9" rx="5.5" ry="3.4" fill="#c5e3c8"/>
      <ellipse cx="29.5" cy="9" rx="5.5" ry="3.4" fill="#c5e3c8"/>
      <path d="M7 38 Q6 16 24 16 Q42 16 41 38 Z" fill="#efe9d6"/>

    dance:["ゆらゆら おどる","ゆらゆらダンス"],
    spin:["くるっと とぶ","回転ジャンプ"],
    melt:["とろーん","とろける"],
    surprise:["びっくり","驚く"],
    bow:["おじぎ","お辞儀"],
    sleep:["すやすや","睡眠"],
    look:["きょろきょろ","見回す"],
    happy:["うれしい","喜ぶ"],
    shake:["ぶるぶる","震える"],
    angry:["ぷんぷん","怒る"],
    stretch:["のびー","伸びる"]
  };
  const groups = {
    "EDIT":["へんしゅう","編集"],"SCENE":["みため","表示"],
    "PHOTO / WHERE WHICH":["ほぞん と なかま","保存と連携"]
  };
  const toasts = {
    "BAKED: this is the new base shape":["いまの かたちで かためました","今の形で固定しました"],
    "BAKED a little":["かためました","固定しました"],
    "LIMIT":["これいじょう かえられません","変更できる範囲を超えています"],
    "RESET":["はじめの かたちに もどしました","初期状態に戻しました"],
    "Pulled out! Pick something to plant":["かざりを えらんでね","装飾を選んでください"],
    "MAX 12":["12こまで ふやせます","最大12体です"],
    "COPIED at the same spot · ROW / STACK / MOVE to arrange":["ふやしました。ならべかたを えらんでね","複製しました。配置を選んでください"],
    "Last one stays":["さいごの ひとつは のこります","最後の1体は削除できません"],
    "ITEM COPIED":["かざりを ふやしました","装飾を複製しました"],
    "COPY first":["さきに こを ふやしてね","先にキャラを複製してください"],
    "Lined up · COPY adds to the row":["ならべました","整列しました"],
    "Stacked · COPY keeps stacking":["かさねました","積み重ねました"],
    "Free layout":["じゆうに おけます","自由配置にしました"],
    "MOCHI MODE · no face":["かおを かくしました","顔を非表示にしました"],
    "Face back":["かおを もどしました","顔を表示しました"],
    "PNG DOWNLOAD":["しゃしんを ほぞんしました","PNGを保存しました"],
    "PHOTO SAVE FAILED":["しゃしんを ほぞんできません","写真を保存できませんでした"],
    "REGISTER FAILED: 保存領域を確認":["とうろくできません。ほぞんりょういきを かくにん","登録できません。保存領域をご確認ください"],
    "WHERE WHICHへ登録しました":["なかまに とうろくしました","WHERE WHICHに登録しました"],
    "写真は共有メニューから保存できます":["きょうゆう から しゃしんを ほぞんしてね","共有メニューから写真を保存できます"],
    "24キャラまで登録できます":["とうろくは 24こまでです","登録上限は24体です"]
  };
  let mode = "hiragana",running = false;
  try { mode = localStorage.getItem(KEY)==="kanji"?"kanji":"hiragana"; }catch(e){}
  const $ = id => document.getElementById(id);
  function replaceText(el, text, preserveIcon){
    if(!el) return;
    if(preserveIcon){
      const txt=[...el.childNodes].find(n=>n.nodeType===Node.TEXT_NODE);
      if(txt){if(txt.nodeValue!==text)txt.nodeValue=text;}
      else el.appendChild(document.createTextNode(text));
    } else if(el.textContent!==text)el.textContent=text;
  }
  function directText(el, text){
    const txt=[...el.childNodes].find(n=>n.nodeType===Node.TEXT_NODE);
    if(txt && txt.nodeValue.trim()!==text)txt.nodeValue=text+" ";
  }
  function translateFree(el, dictionary){
    if(!el) return;
    const found=Object.keys(dictionary).find(k=>el.textContent.trim()===k || dictionary[k].includes(el.textContent.trim()));
    if(found)replaceText(el,dictionary[found][mode==="kanji"?1:0]);
  }
  function redraw(){
    running=false;
    const k=mode==="kanji"?1:0;
    for(const [id,pair] of Object.entries(labels))replaceText($(id),pair[k],id==="bakeBtn");
    const which=$("toolModes")?.dataset.m || "sculpt";
    replaceText($("hint"),hint[which][k]);
    const val=$("soft")?parseFloat($("soft").value):.55;
    replaceText($("softv"),([["かたい","硬い"],["ふつう","普通"],["やわらかい","柔らかい"],["とてもやわらかい","非常に柔らかい"]])[val<.2?0:val<.45?1:val<.7?2:3][k]);
    const sec=$("ret")?Number($("ret").value):4;
    replaceText($("retv"),sec>=4.15?["そのまま","保持"][k]:(Math.min(sec,4).toFixed(2).replace(/0$/,"")+" "+["びょう","秒"][k]));
    for(const chip of document.querySelectorAll(".anims .chip[data-anim]")){
      const row=animations[chip.dataset.anim];
      if(row)replaceText(chip,row[k],true);
    }
    const animButton=$("animBtn");
    if(animButton){
      animButton.title=["あにめを みる","アニメーションを再生"][k];
      animButton.setAttribute("aria-label",animButton.title);
    }
    const heading=$("yawaraka-lang-heading");
    if(heading){const label=["ことばの せってい","表示言語の設定"][k];if(heading.textContent!==label)heading.textContent=label;}
    for(const [i,title] of [...document.querySelectorAll("#tray button")].entries()){
      const entry=titles[Object.keys(titles)[i]];
      if(entry)replaceText(title,entry[k],true);
    }
    for(const el of document.querySelectorAll("#pal .subrow .lab")){
      const idx=el.closest(".subrow")===document.querySelector("#pal .subrow")?0:1;
      replaceText(el,idx?["かざり","装飾"][k]:["からだ","本体"][k]);
    }
    document.querySelectorAll("#pMore .grp").forEach(el=>translateFree(el,groups));
    const lab=$("soft")?.closest("label");if(lab)directText(lab,["やわらかさ","柔らかさ"][k]);
    const lab2=$("ret")?.closest("label");if(lab2)directText(lab2,["もどるはやさ","復元時間"][k]);
    for(const [id,pair] of [["lightX",["よこ","左右"]],["lightY",["たかさ","高さ"]],["lightZ",["おくゆき","奥行き"]]]){
      const label=$(id)?.closest("label");if(label)directText(label,pair[k]);
    }
    const lang=$("yawaraka-lang");if(lang){const label=["ことば：ひらがな（おして かんじへ）","表示言語：漢字（押すとひらがな）"][k];if(lang.textContent!==label)lang.textContent=label;}
    if($("toast"))translateFree($("toast"),toasts);
    const photo=$("photoSave"),send=$("sendWW");
    if(photo)photo.title=["とうめいな しゃしんを ほぞん","透明PNG画像を保存"][k];
    if(send)send.title=["なかまに とうろく","WHERE WHICHへ登録"][k];
    const lh=$("lightHandle"); if(lh){
      lh.title=["ひかりを うごかす","光源をドラッグ"][k];
      lh.setAttribute("aria-label",lh.title);
    }
    const modes=$("toolModes"); if(modes)modes.setAttribute("aria-label",["そうさを えらぶ","操作を選択"][k]);
  }
  function schedule(){if(mode!=="kanji")return;requestAnimationFrame(redraw);}
  function init(){
    const more=$("pMore");
    if(!more)return;
    const heading=document.createElement("span");heading.className="grp";heading.textContent="ことばの せってい";
    heading.id="yawaraka-lang-heading";
    const btn=document.createElement("button");btn.id="yawaraka-lang";btn.type="button";
    btn.onclick=()=>{
      mode=mode==="hiragana"?"kanji":"hiragana";
      try{localStorage.setItem(KEY,mode);}catch(e){}
      redraw();
    };
    more.append(heading,btn);
    const dock=document.querySelector(".dock");
    if(dock)dock.addEventListener("click",schedule);
    for(const id of ["ret","soft"]){const el=$(id);if(el)el.addEventListener("input",schedule);}
    redraw();
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init,{once:true});
  else init();
})();
</script>
</body>
</html>
