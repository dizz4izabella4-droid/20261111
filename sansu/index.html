<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.7}

<body>
<main>
<h1>考える算数</h1>
<p class="lead">大人の学び直し向け。「小学生」「中学生」を切りかえて、基礎から順に学べます。答えだけでなく「なぜそうなるか」を言葉にしよう。画面下の「これが活きる場面」で、仕事や日常とのつながりも確認できます。3問連続で正解するとレベルアップ(小学生: Lv1=小1〜3・Lv2=小4・Lv3=小5〜6 / 中学生: Lv1=中1・Lv2=中2・Lv3=中3)。</p>
<div class="row" id="tiers" style="margin-bottom:12px"><button class="s" id="tS" style="flex:1">小学生</button><button class="s" id="tM" style="flex:1">中学生</button></div>
<div class="grid" id="mods"></div>
<div class="row" style="margin-top:12px;align-items:center;justify-content:space-between"><span class="meta" id="day"></span><button class="s" id="rv"></button></div>
<div class="card">
  <div class="meta"><span id="mname"></span><span><select id="lvs" aria-label="レベル"><option value="1">Lv1 中1</option><option value="2">Lv2 中2</option><option value="3">Lv3 中3</option></select> <span id="mstat"></span></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="q" id="q"></div>
  <div class="row"><input id="in" type="text" autocomplete="off" placeholder="答え(分数は 3/4 の形)"><button class="p" id="go">答える</button></div>
  <div class="row" style="margin-top:8px"><button class="s" id="hb">ヒント</button><button class="s" id="dk">わからない</button><button class="s" id="nx" style="display:none">つぎの問題</button></div>
  <div class="hint" id="hint"></div>
  <div class="fb" id="fb" aria-live="polite"></div>
<div class="qt" id="qt"></div>
</div>
<div class="card" id="les"><div class="meta"><span id="tn">先生のミニ授業</span><span id="stp"></span></div><div class="lt" id="lt"></div><div id="stg"></div><div class="say"><span class="av" id="av"></span><p id="say" aria-live="polite"></p></div><div class="row" style="margin-top:10px"><button class="s" id="pv">もどる</button><button class="p" id="nt">つぎへ</button><button class="s" id="lk" style="margin-left:auto">この問題で見る</button></div></div>
<div class="card use" id="use"></div>
<p class="lead" style="font-size:12px;margin-top:16px">※ 先生の語りは学習用に創作したイメージで、ご本人の言葉ではありません。名言は記録にもとづくものを選び、確かでないものには「伝承」と記しています。</p>
<button class="s" id="rs" style="font-size:12px">学習記録をリセット</button>
</main>
<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const gcd=(a,b)=>b?gcd(b,a%b):a,lcm=(a,b)=>a/gcd(a,b)*b,pick=a=>a[R(0,a.length-1)],ms=n=>n<0?'−'+(-n):''+n,sg=n=>'('+(n<0?'−':'+')+Math.abs(n)+')',fr=(n,d)=>{const g=gcd(n,d);return n/g+'/'+d/g},tm=n=>(n<0?' − ':' + ')+Math.abs(n),nz=(a,b)=>{let v;do{v=R(a,b)}while(!v);return v},cx=a=>(a<0?'−':'')+(Math.abs(a)===1?'':Math.abs(a))+'x',rd=n=>Math.round(n*100)/100;
const G0={
calc:L=>{
 if(L===1){const t=R(0,2);
  if(t===0){const A=R(12,98),B=R(3,9),ans=A*B/100;return{q:`${A/10} × ${B/10} = ?`,a:ans,h:'小数点を無視して整数のかけ算をし、あとで小数点以下の桁数(合わせて2桁)だけ戻そう。',e:`${A}×${B}=${A*B}。小数点以下が1桁+1桁=2桁なので ${ans}。`}}
  if(t===1){const Q=R(12,98),B=R(2,9),D=Q*B;return{q:`${D/10} ÷ ${B} = ?`,a:Q/10,h:'小数点の位置をそろえたまま、整数と同じように割ろう。',e:`${D/10}÷${B}=${Q/10}。たしかめ算: ${Q/10}×${B}=${D/10}。`}}
  let p=R(2,8),q=R(2,8);while(q===p)q=R(2,8);const l=lcm(p,q),n=l/p+l/q;
  return{q:`1/${p} + 1/${q} = ?(分数で入力。例 5/6)`,a:n/l,s:fr(n,l),h:'分母の最小公倍数にそろえて(通分して)たそう。',e:`分母の最小公倍数は${l}。${l/p}/${l} + ${l/q}/${l} = ${n}/${l} = ${fr(n,l)}。`}}
 if(L===2){const t=Math.random();
  if(t<.5){let a,d;do{a=nz(-9,9);d=nz(-9,9)}while(Math.abs(a+d)>10);const sub=Math.random()<.5,expr=sub?sg(a)+' − '+sg(-d):sg(a)+' + '+sg(d);
   return{q:`${expr} = ?`,a:a+d,h:sub?'ひき算は「ひく数の符号を反対にしたたし算」に直せる。数直線で考えよう。':'正の数をたすと右へ、負の数をたすと左へ動く。数直線で考えよう。',e:`${sub?sg(a)+' + '+sg(d)+' と考える。':''}数直線で ${ms(a)} から${d>0?'右':'左'}へ${Math.abs(d)}動くと ${ms(a+d)}。`,p:{t:'nl',a,d,expr,note:sub?'ひき算は「符号を反対にしたたし算」に直して考えます。':''}}}
  const s1=pick([-1,1]),s2=pick([-1,1]);
  if(t<.75){const a=s1*R(2,9),b=s2*R(2,9);return{q:`${sg(a)} × ${sg(b)} = ?`,a:a*b,h:'まず符号(同じなら+、ちがえば−)、次に数の大きさのかけ算。',e:`符号は${a*b>0?'同じなので+':'ちがうので−'}。${Math.abs(a)}×${Math.abs(b)}=${Math.abs(a*b)}。答えは ${ms(a*b)}。`}}
  const b=s1*R(2,9),k=s2*R(2,9),a=b*k;return{q:`${ms(a)} ÷ ${sg(b)} = ?`,a:k,h:'わり算も、まず符号(同じなら+、ちがえば−)を決める。',e:`符号は${k>0?'同じなので+':'ちがうので−'}。${Math.abs(a)}÷${Math.abs(b)}=${Math.abs(k)}。答えは ${ms(k)}。`}}
 const a=R(2,9),b=R(2,9),c=R(2,9),d=R(2,9),t=R(0,3),H='かっこ → 累乗 → かけ算・わり算 → たし算・ひき算 の順に計算しよう。';
 if(t===0)return{q:`${a} − ${b} × (−${c}) = ?`,a:a+b*c,h:H,e:`先に ${b}×(−${c})=${ms(-b*c)}。${a} − (${ms(-b*c)}) = ${a} + ${b*c} = ${a+b*c}。`};
 if(t===1)return{q:`(−${a})² + ${b} × ${c} = ?`,a:a*a+b*c,h:H,e:`(−${a})²=${a*a}、${b}×${c}=${b*c}。合わせて ${a*a+b*c}。`};
 if(t===2)return{q:`−${a}² + ${b} = ?`,a:-a*a+b,h:'−a² は「a²に−をつけたもの」。(−a)² とはちがうので注意。',e:`−${a}² = −(${a}×${a}) = −${a*a}。(−${a})²なら ${a*a} でちがいます。−${a*a} + ${b} = ${ms(-a*a+b)}。`};
 return{q:`${a} + ${b} × (${c} − ${d}) = ?`,a:a+b*(c-d),h:H,e:`かっこの中 ${c}−${d}=${ms(c-d)}。${b}×(${ms(c-d)})=${ms(b*(c-d))}。${a} + (${ms(b*(c-d))}) = ${ms(a+b*(c-d))}。`}},
ratio:L=>{const t=R(0,3);
 if(L===1){
  if(t===0){const v=R(2,15)*4,m=pick([15,30,45,90]);return{q:`時速${v}kmで${m}分間走ると、何km進む?`,a:v*m/60,h:`${m}分は ${m}/60 時間。距離=速さ×時間。`,e:`${m}分=${m/60}時間。${v}×${m/60}=${v*m/60}km。`}}
  if(t===1){const pr=R(2,40)*100,d=pick([10,20,30,50]),a=pr*(100-d)/100;return{q:`${pr}円の商品が${d}%引き。支払う金額は?`,a,p:{t:'pct',pr,d},h:`${d}%引きなら、のこりは${100-d}%。`,e:`${d}%引き = ${100-d}%を払う。10%=${pr/10}円を基準にすると、${pr}×${(100-d)/100}=${a}円。`}}
  if(t===2){const w=pick([20,25,50]),n=R(1,w-1),a=n*100/w;return{q:`${w}人のクラスで${n}人が電車通学。割合は何%?`,a,h:'割合 = 比べる量 ÷ もとにする量。100倍して%に。',e:`${n}÷${w}=${n/w}。100倍して${a}%。`}}
  if(Math.random()<.5){const a=R(2,9),b=R(2,9),k=R(2,9);return{q:`${a}:${b} = □:${b*k}`,a:a*k,h:'後ろの比の値は何倍になっている?',e:`${b}→${b*k}は${k}倍。前も${k}倍して ${a}×${k}=${a*k}。`}}
  const a=R(2,5),b=R(a+1,8),k=R(2,9);return{q:`${(a+b)*k}円を ${a}:${b} に分けるとき、多い方は何円?`,a:b*k,h:`全体は ${a+b} つぶん。1つぶんは?`,e:`全体は${a}+${b}=${a+b}。1つぶん=${(a+b)*k}÷${a+b}=${k}円。多い方は ${b}×${k}=${b*k}円。`}}
 if(L===2){
  if(t===0){const T=pick([100,200,400,500]),p=pick([3,4,5,6,8,10,12,15]),s=T*p/100;return{q:`食塩${s}gを水に溶かして ${T}g の食塩水を作った。濃度は何%?`,a:p,h:'濃度 = 食塩 ÷ 食塩水全体 × 100。',e:`${s}÷${T}=${s/T}、100倍して${p}%。「全体」は食塩水(水+食塩)です。`}}
  if(t===1){const T=pick([100,200,400,500]),p=pick([3,4,5,6,8,10,12,15]);return{q:`${T}gの${p}%の食塩水に含まれる食塩は何g?`,a:T*p/100,h:'食塩 = 全体 × 濃度。',e:`${T}×${p/100}=${T*p/100}g。`}}
  if(t===2){const b=R(1,10)*20,p=pick([10,20,25,30,50]),n=b*(100+p)/100;return{q:`${b}が${n}に増えた。増加率は何%?`,a:p,h:'増加率 = 増えた量 ÷ もとの量。',e:`増えた量 ${n-b} ÷ もとの ${b} = ${(n-b)/b} → ${p}%。もとにする量は「増える前」の値です。`}}
  const o=R(2,20)*100,p=pick([10,20,25,30,40]),pay=o*(100-p)/100;return{q:`${p}%引きで買ったら${pay}円だった。元の値段は?`,a:o,h:`元の値段を□とすると □×${(100-p)/100}=${pay}。`,e:`${pay}÷${(100-p)/100}=${o}円。支払額は元の${100-p}%にあたるので、割って元にもどします。`}}
 if(t===0){const b=R(1,10)*10000;return{q:`${b}円を年10%で2年預けた(複利)。いくらになる?`,a:b*121/100,h:'1年目の終わりに1.1倍。2年目はその金額がさらに1.1倍。',e:`1年目: ${b*11/10}円、2年目: ${b*121/100}円。利息にも利息がつくので、単利(${b*12/10}円)より多い。`}}
 if(t===1){const[v1,v2]=pick([[40,60],[30,60],[60,90],[20,30],[12,36]]),l=lcm(v1,v2),T=l/v1+l/v2,a=2*l/T;return{q:`行きは時速${v1}km、帰りは時速${v2}kmで同じ道を往復した。平均の速さは時速何km?`,a,h:'単純平均ではありません。道のりを仮に決めて、かかった時間を求めよう。',e:`片道を${l}kmとすると往復${2*l}km。時間は ${l/v1}+${l/v2}=${T}時間。平均=${2*l}÷${T}=${a}km/h。`}}
 if(t===2){const[w1,p1,w2,p2]=pick([[200,5,300,10],[100,4,300,8],[300,6,200,11],[400,5,100,10]]),s=w1*p1/100+w2*p2/100,a=s*100/(w1+w2);return{q:`${w1}gの${p1}%食塩水と${w2}gの${p2}%食塩水を混ぜた。濃度は何%?`,a,h:'濃度の平均ではなく、食塩の重さの合計と全体の重さで考える。',e:`食塩: ${w1*p1/100}+${w2*p2/100}=${s}g。全体: ${w1+w2}g。${s}÷${w1+w2}×100=${a}%。`}}
 const[x,y]=pick([[6,3],[12,6],[10,15],[20,30],[4,12]]),a=x*y/(x+y);return{q:`Aさんは1人で${x}日、Bさんは1人で${y}日で終わる仕事がある。2人で一緒にやると何日?`,a,h:'全体の仕事を1として、1日にできる量(1/'+x+' と 1/'+y+')をたす。',e:`1日で 1/${x}+1/${y} = ${x+y}/${x*y}。全体1を割って ${x*y}/${x+y}=${a}日。`}},
alg:L=>{const t=R(0,2);
 if(L===1){
  if(t<2){const a=R(2,9),b=nz(-9,9),x=R(-5,6);return{q:`x = ${ms(x)} のとき、${a}x${tm(b)} の値は?`,a:a*x+b,h:'文字に数を代入する。負の数はかっこをつけて計算しよう。',e:`${a}×(${ms(x)})${tm(b)} = ${ms(a*x)}${tm(b)} = ${ms(a*x+b)}。`}}
  const a=R(-5,6),b=R(-5,6),p=R(2,5),q=R(2,5);return{q:`a = ${ms(a)}、b = ${ms(b)} のとき、${p}a − ${q}b の値は?`,a:p*a-q*b,h:'a と b にそれぞれ代入。ひく相手が負の数なら符号に注意。',e:`${p}×(${ms(a)}) − ${q}×(${ms(b)}) = ${ms(p*a)} − (${ms(q*b)}) = ${ms(p*a-q*b)}。`}}
 if(L===2){
  if(t<2){const a=R(2,6),b=nz(-12,12),x=nz(-9,9),c=a*x+b;return{q:`${a}x${tm(b)} = ${ms(c)}`,a:x,p:(x>0&&b>0&&c<=60)?{t:'lin',a,b,x}:null,h:`まず ${b>0?'+':'−'}${Math.abs(b)} を右辺へ移項する(符号が変わる)。`,e:`両辺から ${b} を${b>0?'ひく':'たす'}と ${a}x=${ms(c-b)}。両辺を${a}で割って x=${ms(x)}。`}}
  const a=R(3,7),c=R(1,a-1),x=nz(-8,8);let b=nz(-10,10),d=a*x+b-c*x;while(!d){b=nz(-10,10);d=a*x+b-c*x}
  return{q:`${a}x${tm(b)} = ${c}x${tm(d)}`,a:x,h:'x の項を左辺、数の項を右辺に集めよう(移項)。',e:`${a}x−${c}x = ${ms(d)}−(${ms(b)}) → ${a-c}x=${ms(d-b)} → x=${ms(x)}。`}}
 if(t===0){const a=pick([2,3,4,5]),k=R(-6,9),b=R(1,9),c=k+b;return{q:`x/${a} + ${b} = ${ms(c)}`,a:a*k,h:`両辺に${a}をかけて、分母をはらおう。`,e:`両辺×${a}: x + ${a*b} = ${ms(a*c)} → x=${ms(a*c-a*b)}。`}}
 if(t===1){const x=R(-5,9),y=R(-5,9),S=x+y,D=x-y,ask=Math.random()<.5;return{q:`x + y = ${ms(S)}、x − y = ${ms(D)} のとき、${ask?'x':'y'} の値は?`,a:ask?x:y,h:ask?'2つの式を左辺どうし・右辺どうしでたすと、y が消える。':'上の式から下の式をひくと、x が消える。',e:ask?`たすと 2x=${ms(S+D)} → x=${ms(x)}。`:`ひくと 2y=${ms(S-D)} → y=${ms(y)}。`}}
 const m=R(3,6),n=R(2,m-1),dd=m-n,x=R(2,12),a=R(1,x*dd-1),b=x*dd-a;return{q:`ある数の${m}倍から${a}をひくと、その数の${n}倍に${b}をたした数と等しい。ある数は?`,a:x,h:`ある数を x とおいて式にしよう: ${m}x − ${a} = ${n}x + ${b}`,e:`${m}x−${n}x=${b}+${a} → ${dd}x=${a+b} → x=${x}。`}},
func:L=>{const t=R(0,2);

alg:L=>{
 if(L===1){const t=R(0,3);

 if(L===2){const t=R(0,2);
