<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>追跡</title></head><body>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
/* ==== 00_core.js ==== */
/**
 * @file    src/00_core.js
 * @card    C1b, C1c, C9
 * @author  ソフィア (Claude Sonnet 5.5, claude.ai chat)
 * @author  Codex GPT-6 Sol
 * @date    2026-11-23
 * @revision 4
 */
/* 00_core.js — 追跡 core (C1)
 * 設計書 v1.1 §3 準拠。担当: M1 core
 * 提供: G.define / G.bus / G.E / G.KS / G.rng / G.state / G.assets / G.start()
 * 未登録のモジュールは、このファイル内のスタブで補う（部屋の箱・WASD・クリック発砲つき）。
 * 追加した状態: state.introEndAt（intro の字幕が終わる state.time。killer は「これ + 3 秒」で THREATEN へ）
 */
(function (global) {
  'use strict';

  const G = (global.G = {});
  G.version = 'c1-1';
  G.assets = {}; // 01_assets.js が Object.assign で埋める
  G.stats = { calls: 0, tris: 0 }; // C1c/K3: 毎フレーム上書きする描画数（作り直さない）
  let lastCalls = 0;
  let lastTris = 0;
  // C1c/K2: 画像アセット（tex_ / decal_）だけを数える。bgm など音源は数に入れない
  function countImageAssets() {
    let n = 0;
    const keys = Object.keys(G.assets);
    for (let i = 0; i < keys.length; i++) {
      if (keys[i].indexOf('tex_') === 0 || keys[i].indexOf('decal_') === 0) n++;
    }
    return n;
  }
  G._countImageAssets = countImageAssets; // テスト専用

  G.cfg = {
    debug: false,
    seed: 1337,
    pixelRatioMax: 1.5,
    skipIntro: false,
    winDelay: 1.4, // killer が DEATH に入ってから win 画面までの秒数
    loseDelay: 0.8, // プレイヤーが斧で死亡してから lose 画面までの秒数
    loadBudgetMs: 2000,
    expectedAssets: 13,
    room: { xMin: -4, xMax: 4, zMin: -7, zMax: 5, height: 3 },
    eyeStart: [0, 1.65, 4],
    killerStart: [0, 0, -5.6],
    introLines: [
      { at: 0.3, ms: 2800, text: '……暗い。何かが、いる。' },
      { at: 3.4, ms: 2400, text: '動くな。銃を構えろ。' },
    ],
  };

  // ---- 定数 ---------------------------------------------------------------
  G.E = Object.freeze({
    GAME_START: 'game:start',
    GAME_RESET: 'game:reset',
    PLAYER_FIRE: 'player:fire',
    HIT: 'hit',
    PLAYER_STEP: 'player:step',
    PLAYER_DAMAGED: 'player:damaged',
    KILLER_STATE: 'killer:state',
    KILLER_STEP: 'killer:step',
    KILLER_VOCAL: 'killer:vocal',
    KILLER_SWING: 'killer:swing',
    LIGHT_FLICKER: 'light:flicker',
    SUBTITLE: 'subtitle',
  });
  G.KS = Object.freeze({
    IDLE: 'IDLE',
    THREATEN: 'THREATEN',
    RETREAT: 'RETREAT',
    CORNERED: 'CORNERED',
    CHARGE: 'CHARGE',
    ATTACK: 'ATTACK',
    HIT: 'HIT',
    DEATH: 'DEATH',
  });
  const E = G.E;
  const KS = G.KS;

  // ---- 状態（書き込めるのは担当モジュールだけ。core は phase / time / introEndAt）----
  G.state = { phase: 'loading', playerDead: false, killerWounds: 0, time: 0, introEndAt: 0 };
  const state = G.state;
  const runStats = { shots: 0, hits: 0, headshots: 0, time: 0 };

  // ---- 乱数 mulberry32（Math.random は使わない）--------------------------------
  function mulberry32(seed) {
    let a = seed >>> 0;
    const f = function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.reset = function () {
      a = G.cfg.seed >>> 0;
    };
    return f;
  }
  G.rng = mulberry32(G.cfg.seed);

  // ---- イベントバス ---------------------------------------------------------
  const validEvents = new Set(Object.values(E));
  const handlers = new Map();
  const evLog = []; // debug 中だけ記録
  const EV_LOG_MAX = 200;
  const errors = [];

  function checkName(name, where) {
    if (validEvents.has(name)) return true;
    const msg = '[bus] 未定義のイベント名 "' + name + '" (' + where + ') — G.E の定数を使うこと';
    console.error(msg);
    errors.push(msg);
    if (G.cfg.debug) throw new Error(msg);
    return false;
  }
  function snapshot(payload) {
    if (payload === undefined) return '';
    try {
      return JSON.stringify(payload, function (k, v) {
        const o = this[k];
        if (o && o.isVector3) return [r2(o.x), r2(o.y), r2(o.z)];
        if (o && o.isObject3D) return '[Obj3D ' + (o.name || o.type) + ']';
        if (typeof v === 'number') return r2(v);
        return v;
      });
    } catch (e) {
      return '[unserializable]';
    }
  }
  function r2(n) {
    return Math.round(n * 100) / 100;
  }
  G.bus = {
    log: evLog,
    on(name, fn) {
      checkName(name, 'on');
      let l = handlers.get(name);
      if (!l) handlers.set(name, (l = []));
      l.push(fn);
      return function () {
        G.bus.off(name, fn);
      };
    },
    off(name, fn) {
      const l = handlers.get(name);
      if (!l) return;
      const i = l.indexOf(fn);
      if (i >= 0) l.splice(i, 1);
    },
    emit(name, payload) {
      if (!checkName(name, 'emit')) return;
      if (G.cfg.debug) {
        evLog.push({ t: state.time, name: name, text: snapshot(payload) });
        if (evLog.length > EV_LOG_MAX) evLog.shift();
      }
      const l = handlers.get(name);
      if (!l) return;
      const copy = l.slice();
      for (let i = 0; i < copy.length; i++) {
        try {
          copy[i](payload, name);
        } catch (e) {
          reportError('handler(' + name + ')', e);
        }
      }
    },
  };
  G.bus.on(E.PLAYER_FIRE, function () { runStats.shots++; });
  G.bus.on(E.HIT, function (e) {
    if (e.owner === 'killer' && e.target !== 'wall' &&
        (e.zone === 'head' || e.zone === 'torso' || e.zone === 'limb')) {
      runStats.hits++;
      if (e.zone === 'head') runStats.headshots++;
    }
  });

  function reportError(where, e) {
    const msg = where + ': ' + (e && e.message ? e.message : e);
    console.error(msg, e);
    errors.push(msg);
    if (errors.length > 20) errors.shift();
  }

  // ---- モジュール登録 -------------------------------------------------------
  const defs = new Map();
  const mods = {};
  const order = [];
  const ctx = {};
  const CORE_MODULES = ['texgen', 'world', 'player', 'killer', 'audio', 'fx'];

  G.define = function (name, deps, factory) {
    if (typeof deps === 'function') {
      factory = deps;
      deps = [];
    }
    if (defs.has(name)) console.warn('[core] モジュール "' + name + '" が二重に登録された');
    defs.set(name, { deps: deps || [], factory: factory });
  };
  G.mod = function (name) {
    return mods[name];
  };

  function instantiate(name, stack) {
    if (mods[name]) return mods[name];
    if (stack.indexOf(name) >= 0) throw new Error('循環依存: ' + stack.concat(name).join(' > '));
    let def = defs.get(name);
    let isStub = false;
    if (!def) {
      if (!stubs[name]) throw new Error('未登録のモジュール: ' + name);
      def = { deps: [], factory: stubs[name] };
      isStub = true;
    }
    for (let i = 0; i < def.deps.length; i++) instantiate(def.deps[i], stack.concat(name));
    const api = def.factory(ctx) || {};
    api._name = name;
    api._stub = isStub;
    mods[name] = api;
    order.push(name);
    return api;
  }

  // ---- DOM / UI -------------------------------------------------------------
  const ui = {};
  let subHideAt = 0;

  function buildUI() {
    const css =
      'html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#ddd;' +
      'font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif}' +
      'canvas{display:block}' +
      '.ts-layer{position:fixed;left:0;top:0;right:0;bottom:0;display:none;align-items:center;' +
      'justify-content:center;flex-direction:column;text-align:center;pointer-events:none;z-index:10}' +
      '.ts-dim{background:rgba(0,0,0,.72)}' +
      '#ts-title{pointer-events:auto;cursor:pointer}' +
      '.ts-h1{font-size:64px;letter-spacing:.4em;margin:0 0 8px .4em;color:#e8e2d6}' +
      '.ts-p{margin:6px 0;color:#9a948a;font-size:15px}' +
      '.ts-go{margin-top:28px;font-size:20px;color:#e8e2d6;animation:tsb 1.6s ease-in-out infinite}' +
      '@keyframes tsb{50%{opacity:.35}}' +
      '#ts-hud{position:fixed;left:0;top:0;right:0;bottom:0;display:none;pointer-events:none;z-index:5}' +
      '#ts-cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;' +
      'background:rgba(255,255,255,.75);border-radius:50%}' +
      '#ts-sub{position:fixed;left:8%;right:8%;bottom:11%;text-align:center;font-size:22px;' +
      'color:#f0ead8;text-shadow:0 0 6px #000,0 0 2px #000;opacity:0;transition:opacity .3s;' +
      'pointer-events:none;z-index:12}' +
      '#ts-end .ts-h1{font-size:48px}' +
      '#ts-debug{position:fixed;left:6px;top:6px;margin:0;padding:6px 8px;font:11px/1.35 monospace;' +
      'color:#8f8;background:rgba(0,0,0,.6);white-space:pre;pointer-events:none;z-index:20;display:none;max-width:60vw;overflow:hidden}';
    const style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);

    function el(tag, id, cls, text, parent) {
      const e = document.createElement(tag);
      if (id) e.id = id;
      if (cls) e.className = cls;
      if (text) e.textContent = text;
      (parent || document.body).appendChild(e);
      return e;
    }
    ui.title = el('div', 'ts-title', 'ts-layer ts-dim');
    el('h1', null, 'ts-h1', '追跡', ui.title);
    el('div', null, 'ts-p', '3D FPS', ui.title);
    el('div', null, 'ts-p', 'WASD 移動 ／ マウス 視点（右ドラッグでも可）／ クリック 発砲 ／ R リセット', ui.title);
    el('div', null, 'ts-go', 'クリックで開始', ui.title);
    ui.loading = el('div', 'ts-loading', 'ts-layer ts-dim', '読込中…');
    ui.hud = el('div', 'ts-hud');
    el('div', 'ts-cross', null, null, ui.hud);
    ui.sub = el('div', 'ts-sub');
    ui.end = el('div', 'ts-end', 'ts-layer ts-dim');
    ui.endH = el('h1', null, 'ts-h1', '', ui.end);
    el('div', null, 'ts-p', 'R キーでもう一度', ui.end);
    ui.endStats = el('div', 'ts-end-stats', 'ts-p', '', ui.end);
    ui.debug = el('pre', 'ts-debug');
  }

  function setPhase(p) {
    state.phase = p;
    if (p === 'win' || p === 'lose') {
      runStats.time = state.time;
      ui.endStats.textContent = '時間 ' + runStats.time.toFixed(1) + '秒 ／ 発砲 ' + runStats.shots +
        ' ／ 命中 ' + runStats.hits + ' ／ ヘッドショット ' + runStats.headshots;
    }
    ui.title.style.display = p === 'title' ? 'flex' : 'none';
    ui.loading.style.display = p === 'loading' ? 'flex' : 'none';
    ui.hud.style.display = p === 'intro' || p === 'play' ? 'block' : 'none';
    ui.end.style.display = p === 'win' || p === 'lose' ? 'flex' : 'none';
    if (p === 'win') ui.endH.textContent = '生き延びた';
    if (p === 'lose') ui.endH.textContent = '死';
  }

  function showSubtitle(text, ms) {
    ui.sub.textContent = text;
    ui.sub.style.opacity = '1';
    subHideAt = performance.now() + (ms || 2500);
  }

  // ---- 進行（intro → play → win/lose）-----------------------------------------
  let introQueue = [];
  let pendingEnd = null;

  function beginIntro() {
    state.playerDead = false; // Core owns the death flag, including a new run.
    runStats.shots = runStats.hits = runStats.headshots = runStats.time = 0;
    state.time = 0;
    pendingEnd = null;
    introQueue = [];
    let end = 0;
    const lines = G.cfg.skipIntro ? [] : G.cfg.introLines;
    for (let i = 0; i < lines.length; i++) {
      introQueue.push(lines[i]);
      end = Math.max(end, lines[i].at + lines[i].ms / 1000);
    }
    state.introEndAt = end;
    setPhase(end > 0 ? 'intro' : 'play');
  }

  function startGame() {
    if (state.phase !== 'title') return;
    // クリックの同期呼び出しの中で行う（AudioContext と PointerLock のユーザー操作条件）
    callSafe('audio', 'unlock');
    G.rng.reset();
    G.bus.emit(E.GAME_START);
    beginIntro();
  }

  function resetGame() {
    G.rng.reset();
    G.bus.emit(E.GAME_RESET);
    for (let i = 0; i < order.length; i++) {
      const m = mods[order[i]];
      try {
        if (m.reset) m.reset();
      } catch (e) {
        reportError(order[i] + '.reset', e);
      }
    }
    ui.sub.style.opacity = '0';
    beginIntro();
  }

  function finish(phase) {
    setPhase(phase);
    if (phase === 'lose') callSafe('fx', 'kick', 'death');
    if (document.exitPointerLock) document.exitPointerLock();
  }

  function flow() {
    const ph = state.phase;
    if (ph === 'intro') {
      while (introQueue.length && state.time >= introQueue[0].at) {
        const l = introQueue.shift();
        G.bus.emit(E.SUBTITLE, { text: l.text, ms: l.ms });
      }
      if (state.time >= state.introEndAt) setPhase('play');
    } else if (ph === 'play') {
      if (!pendingEnd && state.playerDead) pendingEnd = { phase: 'lose', at: state.time + G.cfg.loseDelay };
      if (pendingEnd && state.time >= pendingEnd.at) finish(pendingEnd.phase);
    }
  }

  function callSafe(name, fn, a, b) {
    const m = mods[name];
    if (!m || !m[fn]) return;
    try {
      return m[fn](a, b);
    } catch (e) {
      reportError(name + '.' + fn, e);
    }
  }
  function callUpdate(name, dt, t) {
    const m = mods[name];
    if (!m || !m.update || m._failed) return;
    try {
      m.update(dt, t);
    } catch (e) {
      m._failed = true; // 毎フレームのエラー連発を避ける。debug パネルに残る
      reportError(name + '.update（以後停止）', e);
    }
  }

  // ---- メインループ（§3.6）---------------------------------------------------
  let clock = null;
  let extraNames = []; // C1c/K1: boot 後に一度だけ作る（ループ内で配列を作らない）
  const FIXED_UPDATE = ['texgen', 'world', 'player', 'killer', 'audio', 'fx', 'killer_model'];
  let fpsEMA = 60;
  let dbgAcc = 0;

  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    const ph = state.phase;
    const live = ph === 'intro' || ph === 'play';
    const running = live || ph === 'win' || ph === 'lose';
    if (running) state.time += dt;
    const t = state.time;

    if (live) callUpdate('player', dt, t);
    if (running) callUpdate('killer', dt, t); // killer は state.phase を見て止まる／終える
    callUpdate('world', dt, t);
    callUpdate('audio', dt, t);
    callUpdate('fx', dt, t);
    // C1c/K1: 固定リスト以外のモジュール（bgm など）は全フェーズで update する
    for (let i = 0; i < extraNames.length; i++) callUpdate(extraNames[i], dt, t);
    flow();

    const fx = mods.fx;
    G.renderer.info.reset(); // C1c/K3: autoReset=false なので、描画の直前に自分で 0 に戻す
    try {
      fx.render();
    } catch (e) {
      if (!fx._renderFailed) {
        fx._renderFailed = true;
        reportError('fx.render（renderer.render に退避）', e);
      }
      G.renderer.info.reset();
      G.renderer.render(G.scene, G.camera);
    }
    lastCalls = Number(G.renderer.info.render.calls) || 0;
    lastTris = Number(G.renderer.info.render.triangles) || 0;
    G.stats.calls = lastCalls;
    G.stats.tris = lastTris;

    if (subHideAt && performance.now() > subHideAt) {
      subHideAt = 0;
      ui.sub.style.opacity = '0';
    }
    if (live) {
    }
    fpsEMA += (1 / Math.max(dt, 1e-3) - fpsEMA) * 0.05;
    dbgAcc += dt;
    if (G.cfg.debug && dbgAcc > 0.25) {
      dbgAcc = 0;
      updateDebug();
    }
  }

  function updateDebug() {
    const lines = [];
    lines.push(
      'fps ' + fpsEMA.toFixed(0) + '  phase ' + state.phase + '  t ' + state.time.toFixed(1) +
        '  dead ' + (state.playerDead ? 1 : 0) + '  wounds ' + state.killerWounds
    );
    lines.push(
      'mods ' + order.map(function (n) { return n + (mods[n]._stub ? '(stub)' : ''); }).join(' ') +
        '  assets ' + countImageAssets() + '/' + G.cfg.expectedAssets +
        '  calls ' + lastCalls + ' tris ' + lastTris
    );
    for (let i = 0; i < errors.length; i++) lines.push('ERR ' + errors[i]);
    lines.push('---- events (F2 で表示切替)');
    const tail = evLog.slice(-14);
    for (let i = 0; i < tail.length; i++) {
      lines.push(tail[i].t.toFixed(2) + ' ' + tail[i].name + ' ' + tail[i].text.slice(0, 90));
    }
    ui.debug.textContent = lines.join('\n');
  }

  function setDebug(on) {
    G.cfg.debug = on;
    ui.debug.style.display = on ? 'block' : 'none';
    if (on) updateDebug();
  }

  // ---- 起動 -----------------------------------------------------------------
  G.start = function () {
    if (G._started) return;
    G._started = true;
    const THREE = (G.THREE = global.THREE);
    const q = new URLSearchParams(global.location.search);
    if (q.get('debug')) G.cfg.debug = true;
    if (q.get('skipintro')) G.cfg.skipIntro = true;

    buildUI();
    setDebug(G.cfg.debug);
    setPhase('loading');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    } catch (e) {
      ui.loading.textContent = 'WebGL を初期化できません';
      throw e;
    }
    renderer.setPixelRatio(Math.min(global.devicePixelRatio || 1, G.cfg.pixelRatioMax));
    renderer.setSize(global.innerWidth, global.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding; // r128: colorSpace は使わない
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;
    renderer.info.autoReset = false; // C1c/K3: composer の全パス分を数える
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.insertBefore(renderer.domElement, document.body.firstChild);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050506);
    scene.fog = new THREE.FogExp2(0x050506, 0.06);
    const camera = new THREE.PerspectiveCamera(75, global.innerWidth / global.innerHeight, 0.05, 60);
    camera.rotation.order = 'YXZ';
    camera.position.fromArray(G.cfg.eyeStart);

    G.renderer = renderer;
    G.scene = scene;
    G.camera = camera;
    Object.assign(ctx, { THREE: THREE, scene: scene, camera: camera, renderer: renderer, bus: G.bus, state: state, cfg: G.cfg, mod: G.mod });
    clock = new THREE.Clock();

    global.addEventListener('resize', onResize);
    global.addEventListener('keydown', onKey);
    ui.title.addEventListener('click', startGame);
    G.bus.on(E.SUBTITLE, function (e) {
      showSubtitle(e.text, e.ms);
    });
    // 設計変更: HP は無い。斧が当たった（PLAYER_DAMAGED）瞬間にプレイヤーは死亡する。
    G.bus.on(E.PLAYER_DAMAGED, function () {
      if (state.phase === 'play') state.playerDead = true;
    });
    G.bus.on(E.KILLER_STATE, function (e) {
      if (e.to === KS.DEATH && state.phase === 'play' && !pendingEnd) {
        pendingEnd = { phase: 'win', at: state.time + G.cfg.winDelay };
      }
    });

    boot().catch(function (e) {
      reportError('boot', e);
      ui.loading.style.display = 'flex';
      ui.loading.textContent = '起動に失敗: ' + (e && e.message ? e.message : e);
    });
  };

  function onResize() {
    const w = global.innerWidth;
    const h = global.innerHeight;
    G.renderer.setSize(w, h);
    G.camera.aspect = w / h;
    G.camera.updateProjectionMatrix();
    callSafe('fx', 'resize', w, h);
  }

  function onKey(e) {

    function S(j, x, y, z) {

    // 目標角を target に書く（純粋な関数。new なし）

      var i, u, e, s, p, k, k2;
      for (i = 0; i < SIZE; i++) target[i] = 0;
      target[HIPS_Y] = 0.95;
      switch (name) {
        case 'idle':
          S(J.spine, 0.05, 0, 0);
          S(J.head, 0.1, 0.25 * Math.sin((2 * PI * t) / 4), 0);
          S(J.shoulderR, -0.05, 0, -0.12);
          S(J.elbowR, -0.35, 0, 0);
          S(J.shoulderL, -0.1, 0, 0.12);
          S(J.elbowL, -0.2, 0, 0);
          break;
        case 'threaten':
          target[HIPS_Y] = 0.93;
          S(J.spine, 0.12, 0, 0);
          S(J.chest, 0, 0.2 * Math.sin((2 * PI * t) / 2.4), 0);
          S(J.head, 0.05, 0, 0);
          S(J.shoulderR, -2.7, 0, -0.25);
          S(J.elbowR, -0.6, 0, 0);
          S(J.shoulderL, -1.1, 0, 0.25);
          S(J.elbowL, -0.5, 0, 0);
          S(J.hipL, -0.15, 0, 0);
          S(J.hipR, 0.1, 0, 0);
          S(J.kneeL, 0.15, 0, 0);
          S(J.kneeR, 0.15, 0, 0);
          break;
        case 'retreat':
          p = (2 * PI * t) / 1.0;
          target[HIPS_Y] = 0.94;
          S(J.spine, 0.1, 0, 0);
          S(J.head, 0.05, 0, 0);
          S(J.shoulderR, -2.7, 0, -0.25);
          S(J.elbowR, -0.6, 0, 0);
          S(J.shoulderL, -1.0, 0, 0.25);
          S(J.elbowL, -0.5, 0, 0);
          S(J.hipL, 0.35 * Math.sin(p), 0, 0);
          S(J.hipR, -0.35 * Math.sin(p), 0, 0);
          S(J.kneeL, 0.4 * Math.max(0, Math.cos(p)), 0, 0);
          S(J.kneeR, 0.4 * Math.max(0, -Math.cos(p)), 0, 0);
          break;
        case 'cornered':
          target[HIPS_Y] = 0.9;
          S(J.spine, 0.25, 0, 0);
          S(J.head, 0.3, 0, 0);
          S(J.shoulderR, -2.2 + 0.03 * Math.sin(40 * t), 0, -0.2);
          S(J.elbowR, -0.8, 0, 0);
          S(J.shoulderL, -0.9, 0, 0.3);
          S(J.elbowL, -0.6, 0, 0);
          S(J.hipL, -0.2, 0, 0);
          S(J.hipR, -0.2, 0, 0);
          S(J.kneeL, 0.4, 0, 0);
          S(J.kneeR, 0.4, 0, 0);
          break;
        case 'charge':
          p = (2 * PI * t) / 0.55;
          target[HIPS_Y] = 0.93 + 0.04 * Math.abs(Math.sin(p));
          S(J.spine, 0.35, 0, 0);
          S(J.head, 0, 0, 0);
          S(J.shoulderR, -2.9, 0, -0.2);
          S(J.elbowR, -0.8, 0, 0);
          S(J.shoulderL, 0.6 * Math.sin(p), 0, 0);
          S(J.elbowL, -0.9, 0, 0);
          S(J.hipL, -0.9 * Math.sin(p), 0, 0);
          S(J.hipR, 0.9 * Math.sin(p), 0, 0);
          S(J.kneeL, 0.9 * Math.max(0, Math.sin(p + 1.57)), 0, 0);
          S(J.kneeR, 0.9 * Math.max(0, -Math.sin(p + 1.57)), 0, 0);
          break;
        case 'attack_wind':
          u = clamp01(t / 0.6);
          target[HIPS_Y] = 0.93;
          S(J.spine, lerp(0.1, -0.15, u), 0, 0);
          S(J.chest, 0, lerp(0, 0.3, u), 0);
          S(J.head, 0, 0, 0);
          S(J.shoulderR, lerp(-2.7, -3.1, u), 0, -0.2);
          S(J.elbowR, lerp(-0.6, -1.2, u), 0, 0);
          S(J.shoulderL, -1.0, 0, 0.3);
          S(J.elbowL, -0.6, 0, 0);
          S(J.hipL, -0.3, 0, 0);
          S(J.hipR, 0.2, 0, 0);
          S(J.kneeL, 0.2, 0, 0);
          S(J.kneeR, 0.2, 0, 0);
          break;
        case 'attack_swing':
          e = smooth(clamp01(t / 0.25));

          S(J.chest, 0, lerp(0.3, -0.3, e), 0);
          S(J.head, lerp(0, 0.2, e), 0, 0);
          S(J.shoulderR, lerp(-3.1, -0.9, e), 0, lerp(-0.2, 0, e));
          S(J.elbowR, lerp(-1.2, -0.2, e), 0, 0);
          S(J.shoulderL, -0.5, 0, 0.3);
          S(J.elbowL, -0.4, 0, 0);
          S(J.hipL, -0.5, 0, 0);
          S(J.hipR, 0.3, 0, 0);
          S(J.kneeL, 0.4, 0, 0);
          S(J.kneeR, 0.4, 0, 0);
          break;
        case 'hit':
          s = Math.sin(PI * clamp01(t / 0.5));
          target[HIPS_Y] = 0.92;
          S(J.spine, lerp(0, -0.3, s), 0, 0);
          S(J.head, lerp(0, -0.4, s), 0, 0);
          S(J.shoulderR, -2.2, 0, 0);
          S(J.elbowR, -0.7, 0, 0);
          S(J.shoulderL, -0.4, 0, 0.3);
          S(J.elbowL, -0.4, 0, 0);
          S(J.hipL, -0.1, 0, 0);
          S(J.hipR, -0.1, 0, 0);
          S(J.kneeL, 0.2, 0, 0);
          S(J.kneeR, 0.2, 0, 0);
          break;
        case 'death':
          k = clamp01(t / 1.2);

          S(J.hipR, -0.3 * k2, 0, 0);

          S(J.kneeR, 0.3 * k2, 0, 0);

    function writeJoints() {

    // ----------------------------------------------------------------------
    // 死亡: 斧を手から外して床へ置く
    // ----------------------------------------------------------------------
    var axeDetached = false;
    var aStartPos = new THREE.Vector3();
    var aEndPos = new THREE.Vector3(-0.55, 0.04, 0.35);
    var aStartQ = new THREE.Quaternion();

    function reattachAxe() {
      handR.add(axe); // add は前の親から外す
      axe.position.set(0, AXE_HOME_POS_Y, 0);
      axe.rotation.set(PI, 0, 0);
      axe.scale.set(1, 1, 1);
      axeDetached = false;
    }

    function dropAxe(t) {
      if (!axeDetached) {
        // 手の最新の位置を世界に反映してから、世界の位置を保ったまま root の子にする
        root.attach(axe);
        aStartPos.copy(axe.position);
        aStartQ.copy(axe.quaternion);
        axeDetached = true;
      }
      var k = smooth(clamp01((t - 0.3) / 0.8));
      axe.position.copy(aStartPos).lerp(aEndPos, k);
      axe.quaternion.copy(aStartQ).slerp(aEndQ, k);
    }

    // ----------------------------------------------------------------------
    // 公開関数
    // ----------------------------------------------------------------------
    function pose(name, t, blend) {
      if (!POSE_NAMES[name]) {
        if (!warned[name]) {
          warned[name] = true;
          console.warn('[killer_model] 未知のポーズ名 "' + name + '" → idle として扱う');
        }
        name = 'idle';
      }
      if (name !== prevName) {
        from.set(applied); // いま見えているポーズを控える
        prevName = name;
      }
      computeTarget(name, t);
      var b = blend < 0 ? 0 : blend > 1 ? 1 : blend;
      for (var i = 0; i < SIZE; i++) applied[i] = from[i] + (target[i] - from[i]) * b;
      writeJoints();
      if (name === 'death') {
        if (t >= 0.3) dropAxe(t);
      } else if (axeDetached) {
        reattachAxe();
      }
    }

    function headPos(out) {
      head.updateWorldMatrix(true, false);
      return out.setFromMatrixPosition(head.matrixWorld);
    }

    function reset() {
      if (axeDetached) reattachAxe();
      prevName = 'idle';
      computeTarget('idle', 0);
      applied.set(target);
      from.set(target);
      writeJoints();
    }

    reset(); // 最初から idle の姿勢にしておく

    return {
      root: root,
      hittables: hittables,
      pose: pose,
      headPos: headPos,
      reset: reset
    };

/**
 * @file    src/09_bgm.js
 * @card    C9
 * @author  エリザベス (Claude Sonnet 5.5, claude.ai chat)
 * @date    2026-11-23
 * @revision 1
 */
(function (global) {
  'use strict';
  var G = global.G;

  G.define('bgm', [], function (ctx) {
    var E = G.E;
    var KS = G.KS;

    // アセットが無ければ何もしない（要素もイベントも console 出力も無し）
    if (!G.assets || !G.assets.bgm) {
      return {
        update: function () {},
        reset: function () {},
        stats: function () {
          return { active: false };
        },
      };
    }

    var UP = 0.5; // 上げる速さ（/秒）
    var DOWN = 0.67; // 下げる速さ（/秒）
    var DUCK_MUL = 0.6;
    var DUCK_SEC = 0.8;

    var el = new Audio(G.assets.bgm);
    el.loop = true;
    el.preload = 'auto';
    el.volume = 0;

    var vol = 0;
    var target = 0;
    var lastState = KS.IDLE;
    var duck = 0; // 残り秒数
    var statsObj = { active: true, volume: 0, target: 0, paused: true, ducking: false }; // stats() 用に使い回す

    function noop() {}
    function play() {
      var p = el.play();
      if (p && p.catch) p.catch(noop);
    }

    function stateTarget() {
      switch (lastState) {
        case KS.DEATH:
          return 0;
        case KS.CORNERED:
          return 0.4;
        case KS.CHARGE:
        case KS.ATTACK:
          return 0.5;
        case KS.IDLE:
          return 0.3;
        default:
          return 0.35; // THREATEN / RETREAT / HIT は 0.35（HIT は直前の値を維持する下の分岐で処理）
      }
    }

    var lastBase = 0.35; // HIT のときに維持する値

    function calcTarget() {
      var ph = G.state.phase;
      if (ph !== 'play') return 0; // title / loading / intro / win / lose
      if (lastState === KS.DEATH) return 0;
      var base;
      if (lastState === KS.HIT) base = lastBase;
      else {
        base = stateTarget();
        lastBase = base;
      }
      return duck > 0 ? base * DUCK_MUL : base;
    }

    function update(dt, t) {
      if (duck > 0) duck -= dt;
      target = calcTarget();

      var ph = G.state.phase;
      var ending = ph === 'win' || ph === 'lose' || lastState === KS.DEATH;

      if (ph === 'play' && el.paused && target > 0) play();

      if (vol < target) {
        vol += UP * dt;
        if (vol > target) vol = target;
      } else if (vol > target) {
        vol -= DOWN * dt;
        if (vol < target) vol = target;
      }
      if (vol < 0) vol = 0;
      else if (vol > 1) vol = 1;
      el.volume = vol;

      if (vol <= 0 && target === 0 && ending && !el.paused) el.pause();
    }

    function reset() {
      el.pause();
      el.currentTime = 0;
      vol = 0;
      el.volume = 0;
      target = 0;
      lastState = KS.IDLE;
      lastBase = 0.35;
      duck = 0;
    }

    G.bus.on(E.KILLER_STATE, function (e) {
      if (e && e.to) lastState = e.to;
    });
    G.bus.on(E.PLAYER_FIRE, function () {
      duck = DUCK_SEC;
    });
    G.bus.on(E.GAME_START, function () {
      play(); // クリック中に呼ばれるので再生が許可される
    });
    G.bus.on(E.GAME_RESET, reset);

    // update は core (00_core.js frame(), S6 K1) が毎フレーム呼ぶ。自前ループは持たない。

    return {
      update: update,
      reset: reset,
      stats: function () {
        statsObj.volume = vol;
        statsObj.target = calcTarget(); // イベント直後でも最新の目標を返す
        statsObj.paused = el.paused;
        statsObj.ducking = duck > 0;
        return statsObj;
      },
    };
  });
})(window);

;

G.start();
</script>
