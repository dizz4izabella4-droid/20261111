<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f2f5f9">
<title>机上の空論GP | 交通事故シミュレーション</title>
<style>
:root {
  color-scheme: light;
  --ink: #152237; --muted: #53637a; --line: #dce4ee; --soft: #f2f5f9;
  --white: #fff; --blue: #124799; --blue-dark: #153568; --pale: #edf4ff;
  --teal: #08746d; --amber: #935712; --red: #a73146;
  font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", Meiryo, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--soft); color: var(--ink); font-size: 16px; }
button, input, select { font: inherit; color: inherit; }
button, summary, select, input[type=checkbox] { cursor: pointer; }
button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid #6196ed; outline-offset: 3px;
}
button:disabled { opacity: .5; cursor: default; }
button {
  background: var(--white); border: 1px solid var(--line); border-radius: 9px;
  min-height: 40px; padding: 0 13px; font-weight: 720; font-size: .875rem;
}
button:hover:not(:disabled) { background: var(--pale); }
[hidden] { display: none !important; }
h1,h2,h3,p { margin: 0; }
.shell { width: min(1152px, calc(100% - 56px)); margin-inline: auto; }
.topbar { background: var(--white); border-bottom: 1px solid var(--line); }
.topbar .shell { display:flex; min-height:66px; align-items:center; justify-content:space-between; gap:12px; }
.identity { display:flex; align-items:center; gap:11px; white-space:nowrap; }
.brand { font-family: system-ui,sans-serif; font-size:1.2rem; font-weight:790; letter-spacing:0; white-space:nowrap; }
.brand-mark {
  width:32px; height:32px; background:#1d4885; border-radius:9px; display:grid; place-items:center;
}
.brand-mark::after {
  content:""; width:18px; height:18px; transform:rotate(-12deg);
  background:linear-gradient(#baddff,#baddff) center / 4px 100% no-repeat,
             linear-gradient(#baddff,#baddff) center / 100% 4px no-repeat;
}
.identity-caption { border-left:1px solid var(--line); padding-left:12px; font-size:.8125rem; color:var(--muted); }
.top-actions { display:flex; gap:8px; }
.primary { background:var(--blue); color:white; border-color:var(--blue); }
.primary:hover:not(:disabled) { background:#103d82; }
.download-icon { display:inline-block; width:12px; height:12px; border-bottom:1.5px solid currentColor; position:relative; margin-right:6px; }
.download-icon::before { content:""; position:absolute; left:5px; top:0; width:1.5px; height:7px; background:currentColor; }
.download-icon::after { content:""; position:absolute; left:3px; top:3px; width:5px; height:5px; border:solid currentColor; border-width:0 1.5px 1.5px 0; transform:rotate(45deg); }
main { padding:34px 0 26px; }
.headline h1 { font-size:clamp(1.65rem,4vw,2.55rem); line-height:1.2; letter-spacing:-.045em; font-weight:800; }
.headline p { color:var(--muted); margin-top:11px; font-size:.9375rem; line-height:1.65; }
.tabs { display:flex; gap:5px; width:max-content; max-width:100%; margin:24px 0 16px; border:1px solid var(--line); border-radius:11px; padding:4px; background:#e7edf5; }
.tabs button { min-width:116px; border-color:transparent; background:transparent; color:#44566e; }
.tabs button[aria-pressed=true] { border-color:#d9e2ef; background:#fff; color:var(--blue-dark); box-shadow:0 1px 3px #14294710; }
.card { background:white; border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 5px #0f254807; }
.diagram { overflow:hidden; }
.diagram-head { display:flex; align-items:center; justify-content:space-between; padding:13px 17px; gap:10px; }
.diagram-head h2, .section-title { font-size:1.04rem; font-weight:780; }
.diagram-head p { font-size:.8125rem; color:var(--muted); margin-top:3px; }
.zoom { display:flex; align-items:center; gap:5px; }
.zoom button { padding:0 10px; min-height:36px; }
.zoom output { min-width:44px; text-align:center; color:var(--muted); font-size:.8125rem; font-variant-numeric:tabular-nums; }
canvas { display:block; width:100%; height:clamp(370px, 38vw, 482px); background:#101a2a; touch-action:none; cursor:grab; }
canvas.dragging { cursor:grabbing; }
.legend { display:flex; flex-wrap:wrap; gap:7px 20px; align-items:center; min-height:46px; padding:8px 17px; color:var(--muted); font-size:.8125rem; }
.legend-item { display:inline-flex; gap:7px; align-items:center; }
.swatch { width:10px; height:10px; border-radius:3px; background:var(--swatch); display:inline-block; }
.line-sample { width:19px; border-top:2px dashed #657890; }
.note { display:flex; align-items:baseline; gap:8px; font-size:.8125rem; line-height:1.65; color:var(--muted); margin:14px 1px; }
.note::before { content:"ⓘ"; color:var(--blue); font-weight:700; }
.result { margin:15px 0 22px; padding:15px 17px; }
.metrics { display:grid; grid-template-columns:1.15fr repeat(3,1fr); gap:12px; }
.metric { min-width:0; border-left:1px solid var(--line); padding-left:14px; }
.metric:first-child { padding-left:0; border:0; }
.metric dt { color:var(--muted); font-size:.8125rem; line-height:1.4; }
.metric dd { margin:4px 0 0; font-size:1.3rem; font-weight:760; font-variant-numeric:tabular-nums; }
.metric dd small { font-size:.78rem; font-weight:630; }
.bad { color:var(--red); }
.good { color:var(--teal); }
.result-details { margin-top:12px; color:var(--muted); font-size:.875rem; line-height:1.7; }
.result-details summary { width:max-content; font-weight:700; color:var(--blue); }
.result-details p { margin-top:5px; line-height:1.65; }
.section-title { margin:0 0 10px 1px; }
.inputs { display:grid; grid-template-columns:1fr 1fr .84fr; gap:12px; }
.input-card { padding:15px; min-width:0; }
.input-card h3, .scene-control h3 { font-size:.96rem; margin-bottom:12px; }
.car-badge { display:inline-grid; width:24px; height:24px; place-items:center; border-radius:6px; margin-right:7px; font:750 .88rem system-ui; }
.car-a { color:#065a53; background:#cdf7ed; }
.car-b { color:#77450d; background:#ffe9c8; }
.fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 12px; align-items:start; }
.road-fields { grid-template-columns:repeat(3,minmax(0,1fr)); }
.field { display:grid; gap:5px; min-width:0; color:var(--muted); font-size:.875rem; }
.field-label { display:flex; align-items:center; justify-content:space-between; min-height:20px; gap:4px; }
.number { display:flex; align-items:center; position:relative; }
.number input, select {
  border:1px solid #d0daea; border-radius:8px; width:100%; min-height:41px;
  background:#fff; color:var(--ink); padding:5px 9px; font-size:1rem; min-width:0;
}
.number input { appearance:textfield; font-variant-numeric:tabular-nums; }
.number input::-webkit-inner-spin-button, .number input::-webkit-outer-spin-button { appearance:none; }
.number.has-unit input { padding-right:var(--unit-width); }
.number-unit { position:absolute; right:8px; font-size:.75rem; pointer-events:none; color:var(--muted); }
select { appearance:none; padding-right:29px; background:
  linear-gradient(45deg,transparent 50%,#546887 50%) calc(100% - 14px) 52% / 5px 5px no-repeat,
  linear-gradient(135deg,#546887 50%,transparent 50%) calc(100% - 9px) 52% / 5px 5px no-repeat, #fff; }
.position { margin-top:11px; }
.position summary { color:var(--blue); font-size:.8125rem; font-weight:680; }
.position .fields { margin-top:8px; }
.input-card .field + .field { margin-top:0; }
.toggles { display:flex; flex-wrap:wrap; gap:12px 18px; margin:10px 0 0; }
.check { display:inline-flex; gap:6px; align-items:center; color:var(--muted); font-size:.875rem; line-height:1.45; }
.check input { width:16px; height:16px; accent-color:var(--blue); margin:0; flex:none; }
.quick-mu { font-size:.8125rem; margin-top:10px; color:var(--muted); }
.advanced { display:grid; gap:9px; margin-top:15px; }
.advanced > details { overflow:hidden; }
.advanced > details > summary { min-height:48px; padding:12px 15px; font-weight:720; font-size:.9rem; list-style:none; display:flex; align-items:center; gap:9px; }
.advanced > details > summary::-webkit-details-marker { display:none; }
.advanced > details > summary::before { content:""; width:7px; height:7px; transform:rotate(-45deg); border:solid #59718e; border-width:0 1.5px 1.5px 0; margin-right:3px; }
.advanced > details[open] > summary::before { transform:rotate(45deg); }
.advanced-body { border-top:1px solid var(--line); padding:14px 15px; }
.advanced-body .check { margin-bottom:12px; }
.advanced-body .toggles .check { margin:0; }
.advanced .subgrid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.advanced small, .obstacle-help, .mode-copy { font-size:.875rem; color:var(--muted); line-height:1.65; }
.advanced h3 { font-size:.9rem; margin-bottom:9px; }
.obstacle-row { padding:12px 0; border-bottom:1px solid var(--line); }
.obstacle-row:first-child { padding-top:0; }
.obstacle-row:last-child { border:0; }
.obstacle-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.obstacle-head button { min-height:32px; }
.obstacle-fields { grid-template-columns:repeat(4,minmax(0,1fr)); }
.mode-panel { padding:15px; margin:15px 0; }
.mode-panel .section-title { margin-left:0; }
.mode-copy { margin:8px 0; }
.scene-controls { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.scene-control { background:#f7f9fc; border:1px solid var(--line); border-radius:10px; padding:12px; min-width:0; }
.scene-control .fields { margin-top:9px; }
.scene-conditions { margin:13px 0; }
.scene-conditions .fields { grid-template-columns:repeat(4,minmax(0,1fr)); }
.lock { color:var(--muted); border:0; background:transparent; font-weight:400; min-height:23px; min-width:27px; padding:0 3px; line-height:1; }
.lock[aria-pressed=true] { background:#dae8fc; }
.candidates { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:8px; }
.candidate { display:grid; text-align:left; align-content:start; gap:4px; padding:9px; line-height:1.45; }
.candidate[aria-pressed=true] { background:var(--pale); border-color:#85a7da; }
.candidate small { color:var(--muted); }
.scene-info { font-size:.875rem; margin-top:5px; }
.action-row { display:flex; justify-content:flex-end; padding-top:12px; }
.status { position:fixed; right:18px; bottom:18px; z-index:3; max-width:calc(100% - 36px); border-radius:9px; background:#183457; padding:9px 13px; color:white; font-size:.875rem; box-shadow:0 4px 15px #112b4540; }
@media(max-width:800px) {
  .shell { width:calc(100% - 36px); }
  .inputs { grid-template-columns:1fr 1fr; }
  .surface-card { grid-column:1 / -1; }
}
@media(max-width:600px) {
  .shell { width:calc(100% - 28px); }
  .topbar .shell { min-height:59px; }
  .top-actions { gap:5px; }
  .top-actions button { padding:0 7px; min-height:36px; font-size:.75rem; }
  .identity { gap:7px; }
  .identity-caption { display:none; }
  .brand-mark { width:28px; height:28px; }
  main { padding-top:24px; }
  .headline p { font-size:.875rem; }
  .tabs { width:100%; margin:17px 0 12px; }
  .tabs button { min-width:0; flex:1; font-size:.875rem; min-height:40px; padding:0 4px; }
  .diagram-head { padding:10px; }
  .diagram-head h2 { font-size:.9375rem; }
  .diagram-head p { font-size:.75rem; }
  .zoom { gap:3px; }
  .zoom button { min-width:28px; padding:0 5px; min-height:33px; }
  .zoom output { min-width:36px; font-size:.75rem; }
  canvas { height:clamp(266px, 81vw, 395px); }
  .legend { padding:8px 10px; gap:6px 13px; font-size:.75rem; }
  .result { padding:12px; margin:12px 0 18px; }
  .metrics { grid-template-columns:1fr 1fr; gap:11px; }
  .metric:nth-child(odd) { padding-left:0; border:0; }
  .metric dd { font-size:1.1rem; }
  .inputs { display:flex; flex-direction:column; }
  .input-card { padding:12px; }
  .advanced .subgrid, .scene-controls, .candidates { grid-template-columns:1fr; }
  .scene-conditions .fields, .road-fields, .obstacle-fields { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (min-width:1280px) {
  body { display:flex; flex-direction:column; height:100vh; height:100dvh; min-height:450px; }
  .shell { width:min(1720px, calc(100% - 80px)); }
  .topbar .shell { min-height:54px; }
  main { display:flex; flex:1; flex-direction:column; min-height:0; padding:12px 0 8px; }
  .workspace-header { display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:12px; }
  .headline h1 { font-size:1.8rem; }
  .headline p { margin-top:3px; font-size:.875rem; }
  .tabs { margin:0; flex:none; }
  .tabs button { min-height:36px; }
  .workspace { display:grid; grid-template-columns:minmax(0,1.85fr) minmax(0,1fr); flex:1; min-height:0; gap:14px; }
  .workspace-visual { display:flex; flex-direction:column; min-height:0; gap:10px; }
  .diagram { display:flex; flex:1 1 0; flex-direction:column; min-height:0; }
  .diagram-head { flex:none; padding:9px 15px; }
  #plan { flex:1 1 0; height:0; min-height:0; }
  .legend { flex:none; min-height:36px; padding:6px 15px; }
  .workspace-results, .workspace-settings { overflow:auto; overscroll-behavior:contain; }
  .workspace-results { max-height:39%; background:var(--white); border:1px solid var(--line); border-radius:14px; }
  .workspace-results > .result { border:0; box-shadow:none; margin:0; padding:11px 15px; }
  .workspace-results > .result-details, .workspace-results > #scene-result { margin:0; padding:10px 15px; }
  .workspace-results > #scene-result > .mode-copy:first-child { margin-top:0; }
  #inverse-result .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .workspace-settings { scrollbar-gutter:stable; padding:4px; }
  .workspace-settings .mode-panel { margin:0 0 14px; }
  .inputs, .advanced .subgrid, .scene-controls { grid-template-columns:1fr; }
  .scene-conditions .fields, .obstacle-fields { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .note { margin:6px 1px 0; }
}
@media (min-width:1280px) and (max-height:620px) {
  .topbar .shell { min-height:42px; }
  .top-actions button, .tabs button, .zoom button { min-height:30px; }
  main { padding:6px 0 5px; }
  .workspace-header { margin-bottom:6px; }
  .headline, .diagram-head > :first-child { display:flex; align-items:baseline; gap:12px; }
  .headline h1 { font-size:1.4rem; }
  .headline p, .diagram-head p { margin:0; }
  .workspace-visual { gap:6px; }
  .diagram-head { padding:6px 12px; }
  .legend { min-height:29px; padding:3px 12px; }
  .workspace-results { max-height:clamp(92px, 20vh, 124px); }
  .workspace-results > .result { padding:6px 12px; }
  .workspace-results .result .result-details { margin-top:6px; }
  .workspace-results .metric dd { margin-top:1px; font-size:1.125rem; }
  .note { margin-top:4px; }
}
</style>

<script>
"use strict";
/* World distances are metres, times are seconds and angles are radians clockwise from east. */
const SofiaPhysics = (() => {
  const GRAVITY = 9.80665;
  const EPS = 1e-7;
  const DIRECTIONS = {
    E: { x: 1, y: 0, angle: 0 },
    W: { x: -1, y: 0, angle: Math.PI },
    S: { x: 0, y: 1, angle: Math.PI / 2 },
    N: { x: 0, y: -1, angle: -Math.PI / 2 }
  };
  const WORLD_AXES = [{ x: 1, y: 0 }, { x: 0, y: 1 }];

  const dot = (a, b) => a.x * b.x + a.y * b.y;
  const cross = (a, b) => a.x * b.y - a.y * b.x;
  const delta = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  const scale = (v, k) => ({ x: v.x * k, y: v.y * k });
  const normalTo = (v) => ({ x: -v.y, y: v.x });
  const unitAt = (angle) => ({ x: Math.cos(angle), y: Math.sin(angle) });
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const finite = (v, fallback) => Number.isFinite(v) ? v : fallback;
  const norm = (v) => Math.hypot(v.x, v.y);

  function halfProjection(body, axis, forward = unitAt(body.angle)) {
    return (Math.abs(dot(forward, axis)) * body.length +
      Math.abs(dot(normalTo(forward), axis)) * body.width) / 2;
  }

  function overlap(a, b) {
    const facingA = unitAt(a.angle);
    const facingB = unitAt(b.angle);
    const axes = [facingA, normalTo(facingA), facingB, normalTo(facingB)];
    const offset = delta(b, a);
    let best = null;
    for (const axis of axes) {
      const spacing = dot(offset, axis);
      const depth = halfProjection(a, axis, facingA) + halfProjection(b, axis, facingB) -
        Math.abs(spacing);
      if (depth < -EPS) return null;
      if (!best || depth < best.depth) {
        best = { depth, normal: scale(axis, spacing < 0 ? -1 : 1) };
      }
    }
    return best;
  }

  function support(body, direction, tangentDirection) {
    const forward = unitAt(body.angle);
    const side = normalTo(forward);
    let normal = dot(body, direction);
    let low = dot(body, tangentDirection);
    let high = low;
    for (const [axis, radius] of [[forward, body.length / 2], [side, body.width / 2]]) {
      const normalPart = dot(axis, direction);
      const tangentPart = dot(axis, tangentDirection) * radius;
      normal += Math.abs(normalPart) * radius;
      if (Math.abs(normalPart) > EPS) {
        low += Math.sign(normalPart) * tangentPart;
        high += Math.sign(normalPart) * tangentPart;
      } else {
        low -= Math.abs(tangentPart);
        high += Math.abs(tangentPart);
      }
    }
    return { normal, low, high };
  }

  function contactPoint(a, b, normal) {
    const tangent = normalTo(normal);
    const sideA = support(a, normal, tangent);
    const sideB = support(b, scale(normal, -1), tangent);
    const along = (sideA.normal - sideB.normal) / 2;
    const across = (Math.max(sideA.low, sideB.low) + Math.min(sideA.high, sideB.high)) / 2;
    return { x: normal.x * along + tangent.x * across, y: normal.y * along + tangent.y * across };
  }

  function applyImpact(a, b, normal, location, restitution) {
    const leverA = delta(location, a);
    const leverB = delta(location, b);
    const contactA = normalTo(leverA);
    const contactB = normalTo(leverB);
    const relative = {
      x: b.v.x + b.omega * contactB.x - a.v.x - a.omega * contactA.x,
      y: b.v.y + b.omega * contactB.y - a.v.y - a.omega * contactA.y
    };
    const closing = Math.max(0, -dot(relative, normal));
    if (closing <= EPS) return { relative, closing };
    const momentA = cross(leverA, normal);
    const momentB = cross(leverB, normal);
    const impulse = (1 + restitution) * closing /
      (1 / a.mass + 1 / b.mass + momentA ** 2 / a.inertia + momentB ** 2 / b.inertia);
    a.v = delta(a.v, scale(normal, impulse / a.mass));
    b.v = delta(b.v, scale(normal, -impulse / b.mass));
    a.omega -= impulse * momentA / a.inertia;
    b.omega += impulse * momentB / b.inertia;
    return { relative, closing };
  }

  function sweptContact(a, b, spans, dt) {
    let entry = -Infinity;
    let exit = Infinity;
    let normal = null;
    const offset = delta(b, a);
    const change = delta(scale(b.forward, spans[1]), scale(a.forward, spans[0]));
    for (const axis of WORLD_AXES) {
      const center = dot(offset, axis);
      const radius = halfProjection(a, axis, a.forward) + halfProjection(b, axis, b.forward);
      const motion = dot(change, axis);
      if (Math.abs(motion) <= EPS) {
        if (Math.abs(center) > radius + EPS) return null;
        continue;
      }

      // With orthogonal approaches a single body moves along each world axis.
      const mover = Math.abs(dot(a.forward, axis)) > .5 ? a : b;
      const travel = spans[mover === a ? 0 : 1];
      const acceleration = mover.decel;
      const timeAt = (fraction) => {
        if (fraction <= 0 || fraction >= 1 || acceleration <= EPS ||
            Math.abs(motion) + EPS < travel) return dt * fraction;
        const distance = travel * fraction;
        const speedAt = Math.sqrt(Math.max(0, mover.speed ** 2 - 2 * acceleration * distance));
        return 2 * distance / (mover.speed + speedAt);
      };
      const edge = motion > 0 ? -radius : radius;
      const start = timeAt((edge - center) / motion);
      const end = timeAt((-edge - center) / motion);
      const edgeNormal = scale(axis, Math.sign(edge));
      if (start > entry + EPS) {
        entry = start;
        normal = edgeNormal;
      } else if (Math.abs(start - entry) <= EPS) {
        // Simultaneous orthogonal edges define a corner contact.
        normal = scale({ x: normal.x + edgeNormal.x, y: normal.y + edgeNormal.y }, Math.SQRT1_2);
      }
      exit = Math.min(exit, end);
      if (entry > exit + EPS) return null;
    }

    if (entry > dt + EPS || exit < -EPS) return null;
    if (!normal || entry < -EPS) {
      const overlapNow = overlap(a, b);
      return overlapNow && overlapNow.depth > EPS ?
        { dt: 0, normal: overlapNow.normal, initialOverlap: true } : null;
    }
    return { dt: clamp(entry, 0, dt), normal, initialOverlap: false };
  }

  function bodyFor(car, fallback) {
    const forward = DIRECTIONS[car.dir] || DIRECTIONS[fallback];
    const mass = Math.max(1, finite(car.mass, 1400));
    const length = Math.max(.1, finite(car.length, 4.4));
    const width = Math.max(.1, finite(car.width, 1.75));
    return {
      x: finite(car.x, 0), y: finite(car.y, 0), angle: forward.angle, forward,
      speed: Math.max(0, finite(car.speed, 0)) / 3.6,
      mass, length, width, inertia: mass * (length ** 2 + width ** 2) / 12,
      tireRadius: .35 * Math.hypot(length, width),
      reaction: Math.max(0, finite(car.reaction, .8)),
      brakeFraction: clamp(finite(car.brake, 1), 0, 1),
      obeysStop: !!car.obeysStop, discovery: Number.isFinite(car.discovery) ? car.discovery : null,
      seen: null, brake: null, path: [], passed: false, decel: 0, omega: 0,
      brakingDistance: 0, travelDistance: 0, slideDistance: 0
    };
  }

  function roadBorders(s) {
    return (s.obstacles || []).filter((obstacle) => obstacle.w > 0 && obstacle.h > 0)
      .map(({ x, y, w, h }) => ({ min: [x - w / 2, y - h / 2], max: [x + w / 2, y + h / 2] }));
  }

  function segmentBlocked(source, target, obstacle) {
    let enter = 0;
    let leave = 1;
    for (let i = 0; i < 2; i++) {
      const origin = source[i];
      const movement = target[i] - origin;
      if (Math.abs(movement) <= EPS) {
        if (origin < obstacle.min[i] || origin > obstacle.max[i]) return false;
        continue;
      }
      const first = (obstacle.min[i] - origin) / movement;
      const last = (obstacle.max[i] - origin) / movement;
      enter = Math.max(enter, Math.min(first, last));
      leave = Math.min(leave, Math.max(first, last));
      if (enter > leave) return false;
    }
    return true;
  }

  function poseAt(body, time) {
    const speed = body.passed ? 0 : body.speed;
    const distance = (speed - .5 * body.decel * time) * time;
    return { x: body.x + body.forward.x * distance, y: body.y + body.forward.y * distance };
  }

  function visible(body, other, obstacles, ahead = 0) {
    const driver = poseAt(body, ahead);
    if (body.discovery !== null) return -dot(driver, body.forward) <= body.discovery + EPS;
    if (other.passed) return false;
    if (!obstacles.length) return true;
    const target = poseAt(other, ahead);
    const side = normalTo(body.forward);
    const otherSide = normalTo(other.forward);
    const eye = [
      driver.x + body.forward.x * body.length * .22 + side.x * body.width * .22,
      driver.y + body.forward.y * body.length * .22 + side.y * body.width * .22
    ];
    for (const [longitudinal, lateral] of [[0, 0], [-.48, -.48], [-.48, .48], [.48, -.48], [.48, .48]]) {
      const point = [
        target.x + other.forward.x * other.length * longitudinal + otherSide.x * other.width * lateral,
        target.y + other.forward.y * other.length * longitudinal + otherSide.y * other.width * lateral
      ];
      if (!obstacles.some((obstacle) => segmentBlocked(eye, point, obstacle))) return true;
    }
    return false;
  }

  function snapshot(body, time, phase) {
    return { x: body.x, y: body.y, angle: body.angle, t: time, phase };
  }

  function pushPose(body, time, phase) {
    const previous = body.path[body.path.length - 1];
    if (previous && Math.abs(previous.t - time) <= EPS && previous.phase === phase) return;
    body.path.push(snapshot(body, time, phase));
  }

  function phaseBefore(body) {
    if (body.speed <= EPS) return 'stop';
    return body.brake ? 'brake' : 'approach';
  }

  function signTime(body, grip) {
    if (!body.signActive || body.brake || body.passed || body.speed <= EPS) return Infinity;
    const remaining = -dot(body, body.forward) - body.signCenterDistance;
    const rate = grip * body.brakeFraction;
    const stopping = rate > EPS ? body.speed ** 2 / (2 * rate) : 0;
    return Math.max(0, (remaining - stopping) / body.speed);
  }

  function advance(body, dt) {
    if (body.passed || body.speed <= EPS) return;
    const distance = (body.speed - .5 * body.decel * dt) * dt;
    body.x += body.forward.x * distance;
    body.y += body.forward.y * distance;
    body.travelDistance += distance;
    if (body.brake) body.brakingDistance += distance;
    body.speed = Math.max(0, body.speed - body.decel * dt);
    if (body.speed <= EPS) {
      body.speed = 0;
      body.decel = 0;
    }
  }

  function energy(body) {
    return .5 * (body.mass * dot(body.v, body.v) + body.inertia * body.omega ** 2);
  }

  function activeSlide(body) {
    return norm(body.v) > .002 || Math.abs(body.omega) > .002;
  }

  function slide(body, grip, dt) {
    const speed = norm(body.v);
    const spin = body.omega * body.tireRadius;
    const combined = Math.hypot(speed, spin);
    if (!activeSlide(body)) {
      body.v = { x: 0, y: 0 };
      body.omega = 0;
      return;
    }
    const newSpeed = Math.max(0, speed - grip * speed / combined * dt);
    const newSpin = Math.max(0, Math.abs(body.omega) -
      grip * body.mass * body.tireRadius * Math.abs(spin) / (body.inertia * combined) * dt);
    const distance = (speed + newSpeed) / 2 * dt;
    if (speed > EPS) {

    return Math.max(min, Math.min(max, value));

  function screen(point) {
    return {
      x: camera.cx + camera.scale * point.x,
      y: camera.cy + camera.scale * point.y

  }

  function point(event) {
    const rect = canvas.getBoundingClientRect();
    const px = (event.clientX - rect.left) * camera.width / Math.max(rect.width, 1);
    const py = (event.clientY - rect.top) * camera.height / Math.max(rect.height, 1);

    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash(dash);

    y = clamp(y, 5, Math.max(5, camera.height - h - 5));

    const width = Math.max(1, canvas.clientWidth || rect.width);
    const height = Math.max(1, canvas.clientHeight || rect.height);
    if (width < 2 || height < 2) return;
    const ratio = Math.min(3, window.devicePixelRatio || 1);
    const backingWidth = Math.ceil(width * ratio);
    const backingHeight = Math.ceil(height * ratio);
    if (canvas.width !== backingWidth) canvas.width = backingWidth;
    if (canvas.height !== backingHeight) canvas.height = backingHeight;
    const zoom = Math.max(0.005, Number(view.zoom) || 1);
    camera = {width, height, cx: width / 2, cy: height / 2, scale: Math.min(width,height) / baseExtent * zoom};
    carLabels = [];
    ctx.setTransform(backingWidth / width, 0, 0, backingHeight / height, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    grid();
    roads(s.roads);
    s.obstacles.forEach((rect, i) => obstacle(rect, view.selection?.kind === 'obstacle' && view.selection.index === i));
    if (view.mode === 'scene') {
      sceneOverlay(s.cars, view);
    } else {
      forwardOverlay(s.cars, view.result);
      s.cars.forEach((car, i) => {
        const color = carColors[i];
        vehicle(car, car, headings[car.dir], color, 'active', view.selection?.kind === 'car' && view.selection.index === i);
        const p = screen(car);
        if (!isVisible(p)) return;
        const offset = Math.max(8, camera.scale * (car.dir === 'E' || car.dir === 'W' ? car.width : car.length) / 2 + 4);
        carLabels.push({
          ...label(i === 0 ? '車両 A' : '車両 B', p.x + 6, p.y + offset, color, {intro: color}),
          kind: 'car', index: i
        });
      });
      if (view.result?.collision) collisionMarker(view.result.collision, '衝突地点');
    }
    instruments();
  }

  function hit(worldPoint, s, view = {}) {
    const isScene = view.mode === 'scene';
    const targets = isScene ? view.scene?.stops || [] : s.cars;
    const kind = isScene ? 'stop' : 'car';
    const tolerance = 8 / camera.scale;
    let nearby = null;
    for (let index = targets.length - 1; index >= 0; index--) {
      const pose = targets[index];
      if (!pose || (isScene && view.scene.stopEnabled?.[index] === false)) continue;
      const angle = isScene ? pose.angle : headings[pose.dir];
      const dx = worldPoint.x - pose.x;
      const dy = worldPoint.y - pose.y;
      const longitudinal = Math.abs(dx * Math.cos(angle) + dy * Math.sin(angle)) - s.cars[index].length / 2;
      const lateral = Math.abs(dy * Math.cos(angle) - dx * Math.sin(angle)) - s.cars[index].width / 2;
      if (longitudinal <= 0 && lateral <= 0) return {kind, index};
      if (!nearby && longitudinal <= tolerance && lateral <= tolerance) nearby = {kind, index};
    }
    const p = screen(worldPoint);
    for (let index = carLabels.length - 1; index >= 0; index--) {
      const label = carLabels[index];
      if (p.x >= label.x && p.x <= label.x + label.w && p.y >= label.y && p.y <= label.y + label.h) {
        return {kind:label.kind,index:label.index};
      }
    }
    if (nearby) return nearby;
    for (let index = s.obstacles.length - 1; index >= 0; index--) {
      const ob = s.obstacles[index];
      if (Math.abs(worldPoint.x - ob.x) <= ob.w / 2 && Math.abs(worldPoint.y - ob.y) <= ob.h / 2) {
        return {kind:'obstacle',index};
      }
    }
    return null;
  }

  function fitZoom(s, view = {}) {
    const {width,height} = camera;
    const nominalScale = Math.min(width,height) / baseExtent;
    const scene = view.mode === 'scene';
    const points = scene ? [] : [...s.cars];
    for (const ob of s.obstacles) {
      points.push({x:ob.x-ob.w/2,y:ob.y-ob.h/2}, {x:ob.x+ob.w/2,y:ob.y+ob.h/2});
    }
    if (scene) {
      view.scene?.stops?.forEach((stop, i) => {
        if (stop && view.scene.stopEnabled?.[i] !== false) points.push(stop);
      });
      const candidate = view.estimate?.candidates?.[view.selected ?? 0];
      candidate?.routes?.forEach(route => {
        for (const p of route || []) points.push(p);
      });
      candidate?.positions?.forEach(pose => points.push(pose));
    } else if (view.result?.cars) {
      view.result.cars.forEach(track => {
        for (const p of track.path) points.push(p);
      });
    }
    let maxX = 17;
    let maxY = 17;
    for (const p of points) {
      maxX = Math.max(maxX,Math.abs(p.x));
      maxY = Math.max(maxY,Math.abs(p.y));
    }
    const paddedWidth = Math.max(width * 0.65, width - 76);
    const paddedHeight = Math.max(height * 0.65, height - 76);
    return clamp(Math.min(paddedWidth / (2*maxX), paddedHeight / (2*maxY)) / nominalScale, 0.005, 1.25);
  }

  return {draw, point, hit, fitZoom};
}

      <strong>候補 ${index+1} <small>　適合度 ${format(candidate.score,0)}</small></strong>
      <small>${escapeText(candidate.label)}</small>
      <span>衝突直前 A ${format(candidate.speeds[0])} / B ${format(candidate.speeds[1])} km/h</span>
      <small>初期速度 A ${format(candidate.startSpeeds[0])} / B ${format(candidate.startSpeeds[1])} km/h</small>
      <small>摩擦係数 ${format(candidate.mu,2)}　反発係数 ${format(candidate.restitution,2)}</small>
    </button>`).join("");
  const values = sceneEstimate.candidates;
  const ranges = values.length > 1 ? names.map((name,index)=>{
    const speeds = values.map(candidate=>candidate.speeds[index]);
    return name+" "+format(Math.min(...speeds))+"–"+format(Math.max(...speeds))+" km/h";
  }).join("　") : "";
  const active = sceneEstimate.candidates[selected];
  const stopText = active?.stops?.map((stop,index)=>`
    <p class="scene-info candidate-stop">${names[index]}の停止候補　X ${format(stop.x)} m / Y ${format(stop.y)} m、車体 ${angleLabel(stop.angle)}°、移動方向 ${angleLabel(stop.heading)}°</p>`).join("") || "";
  byId("scene-result").innerHTML = `<p class="mode-copy">${escapeText(sceneEstimate.detail)}</p>` +
    (candidates ? `${ranges ? `<p class="scene-info">候補間の衝突直前速度の幅　${ranges}</p>` : ""}<div class="candidates">${candidates}</div>${stopText}` : "");
}
function view() {
  return {mode, result:mode==="inverse" && !pointer ? inverseResult?.result : forwardResult,
    scene,estimate:sceneEstimate,selected,zoom,selection};
}
function draw() {
  const scenario = mode === "inverse" && !pointer && inverseResult?.scenario ? inverseResult.scenario : s;
  diagram.draw(scenario,view());
  byId("zoom-value").textContent = Math.round(zoom*100) + "%";
}
function update() {
  pendingFrame = 0;
  if (renderedConfigVersion !== configVersion) {
    forwardResult = simulate(s);
    renderedConfigVersion = configVersion;
  }
  if (mode === "inverse") {
    if (pointer) {
      byId("inverse-result").textContent = "位置を調整中です。ドラッグを終えると逆算結果を更新します。";
    } else {
      inverseResult = solveInverse(s,inverse.car,inverse.key);
      renderInverse();
    }
  } else if (mode === "scene") {
    sceneEstimate = estimateScene(s,scene);
    selected = clamp(selected,0,Math.max(0,sceneEstimate.candidates.length-1));
    renderSceneResults();
  } else {
    renderForward();
  }
  draw();
}
function schedule(configChanged=false) {
  if (configChanged) configVersion++;
  if (!pendingFrame) pendingFrame = requestAnimationFrame(update);
}
function flush() {
  if (pendingFrame) cancelAnimationFrame(pendingFrame);
  update();
}
function syncToolbar() {
  byId("diagram-hint").textContent = mode !== "scene" ? "車両をドラッグして初期位置を調整" : "停止マーカーをドラッグして位置を調整";
}
const desktopLayout = matchMedia("(min-width:1280px)");
const workspaceResults = byId("workspace-results");
function syncLayout() {
  const inverseOutput = byId("inverse-result");
  const sceneOutput = byId("scene-result");
  if (desktopLayout.matches) {
    workspaceResults.append(inverseOutput,sceneOutput);
  } else {
    byId("inverse-controls").after(inverseOutput);
    byId("scene-controls").after(sceneOutput);
  }
}
if (desktopLayout.addEventListener) desktopLayout.addEventListener("change", syncLayout);
else desktopLayout.addListener(syncLayout);
if (desktopLayout.matches) syncLayout();
function setMode(nextMode) {
  if (mode !== nextMode && desktopLayout.matches) {
    workspaceResults.scrollTop = 0;
    byId("workspace-settings").scrollTop = 0;
  }
  mode = nextMode;
  selected = 0;
  document.querySelectorAll("[data-mode]").forEach(button => button.setAttribute("aria-pressed",button.dataset.mode === mode));
  byId("forward-result").hidden = mode !== "forward";
  byId("inverse-panel").hidden = mode !== "inverse";
  byId("inverse-result").hidden = mode !== "inverse";
  byId("scene-panel").hidden = mode !== "scene";
  byId("scene-result").hidden = mode !== "scene";
  byId("disclaimer").textContent = disclaimer + (mode === "scene" ? " "+uncertainty : "");
  byId("legend").innerHTML = names.map((label,index)=>`<span class="legend-item"><i class="swatch" style="--swatch:${colors[index]}"></i>${label}</span>`).join("")+
    (mode === "scene" ? '<span class="legend-item"><i class="line-sample"></i>推定ルート</span><span class="legend-item"><i class="swatch" style="--swatch:#e86b7d"></i>衝突候補</span>'
      : '<span class="legend-item"><i class="line-sample"></i>制動・スリップ軌跡</span><span class="legend-item"><i class="swatch" style="--swatch:#e86b7d"></i>衝突地点</span>');
  syncToolbar();
  schedule();
}

function applyInput(target) {
  const path = target.dataset.bind;
  if (!path) return;
  let value = target.value;
  if (target.type === "number") {
    if (target.validity.badInput) return;
    if (value === "" && !target.dataset.optional) return;
    value = value === "" ? null : clamp(Number(value),Number(target.min),Number(target.max));
    if (value !== null && Number(target.step) === 1) value = Math.round(value);
    if (target.dataset.angle) value = radians(value);
  } else if (target.type === "checkbox") {
    value = target.checked;
  } else if (path === "inverse.car") {
    value = Number(value);
  }
  if (readPath(path) === value) return;
  writePath(path,value);
  syncPath(path,target);
  if (path === "s.surface" && value !== "custom") {
    s.mu = surfaces[value].mu;
    syncPath("s.mu");
  } else if (path === "s.mu") {
    s.surface = "custom";
    syncPath("s.surface");
  }
  const carMatch = /^s\.cars\.(\d)\.(\w+)$/.exec(path);
  if (carMatch) {
    const [,index,property] = carMatch;
    const car = s.cars[index], base = `s.cars.${index}.`;
    if (property === "preset" && value !== "custom") {
      const {mass,length,width} = presets[value];
      Object.assign(car,{mass,length,width});
      ["mass","length","width"].forEach(key=>syncPath(base+key));
    } else if (["mass","length","width"].includes(property)) {
      car.preset = "custom";
      syncPath(base+"preset");
    }
  }
  if (path.startsWith("scene.stopEnabled")) {
    target.parentElement.nextElementSibling.hidden = !value;
  }
  selected = 0;
  schedule(path.startsWith("s."));
}
document.addEventListener("input", event => {
  const target = event.target;
  if (target.type==="number") applyInput(target);
});
document.addEventListener("change", event => {
  const target = event.target;
  if (target.dataset.pin) {
    const section = target.dataset.pin;
    pinned[section] = target.checked;
    try { localStorage.setItem(pinKey,JSON.stringify(pinned)); }
    catch { notify("このブラウザでは開閉設定を保存できません。"); }
    return;
  }
  applyInput(target);
  if (target.type === "number" && target.dataset.bind) syncPath(target.dataset.bind);
});
document.querySelectorAll("[data-section]").forEach(details => {
  details.open = !!pinned[details.dataset.section];
  details.addEventListener("toggle", () => {
    if (pinned[details.dataset.section] && !details.open) details.open = true;
  });
});

function seedScene() {
  flush();
  if (!forwardResult.collision) {
    notify("検証結果に衝突がありません。");
    return;
  }
  forwardResult.cars.forEach((car,index) => {
    const key = index ? "b" : "a";
    const post = forwardResult.collision.postVelocity?.[index];
    const heading = post ? Math.atan2(post.y,post.x) : car.end.angle;
    const values = {x:car.end.x,y:car.end.y,angle:car.end.angle,heading};
    Object.keys(values).forEach(field => {
      if (!scene.locks[key+"."+field]) scene.stops[index][field] = values[field];
    });
    scene.stopEnabled[index] = true;
  });
  selected = 0;
  renderSceneControls();
  schedule();
}
function fitDiagram() {
  flush();
  const scenario = mode === "inverse" && !pointer && inverseResult?.scenario ? inverseResult.scenario : s;
  zoom = clamp(diagram.fitZoom(scenario,view()),.005,3);
  draw();
}
document.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  const {action,lock,mode:targetMode,index} = button.dataset;
  if (targetMode) return setMode(targetMode);
  if (lock) {
    const locked = !scene.locks[lock];
    scene.locks[lock] = locked;
    button.textContent = locked ? "🔒" : "🔓";
    button.title = locked ? "固定を解除" : "この値を固定";
    button.setAttribute("aria-pressed",locked);
    selected = 0;
    schedule();
  }
  if (action === "zoom-fit") fitDiagram();
  if (action === "zoom-in" || action === "zoom-out") {
    zoom = clamp(zoom*(action==="zoom-in" ? 1.22 : 1/1.22),.005,3);
    draw();
  }
  if (action === "candidate") {
    selected = Number(index);
    byId("scene-result").querySelectorAll(".candidate").forEach(item => item.setAttribute("aria-pressed",item===button));
    const active = sceneEstimate.candidates[selected];
    const lines = byId("scene-result").querySelectorAll(".candidate-stop");
    lines.forEach((line,i)=>{
      const stop = active.stops[i];
      line.textContent = `${names[i]}の停止候補　X ${format(stop.x)} m / Y ${format(stop.y)} m、車体 ${angleLabel(stop.angle)}°、移動方向 ${angleLabel(stop.heading)}°`;
    });
    draw();
  }
  if (action === "seed-scene") seedScene();
  if (action === "add-obstacle") {
    if (s.obstacles.length >= 12) return notify("遮蔽物は12個まで設置できます。");
    const offset = 2*(s.obstacles.length%5);
    s.obstacles.push({x:10+offset,y:-10,w:5,h:5});
    renderObstacles();
    document.querySelector(`[data-bind="s.obstacles.${s.obstacles.length-1}.x"]`)?.focus();
    schedule(true);
  }
  if (action === "remove-obstacle") {
    s.obstacles.splice(Number(index),1);
    renderObstacles();
    schedule(true);
  }
  if (action === "reset") {
    if (!window.confirm("車両・道路の設定と入力した現場の停止位置を初期状態に戻しますか？")) return;
    s = defaultConfig();
    scene = defaultScene();
    inverse = {car:0,key:"speed"};
    zoom = 1;
    selected = 0;
    renderControls();
    syncToolbar();
    schedule(true);
    notify("初期設定に戻しました。");
  }
});
plan.addEventListener("pointerdown", event => {
  if (!event.isPrimary || event.button !== 0) return;
  const point = diagram.point(event);
  let kind, index, offsetX = 0, offsetY = 0;
  const hit = diagram.hit(point,s,view());
  if (!hit) return;
  ({kind,index} = hit);
  const object = kind === "stop" ? scene.stops[index] : kind === "car" ? s.cars[index] : s.obstacles[index];
  offsetX = object.x-point.x;
  offsetY = object.y-point.y;
  selection = hit;
  pointer = {id:event.pointerId,kind,index,offsetX,offsetY};
  plan.setPointerCapture(event.pointerId);
  plan.classList.add("dragging");
  schedule();
});
plan.addEventListener("pointermove", event => {
  if (pointer?.id !== event.pointerId) return;
  const point = diagram.point(event);
  const {kind,index,offsetX,offsetY} = pointer;
  const path = kind === "stop" ? `scene.stops.${index}` : kind === "car" ? `s.cars.${index}` : `s.obstacles.${index}`;
  const size = kind === "obstacle" ? 100 : 150;
  const object = readPath(path);
  const prefix = index ? "b." : "a.";
  if (kind !== "stop" || !scene.locks[prefix+"x"]) object.x = rounded(clamp(point.x+offsetX,-size,size));
  if (kind !== "stop" || !scene.locks[prefix+"y"]) object.y = rounded(clamp(point.y+offsetY,-size,size));
  syncPath(path+".x");
  syncPath(path+".y");
  if (kind === "stop") selected = 0;
  schedule(kind !== "stop");
});
function endPointer(event) {
  if (pointer?.id !== event.pointerId) return;
  if (plan.hasPointerCapture(event.pointerId)) plan.releasePointerCapture(event.pointerId);
  pointer = null;
  selection = null;
  plan.classList.remove("dragging");
  syncToolbar();
  schedule();
}
plan.addEventListener("pointerup",endPointer);
plan.addEventListener("pointercancel",endPointer);
plan.addEventListener("lostpointercapture",endPointer);
new ResizeObserver(() => draw()).observe(plan);

function download(blob,filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function saveSettings() {
  const data = {version:1,mode,settings:clone(s),inverse:{...inverse},scene:clone(scene)};
  download(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),"kijou-gp-settings.json");
  notify("設定を JSON で保存しました。");
}
function savePng() {
  flush();
  const image = document.createElement("canvas");
  const width = Math.max(900, plan.width), margin = Math.round(width * .035);
  const chartHeight = Math.round(width*plan.height/plan.width);
  const active = sceneEstimate?.candidates[selected];
  const report = mode === "scene" ? (active ? `候補 ${selected+1}　衝突直前 A ${format(active.speeds[0])} / B ${format(active.speeds[1])} km/h` : "現場推定")
    : mode === "inverse" ? `${inverseTypes[inverse.key]}　${inverseResult.value == null ? "算出条件なし" : format(inverseResult.value,inverseResult.unit ? 1 : 2)+" "+inverseResult.unit}`
    : forwardResult.collision ? `衝突あり　${format(forwardResult.collision.t,2)} 秒　相対速度 ${format(forwardResult.collision.deltaV)} km/h` : "計算範囲内で衝突なし";
  const font = Math.max(15,Math.round(width*.019)), header = font*5, footer = font*(mode==="scene" ? 6 : 5);
  image.width = width;
  image.height = chartHeight+header+footer;
  const ctx = image.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,image.width,image.height);
  ctx.fillStyle = "#152237";
  ctx.font = `bold ${font*1.55}px sans-serif`;
  ctx.fillText("机上の空論GP",margin,font*2);
  ctx.font = `${font}px sans-serif`;
  ctx.fillText(modeNames[mode]+"　"+report,margin,font*3.8);
  ctx.drawImage(plan,0,header,width,chartHeight);
  ctx.fillStyle = "#354964";
  const legendText = mode === "scene" ? "車両A（青緑）・車両B（黄）　破線は推定ルート" : "車両A（青緑）・車両B（黄）　赤は衝突地点";
  const printed = [legendText,disclaimer,...(mode === "scene" ? [uncertainty] : [])];
  printed.forEach((line,index)=>ctx.fillText(line,margin,header+chartHeight+font*(1.7+index*1.35),width-margin*2));
  image.toBlob(blob => {
    if (!blob) return notify("PNG を保存できませんでした。");
    download(blob,`kijou-gp-${mode}.png`);
    notify("図面を PNG で保存しました。");
  },"image/png");
}
byId("export-settings").addEventListener("click",saveSettings);
byId("export-png").addEventListener("click",savePng);
renderControls();
setMode("forward");

</script>
</body>
</html>
