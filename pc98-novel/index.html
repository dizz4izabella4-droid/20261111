<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>零時の記録</title>
<style>
/* base.css — 土台（画面の拡大縮小・リセット） */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Yu Gothic","YuGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  color:#f0f4f8;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
[hidden]{display:none!important}
#pn-root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* 論理サイズ: 横 640×400 ／ 縦 400×(可変)。JS が transform で拡大縮小する */
#pn-stage{position:relative;flex:none;width:640px;height:400px;overflow:hidden;background:#000;transform-origin:center center;cursor:default}
#pn-stage.port{width:400px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}

/* pc98-theme.css — 配色・枠・表示エリア（黒／濃紺／灰／青緑の限定色） */
:root{
  --k:#000;--navy:#0a1040;--navy2:#141c68;--blue:#2848b0;--teal:#30b0a8;--teal2:#78e8d8;
  --gray:#808898;--lgray:#c8ccd8;--white:#f0f4f8;--yel:#e8d860;--red:#e86070;
}
/* 上部の情報欄 */
#pn-status{position:absolute;left:0;top:0;right:0;height:18px;z-index:5;display:flex;gap:14px;align-items:center;
  padding:0 8px;font-size:12px;line-height:18px;color:var(--teal2);background:rgba(0,0,0,.72);border-bottom:1px solid var(--teal);white-space:nowrap;overflow:hidden}
#pn-status #st-place{color:var(--white)}
#pn-status #st-chapter{margin-left:auto;color:var(--lgray)}
#pn-status:empty,#pn-status.off{display:none}
/* 背景・キャラクター表示エリア（常に 640×400 で描き、縦持ちでは縮小して上に置く） */
#pn-view{position:absolute;left:0;top:0;width:640px;height:400px;overflow:hidden;background:#000;transform-origin:0 0}
#pn-bg,#pn-bgimg{position:absolute;left:0;top:0;width:640px;height:400px;image-rendering:pixelated}
#pn-bgimg{object-fit:cover}
#pn-chars{position:absolute;inset:0}
.pn-char{position:absolute;bottom:0;width:200px;height:300px;margin-left:-100px;image-rendering:pixelated;transition:opacity .25s,left .25s;opacity:0}
.pn-char.on{opacity:1}
.pn-char canvas,.pn-char img{position:absolute;left:0;bottom:0;width:100%;height:100%;image-rendering:pixelated}
.pn-char img{object-fit:contain;object-position:bottom}
.land .pn-char{bottom:96px}
#pn-devlabel{position:absolute;left:4px;top:22px;font-size:10px;line-height:14px;color:var(--yel);background:rgba(0,0,0,.6);padding:0 4px;white-space:pre;pointer-events:none}
#pn-devlabel:empty{display:none}
/* 走査線 */
#pn-scan{position:absolute;inset:0;z-index:90;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 1px,rgba(0,0,0,.16) 1px,rgba(0,0,0,.16) 2px)}
/* 縦持ち */
.port #pn-status{height:24px;font-size:13px;line-height:24px;padding-right:52px;background:#000}
.port #pn-view{top:24px;transform:scale(.625)}
.port #pn-devlabel{top:4px}
/* 共通の枠（二重線のウィンドウ） */
.pn-frame{background:rgba(8,12,52,.9);border:2px solid var(--white);outline:1px solid var(--k);box-shadow:inset 0 0 0 1px var(--k),inset 0 0 0 2px var(--teal)}

/* dialogue.css — 名前欄・本文欄・選択肢・操作ボタン列 */
#pn-msg{position:absolute;left:6px;right:6px;bottom:4px;height:104px;z-index:10;
  background:rgba(8,12,52,.9);border:2px solid var(--white);outline:1px solid var(--k);box-shadow:inset 0 0 0 1px var(--k),inset 0 0 0 2px var(--teal)}
#pn-name{position:absolute;left:14px;bottom:108px;z-index:11;height:20px;min-width:72px;padding:0 10px;font-size:13px;line-height:18px;font-weight:700;text-align:center;
  color:var(--k);background:var(--teal2);border:1px solid var(--white);border-bottom:0}
#pn-name:empty{display:none}
#pn-text{position:absolute;left:12px;right:12px;top:7px;bottom:22px;overflow:hidden;font-size:16px;line-height:23px;font-weight:500;letter-spacing:.02em;
  color:var(--white);text-shadow:1px 0 0 rgba(240,244,248,.35);white-space:pre-wrap;word-break:break-all;line-break:strict}
#pn-text .c{visibility:hidden}
#pn-text .c.on{visibility:visible}
#pn-text.fade .c{visibility:visible;opacity:0;transition:opacity var(--cf,200ms) linear}
#pn-text.fade .c.on{opacity:1}
#pn-text.whole{transition:opacity var(--wf,600ms) linear}
#pn-text.nofx,#pn-text.nofx .c{transition:none!important}
#pn-next{position:absolute;right:10px;bottom:22px;font-size:11px;color:var(--teal2);display:none;animation:pn-blink .9s steps(2) infinite}
#pn-next.on{display:block}
@keyframes pn-blink{50%{opacity:0}}
/* 操作ボタン列（PC-98 のファンクションキー欄ふう） */
#pn-fkeys{position:absolute;left:4px;right:4px;bottom:3px;height:16px;display:flex;gap:3px}
#pn-fkeys button{flex:1;height:16px;font-size:10px;line-height:14px;letter-spacing:.06em;color:var(--k);background:var(--lgray);border:1px solid var(--k);white-space:nowrap;overflow:hidden}
#pn-fkeys button.on{background:var(--yel)}
#pn-fkeys button:active{background:var(--teal2)}
#pn-fkeys button.dev{background:var(--red);color:#fff}
/* 選択肢 */
#pn-choices{position:absolute;left:0;right:0;top:22px;height:252px;z-index:12;display:none;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:4px 0;overflow:auto}
#pn-choices.on{display:flex}
#pn-choices .prompt{font-size:13px;color:var(--teal2);background:rgba(0,0,0,.7);padding:1px 10px}
#pn-choices button{flex:none;width:440px;max-width:92%;min-height:30px;padding:4px 12px;font-size:15px;line-height:20px;text-align:left;color:var(--white);
  background:rgba(8,12,52,.92);border:2px solid var(--white);box-shadow:inset 0 0 0 1px var(--k),inset 0 0 0 2px var(--teal)}
#pn-choices button::before{content:"　"}
#pn-choices button.sel{color:var(--k);background:var(--teal2);box-shadow:inset 0 0 0 1px var(--k)}
#pn-choices button.sel::before{content:"▶"}
#pn-choices button.forced{border-style:dashed;color:var(--yel)}
/* お知らせ（情報入手など） */
#pn-notice{position:absolute;right:8px;top:24px;z-index:40;display:flex;flex-direction:column;gap:3px;align-items:flex-end;pointer-events:none}
#pn-notice div{font-size:12px;line-height:18px;padding:0 8px;color:var(--k);background:var(--yel);border:1px solid var(--k);animation:pn-notice 2.6s linear forwards}
#pn-notice div.err{background:var(--red);color:#fff}
@keyframes pn-notice{0%{opacity:0;transform:translateX(12px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
/* 縦持ち：絵は上、本文欄は下に広く */
.port #pn-name{left:0;bottom:auto;top:278px;height:24px;line-height:22px;font-size:15px;min-width:96px;border-left:0}
.port #pn-msg{left:0;right:0;top:302px;bottom:0;height:auto;border-left:0;border-right:0;border-bottom:0}
.port #pn-text{left:14px;right:14px;top:12px;bottom:52px;font-size:19px;line-height:32px}
.port #pn-next{right:14px;bottom:50px;font-size:14px}
.port #pn-fkeys{left:4px;right:4px;bottom:5px;height:38px;gap:4px}
.port #pn-fkeys button{height:38px;font-size:11px;line-height:36px;letter-spacing:0}
.port #pn-choices{top:24px;height:250px}
.port #pn-choices button{width:372px;min-height:36px;font-size:16px;line-height:22px}
.port #pn-notice{top:30px}

/* menu.css — タイトル・メニュー・セーブ／ロード・設定・バックログ・情報・エンディング・開発者 */
#pn-screens{position:absolute;inset:0;z-index:50;pointer-events:none}
.pn-screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);pointer-events:auto}
.pn-screen.opaque{background:#000}
.pn-win{display:flex;flex-direction:column;max-width:calc(100% - 16px);max-height:calc(100% - 12px);min-width:220px;
  background:#080c34;border:2px solid var(--white);outline:1px solid var(--k);box-shadow:inset 0 0 0 1px var(--k),inset 0 0 0 2px var(--teal),4px 4px 0 rgba(0,0,0,.6)}
.pn-win.full{width:calc(100% - 16px);height:calc(100% - 12px)}
.pn-win-title{flex:none;margin:3px 3px 0;padding:0 8px;height:20px;font-size:12px;line-height:20px;letter-spacing:.12em;font-weight:700;color:var(--k);
  background:var(--teal2);display:flex;justify-content:space-between}
.pn-win-title .x{padding:0 6px;color:var(--k);font-weight:700}
.pn-win-body{flex:1;min-height:0;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--teal) var(--navy)}
.pn-win-foot{flex:none;display:flex;gap:6px;flex-wrap:wrap;padding:4px 10px 8px;font-size:11px;color:var(--gray);align-items:center}
.pn-item{flex:none;display:block;width:100%;min-height:26px;padding:3px 10px;font-size:14px;line-height:20px;text-align:left;color:var(--white);border:1px solid transparent}
.pn-item:focus{outline:none}
.pn-item.sel,.pn-item:focus-visible{color:var(--k);background:var(--teal2);border-color:var(--k)}
.pn-item[disabled]{color:var(--gray);cursor:default}
.pn-item.center{text-align:center;letter-spacing:.2em}
.pn-btn{flex:none;width:auto;min-height:24px;padding:1px 10px;font-size:12px;border:1px solid var(--lgray);text-align:center}
.pn-note{font-size:12px;line-height:18px;color:var(--lgray);white-space:pre-wrap}
.pn-note.warn{color:var(--yel)}
.pn-note.err{color:var(--red)}
/* タイトル */
.pn-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(0,0,8,.5)}
.pn-title h1{font-size:44px;line-height:1.2;font-weight:700;letter-spacing:.3em;margin-right:-.3em;color:var(--white);text-shadow:2px 0 0 var(--teal),0 2px 0 var(--blue),3px 3px 0 #000}
.pn-title .sub{font-size:12px;letter-spacing:.4em;color:var(--teal2);margin-bottom:18px}
.pn-title .menu{display:flex;flex-direction:column;gap:2px;width:220px;padding:6px;background:rgba(8,12,52,.9);border:2px solid var(--white);box-shadow:inset 0 0 0 1px var(--k),inset 0 0 0 2px var(--teal)}
.pn-title .ver{position:absolute;right:8px;bottom:6px;font-size:10px;color:var(--gray)}
.pn-title .copy{position:absolute;left:8px;bottom:6px;font-size:10px;color:var(--gray)}
.port .pn-title h1{font-size:40px}
/* セーブ・ロード */
.pn-slot{display:grid;grid-template-columns:44px 1fr auto;column-gap:8px;align-items:center;min-height:42px;border:1px solid var(--blue)}
.pn-slot .no{font-size:13px;color:var(--teal2);text-align:center;font-weight:700}
.pn-slot .main{min-width:0}
.pn-slot .l1{font-size:12px;color:var(--lgray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-slot .l2{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-slot .meta{font-size:10px;line-height:14px;color:var(--gray);text-align:right;white-space:nowrap}
.pn-slot.sel .no,.pn-slot.sel .l1,.pn-slot.sel .meta,.pn-slot:focus-visible .no,.pn-slot:focus-visible .l1,.pn-slot:focus-visible .meta{color:var(--k)}
.pn-slot.empty .l2{color:var(--gray)}
/* 設定 */
.pn-cfg{display:grid;grid-template-columns:1fr 26px 108px 26px;align-items:center;column-gap:4px;min-height:26px;padding:1px 6px;font-size:13px;border:1px solid transparent}
.pn-cfg.sel{border-color:var(--teal2);background:rgba(48,176,168,.22)}
.pn-cfg.na{color:var(--gray)}
.pn-cfg .v{text-align:center;color:var(--yel);font-size:13px;white-space:nowrap}
.pn-cfg.na .v{color:var(--gray)}
.pn-cfg button{height:22px;font-size:12px;color:var(--k);background:var(--lgray);border:1px solid var(--k)}
.pn-cfg button:active{background:var(--teal2)}
.pn-preview{flex:none;height:58px;padding:5px 8px;font-size:14px;line-height:22px;border:1px solid var(--teal);background:#000;white-space:pre-wrap;overflow:hidden}
.pn-preview .c{visibility:hidden}.pn-preview .c.on{visibility:visible}
.pn-preview.fade .c{visibility:visible;opacity:0;transition:opacity var(--cf,200ms) linear}.pn-preview.fade .c.on{opacity:1}
.pn-preview.whole{transition:opacity var(--wf,600ms) linear}
.pn-preview.nofx,.pn-preview.nofx .c{transition:none!important}
/* バックログ */
.pn-log{font-size:14px;line-height:21px;padding:3px 4px;border-bottom:1px dotted var(--blue);white-space:pre-wrap;word-break:break-all;flex:none}
.pn-log .who{color:var(--teal2);font-size:12px;font-weight:700}
.pn-log.choice{color:var(--yel)}
/* 情報 */
.pn-two{display:flex;gap:8px;flex:1;min-height:0}
.pn-two .list{flex:0 0 42%;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.pn-two .detail{flex:1;overflow-y:auto;padding:6px 8px;border:1px solid var(--teal);background:#000;font-size:14px;line-height:22px;white-space:pre-wrap}
.pn-two .detail h3{font-size:14px;color:var(--teal2);margin-bottom:4px}
.port .pn-two{flex-direction:column}
.port .pn-two .list{flex:0 0 40%}
/* エンディング */
.pn-end{display:grid;grid-template-columns:86px 1fr auto;column-gap:8px;align-items:center;min-height:30px;padding:2px 8px;font-size:13px;border:1px solid var(--blue);flex:none}
.pn-end .ty{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--k);background:var(--teal2);text-align:center;padding:0 2px}
.pn-end.t-BAD .ty{background:var(--red);color:#fff}.pn-end.t-TRUE .ty{background:var(--yel)}.pn-end.t-SECRET .ty{background:var(--white)}.pn-end.t-NORMAL .ty{background:var(--lgray)}
.pn-end.lock{color:var(--gray)}.pn-end.lock .ty{background:var(--gray);color:var(--k)}
.pn-end .at{font-size:10px;color:var(--gray);text-align:right;white-space:nowrap}
.pn-ending{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000;padding:20px;text-align:center}
.pn-ending .ty{font-size:14px;letter-spacing:.5em;margin-right:-.5em;color:var(--teal2)}
.pn-ending .nm{font-size:30px;font-weight:700;letter-spacing:.2em;margin-right:-.2em;text-shadow:2px 0 0 var(--teal),0 2px 0 var(--blue)}
.pn-ending .tx{font-size:14px;line-height:24px;color:var(--lgray);white-space:pre-wrap;max-width:440px}
.pn-ending .cnt{font-size:11px;color:var(--gray)}
.pn-ending .pn-item{width:200px;border-color:var(--lgray);margin-top:10px}
/* 開発者モード */
.pn-tabs{display:flex;gap:3px;flex:none}
.pn-tabs button{flex:1;height:22px;font-size:11px;color:var(--k);background:var(--lgray);border:1px solid var(--k)}
.pn-tabs button.on{background:var(--yel)}
.pn-dev-row{display:flex;gap:6px;align-items:center;font-size:12px;line-height:18px;flex:none;border-bottom:1px dotted var(--blue);padding:2px 2px}
.pn-dev-row .k{flex:1;min-width:0;word-break:break-all;white-space:pre-wrap}
.pn-dev-row .v{color:var(--yel)}
.pn-dev-row button{flex:none;min-width:24px;height:20px;padding:0 6px;font-size:11px;color:var(--k);background:var(--lgray);border:1px solid var(--k)}
.pn-dev-row input{flex:1;min-width:0;height:22px;font:inherit;font-size:12px;color:var(--white);background:#000;border:1px solid var(--teal);padding:0 4px;-webkit-user-select:text;user-select:text}
.pn-dev-row.err .k{color:var(--red)}.pn-dev-row.warn .k{color:var(--yel)}
/* 起動エラー */
.pn-fatal{position:absolute;inset:0;z-index:99;background:#000040;color:#fff;padding:14px;font-size:13px;line-height:20px;overflow:auto;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.pn-fatal h2{font-size:15px;color:var(--yel);margin-bottom:8px}
/* 縦持ちでは、右上に共通の表示設定ボタン（⛶）が重なるので、×を左へ寄せる */
.port .pn-win.full .pn-win-title{padding-right:50px}
/* タイトル上部の注意書き */
.pn-title .note{position:absolute;left:10px;right:10px;top:8px;padding:3px 8px;font-size:12px;line-height:18px;text-align:center;color:var(--k);background:var(--yel);border:1px solid var(--k);box-shadow:inset 0 0 0 1px var(--yel),inset 0 0 0 2px var(--k)}
.port .pn-title .note{top:34px;font-size:12px}

/* effects.css — 画面演出 */
#fx-fade,#fx-flash,#fx-noise{position:absolute;left:0;top:0;width:640px;height:400px;pointer-events:none;opacity:0}
#fx-fade{background:#000;z-index:8}
#fx-flash{background:#fff;z-index:9}
#fx-noise{z-index:7;image-rendering:pixelated;mix-blend-mode:screen}
#pn-view.invert{filter:invert(1)}
#pn-stage.shake #pn-view,#pn-stage.shake #pn-msg,#pn-stage.shake #pn-name{animation:pn-shake .09s steps(2) infinite}
@keyframes pn-shake{0%{translate:-5px 3px}50%{translate:4px -4px}100%{translate:-3px -2px}}
#pn-text.glitch{animation:pn-glitch .22s steps(3) infinite}
@keyframes pn-glitch{
  0%{text-shadow:2px 0 0 var(--teal),-2px 0 0 var(--red);translate:1px 0;clip-path:inset(0 0 0 0)}
  33%{text-shadow:-3px 0 0 var(--teal),3px 0 0 var(--red);translate:-2px 1px;clip-path:inset(8% 0 30% 0)}
  66%{text-shadow:3px 1px 0 var(--blue),-1px 0 0 var(--yel);translate:2px -1px;clip-path:inset(40% 0 5% 0)}
  100%{text-shadow:1px 0 0 var(--teal),-1px 0 0 var(--red);translate:0 0;clip-path:inset(0 0 0 0)}
}
#pn-text.garble{color:var(--teal2)}
@media (prefers-reduced-motion:reduce){
  #pn-stage.shake #pn-view,#pn-stage.shake #pn-msg,#pn-stage.shake #pn-name,#pn-text.glitch{animation:none}
}

</style>

<script>
/* iz-game-base v1 — 全ゲーム共通の基本設計
 *  1. iOS の「ダブルタップで拡大」「ピンチ拡大」を無効にする
 *  2. 全画面表示の切り替え（Fullscreen API。iPhone は非対応のため「ホーム画面に追加」を案内）
 *  3. 画面の向き（自動 / 縦 / 横）の選択（Androidは全画面時に固定、非対応端末は回転の案内を出す）
 * 各作品の <head> へ tools/apply_game_base.py が埋め込む（作品は1ファイル完結のため、外部読み込みはしない）。
 * 位置を変えたいときは、この前に window.IZ_BASE={pos:'tr'|'tl'|'br'|'bl'} を書く。
 */
(function () {
  'use strict';
  if (window.__izGameBase) return;
  window.__izGameBase = 1;
  var D = document, W = window, DE = D.documentElement;
  var KEY = 'izGameBase.orient';
  var cfg = W.IZ_BASE || {};
  /* 表示文言。作品側で window.IZ_BASE={lang:'en'} を書くと英語になる（既定は日本語） */
  var T = cfg.lang === 'en'
    ? { set: 'Display settings', scr: 'SCREEN', fs: 'Go full screen', fsOff: 'Exit full screen', ori: 'ORIENTATION', auto: 'Auto', port: 'Portrait', land: 'Landscape', close: 'Close', nAuto: 'Follows your device orientation.', nFix: 'Locks the orientation in full screen. If it cannot be locked, please rotate your device.', rot: function (m) { return '\u21bb Please turn your device to ' + (m === 'land' ? 'landscape' : 'portrait'); } }
    : { set: '表示設定', scr: '画面', fs: '全画面にする', fsOff: '全画面をやめる', ori: '向き', auto: '自動', port: '縦', land: '横', close: '閉じる', nAuto: '端末の向きに合わせます。', nFix: '全画面のときに向きを固定します。固定できない場合は、端末を回してください。', rot: function (m) { return '\u21bb 端末を' + (m === 'land' ? '横' : '縦') + '向きにしてください'; } };

/* ======== core.js ======== */
/* core.js — 名前空間・共通の道具・ログ */
var PN = window.PN = { version: '0.1.0', SAVE_VERSION: 1 };
(function () {
  'use strict';
  PN.$ = function (id) { return document.getElementById(id); };
  PN.el = function (tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  PN.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  PN.clone = function (o) { return o == null ? o : JSON.parse(JSON.stringify(o)); };
  PN.pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
  PN.fmtDate = function (ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return d.getFullYear() + '/' + PN.pad2(d.getMonth() + 1) + '/' + PN.pad2(d.getDate()) + ' ' + PN.pad2(d.getHours()) + ':' + PN.pad2(d.getMinutes());
  };
  PN.fmtPlay = function (ms) {
    var s = Math.floor((ms || 0) / 1000);
    return Math.floor(s / 3600) + ':' + PN.pad2(Math.floor(s / 60) % 60) + ':' + PN.pad2(s % 60);
  };
  PN.sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  /* 簡易イベントバス */
  var subs = {};
  PN.on = function (ev, fn) { (subs[ev] = subs[ev] || []).push(fn); };
  PN.emit = function (ev, a, b) {
    (subs[ev] || []).forEach(function (fn) { try { fn(a, b); } catch (e) { console.warn(e); } });
  };

  /* ログ（開発者モードの LOG に出る。error は画面にも知らせる） */
  PN.logs = [];
  PN.log = function (level, msg) {
    var rec = { t: Date.now(), level: level, msg: String(msg) };
    PN.logs.push(rec);
    if (PN.logs.length > 400) PN.logs.shift();
    if (level === 'error') console.warn('[PN] ' + rec.msg);
    PN.emit('log', rec);
  };
  window.addEventListener('error', function (e) { PN.log('error', (e.message || 'error') + ' @' + (e.lineno || '?')); });
  window.addEventListener('unhandledrejection', function (e) { PN.log('error', 'Promise: ' + (e.reason && e.reason.message || e.reason)); });
})();

/* ======== scenario.js ======== */
/* scenario.js — シナリオデータの読み込み・正規化・検証
 * ブラウザ（エンジン）と Node（build.js）の両方で使う。 */
(function (root) {
  'use strict';
  var S = {};
  S.COMMANDS = ['TEXT', 'BG', 'CHARACTER', 'HIDE_CHARACTER', 'BGM', 'SE', 'CHOICE', 'FLAG', 'IF', 'JUMP', 'WAIT', 'INFO',
    'EFFECT', 'TEXT_STYLE', 'ENDING', 'END', 'STATUS', 'LABEL', 'CALL', 'RETURN', 'REQUIRE'];
  S.ENDING_TYPES = ['NORMAL', 'BAD', 'GOOD', 'TRUE', 'SECRET'];
  S.EFFECTS = ['fadein', 'fadeout', 'blackout', 'flash', 'shake', 'noise', 'invert', 'garble', 'glitch'];
  S.TEXT_MODES = ['TYPEWRITER', 'INSTANT', 'FADE', 'LINE', 'CUSTOM'];

  function pick(o, keys) { for (var i = 0; i < keys.length; i++) if (o[keys[i]] !== undefined) return o[keys[i]]; }

  /* 書き方のゆれ（value など）を、エンジンが読む形にそろえる */
  S.normalizeCommand = function (c) {
    if (!c || typeof c !== 'object') return c;
    var t = c.type = String(c.type || '').toUpperCase();
    if (t === 'BG' || t === 'SE' || t === 'INFO' || t === 'BGM') { if (c.id === undefined && c.value !== undefined) c.id = c.value; }
    if (t === 'CHARACTER') {
      if (c.id === undefined) c.id = pick(c, ['value', 'name']);
      if (c.expr === undefined) c.expr = pick(c, ['expression', 'face']) || 'normal';
      if (c.pos === undefined) c.pos = c.position || 'center';
    }
    if (t === 'HIDE_CHARACTER' && c.id === undefined) c.id = pick(c, ['value', 'name']) || 'all';
    if (t === 'WAIT' && c.ms === undefined) c.ms = +pick(c, ['value', 'time']) || 0;
    if (t === 'JUMP' && c.to === undefined) c.to = pick(c, ['next', 'value', 'scene']);
    if (t === 'CALL' && c.to === undefined) c.to = pick(c, ['next', 'value', 'scene']);
    if (t === 'IF') { if (c.then === undefined && c.jump !== undefined) c.then = c.jump; if (c.cond === undefined) c.cond = pick(c, ['condition', 'if']); }
    if (t === 'FLAG') { if (!c.set && !c.add && c.name !== undefined) { c.set = {}; c.set[c.name] = c.value === undefined ? true : c.value; } }
    if (t === 'EFFECT' && c.name === undefined) c.name = c.value;
    if (t === 'TEXT_STYLE' && c.mode === undefined && c.value !== undefined) c.mode = c.value;
    if (t === 'TEXT_STYLE' && c.mode) c.mode = String(c.mode).toUpperCase();
    if (t === 'ENDING' && c.id === undefined && c.value !== undefined) c.id = c.value;
    if (t === 'LABEL' && c.name === undefined) c.name = c.value;
    if (t === 'CHOICE') (c.options || []).forEach(function (o) { if (o.set && !o.setFlag) o.setFlag = o.set; if (o.add && !o.addFlag) o.addFlag = o.add; });
    return c;
  };

  /* game = { config, scenario, characters, endings, backgrounds, info, audio } をそろえる */
  S.normalize = function (game) {
    game.config = game.config || {};
    var sc = game.scenario = game.scenario || {};
    sc.scenes = sc.scenes || {};
    game.config.gameId = game.config.gameId || sc.gameId || 'pc98_game';
    game.config.title = game.config.title || sc.title || 'NO TITLE';
    game.config.version = game.config.version || sc.version || '1';
    sc.start = sc.start || game.config.start;
    game.characters = game.characters || {};
    game.backgrounds = game.backgrounds || {};
    game.info = game.info || {};
    game.audio = game.audio || {};
    game.audio.bgm = game.audio.bgm || {};
    game.audio.se = game.audio.se || {};
    game.audio.env = game.audio.env || {};
    var en = game.endings || [];
    if (!Array.isArray(en)) en = Object.keys(en).map(function (k) { var e = en[k]; e.id = e.id || k; return e; });
    en.forEach(function (e) { e.type = String(e.type || 'NORMAL').toUpperCase(); });
    game.endings = en;
    Object.keys(sc.scenes).forEach(function (id) {
      var s = sc.scenes[id];
      if (Array.isArray(s)) s = sc.scenes[id] = { commands: s };
      s.commands = (s.commands || []).map(S.normalizeCommand);
      s.labels = {};
      s.commands.forEach(function (c, i) { if (c && c.type === 'LABEL' && c.name) s.labels[c.name] = i; });
    });
    return game;
  };

  /* 移動先の書き方: "scene" / "scene#label" / "#label"（同じシーン内） */
  S.parseTarget = function (str, cur) {
    str = String(str == null ? '' : str);
    var i = str.indexOf('#');
    if (i < 0) return { scene: str, label: null };
    return { scene: i === 0 ? cur : str.slice(0, i), label: str.slice(i + 1) };
  };

  function condRefs(c, out) {
    if (c == null || typeof c === 'boolean') return;
    if (typeof c === 'string') {
      var s = c.replace(/^!/, '');
      var m = /^(info|ending|chose):(.+)$/.exec(s);
      if (m) out.push({ kind: m[1], id: m[2] }); else out.push({ kind: 'flag', id: s });
      return;
    }
    if (c.all) return c.all.forEach(function (x) { condRefs(x, out); });
    if (c.any) return c.any.forEach(function (x) { condRefs(x, out); });
    if (c.not !== undefined) return condRefs(c.not, out);
    if (c.flag !== undefined) out.push({ kind: 'flag', id: c.flag });

/* ======== save.js ======== */
/* save.js — セーブ・ロード（IndexedDB。ゲームIDごとにデータベースを分ける）

})();

/* ======== screens.js ======== */
/* screens.js — 画面（TITLE / MENU / SAVE / LOAD / CONFIG …）の管理と、共通のウィンドウ部品

  function items(s) { return Array.prototype.filter.call(s.el.querySelectorAll('[data-i]'), function (e) { return !e.disabled && !e.hasAttribute('data-off'); }); }

      /* 選べる項目を足す。fn は決定時、opt.adj(±1) は左右キー */
      item: function (parent, label, fn, opt) {
        opt = opt || {};

        b.setAttribute('data-i', '');
        if (opt.disabled) b.disabled = true;

        });

    var tt = PN.el('div', 'pn-win-title'); tt.appendChild(PN.el('span', '', '■ ' + (typeof def.title === 'function' ? def.title(s.args) : def.title)));
    if (!def.noEsc) { var x = PN.el('button', 'x', '×'); x.addEventListener('click', function (e) { e.stopPropagation(); SC.close(s); }); tt.appendChild(x); }
    win.appendChild(tt);

  E.playing = function () { return playing; };
  E.canSave = function () { return playing && !!waiter && (waiter.kind === 'text' || waiter.kind === 'choice'); };
  E.waiting = function () { return waiter ? waiter.kind : null; };
  E.currentChoice = function () { return waiter && waiter.kind === 'choice' ? waiter : null; };

  function scenes() { return PN.game.scenario.scenes; }
  function skipping(read) { return (E.ctrl || E.skip) && (read || PN.sys.config.skipUnread); }
  E.setAuto = function (on) { E.auto = !!on; if (on) E.skip = false; PN.emit('mode'); if (waiter && waiter.kick) waiter.kick(); };
  E.setSkip = function (on) { E.skip = !!on; if (on) E.auto = false; PN.emit('mode'); if (waiter && waiter.kick) waiter.kick(); };
  E.setCtrl = function (on) { if (E.ctrl === !!on) return; E.ctrl = !!on; if (waiter && waiter.kick) waiter.kick(); };

  /* 移動先へ入る（到達条件を確かめ、満たさなければ fallback へ） */
  function enter(str) {
    var S = PN.state, t = B.gate(PN.scenario.parseTarget(str, S.scene)), sc = scenes()[t.scene];
    if (!sc) { PN.log('error', '移動先のシーン "' + t.scene + '" がありません'); return false; }
    S.scene = t.scene;
    S.index = t.label ? (sc.labels[t.label] || 0) : 0;
    if (!t.label) needAuto = true;
    return true;
  }
  function loop(my) {
    var sync = 0;
    function next() {
      while (my === gen) {
        var S = PN.state, sc = scenes()[S.scene];
        if (S.index >= sc.commands.length) {
          if (S.stack.length) { var r = S.stack.pop(); S.scene = r.scene; S.index = r.index; continue; }
          PN.log('warn', 'シーン "' + S.scene + '" の終わりに着きました（END 扱い）');
          return E.toTitle();
        }
        var cmd = sc.commands[S.index], h = H[cmd.type], res;
        R.devLabel();
        if (!h) PN.log('error', S.scene + ' [' + (S.index + 1) + ']: 命令 "' + cmd.type + '" は実行できません');
        else {
          try { res = h(cmd); } catch (e) { PN.log('error', S.scene + ' [' + (S.index + 1) + '] ' + cmd.type + ': ' + e.message); res = undefined; }
        }
        if (res && typeof res.then === 'function') {
          sync = 0;
          res.then(function (v) { if (my === gen && after(v)) next(); }, function (e) { PN.log('error', cmd.type + ': ' + (e && e.message)); if (my === gen && after()) next(); });
          return;
        }
        if (++sync > 20000) { PN.log('error', '命令が止まらずに回り続けています（JUMP の循環？）: ' + S.scene); return E.toTitle(); }
        if (!after(res)) return;
      }
    }
    function after(res) {
      var S = PN.state;
      if (res === 'stop') return false;
      if (res && res.ret) {
        if (S.stack.length) { var r = S.stack.pop(); S.scene = r.scene; S.index = r.index; }
        else { PN.log('warn', 'RETURN: 戻り先がありません'); S.index++; }
      } else if (res && res.jump !== undefined) { if (!enter(res.jump)) S.index++; }
      else S.index++;
      return true;
    }
    next();
  }
  function cancel() {
    if (waiter && waiter.cancel) waiter.cancel();
    waiter = null;
    if (PN.text) PN.text.clear();
    R.hideChoices(); R.showNext(false);
    E.auto = false; E.skip = false; PN.emit('mode');
  }
  function begin() {
    playing = true; PN.playClock.start();
    R.showMessage(true);
    gen++; loop(gen);
  }

  /* ---------- 開始・ロード・タイトル ---------- */
  E.startNew = function () {
    PN.screens.closeAll(); cancel();
    PN.state = PN.newState();
    R.reset(); R.setName('');
    PN.audio.stopAll(600);
    var st = PN.state.scene; PN.state.scene = null;
    enter(st);
    PN.log('info', 'ゲーム開始: ' + PN.state.scene);
    begin();
  };
  E.loadData = function (d) {
    var err = PN.checkSave(d);
    if (err) { PN.screens.message('このデータは読み込めません。\n' + err, { err: true }); return false; }
    PN.screens.closeAll(); cancel();
    PN.playClock.stop();
    PN.state = PN.stateFromSave(d);
    R.restore();
    PN.audio.bgm(PN.state.view.bgm, 400); PN.audio.env(PN.state.view.env, 400);
    needAuto = false;
    PN.log('info', 'ロード: ' + PN.state.scene + ' [' + (PN.state.index + 1) + ']');
    begin();
    return true;
  };
  E.toTitle = function () {
    gen++; cancel();
    if (playing) PN.playClock.stop();
    playing = false;
    PN.state = null;
    PN.screens.closeAll();
    R.reset(); R.showMessage(false);
    var g = PN.game.config;
    R.drawBg(g.titleBg || null);
    PN.audio.env(null, 500); PN.audio.bgm(g.titleBgm || null, 800);
    PN.screens.open('title');
  };
  E.quickSave = function () {
    if (!E.canSave()) { R.notice('今はセーブできません'); return Promise.resolve(false); }
    return PN.save.write('quick').then(function () { PN.audio.se('save'); R.notice('クイックセーブしました'); return true; })
      .catch(function (e) { R.notice('セーブに失敗しました', true); PN.log('error', 'Q.SAVE: ' + (e && e.message)); return false; });
  };
  E.quickLoad = function () {
    return PN.save.read('quick').then(function (d) {
      if (!d) { R.notice('クイックセーブがありません'); return false; }
      return PN.screens.confirm('クイックセーブをロードしますか？').then(function (ok) { return ok ? E.loadData(d) : false; });
    });
  };
  function autosave() { needAuto = false; PN.save.write('auto').catch(function (e) { PN.log('warn', 'オートセーブ失敗: ' + (e && e.message)); }); }

  /* ---------- 入力から呼ばれる ---------- */
  E.advance = function () { if (playing && !PN.screens.isOpen() && waiter && waiter.advance) waiter.advance(); };
  /* 開発者モード用 */
  E.jumpTo = function (target) {
    PN.screens.closeAll();
    if (!PN.state) { PN.state = PN.newState(); R.reset(); }
    cancel();
    PN.state.stack = [];
    var t = PN.scenario.parseTarget(target, PN.state.scene), sc = scenes()[t.scene];
    if (!sc) return;
    PN.state.scene = t.scene; PN.state.index = t.label ? (sc.labels[t.label] || 0) : 0;
    PN.log('info', '開発者: ' + target + ' へ移動');
    if (!playing) begin(); else { gen++; loop(gen); }
  };
  E.forceChoice = function (i) { var w = E.currentChoice(); if (w) { PN.screens.closeAll(); w.pick(i); } };
  E.forceEnding = function (id) { PN.screens.closeAll(); if (!PN.state) PN.state = PN.newState(); cancel(); gen++; reachEnding(PN.ending.def(id)); };

  function speaker(sp) {
    if (!sp) return { name: '', color: '' };
    var c = PN.game.characters[sp];
    return c ? { name: c.name || sp, color: c.color || '' } : { name: sp, color: '' };
  }
  function fill(text) { return String(text).replace(/\{\{([\w.-]+)\}\}/g, function (m, k) { var v = PN.state.flags[k]; return v === undefined ? '' : v; }); }
  function reachEnding(d) {
    if (waiter && waiter.cancel) waiter.cancel();
    waiter = null;
    var first = !PN.sys.endings[d.id];
    PN.ending.record(d.id);
    if (playing) PN.playClock.stop();
    playing = false;
    R.hideChoices(); R.showMessage(false);
    if (d.bgm !== undefined) PN.audio.bgm(d.bgm, 800);
    PN.audio.se('get');
    PN.screens.open('ending', { def: d, first: first }).then(function () { E.toTitle(); });
  }

  /* ---------- 命令 ---------- */
  E.init = function () {
    R = PN.render; B = PN.branch;

    E.register('TEXT', function (cmd) {
      return new Promise(function (resolve) {
        var S = PN.state, sp = speaker(cmd.speaker), text = fill(cmd.text);
        var key = S.scene + ':' + S.index, read = !!PN.sys.read[key], done = false, timer = 0;
        R.setName(sp.name, sp.color);
        PN.backlog.push(sp.name, text);
        if (needAuto) autosave();
        if (E.skip && !read && !PN.sys.config.skipUnread) { E.skip = false; PN.emit('mode'); R.notice('未読のためスキップを止めました'); }
        var o = PN.textOptions();
        if (cmd.fx) o.fx = cmd.fx;
        if (skipping(read)) o.mode = 'INSTANT';
        R.showNext(false);
        waiter = {
          kind: 'text',
          advance: function () { if (!done) PN.text.complete(); else finish(); },
          kick: function () {
            if (E.skip && !read && !PN.sys.config.skipUnread) { E.skip = false; PN.emit('mode'); R.notice('未読のためスキップできません'); return; }
            if (!done && skipping(read)) PN.text.complete(); else if (done) schedule();
          },
          cancel: function () { clearTimeout(timer); }
        };
        PN.text.show(text, o, function () {
          done = true;
          if (!read) { PN.sys.read[key] = 1; PN.save.saveRead(); }
          R.showNext(true); schedule();
        });
        function schedule() {
          clearTimeout(timer);
          if (skipping(read)) timer = setTimeout(finish, 45);
          else if (E.auto) timer = setTimeout(finish, PN.sys.config.autoMs + text.length * 25);
        }
        function finish() {
          clearTimeout(timer);
          if (PN.screens.isOpen()) { timer = setTimeout(finish, 300); return; }
          waiter = null; R.showNext(false);
          resolve();
        }
      });
    });

    E.register('CHOICE', function (cmd) {
      return new Promise(function (resolve) {
        var S = PN.state, pos = { scene: S.scene, index: S.index };
        function chosen(k) { return S.history.some(function (h) { return h.scene === pos.scene && h.index === pos.index && h.opt === k; }); }
        var list = [];
        cmd.options.forEach(function (o, k) {
          if (o.if !== undefined && !B.test(o.if)) return;
          if (o.once && chosen(k)) return;
          list.push({ text: fill(o.text), index: k });
        });
        if (!list.length) {   /* すべて隠れた: 進行不能にしないため、そのまま次へ */
          PN.log('warn', S.scene + ' [' + (S.index + 1) + ']: 出せる選択肢がないので次へ進みます');
          return resolve();
        }
        if (E.skip) { E.skip = false; PN.emit('mode'); }
        autosave();
        waiter = { kind: 'choice', cmd: cmd, pick: pick, advance: null };
        R.showChoices(list, cmd.prompt ? fill(cmd.prompt) : '', pick);
        function pick(k) {
          var o = cmd.options[k];
          if (!o) return;
          R.hideChoices(); waiter = null;
          PN.audio.se('select');
          B.setFlags(o.setFlag, o.addFlag);
          [].concat(o.info || []).forEach(function (id) { PN.information.get(id); });
          S.history.push({ scene: pos.scene, index: pos.index, id: cmd.id || null, opt: k, optId: o.id || null, text: o.text, correct: o.correct === undefined ? null : !!o.correct, at: PN.playClock.now() });
          PN.backlog.push('', fill(o.text), 'choice');
          resolve(o.next !== undefined ? { jump: o.next } : undefined);
        }
      });
    });

    E.register('STATUS', function (cmd) {
      var st = cmd.clear ? {} : PN.state.view.status;
      ['date', 'place', 'chapter'].forEach(function (k) { if (cmd[k] !== undefined) st[k] = cmd[k]; });
      PN.state.view.status = st; R.setStatus(st);
    });
    E.register('BG', function (cmd) {
      var ms = cmd.fade || 0;
      if (!ms || skipping(true) || PN.state.view.fx.black) { R.setBg(cmd.id); return; }
      return PN.fx.run('fadeout', { ms: ms / 2 }).then(function () { R.setBg(cmd.id); return PN.fx.run('fadein', { ms: ms / 2 }); });
    });
    E.register('CHARACTER', function (cmd) {
      var v = PN.state.view;
      v.chars[cmd.id] = { expr: cmd.expr, pos: cmd.pos };
      if (v.order.indexOf(cmd.id) < 0) v.order.push(cmd.id);
      R.showChar(cmd.id, cmd.expr, cmd.pos);
    });
    E.register('HIDE_CHARACTER', function (cmd) {
      var v = PN.state.view;
      if (cmd.id === 'all') { v.chars = {}; v.order = []; }
      else { delete v.chars[cmd.id]; v.order = v.order.filter(function (x) { return x !== cmd.id; }); }
      R.hideChar(cmd.id);
    });
    E.register('BGM', function (cmd) {
      var id = (cmd.stop || !cmd.id || cmd.id === 'stop') ? null : cmd.id;
      if (cmd.channel === 'env') { PN.state.view.env = id; PN.audio.env(id, cmd.fade); }
      else { PN.state.view.bgm = id; PN.audio.bgm(id, cmd.fade); }
    });
    E.register('SE', function (cmd) { if (!skipping(true)) PN.audio.se(cmd.id); });
    E.register('FLAG', function (cmd) { B.setFlags(cmd.set, cmd.add); });
    E.register('IF', function (cmd) {
      var ok = B.test(cmd.cond);
      if (ok && cmd.then !== undefined) return { jump: cmd.then };
      if (!ok && cmd.else !== undefined) return { jump: cmd.else };
    });
    E.register('JUMP', function (cmd) { return { jump: cmd.to }; });
    E.register('CALL', function (cmd) { PN.state.stack.push({ scene: PN.state.scene, index: PN.state.index + 1 }); return { jump: cmd.to }; });
    E.register('RETURN', function () { return { ret: true }; });
    E.register('LABEL', function () {});
    E.register('WAIT', function (cmd) {
      if (skipping(true) || !(cmd.ms > 0)) return;
      return new Promise(function (resolve) {
        var timer = setTimeout(fin, cmd.ms);
        function fin() { clearTimeout(timer); if (waiter && waiter.kind === 'wait') waiter = null; resolve(); }
        waiter = { kind: 'wait', advance: cmd.skippable === false ? null : fin, kick: function () { if (skipping(true)) fin(); }, cancel: function () { clearTimeout(timer); } };
      });
    });
    E.register('INFO', function (cmd) { PN.information.get(cmd.id, cmd.silent); });
    E.register('EFFECT', function (cmd) {
      var p = PN.fx.run(cmd.name, cmd);
      if (cmd.wait === false || skipping(true)) return;
      return p;
    });
    E.register('TEXT_STYLE', function (cmd) {
      var st = {}, n = 0;
      if (cmd.mode && cmd.mode !== 'RESET') { st.mode = cmd.mode; n++; }
      if (cmd.speed !== undefined) { st.charMs = +cmd.speed; n++; }
      ['charMs', 'punctMs', 'lineMs', 'fadeMs', 'lineModeMs'].forEach(function (k) { if (cmd[k] !== undefined) { st[k] = +cmd[k]; n++; } });
      PN.state.view.style = (cmd.mode === 'RESET' || !n) ? null : st;   /* RESET でユーザー設定へ戻る */
    });
    /* STORY難易度の補完: need を満たしていなければ、情報・フラグを補い、必要なら補完シーンを挟む */
    E.register('REQUIRE', function (cmd) {
      if (B.test(cmd.need)) return;
      PN.log('info', 'REQUIRE: 条件未達のため補完します（' + PN.state.scene + '）');
      B.setFlags(cmd.setFlag);
      var grant = [].concat(cmd.grant || []);
      if (cmd.call) {   /* 補完シーンを挟んでから戻る。情報はここで渡しておく（お知らせは出さない） */
        PN.state.stack.push({ scene: PN.state.scene, index: PN.state.index + 1 });
        grant.forEach(function (id) { PN.information.get(id, true); });
        return { jump: cmd.call };
      }
      grant.forEach(function (id) { PN.information.get(id, cmd.silent); });
    });
    E.register('ENDING', function (cmd) {
      var S = PN.state, d = null;
      if (cmd.id) d = PN.ending.def(cmd.id);
      else if (S.flags.__ending) d = PN.ending.def(S.flags.__ending);
      else {
        d = PN.ending.judge();
        if (d && d.scene) { S.flags.__ending = d.id; return { jump: d.scene }; }   /* 結末ごとのシーンを挟む */
      }
      if (!d) { PN.log('error', 'ENDING: 該当するエンディングがありません'); E.toTitle(); return 'stop'; }
      reachEnding(d);
      return 'stop';
    });
    E.register('END', function () { E.toTitle(); return 'stop'; });
  };
})();

/* ======== dev.js ======== */
/* dev.js — 開発者モード（シーン一覧・移動、フラグ変更、選択肢の強制実行、エンディング条件、ログ） */
(function () {
  'use strict';
  var TABS = [['scene', 'SCENE'], ['flag', 'FLAG'], ['choice', 'CHOICE'], ['ending', 'ENDING'], ['log', 'LOG']];
  function row(parent, text, cls) { var r = PN.el('div', 'pn-dev-row' + (cls ? ' ' + cls : '')); r.appendChild(PN.el('span', 'k', text)); parent.appendChild(r); return r; }
  function btn(r, label, fn) { var b = PN.el('button', '', label); b.addEventListener('click', function (e) { e.stopPropagation(); fn(); }); r.appendChild(b); return b; }
  function parseVal(s) { s = s.trim(); if (s === 'true') return true; if (s === 'false') return false; if (s !== '' && !isNaN(+s)) return +s; return s.replace(/^"|"$/g, ''); }

  var VIEW = {
    scene: function (c, box) {
      var S = PN.state;
      row(box, '現在: ' + (S ? S.scene + ' [' + (S.index + 1) + ']' + (S.stack.length ? '　（CALL 中: ' + S.stack.length + '）' : '') : '（タイトル）'));
      Object.keys(PN.game.scenario.scenes).forEach(function (id) {
        var s = PN.game.scenario.scenes[id];
        var r = row(box, id + '　（' + s.commands.length + '）' + (s.require !== undefined ? '　条件あり' : ''), S && S.scene === id ? 'warn' : '');
        btn(r, '移動', function () { PN.engine.jumpTo(id); });
      });
    },
    flag: function (c, box) {
      if (!PN.state) return row(box, 'ゲーム中だけ変更できます。');
      var f = PN.state.flags, names = {};
      (PN.knownFlags || []).concat(Object.keys(f)).forEach(function (k) { names[k] = 1; });
      Object.keys(names).sort().forEach(function (k) {
        var v = f[k], r = row(box, k);
        r.appendChild(PN.el('span', 'v', v === undefined ? '—' : JSON.stringify(v)));
        if (typeof v === 'number') { btn(r, '−', function () { f[k] = v - 1; c.refresh(); }); btn(r, '＋', function () { f[k] = v + 1; c.refresh(); }); }
        else btn(r, v ? 'OFF' : 'ON', function () { f[k] = !v; c.refresh(); });
        btn(r, '消', function () { delete f[k]; c.refresh(); });
      });
      var r2 = row(box, '');
      var inp = document.createElement('input'); inp.placeholder = '名前=値（例: trust=2）';
      inp.addEventListener('click', function (e) { e.stopPropagation(); });
      r2.replaceChild(inp, r2.firstChild);
      btn(r2, '設定', function () {
        var m = /^\s*([\w.-]+)\s*=\s*(.*)$/.exec(inp.value);
        if (!m) return PN.render.notice('名前=値 の形で書いてください', true);
        f[m[1]] = parseVal(m[2]); c.refresh();
      });
      row(box, '入手情報: ' + (PN.state.info.join(', ') || 'なし'));
      Object.keys(PN.game.info).forEach(function (id) {
        if (PN.state.info.indexOf(id) >= 0) return;
        var r = row(box, '情報 ' + id + '（未入手）'); btn(r, '入手', function () { PN.information.get(id, true); c.refresh(); });
      });
    },
    choice: function (c, box) {
      var w = PN.engine.currentChoice();
      if (!w) row(box, '今は選択肢の場面ではありません。');
      else w.cmd.options.forEach(function (o, k) {
        var hidden = o.if !== undefined && !PN.branch.test(o.if);
        var r = row(box, (k + 1) + '. ' + o.text + (o.next !== undefined ? '　→ ' + o.next : '') + (hidden ? '\n   （条件未達で非表示）\n' + PN.branch.explain(o.if, 2) : ''), hidden ? 'warn' : '');
        btn(r, '実行', function () { PN.engine.forceChoice(k); });
      });
      if (PN.state) {
        row(box, '— 選択履歴 —');
        PN.state.history.forEach(function (h) { row(box, h.scene + ' [' + (h.index + 1) + '] ' + (h.id ? h.id + '.' + (h.optId || h.opt + 1) + ' ' : '') + '「' + h.text + '」' + (h.correct === null ? '' : h.correct ? '　正' : '　誤')); });
      }
    },
    ending: function (c, box) {
      if (PN.state) { var j = PN.ending.judge(); row(box, '今 ENDING（自動判定）に着くと: ' + (j ? j.id + '「' + j.name + '」' : 'なし')); }
      PN.game.endings.forEach(function (d) {
        var r = row(box, '[' + d.type + '] ' + d.id + '「' + d.name + '」' + (PN.sys.endings[d.id] ? '　到達済' : '') + (PN.state ? '\n' + PN.branch.explain(d.cond, 1) : ''));
        btn(r, '到達', function () { PN.engine.forceEnding(d.id); });
      });
      var r2 = row(box, 'エンディングの到達記録を消す');
      btn(r2, '消去', function () { PN.sys.endings = {}; PN.save.saveEndings(); c.refresh(); });
    },
    log: function (c, box) {
      if (!PN.logs.length) row(box, 'ログはありません。');
      PN.logs.slice().reverse().forEach(function (l) {
        var d = new Date(l.t);
        row(box, PN.pad2(d.getHours()) + ':' + PN.pad2(d.getMinutes()) + ':' + PN.pad2(d.getSeconds()) + ' [' + l.level + '] ' + l.msg, l.level === 'error' ? 'err' : l.level === 'warn' ? 'warn' : '');
      });
    }
  };
  PN.screens.define('dev', {
    title: 'DEVELOPER', full: true,
    build: function (c) {
      var cur = c.args.tab || 'scene', tabs = PN.el('div', 'pn-tabs');
      TABS.forEach(function (t) {
        var b = PN.el('button', t[0] === cur ? 'on' : '', t[1]);
        b.addEventListener('click', function (e) { e.stopPropagation(); c.args.tab = t[0]; c.refresh(false); });
        tabs.appendChild(b);
      });
      c.body.appendChild(tabs);
      VIEW[cur](c, c.body);
      c.foot.appendChild(PN.el('span', '', '←→ タブ / ↑↓ スクロール / Esc 戻る'));
    },
    onKey: function (k, c) {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return k !== 'esc';
      if (k === 'left' || k === 'right') {
        var i = TABS.map(function (t) { return t[0]; }).indexOf(c.args.tab || 'scene');
        c.args.tab = TABS[(i + (k === 'left' ? -1 : 1) + TABS.length) % TABS.length][0]; c.refresh(false); return true;
      }
      if (k === 'up' || k === 'down') { c.body.scrollTop += (k === 'up' ? -1 : 1) * 60; return true; }
      return false;
    }
  });
  /* エラーは、開発者モードのとき画面にも出す */
  PN.on('log', function (rec) { if (rec.level === 'error' && PN.sys.config.dev && PN.render.notice) PN.render.notice('ERROR: ' + rec.msg.slice(0, 40), true); });
})();

/* ======== input.js ======== */
/* input.js — マウス・キーボード・タッチの入力
 *  左クリック/タップ: 文章送り・決定 ／ 右クリック: メニュー ／ Enter: 決定・文章送り ／ Space: 文章送り
 *  ↑↓: 選択 ／ Esc: メニュー・キャンセル ／ Ctrl: 押している間スキップ ／ Tab: 情報画面 ／ ホイール上・PageUp: バックログ */
(function () {
  'use strict';
  var IN = PN.input = {};
  var KEYS = { Enter: 'enter', ' ': 'space', Spacebar: 'space', ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Escape: 'esc', Tab: 'tab', Control: 'ctrl', PageUp: 'pageup' };

  IN.init = function () {
    var stage = PN.$('pn-stage'), E = PN.engine, SC = PN.screens, R = PN.render;
    stage.setAttribute('role', 'button');   /* 連続タップの文章送りを、拡大防止の処理に止めさせない */
    stage.addEventListener('click', function (e) {
      PN.audio.unlock();
      if (SC.isOpen() || e.target.closest('button')) return;
      E.advance();
    });
    document.addEventListener('pointerdown', function () { PN.audio.unlock(); }, true);
    stage.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      PN.audio.unlock();
      if (SC.isOpen()) SC.key('esc'); else if (E.playing()) IN.menu();
    });
    document.addEventListener('keydown', function (e) {
      var k = KEYS[e.key];
      if (!k) return;
      var inField = e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
      if (inField && k !== 'esc') return;
      PN.audio.unlock();
      if (k === 'ctrl') { E.setCtrl(true); return; }
      e.preventDefault();
      if (SC.isOpen()) {
        if (k === 'tab') { if (SC.topName() === 'information') SC.close(); return; }
        if (k === 'pageup') { if (SC.topName() === 'backlog') SC.key('up'); return; }
        if (e.repeat && (k === 'enter' || k === 'space' || k === 'esc')) return;
        SC.key(k === 'space' ? 'enter' : k);
        return;
      }
      if (!E.playing()) return;
      if (R.choiceOpen()) {
        if (k === 'up') R.choiceMove(-1); else if (k === 'down') R.choiceMove(1);
        else if ((k === 'enter' || k === 'space') && !e.repeat) R.choiceDecide();
        else if (k === 'esc') IN.menu(); else if (k === 'tab') SC.open('information'); else if (k === 'pageup') SC.open('backlog');
        return;
      }
      if (k === 'enter' || k === 'space') { if (!e.repeat) E.advance(); }
      else if (k === 'esc') IN.menu();
      else if (k === 'tab') SC.open('information');
      else if (k === 'pageup' || k === 'up') SC.open('backlog');
    });
    document.addEventListener('keyup', function (e) { if (e.key === 'Control') E.setCtrl(false); });
    window.addEventListener('blur', function () { E.setCtrl(false); });
    stage.addEventListener('wheel', function (e) {
      if (SC.isOpen() || !E.playing()) return;
      if (e.deltaY < 0) SC.open('backlog');
    }, { passive: true });
  };
  IN.menu = function () { PN.audio.se('click'); PN.screens.open('menu'); };

  /* 本文欄の下の操作ボタン列 */
  IN.buildFkeys = function () {
    var box = PN.$('pn-fkeys'), E = PN.engine, SC = PN.screens, btns = {};
    box.textContent = '';
    function add(id, label, fn, cls) {
      var b = PN.el('button', cls || '', label);
      b.setAttribute('data-fkey', id);
      b.addEventListener('click', function (e) { e.stopPropagation(); PN.audio.unlock(); if (!SC.isOpen() && E.playing()) { PN.audio.se('click'); fn(); } });
      box.appendChild(b); btns[id] = b;
    }
    add('auto', 'AUTO', function () { E.setAuto(!E.auto); });
    add('skip', 'SKIP', function () { E.setSkip(!E.skip); });
    add('log', 'LOG', function () { SC.open('backlog'); });
    add('info', 'INFO', function () { SC.open('information'); });
    add('qsave', 'Q.SAVE', function () { E.quickSave(); });
    add('qload', 'Q.LOAD', function () { E.quickLoad(); });
    add('menu', 'MENU', function () { SC.open('menu'); });
    if (PN.sys.config.dev) add('dev', 'DEV', function () { SC.open('dev'); }, 'dev');
    function paint() { btns.auto.classList.toggle('on', E.auto); btns.skip.classList.toggle('on', E.skip); }
    IN._paint = paint; paint();
  };
  PN.on('mode', function () { if (IN._paint) IN._paint(); });
  PN.on('dev', function () { IN.buildFkeys(); PN.render.devLabel(); });
})();

/* ======== main.js ======== */
/* main.js — 起動。埋め込まれたゲームデータ（JSON）を読み、検証してからタイトルを出す */
(function () {
  'use strict';
  function fatal(title, lines) {
    var d = PN.el('div', 'pn-fatal');
    d.appendChild(PN.el('h2', '', '■ ' + title));
    d.appendChild(document.createTextNode(lines.join('\n')));
    PN.$('pn-stage').appendChild(d);
    PN.fatal = { title: title, lines: lines };
  }
  function boot() {
    PN.render.init();
    var game, raw = PN.$('pn-data').textContent;
    try { game = JSON.parse(raw); }
    catch (e) { return fatal('シナリオデータ（JSON）を読めません', ['JSON の書き方に誤りがあります。', e.message]); }
    var v;
    try {
      PN.engine.init();
      PN.scenario.normalize(game);
      v = PN.scenario.validate(game, PN.engine.commandNames());
    } catch (e) { return fatal('シナリオデータを検証できません', [e.message]); }
    if (v.errors.length) return fatal('シナリオデータに誤りがあります（' + v.errors.length + '件）', v.errors);
    v.warnings.forEach(function (w) { PN.log('warn', w); });
    PN.game = game; PN.knownFlags = v.flags;
    document.title = game.config.title;
    PN.text = new PN.TextDisplay(PN.$('pn-text'));
    PN.sys.config = Object.assign({}, PN.CONFIG_DEFAULT, game.config.text || {});
    PN.save.init().then(PN.save.loadSys).catch(function (e) { PN.log('error', '保存領域の初期化: ' + (e && e.message)); }).then(function () {
      PN.audio.applyVolume();
      PN.input.buildFkeys();
      PN.input.init();
      PN.engine.toTitle();
      PN.ready = true;
      PN.emit('ready');
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
